<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>WordSplit</title>
<style>
:root{--bg:#0e0e16;--panel:#171725;--line:#2a2a3d;--text:#e8e8f0;--dim:#8a8aa3;--accent:#8b7cf6;--ok:#34d399;--bad:#f87171;--ipa:"Segoe UI","Lucida Sans Unicode","Arial Unicode MS","Charis SIL","Doulos SIL",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
body{display:flex;flex-direction:column;min-height:100vh}
button,select,input{font:inherit;color:inherit}
a{color:var(--dim)}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;white-space:nowrap}
.logo i{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#8b7cf6,#38bdf8);display:inline-block}
.tabs{display:flex;gap:6px;margin:0 auto;background:var(--panel);padding:4px;border-radius:12px}
.tab{border:1px solid transparent;background:none;padding:6px 14px;border-radius:9px;cursor:pointer;color:var(--dim);white-space:nowrap}
.tab b{font-weight:400;opacity:.6;margin-right:6px;font-size:12px}
.tab.on{color:var(--text);border-color:#5b50b8;background:#211f38}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,.btn{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px 10px;cursor:pointer}
select option{background:var(--panel)}
.btn:hover,select:hover{border-color:#4a4a66}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:safe center;padding:20px;gap:20px;user-select:none;overflow-y:auto}
footer{display:flex;align-items:center;justify-content:center;gap:18px;padding:14px;color:var(--dim);font-size:13px;flex-wrap:wrap}
footer .nav{background:none;border:none;color:var(--dim);cursor:pointer;font-size:18px;padding:2px 10px}
footer .nav:hover{color:var(--text)}
footer .count{color:var(--text);font-variant-numeric:tabular-nums}
/* 单词行 */
.wordrow{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;column-gap:.45em;row-gap:.35em;font-weight:700;line-height:1.15;max-width:100%}
.wgroup{display:inline-flex;align-items:flex-end;white-space:nowrap}
/* 认读模式：音节 > 字母组合（下面标音标） */
.syl,.sep{display:inline-flex;flex-direction:column;align-items:stretch}
.syl{cursor:pointer;transition:transform .15s}
.chunks{display:flex;justify-content:center;gap:.07em}
.ck{display:flex;flex-direction:column;align-items:center;min-width:.3em}
.ck .cl{color:var(--c);transition:text-shadow .15s}
.ck .cp{font-family:var(--ipa);font-size:.25em;font-weight:500;color:var(--c);opacity:.9;margin-top:.15em;white-space:nowrap;min-height:1.3em}
.ck.silent .cl{opacity:.32}
.ck.silent .cp{opacity:.45}
.sep .st{color:#50506a;font-weight:300;padding:0 .14em;font-size:.55em;align-self:center;margin-bottom:1.1em}
.sl{height:2px;background:#5d5d7a;margin-top:.12em;position:relative}
.syl .sl::before{content:"";position:absolute;left:0;bottom:0;width:2px;height:10px;background:#5d5d7a}
.wgroup .syl:last-child .sl::after{content:"";position:absolute;right:0;bottom:0;width:2px;height:10px;background:#5d5d7a}
.syl:hover{transform:translateY(-3px)}
.syl.speak{transform:scale(1.08)}
.syl.speak .cl{text-shadow:0 0 22px var(--c)}
.wordrow.speakall .cl{text-shadow:0 0 18px var(--c)}
.ipa{font-family:var(--ipa);font-size:clamp(18px,2.4vw,24px);color:#c9c9dc;letter-spacing:.02em}
/* 跟写 / 听写 */
.slot{display:inline-flex;flex-direction:column;align-items:stretch}
.slot .chars{display:flex;white-space:nowrap}
.ch{display:inline-block;width:.62em;text-align:center;position:relative}
.ch.hidden{color:transparent}
.ch.ghost{color:var(--c);opacity:.25}
.ch.done{color:var(--c)}
.ch.wrong{color:var(--bad)}
.ch.punct{color:var(--dim)}
.ch.cur::after{content:"";position:absolute;left:15%;right:15%;bottom:.04em;height:3px;border-radius:2px;background:#fff;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.slot .ul{height:4px;border-radius:2px;background:#33334a;margin-top:.14em;transition:background .2s}
.slot.active .ul{background:var(--accent)}
.slot.full .ul{background:var(--c);opacity:.55}
.tsep{color:#45455e;font-weight:300;font-size:.55em;margin:0 .18em .5em;align-self:flex-end}
.shake{animation:shake .3s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.wordrow.win{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.06)}}
.cn{font-size:clamp(22px,3.2vw,34px);font-weight:600;text-align:center}
.ctrls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
.round{width:40px;height:40px;border-radius:50%;border:1px solid #4a4a66;background:var(--panel);cursor:pointer;font-size:14px;flex:none}
.round.sm{width:30px;height:30px;font-size:11px}
.round:hover,.pill:hover{border-color:var(--accent)}
.pill{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px}
.pill.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.sub{font-size:13px;color:var(--dim);text-align:center}
.status{font-size:16px;min-height:24px;text-align:center}
.status.ok{color:var(--ok)}
.status.bad{color:var(--bad)}
.tapkb{border:1px dashed #4a4a66;border-radius:10px;padding:8px 14px;color:var(--dim);font-size:14px}
/* 例句 */
.sents{width:min(760px,100%);display:flex;flex-direction:column;gap:10px;user-select:text}
.sent{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.sent .en{font-size:17px;line-height:1.45}
.sent .en mark{background:none;color:#fbbf24;font-weight:700}
.sent .zh{font-size:14px;color:var(--dim);margin-top:2px}
/* 小结 */
.sum{text-align:center;max-width:720px}
.sum h2{font-size:30px;margin:0 0 10px}
.sum p{color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0}
.chip{background:var(--panel);border:1px solid #4b2a33;border-radius:8px;padding:5px 10px;font-size:15px}
.chip small{color:var(--dim);margin-left:6px}
.sumbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
/* 弹窗 */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
#modal.on{display:flex}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(760px,100%);max-height:85vh;overflow:auto}
.box h3{margin:0 0 14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row label{display:flex;gap:8px;align-items:center;cursor:pointer}
.wl{width:100%;border-collapse:collapse}
.wl td{padding:7px 6px;border-bottom:1px solid var(--line);font-size:15px;vertical-align:middle}
.wl td:first-child{color:var(--dim);width:36px}
.wl tr:hover td{background:#1d1d2e}
.wl .split{font-weight:700;font-size:18px;cursor:pointer;white-space:nowrap}
.wl .split .x{color:#50506a;font-weight:300;margin:0 2px}
.wl .split .d{opacity:.35}
.wl .pp{font-family:var(--ipa);color:var(--dim);font-size:14px;white-space:nowrap}
.wl button{font-size:12px;padding:3px 8px}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#2a2440;border:1px solid var(--accent);padding:8px 16px;border-radius:10px;display:none;z-index:20}
#kb{position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:0;border:0;padding:0;font-size:16px}
@media (max-width:640px){
  header{padding:10px;gap:8px}
  .tabs{order:3;margin:0;width:100%;justify-content:center}
  .tab{padding:6px 9px}
  .tools{width:100%;display:grid;grid-template-columns:1fr 1.4fr auto auto;gap:6px}
  .tools select,.tools .btn{min-width:0;font-size:14px;padding:6px}
  .sent .en{font-size:15px}
}
</style>
</head>
<body>
<header>
  <div class="logo"><i></i>WordSplit</div>
  <div class="tabs" id="tabs">
    <button class="tab" data-m="learn"><b>01</b>拆分认读</button>
    <button class="tab" data-m="follow"><b>02</b>跟写</button>
    <button class="tab" data-m="dictation"><b>03</b>听写</button>
  </div>
  <div class="tools">
    <select id="selBook"></select>
    <select id="selUnit"></select>
    <button class="btn" id="bList">单词表</button>
    <button class="btn" id="bSet">设置</button>
  </div>
</header>
<main id="stage"></main>
<footer>
  <span id="unitLabel"></span>
  <button class="nav" id="bPrev" title="上一个（←）">←</button>
  <span class="count" id="count"></span>
  <button class="nav" id="bNext" title="下一个（→）">→</button>
  <span id="keys"></span>
</footer>
<div id="modal"><div class="box" id="box"></div></div>
<div id="toast"></div>
<input id="kb" type="password" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false">

<script>
/* ================= 词表 =================
 * 由 tools/build.py 根据 tools/words.txt（拆分、音标、中文）和 TypeWords 官网词库（例句）生成。
 * 不要手改下面这段：要改拆分就改 words.txt 再运行 python tools/build.py，或者在页面「单词表」里改。
 */
/*DATA-BEGIN*/
const BOOK_DATA = [{"id":"3a","name":"三年级上册","units":[{"name":"Unit 1 Hello!","words":[{"l":"r.u/l.er","p":"ˈr.uː/l.ə","cn":"尺子","s":[["He cracked me on the head with a ruler.","他用尺子猛击我的头部。"],["The ruler cracked and splintered into pieces.","尺子裂了，碎成了片。"],["The former military ruler of Lesotho has been placed under house arrest.","莱索托前军事统治者已被软禁了。"]]},{"l":"p.e.n/c.i.l","p":"ˈp.e.n/s.ə.l","cn":"铅笔","s":[["I snapped the pencil in half.","我啪的一声将铅笔折成两段。"],["I'll get a pencil and paper.","我去拿铅笔和纸。"],["He made marks with a pencil.","他用铅笔作了记号。"]]},{"l":"e/r.a/s.er","p":"ɪ/ˈr.eɪ/z.ə","cn":"橡皮","s":[["I hide the eraser in her boot.","我把橡皮擦藏进了她的靴子里。"],["My eraser is missing.","我的橡皮不见了。"],["On the teacher's desk there's an eraser.","在老师的桌上有一块橡皮擦。"]]},{"l":"c.r.ay/o.n","p":"ˈk.r.eɪ/ə.n","cn":"蜡笔","s":[["Someone had scribbled all over the table in crayon.","不知谁用蜡笔胡写乱画，桌面上都涂满了。"],["He colored the picture with crayon.","他用蜡笔给画上色。"],["He coloured the picture with crayon.","他用蜡笔给画上色。"]]},{"l":"b.a.g","p":"b.æ.ɡ","cn":"包；书包","s":[["Someone's left their bag behind.","有人把包落下了。"],["She clutched her bag protectively.","她用力抓紧护着自己的提包。"],["Is this your bag, missus?","大姐，这是你的袋子吗？"]]},{"l":"p.e.n","p":"p.e.n","cn":"钢笔","s":[["This dratted pen won't work.","这该死的笔写不出字来。"],["Where's that goddamned pen?","那该死的笔哪去了？"],["Can I borrow a pen please?","我可以借支笔吗？"]]},{"l":"p.e.n/c.i.l b.o.x","p":"ˈp.e.n/s.ə.l b.ɒ.ks","cn":"铅笔盒","s":[["Put away your pencil box!","把你的铅笔盒收起来！"],["Please open your pencil box.","请打开你的文具盒。"],["Here's a pencil-box.","这是一个铅笔盒。"]]},{"l":"b.oo.k","p":"b.ʊ.k","cn":"书","s":[["Shoot! I've forgotten my book!","倒霉！我忘了带书！"],["I'm just finishing my book.","眼下我正在完成我的一本书。"],["That's cheating in my book.","依我看那是欺骗。"]]},{"l":"n.o","p":"n.əʊ","cn":"不；没有","s":[["She had no money coming in and no funds.","她既无固定收入也无存款。"],["Hygiene was nonexistent: no running water, no bathroom.","卫生根本不存在：没有自来水，没有浴室。"],["There was no fatherly affection, no display of sentiment.","没有像父爱般的亲昵，没有显得过于激动。"]]},{"l":"y.our","p":"j.ɔː","cn":"你的；你们的","s":[["Your first duty is to your family.","你首要的是对家庭尽责。"],["Do your parents mind your leaving home?","你父母舍得你离开家吗？"],["Your doctor will monitor your blood pressure.","你的医生会监测你的血压。"]]}]},{"name":"Unit 2 Colours","words":[{"l":"r.e.d","p":"r.e.d","cn":"红色","s":[["She was wearing red lipstick.","她涂着红色唇膏。"],["Red wine gives me a headache.","我喝红酒会头痛。"],["Jack's face turned bright red.","杰克的脸变得通红。"]]},{"l":"g.r.ee.n","p":"ɡ.r.iː.n","cn":"绿色","s":[["He wore green-tinted glasses.","他戴着染成绿色的眼镜。"],["His eyes were a vivid green.","他的眼睛碧绿。"],["She works for Bond & Green.","她在邦德—格林公司工作。"]]},{"l":"y.e.l/l.ow","p":"ˈj.e.l/-.əʊ","cn":"黄色","s":[["The walls were painted yellow.","墙壁漆成了黄色。"],["The wings are tipped with yellow.","翅膀的尖端呈黄色。"],["His eyeballs were an unhealthy yellow.","他的眼球是不健康的蜡黄色。"]]},{"l":"b.l.ue","p":"b.l.uː","cn":"蓝色","s":[["Blue suited her fair colouring.","蓝色适合于她白皙的肤色。"],["His eyes were piercingly blue.","他有一双敏锐的蓝眼睛。"],["The hall was carpeted in blue.","大厅铺上了蓝色的地毯。"]]},{"l":"b.l.a.ck","p":"b.l.æ.k","cn":"黑色","s":[["The exhaust streamed black smoke.","排气管里冒出黑烟。"],["Black is out this year.","今年黑色不时兴了。"],["Brown is the new black.","棕色取代了黑色变得时髦起来。"]]},{"l":"b.r.ow.n","p":"b.r.aʊ.n","cn":"棕色","s":[["He was wearing a brown uniform.","他穿着一件棕色制服。"],["He removed his brown slip-ons.","他脱掉了他的棕色无带鞋。"],["She had slanted brown eyes.","她有一双棕色的丹凤眼。"]]},{"l":"wh.i.t.e","p":"w.aɪ.t.-","cn":"白色","s":[["I swigged down two white wines.","我大口喝完两杯白葡萄酒。"],["Would you prefer red or white?","你喜欢喝红葡萄酒还是白葡萄酒？"],["He drove to the White House.","他开车去白宫。"]]},{"l":"o.r/a.n.g.e","p":"ˈɒ.r/ɪ.n.dʒ.-","cn":"橙色；橙子","s":[["I plucked an orange from the tree.","我从树上摘了一个橙子。"],["Orange is the big colour this year.","橘黄色是今年的流行色。"],["Would you care for some orange juice?","你想要些橙汁吗？"]]},{"l":"O/K","p":"ˌəʊ/ˈkeɪ","cn":"好的","s":[["Relax! Everything will be OK.","别着急！一切都会好的。"],["OK, you've made your point !","好了，你已经把话说清楚了。"],["Cameras ready? OK, shoot!","摄影机准备好了吗？好，开拍！"]]},{"l":"m.u.m","p":"m.ʌ.m","cn":"妈妈","s":[["Mum, my tummy hurts.","妈妈，我肚子痛。"],["Don't fuss, Mum, everything is all right.","别瞎操心了，妈妈，一切都好。"],["Mum! I feel sick.","妈妈！我觉得恶心。"]]}]},{"name":"Unit 3 Look at me!","words":[{"l":"f.a.c.e","p":"f.eɪ.s.-","cn":"脸","s":[["Her face registered disapproval.","她脸上流露出不赞同的神色。"],["Her eyes flicked from face to face.","她的眼光扫过人们的脸。"],["Toby's face puckered.","托比的脸皱了起来。"]]},{"l":"ear","p":"ɪə","cn":"耳朵","s":[["He tweaked Guy's ear roughly.","他粗暴地扯盖伊的耳朵。"],["He nibbled her ear playfully.","他开玩笑地轻咬着她的耳朵。"],["She tweaked his ear playfully.","她拧他的耳朵逗着玩儿。"]]},{"l":"eye","p":"aɪ","cn":"眼睛","s":[["The film has a painterly eye.","这部电影有种绘画的眼光。"],["His left eye squints a little.","他左眼有点斜视。"],["I have something in my eye.","我的眼睛里进了什么东西。"]]},{"l":"n.o.s.e","p":"n.əʊ.z.-","cn":"鼻子","s":[["I wrinkled my nose in disgust.","我厌恶地皱起鼻子。"],["Her nose was spurting blood.","她鼻子里汩汩冒着血。"],["She punched him on the nose.","她一拳打中了他的鼻子。"]]},{"l":"m.ou.th","p":"m.aʊ.θ","cn":"嘴","s":[["My mouth felt completely dry.","我感到口干舌燥。"],["I clapped a hand over her mouth.","我猛地用一只手捂住了她的嘴。"],["The news spread by word of mouth.","这消息是口头传开的。"]]},{"l":"ar.m","p":"ɑː.m","cn":"胳膊","s":[["He squeezed her arm reassuringly.","他安慰地捏了捏她的手臂。"],["His arm throbbed dully.","他的手臂微微地颤动。"],["Liz yanked at my arm.","利兹猛地拉了一下我的胳膊。"]]},{"l":"h.a.n.d","p":"h.æ.n.d","cn":"手","s":[["Her hand was shaking noticeably.","很明显她的手在颤抖。"],["His hand met hers.","他的手碰到她的手。"],["I saw them making their way, hand in hand, down the path.","我看到他们手拉手沿着小路朝前走。"]]},{"l":"h.ea.d","p":"h.e.d","cn":"头","s":[["Nancy shook her head, frowning.","南希摇摇头，皱着眉头。"],["His head throbbed painfully.","他的头一抽一跳地痛。"],["He shook his head tiredly.","他厌倦地摇了摇头。"]]},{"l":"b.o.d/y","p":"ˈb.ɒ.d/i","cn":"身体","s":[["They heaved the body overboard.","他们使劲把尸体从船上抛入水中。"],["His body was solid and taut.","他身体结实，肌肉发达。"],["Exercise tones up your body.","运动强健身体。"]]},{"l":"l.e.g","p":"l.e.ɡ","cn":"腿","s":[["His leg fractured in two places.","他的一条腿有两处骨折。"],["I broke my leg playing football.","我的腿踢足球时骨折了。"],["His leg was getting better.","他的腿在渐渐恢复。"]]},{"l":"f.oo.t","p":"f.ʊ.t","cn":"脚","s":[["He shifted from foot to foot.","他从一只脚换到另一只脚。"],["Sam stamped his foot in anger.","萨姆气得直跺脚。"],["She stamped her foot again.","她又跺了跺脚。"]]},{"l":"s.ch.oo.l","p":"s.k.uː.l","cn":"学校","s":[["Did you shine at school?","你在学校出类拔萃吗？"],["Conditions vary from school to school.","各所学校的情况不同。"],["He's at law school.","他在读法学院。"]]}]},{"name":"Unit 4 We love animals","words":[{"l":"d.u.ck","p":"d.ʌ.k","cn":"鸭子","s":[["The main course was roast duck.","主菜是烤鸭。"],["She chose a bench beside the duck pond and sat down.","她选了鸭池旁的一张长椅坐了下来。"],["The cat was now within striking distance of the duck.","此时，猫就在可攻击鸭子的距离内。"]]},{"l":"p.i.g","p":"p.ɪ.ɡ","cn":"猪","s":[["The pig rose squealing and bolted.","那头猪尖叫着站起来，飞快地跑开了。"],["Wild boar readily hybridizes with the domestic pig.","野猪很容易和家猪杂交。"],["\"A talking pig!\" he exclaimed. \"Well, I'll be darned.\"","“一头会说话的猪！”他惊叫到，“啊，我太惊奇了”。"]]},{"l":"c.a.t","p":"k.æ.t","cn":"猫","s":[["The cat sat licking its paws.","那只猫坐着舔爪子。"],["The cat loves being stroked.","这猫喜欢别人抚摩。"],["Our cat hates being handled.","我们的猫不喜欢被人摸弄。"]]},{"l":"b.ear","p":"b.eə","cn":"熊","s":[["He can't bear being laughed at.","他无法忍受遭人嘲笑。"],["He can't bear to be laughed at.","他无法忍受遭人嘲笑。"],["'Bear' and 'bare' are homophonous.","bear和 bare是同音异形词。"]]},{"l":"d.o.g","p":"d.ɒ.ɡ","cn":"狗","s":[["Does your dog bite?","你的狗咬人吗？"],["The dog has worms.","这条狗体内有寄生虫。"],["The dog has fleas.","这条狗有跳蚤。"]]},{"l":"e.l/e/ph.a.n.t","p":"ˈe.l/ɪ/f.ə.n.t","cn":"大象","s":[["The elephant flapped its ears.","大象拍打着双耳。"],["The African elephant is in a desperate plight.","非洲象正面临绝境。"],["The kids had a ride on an elephant at the zoo.","在动物园里，孩子们骑着大象走了一圈。"]]},{"l":"m.o.n/k.ey","p":"ˈm.ʌ.ŋ/k.i","cn":"猴子","s":[["You cheeky monkey!","你这厚脸皮的猴崽子！"],["The woolly spider monkey is the largest primate in the Americas.","绒毛蛛猴是美洲最大的灵长目动物。"],["He wears monkey clothes.","他穿着猴子服。"]]},{"l":"b.ir.d","p":"b.ɜː.d","cn":"鸟","s":[["The bird continued to warble.","鸟儿继续啁啾。"],["The bird gave a startled squawk.","鸟发出嘎嘎的惊叫声。"],["The bird ruffled up its feathers.","这只鸟竖起了羽毛。"]]},{"l":"t.i/g.er","p":"ˈt.aɪ/ɡ.ə","cn":"老虎","s":[["The tiger is native to India.","这种虎产于印度。"],["Which has spots, a leopard or a tiger?","有斑点的是豹还是虎？"],["Which has spots, the leopard or the tiger?","有斑点的是豹还是虎？"]]},{"l":"p.a.n/d.a","p":"ˈp.æ.n/d.ə","cn":"熊猫","s":[["The panda is a shy creature.","熊猫是一种胆小的动物。"],["Panda came back to the bench.","熊猫回到长椅上。"],["\"That's right,\" said the panda.","“没错。”熊猫说。"]]},{"l":"z.oo","p":"z.uː","cn":"动物园","s":[["He took his son Christopher to the zoo.","他带儿子克里斯托弗去了动物园。"],["I thought we might go to the zoo on Saturday.","我觉得周六我们可以去动物园。"],["The kids had a ride on an elephant at the zoo.","在动物园里，孩子们骑着大象走了一圈。"]]},{"l":"f.u.n/n.y","p":"ˈf.ʌ.n/-.i","cn":"滑稽的；好笑的","s":[["She found it hilariously funny.","她觉得这事儿滑稽极了。"],["'What's so funny ?' she demanded.","“什么事这么好笑？”她问道。"],["My funny drawings amused the kids.","我的滑稽图画把孩子们逗乐了。"]]}]},{"name":"Unit 5 Let's eat!","words":[{"l":"b.r.ea.d","p":"b.r.e.d","cn":"面包","s":[["The bread had a spongy texture.","那种面包很松软。"],["We stopped and bought some bread.","我们停下来买了一些面包。"],["I'm sorry, we've sold out of bread.","抱歉，我们的面包卖完了。"]]},{"l":"j.ui.c.e","p":"dʒ.uː.s.-","cn":"果汁","s":[["The juice contains no added sugar.","这种果汁没有加糖。"],["This juice contains no added sugar.","这种果汁没有加糖。"],["Would you care for some orange juice?","你想要些橙汁吗？"]]},{"l":"e.gg","p":"e.ɡ","cn":"蛋","s":[["She cracked an egg into the pan.","她往锅里打了一个鸡蛋。"],["Brush beaten egg over the pastry.","用刷子把打匀的鸡蛋抹在油酥面团上。"],["Whisk the egg whites until stiff.","把蛋清打成稠的。"]]},{"l":"m.i.l.k","p":"m.ɪ.l.k","cn":"牛奶","s":[["The birds infect the milk.","鸟使牛奶受污染。"],["She's gone for some milk.","她买牛奶去了。"],["We've run short of milk.","我们牛奶不够了。"]]},{"l":"w.a/t.er","p":"ˈw.ɔː/t.ə","cn":"水","s":[["The water deepened gradually.","水渐渐变深了。"],["Salt dissolves in water.","盐溶于水。"],["The water was blackish.","水带着黑色。"]]},{"l":"c.a.k.e","p":"k.eɪ.k.-","cn":"蛋糕","s":[["That cake looks very tempting.","那蛋糕的样子让人嘴馋。"],["She cut the cake into fifths.","她把蛋糕切成五块。"],["This cake is very filling.","这种饼很能填饱肚子。"]]},{"l":"f.i.sh","p":"f.ɪ.ʃ","cn":"鱼；鱼肉","s":[["These fish are very aggressive.","这些鱼十分好斗。"],["The lakes abound with fish.","这些湖泊盛产鱼。"],["The fish were unwholesome and old.","这些鱼已经不新鲜了。"]]},{"l":"r.i.c.e","p":"r.aɪ.s.-","cn":"米饭","s":[["We eat rice every single day.","我们天天吃米饭。"],["Rice aspired to go to college.","赖斯渴望上大学。"],["Could you give the rice a stir?","你把米饭搅一搅好吗？"]]}]},{"name":"Unit 6 Happy birthday!","words":[{"l":"o.n.e","p":"wʌ.n.-","cn":"一","s":[["Knit one row, purl one row.","织一趟平针，织一趟反针。"],["One minus one is zero.","一减一等于零。"],["One more, please!","请再来一个！"]]},{"l":"t.w.o","p":"t.-.uː","cn":"二","s":[["The two meanings conflated.","这两种意思合并在了一起。"],["Two light ales please.","请来两杯淡麦芽啤酒。"],["He scored two goals and had another two near misses.","他攻进两球，另有两球也险些破门。"]]},{"l":"th.r.ee","p":"θ.r.iː","cn":"三","s":[["He drank three whole glasses.","他喝了满满三杯。"],["Three runners sprinted past.","三名运动员飞跑了过去。"],["He's got three children.","他有三个孩子。"]]},{"l":"f.our","p":"f.ɔː","cn":"四","s":[["She's four years his junior.","她比他小四岁。"],["She bid four hearts.","她叫四红桃。"],["He dribbled past four defenders.","他带球突破了4名防守球员。"]]},{"l":"f.i.v.e","p":"f.aɪ.v.-","cn":"五","s":[["Britain won five gold medals.","英国夺取了五块金牌。"],["She brought up five children.","她抚育了五个孩子。"],["He arrived around five o'clock.","他大约是五点钟到的。"]]},{"l":"s.i.x","p":"s.ɪ.ks","cn":"六","s":[["It's gone six o'clock already.","过了六点了。"],["She has completed six laps.","她跑完六圈了。"],["She's six months pregnant.","她怀孕六个月了。"]]},{"l":"s.e.v/e.n","p":"ˈs.e.v/ə.n","cn":"七","s":[["We started German in year seven.","我们在七年级开始学习德语。"],["The performance starts at seven.","演出七点开始。"],["She's seven months gone.","她怀孕七个月了。"]]},{"l":"eigh.t","p":"eɪ.t","cn":"八","s":[["The cut needed eight stitches.","这道伤口需要缝八针。"],["Wake up! It's eight o'clock.","醒醒吧！已经八点钟了。"],["Eight o'clock had already chimed.","已敲过八点钟了。"]]},{"l":"n.i.n.e","p":"n.aɪ.n.-","cn":"九","s":[["We still sighted nine yachts.","我们还是看到了九艘游艇。"],["Nine cases are still pending.","尚有九宗案件待决。"],["I got here just after nine.","我到达这里时刚过九点。"]]},{"l":"t.e.n","p":"t.e.n","cn":"十","s":[["Tickets cost ten dollars each.","每张票价为十元。"],["We're leaving round about ten.","我们十点钟左右出发。"],["It's ten past twelve.","现在十二点十分。"]]},{"l":"b.r.o.th/er","p":"ˈb.r.ʌ.ð/ə","cn":"兄弟","s":[["She's smarter than her brother.","她比她哥哥聪明。"],["He loved his brother deeply.","他深爱自己的哥哥。"],["My brother pledged Sigma Nu.","我哥哥宣誓加入Σ NU联谊会。"]]},{"l":"p.l.a.t.e","p":"p.l.eɪ.t.-","cn":"盘子","s":[["She heaped my plate with food.","她往我的盘子里夹了很多食物。"],["She heaped food on my plate.","她往我的盘子里夹了很多食物。"],["Don't touch that plate—it's hot!","别碰那个盘子，烫手！"]]}]}]},{"id":"3b","name":"三年级下册","units":[{"name":"Unit 1 Welcome back to school!","words":[{"l":"U/K","p":"ˌjuː/ˈkeɪ","cn":"英国","s":[["The UK leant towards the US proposal.","英国倾向于美国的提案。"],["Who distributes our products in the UK?","谁在英国经销我们的产品？"],["The UK has refused to recognize the new regime.","英国已拒绝承认这个新的政权。"]]},{"l":"C.a.n/a/d.a","p":"ˈk.æ.n/ə/d.ə","cn":"加拿大","s":[["Until 2004, she lived in Canada.","到2004年为止，她一直住在加拿大。"],["They started life anew in Canada.","他们在加拿大开始新生活。"],["My aunt lives in Canada.","我的姑母住在加拿大。"]]},{"l":"U/S/A","p":"ˌjuː/es/ˈeɪ","cn":"美国","s":[["Do you need a visa for the USA?","你需要美国签证吗？"],["I bought a copy of \"USA Today\" from a street-corner machine.","我从售货机上买了一份《今日美国》。"],["Team USA reached the semifinals by defeating New Zealand in the second round.","美国队在第二轮击败新西兰队后进入了半决赛阶段。"]]},{"l":"Ch.i/n.a","p":"ˈtʃ.aɪ/n.ə","cn":"中国","s":[["China has always fascinated me.","中国一直令我心驰神往。"],["China is utterly different.","中国完全不一样。"],["The produce was labelled \"Made in China.\"","该产品上贴有“中国制造”的标签。"]]},{"l":"sh.e","p":"ʃ.iː","cn":"她","s":[["She doesn't work here, does she?","她不在此地工作，对吧？"],["She said that she couldn't come.","她说她来不了啦。"],["She thought she could reform him.","她觉得她可以使他洗心革面。"]]},{"l":"s.t.u/d.e.n.t","p":"ˈs.t.juː/d.ə.n.t","cn":"学生","s":[["No student is to leave the room.","学生一律不许离开这房间。"],["She's a student at Sussex University.","她是萨塞克斯大学的学生。"],["Student numbers are expanding rapidly.","学生人数在迅速增加。"]]},{"l":"p.u/p.i.l","p":"ˈp.juː/p.ə.l","cn":"小学生","s":[["These complex formulae are beyond the grasp of the average pupil.","这些复杂的公式是一般小学生不能理解的。"],["Amy was a pupil in Grade Three.","艾米是一名三年级的学生。"],["She is loved by every pupil.","她深受每个学生的喜爱。"]]},{"l":"h.e","p":"h.iː","cn":"他","s":[["He feels he is blameless.","他觉得自己是清白的。"],["He says he was framed.","他说他是被诬陷的。"],["He wouldn't come—he said he was too busy.","他不愿来，他说他太忙。"]]},{"l":"t.ea.ch/er","p":"ˈt.iː.tʃ/ə","cn":"老师","s":[["She's a very capable teacher.","她是一位能力很强的教师。"],["'Be quiet,' said the teacher.","“安静点！”老师说道。"],["As a teacher, he's a disaster.","他当老师压根儿就不称职。"]]},{"l":"b.oy","p":"b.ɔɪ","cn":"男孩","s":[["The boy has great potential.","这个男孩有很大的潜力。"],["He's the manager's blue-eyed boy.","他备受经理的青睐。"],["Have you been a bad boy?","你调皮了吗？"]]},{"l":"a.n.d","p":"æ.n.d","cn":"和","s":[["America and her partners are helping to rebuild roads and bridges and buildings.","美国及其伙伴正帮助重建道路、桥梁和楼房。"],["The room was dim and cool and quiet.","这房间昏暗、阴冷且安静。"],["Sara and I read the story and marvelled.","我和萨拉读了这个故事后惊叹不已。"]]},{"l":"g.ir.l","p":"ɡ.ɜː.l","cn":"女孩","s":[["An older girl befriended me.","一个年纪大些的女孩对我很友善。"],["My dear girl, you're wrong.","我亲爱的姑娘，你错了。"],["She's a really weird girl.","她真是个古怪的女孩。"]]},{"l":"n.ew","p":"n.juː","cn":"新的","s":[["New England is beautiful.","新英格兰很迷人。"],["This idea isn't new.","这主意不新鲜。"],["My new shoes squeak.","我的新皮鞋走路嘎吱嘎吱响。"]]},{"l":"f.r.ie.n.d","p":"f.r.e.n.d","cn":"朋友","s":[["My friend here saw it happen.","我的这位朋友目睹了事情的经过。"],["She's a very special friend.","她是我特别要好的朋友。"],["Jo is a very close friend.","乔是我们亲密的朋友。"]]},{"l":"t.o/d.ay","p":"t.ə/ˈd.eɪ","cn":"今天","s":[["I'm revising Geography today.","我今天复习地理。"],["It's flipping cold today!","今天冷得要命！"],["Blimey, it's hot today.","哎呀，今天真热。"]]}]},{"name":"Unit 2 My family","words":[{"l":"f.a/th.er","p":"ˈf.ɑː/ð.ə","cn":"父亲","s":[["His father hailed from Italy.","他父亲出生于意大利。"],["I miss thee, beloved father.","亲爱的父亲，我想念您。"],["My father sold real estate.","我父亲经营过房地产。"]]},{"l":"d.a.d","p":"d.æ.d","cn":"爸爸","s":[["Dad went out to milk the cows.","爸爸出去给牛挤奶去了。"],["Thanks Dad, you're an angel.","谢谢爸爸，你是个大好人。"],["For once, Dad is not complaining.","就这一次，爸爸没有抱怨。"]]},{"l":"m.a.n","p":"m.æ.n","cn":"男人","s":[["Man is not inherently violent.","人类并非生来就暴力。"],["He's a shallow, disagreeable man.","他是个浅薄、不友好的人。"],["He was an imposing man.","他是个仪表堂堂的男子汉。"]]},{"l":"w.o.m/a.n","p":"ˈw.ʊ.m/ə.n","cn":"女人","s":[["She's a very attractive woman.","她是个非常迷人的女子。"],["She's ever such a nice woman.","她是个非常好的女人。"],["She is an emancipated woman.","她是一位不受束缚的女性。"]]},{"l":"m.o.th/er","p":"ˈm.ʌ.ð/ə","cn":"母亲","s":[["Her mother had never remarried.","她的母亲没有再婚。"],["His mother overindulged him.","他母亲对他过于溺爱。"],["Her mother suffered from migraines.","她母亲患了偏头痛。"]]},{"l":"s.i.s/t.er","p":"ˈs.ɪ.s/t.ə","cn":"姐妹","s":[["And how is my sainted sister?","我那大好人姐姐怎么样？"],["His sister Sarah helped him.","他姐姐萨拉帮助了他。"],["My other sister is a doctor.","我的另一个妹妹是医生。"]]},{"l":"b.r.o.th/er","p":"ˈb.r.ʌ.ð/ə","cn":"兄弟","s":[["She's smarter than her brother.","她比她哥哥聪明。"],["He loved his brother deeply.","他深爱自己的哥哥。"],["My brother pledged Sigma Nu.","我哥哥宣誓加入Σ NU联谊会。"]]},{"l":"g.r.a.n.d/m.o.th/er","p":"ˈɡ.r.æ.n.-/m.ʌ.ð/ə","cn":"（外）祖母","s":[["Her grandmother mumbled in her sleep.","她祖母睡觉时咕哝了。"],["He often runs errands for his grandmother.","他经常给他的祖母跑腿儿。"],["My grandmother is 90 and still going strong.","我奶奶90岁了，还挺硬朗。"]]},{"l":"g.r.a.n.d/m.a","p":"ˈɡ.r.æ.n.-/m.ɑː","cn":"奶奶；外婆","s":[["Grandma was from Scotland.","奶奶来自苏格兰。"],["My Grandma lost her brother in the war.","我的祖母在战争中失去了弟弟。"],["Unfortunately, Grandma always seems to awaken at awkward moments.","可惜的是，奶奶好像总是在不合适的时间叫醒我。"]]},{"l":"g.r.a.n.d/f.a/th.er","p":"ˈɡ.r.æ.n.-/f.ɑː/ð.ə","cn":"（外）祖父","s":[["His grandfather was a professor.","他爷爷曾是位教授。"],["His grandfather was a Muslim cleric.","他祖父是一位穆斯林教士。"],["Her grandfather taught her to conjure.","她的祖父教她变魔术。"]]},{"l":"g.r.a.n.d/p.a","p":"ˈɡ.r.æ.n.-/p.ɑː","cn":"爷爷；外公","s":[["Grandpa lies comatose on the sofa.","爷爷躺在沙发上昏睡。"],["Grandpa was not yet back from the war.","爷爷那时还没从战场归来。"],["Grandpa dotes on his grandson.","爷爷疼孙子。"]]},{"l":"f.a.m/i/l.y","p":"ˈf.æ.m/ə/l.i","cn":"家；家庭","s":[["They were an insular family.","他们一家人与世隔绝。"],["His family expostulated with him.","他的家人反驳他。"],["We're a very close family.","我们全家彼此亲密无间。"]]}]},{"name":"Unit 3 At the zoo","words":[{"l":"th.i.n","p":"θ.ɪ.n","cn":"瘦的","s":[["The dog was painfully thin.","那条狗瘦得可怜。"],["The sheets have worn thin.","床单已经磨薄了。"],["She was pathetically thin.","她那时瘦弱得可怜。"]]},{"l":"f.a.t","p":"f.æ.t","cn":"胖的","s":[["Excess food is stored as fat.","多余的食物作为脂肪贮存起来。"],["This dress makes me look fat.","这衣服我穿着显胖。"],["Get out of bed, you fat slob!","起床吧，你这个胖懒虫！"]]},{"l":"t.a.ll","p":"t.ɔː.l","cn":"高的","s":[["Tall trees cut out the sunlight.","高高的树木遮住了阳光。"],["She goes for tall slim men.","她喜欢瘦高个子的男人。"],["She was tall and slim.","她是个瘦高个儿。"]]},{"l":"sh.or.t","p":"ʃ.ɔː.t","cn":"矮的；短的","s":[["Short hair really becomes you.","你理短发的确很帅。"],["He had short curly hair.","他有一头短鬈发。"],["Short skirts are back.","短裙又流行起来了。"]]},{"l":"l.o.ng","p":"l.ɒ.ŋ","cn":"长的","s":[["I don't intend staying long.","我不打算长期逗留。"],["The long journey tired him.","漫长的旅程使他疲倦。"],["Workers toiled long hours.","工人们长时间辛苦工作。"]]},{"l":"s.m.a.ll","p":"s.m.ɔː.l","cn":"小的","s":[["I can't read this small type.","我无法读这种小号字体。"],["The room was disappointingly small.","屋子小得令人失望。"],["Small villages dot the countryside.","小村庄星罗棋布于乡间。"]]},{"l":"b.i.g","p":"b.ɪ.ɡ","cn":"大的","s":[["This shirt isn't big enough.","这件衬衣不够大。"],["A murder was big news.","谋杀案是大新闻。"],["You're a big girl now.","你现在已长成大姑娘了。"]]},{"l":"g.i/r.a.ff.e","p":"dʒ.ə/ˈr.ɑː.f.-","cn":"长颈鹿","s":[["You have two giraffe toys.","你有两个长颈鹿玩具。"],["The giraffe eats leaves.","长颈鹿吃树叶。"],["A giraffe cannot cough.","长颈鹿没办法咳嗽。"]]},{"l":"s.o","p":"s.əʊ","cn":"这么；那么","s":[["Chris is so ambitious, so determined to do it all.","克里斯是如此雄心勃勃，如此坚决地要把它做完。"],["She was so young, so unworldly.","她那样年轻，那样不谙世事。"],["He's an ungrateful so-and-so.","他是个忘恩负义的家伙。"]]},{"l":"ch.i.l/d.r.e.n","p":"ˈtʃ.ɪ.l/d.r.ə.n","cn":"孩子们","s":[["She photographed the children.","她给孩子们照了相。"],["Children need their parents.","孩子们需要父母。"],["The children behaved beautifully.","孩子们表现甚佳。"]]},{"l":"ch.i.l.d","p":"tʃ.aɪ.l.d","cn":"孩子","s":[["The child was christened Mary.","这孩子受洗时取名玛丽。"],["The child went into convulsions.","那孩子全身抽搐起来。"],["They desperately wanted a child.","他们非常想要一个孩子。"]]},{"l":"t.ai.l","p":"t.eɪ.l","cn":"尾巴","s":[["The dog ran up, wagging its tail.","那条狗摇着尾巴跑上前去。"],["The pony swished its tail.","小马刷刷地甩着尾巴。"],["The tail tapered to a rounded tip.","尾部越来越细，最后成了个圆尖。"]]}]},{"name":"Unit 4 Where is my car?","words":[{"l":"o.n","p":"ɒ.n","cn":"在……上","s":[["The old men blather on and on.","这帮老头儿絮絮叨叨没完没了。"],["She went on and on about her trip.","她没完没了地谈她的旅行。"],["From now on you can work on your own.","从现在起你可以独自工作。"]]},{"l":"i.n","p":"ɪ.n","cn":"在……里","s":[["They lived in rooms in Kensington.","他们住在肯辛顿的出租房间。"],["We went skiing in France in March.","三月份我们去法国滑雪了。"],["He arrived in London in November 1939.","他于1939年11月到达伦敦。"]]},{"l":"u.n/d.er","p":"ˈʌ.n/d.ə","cn":"在……下面","s":[["Can you work under pressure?","你能在压力下工作吗？"],["They feel under permanent threat.","他们感觉处在持续不断的威胁之下。"],["She dived under the water.","她潜入水下。"]]},{"l":"ch.air","p":"tʃ.eə","cn":"椅子","s":[["She jumped down off the chair.","她跳下椅子。"],["Emily edged her chair forward.","埃米莉把椅子慢慢地向前挪动。"],["Helen sat upright in her chair.","海伦笔直地坐在椅子上。"]]},{"l":"d.e.s.k","p":"d.e.s.k","cn":"书桌","s":[["The desk looked undisturbed.","那张书桌子看上去没有被动过。"],["A phone trilled on the desk.","办公桌上的电话丁零零地响了。"],["She was sitting at her desk.","她坐在书桌前。"]]},{"l":"c.a.p","p":"k.æ.p","cn":"帽子（有檐）","s":[["He often wore a baseball cap.","他经常戴顶棒球帽。"],["She screwed the cap back on the jar.","她又把广口瓶的盖子拧上。"],["She tucked her hair (up) under her cap.","她把头发拢起来塞进帽子里。"]]},{"l":"b.a.ll","p":"b.ɔː.l","cn":"球","s":[["He kicked the ball into touch.","他把球踢出了边线。"],["The ball was uncontrollable.","球控制不住了。"],["The ball curved through the air.","球在空中沿曲线运动。"]]},{"l":"c.ar","p":"k.ɑː","cn":"小汽车","s":[["Suddenly the car accelerated.","突然车加速了。"],["The car leaped forward.","汽车突然向前冲去。"],["That car is ours.","那辆车是我们的。"]]},{"l":"b.oa.t","p":"b.əʊ.t","cn":"小船","s":[["The boat chugged slowly along.","船突突地缓慢前进。"],["The boat heaved beneath them.","小船在他们脚下颠簸着。"],["The boat disappeared from sight.","那艘船从视野中消失了。"]]},{"l":"m.a.p","p":"m.æ.p","cn":"地图","s":[["He traced the route on the map.","他在地图上勾画出了路线。"],["Are you any good at map reading?","你会看地图吗？"],["He laid the map out on the table.","他把地图在桌子上展开。"]]},{"l":"t.oy","p":"t.ɔɪ","cn":"玩具","s":[["The toy industry is in a slump.","玩具业现在不景气。"],["The boat looked almost like a toy.","这船看上去简直像个玩具。"],["He whittled the piece of wood into a simple toy.","他把那块木头削成了一个简易的玩具。"]]},{"l":"b.o.x","p":"b.ɒ.ks","cn":"盒子；箱子","s":[["Can you help me with this box?","你能帮我搬这个箱子吗？"],["The inside of the box was blue.","盒子的内面呈蓝色。"],["Come and help me lift this box.","来帮我抬这个箱子。"]]}]},{"name":"Unit 5 Do you like pears?","words":[{"l":"p.ear","p":"p.eə","cn":"梨","s":[["She bit into a ripe juicy pear.","她咬了一口熟透了的多汁的梨。"],["Pear trees are grafted on quince rootstocks.","梨树被嫁接到榅桲的根茎上。"],["In gardens, cankers are most prominent on apples and pear trees.","花园树木中患溃疡病最多的是苹果树和梨树。"]]},{"l":"a.p/p.le","p":"ˈæ.p/-.l","cn":"苹果","s":[["She crunched her apple noisily.","她吃苹果发出嘎嚓嘎嚓的声音。"],["He took another bite of apple.","他又咬了一口苹果。"],["Someone threw an apple core.","有人扔了一个苹果核。"]]},{"l":"o.r/a.n.g.e","p":"ˈɒ.r/ɪ.n.dʒ.-","cn":"橙子","s":[["I plucked an orange from the tree.","我从树上摘了一个橙子。"],["Orange is the big colour this year.","橘黄色是今年的流行色。"],["Would you care for some orange juice?","你想要些橙汁吗？"]]},{"l":"b.a/n.a/n.a","p":"b.ə/ˈn.ɑː/n.ə","cn":"香蕉","s":[["These companies are determined to keep a stranglehold on the banana industry.","这些公司决定对香蕉业进行压制。"],["He slipped on a banana skin.","他踩在香蕉皮上滑倒了。"],["The banana smells good.","这个香蕉闻起来很香。"]]},{"l":"w.a/t.er/m.e.l/o.n","p":"ˈw.ɔː/t.ə/m.e.l/ə.n","cn":"西瓜","s":[["Watermelon contains vitamins and also potassium.","西瓜含有维生素也有钾。"],["They planted some watermelon.","他们种了些西瓜。"],["Insects will soon smell watermelon.","昆虫很快会嗅到西瓜味。"]]},{"l":"s.t.r.aw/b.er/r.y","p":"ˈs.t.r.ɔː/b.ə/r.i","cn":"草莓","s":[["I want a strawberry milkshake.","我想要杯草莓奶昔。"],["Do you like strawberry jam?","你喜欢草莓酱么？"],["This pancake is full of strawberry jam.","这个煎饼里涂满了草莓酱。"]]},{"l":"g.r.a.p.e","p":"ɡ.r.eɪ.p.-","cn":"葡萄","s":[["The colouring pigments from the skins are not allowed to bleed into the grape juice.","这些果皮的色素不允许掺混进葡萄汁中。"],["Is it a grape or a plum?","这是葡萄还是李子？"],["Juice blends contain various fruits like grape, apple and pear.","混合果汁含有各种水果，如葡萄、苹果和梨。"]]},{"l":"b.uy","p":"b.aɪ","cn":"买","s":[["Money can't buy you happiness.","金钱不能为你买到幸福。"],["Where did you buy that dress?","那件连衣裙你是在哪里买的？"],["The curtains were an impulse buy.","这窗帘是一时心血来潮买下的。"]]},{"l":"f.r.ui.t","p":"f.r.uː.t","cn":"水果","s":[["The fruit are small and round.","这种水果小而圆。"],["The fruit was drowned in cream.","水果在奶油里泡过。"],["They eat mainly fruit and nuts.","他们主要吃水果和坚果。"]]}]},{"name":"Unit 6 How many?","words":[{"l":"e/l.e.v/e.n","p":"ɪ/ˈl.e.v/ə.n","cn":"十一","s":[["Charles I ruled for eleven years.","查理一世统治了十一年。"],["The meeting broke up at eleven o'clock.","会议在十一点散会。"],["She was chosen for the first eleven.","她被选派首发上场。"]]},{"l":"t.w.e.l.v.e","p":"t.w.e.l.v.-","cn":"十二","s":[["He retired twelve batters in a row.","他一连使十二个击球手出局。"],["It's ten past twelve.","现在十二点十分。"],["Twelve hours later she was all smiles again.","十二小时之后，她又喜笑颜开了。"]]},{"l":"th.ir/t.ee.n","p":"ˌθ.ɜː/ˈt.iː.n","cn":"十三","s":[["\"Thirteen?\" he guessed wildly.","“十三？”他胡乱猜道。"],["He ran away from home at the age of thirteen.","他十三岁时离家出走。"],["Thirteen is often considered an unlucky number.","十三常被认为是不吉利的数字。"]]},{"l":"f.our/t.ee.n","p":"ˌf.ɔː/ˈt.iː.n","cn":"十四","s":[["\"Fourteen minutes,\" Chris said, taking a peep at his watch.","“十四分钟，”克里斯瞥了一眼手表说道。"],["Women are advised not to drink more than fourteen units of alcohol per week.","建议妇女每周饮酒不超过十四个酒精单位。"],["I'm fourteen years old.","我14岁。"]]},{"l":"f.i.f/t.ee.n","p":"ˌf.ɪ.f/ˈt.iː.n","cn":"十五","s":[["Three fives are fifteen.","三个五等于十五。"],["The talks began some fifteen minutes late.","商谈迟了约十五分钟才开始。"],["We paid off our mortgage after fifteen years.","我们历经十五年的时间还清了抵押借款。"]]},{"l":"s.i.x/t.ee.n","p":"ˌs.ɪ.ks/ˈt.iː.n","cn":"十六","s":[["She is sixteen but has a mental age of five.","她十六岁，而智力年龄是五岁。"],["Sixteen times as many men are colour-blind as women.","色盲的男性人数是女性人数的十六倍。"],["He worked sixteen hours a day.","他每天工作16个小时。"]]},{"l":"s.e.v/e.n/t.ee.n","p":"ˌs.e.v/ə.n/ˈt.iː.n","cn":"十七","s":[["Jenny is seventeen years old.","珍妮17岁。"],["He had confessed to seventeen murders.","他已供认了17项谋杀罪。"],["Nora thought he was seventeen years old.","诺拉觉得他有17岁。"]]},{"l":"eigh/t.ee.n","p":"ˌeɪ/ˈt.iː.n","cn":"十八","s":[["His boat is an eighteen-footer.","他的小船长十八英尺。"],["The party was ousted from power after eighteen years.","该党执政十八年后被赶下台。"],["My classmate is eighteen.","我的同学十八岁。"]]},{"l":"n.i.n.e/t.ee.n","p":"ˌn.aɪ.n.-/ˈt.iː.n","cn":"十九","s":[["They have nineteen days to make up their minds.","他们有十九天的时间来做出决定。"],["Ten plus nine is nineteen.","十加九是十九。"],["It's only nineteen yuan.","它只要十九元。"]]},{"l":"t.w.e.n/t.y","p":"ˈt.w.e.n/t.i","cn":"二十","s":[["Twenty-eight is divisible by seven.","二十八可以被七整除。"],["I've been waiting (for) twenty minutes.","我等了二十分钟。"],["He was jailed for twenty years.","他被监禁了20年。"]]},{"l":"k.i.t.e","p":"k.aɪ.t.-","cn":"风筝","s":[["The kite has a span of 1.5 metres.","风筝宽1.5米。"],["Willy asks if I've ever flown a kite before.","威利问我以前是否放过风筝。"],["I wanted to fly a kite.","我想要去放风筝。"]]},{"l":"b.eau/t.i/f.u.l","p":"ˈb.juː/t.ɪ/f.ə.l","cn":"美丽的","s":[["Yessir, she was beautiful.","的确，她很漂亮。"],["The view was dazzlingly beautiful.","景色美得令人目眩神迷。"],["New England is beautiful.","新英格兰很迷人。"]]}]}]},{"id":"4a","name":"四年级上册","units":[{"name":"Unit 1 My classroom","words":[{"l":"c.l.a.ss/r.oo.m","p":"ˈk.l.ɑː.s/r.uː.m","cn":"教室","s":[["She'd sent him outside the classroom.","她叫他到教室外面去。"],["The classroom teacher must be sensitive to a child's needs.","课堂教师必须理解孩子的需求。"],["The corner of the classroom was damp where the roof had leaked.","教室漏雨的一角是湿的。"]]},{"l":"w.i.n/d.ow","p":"ˈw.ɪ.n/d.əʊ","cn":"窗户","s":[["I climbed through the window.","我从窗口爬了出来。"],["Rain drove against the window.","雨打着窗户。"],["Phil moved towards the window.","菲尔朝窗户走去。"]]},{"l":"b.l.a.ck/b.oar.d","p":"ˈb.l.æ.k/b.ɔː.d","cn":"黑板","s":[["The menu was on a blackboard.","菜单在黑板上。"],["He chalked the message on the blackboard.","他用粉笔把这条消息写在黑板上。"],["On a blackboard, he drew five concentric circles.","他在黑板上画出五个同心圆。"]]},{"l":"l.igh.t","p":"l.aɪ.t","cn":"电灯；光","s":[["Suddenly a warning light blinked.","突然有一盏警告灯开始闪烁。"],["A light breeze was blowing.","轻风习习。"],["This pastry is so light.","这种酥皮糕点可真松软啊。"]]},{"l":"p.i.c/t.ure","p":"ˈp.ɪ.k/tʃ.ə","cn":"图画；照片","s":[["I saw her picture everywhere.","我到处看到她的照片。"],["Show me which picture you drew.","指给我看哪张画是你画的。"],["The picture hung aslant.","照片挂歪了。"]]},{"l":"d.oor","p":"d.ɔː","cn":"门","s":[["The door opens inwards.","门向里开。"],["The door crashed open.","那门砰的一声给砸开了。"],["The door clicked shut.","门咔嗒一声关上了。"]]},{"l":"t.ea.ch/er.'s d.e.s.k","p":"ˈt.iː.tʃ/ə.z d.e.s.k","cn":"讲台","s":[["There are many books on my teacher's desk.","我的老师桌子上有很多书。"],["In front of the blackboard is the teacher's desk.","黑板前面是老师的讲桌。"],["The teacher's desk is big.","教师课桌是大的。"]]},{"l":"c.o.m/p.u/t.er","p":"k.ə.m/ˈp.juː/t.ə","cn":"计算机；电脑","s":[["My computer keeps going funny.","我的计算机老出故障。"],["He's addicted to computer games.","他迷上了电脑游戏。"],["He hacked into the bank's computer.","他侵入了这家银行的计算机。"]]},{"l":"f.a.n","p":"f.æ.n","cn":"风扇","s":[["He is a fanatical fan of Mozart.","他是一名莫扎特音乐的狂热爱好者。"],["The fan revolved slowly.","电扇缓慢地转动着。"],["She installed a wall-mounted electric fan.","她装了一台墙壁式电扇。"]]},{"l":"w.a.ll","p":"w.ɔː.l","cn":"墙壁","s":[["He could easily vault the wall.","他可以轻而易举地跃过这堵墙。"],["The boys climbed over the wall.","那些男孩翻过了那堵墙。"],["I pinned him against the wall.","我把他按在墙上。"]]},{"l":"f.l.oor","p":"f.l.ɔː","cn":"地板；地面","s":[["The bathroom floor was awash.","浴室地板浸在水中。"],["Water splashed onto the floor.","水哗的一声泼洒在地板上。"],["We sat on the concrete floor.","我们坐在混凝土地板上。"]]},{"l":"r.e/a/ll.y","p":"ˈr.iː/ə/l.i","cn":"真的；确实","s":[["You played really brilliantly.","你的表现真是棒极了。"],["I'm really hacked off.","我真是很恼火。"],["He was really manic.","他真的很狂热。"]]},{"l":"n.ear","p":"n.ɪə","cn":"在……附近","s":[["A bomb exploded somewhere near.","一颗炸弹在附近爆炸。"],["His stables are near Oxford.","他的养马场在牛津附近。"],["The exams are drawing near.","考试越来越近了。"]]},{"l":"T/V","p":"ˌtiː/ˈviː","cn":"电视","s":[["He directed various TV shows.","他导演过各种电视节目。"],["She regularly appears on TV.","她经常在电视上露面。"],["The TV works perfectly now.","这台电视机现在效果好极了。"]]},{"l":"c.l.ea.n","p":"k.l.iː.n","cn":"打扫；干净的","s":[["Cats are very clean animals.","猫是颇爱干净的动物。"],["Her house is scrupulously clean.","她的家干干净净，纤尘不染。"],["Scrub the vegetables clean.","把蔬菜刷洗干净。"]]},{"l":"h.e.l.p","p":"h.e.l.p","cn":"帮助","s":[["You never help me.","你从不帮我。"],["This charity aims to help people (to) help themselves.","这个慈善机构的宗旨是帮助人们自力更生。"],["'Help me,' he implored.","“救救我吧。”他哀求道。"]]}]},{"name":"Unit 2 My schoolbag","words":[{"l":"s.ch.oo.l/b.a.g","p":"ˈs.k.uː.l/b.æ.ɡ","cn":"书包","s":[["Then, I packed my schoolbag.","然后，我收拾了我的书包。"],["My schoolbag is left here.","我的书包忘在这里了。"],["I can't find my schoolbag.","我找不到书包了。"]]},{"l":"m.a.th.s b.oo.k","p":"m.æ.θ.s b.ʊ.k","cn":"数学书","s":[["He has lost his maths book.","他已经把数学书丢了。"],["Where is you maths book?","你的数学书在哪里？"],["I want a Maths book. Where can I find it?","我想要一本数学书。我在哪里能找到它？"]]},{"l":"E.n.g/l.i.sh b.oo.k","p":"ˈɪ.ŋ.ɡ/l.ɪ.ʃ b.ʊ.k","cn":"英语书","s":[["I'm holding the English book.","我正拿着英语书。"],["I'm reading an English book.","我正在读一本英语书。"],["The tenth one is in English book.","第十本是本英文书。"]]},{"l":"Ch.i/n.e.s.e b.oo.k","p":"ˌtʃ.aɪ/ˈn.iː.z.- b.ʊ.k","cn":"语文书","s":[["May I borrow your Chinese book?","我能借用你的语文书么？"],["This Chinese book is very good.","这本语文书非常棒！"],["How much is this Chinese book?","这本中文书多少？"]]},{"l":"s.t.o/r.y/b.oo.k","p":"ˈs.t.ɔː/r.i/b.ʊ.k","cn":"故事书","s":[["This comes from a storybook.","这来自于一本故事书。"],["Is she buying a storybook?","她正在买一本故事书吗？"],["This is his storybook.","这是他的故事书。"]]},{"l":"c.a.n/d.y","p":"ˈk.æ.n/d.i","cn":"糖果","s":[["Who wants the last piece of candy?","谁想要这最后一块糖？"],["Back then, women on TV were mostly seen as eye candy.","那时候，电视中的女性大多都被看作花瓶。"],["Animation has stopped being eye-candy for kids and geeks and become mainstream entertainment.","动画已不仅仅是吸引小孩和动漫迷的东西，而成了主流娱乐方式。"]]},{"l":"n.o.t.e/b.oo.k","p":"ˈn.əʊ.t.-/b.ʊ.k","cn":"笔记本","s":[["Bob whipped out his notebook.","鲍勃猛地拿出他的笔记本。"],["He snapped the notebook shut.","他啪的一声合上笔记本。"],["What did you do with that notebook?","你把那本笔记本放哪儿去了？"]]},{"l":"t.oy","p":"t.ɔɪ","cn":"玩具","s":[["The toy industry is in a slump.","玩具业现在不景气。"],["The boat looked almost like a toy.","这船看上去简直像个玩具。"],["He whittled the piece of wood into a simple toy.","他把那块木头削成了一个简易的玩具。"]]},{"l":"k.ey","p":"k.iː","cn":"钥匙","s":[["She turned the key in the lock.","她转动锁眼里的钥匙。"],["His contribution could be key.","他的贡献可能是最重要的。"],["The key doesn't fit the lock.","这把钥匙打不开这把锁。"]]},{"l":"w.ow","p":"w.aʊ","cn":"哇","s":[["Wow! That's totally awesome!","哇！真是棒极了！"],["Wow, man! That's totally gnarly!","哇，老兄，那真是太好了！"],["I thought, \"Wow, what a good idea.\"","我想: “哇，多妙的一个主意。”"]]},{"l":"l.o.s.t","p":"l.ɒ.s.t","cn":"丢失","s":[["They were hopelessly lost.","他们彻底失败了。"],["Harry was hopelessly lost.","哈里彻底迷路了。"],["I've lost my keys.","我把钥匙丢了。"]]},{"l":"s.o m.u.ch","p":"s.əʊ m.ʌ.tʃ","cn":"非常；很","s":[["I wish I hadn't eaten so much.","我倒希望我没有吃这么多。"],["Need you have paid so much?","你用得着花那么多钱吗？"],["I haven't laughed so much in years.","我很久没有笑这么多了。"]]},{"l":"c.u.t.e","p":"k.juː.t.-","cn":"可爱的","s":[["Shame, she's so cute!","哇，她简直是太漂亮了！"],["Bears are cute.","熊是可爱的。"],["She is such a cute little thing.","她是个非常可爱的小东西。"]]}]},{"name":"Unit 3 My friends","words":[{"l":"s.t.r.o.ng","p":"s.t.r.ɒ.ŋ","cn":"强壮的","s":[["He's the strong silent type.","他是那种强悍而沉默寡言的人。"],["The team's midfield looks strong.","这个球队的中场显得很强大。"],["Butterflies can be strong flyers.","蝴蝶的飞翔力强。"]]},{"l":"f.r.ie.n.d/l.y","p":"ˈf.r.e.n.d/l.i","cn":"友好的","s":[["She waved a friendly greeting.","她友好地挥手致意。"],["The locals are very friendly.","当地人很友好。"],["She smiled in a friendly way.","她友好地笑了笑。"]]},{"l":"qu.i/e.t","p":"ˈkw.aɪ/ə.t","cn":"安静的","s":[["The city was preternaturally quiet.","这座城市异样的宁静。"],["It's been quiet so far.","到目前为止还是安静的。"],["It was suddenly preternaturally quiet.","那里突然变得安静异常。"]]},{"l":"h.air","p":"h.eə","cn":"头发","s":[["His hair curls naturally.","他的头发天生鬈曲。"],["She dyed her hair blonde.","她把头发染成了金黄色。"],["His hair waves naturally.","他天生一头鬈发。"]]},{"l":"sh.oe","p":"ʃ.uː","cn":"鞋","s":[["The shoes go on the shoe shelf.","鞋子应该放在鞋架上。"],["The back of my shoe is rubbing.","我的鞋后跟磨脚。"],["He removed a stone from his shoe.","他清除了鞋中的一粒石子。"]]},{"l":"g.l.a.ss/e.s","p":"ˈɡ.l.ɑː.s/ɪ.z","cn":"眼镜","s":[["He wore green-tinted glasses.","他戴着染成绿色的眼镜。"],["Your glasses are on crooked.","你的眼镜歪了。"],["I wear glasses for driving.","我开车时戴眼镜。"]]},{"l":"h.i.s","p":"h.ɪ.z","cn":"他的","s":[["His mother always takes his part.","他母亲总是向着他。"],["No one doubted his ability, his industry or his integrity.","没有人怀疑他的能力、勤奋和正直。"],["His mother has been at his bedside throughout his illness.","在他生病期间，他母亲一直守候在他床边。"]]},{"l":"or","p":"ɔː","cn":"或者；还是","s":[["I don't drink whisky or brandy or any other spirits.","我不喝威士忌和白兰地，也不喝其他烈性酒。"],["It was law or classics – I mean English or classics.","那是法律或者古典文学–我是说，英语或者古典文学。"],["This guy, his name was Briarly or Beardly or something.","这个家伙，他的名字叫布赖尔利，或比亚特利，或跟这差不多的。"]]},{"l":"r.igh.t","p":"r.aɪ.t","cn":"正确的","s":[["That's absolutely right.","那是完全正确的。"],["You're absolutely right.","你完全正确。"],["Is everything all right?","一切都好吗？"]]},{"l":"h.a.t","p":"h.æ.t","cn":"帽子","s":[["I look ridiculous in this hat.","我戴这顶帽子看上去很可笑。"],["He wouldn't take his hat off.","他不愿脱下他的帽子。"],["She pulled her hat straight.","她把帽子拉正了。"]]},{"l":"h.er","p":"h.ɜː","cn":"她的","s":[["Her insolence cost her her job.","她的蛮横态度使她丢了工作。"],["Her background militates against her.","她的背景妨碍了她。"],["Her hair hung down her back to her waist.","她的长发披在背上直垂腰际。"]]}]},{"name":"Unit 4 My home","words":[{"l":"b.e.d/r.oo.m","p":"ˈb.e.d/r.uː.m","cn":"卧室","s":[["The main bedroom is enormous.","主卧室大极了。"],["Her bedroom curtains were drawn.","她卧室的窗帘拉上了。"],["We have an extension in the bedroom.","我们的卧室里有一个分机。"]]},{"l":"l.i.v/i.ng r.oo.m","p":"ˈl.ɪ.v/ɪ.ŋ r.uː.m","cn":"客厅","s":[["The living room is tiny.","这间起居室极小。"],["I'd like the use of your living room, if I may.","如果可以，我想用用你的起居室。"],["The living room is pockmarked with bullet holes.","起居室墙壁上坑坑洼洼地布满了弹孔。"]]},{"l":"s.t.u.d/y","p":"ˈs.t.ʌ.d/i","cn":"书房","s":[["She was accepted to study music.","她获准学习音乐。"],["Kids would rather play than study.","孩子们宁愿玩而不愿学习。"],["This study builds on earlier work.","这项研究是在以往工作的基础上进行的。"]]},{"l":"k.i.tch/e.n","p":"ˈk.ɪ.tʃ/ɪ.n","cn":"厨房","s":[["Her kitchen was kept immaculate.","她的厨房保持得一尘不染。"],["Set the kitchen timer going.","启动厨房定时器。"],["We ate at the kitchen table.","我们在厨房里的桌子上吃饭。"]]},{"l":"b.a.th/r.oo.m","p":"ˈb.ɑː.θ/r.uː.m","cn":"浴室；卫生间","s":[["The bathroom floor was awash.","浴室地板浸在水中。"],["I went next door to the bathroom.","我进了隔壁的洗手间。"],["Are you done hogging the bathroom?","你要霸占浴室到什么时候？"]]},{"l":"b.e.d","p":"b.e.d","cn":"床","s":[["She lay in bed, contemplating.","她躺在床上冥思苦想。"],["It's such a comfortable bed.","这床真舒服。"],["The bed springs twanged.","这床的弹簧嘣嘣响。"]]},{"l":"ph.o.n.e","p":"f.əʊ.n.-","cn":"电话","s":[["That phone never stops ringing!","那个电话没有不响的时候！"],["Could you phone back later?","您过一会儿再打电话来好吗？"],["My phone number is 266998.","我的电话号码是266998。"]]},{"l":"t.a/b.le","p":"ˈt.eɪ/b.l","cn":"桌子","s":[["He thumped the table angrily.","他愤怒地用拳捶击桌子。"],["The table is six feet long.","那张桌子长六英尺。"],["I'll just wipe the table.","我只擦擦桌子。"]]},{"l":"s.o/f.a","p":"ˈs.əʊ/f.ə","cn":"沙发","s":[["They were snogging on the sofa.","他们正在沙发上接吻。"],["She was reclining on a sofa.","她倚靠在沙发上。"],["The sofa also functions as a bed.","这沙发还可当床用。"]]},{"l":"f.r.i.dge","p":"f.r.ɪ.dʒ","cn":"冰箱","s":[["The fridge was completely bare.","电冰箱里什么也没有。"],["The fridge is stuffed to bursting.","冰箱满得都快撑破了。"],["There's nothing much in the fridge.","冰箱里没什么东西了。"]]},{"l":"f.i.n.d","p":"f.aɪ.n.d","cn":"找到","s":[["I find cooking very relaxing.","我发现烹饪非常令人放松。"],["I find their views detestable.","我认为他们的观点很可恶。"],["You'll find some in the drawer.","你会在抽屉里找到一些。"]]},{"l":"th.e.m","p":"ð.e.m","cn":"他们；她们；它们","s":[["I will explain to them that I can't pay them.","我会向他们解释说我无法付钱给他们。"],["He would barge into them and kick them in the shins.","他会冲撞他们，踢他们的小腿。"],["The cabs cut in front of them, trying to box them in.","出租车超车跑在他们前面，试图堵住他们。"]]}]},{"name":"Unit 5 Dinner's ready","words":[{"l":"b.ee.f","p":"b.iː.f","cn":"牛肉","s":[["The nation also exports beef.","该国也出口牛肉。"],["Pete gobbled all the beef stew.","皮特狼吞虎咽地吃完了所有的炖牛肉。"],["She served him a bowl of beef stew.","她给他端了一碗炖牛肉。"]]},{"l":"ch.i.ck/e.n","p":"ˈtʃ.ɪ.k/ɪ.n","cn":"鸡肉","s":[["The priest sacrificed a chicken.","牧师献祭了一只鸡。"],["The chicken was only half cooked.","鸡只煮了半熟。"],["Andrew began to carve the chicken.","安德鲁动手切鸡肉。"]]},{"l":"n.oo/d.le.s","p":"ˈn.uː/d.l.z","cn":"面条","s":[["Would you prefer rice or noodles?","你喜欢吃米饭还是面条？"],["There are restaurants, both humble and expensive, that specialize in noodles.","既有普通的也有昂贵的专营面条的餐馆。"],["I cooked noodles yesterday.","我昨天做了面条。"]]},{"l":"s.ou.p","p":"s.uː.p","cn":"汤","s":[["The soup has very little taste.","这汤没什么味道。"],["He was stirring a pot of soup.","他当时在搅一锅汤。"],["There's a hair in my soup.","我的汤里有根毛。"]]},{"l":"v.e.g.e/t.a/b.le","p":"ˈv.e.dʒ.-/t.ə/b.l","cn":"蔬菜","s":[["Severe brain damage turned him into a vegetable.","严重的脑损伤使他变成了植物人。"],["The vegetable harvest is disastrously behind schedule.","蔬菜收割灾难性地滞后于计划。"],["Peas, beans and lentils are a good source of vegetable protein.","豌豆、豆荚和扁豆是植物蛋白质的大好来源。"]]},{"l":"ch.o.p/s.t.i.ck.s","p":"ˈtʃ.ɒ.p/s.t.ɪ.k.s","cn":"筷子","s":[["These chopsticks are beautiful!","这些筷子真漂亮！"],["He buys some Chinese chopsticks.","他买了一些中国的筷子。"],["Don't bite the chopsticks.","不要咬筷子。"]]},{"l":"b.ow.l","p":"b.əʊ.l","cn":"碗","s":[["She served him a bowl of beef stew.","她给他端了一碗炖牛肉。"],["I have a bowl of cereal every morning.","我每天早上吃一碗麦片粥。"],["The glass bowl smashed into a thousand pieces.","玻璃碗咣的一声摔了个粉碎。"]]},{"l":"f.or.k","p":"f.ɔː.k","cn":"叉子","s":[["She stabbed the air with her fork.","她用叉子在空中比画。"],["She popped a balloon with her fork.","她用叉子把气球砰的一声戳爆了。"],["He poked at the spaghetti with a fork.","他用叉子拨弄着面条。"]]},{"l":"k.n.i.f.e","p":"-.n.aɪ.f.-","cn":"刀","s":[["He was wielding a large knife.","他挥舞着一把大刀。"],["This knife needs sharpening.","这把刀需要磨了。"],["The knife sliced his jacket.","那把刀划破了他的上衣。"]]},{"l":"s.p.oo.n","p":"s.p.uː.n","cn":"勺子","s":[["She licked the spoon clean.","她把调羹舔得干干净净。"],["He stirred his coffee with a spoon.","他用匙搅了搅咖啡。"],["She licked the honey off the spoon.","她舔光了调羹上的蜂蜜。"]]},{"l":"d.i.n/n.er","p":"ˈd.ɪ.n/-.ə","cn":"晚餐；正餐","s":[["Dinner was in two sittings.","晚餐有两个就餐时段。"],["I puked up my dinner.","我把吃的饭都吐了。"],["It's time for dinner.","该吃饭了。"]]},{"l":"r.ea.d/y","p":"ˈr.e.d/i","cn":"准备好的","s":[["Everybody ready? It's showtime!","大家都准备好了吗？开演！"],["She's upstairs getting ready.","她在楼上做准备。"],["They're ready for the off.","他们准备起跑了。"]]},{"l":"h.e.l.p y.our/s.e.l.f","p":"h.e.l.p j.ɔː/ˈs.e.l.f","cn":"请自便（随便吃）","s":[["There's bread on the table. Help yourself.","桌上有面包。你自己拿吧。"],["If you want another drink, just help yourself.","你要是想再喝一杯就请自便。"],["Help yourself, please!","请自便！"]]},{"l":"p.a.ss","p":"p.ɑː.s","cn":"递；给","s":[["She timed the pass perfectly.","她传球的时机掌握得恰到好处。"],["He's determined to pass this time.","这一回他决心要考及格。"],["She stepped aside to let them pass.","她闪到一边让他们过去。"]]},{"l":"t.r.y","p":"t.r.aɪ","cn":"尝试","s":[["Let's try to plan further ahead.","咱们尽量计划得更长远些。"],["Try to forget about what happened.","尽量不再想发生过的事情。"],["You had a darn good try.","你这一试再好不过了。"]]}]},{"name":"Unit 6 Meet my family!","words":[{"l":"p.a/r.e.n.t.s","p":"ˈp.eə/r.ə.n.t.s","cn":"父母","s":[["Her parents seemed very amiable.","她的父母好像很和蔼可亲。"],["My parents were very strict.","我的父母曾非常严厉。"],["Children need their parents.","孩子们需要父母。"]]},{"l":"c.ou.s/i.n","p":"ˈk.ʌ.z/-.n","cn":"堂（表）兄弟姐妹","s":[["Eric was my cousin Edward's boy.","埃里克是我堂兄爱德华的儿子。"],["She's my cousin.","她是我的表妹。"],["I tried again to get ahold of my cousin Joan.","我又试着联系了一次我表姐琼。"]]},{"l":"u.n/c.le","p":"ˈʌ.ŋ/k.l","cn":"叔叔；舅舅","s":[["My uncle taught me to juggle.","我叔叔教我玩杂耍。"],["My Uncle Jim had a high fever.","我的叔叔吉姆发高烧了。"],["I'm going to visit my uncle.","我要去看我舅舅。"]]},{"l":"au.n.t","p":"ɑː.n.t","cn":"阿姨；姑姑","s":[["We were chaperoned by our aunt.","我们由姨妈陪护。"],["He was brought up by his aunt.","他是由姨妈带大的。"],["Aunt Emilie darned old socks.","埃米莉阿姨把旧袜子补好了。"]]},{"l":"b.a/b.y b.r.o.th/er","p":"ˈb.eɪ/b.i ˈb.r.ʌ.ð/ə","cn":"小弟弟","s":[["The two sisters will look after their baby brother when their mother isn't at home.","妈妈不在家时，这两姐妹将照看她们的小弟弟。"],["I can remember the precise moment when my daughter came to see me and her new baby brother in the hospital.","我还记得我女儿来医院看望我和她刚出生的弟弟的那确切的一刻。"],["You've got a baby brother and a baby sister.","你有一个小弟弟和一个小妹妹。"]]},{"l":"d.o.c/t.or","p":"ˈd.ɒ.k/t.ə","cn":"医生","s":[["She married a Bengali doctor.","她和一个孟加拉医生结婚了。"],["The doctor tested her reflexes.","医生检测了她的反射动作。"],["The doctor said so himself.","是医生本人这么说的。"]]},{"l":"c.oo.k","p":"k.ʊ.k","cn":"厨师；做饭","s":[["It's your turn to cook dinner.","该你做饭了。"],["Where did you learn to cook?","你在哪里学的烹调？"],["Who's going to cook supper?","谁来做晚饭？"]]},{"l":"d.r.i/v.er","p":"ˈd.r.aɪ/v.ə","cn":"司机","s":[["He yelled at the other driver.","他冲着另一位司机大叫。"],["The driver was killed instantly.","司机当场死亡。"],["The driver suffered head injuries.","司机头部受伤。"]]},{"l":"f.ar.m/er","p":"ˈf.ɑː.m/ə","cn":"农民","s":[["There once was a poor farmer who had four sons.","从前有一个贫苦的农夫，他有四个儿子。"],["A farmer is entitled to a certain particularized tax treatment.","农民能够享受某种具体的税收待遇。"],["At first glance, organic farming looks much more expensive for the farmer.","乍一看，有机耕作对农民来说似乎昂贵得多。"]]},{"l":"n.ur.s.e","p":"n.ɜː.s.-","cn":"护士","s":[["The nurse cleaned the wound.","护士清洗了伤口。"],["The nurse washed and shaved him.","护士给他洗了脸，刮了胡子。"],["The nurse mopped his fevered brow.","护士擦拭了他发烫的前额。"]]},{"l":"p.eo/p.le","p":"ˈp.iː/p.l","cn":"人；人们","s":[["People were talking animatedly.","人们热烈地交谈着。"],["Seventy people were killed.","70人丧生。"],["People idealize the past.","人们总是把过去理想化。"]]},{"l":"b.u.t","p":"b.ʌ.t","cn":"但是","s":[["'But why?' he interpolated.","“但为什么？”他插嘴问。"],["I'm married, but we're separated.","我已婚，但是我们分居了。"],["But that's not possible!","但那是不可能的！"]]},{"l":"l.i.t/t.le","p":"ˈl.ɪ.t/-.l","cn":"小的","s":[["The little dog yapped frantically.","那只小狗狂吠着。"],["You stupid little bitch!","你这个愚蠢的小悍妇！"],["They looked like little ragamuffins.","他们看着像一群小叫花子。"]]},{"l":"p.u.p/p.y","p":"ˈp.ʌ.p/-.i","cn":"小狗","s":[["A puppy stepped in the fresh cement.","一只小狗走到新铺的水泥路面上。"],["She can bring her puppy to school for show-and-tell.","她可以带着自己的小狗去学校上展示讲述活动课。"],["The children squealed with delight when they saw the puppy.","孩子们看到小狗时高兴得大声尖叫。"]]},{"l":"f.oo.t/b.a.ll p.l.ay/er","p":"ˈf.ʊ.t/b.ɔː.l ˈp.l.eɪ/ə","cn":"足球运动员","s":[["He's the best football player I've ever coached.","他是我训练过的最出色的足球运动员。"],["He broke in as a football player.","他开始当一名足球运动员。"],["Are you a football player?","你是足球队员吗？"]]},{"l":"j.o.b","p":"dʒ.ɒ.b","cn":"工作","s":[["Her job is multifaceted.","她的工作涉及许多方面。"],["Meg loves her job.","梅格热爱她的工作。"],["She likes her job.","她爱她的工作。"]]},{"l":"b.a.s/k.e.t/b.a.ll","p":"ˈb.ɑː.s/k.ɪ.t/b.ɔː.l","cn":"篮球","s":[["I enjoy playing basketball.","我喜欢打篮球。"],["He coaches basketball and soccer.","他执教篮球和足球。"],["She knows a lot about basketball.","她对篮球很有研究。"]]}]}]},{"id":"4b","name":"四年级下册","units":[{"name":"Unit 1 My school","words":[{"l":"f.ir.s.t f.l.oor","p":"f.ɜː.s.t f.l.ɔː","cn":"一楼","s":[["Our family lives on the first floor.","我们家住在二楼。"],["In America, it's the first floor.","在美国，这一层则被称为一楼。"],["I live on the first floor.","我住在一楼。"]]},{"l":"s.e.c/o.n.d f.l.oor","p":"ˈs.e.k/ə.n.d f.l.ɔː","cn":"二楼","s":[["The spare bedroom is on the second floor.","闲置的卧室在2楼。"],["The spacious living quarters were on the second floor.","宽敞的起居间在二楼。"],["Their offices are on the second floor of Chester House.","他们的办公室在切斯特大厦三楼。"]]},{"l":"t.ea.ch/er.'s o.f/f.i.c.e","p":"ˈt.iː.tʃ/ə.z ˈɒ.f/-.ɪ.s.-","cn":"教师办公室","s":[["Who will clean the teacher's office?","谁会打扫教师办公室？"],["We went into the teacher's office quietly.","我们静静地进入老师的办公室里。"],["You can find them at the teacher's office.","你可以在教师办公室找到他们。"]]},{"l":"l.i/b.r.a/r.y","p":"ˈl.aɪ/b.r.ə/r.i","cn":"图书馆","s":[["The library is all on one level.","图书馆全部在同一层楼上。"],["The new library is close to completion.","新图书馆快要竣工了。"],["Radios are not permitted in the library.","图书馆内不许使用收音机。"]]},{"l":"p.l.ay/g.r.ou.n.d","p":"ˈp.l.eɪ/ɡ.r.aʊ.n.d","cn":"操场","s":[["Sam pushed me over in the playground.","萨姆在运动场上把我推倒了。"],["The girls were skipping in the playground.","姑娘们在操场上跳绳。"],["The resort is a playground of the rich and famous.","这个度假胜地是富翁名流的娱乐场所。"]]},{"l":"c.o.m/p.u/t.er r.oo.m","p":"k.ə.m/ˈp.juː/t.ə r.uː.m","cn":"计算机房","s":[["Please visit our computer room first.","请首先访问我们的计算机房。"],["The computer room is very big.","电脑室很大。"],["Has she got a computer room?","她有微机室吗？"]]},{"l":"ar.t r.oo.m","p":"ɑː.t r.uː.m","cn":"美术教室","s":[["In my school, there is an art room.","在我学校里有一个美术教室。"],["Where is the art room?","绘画教室在哪里？"],["We have an art room on the first floor.","我们有个美术教室在一层。"]]},{"l":"m.u/s.i.c r.oo.m","p":"ˈm.juː/z.ɪ.k r.uː.m","cn":"音乐教室","s":[["The music room had been made to reflect and deepen sounds.","音乐室被打造成可以产生回音并使声音变得低沉。"],["We are cleaning the music room.","我们正在打扫音乐教室。"],["On which side is the music room?","音乐教室在哪一边？"]]},{"l":"n.e.x.t t.o","p":"n.e.ks.t t.uː","cn":"紧挨着","s":[["The commons is next to the gym.","学生公共食堂在体育馆的旁边。"],["The seat next to him was vacant.","他旁边的座位空着。"],["We sat next to each other.","我们紧挨着坐在一起。"]]},{"l":"h.o.m.e/w.or.k","p":"ˈh.əʊ.m.-/w.ɜː.k","cn":"家庭作业","s":[["How much homework do you get?","你有多少家庭作业？"],["He let us off homework today.","他今天免了我们的家庭作业。"],["I'll do my homework after supper.","晚饭后我要做家庭作业。"]]},{"l":"c.l.a.ss","p":"k.l.ɑː.s","cn":"班级；课","s":[["He's always cutting class.","他总是旷课。"],["The class reassembled after lunch.","午饭后，全班同学又集合起来。"],["The food was first-class.","这些食物是一流的。"]]},{"l":"f.or/t.y","p":"ˈf.ɔː/t.i","cn":"四十","s":[["Fifty is the new forty.","四十尚未老，五十正当年。"],["My car does forty miles to the gallon.","我的车每加仑汽油跑四十英里。"],["You can't live on forty pounds a week.","你靠每周四十英镑没法过活。"]]},{"l":"w.ay","p":"w.eɪ","cn":"路；方向","s":[["He continued on his way.","他继续走他的路。"],["The doctor's on his way.","医生正在路上。"],["It's way past your bedtime.","你早该睡觉了。"]]}]},{"name":"Unit 2 What time is it?","words":[{"l":"b.r.ea.k/f.a.s.t","p":"ˈb.r.e.k/f.ə.s.t","cn":"早餐","s":[["Your breakfast is coming soon.","你的早餐很快就到。"],["The men ate a hearty breakfast.","男士们吃了一顿丰盛的早餐。"],["I haven't eaten since breakfast.","早饭以后我还没吃过东西呢。"]]},{"l":"E.n.g/l.i.sh c.l.a.ss","p":"ˈɪ.ŋ.ɡ/l.ɪ.ʃ k.l.ɑː.s","cn":"英语课","s":[["It's our second English class.","这是我们第二节英语课。"],["Shall we go to English class?","我们要去上英语课吗？"],["You have an English class.","你有一节英语课。"]]},{"l":"l.u.n.ch","p":"l.ʌ.n.tʃ","cn":"午餐","s":[["The court adjourned for lunch.","午餐时间法庭休庭。"],["When's lunch? I'm famished!","什么时候吃午饭？我饿得要死了！"],["Who's getting the lunch?","谁在做中午饭？"]]},{"l":"m.u/s.i.c c.l.a.ss","p":"ˈm.juː/z.ɪ.k k.l.ɑː.s","cn":"音乐课","s":[["What can you do in music class?","在音乐课上你能做什么？"],["I used to hate music class.","我过去讨厌音乐课。"],["I'll have a music class tomorrow.","我明天有一节音乐课。"]]},{"l":"P/E c.l.a.ss","p":"ˌpiː/ˈiː k.l.ɑː.s","cn":"体育课","s":[["In the film McFarland, USA, coach White notices some talented runners in his PE class.","在美国电影《麦克法兰》中，怀特教练在他的体育课上注意到一些有天赋的跑步者。"],["In order to encourage me, he said that if I took part in the race, I would get the highest mark for the terms of PE class.","为了鼓励我，他说如果我参加比赛，我将在这学期的体育课上取得最高分。"],["When do you have a PE class?","你何时有体育课？"]]},{"l":"d.i.n/n.er","p":"ˈd.ɪ.n/-.ə","cn":"晚餐","s":[["Dinner was in two sittings.","晚餐有两个就餐时段。"],["I puked up my dinner.","我把吃的饭都吐了。"],["It's time for dinner.","该吃饭了。"]]},{"l":"g.e.t u.p","p":"ɡ.e.t ʌ.p","cn":"起床","s":[["\"Brigid!\" she screamed. \"Get up!\"","“布里吉德！”她尖声叫道。“起床！”"],["I generally get up at six.","我一般六点钟起床。"],["We've got to get up early, all right?","我们得早起床，可以吧？"]]},{"l":"g.o t.o s.ch.oo.l","p":"ɡ.əʊ t.uː s.k.uː.l","cn":"去上学","s":[["She will have to go to school.","她将不得不去上学。"],["You've got to go to school, whether you like it or not.","不管你喜欢不喜欢，你得上学。"],["Some children can read and write before they go to school.","有些孩子在上学前就会看书写字了。"]]},{"l":"g.o h.o.m.e","p":"ɡ.əʊ h.əʊ.m.-","cn":"回家","s":[["Come on, it's time to go home.","快点，该回家了。"],["Let's go home—it's getting late.","咱们回家吧，时间不早了。"],["Come (my) dearest, let's go home.","好啦，亲爱的，咱们回家吧。"]]},{"l":"g.o t.o b.e.d","p":"ɡ.əʊ t.uː b.e.d","cn":"上床睡觉","s":[["You'd better go to bed and nurse that cold.","你最好上床睡觉，把感冒治好。"],["I think it's time to go to bed.","我想该睡觉了。"],["She was the last to go to bed.","她是最后一个睡觉的人。"]]},{"l":"o/v.er","p":"ˈəʊ/v.ə","cn":"结束","s":[["He's over 50.","他已年过半百。"],["Over the last decade, auto theft has increased by over 56 percent.","过去的10年来汽车盗窃案上升了56％以上。"],["He plays the same songs over and over.","他反复演奏同样的几首歌曲。"]]},{"l":"n.ow","p":"n.aʊ","cn":"现在","s":[["She's in kindergarten now.","她现在在上幼儿园。"],["Everything's A-OK now.","现在一切都妥帖了。"],["What's the score now?","现在比分是多少？"]]},{"l":"o.'/c.l.o.ck","p":"ə.-/ˈk.l.ɒ.k","cn":"……点钟","s":[["It's gone six o'clock already.","过了六点了。"],["Wake up! It's eight o'clock.","醒醒吧！已经八点钟了。"],["I waited while six o'clock.","我一直等到了六点钟。"]]},{"l":"k.i.d","p":"k.ɪ.d","cn":"小孩","s":[["He liked to kid Ingrid a lot.","他很喜欢戏弄英格里德。"],["She's a bright kid.","她是个聪明孩子。"],["'Oh, she's just a kid,' he said scathingly.","“咳，她还是个孩子呢。”他尖刻地挖苦道。"]]},{"l":"th.ir/t.y","p":"ˈθ.ɜː/t.i","cn":"三十","s":[["By sunset we had covered thirty miles.","到日落时我们已走了三十英里。"],["Some thirty people attended the funeral.","大约有三十人参加了葬礼。"],["Six goes into thirty five times.","6除30得5。"]]},{"l":"h.u.r/r.y u.p","p":"ˈh.ʌ.r/-.i ʌ.p","cn":"快点","s":[["For Gawd's sake hurry up!","看在上帝的份上快点吧！"],["Oh you're so slow; come on, hurry up!","哎哟，你可真慢；加把劲，快点！"],["I wish the bus would hurry up and come.","我希望公共汽车能快点来。"]]},{"l":"c.o.m.e o.n","p":"k.ʌ.m.- ɒ.n","cn":"快点；加油","s":[["Come on! Quick! They'll see us!","快点吧！快！他们会看见我们的！"],["Come on, darling, we'll be late.","快点，亲爱的，我们要迟到了。"],["Come on, it's time we left.","快点，我们该走了。"]]},{"l":"j.u.s.t a m.i.n/u.t.e","p":"dʒ.ʌ.s.t ə ˈm.ɪ.n/ɪ.t.-","cn":"稍等一会儿","s":[["Could you hold for just a minute?","你能等一分钟不挂断吗？"],["OK, wait just a minute.","好的，稍微等一下。"],["Just a minute. Hold the line, please.","稍等一下，请别挂线。"]]}]},{"name":"Unit 3 Weather","words":[{"l":"c.o.l.d","p":"k.əʊ.l.d","cn":"寒冷的","s":[["It's darn cold tonight.","今天晚上冷得要命。"],["It was bitterly cold.","天气冷得刺骨。"],["I like cold weather.","我喜欢寒冷的天气。"]]},{"l":"c.oo.l","p":"k.uː.l","cn":"凉爽的","s":[["She seemed very cool and unemotional.","她显得十分冷静。"],["The house was refreshingly cool inside.","屋内清凉宜人。"],["That's a cool hat.","那是一顶很酷的帽子。"]]},{"l":"w.ar.m","p":"w.ɔː.m","cn":"温暖的","s":[["It was nice and warm yesterday.","昨天的天气暖洋洋的。"],["It's nice and warm in here.","这里暖烘烘的。"],["We huddled together to keep warm.","我们挤在一起来保暖。"]]},{"l":"h.o.t","p":"h.ɒ.t","cn":"炎热的","s":[["He felt uncomfortably hot.","他感到热得难受。"],["It's hot out – very hot, very humid.","外面热烘烘的–非常热，非常潮湿。"],["The sun was blazing hot.","阳光灼热逼人。"]]},{"l":"s.u.n/n.y","p":"ˈs.ʌ.n/-.i","cn":"晴朗的","s":[["It's a brilliantly sunny morning.","这是个阳光灿烂的早晨。"],["It was brilliantly sunny.","阳光明媚。"],["It's bound to be sunny again tomorrow.","明天肯定又是阳光灿烂。"]]},{"l":"w.i.n.d/y","p":"ˈw.ɪ.n.d/i","cn":"有风的","s":[["It was windy and Jake felt cold.","风很大，杰克觉得很冷。"],["It was very wet and windy the day I drove over the hill to Del Norte.","我开车越过小山去德尔诺特的那天下大雨又刮大风。"],["When it's windy, I fly a kite.","当天刮风的时候，我放风筝。"]]},{"l":"c.l.ou.d/y","p":"ˈk.l.aʊ.d/i","cn":"多云的","s":[["Tonight will be cloudy.","今天夜间多云。"],["It's cloudy this afternoon.","今天下午多云。"],["It's cloudy in Singapore.","新加坡多云。"]]},{"l":"s.n.ow/y","p":"ˈs.n.əʊ/i","cn":"下雪的","s":[["We strode across the snowy fields.","我们大步流星地穿过雪封的旷野。"],["The weather is snowy here.","这里是下雪天。"],["I hate the snowy winters.","我讨厌下雪的冬日。"]]},{"l":"r.ai.n/y","p":"ˈr.eɪ.n/i","cn":"下雨的","s":[["The rainy season in the Andes normally starts in December.","安第斯山脉的雨季一般从12月开始。"],["It was rainy yesterday.","昨天是雨天。"],["Tomorrow will be rainy.","明天将下雨。"]]},{"l":"ou.t/s.i.d.e","p":"ˌaʊ.t/ˈs.aɪ.d.-","cn":"在外面","s":[["It's absolutely freezing outside.","外面冷得不得了。"],["It's freezing cold outside.","外面极为寒冷。"],["I heard footsteps outside.","我听到外面的脚步声。"]]},{"l":"b.e c.are/f.u.l","p":"b.i ˈk.eə/f.ə.l","cn":"小心","s":[["Be careful—the plates are hot.","当心—盘子烫手。"],["Be careful—it has a sharp edge.","小心点—这刀刃很锋利。"],["'Be careful!' he yelled.","他大叫道：“当心！”"]]},{"l":"w.ea.th/er","p":"ˈw.e.ð/ə","cn":"天气","s":[["The weather gradually improved.","天气逐渐好转。"],["What blooming awful weather!","多糟糕的天气！"],["Isn't the weather atrocious?","天气不是糟透了吗？"]]},{"l":"N.ew Y.or.k","p":"n.juː j.ɔː.k","cn":"纽约","s":[["You live in New York, don't you?","你住在纽约，不是吗？"],["It's my first visit to New York.","这是我第一次访问纽约。"],["Their head office is in New York.","他们的总部在纽约。"]]},{"l":"h.ow a/b.ou.t","p":"h.aʊ ə/ˈb.aʊ.t","cn":"……怎么样？","s":[["I'm not going. How about you?","我不打算去。你呢？"],["How about Ruth? Have you heard from her?","露丝怎么样了？你有她的消息吗？"],["Well, I enjoyed that. How about you two?","嗯，我很喜欢那个。你俩觉得呢？"]]},{"l":"d.e/g.r.ee","p":"d.ɪ/ˈɡ.r.iː","cn":"度（温度）","s":[["She's reading for a law degree.","她在攻读法学学位。"],["He studied French to degree level.","他的法语学到了拿学位的水平。"],["I'm hoping to do a chemistry degree.","我希望攻读化学学位课程。"]]},{"l":"w.or.l.d","p":"w.ɜː.l.d","cn":"世界","s":[["I advance across the wide world, through all the truths of the world.","我在广阔的天地里前进，穿越世界的真理。"],["Kasparov became world champion.","卡斯帕罗夫成了世界冠军。"],["She has three world titles.","她已获得三项世界冠军。"]]},{"l":"L.o.n/d.o.n","p":"ˈl.ʌ.n/d.ə.n","cn":"伦敦","s":[["There are two codes for London.","伦敦有两个电话区号。"],["The play took London by storm.","这部剧很快就风靡伦敦。"],["We used to live in London.","我们过去住在伦敦。"]]},{"l":"M.o.s/c.ow","p":"ˈm.ɒ.s/k.əʊ","cn":"莫斯科","s":[["They are filming in Moscow right now.","目前他们正在莫斯科拍电影。"],["It's eleven o'clock at night in Moscow.","现在莫斯科是晚上11点。"],["It's been bitterly cold here in Moscow.","在莫斯科这里，天气一直极其寒冷。"]]},{"l":"S.i.ng/a/p.ore","p":"ˌs.ɪ.ŋ/ə/ˈp.ɔː","cn":"新加坡","s":[["I transferred at Bahrain for a flight to Singapore.","我在巴林转乘飞往新加坡的班机。"],["The cargo was due to be offloaded in Singapore three days later.","这艘货轮本定于3天后在新加坡卸载。"],["Punctually at 7:45, the express to Kuala Lumpur left Singapore station.","开往吉隆坡的特快列车7：45准时从新加坡站驶出。"]]},{"l":"S.y.d/n.ey","p":"ˈs.ɪ.d/n.i","cn":"悉尼","s":[["News Corporation was headquartered in Sydney.","新闻集团的总部设在悉尼。"],["Sydney is one of the world's must-see cities.","悉尼是世界上的必游城市之一。"],["In the morning Mr. McDonald departed for Sydney.","麦克唐纳先生早上起程去了悉尼。"]]},{"l":"f.l.y","p":"f.l.aɪ","cn":"飞","s":[["She is licensed to fly solo.","她已获准单飞。"],["She brushed the fly away.","她挥手赶走了苍蝇。"],["A fly landed on his nose.","一只苍蝇落在他的鼻子上。"]]},{"l":"l.o.v.e","p":"l.ʌ.v.-","cn":"爱","s":[["I love my country as you love yours.","我热爱我的国家，就像你热爱你的国家一样。"],["Kids love dressing up.","孩子们都喜欢装扮成别人玩儿。"],["I love to bake.","我喜欢烤点心。"]]}]},{"name":"Unit 4 At the farm","words":[{"l":"t.o/m.a/t.o","p":"t.ə/ˈm.ɑː/t.əʊ","cn":"西红柿","s":[["It's similar in size to a tomato.","大小和西红柿差不多。"],["The tomato hit the wall with a splat.","西红柿啪的一声打在墙上。"],["Norman cut open his pie and squirted tomato sauce into it.","诺曼切开他的馅饼，往里面挤了番茄酱。"]]},{"l":"p.o/t.a/t.o","p":"p.ə/ˈt.eɪ/t.əʊ","cn":"土豆","s":[["The boiled potato was mealy.","这个煮土豆干巴巴的。"],["On the menu is wiener schnitzel and potato salad.","菜单上有维也纳炸小牛排和土豆沙拉。"],["All main courses are served with chips or baked potato.","所有的主菜都配有炸土豆条或烤土豆。"]]},{"l":"g.r.ee.n b.ea.n.s","p":"ɡ.r.iː.n b.iː.n.z","cn":"豆角","s":[["Each of us chose from the many pots of tomato juice, green beans and jelly.","我们每个人都从许多罐番茄汁、青豆和果冻中挑选。"],["Green beans are one of the healthiest foods you can eat during the holidays (or any time of year).","青豆是你在假期（或一年中的任何时候）可以吃的最健康的食物之一。"],["You can save up to $23 per plant by building an edible garden with big-ticket vegetables like tomatoes, cucumbers, and green beans.","你可以用西红柿、黄瓜和青豆等高价蔬菜建造一个可食用的菜园，这样每株植物可以节省23美元。"]]},{"l":"c.a.r/r.o.t","p":"ˈk.æ.r/-.ə.t","cn":"胡萝卜","s":[["Her carrot cake is divine.","她的胡萝卜饼好吃极了。"],["It's never a carrot or a peach.","从来没有胡萝卜或桃子。"],["The carrot is his favorite vegetable.","胡萝卜是他最喜欢的蔬菜。"]]},{"l":"h.or.s.e","p":"h.ɔː.s.-","cn":"马","s":[["This horse needs firm handling.","这匹马需要严加训练。"],["The horse plunged and reared.","马猛然跃起，用后腿直立。"],["Madigan's horse pawed the ground.","马迪根的马刨了地。"]]},{"l":"c.ow","p":"k.aʊ","cn":"奶牛","s":[["A cow stood on the tracks.","一头奶牛站在铁轨上。"],["A mature cow has horns.","成年母牛头上长有角。"],["The cow says \"moo-moo.\"","奶牛“哞哞”叫。"]]},{"l":"sh.ee.p","p":"ʃ.iː.p","cn":"绵羊","s":[["Sheep were grazing in the fields.","羊在野地里吃草。"],["They kept a small flock of sheep.","他们养了一小群绵羊。"],["The field had been grazed by sheep.","这块地羊已经啃过了。"]]},{"l":"h.e.n","p":"h.e.n","cn":"母鸡","s":[["The hen may not be able to feed its young.","这只母鸡也许不能喂它的幼雏。"],["This allows the pair to mate properly and stops the hen from staying in the nest.","这可以使这一对正常交配同时也阻止雌禽待在窝里。"],["A chick keeps a hen busy.","一只小鸡已够母鸡忙了。"]]},{"l":"th.e.s.e","p":"ð.iː.z.-","cn":"这些","s":[["These questions frustrated me.","这些问题使我懊丧。"],["These statistics are misleading.","这些统计资料会引起误解。"],["These are minor quibbles.","这都是些微不足道的抱怨。"]]},{"l":"y.u.m","p":"j.ʌ.m","cn":"好吃","s":[["Yum, the soup is nice.","嗯~这汤很好喝。"],["I had one tonight, and yum, it is delicious!","今天晚上我就吃了一个，嗯，味道不错。"],["Here I come for breakfast! Yum!","我来吃早饭啦！好好吃呀！"]]},{"l":"a.n/i/m.a.l","p":"ˈæ.n/ɪ/m.ə.l","cn":"动物","s":[["The animal is hunted for its fur.","狩猎这种动物是为了获取其毛皮。"],["I have an allergy to animal hair.","我对动物毛过敏。"],["The animal retracted into its shell.","这只动物缩回到自己的壳里。"]]},{"l":"th.o.s.e","p":"ð.əʊ.z.-","cn":"那些","s":[["Those laws no longer pertain.","那些法律已不适用了。"],["Those look riper than these.","那些看上去比这些熟一些。"],["I planted those apple trees.","我种了那些苹果树。"]]},{"l":"g.ar/d.e.n","p":"ˈɡ.ɑː/d.ə.n","cn":"花园；菜园","s":[["The garden looked uncared for.","这花园似乎无人管理。"],["I've been digging the garden.","我一直在花园松土。"],["Having a garden is therapeutic.","有个花园能让人放松心情。"]]},{"l":"f.ar.m","p":"f.ɑː.m","cn":"农场","s":[["Whose is that farm over yonder?","那边的农场是谁的？"],["I told you. Get off the farm.","我告诉过你，离开农场。"],["Farm workers milked cows by hand.","农场工人们手工给奶牛挤奶。"]]},{"l":"g.oa.t","p":"ɡ.əʊ.t","cn":"山羊","s":[["I roped the goat to a post.","我把山羊拴在一根柱子上。"],["The goat was ritually slaughtered.","山羊按照仪式宰杀了。"],["Reaching a maximum height of 56cm the pygmy goat is essentially a pet.","这种最高只能长到56厘米的小山羊基本是作为宠物来养的。"]]},{"l":"ea.t","p":"iː.t","cn":"吃","s":[["They'll eat almost anything.","他们几乎什么都吃。"],["Where shall we eat tonight?","我们今晚在哪儿吃饭？"],["People eat when they're depressed.","人们会在沮丧时吃东西。"]]}]},{"name":"Unit 5 My clothes","words":[{"l":"c.l.o.th.e.s","p":"k.l.əʊ.ð.-.z","cn":"衣服","s":[["She wears really funky clothes.","她穿的衣服真是时髦又独特。"],["His clothes were all mussed up.","他的衣服被弄得凌乱不堪。"],["His clothes were in tatters.","他的衣服破旧不堪。"]]},{"l":"p.a.n.t.s","p":"p.æ.n.t.s","cn":"裤子","s":[["Ted, did you poop in your pants?","泰德，你是不是拉在裤子里了？"],["Don't tell me you've split another pair of pants!","你不会又把一条裤子撑破了吧！"],["She described him as wearing brown corduroy pants and a white cotton shirt.","她描述说他穿着棕色的灯芯绒长裤和一件白色的棉衬衫。"]]},{"l":"h.a.t","p":"h.æ.t","cn":"帽子","s":[["I look ridiculous in this hat.","我戴这顶帽子看上去很可笑。"],["He wouldn't take his hat off.","他不愿脱下他的帽子。"],["She pulled her hat straight.","她把帽子拉正了。"]]},{"l":"d.r.e.ss","p":"d.r.e.s","cn":"连衣裙","s":[["For lunch, dress is informal.","吃午餐可以穿着休闲装。"],["Everyone was in evening dress.","人人都身着晚礼服。"],["Don't get your dress dirty!","别把你的连衣裙弄脏了！"]]},{"l":"s.k.ir.t","p":"s.k.ɜː.t","cn":"裙子","s":[["There's a mark on your skirt.","你裙子上有一块斑。"],["The skirt has a side opening.","这裙子是侧面开口的。"],["The skirt does up at the back.","这条裙子在后面系扣。"]]},{"l":"c.oa.t","p":"k.əʊ.t","cn":"外套","s":[["I wondered whose the coat was.","我思忖着那件大衣是谁的。"],["Here, let me take your coat.","来，我帮你拿大衣。"],["The knife pierced through his coat.","刀子刺穿了他的外衣。"]]},{"l":"s.w.ea.t/er","p":"ˈs.w.e.t/ə","cn":"毛衣","s":[["The fence snagged my sweater.","栅栏把我的毛衣挂住了。"],["My sweater shrank in the wash.","我的毛衣缩水了。"],["Ferris wore a heavy knit sweater.","菲立斯穿着一件织得厚厚的毛衣。"]]},{"l":"s.o.ck","p":"s.ɒ.k","cn":"短袜","s":[["He groped around in the dark for his other sock.","他在黑暗中到处瞎摸找另一只袜子。"],["You've worn a hole in your sock.","你的袜子磨出了个洞。"],["An old hot coffee pot is on the sock.","袜子上有一个热的旧咖啡壶。"]]},{"l":"sh.or.t.s","p":"ʃ.ɔː.t.s","cn":"短裤","s":[["My shorts were chafing my thighs.","我的短裤蹭得我大腿疼。"],["She wore shorts and a halter top.","她穿一条短裤和一件颈部系带的上衣。"],["He was wearing a T-shirt and shorts.","他穿着T恤衫和短裤。"]]},{"l":"j.a.ck/e.t","p":"ˈdʒ.æ.k/ɪ.t","cn":"夹克衫","s":[["The knife sliced his jacket.","那把刀划破了他的上衣。"],["Is your jacket real leather?","你的夹克是真皮的吗？"],["I'll take the grey jacket.","我要那件灰色夹克衫。"]]},{"l":"sh.ir.t","p":"ʃ.ɜː.t","cn":"衬衫","s":[["His shirt was covered in blood.","他的衬衫沾满了血。"],["What's your shirt made of?","你的衬衣是用什么做的？"],["He peeled off his shirt.","他脱下了衬衣。"]]},{"l":"y.our.s","p":"j.ɔː.z","cn":"你的；你们的","s":[["I'd like one the same as yours.","我要一个和你一样的。"],["The job is yours for the asking.","只要开口，这份工作就是你的了。"],["The final decision is yours.","最终的决定权属于你。"]]},{"l":"wh.o.s.e","p":"h.uː.z.-","cn":"谁的","s":[["\"Whose is this?\"—\"It's mine.\"","“这是谁的？”—“是我的。”"],["I wonder whose this is.","我不知道这是谁的。"],["Whose car were they in?","他们坐在谁的车里？"]]},{"l":"m.i.n.e","p":"m.aɪ.n.-","cn":"我的","s":[["\"Whose is this?\"—\"It's mine.\"","“这是谁的？”—“是我的。”"],["He's a distant cousin of mine.","他是我远房的一个表亲。"],["Half of the money was mine.","那些钱有一半是我的。"]]},{"l":"p.a.ck","p":"p.æ.k","cn":"收拾（行李）","s":[["All joiners will receive a welcome pack.","每位入会者都会收到一个迎新包。"],["The club will send a free information pack.","俱乐部将赠送一个免费的信息包。"],["She decided to pack in her job.","她决定辞职不干了。"]]},{"l":"w.ai.t","p":"w.eɪ.t","cn":"等待","s":[["I'll wait until they arrive.","我会一直等到他们来。"],["'Wait for me!' she shrilled.","“等等我！”她尖声叫道。"],["Could you wait a moment , please?","请您稍等一下，好吗？"]]}]},{"name":"Unit 6 Shopping","words":[{"l":"g.l.o.v.e","p":"ɡ.l.ʌ.v.-","cn":"手套","s":[["She bent down to pick up her glove.","她俯身去捡手套。"],["He bit the fingers of his right glove and pulled it off.","他咬住右手手套的指套，把它扯了下来。"],["There is a hole in her glove.","她手套上有个洞。"]]},{"l":"s.c.ar.f","p":"s.k.ɑː.f","cn":"围巾","s":[["Her scarf streamed behind her.","她的围巾在身后飘动。"],["Someone has taken my scarf.","有人把我的围巾拿走了。"],["She tied her scarf over her head.","她把围巾围在头上。"]]},{"l":"u.m/b.r.e.l/l.a","p":"ʌ.m/ˈb.r.e.l/-.ə","cn":"雨伞","s":[["Her umbrella blew inside out.","她的伞被吹得往外翻了。"],["Can I borrow your umbrella?","借你的伞用一下行吗？"],["They held a large umbrella over her.","他们给她撑起一把大伞。"]]},{"l":"s.u.n/g.l.a.ss/e.s","p":"ˈs.ʌ.n/ɡ.l.ɑː.s/ɪ.z","cn":"太阳镜","s":[["These sunglasses are designed to reduce glare.","这些太阳镜是为减少刺眼的强光而设计的。"],["She sat up and removed her designer sunglasses.","她坐起来，摘掉她的时尚墨镜。"],["I wore sunglasses all the time and people thought it was an affectation.","我一直戴着墨镜，别人认为是做作。"]]},{"l":"p.r.e.t/t.y","p":"ˈp.r.ɪ.t/-.i","cn":"漂亮的","s":[["The future looks pretty black.","前景看来很暗淡。"],["The results were pretty good.","结果相当不错。"],["The exam was pretty difficult.","这场考试相当难。"]]},{"l":"e.x/p.e.n/s.i.v.e","p":"ɪ.ks/ˈp.e.n/s.ɪ.v.-","cn":"昂贵的","s":[["Food was scarce and expensive.","食物匮乏而且昂贵。"],["Skiing gear can be expensive.","滑雪用具有时会很昂贵。"],["Tickets are likely to be expensive.","入场券可能很贵。"]]},{"l":"ch.ea.p","p":"tʃ.iː.p","cn":"便宜的","s":[["It wasn't cheap. Anything but.","它不便宜。绝对不。"],["The meal was amazingly cheap.","
