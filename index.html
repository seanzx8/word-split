]]},{"l":"s.a.m.e","p":"s.eɪ.m.-","cn":"adj. 同一的；相同的","s":[["Mario said the very same thing.","马里奥说的完全是同一件事。"],["We're booked on the same flight.","我们订了同一班机的机票。"],["I would do the same again.","我愿再做同样的事。"]]},{"l":"b.a/s.i.c","p":"ˈb.eɪ/s.ɪ.k","cn":"adj. 基本的；基础的","s":[["Drums are basic to African music.","鼓是非洲音乐的基本乐器。"],["Water is a basic necessity of life.","水是一种基本生活必需品。"],["Access to justice is a basic right.","享有公正是一种基本权利。"]]},{"l":"th.ough.t","p":"θ.ɔː.t","cn":"n. 想法","s":[["I thought you'd never finish!","我还以为你会完成不了呢！"],["Whoever thought up that joke?","究竟是谁想出那个笑话的？"],["I thought I'd die laughing.","我以为我要笑死了。"]]},{"l":"g.l.a.d","p":"ɡ.l.æ.d","cn":"adj. 高兴的；愉快的","s":[["I'm glad you came along.","有你跟我一起来，我很高兴。"],["I'm so glad (that) you're safe!","你安然无恙我真高兴！"],["I'm glad hats are coming back.","我很高兴帽子再度流行起来。"]]},{"l":"r.i.s.e","p":"r.aɪ.z.-","cn":"v. 上升","s":[["I'm going to ask for a rise.","我打算要求加薪。"],["Interest rates rise from 4% to 5%.","利率从4%上升到5%。"],["Within two months Kelly got a rise.","两个月内凯利就获得了加薪。"]]},{"l":"e.n.d","p":"e.n.d","cn":"n. 结局","s":[["They live in the end house.","他们住在最后的那座房子。"],["It's the end of an era.","这是一个时代的终结。"],["This will surely end in disaster.","这无疑将以灾难告终。"]]},{"l":"h.ear.t","p":"h.ɑː.t","cn":"n. 心","s":[["Her heart raced uncontrollably.","她的心脏难以控制地急速跳动起来。"],["Fear clutched at her heart.","她突然感到一阵恐惧袭上心头。"],["Her heart beat faster.","她的心跳加快。"]]},{"l":"b.e g.oo.d a.t","p":"b.i ɡ.ʊ.d æ.t","cn":"擅长……","s":[]},{"l":"t.ur.n t.o s.o.m.e/b.o/d.y f.or h.e.l.p","p":"t.ɜː.n t.uː ˈs.ʌ.m.-/b.ə/d.i f.ɔː h.e.l.p","cn":"求助于某人","s":[]},{"l":"a.f/t.er s.ch.oo.l","p":"ˈɑː.f/t.ə s.k.uː.l","cn":"放学后","s":[]},{"l":"b.e w.i.ll/i.ng t.o d.o s.o.m.e/th.i.ng","p":"b.i ˈw.ɪ.l/ɪ.ŋ t.uː d.uː ˈs.ʌ.m.-/θ.ɪ.ŋ","cn":"愿意做某事","s":[]},{"l":"m.e/d.i/u.m h.eigh.t","p":"ˈm.iː/d.i/ə.m h.aɪ.t","cn":"中等身高","s":[]},{"l":"m.o.d/er.n d.ance","p":"ˈm.ɒ.d/ə.n d.ɑːns","cn":"现代舞","s":[]},{"l":"w.a.tch o/v.er","p":"w.ɒ.tʃ ˈəʊ/v.ə","cn":"照管；监督","s":[]},{"l":"r.i.s.e i.n/t.o","p":"r.aɪ.z.- ˈɪ.n/t.uː","cn":"上升到","s":[]},{"l":"c.r.y ou.t","p":"k.r.aɪ aʊ.t","cn":"大叫；叫喊","s":[["You cry out, don't you?","难道没有哭出来吗？"],["I stopped my ears but still heard her cry out.","我捂上耳朵，但还能听见她大声喊叫。"],["He felt so happy that he tried his best to cry out, \"Oh, my Fairy!\"","他感到很高兴，尽力叫道：“噢，我的仙女！”"]]},{"l":"c.r.y o.n.e/s.e.l.f t.o s.l.ee.p","p":"k.r.aɪ wʌ.n.-/ˈs.e.l.f t.uː s.l.iː.p","cn":"哭着入睡","s":[]},{"l":"w.a.k.e u.p","p":"w.eɪ.k.- ʌ.p","cn":"醒；醒来","s":[]},{"l":"c.o.m.e a.n.d g.o","p":"k.ʌ.m.- æ.n.d ɡ.əʊ","cn":"来去","s":[]},{"l":"t.a.k.e s.o.m.e/b.o/d.y.'s p.l.a.c.e","p":"t.eɪ.k.- ˈs.ʌ.m.-/b.ə/d.i.z p.l.eɪ.s.-","cn":"替代某人","s":[]},{"l":"c.o.m.e a/l.o.ng","p":"k.ʌ.m.- ə/ˈl.ɒ.ŋ","cn":"出现","s":[["Your French has come along a lot recently.","你的法语最近进步很大。"],["I'm not getting married in a hurry—I'm waiting for Mr Right to come along.","我不想匆忙结婚—我在等着如意郎君的出现。"],["Come along! We're late.","快点！我们迟到了。"]]}]},{"name":"Unit 2 School life","words":[{"l":"g.e/o/g.r.a/ph.y","p":"dʒ.i/ˈɒ/ɡ.r.ə/f.i","cn":"n. 地理（学）","s":[["I'm revising Geography today.","我今天复习地理。"],["Geography was my weak subject.","地理课是我的弱项。"],["I'm afraid geography is not my strong suit.","恐怕地理不是我的强项。"]]},{"l":"c.or.n/er","p":"ˈk.ɔː.n/ə","cn":"n. 角；墙角","s":[["The referee awarded a corner.","裁判员判给了一次角球。"],["She sat crouched in a corner.","她蹲坐在一个角落里。"],["He reversed around the corner.","他倒车转过拐角。"]]},{"l":"a.c/t.i.v/i/t.y","p":"æ.k/ˈt.ɪ.v/ə/t.i","cn":"n. 活动","s":[["It was a period of intense activity.","那是活动激烈的时期。"],["Parents encourage every activity imaginable.","父母鼓励一切可能的活动。"],["Economic activity often follows a cyclical pattern.","经济活动常常遵循周期性模式。"]]},{"l":"c.l.u.b","p":"k.l.ʌ.b","cn":"n. 社团","s":[["We had lunch at the golf club.","我们在高尔夫球俱乐部吃的午饭。"],["He belongs to an exclusive club.","他参加的是一个上层人士俱乐部。"],["The next player discarded a club.","接下来的那位玩家出了张梅花牌。"]]},{"l":"p.r.a.c/t.i.s.e","p":"ˈp.r.æ.k/t.ɪ.s.-","cn":"v. 练习；训练","s":[["He usually wants to practise his English on me.","他通常想跟我练习英语。"],["Practise mental arithmetic when you go out shopping.","外出购物时练习一下心算。"],["If you practise speaking English, you'll soon improve.","只要你练习说英语，很快就会进步。"]]},{"l":"s.o.l.v.e","p":"s.ɒ.l.v.-","cn":"v. 解答","s":[["It isn't going to solve a single thing.","这解决不了任何问题。"],["She tried her best to solve the problem.","她尽了最大的努力解决这个问题。"],["In itself, it's not a difficult problem to solve.","这本身并不是个难解决的问题。"]]},{"l":"d.e/v.e.l/o.p","p":"d.ɪ/ˈv.e.l/ə.p","cn":"v. 培养；发展","s":[["How fast would the disease develop?","这种疾病发展有多快？"],["We need to develop local industries.","我们需要发展地方工业。"],["These clashes could develop into open warfare.","这些冲突可能会发展成公开的战争。"]]},{"l":"s.k.i.ll","p":"s.k.ɪ.l","cn":"n. 技术；技能","s":[["They competed with skill and tenacity.","他们竞争靠的是技术和顽强意志。"],["Her job demands a high degree of skill.","她的工作要求有高超的技能。"],["He played the shot with consummate skill.","他以高超的技巧击球。"]]},{"l":"t.ee.n","p":"t.iː.n","cn":"adj. 青少年的","s":[]},{"l":"m.a.g/a/z.i.n.e","p":"ˌm.æ.ɡ/ə/ˈz.iː.n.-","cn":"n. 杂志","s":[["She used to edit a women's magazine.","她曾主编过妇女杂志。"],["The new magazine has really taken off.","这份新杂志真是大受欢迎。"],["He has produced his own sports magazine.","他已经创办了自己的体育杂志。"]]},{"l":"t.ee/n.a.g/er","p":"ˈt.iː/n.eɪ.dʒ/ə","cn":"n. （13至19岁之间的）青少年","s":[["He was acting like a lovelorn teenager.","他表现的像一个患有相思病的少年。"],["As a teenager I was self-harming regularly.","我十几岁时经常自残。"],["Clothes are a safe bet as a present for a teenager.","衣服适合作为送给十几岁孩子的礼物。"]]},{"l":"g.r.ee.t/i.ng","p":"ˈɡ.r.iː.t/ɪ.ŋ","cn":"n. 问候；招呼","s":[["He managed to croak a greeting.","他勉强用沙哑的嗓音打招呼。"],["Tom nodded a greeting.","汤姆点头打了个招呼。"],["His greeting was familiar and friendly.","他的问候亲切而友好。"]]},{"l":"g.r.a.d.e","p":"ɡ.r.eɪ.d.-","cn":"n. 年级","s":[["I flunked math in second grade.","我二年级时数学不及格。"],["Sam is in (the) second grade.","萨姆读二年级。"],["What grade are you hoping to get?","你希望得到什么样的成绩？"]]},{"l":"e.n/er/g.y","p":"ˈe.n/ə/dʒ.i","cn":"n. 精力；活力","s":[["She's always full of energy.","她总是充满活力。"],["It's a waste of time and energy.","那是浪费时间和精力。"],["It is important to conserve energy.","节能十分重要。"]]},{"l":"d.r.a/m.a","p":"ˈd.r.ɑː/m.ə","cn":"n. 戏；剧","s":[["What you need is a drama coach.","你需要的是一位戏剧指导。"],["He knew nothing of Greek drama.","他对希腊戏剧一无所知。"],["Her drama teacher spotted her ability.","她的戏剧老师发现了她的才能。"]]},{"l":"s.i.n/c.ere/l.y","p":"s.ɪ.n/ˈs.ɪə/l.i","cn":"adv. 真诚地；诚实地（只要求理解）","s":[["\"Congratulations,\" he said sincerely.","“祝贺，”他真诚地说道。"],["I sincerely believe that this is the right decision.","我由衷地认为这个决定是正确的。"],["I sincerely hope you will soon recover.","我诚恳地盼望你早日康复。"]]},{"l":"d.i/a/r.y","p":"ˈd.aɪ/ə/r.i","cn":"n. 日记；日记簿","s":[["We sneaked a look at her diary.","我们偷偷看了一眼她的日记。"],["Eleanor began to keep a diary.","埃莉诺开始记日记了。"],["She kept a diary for over twenty years.","她记了二十多年的日记。"]]},{"l":"p.r.o.j/e.c.t","p":"ˈp.r.ɒ.dʒ/e.k.t","cn":"n. 课题","s":[["The whole project was badly managed.","整个项目管理得差劲。"],["What's the timescale for the project?","这个项目的工期是多长？"],["The project is environmentally unsound.","这个工程会破坏环境。"]]},{"l":"p.o.s.t/er","p":"ˈp.əʊ.s.t/ə","cn":"n. 海报","s":[["This poster is offensive and degrades women.","这张海报冒失无礼，有辱女性尊严。"],["The artwork for the poster was done by my sister.","该海报的图片是我妹妹制作的。"],["I had seen the poster for the jazz festival in Monterey.","我已经见到了蒙特雷爵士音乐节的海报。"]]},{"l":"r.e/a/l.i.z.e","p":"ˈr.iː/ə/l.aɪ.z.-","cn":"v. 意识到","s":[["Only later did she realize her mistake.","只是到了后来她才意识到自己的错误。"],["I hope people realize I'm not a dingbat.","我希望人们意识到我不是个疯子。"],["You don't realize how aggravating you can be.","你没意识到你有多烦人。"]]},{"l":"l.u.ck/i/l.y","p":"ˈl.ʌ.k/ɪ/l.i","cn":"adv. 幸运地；幸好","s":[["Luckily, she isn't injured.","幸运的是，她没受伤。"],["Luckily, nothing valuable was stolen.","幸运的是，没有贵重物品失窃。"],["Luckily there was a taxi rank nearby.","幸好附近有个出租车候客处。"]]},{"l":"j.u.s.t","p":"dʒ.ʌ.s.t","cn":"adv. 恰好","s":[["Accountancy just isn't sexy.","会计工作实在乏味。"],["We've just redecorated.","我们刚刚重新装修过。"],["It's just a suggestion.","这只是一个建议。"]]},{"l":"p.r.e.s/e.n/t.a/tion","p":"ˌp.r.e.z/ə.n/ˈt.eɪ/ʃən","cn":"n. 演示（只要求理解）","s":[["A computer software glitch fouled up their presentation.","一个电脑软件故障弄砸了他们的展示会。"],["I am making a multimedia presentation for my science project.","我正在为我的科学项目做多媒体演示。"],["Computer graphics will give your presentation the professional touch.","计算机绘图将会使你的演示具有专业特色。"]]},{"l":"m.oo.d","p":"m.uː.d","cn":"n. 情绪；心情（只要求理解）","s":[["My mood gradually lightened.","我的心情渐渐好起来。"],["My sunny mood suddenly darkened.","我快乐的情绪突然黯淡下来。"],["She was in a subdued mood.","她心情抑郁。"]]},{"l":"m.i.n.d","p":"m.aɪ.n.d","cn":"v. 介意","s":[["He has a closed mind.","他思想僵化守旧。"],["'Never mind,' Anne consoled her.","“没关系。”安妮安慰她说。"],["Mind where you're treading!","当心脚下！"]]},{"l":"p.a.ck","p":"p.æ.k","cn":"v. （把……）打包","s":[["All joiners will receive a welcome pack.","每位入会者都会收到一个迎新包。"],["The club will send a free information pack.","俱乐部将赠送一个免费的信息包。"],["She decided to pack in her job.","她决定辞职不干了。"]]},{"l":"c.e.l/e/b.r.a.t.e","p":"ˈs.e.l/ɪ/b.r.eɪ.t.-","cn":"v. 庆祝；庆贺","s":[["I was in a mood to celebrate.","我很想庆祝一番。"],["Scottish champs celebrate victory!","苏格兰的冠军庆祝胜利！"],["Let's celebrate and damn the expense!","管它花多少钱，咱们先庆祝一番再说！"]]},{"l":"s.u.c/c.e.ss","p":"s.ə.k/ˈs.e.s","cn":"n. 成功","s":[["The book ensured his success.","这本书保证了他的成功。"],["What's her recipe for success?","她成功的秘诀是什么？"],["She's jealous of my success.","她忌妒我的成功。"]]},{"l":"r.o.ck/y","p":"ˈr.ɒ.k/i","cn":"adj. 困难的","s":[["We walked along the rocky shoreline.","我们沿着岩石嶙嶙的海岸线散步。"],["A rocky headland jutted into the sea.","嶙峋的岬角突入海中。"],["The path continued over rough, rocky ground.","这条小路穿过了崎岖不平的石头地。"]]},{"l":"d.o th.e d.i.sh/e.s","p":"d.uː ð.ə ˈd.ɪ.ʃ/ɪ.z","cn":"洗碗","s":[["You must do the dishes.","你必须洗餐具。"],["You can say do the dishes or wash the dishes.","你可以说清洗餐具或者清洁餐具。"],["The kids offered to do the dishes.","孩子们主动要求洗盘子。"]]},{"l":"j.u/n.i/or h.igh s.ch.oo.l","p":"ˈdʒ.uː/n.i/ə h.aɪ s.k.uː.l","cn":"初级中学","s":[]},{"l":"t.a.k.e p.ar.t i.n","p":"t.eɪ.k.- p.ɑː.t ɪ.n","cn":"参与","s":[]},{"l":"l.oo.k f.or/w.ar.d t.o","p":"l.ʊ.k ˈf.ɔː/w.ə.d t.uː","cn":"期待；盼望","s":[["I look forward to hearing from you.","盼望着收到你的信。"],["I now look forward to going back to work as soon as possible.","我现在盼望尽快回到工作中。"],["We look forward to strengthening still further our already close co-operation with the police.","我们期待进一步加强和警方现有的密切合作。"]]},{"l":"d.ai/l.y l.i.f.e","p":"ˈd.eɪ/l.i l.aɪ.f.-","cn":"日常生活","s":[]},{"l":"g.o t.o b.e.d","p":"ɡ.əʊ t.uː b.e.d","cn":"去睡觉","s":[]},{"l":"g.e.t u.p","p":"ɡ.e.t ʌ.p","cn":"起床","s":[["\"Brigid!\" she screamed. \"Get up!\"","“布里吉德！”她尖声叫道。“起床！”"],["I generally get up at six.","我一般六点钟起床。"],["We've got to get up early, all right?","我们得早起床，可以吧？"]]},{"l":"o.n f.oo.t","p":"ɒ.n f.ʊ.t","cn":"步行","s":[]},{"l":"f.u.ll o.f e.n/er/g.y","p":"f.ʊ.l ə.v ˈe.n/ə/dʒ.i","cn":"充满活力","s":[]},{"l":"g.e.t r.ea.d/y f.or","p":"ɡ.e.t ˈr.e.d/i f.ɔː","cn":"准备好……","s":[]},{"l":"p.u.t o.n","p":"p.ʊ.t ɒ.n","cn":"举办；上演","s":[["She put on the brakes suddenly.","她突然踩了刹车。"],["He put on an American accent.","他假操着一口美国腔。"],["She was put on a respirator.","给她戴上了人工呼吸器。"]]},{"l":"c.l.ea.n u.p","p":"k.l.iː.n ʌ.p","cn":"打扫干净","s":[["Who's going to clean up this mess?","这么又脏又乱的，谁来清理？"],["Aunt Mary volunteered to clean up the kitchen.","玛丽姨妈主动要求打扫厨房。"],["I need to change and clean up.","我需要换洗一下。"]]},{"l":"p.i.ck u.p","p":"p.ɪ.k ʌ.p","cn":"取（某物）","s":[["Will you pick up all your toys?","把你的玩具都收起来好不好？"],["We can pick up Mexican television.","我们可以接收到墨西哥电视。"],["She bent down to pick up her glove.","她俯身去捡手套。"]]}]},{"name":"Unit 3 The seasons","words":[{"l":"f.oo.t/p.r.i.n.t","p":"ˈf.ʊ.t/p.r.ɪ.n.t","cn":"n. 脚印；足迹","s":[["We all need to look for ways to reduce our carbon footprint.","我们都需要寻找减少我们碳足迹的办法。"],["The water-cooling scheme will reduce the system's carbon footprint by up to 85 percent.","水冷却方案将减少系统的碳足迹高达85%。"],["After all, even if profit is the motive, the net result is a reduction in the hotel's \"carbon footprint\".","毕竟，即使动机是利润，最终的结果也是减少了酒店的“碳足迹”。"]]},{"l":"w.e.t","p":"w.e.t","cn":"adj. 潮湿的","s":[["Wet weather always depresses me.","阴雨天总使我心情抑郁。"],["We arrived home soaking wet.","我们回到家时，浑身湿淋淋的。"],["Her hair was still dripping wet.","她的头发仍然湿淋淋的。"]]},{"l":"d.ee.p","p":"d.iː.p","cn":"adj. 深的","s":[["He sank into deep melancholia.","他陷入了深深的忧郁。"],["The wardrobe was very deep.","橱柜很深。"],["She took a deep breath.","她深深地吸了一口气。"]]},{"l":"s.a.n.d/y","p":"ˈs.æ.n.d/i","cn":"adj. 铺满沙子的；含沙的","s":[["The sandy beach was in sight.","那片沙滩映入眼帘。"],["He checked the sandy areas of the arroyo for any tracks.","他检查了旱谷沙地的所有痕迹。"],["Sandy leaned across the table, his face uncomfortably close to Brad's.","桑迪将身体探过桌子，他的脸贴近布拉德的脸，使布拉德感觉很不自在。"]]},{"l":"k.i.ck","p":"k.ɪ.k","cn":"v. 踢；踹","s":[["He gave the door a hefty kick.","他猛踢了一下门。"],["He suffered a kick to the knee.","他的膝盖被踢了一脚。"],["This drink has quite a kick.","这酒的劲相当大。"]]},{"l":"t.ow.n","p":"t.aʊ.n","cn":"n. 镇；市镇","s":[["The town was weirdly familiar.","这个城镇怪面熟的。"],["The town was founded in 1610.","该城镇兴建于1610年。"],["The President hits town tomorrow.","总统明天到镇子上来。"]]},{"l":"f.ea/ture","p":"ˈf.iː/tʃə","cn":"n. 特色；特征","s":[["His eyes are his most notable feature.","他的双眼是他最明显的特征。"],["This feature is designed to aid inexperienced users.","这个特色是为帮助没有经验的用户而设计的。"],["Teamwork is a key feature of the training programme.","团队合作是这项训练计划的重要特点。"]]},{"l":"s.ou.th","p":"s.aʊ.θ","cn":"n. 南；南方","s":[["I drove south on Motorway 9.","我在9号高速公路上向南行驶。"],["They've gone to live down south.","他们到南方去住了。"],["Swallows migrate south in winter.","燕子在冬天迁徙到南方。"]]},{"l":"c.l.ear","p":"k.l.ɪə","cn":"adj. 晴朗的","s":[["She made her objections clear.","她明确表示反对。"],["The photo wasn't very clear.","这张照片不太清晰。"],["The clear blue sea beckoned.","清澈蔚蓝的大海令人向往。"]]},{"l":"l.ou.d/l.y","p":"ˈl.aʊ.d/l.i","cn":"adv. 喧闹地；响亮地","s":[["She wiped her face and sniffed loudly.","她擦擦脸，大声地抽着鼻子。"],["She fell over and swore loudly.","她摔倒了，大骂了一声。"],["The shop bell jangled loudly.","商店的钟发出丁零当啷的巨大响声。"]]},{"l":"th.u.n/d.er","p":"ˈθ.ʌ.n/d.ə","cn":"n. 雷","s":[["The thunder growled menacingly.","雷声轰鸣，叫人害怕。"],["Thunder grumbled in the distance.","远处雷声隆隆。"],["Thunder cracked in the sky.","空中雷声炸响。"]]},{"l":"l.igh.t/n.i.ng","p":"ˈl.aɪ.t/n.ɪ.ŋ","cn":"n. 闪电","s":[["The tree was struck by lightning.","树遭到雷击。"],["Driving today demands lightning reflexes.","如今驾车需要飞快的反应。"],["Another flash of lightning lit up the cave.","又一道闪电照亮了那个洞穴。"]]},{"l":"f.r.e.sh","p":"f.r.e.ʃ","cn":"adj. 新鲜的","s":[["We sell only fresh local produce.","我们只售当地的新鲜农产品。"],["Is this milk fresh?","这是鲜牛奶吗？"],["Fresh groups of guests arrived.","新客成批到达了。"]]},{"l":"g.a.th/er","p":"ˈɡ.æ.ð/ə","cn":"v. 采集（植物、水果等）","s":[["People would gather from near and far.","人们会从四面八方聚起来。"],["Weeks after his death, mourners still gather outside the house.","他死后几个星期，哀悼者仍然聚集在屋外。"],["You're self-employed, I gather.","我想你是个体经营吧。"]]},{"l":"p.ea.c.e/f.u.l","p":"ˈp.iː.s.-/f.ə.l","cn":"adj. 安静的；平静的","s":[["The riot began as a peaceful protest.","暴乱是从一场和平抗议开始的。"],["I was amazingly light-hearted and peaceful.","我当时出奇地轻松和平静。"],["The prospects for a peaceful solution are dim.","找到和平解决方案的前景渺茫。"]]},{"l":"s.n.a.k.e","p":"s.n.eɪ.k.-","cn":"n. 蛇","s":[["The snake slowly uncoiled.","蛇慢慢地展开了盘着的身体。"],["A snake was twisting around his arm.","一条蛇缠绕在他的手臂上。"],["The snake lifted its head and hissed.","蛇昂起头发出嘶嘶声。"]]},{"l":"th.r.ough","p":"θ.r.uː","cn":"prep. 自始至终；从头到尾","s":[["He walked through customs.","他步行通过了海关。"],["We'll muddle through somehow.","我们能想办法应付过去。"],["Applause rang through the hall.","掌声响彻整个大厅。"]]},{"l":"p.ar.t","p":"p.ɑː.t","cn":"n. 区域；地区","s":[["Part of the roof has caved in.","部分屋顶已经坍塌了。"],["Have you learned your part yet?","你记住你的台词了吗？"],["She's part French, part English.","她是英法血统各半。"]]},{"l":"ar/t.i/c.le","p":"ˈɑː/t.ɪ/k.l","cn":"n. 文章","s":[["The article caused (an) uproar.","这篇文章引起了轩然大波。"],["The article was highly defamatory.","这篇文章充满诽谤。"],["The article is full of inaccuracies.","这篇文章里的错误比比皆是。"]]},{"l":"r.ea/s.o.n","p":"ˈr.iː/z.ə.n","cn":"n. 原因；理由","s":[["The reason is blindingly obvious.","原因十分明显。"],["I have good reason to be suspicious.","我的怀疑有充分理由。"],["You've no reason to reproach yourself, no reason to feel shame.","你没有理由责备自己，也没有理由感到羞愧。"]]},{"l":"a/l.i.v.e","p":"ə/ˈl.aɪ.v.-","cn":"adj. 有生气；有活力","s":[["I felt exalted and newly alive.","我感到兴高采烈，充满新的活力。"],["He's still alive, isn't he?","他还活着，是吗？"],["He was buried alive in the earthquake.","地震把他活埋了。"]]},{"l":"s.a.n.d/c.a/s.t.le","p":"ˈs.æ.n.d/k.ɑː/s.-.l","cn":"n. 沙堡（只要求理解）","s":[]},{"l":"f.o.l/l.ow","p":"ˈf.ɒ.l/-.əʊ","cn":"v. 按……方式发展","s":[["She signalled him to follow.","她示意他跟她走。"],["If you lead, I'll follow.","你领头，我跟着。"],["Sorry—I don't quite follow.","对不起，我不太听懂你的话。"]]},{"l":"d.i/v.i.d.e","p":"d.ɪ/ˈv.aɪ.d.-","cn":"v. （使）分开","s":[["How shall we divide up the work?","我们怎么分工呢？"],["The cells began to divide rapidly.","细胞迅速分裂。"],["Divide 2 into 7, and the answer is 3, remainder 1.","7除以2，商3余1。"]]},{"l":"d.e/c.i.d.e","p":"d.ɪ/ˈs.aɪ.d.-","cn":"v. 对……作出抉择；决定","s":[["It's up to you to decide.","这事由你来决定吧。"],["Whatever you decide, it's okay by me.","无论你怎么决定对我来说都行。"],["You have our support, whatever you decide.","不管你作何决定，都会得到我们的支持。"]]},{"l":"c.r.o.p","p":"k.r.ɒ.p","cn":"n. 庄稼；作物（只要求理解）","s":[["The staple crop is rice.","主要农作物为水稻。"],["Sugar is an important crop on the island.","糖料作物是这个岛上的一种重要作物。"],["Cranberries are a major cash crop in New Jersey.","蔓越橘是新泽西州的一种主要经济作物。"]]},{"l":"c.u.l/ture","p":"ˈk.ʌ.l/tʃə","cn":"n. 文化；文明","s":[["We are living in a consumer culture.","我们生活在一种消费文化之中。"],["A culture of failure exists in some schools.","在某些学校中存在着失败文化。"],["This tradition has no parallel in our culture.","这种传统在我们的文化中是没有的。"]]},{"l":"l.o/c.a.l","p":"ˈl.əʊ/k.ə.l","cn":"adj. 地方的；当地的","s":[["He dabbles in local politics.","他开始涉足地方政坛。"],["Police suspect a local gang.","警方怀疑当地的一个不良帮派。"],["She's on the local council.","她是地方议会的议员。"]]},{"l":"t.r.a/d.i.tion","p":"t.r.ə/ˈd.ɪ.ʃən","cn":"n. 传统","s":[["This region is steeped in tradition.","这个地区有着深厚的传统。"],["It was a radical departure from tradition.","这从根本上违背了传统。"],["This was a practice sanctified by tradition.","这是一种合乎传统的做法。"]]},{"l":"c.o.n/t.i.n/ue","p":"k.ə.n/ˈt.ɪ.n/juː","cn":"v. 持续；继续存在","s":[["They'll continue to fight injustice.","他们将继续与不公正的现象抗争。"],["He will continue as chairman emeritus.","他将会继续担任荣誉主席。"],["Please continue—I didn't mean to interrupt.","请继续往下说，我并非有意打断你的话。"]]},{"l":"h.a.v.e p.i.c/n.i.c.s","p":"h.æ.v.- ˈp.ɪ.k/n.ɪ.k.s","cn":"野餐","s":[]},{"l":"w.or.k o.n.e.'s l.a.n.d","p":"w.ɜː.k wʌ.n.-.z l.æ.n.d","cn":"耕种土地","s":[]},{"l":"t.a.k.e a t.r.i.p","p":"t.eɪ.k.- ə t.r.ɪ.p","cn":"去旅行","s":[]},{"l":"s.o/l.ar t.er.m","p":"ˈs.əʊ/l.ə t.ɜː.m","cn":"节气","s":[]},{"l":"i.n f.a.c.t","p":"ɪ.n f.æ.k.t","cn":"事实上","s":[]},{"l":"b.e d.i/v.i/d.e.d i.n/t.o","p":"b.i d.ɪ/ˈv.aɪ/d.ɪ.d ˈɪ.n/t.uː","cn":"被划分成……","s":[]},{"l":"b.e b.a.s.e.d o.n","p":"b.i b.eɪ.s.-.t ɒ.n","cn":"基于……","s":[]},{"l":"p.l.ay a.n i.m/p.or.t/a.n.t p.ar.t i.n","p":"p.l.eɪ æ.n ɪ.m/ˈp.ɔː.t/ə.n.t p.ɑː.t ɪ.n","cn":"在……上发挥重要作用","s":[]}]},{"name":"Unit 4 The Earth","words":[{"l":"s.y.s/t.e.m","p":"ˈs.ɪ.s/t.ə.m","cn":"n. 系统","s":[["Trust is implicit in the system.","信任是这种体制里内含的。"],["Initially, the system worked well.","开始时系统运转良好。"],["Their education system is useless.","他们的教育制度一点儿也不好。"]]},{"l":"f.i.l.e","p":"f.aɪ.l.-","cn":"n. 档案","s":[["The file was labelled 'Private'.","那档案已标明“保密”。"],["I'm still looking for that lost file.","我还在找那份丢失的档案。"],["I looked your address up in the personnel file.","我从人事档案里查到了你的地址。"]]},{"l":"a/m.a.z/i.ng","p":"ə/ˈm.eɪ.z/ɪ.ŋ","cn":"adj. 令人大为惊奇的","s":[["She has amazing powers of recall.","她有惊人的记忆力。"],["BTW, the machine is simply amazing.","顺便提一句，这台机器简直太了不起了。"],["I find it amazing that they're still together.","他们还在一起，这使我大吃一惊。"]]},{"l":"p.l.a.n/e.t","p":"ˈp.l.æ.n/ɪ.t","cn":"n. 行星","s":[["There are lots of ways of annihilating the planet.","有很多毁灭那个星球的方式。"],["Saturn is the second biggest planet in the solar system.","土星是太阳系的第二大的行星。"],["The new planet is about ten times the size of the earth.","这个新发现的行星大约是地球大小的10倍。"]]},{"l":"b.i.ll/i.o.n","p":"ˈb.ɪ.l/j.ə.n","cn":"num. 十亿（只要求理解）","s":[["The new runway is a billion-dollar boondoggle.","这条新跑道是一个价值十亿美元的废物。"],["Worldwide sales reached 2.5 billion.","全球销售额达到了25亿。"],["The company posted a $1.1 billion loss.","这家公司公布了11亿元的亏损。"]]},{"l":"c.o.v/er","p":"ˈk.ʌ.v/ə","cn":"v. 盖；覆盖","s":[["If it turns cold, cover the plants.","如果天气变冷，就把植物盖起来。"],["Cover me while I move forward.","掩护我前进。"],["$100 should cover your expenses.","100元该足够支付你的费用了。"]]},{"l":"s.u/pp.or.t","p":"s.ə/ˈp.ɔː.t","cn":"v. 支持；维持","s":[["We assured him of our support.","我们向他保证给予支持。"],["We offer free technical support.","我们免费提供技术支持。"],["I gave her my unqualified support.","我全力支持她。"]]},{"l":"a/r.e/a","p":"ˈeə/r.i/ə","cn":"n. 地区；地域","s":[["The area is rich in wildlife.","这个地区的野生动植物很多。"],["The area is largely uninhabited.","这个地区大部分是无人居住的。"],["John is the London area manager.","约翰是伦敦地区经理。"]]},{"l":"f.r.ee.z/i.ng","p":"ˈf.r.iː.z/ɪ.ŋ","cn":"adj. 极冷的","s":[["Temperatures hovered around freezing.","气温在冰点上下徘徊。"],["It's 15 degrees below freezing.","温度是零下15度。"],["It's freezing cold outside.","外面极为寒冷。"]]},{"l":"n.or.th","p":"n.ɔː.θ","cn":"n. 北；北方","s":[["A compass needle points north.","罗盘指针指向北方。"],["It faced seawards to the north.","它面向北方，朝着海。"],["He saw service in North Africa.","他曾在北非服兵役。"]]},{"l":"p.o.l.e","p":"p.əʊ.l.-","cn":"n. （行星的）极；地极","s":[["The truck crashed into a telegraph pole.","卡车撞上了电线杆。"],["I didn't want to be low man on the totem pole for ever.","我不想永远当小人物。"],["Five members of Scott's expedition made it to the South Pole.","斯科特率领的探险队的五名成员一直来到了南极。"]]},{"l":"d.e.s/er.t","p":"ˈd.e.z/ə.t","cn":"n. 沙漠；荒漠","s":[["Somalia is mostly desert.","索马里大部分地区都是荒漠。"],["The heat in the desert was extreme.","沙漠中极其炎热。"],["They drove 600 miles across the desert.","他们驱车600英里横穿沙漠。"]]},{"l":"m.e/t.re","p":"ˈm.iː/t.ə","cn":"n. 米","s":[["It is about a metre in length.","它大约有一米长。"],["It's only a low wall—about a metre high.","那只不过是一堵矮墙—约一米高。"],["He will be competing in the 100-metre race.","他将参加100米比赛。"]]},{"l":"r.ea.ch","p":"r.iː.tʃ","cn":"v. 足够达到","s":[["Politicians again failed to reach an agreement.","政治家们又一次没有达成一致。"],["Can you reach me down that box?","你帮我把那个盒子拿下来好吗？"],["Victory is now out of her reach.","胜利现在对于她来说已遥不可及。"]]},{"l":"g.r.ai.n","p":"ɡ.r.eɪ.n","cn":"n. 谷粒（只要求理解）","s":[["Surplus grain is being sold for export.","过剩的谷物正销往国外。"],["Any shortage could push up grain prices.","任何短缺都会推动粮价上涨。"],["The soup was a mash of grain and vegetables.","那是用粮食和蔬菜做成的浓汤。"]]},{"l":"w.i.d.e","p":"w.aɪ.d.-","cn":"adj. 宽的；宽阔的","s":[["It's about 2 metres wide.","它大约2米宽。"],["How wide is that stream?","那条小溪有多宽？"],["The case has attracted wide publicity.","这个案件得到广泛的关注。"]]},{"l":"wh.a.l.e","p":"w.eɪ.l.-","cn":"n. 鲸","s":[["A whale is a fish. True or false?","鲸鱼是鱼，对还是错？"],["A whale was found washed up on the shore.","一头鲸被发现冲到了岸上。"],["The whale dived as the harpoon struck it.","鲸被鱼叉射中后下潜。"]]},{"l":"b.u.t/t.er/f.l.y","p":"ˈb.ʌ.t/-.ə/f.l.aɪ","cn":"n. 蝴蝶","s":[["The butterfly fluttered from flower to flower.","蝴蝶在花丛中飞来飞去。"],["It is a very pretty butterfly, with a 2 inch wing span.","它是一只非常漂亮的蝴蝶，翅膀张开有2英寸宽。"],["The caterpillar will eventually metamorphose into a butterfly.","毛毛虫最终将蜕变成一只蝴蝶。"]]},{"l":"p.r.o/v.i.d.e","p":"p.r.ə/ˈv.aɪ.d.-","cn":"v. 提供；供应","s":[["He refused to provide a specimen.","他拒绝提供抽样。"],["They would not provide any details.","他们不肯提供任何细节。"],["Can you provide any proof of identity ?","你能提供什么身份证明吗？"]]},{"l":"e.x/p.l.ore","p":"ɪ.ks/ˈp.l.ɔː","cn":"v. 探索","s":[["We will explore every avenue until we find an answer.","我们要探索一切途径，直到找到答案为止。"],["I want to explore and get in touch with my inner self.","我想认真探索，了解我内在的个性。"],["I just wanted to explore on my own.","我只是想独自考察一下。"]]},{"l":"d.i.s/a/pp.ear","p":"ˌd.ɪ.s/ə/ˈp.ɪə","cn":"v. 消失；不见","s":[["They watched the bus disappear into the distance.","他们注视着公共汽车消失在远方。"],["It was uncharacteristic of her father to disappear like this.","就这样消失不是她父亲的风格。"],["The problems of traffic congestion will not disappear in a hurry.","交通堵塞问题不会很快消失。"]]},{"l":"p.l.a.s/t.i.c","p":"ˈp.l.æ.s/t.ɪ.k","cn":"n. 塑料","s":[["Clay is a plastic substance.","黏土是可塑物质。"],["He makes plastic reusable moulds.","他制作可再次使用的塑料模子。"],["Plastic tends to discolour with age.","塑料久而久之便会退色。"]]},{"l":"p.o/ll.u/tion","p":"p.ə/ˈl.uː/ʃən","cn":"n. 污染","s":[["Pollution can aggravate asthma.","污染会使气喘加重。"],["Pollution can harm marine life.","污染会危及海洋生物。"],["We need more laws to stop pollution.","我们需要制定更多法律来防止污染。"]]},{"l":"p.r.o/t.e.c.t","p":"p.r.ə/ˈt.e.k.t","cn":"v. 保护","s":[["My prime concern is to protect my property.","我最关心的是保护自己的财产。"],["Women banded together to protect each other.","妇女们联合起来互相保护。"],["Polish shoes regularly to protect the leather.","要经常擦鞋，以保护皮革。"]]},{"l":"ch.e.m/i/c.a.l","p":"ˈk.e.m/ɪ/k.ə.l","cn":"n. 化学制品；化学品（只要求理解）","s":[["What's the chemical symbol for mercury?","水银的化学符号是什么？"],["What is the chemical symbol for copper?","铜的化学符号是什么？"],["Chemical seepage has caused untold damage.","化学品泄漏已造成了难以估量的损失。"]]},{"l":"g.r.ou.n.d/w.a/t.er","p":"ˈɡ.r.aʊ.n.d/w.ɔː/t.ə","cn":"n. 地下水","s":[]},{"l":"b.ur.n","p":"b.ɜː.n","cn":"v. 燃烧；烧","s":[["Turn the heat down or it'll burn.","把炉火开小一些，不然就烧焦了。"],["The power stations burn coal from the Ruhr region.","这些电厂烧产自鲁尔地区的煤。"],["Incineration plants should be built to burn household waste.","应该建焚化厂来焚烧生活垃圾。"]]},{"l":"oi.l","p":"ɔɪ.l","cn":"n. 石油；原油","s":[["The tanker was gushing oil.","油箱在大量喷油。"],["The price of oil increased.","石油价格上涨了。"],["Oil and water do not blend.","油与水不相融。"]]},{"l":"g.a.s","p":"ɡ.æ.s","cn":"n. 天然气","s":[["This gas is highly poisonous.","这种气体有剧毒。"],["Coal is actually cheaper than gas.","煤炭实际上比煤气便宜。"],["Gas is cheaper than coal.","煤气比煤便宜。"]]},{"l":"h.ar.m/f.u.l","p":"ˈh.ɑː.m/f.ə.l","cn":"adj. 有害的","s":[["Continuous exposure to sound above 80 decibels could be harmful.","持续曝露于超过80分贝的声音可能有害。"],["Water is not an effective shield against the sun's more harmful rays.","水不能有效阻挡太阳中更有害的射线。"],["Tears help to protect the eye from potentially harmful foreign bodies.","眼泪有助于保护眼睛去除可能有害的异物。"]]},{"l":"w.e.b/s.i.t.e","p":"ˈw.e.b/s.aɪ.t.-","cn":"n. 网站","s":[["There's jazz a gogo on our website.","我们的网站上有大量的爵士音乐。"],["Check out the new website. It's the bomb!","看一看这新网站。简直是太棒了！"],["I found this information on their website.","我在他们的网站上发现了这一信息。"]]},{"l":"ow.n","p":"əʊ.n","cn":"adj. 自己的；本人的","s":[["She makes her own clothes.","她自己做衣服。"],["David accepts his own vulnerability.","戴维承认自己的脆弱。"],["She made her own bread.","她自己做了面包。"]]},{"l":"h.ow/e.v/er","p":"h.aʊ/ˈe.v/ə","cn":"adv. 然而；不过","s":[["On one issue, however, she was immovable.","然而，就一点而言，她态度是坚决的。"],["However, traders tended to discount the rumour.","但是，商人们倾向于不理会这个传闻。"],["However, he underestimates the scale of the problem.","然而，他却低估了问题的严重性。"]]},{"l":"e.m/p.e/r.or","p":"ˈe.m/p.ə/r.ə","cn":"n. 皇帝","s":[["He proclaimed himself emperor.","他自封为皇帝。"],["The Emperor kept himself aloof from the people.","这个皇帝对人民漠不关心。"],["He had implicit faith in the noble intentions of the Emperor.","他对皇帝的崇高旨意笃信不疑。"]]},{"l":"h.u.n.t","p":"h.ʌ.n.t","cn":"v. 打猎","s":[["There will be a hunt on Boxing Day.","节礼日将有猎狐活动。"],["They sleep by day and hunt by night.","他们白天睡觉，夜晚捕猎。"],["As a child I learned to hunt and fish.","我孩提时代就学会了打猎和捕鱼。"]]},{"l":"w.ar","p":"w.ɔː","cn":"n. 战争","s":[["Diplomacy is better than war.","采取外交手段胜于诉诸战争。"],["The prospect of war loomed large.","战争的阴影在逼近，令人忧虑。"],["The country is now at war.","这个国家正在打仗。"]]},{"l":"s.a.n.d/s.t.or.m","p":"ˈs.æ.n.d/s.t.ɔː.m","cn":"n. 沙暴","s":[]},{"l":"s.o/l.u/tion","p":"s.ə/ˈl.uː/ʃən","cn":"n. 解决办法","s":[["Do you have a better solution?","你有更好的解决办法吗？"],["A solution proffered itself.","一个解答自然出现了。"],["A solution is still some way off.","解决办法尚需时日。"]]},{"l":"b.l.ow","p":"b.l.əʊ","cn":"v. 刮；吹","s":[["Blow! I completely forgot it.","哎呀！我给忘得一干二净了。"],["He has blow-dried blond hair.","他有一头吹风造型了的金发。"],["The blow chipped the woman's tooth.","这一击把那个女人的牙齿打掉了一小块。"]]},{"l":"g.e.n/e/r.a/tion","p":"ˌdʒ.e.n/ə/ˈr.eɪ/ʃən","cn":"n. （统称）一代人","s":[["He is arguably the best actor of his generation.","按理他是他那一代中最优秀的演员。"],["He was a beacon of hope for the younger generation.","他是年轻一代的希望之灯。"],["She was one of the greatest minds of her generation.","她是她那一代人中最聪慧的人之一。"]]},{"l":"s.o/l.ar s.y.s/t.e.m","p":"ˈs.əʊ/l.ə ˈs.ɪ.s/t.ə.m","cn":"太阳系","s":[["Saturn is the second biggest planet in the solar system.","土星是太阳系的第二大的行星。"],["The picture shows six of the nine planets in the solar system.","这张图片展示太阳系9个行星中的6个行星。"],["The spacecraft will enable scientists to study some dark corners of the solar system.","太空船使得科学家可以研究太阳系中一些不为人知的角落。"]]},{"l":"f.a.c.t f.i.l.e","p":"f.æ.k.t f.aɪ.l.-","cn":"事实档案","s":[]},{"l":"b.e c.o.v/er.e.d b.y","p":"b.i ˈk.ʌ.v/ə.-.d b.aɪ","cn":"被……覆盖","s":[]},{"l":"a.s f.ar a.s w.e k.n.ow","p":"æ.z f.ɑː æ.z w.iː -.n.əʊ","cn":"据我们所知","s":[]},{"l":"s.ea l.e.v/e.l","p":"s.iː ˈl.e.v/ə.l","cn":"海平面","s":[]},{"l":"wh.a.t.'s m.ore","p":"w.ɒ.t.s m.ɔː","cn":"更重要的是","s":[]},{"l":"p.r.o/v.i.d.e w.i.th","p":"p.r.ə/ˈv.aɪ.d.- w.ɪ.ð","cn":"提供；供应；给予","s":[]},{"l":"t.a.k.e c.are o.f","p":"t.eɪ.k.- k.eə ə.v","cn":"照顾；照料","s":[["See that you take care of him.","你一定要好好照顾他。"],["We need to take care of our bodies.","我们需要照顾好自己的身体。"],["He's old enough to take care of himself.","他已经不小了，能照顾自己了。"]]},{"l":"p.l.a.s/t.i.c p.o/ll.u/tion","p":"ˈp.l.æ.s/t.ɪ.k p.ə/ˈl.uː/ʃən","cn":"塑料污染","s":[]},{"l":"c.u.t d.ow.n","p":"k.ʌ.t d.aʊ.n","cn":"砍倒","s":[["You need to cut down on starches.","你有必要少吃些含淀粉的东西。"],["He was cut down by an assassin's bullet.","他被刺客的子弹击中身亡。"],["Car owners were asked to cut down travel.","车主们被要求减少出行。"]]},{"l":"h.u.n/d.r.e.d.s o.f","p":"ˈh.ʌ.n/d.r.ə.d.z ə.v","cn":"数以百计","s":[]},{"l":"b.l.ow a/w.ay","p":"b.l.əʊ ə/ˈw.eɪ","cn":"吹走","s":[]}]},{"name":"Unit 5 Off to space","words":[{"l":"s.p.a.c.e/s.ui.t","p":"ˈs.p.eɪ.s.-/s.uː.t","cn":"n. 航天服；宇航服","s":[]},{"l":"c.o/ll.e.c.t","p":"k.ə/ˈl.e.k.t","cn":"v. 收集；采集","s":[["I used to collect stamps.","我过去曾经集邮。"],["Bezanik is diving to collect marine organisms.","贝赞尼克正在潜水采集海洋生物。"],["I collect shells and interesting seaside items.","我收集贝壳以及海边有趣的东西。"]]},{"l":"l.ea.v.e","p":"l.iː.v.-","cn":"v. 离开","s":[["She begged permission to leave.","她请求允许她离开。"],["We didn't leave early enough.","我们离开得不够早。"],["Williams ordered him to leave.","威廉斯命令他离开。"]]},{"l":"k.i/l.o/m.e/t.re","p":"k.ɪ/ˈl.ɒ/m.ɪ/t.ə","cn":"n. 千米；公里","s":[["In a minute a cheetah can run about 1 kilometre and a half.","在一分钟内，猎豹可以跑大约1公里半。"],["She started to raise money for the trip and when she was 12, she had enough for the 11,000-kilometre journey.","她开始为此行筹款，12岁时，她就存下了足够走完那11000公里旅程的钱。"],["For his first trip, he went hiking with a friend around the M25—a 188-kilometre road that goes all the way around London.","他的第一次旅行是和他的一个朋友徒步 M25 高速公路，这是一条长达188公里的伦敦外环公路。"]]},{"l":"w.ea.k","p":"w.iː.k","cn":"adj. 虚弱的；无力的","s":[["Geography was my weak subject.","地理课是我的弱项。"],["She was too weak to stand.","她虚弱得站都站不住。"],["His weak voice was almost inaudible.","他声音微弱得几乎听不到。"]]},{"l":"t.ie","p":"t.aɪ","cn":"v. （用线、绳等）拴","s":[["He carefully knotted his tie.","他仔细地打着领带。"],["He fidgeted with his tie.","他不停摆弄他的领带。"],["The match ended in a tie.","这场比赛以平局结束。"]]},{"l":"l.ow","p":"l.əʊ","cn":"adj. 低于通常（或平均）数量（或水平、价值）的","s":[["The humidity is relatively low.","湿度相对较低。"],["The fee is pitifully low.","酬金低得可怜。"],["I'm feeling really low.","我现在很消沉。"]]},{"l":"w.eigh","p":"w.eɪ","cn":"v. 有……重；重","s":[["The largest stones weigh over five tonnes apiece.","最大的石头每块重五吨以上。"],["How many pounds do you weigh?","你体重多少磅？"],["Weigh this in your hand.","掂掂这有多重。"]]},{"l":"b.r.ea.th.e","p":"b.r.iː.ð.-","cn":"v. 呼吸","s":[["He couldn't breathe. His chest was on fire.","他无法呼吸。他的胸部火辣辣地疼痛。"],["The air was so cold we could hardly breathe.","空气非常寒冷，我们难以呼吸。"],["It looked as if she had forgotten how to breathe.","她看上去好像是忘了如何呼吸似的。"]]},{"l":"f.a/c.i.l/i/t.y","p":"f.ə/ˈs.ɪ.l/ə/t.i","cn":"n. 设施；设备","s":[["There may be a cost to such facility.","这种的设备可能会产生成本。"],["It describes completely the facility and its safety basis.","它完整地描述了设备和它的安全基础。"],["She has a facility for languages.","她有语言天赋。"]]},{"l":"a.d/v.e.n/ture","p":"ə.d/ˈv.e.n/tʃə","cn":"n. 冒险；冒险经历；奇遇","s":[["He set off in quest of adventure.","他出行探险去了。"],["Few can resist the lure of adventure.","很少有人能抵御历险的诱惑力。"],["Age hadn't blunted his passion for adventure.","岁月没有冲淡他的冒险激情。"]]},{"l":"p.a.ss","p":"p.ɑː.s","cn":"v. 沿某方向前进；向某方向移动","s":[["She timed the pass perfectly.","她传球的时机掌握得恰到好处。"],["He's determined to pass this time.","这一回他决心要考及格。"],["She stepped aside to let them pass.","她闪到一边让他们过去。"]]},{"l":"e.x/p.e.r/i/m.e.n.t","p":"ɪ.ks/ˈp.e.r/ɪ/m.ə.n.t","cn":"n. 实验；试验","s":[["I decided to conduct an experiment.","我决定做一项实验。"],["The experiment went horribly wrong.","实验弄得一塌糊涂。"],["As an experiment, we bought Ted a watch.","作为尝试，我们给特德买了块手表。"]]},{"l":"p.r.e/p.are","p":"p.r.ɪ/ˈp.eə","cn":"v. 使做好准备；把……预备好","s":[["I had no time to prepare.","我当时没时间准备。"],["I'll prepare a revised estimate for you.","我将为你准备一份经过修正的评估报告。"],["The king urged his people to prepare for war.","国王呼吁臣民百姓准备作战。"]]},{"l":"d.r.ea.m","p":"d.r.iː.m","cn":"n. 梦想；理想；v. 做梦；梦见","s":[["He finally actualized his dream.","他最终实现了自己的梦想。"],["He had a dream about Claire.","他做了一个关于克莱尔的梦。"],["Do you dream in colour ?","你的梦是彩色的吗？"]]},{"l":"ch.ance","p":"tʃ.ɑːns","cn":"n. 机会；机遇","s":[["Everyone has a chance to win.","每个人都有机会赢。"],["It was a chance to start afresh.","这是个重新开始的机会。"],["We have a real chance of success.","我们确实有获得成功的机会。"]]},{"l":"s.e.n.d","p":"s.e.n.d","cn":"v. 邮寄；发送","s":[["Shall I send you the book?","我把书给你寄去，好不好？"],["I'm trying to send an SMS.","我正在发短信。"],["She parcelled up the books to send.","她把要寄走的书包了起来。"]]},{"l":"i.n/t.r.o/d.u.c.tion","p":"ˌɪ.n/t.r.ə/ˈd.ʌ.k.ʃn","cn":"n. 序言；引言","s":[["The notes are intended as an introduction to the course.","这些笔记的目的是作为对这门课程的介绍。"],["It's a useful introduction to an extremely complex subject.","这是对一门极为复杂的学科的有益入门教程。"],["The book is a friendly, down-to-earth introduction to physics.","这是一本简明、实用的物理学入门书。"]]},{"l":"v.i.ew","p":"v.-.juː","cn":"n. 景色；风景","s":[["Such a view is pleasing.","这样一种风景令人愉快。"],["The lake soon came into view.","那湖很快映入眼帘。"],["In my view things won't change.","在我看来形势不会改变。"]]},{"l":"s.o.m.e/d.ay","p":"ˈs.ʌ.m.-/d.eɪ","cn":"adv. 总有一天；有朝一日","s":[]},{"l":"e.x/p.e/r.i/ence","p":"ɪ.ks/ˈp.ɪə/r.i/əns","cn":"n. 经历；阅历","s":[["It was a cathartic experience.","那是一次情感宣泄的体验。"],["It was a terrifying experience.","那是一次可怕的经历。"],["It was a chastening experience.","那是一次令人遗憾的经历。"]]},{"l":"l.a.n.d/er","p":"ˈl.æ.n.d/ə","cn":"n. 着陆器","s":[]},{"l":"i.s/l.a.n.d","p":"ˈaɪ.-/l.ə.n.d","cn":"n. 岛","s":[["The island is thinly populated.","这个岛人口稀少。"],["We rowed around the island.","我们绕着岛划船。"],["The island is no longer inhabited.","这个岛已经没有人居住了。"]]},{"l":"a.n/ci.e.n.t","p":"ˈeɪ.n/ʃ.ə.n.t","cn":"adj. 古老的；很老的","s":[["Lettuce was grown by the ancient Romans.","莴苣是由古罗马人种植的。"],["Tai Chi is an ancient form of self-defence.","太极拳是一种古老的自卫手段。"],["The town is notable for its ancient harbour.","这座小镇因其古老的港口而出名。"]]},{"l":"p.o/e.m","p":"ˈp.əʊ/ɪ.m","cn":"n. 诗","s":[["The poem uses simple language.","这首诗用语简单。"],["The poem has been set to music.","这首诗被谱了曲。"],["He read a poem entitled 'Salt'.","他朗诵一首题为《盐》的诗。"]]},{"l":"e.x/p.r.e.ss","p":"ɪ.ks/ˈp.r.e.s","cn":"v. 表示；表达；表露","s":[["Words cannot express my sorrow.","语言不能表达我的悲伤。"],["Words cannot express how pleased I am.","言语无法表达我的愉快心情。"],["I'd like to send this express, please.","劳驾，我要寄快递。"]]},{"l":"d.e/t.er/m.i/n.a/tion","p":"d.ɪ/ˌt.ɜː/m.ɪ/ˈn.eɪ/ʃən","cn":"n. 决心；坚毅；坚定","s":[["He showed great courage and determination.","他表现得十分勇敢和果断。"],["Her determination never wavered.","她的决心从未动摇过。"],["He has a ruthless determination to succeed.","他有不获成功决不罢休的坚定决心。"]]},{"l":"u/n.i/v.er.s.e","p":"ˈjuː/n.ɪ/v.ɜː.s.-","cn":"n. 宇宙","s":[["The universe is slowly yielding up its secrets.","宇宙慢慢地展现出它的秘密。"],["The idea of a parallel universe is hard to grasp.","认为另有一个平行宇宙的概念是很难理解的。"],["The clear inference is that the universe is expanding.","显然结论是宇宙在扩大。"]]},{"l":"a.l/r.ea.d/y","p":"ɔː.l/ˈr.e.d/i","cn":"adv. 已经；早已","s":[["We've already been introduced.","我们已经介绍认识了。"],["We've already said our goodbyes.","我们已经道别了。"],["She's backpedalled twice already.","她已经两次改变主意了。"]]},{"l":"c.e.n/tu/r.y","p":"ˈs.e.n/tʃə/r.i","cn":"n. 世纪","s":[["A new century was dawning.","一个新的世纪开始了。"],["It was built at the turn of the century.","这是在世纪之交修建的。 ross the threshold.","他迈过门槛。"]]},{"l":"a.d/u.l.t","p":"ˈæ.d/ʌ.l.t","cn":"n. 成年人","s":[["Each ticket admits one adult.","每张票只准许一位成人入场。"],["An adult hedgehog can boast 7,500 spines.","一只成年刺猬能有多达7500根刺。"],["Children must be accompanied by an adult.","儿童必须要有大人陪同。"]]},{"l":"s.e/n.i/or","p":"ˈs.iː/n.i/ə","cn":"n. 老年人；长者","s":[["The President met with senior White House aides.","总统会见了白宫的高级助手。"],["He was the senior serving naval officer.","他曾是高级现役海军军官。"],["Senior defence officials held private talks.","高级防务官员举行了秘密会谈。"]]},{"l":"c.u.s/t.o.m/er","p":"ˈk.ʌ.s/t.ə.m/ə","cn":"n. 顾客；主顾；客户","s":[["The customer called to cancel.","顾客打电话来取消了。"],["The firm has excellent customer relations.","此公司与客户关系极好。"],["They set high standards of customer service.","他们制订了严格的客户服务标准。"]]},{"l":"d.e/s.i.g.n","p":"d.ɪ/ˈz.aɪ.-.n","cn":"n. 设计","s":[["She's good at art and design.","她擅长美术和设计。"],["The product is at the design stage.","产品处于设计阶段。"],["It was a simple but pleasing design.","这是一项简单但令人满意的设计。"]]},{"l":"e.l.s.e","p":"e.l.s.-","cn":"adv. 其他的；别的","s":[["Everyone else was getting sloshed.","其他每个人都快喝醉了。"],["Everyone else was there.","其他所有人都在那儿。"],["They're forever bitching about everybody else.","他们总是在埋怨其他的每个人。"]]},{"l":"s.u.g/g.e.s/tion","p":"s.ə.-/ˈdʒ.e.s/tʃən","cn":"n. 建议；提议","s":[["Ahem, can I make a suggestion?","呃哼，我可以提个建议吗？"],["This suggestion dumbfounded Joe.","这个建议使乔伊惊呆了。"],["He received my suggestion coolly.","他对我的建议反应冷淡。"]]},{"l":"t.i.p","p":"t.ɪ.p","cn":"n. 指点；实用的提示","s":[["Did you give the waiter a tip?","你给服务员小费了吗？"],["The tail tapered to a rounded tip.","尾部越来越细，最后成了个圆尖。"],["He gave the waiter a generous tip.","他给了服务员很多小费。"]]},{"l":"h.i/s.t.o.r/i.c","p":"h.ɪ/ˈs.t.ɒ.r/ɪ.k","cn":"adj. 历史上著名（或重要）的；可名垂青史的（只要求理解）","s":[["'Historic' and 'historical' are easily confusable.","historic和historical容易搅混。"],["We should take more care of our historic buildings.","我们应该更加爱护有历史意义的建筑。"],["The amount of litter in the streets is unbefitting for a historic city.","街道上垃圾之多与历史名城不协调。"]]},{"l":"l.i.s.t","p":"l.ɪ.s.t","cn":"n. 名单；目录","s":[["Double-space the entire list.","隔行写整个清单。"],["I am already on your mailing list.","我已经列在你的邮寄名单上了。"],["Princess Anne topped the guest list.","安妮公主的名字位于来宾名单之首。"]]},{"l":"l.a.n.d/s.c.a.p.e","p":"ˈl.æ.n.d/s.k.eɪ.p.-","cn":"n. 风景；景色","s":[["The landscape had a stark, unworldly beauty.","那景色有一种简朴、超凡的美。"],["The landscape seemed to stretch into infinity.","风景似乎延伸到了无穷远处。"],["The landscape is intersected with spectacular gorges.","在大地景色中点缀着壮观的峡谷。"]]},{"l":"m.e.m/o/r.y","p":"ˈm.e.m/ə/r.i","cn":"n. 回忆；记忆","s":[["Memory is selective and fallible.","记忆有选择性而且会出错。"],["Memory is constitutive of identity.","记忆是身份的一个重要构成部分。"],["The dream wakened a forgotten memory.","那梦唤起了一段忘却的记忆。"]]},{"l":"g.e.n/e/r.a.l","p":"ˈdʒ.e.n/ə/r.ə.l","cn":"n. 将军","s":[["The General refused to be flustered.","将军没有被搅得慌乱不安。"],["The general gave the order to advance.","将军下令前进。"],["My father venerated General Eisenhower.","我父亲十分敬仰艾森豪威尔将军。"]]},{"l":"s.igh.t","p":"s.aɪ.t","cn":"n. 看见","s":[["Her sight is beginning to go.","她的视力开始下降。"],["They finally lost sight of land.","他们终于看不见陆地了。"],["She has very good sight.","她的视力很好。"]]},{"l":"n.a/tu/r.a.l","p":"ˈn.æ/tʃə/r.ə.l","cn":"adj. 自然的；天然的","s":[["He was not a natural leader.","他并非天生的领袖。"],["Crying is a natural safety valve.","哭泣是一种自然的释放压力的手段。"],["Water is a fish's natural element.","水是鱼的天然生活环境。"]]},{"l":"a.l/m.o.s.t","p":"ˈɔː.l/m.əʊ.s.t","cn":"adv. 几乎；差不多","s":[["Her English is almost flawless.","她的英语几乎无可挑剔。"],["She answered almost immediately.","她几乎立刻就回答了。"],["They'll eat almost anything.","他们几乎什么都吃。"]]},{"l":"b.e/c.o.m.e","p":"b.ɪ/ˈk.ʌ.m.-","cn":"v. 开始变得；变成","s":[["Doctors become inured to death.","医生们对死亡变得习以为常。"],["He has become more moralistic.","他变得更喜欢说教了。"],["Look how lazy we've become.","瞧我们变得有多懒。"]]},{"l":"g.a.t.e/w.ay","p":"ˈɡ.eɪ.t.-/w.eɪ","cn":"n. （通往其他地区的）门户","s":[]},{"l":"i.n/f.l.u/ence","p":"ˈɪ.n/f.l.u/əns","cn":"v. 影响；对……起作用","s":[["He's never had any influence over her.","他对她从没有过任何影响。"],["Don't let me influence you either way.","何去何从都别受我的影响。"],["His influence has diminished with time.","随着时间的推移，他的影响已不如从前了。"]]},{"l":"ar.t/w.or.k","p":"ˈɑː.t/w.ɜː.k","cn":"n. 艺术作品","s":[["This is evident in the artwork from the period.","这在那个时期的艺术作品中很明显。"],["The artwork for the poster was done by my sister.","该海报的图片是我妹妹制作的。"],["Sophia described the work as the first digital artwork cooperated between an AI and an artwork collector.","索菲亚表示，这是人工智能和艺术品收藏家合作的第一个数字作品。"]]},{"l":"p.ai.n.t/i.ng","p":"ˈp.eɪ.n.t/ɪ.ŋ","cn":"n. 绘画","s":[["He is painting a huge volcano.","他正在画一座巨型火山。"],["How much is this painting worth?","这幅画值多少钱？"],["Painting can be very therapeutic.","绘画可以使人很放松。"]]},{"l":"s.c.e.n.e","p":"s.-.iː.n.-","cn":"n. 场面；情景","s":[["It's a scene of complete devastation.","那是一幅满目疮痍的景象。"],["The carvings represent a hunting scene.","这些雕刻作品描绘了一幅狩猎的场面。"],["Officer Montoya was first on the scene.","蒙托亚警官是第一个到达现场的人。"]]},{"l":"w.i.f.e","p":"w.aɪ.f.-","cn":"n. 妻子","s":[["His wife is very religious.","她的妻子非常虔诚。"],["His wife is an epileptic.","他的妻子是癫痫患者。"],["Can I introduce my wife?","我来介绍一下我的妻子。"]]},{"l":"s.t.o.n.e","p":"s.t.əʊ.n.-","cn":"n. 石头；石料","s":[["I was hit by a falling stone.","我被一块坠落的石头击中。"],["She's trying to lose a stone.","她试图减去一英石的体重。"],["The stone rolled down the hill.","石头滚下山坡。"]]},{"l":"r.e/f.l.e.c/tion","p":"r.ɪ/ˈf.l.e.k/ʃən","cn":"n. 映像；映照出的影像","s":[["After days of reflection she decided to write back.","经过几天的认真思考，她决定回信。"],["Your clothes are often a reflection of your personality.","穿着常常反映出一个人的个性。"],["He admired his reflection in the mirror.","他欣赏着自己在镜中的影像。"]]},{"l":"t.ou/r.i.s.t s.p.o.t","p":"ˈt.ʊə/r.ɪ.s.t s.p.ɒ.t","cn":"旅游景点","s":[]},{"l":"l.igh.t u.p","p":"l.aɪ.t ʌ.p","cn":"点亮；照亮","s":[]},{"l":"i.n th.e c.e.n/t.re o.f","p":"ɪ.n ð.ə ˈs.e.n/t.ə ə.v","cn":"在……的中心","s":[]},{"l":"b.e i.n/t.e.r.e.s/t.e.d i.n","p":"b.i ˈɪ.n/t.-.r.ə.s/t.ɪ.d ɪ.n","cn":"对……有兴趣","s":[["Be interested in others and they are sure to be interested in you.","对别人感兴趣，别人肯定也会对你感兴趣。"],["He only seems to be interested in personal gain.","他似 ng fees are $10,350.","每年的住校费是10,350美元。"],["How much annual leave do you get?","你们的年假有多长？"],["All roses require annual pruning.","玫瑰都要年年修剪。"]]},{"l":"f.a.n/t.a.s/t.i.c","p":"f.æ.n/ˈt.æ.s/t.ɪ.k","cn":"adj. 极好的；了不起的","s":[["I have a fantastic social life.","我有着极好的社交生活。"],["The teams served up some fantastic entertainment.","这些队献上了精彩的表演。"],["You've got the job? Fantastic!","你得到那工作了？太好了！"]]},{"l":"d.o.l/l.ar","p":"ˈd.ɒ.l/-.ə","cn":"n. 元（美国、加拿大、澳大利亚等国的货币单位）","s":[["The dollar continued to slide.","美元继续下跌。"],["The dollar closed two cents down.","收市时美元下降了二分。"],["The dollar plunged precipitously.","美元直线下跌。"]]},{"l":"p.ie","p":"p.aɪ","cn":"n. 果馅饼；果馅派","s":[["He baited his hook with pie.","他把馅饼放在钓钩上作饵。"],["We all had a second helping of pie.","我们又都吃了一份馅饼。"],["He polished off the remains of the apple pie.","他把剩下的苹果派赶快吃完。"]]},{"l":"e/qu.i.p/m.e.n.t","p":"ɪ/ˈkw.ɪ.p/m.ə.n.t","cn":"n. 设备；器材","s":[["New equipment is urgently needed.","亟需新设备。"],["Our equipment is top of the range.","我们的设备是最昂贵的。"],["We lease all our computer equipment.","我们所有的计算机设备都是租来的。"]]},{"l":"c.l.u.b.s f.air","p":"k.l.ʌ.b.z f.eə","cn":"社团招募展","s":[]},{"l":"s.o/l.ar p.ow/er","p":"ˈs.əʊ/l.ə ˈp.aʊ/ə","cn":"太阳能","s":[]},{"l":"o.f c.our.s.e","p":"ə.v k.ɔː.s.-","cn":"当然","s":[["Of course I'm not afraid!","当然我不怕！"],["This, of course, is utter nonsense.","这当然纯属胡言乱语。"],["Ben, of course, was the last to arrive.","本当然是最后一个到的。"]]},{"l":"r.e/m.o.t.e c.o.n/t.r.o.l","p":"r.ɪ/ˈm.əʊ.t.- k.ə.n/ˈt.r.əʊ.l","cn":"遥控器","s":[["I can't find the remote control.","我找不到遥控器。"],["It works by remote control.","它通过遥控工作。"],["The bomb was detonated by remote control.","炸弹通过遥控引爆。"]]},{"l":"t.ur.n a/r.ou.n.d","p":"t.ɜː.n ə/ˈr.aʊ.n.d","cn":"转身","s":[]},{"l":"m.a.k.e a d.i/ff.e.r.ence","p":"m.eɪ.k.- ə ˈd.ɪ/f.-.r.əns","cn":"有作用；有影响","s":[]},{"l":"p.r.i/m.a/r.y s.ch.oo.l","p":"ˈp.r.aɪ/m.ə/r.i s.k.uː.l","cn":"小学","s":[["She practised the piano in the primary school basement.","她在小学的地下室里练习弹钢琴。"],["I go to Star Primary School.","我在思达小学上学。"],["We like primary school students.","我们喜欢小学生。"]]},{"l":"f.a.ll o.ff","p":"f.ɔː.l ɒ.f","cn":"掉落","s":[]}]},{"name":"Unit 8 Collecting as a hobby","words":[{"l":"r.i.ng","p":"r.ɪ.ŋ","cn":"n. 环状物；圈形的东西","s":[["He blew a ring of blue smoke.","他吐出了一圈蓝烟。"],["I'll give you a ring tomorrow.","我明天给你打电话。"],["I could never part with this ring.","我永远也不摘掉这枚戒指。"]]},{"l":"c.o/ll.e.c/tion","p":"k.ə/ˈl.e.k/ʃən","cn":"n. （常指同类的）收集物","s":[["The art collection was his life's work.","收集艺术品是他一生的工作。"],["He loaned the museum his entire collection.","他把自己的全部收藏品都借给了博物馆。"],["The painting comes from his private collection.","这幅画来自他的私人收藏。"]]},{"l":"ow.n","p":"əʊ.n","cn":"v. 拥有；有","s":[["She makes her own clothes.","她自己做衣服。"],["David accepts his own vulnerability.","戴维承认自己的脆弱。"],["She made her own bread.","她自己做了面包。"]]},{"l":"v.a.l/u/a/b.le","p":"ˈv.æ.l/ju/ə/b.l","cn":"adj. 贵重的","s":[["Luckily, nothing valuable was stolen.","幸运的是，没有贵重物品失窃。"],["Did the burglars take anything valuable?","入室窃贼偷走了贵重的东西没有？"],["We're wasting valuable time, time we can ill afford.","我们是在浪费宝贵的时间，我们浪费不起的时间。"]]},{"l":"h.a.n/d.le","p":"ˈh.æ.n/d.l","cn":"v. （用手）触（只要求理解）","s":[["I pumped the handle like crazy.","我拼命地来回摇动手柄。"],["The handle was just beyond my reach.","我差一点儿才够得着把手。"],["The handle came loose.","这把手松了。"]]},{"l":"g.l.o.v.e","p":"ɡ.l.ʌ.v.-","cn":"n. （分手指的）手套","s":[["She bent down to pick up her glove.","她俯身去捡手套。"],["He bit the fingers of his right glove and pulled it off.","他咬住右手手套的指套，把它扯了下来。"],["There is a hole in her glove.","她手套上有个洞。"]]},{"l":"a.dd","p":"æ.d","cn":"v. 增加；添加","s":[["Add up all the money I owe you.","把我欠你的钱全部加起来。"],["If your soil is very acidic, add lime.","如果你的土壤酸性很强，就加点石灰。"],["Add more water until the dough is workable.","往面团里再加点儿水，直到能揉成形为止。"]]},{"l":"e.n/v.e/l.o.p.e","p":"ˈe.n/v.ə/l.əʊ.p.-","cn":"n. 信封","s":[["Why do you sit there looking like an envelope without any address on it?","为什么你坐在那儿，看上去像是一个没写地址的信封？"],["She opened the perfumed envelope.","她打开了带有香味的信封。"],["He stuck a stamp on the envelope.","他把一张邮票贴到信封上。"]]},{"l":"a.b/s.o/l.u.t/e.l.y","p":"ˈæ.b/s.ə/l.uː.t/-.l.i","cn":"adv. 极其","s":[["Joan is absolutely right.","琼绝对正确。"],["That's absolutely right.","那是完全正确的。"],["You're absolutely right.","你完全正确。"]]},{"l":"s.ee.m","p":"s.iː.m","cn":"v. 好像；似乎","s":[["They seem an ill-assorted couple.","他俩似乎不般配。"],["My glasses seem to have vanished.","我的眼镜似乎不翼而飞了。"],["You seem in fine fettle.","你看起来状态很好。"]]},{"l":"i.m/p.o.s/s.i/b.le","p":"ɪ.m/ˈp.ɒ.s/-.ə/b.l","cn":"adj. 不可能的","s":[["It's mathematically impossible.","这在数学上是不可能的。"],["Thick mist made flying impossible.","浓雾使得无法飞行。"],["His accent was impossible to place.","他的口音无法辨认。"]]},{"l":"s.i.n/g.le","p":"ˈs.ɪ.ŋ/ɡ.l","cn":"adj. 单个的","s":[["The single is titled \"White Love.\"","这支单曲名为《白色之恋》。"],["Are you still single?","你还是单身吗？"],["When will the single currency be operable?","什么时候实行单一货币？"]]},{"l":"n.ai.l","p":"n.eɪ.l","cn":"n. 钉；钉子（只要求理解）","s":[["They nail shut the front door.","他们将前门钉死。"],["She scratched herself on a nail.","她在钉子上划了一下。"],["This nail won't come out.","这颗钉子拔不出来。"]]},{"l":"e.x/p.l.ai.n","p":"ɪ.ks/ˈp.l.eɪ.n","cn":"v. 解释；说明","s":[["It's pretty hard to explain.","这事很难解释清楚。"],["Explain why you didn't telephone.","解释一下你为什么不打电话。"],["Can you explain that point again?","你能再解释一下那一点吗？"]]},{"l":"b.i.t","p":"b.ɪ.t","cn":"n. 一部分","s":[["I'm a bit overweight.","我有点超重。"],["I'm a bit chilly.","我感到有点儿冷。"],["I'm a bit dry.","我有点渴。"]]},{"l":"s.i.m/i/l.ar","p":"ˈs.ɪ.m/ə/l.ə","cn":"adj. 相像的；类似的","s":[["They have uncannily similar voices.","他们有着出奇相似的嗓音。"],["The brothers look very similar.","弟兄几个长得很像。"],["We have very similar interests.","我们兴趣相仿。"]]},{"l":"c.oi.n","p":"k.ɔɪ.n","cn":"n. （一枚）硬币","s":[["The coin rolled underneath the piano.","硬币滚到了钢琴底下。"],["Let's toss a coin.","咱们掷硬币猜边儿决定吧。"],["The inscription on the coin had worn away.","铸在这枚硬币上的文字已磨平了。"]]},{"l":"s.o.f.t","p":"s.ɒ.f.t","cn":"adj. 软的","s":[["The grass was soft and springy.","草柔软而有弹性。"],["He had rich, soft ebony hair.","他曾有一头浓密、柔软的黑发。"],["Pat it dry with a soft towel.","用柔软的毛巾将 const INTERVALS = [0, 1, 2, 4, 7, 15, 30];

const pad2 = n => String(n).padStart(2, '0');
const fmtDay = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const today = () => fmtDay(new Date());
const parseDay = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (day, n) => { const d = parseDay(day); d.setDate(d.getDate() + n); return fmtDay(d); };

function streak() {
  let t = today(), n = 0;
  if (!(S.days[t] && S.days[t].n)) t = addDays(t, -1); // 今天还没练不算断
  while (S.days[t] && S.days[t].n) { n++; t = addDays(t, -1); }
  return n;
}
function dueList() {
  const t = today();
  return Object.entries(S.prog)
    .filter(([k, p]) => p.due <= t && ALLW[k])
    .sort((a, b) => a[1].due.localeCompare(b[1].due) || a[1].box - b[1].box)
    .map(([k]) => ALLW[k]);
}
// 记录一次练习结果，返回 {isNew, goalHit}
function recordResult(item, ok, mode) {
  const key = keyOf(item), t = today();
  const d = S.days[t] || (S.days[t] = {n: 0, ok: 0, w: 0, nw: 0});
  let p = S.prog[key];
  const isNew = !p;
  if (!p) p = S.prog[key] = {box: 0, due: t, seen: 0, ok: 0, first: t, last: '', pd: ''};
  if (p.last !== t) d.w++;            // 今天第一次练这个词
  if (isNew) d.nw++;
  d.n++;
  if (ok) d.ok++;
  p.seen++;
  p.last = t;
  if (ok) {
    p.ok++;
    if (mode === 'dictation') {
      if (p.pd !== t) { p.box = Math.min(6, p.box + 1); p.due = addDays(t, INTERVALS[p.box]); p.pd = t; } // 一天只升一档
    } else if (p.box < 1) { p.box = 1; p.due = addDays(t, 1); } // 跟写只算入门
  } else {
    p.box = Math.max(0, p.box - (mode === 'dictation' ? 2 : 1));
    p.due = t;
    p.pd = '';
  }
  const goalHit = ok && !d.goal && d.w >= S.goal; // 达标时那个词拼错了，就等下一个拼对的再庆祝
  if (goalHit) d.goal = 1;
  return {isNew, goalHit};
}
function stats() {
  let learned = 0, mastered = 0, learning = 0, fresh = 0;
  for (const k in S.prog) {
    if (!ALLW[k]) continue;
    const p = S.prog[k];
    learned++;
    if (p.box >= MASTERED_BOX) mastered++; else if (p.box >= 1) learning++; else fresh++;
  }
  return {total: Object.keys(ALLW).length, learned, mastered, learning, fresh, due: dueList().length,
    today: S.days[today()] || {n: 0, ok: 0, w: 0, nw: 0}, streak: streak()};
}

const fxCanvas = document.createElement('canvas');
fxCanvas.id = 'fx';
document.body.appendChild(fxCanvas);
const fxCtx = fxCanvas.getContext('2d');
let fxParts = [], fxRaf = 0;
function fxResize() { fxCanvas.width = innerWidth; fxCanvas.height = innerHeight; }
addEventListener('resize', () => { fxResize(); onViewport(); });
fxResize();
const FX_COLORS = ['#a78bfa', '#38bdf8', '#fb923c', '#34d399', '#f472b6', '#facc15'];
function fxAdd(p) {
  fxParts.push(Object.assign({rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.4, life: 1, round: Math.random() < 0.3}, p));
  if (!fxRaf) fxRaf = requestAnimationFrame(fxStep);
}
function burst(x, y, n = 30, power = 1) { // 从一点向四周喷
  if (!S.fx) return;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.28, v = (3 + Math.random() * 6) * power;
    fxAdd({x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 3 * power, g: 0.28 + Math.random() * 0.1,
      size: 5 + Math.random() * 6, c: FX_COLORS[i % FX_COLORS.length], decay: 0.012 + Math.random() * 0.012});
  }
}
function rain(n = 120) { // 从屏幕上方撒落
  if (!S.fx) return;
  for (let i = 0; i < n; i++) {
    fxAdd({x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * 0.4, vx: (Math.random() - 0.5) * 2.5,
      vy: 2 + Math.random() * 3, g: 0.05, size: 6 + Math.random() * 7, c: FX_COLORS[i % FX_COLORS.length], decay: 0.003});
  }
}
function fxStep() {
  fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
  fxParts = fxParts.filter(p => p.life > 0 && p.y < fxCanvas.height + 30);
  for (const p of fxParts) {
    p.vx *= 0.99; p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= p.decay;
    fxCtx.save();
    fxCtx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.5));
    fxCtx.translate(p.x, p.y);
    fxCtx.rotate(p.rot);
    fxCtx.fillStyle = p.c;
    if (p.round) { fxCtx.beginPath(); fxCtx.arc(0, 0, p.size / 2, 0, 6.28); fxCtx.fill(); }
    else fxCtx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.66);
    fxCtx.restore();
  }
  fxRaf = fxParts.length ? requestAnimationFrame(fxStep) : 0;
  if (!fxRaf) fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
}

// 把「字母拆分」和「音标拆分」解析成音节列表；结构对不上时返回错误
function parseSplit(l, p) {
  const split3 = s => s.trim().split(/\s+/).map(w => w.split('/').map(x => x.split('.')));
  const L = split3(l), P = split3(p);
  if (L.length !== P.length) return {error: '单词数和音标对不上'};
  const syls = [];
  for (let wi = 0; wi < L.length; wi++) {
    if (L[wi].length !== P[wi].length) return {error: `第 ${wi + 1} 个词的音节数和音标对不上`};
    for (let si = 0; si < L[wi].length; si++) {
      const ls = L[wi][si], ps = P[wi][si];
      if (ls.length !== ps.length) return {error: `「${ls.join('')}」有 ${ls.length} 个字母组合，音标却是 ${ps.length} 个`};
      if (ls.some(x => !x) || ps.some(x => !x)) return {error: '有空的字母组合或音标（检查是不是连着写了两个点）'};
      syls.push({wi, t: ls.join(''), chunks: ls.map((x, i) => ({l: x, p: ps[i]}))});
    }
  }
  return {syls};
}
function getLP(item) { return S.custom[keyOf(item)] || {l: item.l, p: item.p}; }
function sylsOf(item) {
  const lp = getLP(item);
  const r = parseSplit(lp.l, lp.p);
  return r.error ? parseSplit(item.l, item.p).syls : r.syls; // 自定义拆分坏了就用默认
}
// 整词音标，例如 /ˈklɑːsruːm/
function fullIpa(syls) {
  const words = [];
  syls.forEach(s => { words[s.wi] = (words[s.wi] || '') + s.chunks.map(c => c.p === '-' ? '' : c.p).join(''); });
  return '/' + words.join(' ') + '/';
}

function unitWords(unit) {
  const book = BOOKS[S.book];
  if (unit === 'wrong') return Object.values(S.wrong).map(x => x.item);
  if (unit === 'due') return dueList().slice(0, REVIEW_CAP);
  if (unit === 'all') return book.units.flatMap(u => u.words);
  return (book.units[unit] || book.units[0]).words;

function buildQueue(keepIdx) {
  if (S.unit !== 'all' && S.unit !== 'wrong' && S.unit !== 'due' && !BOOKS[S.book].units[S.unit]) S.unit = 0;
  combo = 0;

  if (S.shuffle) for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [list[i], list[j]] = [list[j], list[i]]; }

function prepWord() {

  const req = [];
  syls.forEach((s, si) => [...s.t].forEach((ch, ci) => { if (/[a-z]/i.test(ch)) req.push({si, ci, ch}); }));
  const text = syls.reduce((acc, s, i) => acc + (i && s.wi !== syls[i - 1].wi ? ' ' : '') + s.t, '');

/* ================= 声音 ================= */
let curAudio = null;
function stopAudio() {
  if (curAudio) { curAudio.onerror = null; curAudio.pause(); curAudio = null; }
  try { speechSynthesis.cancel(); } catch (e) {}
}
// 全大写的缩写（TV、PE、US）按字母读
function audioText(text) {
  return text.split(/\s+/).map(t => /^[A-Z]{2,}$/.test(t) ? t.split('').join(' ') : t).join(' ');
}
function spokenSyl(t) {
  if (/^[A-Z]$/.test(t)) return t;
  return t.replace(/[^a-zA-Z]/g, '').toLowerCase();
}
function pickVoice(lang) {
  const vs = speechSynthesis.getVoices();
  return vs.find(v => v.lang === lang) || vs.find(v => v.lang.replace('_', '-').startsWith(lang)) || vs.find(v => /^en/i.test(v.lang));
}
function ttsP(text, rate = 0.85) {
  return new Promise(res => {
    if (!('speechSynthesis' in window) || !text) { setTimeout(res, 400); return; }
    let d = false;
    const fin = () => { if (!d) { d = true; res(); } };
    const lang = S.accent === 'uk' ? 'en-GB' : 'en-US';
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    const v = pickVoice(lang);
    if (v) u.voice = v;
    u.rate = rate;
    u.onend = fin;
    u.onerror = fin;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
    setTimeout(fin, 900 + text.length * 260);
  });
}
// 优先用有道词典真人发音（需联网），失败时退回浏览器朗读；单词和例句都用它
function playText(raw) {
  stopAudio();
  const text = audioText(raw);
  return new Promise(res => {
    let done = false, fbUsed = false, started = false;
    const fin = () => { if (!done) { done = true; res(); } };
    const fallback = () => { if (fbUsed || done) return; fbUsed = true; ttsP(text).then(fin); };
    if (!navigator.onLine) { fallback(); return; }
    const a = new Audio('https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(text) + '&type=' + (S.accent === 'uk' ? 1 : 2));
    curAudio = a;
    a.onplaying = () => { started = true; };
    a.onended = fin;
    a.onerror = () => { started ? fin() : fallback(); };
    a.play().catch(() => { if (!started) fallback(); });
    setTimeout(fin, Math.max(4000, text.length * 120));
  });
}
const playWord = () => W && playText(W.text);

let actx = null;
function beep(freq, dur, type = 'sine', vol = 0.06, delay = 0) {
  if (!S.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime + delay;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t0); o.stop(t0 + dur);
  } catch (e) {}
}

  const cap = typing && innerWidth <= 640 ? 10 : 15;

}

/* ================= 流程 ================= */
function enterWord() {
  stopAudio();

  if (S.mode === 'dictation' || S.autoPlay) setTimeout(() => { if (W && !W.done) playWord(); }, 250);
  focusKb();

function next() {

}
// 今日复习：出所有到期的词（最多 REVIEW_CAP 个），用听写练

}

// 学新词：从当前这本书开始，找第一个还没练过的词所在的单元
function startNew() {
  closeModal();
  const books = [BOOKS[S.book], ...BOOK_DATA.filter(b => b.id !== S.book)];
  for (const b of books) {
    for (let i = 0; i < b.units.length; i++) {
      if (b.units[i].words.some(w => !S.prog[keyOf(w)])) {
        S.book = b.id; S.unit = i; S.mode = 'learn';
        buildQueue(false);
        S.idx = Math.max(0, queue.findIndex(w => !S.prog[keyOf(w)]));
        enterWord();
        return;
      }
    }
  }

}
function prev() {
  if (!queue.length) return;

  if (S.idx > 0) { S.idx--; enterWord(); }

function setMode(m) {
  S.mode = m;

function onLetter(k) {
  if (finished || S.mode === 'learn' || !W || W.done) return;
  const need = W.req[W.pos];
  if (!need) return;
  if (k.toLowerCase() === need.ch.toLowerCase()) {
    W.pos++; W.err = 0; W.wrongFlash = null; W.pop = W.pos - 1;
    const nextReq = W.req[W.pos];
    if (!nextReq) { complete(); return; }
    if (nextReq.si !== need.si) {
      sfxSyl();                                                                           // 拼完一节：叮咚
      if (S.sylSpeak) ttsP(spokenSyl(W.syls[need.si].t), 0.8);                            // 并读出这一节
    } else sfxTick(W.pos - 1);                                                            // 每拼对一个字母：音阶往上走一格
    renderTyping();
  } else {
    W.err++; W.hadError = true;
    W.wrongFlash = {r: W.pos, key: k};
    if (W.err >= 2) W.hint = need.si;
    sfxWrong();
    renderTyping(true);
    const tok = W.token;
    clearTimeout(onLetter.t);
    onLetter.t = setTimeout(() => { if (W && W.token === tok && W.wrongFlash) { W.wrongFlash = null; renderTyping(); } }, 400);
  }

  W.ok = !W.hadError;
  W.wrongFlash = null;
  results.push({item: W.item, ok: W.ok});
  const key = keyOf(W.item);
  if (!W.ok) {
    const e = S.wrong[key] || {item: W.item, count: 0};
    e.item = W.item;
    e.count++;
    S.wrong[key] = e;
  } else if (S.unit === 'wrong') {
    delete S.wrong[key];
  }
  const rec = recordResult(W.item, W.ok, S.mode);
  combo = W.ok ? combo + 1 : 0;
  save();
  renderHeader();
  renderTyping();
  const tok = W.token;
  if (W.ok) {
    afterRight(tok, celebrateWord(), rec);
  } else {
    sfxOops();                                                  // 拼错的不扣分，轻轻提示一下，停下来等 Enter
    setTimeout(() => { if (W && W.token === tok) playWord(); }, 400);
  }
}
// 拼对之后：夸一句（和弹字同步）→ 再读一遍单词 → 自动下一个。中途按 Enter/→ 随时跳过
async function afterRight(tok, praise, rec) {
  const alive = () => W && W.token === tok;
  if (rec.goalHit) goalFx();
  await sleep(S.praise ? 80 : 250);
  if (!alive()) return;
  await Promise.race([sayPraise(rec.goalHit ? 'Well done!' : praise), sleep(2500)]);
  if (!alive()) return;

}
function goalFx() { rain(150); sfxFanfare(); toast('🎯 今日目标完成！'); }

  if (!W || W.done || S.mode === 'learn') return;

  W.hadError = true;

}

  complete();
}

/* ================= 弹窗 ================= */
function openModal(html) { $('#box').innerHTML = html; $('#modal').classList.add('on'); }
function closeModal() { $('#modal').classList.remove('on'); focusKb(); }
$('#modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };

function editSplit(item) {
  const cur = getLP(item);
  const v = prompt(
    '格式：字母拆分 | 音标拆分\n' +
    '. 分隔字母组合，/ 分隔音节，空格分隔单词；音标和字母组合一一对应，- 表示不发音\n' +
    '例：c.l.a.ss/r.oo.m | ˈk.l.ɑː.s/r.uː.m\n清空后确定 = 恢复默认',
    cur.l + ' | ' + cur.p);
  if (v === null) return;
  const key = keyOf(item);
  if (!v.trim()) {
    delete S.custom[key];
  } else {
    const [l, p] = v.split('|').map(x => (x || '').trim());
    if (!l || !p) { alert('要同时写字母拆分和音标拆分，中间用 | 隔开。没有保存。'); return; }
    if (plain(l).toLowerCase() !== key) { alert('字母和原单词对不上，没有保存。\n原单词：' + plain(item.l)); return; }
    const r = parseSplit(l, p);
    if (r.error) { alert(r.error + '。没有保存。'); return; }
    S.custom[key] = {l: l.replace(/\s+/g, ' '), p: p.replace(/\s+/g, ' ')};
  }
  save();
  if (W && keyOf(W.item) === key) { prepWord(); render(); }
  if ($('#modal').classList.contains('on')) showList();
}
function splitHtml(item) {
  const syls = sylsOf(item);
  let html = '';
  syls.forEach((s, si) => {
    if (si) html += s.wi !== syls[si - 1].wi ? '&nbsp;&nbsp;' : '<span class="x">/</span>';
    html += `<span style="color:${color(si)}">` + s.chunks.map(c => c.p === '-' ? `<span class="d">${esc(c.l)}</span>` : esc(c.l)).join('') + '</span>';
  });
  return {html, ipa: fullIpa(syls)};
}
function showList() {
  const list = unitWords(S.unit);
  const title = S.unit === 'wrong' ? '错词本' : $('#unitLabel').textContent;
  openModal(`<h3>${esc(title)} · ${list.length} 个</h3>
    ${list.length ? '' : '<p class="sub">还没有单词</p>'}
    <table class="wl">${list.map((w, i) => {
      const sp = splitHtml(w);
      const wr = S.wrong[keyOf(w)];
      return `<tr>
        <td>${i + 1}</td>
        <td class="split" data-go="${i}">${sp.html}</td>
        <td class="pp">${esc(sp.ipa)}</td>
        <td>${esc(w.cn)}${S.unit === 'wrong' && wr ? ` <span class="sub">错 ${wr.count} 次</span>` : ''}</td>
        <td style="text-align:right;white-space:nowrap"><button class="pill" data-edit="${i}">改拆分</button></td>
      </tr>`;
    }).join('')}</table>
    <p class="sub">点单词跳过去练习 · 淡色字母不发音</p>`);
  $('#box').querySelectorAll('[data-go]').forEach(td => td.onclick = () => {
    const w = list[+td.dataset.go];
    const i = queue.findIndex(q => keyOf(q) === keyOf(w));
    if (i < 0) return;
    S.idx = i;
    closeModal();
    enterWord();
  });
  $('#box').querySelectorAll('[data-edit]').forEach(b => b.onclick = () => editSplit(list[+b.dataset.edit]));
}
function showStats() {
  const st = stats(), t = today(), goal = S.goal, w = st.today.w;
  const pct = Math.min(100, Math.round(w / goal * 100));
  const rate = st.today.n ? Math.round(st.today.ok / st.today.n * 100) : 0;
  const days = [];
  for (let i = 6; i >= 0; i--) { const dd = addDays(t, -i); days.push({dd, w: (S.days[dd] || {}).w || 0, now: i === 0}); }
  const max = Math.max(goal, 5, ...days.map(x => x.w));
  const bars = days.map(x => `<div class="bar"><span>${x.w || ''}</span><div class="bw"><div class="col ${x.now ? 'now' : ''}" style="height:${Math.round(x.w / max * 100)}%"></div></div>
    <small>${x.now ? '今天' : '周' + '日一二三四五六'[parseDay(x.dd).getDay()]}</small></div>`).join('');
  const plan = {tomorrow: 0, later: 0};
  for (const k in S.prog) {
    if (!ALLW[k]) continue;
    const d = S.prog[k].due;
    if (d > t) d === addDays(t, 1) ? plan.tomorrow++ : plan.later++;
  }
  const rows = BOOK_DATA.map(b => {
    const keys = [...new Set(b.units.flatMap(u => u.words.map(keyOf)))];
    let l = 0, m = 0;
    keys.forEach(k => { const p = S.prog[k]; if (p) { l++; if (p.box >= MASTERED_BOX) m++; } });
    const n = keys.length;
    return `<div class="brow"><span>${esc(b.name)}</span><div class="pbar"><i class="m" style="width:${m / n * 100}%"></i><i class="l" style="width:${(l - m) / n * 100}%"></i></div><small>已学 ${l}/${n} · 掌握 ${m}</small></div>`;
  }).join('');
  openModal(`<h3>学习统计</h3>
    <div class="sgrid">
      <div class="stat"><b>🔥 ${st.streak}</b><small>连续打卡（天）</small></div>
      <div class="stat"><b>${w}</b><small>今日练习（词）${st.today.n ? ' · 对 ' + rate + '%' : ''}</small></div>
      <div class="stat"><b>${st.learned}<small>/${st.total}</small></b><small>已学</small></div>
      <div class="stat"><b>${st.mastered}</b><small>已掌握</small></div>
    </div>
    <div>今日目标 ${w} / ${goal} 个词${w >= goal ? ' 🎉 已完成' : ''}</div>
    <div class="goalbar ${w >= goal ? 'full' : ''}"><i style="width:${pct}%"></i></div>
    <h4>最近 7 天（每天练了多少个词）</h4>
    <div class="bars">${bars}</div>
    <h4>复习安排</h4>
    <div class="plan"><div><b>${st.due}</b>今天要复习</div><div><b>${plan.tomorrow}</b>明天</div><div><b>${plan.later}</b>更晚</div></div>
    <h4>各册进度</h4>
    ${rows}
    <p class="sub" style="text-align:left">「掌握」= 隔了 7 天以上，听写还能一次拼对。词的总数里，重复出现的词只算一次。</p>
    <div class="sumbtns">
      <button class="pill pri" id="bsReview" ${st.due ? '' : 'disabled'}>开始复习（${st.due}）</button>
      <button class="pill" id="bsWrong" ${Object.keys(S.wrong).length ? '' : 'disabled'}>练错词（${Object.keys(S.wrong).length}）</button>
      <button class="pill" id="bsNew">学新词</button>
    </div>`);
  $('#bsReview').onclick = startReview;
  $('#bsNew').onclick = startNew;
  $('#bsWrong').onclick = startWrong;
}
function showSettings() {
  const chk = (k, label) => `<div class="row"><label><input type="checkbox" data-k="${k}" ${S[k] ? 'checked' : ''}>${label}</label></div>`;
  openModal(`<h3>设置</h3>
    <div class="row"><span>发音</span><span>
      <label style="display:inline-flex;gap:4px;margin-right:12px"><input type="radio" name="acc" value="uk" ${S.accent === 'uk' ? 'checked' : ''}>英式（和课本一致）</label>
      <label style="display:inline-flex;gap:4px"><input type="radio" name="acc" value="us" ${S.accent === 'us' ? 'checked' : ''}>美式</label></span></div>
    ${chk('autoPlay', '切换单词时自动发音（听写模式总是自动发音）')}
    ${chk('sylSpeak', '跟写、听写时，拼完一节读一节')}
    ${chk('showSent', '显示例句')}
    ${chk('sound', '音效（拼字的叮咚声、对错提示音）')}
    ${chk('praise', '拼对后读出夸奖的话（Good! Great! 等）')}
    ${chk('fx', '庆祝动画（彩带、弹出的夸奖字）')}
    ${chk('shuffle', '打乱顺序')}
    <div class="row"><span>每日目标</span><select id="selGoal">${[5, 10, 15, 20, 30, 50].map(n => `<option value="${n}" ${S.goal === n ? 'selected' : ''}>${n} 个词</option>`).join('')}</select></div>
    <div class="row"><span>错词本 ${Object.keys(S.wrong).length} 个</span><button class="pill" id="bClrWrong">清空错词本</button></div>
    <div class="row"><span>改过的拆分 ${Object.keys(S.custom).length} 个</span><button class="pill" id="bClrSplit">全部恢复默认</button></div>
    <div class="row"><span>学习记录（复习进度、打卡）</span><button class="pill" id="bClrProg">清空学习记录</button></div>
    <p class="sub">记录保存在这台电脑的浏览器里。发音优先用有道词典真人发音（要联网），没网时用浏览器自带朗读。音标是英式的，切到美式发音音标不变。</p>`);
  $('#box').querySelectorAll('[data-k]').forEach(c => c.onchange = () => {
    S[c.dataset.k] = c.checked; save();
    if (c.dataset.k === 'shuffle') { buildQueue(false); enterWord(); }
    else if (c.dataset.k === 'showSent') render();
  });
  $('#box').querySelectorAll('[name=acc]').forEach(r => r.onchange = () => { S.accent = r.value; save(); });
  $('#selGoal').onchange = e => { S.goal = +e.target.value; save(); updateChip(); };
  $('#bClrProg').onclick = () => {
    if (!confirm('清空所有复习进度和打卡记录？（错词本、改过的拆分不受影响）')) return;
    S.prog = {}; S.days = {}; save();
    if (S.unit === 'due') { S.unit = 0; buildQueue(false); enterWord(); } else renderHeader();
    showSettings();
  };
  $('#bClrWrong').onclick = () => { if (confirm('确定清空错词本？')) { S.wrong = {}; save(); if (S.unit === 'wrong') { buildQueue(false); enterWord(); } else renderHeader(); showSettings(); } };
  $('#bClrSplit').onclick = () => { if (confirm('把改过的拆分全部恢复默认？')) { S.custom = {}; save(); prepWord(); render(); showSettings(); } };
}

/* ================= 事件 ================= */
$('#tabs').onclick = e => { const b = e.target.closest('.tab'); if (b && b.dataset.m !== S.mode) setMode(b.dataset.m); };
$('#selBook').onchange = e => { S.book = e.target.value; if (S.unit !== 'wrong' && S.unit !== 'due') S.unit = 0; buildQueue(false); enterWord(); e.target.blur(); };
$('#selUnit').onchange = e => {
  const v = e.target.value;
  S.unit = isNaN(+v) ? v : +v;
  if (v === 'due' && S.mode === 'learn') S.mode = 'dictation'; // 复习要动手拼，不是看一遍
  buildQueue(false); enterWord(); e.target.blur();
};
$('#bStat').onclick = showStats;
$('#bList').onclick = showList;
$('#bSet').onclick = showSettings;
$('#bPrev').onclick = prev;
$('#bNext').onclick = next;
main.addEventListener('click', e => { if (!e.target.closest('button,a,.sents')) focusKb(); });

document.addEventListener('keydown', e => {
  if ($('#modal').classList.contains('on')) { if (e.key === 'Escape') closeModal(); return; }
  if (e.target.tagName === 'SELECT' || (e.target.tagName === 'INPUT' && e.target !== kb)) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (k === 'Process' || e.keyCode === 229) return; // 手机软键盘，交给 input 事件
  if (finished) {
    if (k === 'Enter') { e.preventDefault(); const b = main.querySelector('.pill.pri') || main.querySelector('[data-a]'); b && b.click(); }
    else if (k === 'ArrowLeft') { e.preventDefault(); prev(); }
    return;
  }
  if (k === 'ArrowRight') { e.preventDefault(); next(); return; }
  if (k === 'ArrowLeft') { e.preventDefault(); prev(); return; }
  if (!W) return;
  if (S.mode === 'learn') {
    if (k === ' ') { e.preventDefault(); playWord(); }
    else if (k === 'Enter') { e.preventDefault(); next(); }
    else if (k === 'r' || k === 'R') { e.preventDefault(); readBySyllable(); }
    return;
  }
  if (k === ' ') { e.preventDefault(); playWord(); return; }
  if (k === 'Tab') { e.preventDefault(); hint(); return; }
  if (k === 'Escape') { e.preventDefault(); reveal(); return; }
  if (k === 'Enter') { e.preventDefault(); if (W.done) next(); return; }
  if (/^[a-zA-Z]$/.test(k)) { e.preventDefault(); onLetter(k); }
});

// 手机软键盘：keydown 拿不到字母，从隐藏输入框读。
// 输入法组字（候选词）期间不能清空输入框，否则会打断输入法；改成记住处理到第几个字符，只处理新增的部分
let kbPrev = '';
function readKb() {
  const v = kb.value;
  // 和上次的内容比，只处理公共前缀之后的新字符：既能处理逐个追加，也能处理"删掉最后一个再换一个"
  let same = 0;
  while (same < v.length && same < kbPrev.length && v[same] === kbPrev[same]) same++;
  const fresh = v.slice(same);
  kbPrev = v;
  for (const ch of fresh) if (/[a-zA-Z]/.test(ch)) onLetter(ch);
}
function resetKb() { kb.value = ''; kbPrev = ''; }
kb.addEventListener('input', readKb);
kb.addEventListener('compositionend', () => { readKb(); setTimeout(resetKb, 0); });
kb.addEventListener('blur', () => setTimeout(resetKb, 0));

// 键盘弹起检测：可见区域比整窗高度明显变矮，就认为键盘开着
let vvMax = 0;
function onViewport() {
  const vv = window.visualViewport;
  if (!vv) return;
  vvMax = Math.max(vvMax, vv.height, window.innerHeight);
  // 有的浏览器键盘弹起时 innerHeight 也跟着变小，所以和见过的最大高度比
  const open = isTouch && document.activeElement === kb && vv.height < vvMax * 0.8;
  document.documentElement.style.setProperty('--vvh', vv.height + 'px');
  document.documentElement.classList.toggle('kbopen', !!open);
  if (open) window.scrollTo(0, 0);                 // iOS 键盘弹起时会把整页往上推，拉回来
}
if (window.visualViewport) {
  visualViewport.addEventListener('resize', onViewport);
  visualViewport.addEventListener('scroll', onViewport);
}
kb.addEventListener('focus', () => setTimeout(onViewport, 300));
kb.addEventListener('blur', () => setTimeout(onViewport, 100));
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};

/* ================= 启动 ================= */
buildQueue(true);
enterWord();
{ const n = dueList().length; if (n) toast(`⏰ 今天有 ${n} 个词要复习，在上面的单元里选「今日复习」`); }
</script>
