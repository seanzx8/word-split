:[["Wet weather always depresses me.","阴雨天总使我心情抑郁。"],["We arrived home soaking wet.","我们回到家时，浑身湿淋淋的。"],["It was a grey, wet, April Sunday.","那是一个阴沉、潮湿、4月里的星期天。"]]},{"l":"r.u.n","p":"r.ʌ.n","cn":"跑；奔跑（只要求理解）","s":[["I can run fast.","我能跑得快。"],["We've run short of milk.","我们牛奶不够了。"],["The batteries are running down.","电池快耗完了。"]]},{"l":"l.i.v/i.ng r.oo.m","p":"ˈl.ɪ.v/ɪ.ŋ r.uː.m","cn":"客厅；起居室","s":[["The living room is tiny.","这间起居室极小。"],["I'd like the use of your living room, if I may.","如果可以，我想用用你的起居室。"],["The living room is pockmarked with bullet holes.","起居室墙壁上坑坑洼洼地布满了弹孔。"]]},{"l":"s.a.f.e","p":"s.eɪ.f.-","cn":"安全的（只要求理解）","s":[["I'm so glad (that) you're safe!","你安然无恙我真高兴！"],["The children are quite safe here.","孩子们在这里十分安全。"],["'You're safe!' Tom cried in delight.","“你安全啦！”汤姆高兴地大声说道。"]]},{"l":"w.or.d","p":"w.ɜː.d","cn":"言语；单词；字","s":[["We never doubted her word.","我们从不怀疑她的许诺。"],["What's the meaning of this word?","这个单词的意思是什么？"],["That's a word I never use.","那是我从来不用的字眼。"]]},{"l":"w.a.sh","p":"w.ɒ.ʃ","cn":"洗","s":[["This sweater washes well.","这件套衫很耐洗。"],["These jeans need washing.","这条牛仔裤该洗了。"],["I must wash the car tomorrow.","我明天必须冲洗汽车。"]]},{"l":"h.e.l.p/f.u.l","p":"ˈh.e.l.p/f.ə.l","cn":"有帮助的；有用的（只要求理解）","s":[["She made helpful comments on my work.","她对我的工作提出了有益的意见。"],["Sorry I can't be more helpful.","对不起，我帮不上更多的忙。"],["You deserve a reward for being so helpful.","你帮了这么大的忙，理应受到奖励。"]]},{"l":"l.ou.d","p":"l.aʊ.d","cn":"说话太大声的；吵闹的（只要求理解）","s":[["A loud bang made me jump.","砰的一声巨响吓我一跳。"],["Loud voice can usually make the attacker calm down.","响亮的声音通常可以让攻击者冷静下来。"],["Loud screams rent the air.","高声的尖叫划破了天空。"]]},{"l":"s.l.ee.p","p":"s.l.iː.p","cn":"睡觉（只要求理解）","s":[["Never go to sleep angry.","永远不要带着怒气入睡。"],["Go to sleep —it's late.","快睡吧—不早了。"],["They sleep by day and hunt by night.","他们白天睡觉，夜晚捕猎。"]]},{"l":"b.e.d/r.oo.m","p":"ˈb.e.d/r.uː.m","cn":"卧室","s":[["The main bedroom is enormous.","主卧室大极了。"],["Both movies are about a monster in the bedroom cupboard.","两部电影都是关于卧室橱柜里的一个怪物。"],["The two bedrooms adjoin.","这两间卧室毗连。"]]},{"l":"k.i.tch/e.n","p":"ˈk.ɪ.tʃ/ɪ.n","cn":"厨房","s":[["The kitchen is a good size.","这厨房相当大。"],["Although small, the kitchen is well designed.","厨房虽小，但设计巧妙。"],["She secreted the gun in the kitchen cabinet.","她把枪藏在了厨房的橱柜里。"]]},{"l":"s.t.u.d/y","p":"ˈs.t.ʌ.d/i","cn":"书房","s":[["She's studying art history.","她正在研读艺术史。"],["This study builds on earlier work.","这项研究是在以往工作的基础上进行的。"],["Are you study in middle school?","你在中学读书吗？"]]},{"l":"b.a.th/r.oo.m","p":"ˈb.ɑː.θ/r.uː.m","cn":"浴室；洗手间","s":[["The bathroom is entirely my own creation.","这个浴室完全是我个人的创作。"],["Are you done hogging the bathroom?","你要霸占浴室到什么时候？"],["I went next door to the bathroom.","我进了隔壁的洗手间。"]]},{"l":"th.i.n.k","p":"θ.ɪ.ŋ.k","cn":"想；思考（只要求理解）","s":[["The news started me thinking.","那条消息让我思考起来。"],["I'm only thinking of you.","我只是在为你着想。"],["Already, she is thinking ahead.","她早就在考虑未来了。"]]},{"l":"w.or.k","p":"w.ɜː.k","cn":"（花费时间和精力）做（某事）；工作（只要求理解）","s":[["He works in insurance.","他在保险业工作。"],["It works by electricity.","这是电动的。"],["I work in advertising.","我在广告业工作。"]]},{"l":"h.ar.d","p":"h.ɑː.d","cn":"努力地；费力地（只要求理解）","s":[["She tried extra hard.","她特别努力。"],["It's pretty hard to explain.","这事很难解释清楚。"],["That's a very hard question.","那是个很难的问题。"]]},{"l":"f.o.l/l.ow","p":"ˈf.ɒ.l/-.əʊ","cn":"遵循，听从（忠告、指示等）（只要求理解）","s":[["Other problems may follow.","其它问题也许会随之而来。"],["If you lead, I'll follow.","你领头，我跟着。"],["Sorry—I don't quite follow.","对不起，我不太听懂你的话。"]]},{"l":"f.ee.l","p":"f.iː.l","cn":"觉得；感到（只要求理解）","s":[["I feel absolutely terrific today!","我今天的感觉真是好极了！"],["Are you feeling all right?","你感觉还好吗？"],["I am feeling very depressed.","我感到很沮丧。"]]}]},{"name":"Unit 3 Time for school","words":[{"l":"o/v.er","p":"ˈəʊ/v.ə","cn":"结束（的）（只要求理解）","s":[["Thank goodness that's over!","谢天谢地，事情总算过去了！"],["Well, thank goodness that's over!","好啦，谢天谢地，这件事总算过去了！"],["His dark head bent over her.","他对她低下他那黑发的头。"]]},{"l":"k.i.d","p":"k.ɪ.d","cn":"小孩（只要求理解）","s":[["She's a bright kid.","她是个聪明孩子。"],["Kids love dressing up.","孩子们都喜欢装扮成别人玩儿。"],["Will you kids just behave!","孩子们，规矩点！"]]},{"l":"d.i.n/n.er","p":"ˈd.ɪ.n/-.ə","cn":"（中午或晚上吃的）正餐","s":[["It's time for dinner.","该吃饭了。"],["It's your turn to cook dinner.","该你做饭了。"],["What time do you serve dinner?","你们什么时候供应主餐？"]]},{"l":"ar.t","p":"ɑː.t","cn":"美术；艺术","s":[["She's studying art history.","她正在研读艺术史。"],["Where is the art room?","绘画教室在哪里？"],["She's good at art and design.","她擅长美术和设计。"]]},{"l":"l.u.n.ch","p":"l.ʌ.n.tʃ","cn":"午餐","s":[["We'll leave after lunch.","我们将在午饭后动身。"],["Who's getting the lunch?","谁在做中午饭？"],["For lunch, dress is informal.","吃午餐可以穿着休闲装。"]]},{"l":"m.a.th.s","p":"m.æ.θ.s","cn":"数学","s":[["Where is you maths book?","你的数学书在哪里？"],["He has lost his maths book.","他已经把数学书丢了。"],["I want a Maths book. Where can I find it?","我想要一本数学书。我在哪里能找到它？"]]},{"l":"g.e.t u.p","p":"ɡ.e.t ʌ.p","cn":"起床","s":[["I generally get up at six.","我一般六点钟起床。"],["Do you have difficulty getting up?","你起床有困难吗？"],["We've got to get up early, all right?","我们得早起床，可以吧？"]]},{"l":"g.o t.o s.ch.oo.l","p":"ɡ.əʊ t.uː s.k.uː.l","cn":"上学","s":[["They go to school by bike.","他们经常骑自行车去上学。"],["She will have to go to school.","她将不得不去上学。"],["Some children can read and write before they go to school.","有些孩子在上学前就会看书写字了。"]]},{"l":"g.o h.o.m.e","p":"ɡ.əʊ h.əʊ.m.-","cn":"回家","s":[["Are you going home for Thanksgiving?","你回家过感恩节吗？"],["Let's go home—it's getting late.","咱们回家吧，时间不早了。"],["Come (my) dearest, let's go home.","好啦，亲爱的，咱们回家吧。"]]},{"l":"g.o t.o b.e.d","p":"ɡ.əʊ t.uː b.e.d","cn":"上床睡觉","s":[["I think it's time to go to bed.","我想该睡觉了。"],["You'd better go to bed and nurse that cold.","你最好上床睡觉，把感冒治好。"],["She was the last to go to bed.","她是最后一个睡觉的人。"]]},{"l":"w.a.n.t","p":"w.ɒ.n.t","cn":"想要（只要求理解）","s":[["What do you want?","你要什么？"],["They desperately wanted a child.","他们非常想要一个孩子。"],["I don't want your pity.","我用不着你可怜。"]]},{"l":"c.l.o.ck","p":"k.l.ɒ.k","cn":"时钟（只要求理解）","s":[["The clock showed midnight.","时钟显示已是午夜。"],["I set my alarm clock for 4:30.","我把闹钟定在4:30。"],["I set the alarm clock for 7 o'clock.","我把闹钟定在7点钟闹响。"]]},{"l":"j.u.s.t","p":"dʒ.ʌ.s.t","cn":"只是；仅仅；正要（只要求理解）","s":[["I've just finished Chapter 3.","我刚完成第3章。"],["Will you kids just behave!","孩子们，规矩点！"],["I'm just finishing my book.","眼下我正在完成我的一本书。"]]},{"l":"m.i.n/u.t.e","p":"ˈm.ɪ.n/ɪ.t.-","cn":"分钟（只要求理解）","s":[["The minutes dragged past.","时间一分一分地过去了。"],["OK, wait just a minute.","好的，稍微等一下。"],["Only a minute amount is needed.","只需很少的一点。"]]}]},{"name":"Unit 4 Going shopping","words":[{"l":"t.r.ou/s.er.s","p":"ˈt.r.aʊ/z.ə.z","cn":"裤子","s":[["These trousers are a bit tight.","这条裤子有点紧。"],["The trousers have a fly fastening.","这条裤子是前开口。"],["He was dressed in khaki trousers.","他穿着一条卡其色的裤子。"]]},{"l":"p.air","p":"p.eə","cn":"（由连在一起的相似两部分构成的）一条，一副（只要求理解）","s":[["Maximo put on a pair of glasses.","马克西莫戴上了一副眼镜。"],["I need a new pair of specs.","我需要一副新眼镜。"],["Don't tell me you've split another pair of pants!","你不会又把一条裤子撑破了吧！"]]},{"l":"c.l.o.th.e.s","p":"k.l.əʊ.ð.-.z","cn":"衣服；服装（只要求理解）","s":[["He wears monkey clothes.","他穿着猴子服。"],["She makes her own clothes.","她自己做衣服。"],["We packed away the summer clothes.","我们把夏装收藏起来了。"]]},{"l":"th.o.s.e","p":"ð.əʊ.z.-","cn":"（指较远的人或事物）那些（只要求理解）","s":[["Are those real flowers?","那些是真花吗？"],["What are those buildings?","那些建筑物是什么？"],["No, silly, those aren't your shoes!","不对，傻孩子，那不是你的鞋！"]]},{"l":"sh.or.t.s","p":"ʃ.ɔː.t.s","cn":"短裤","s":[["He was wearing a T-shirt and shorts.","他穿着T恤衫和短裤。"],["My shorts were chafing my thighs.","我的短裤蹭得我大腿疼。"],["She wore shorts and a halter top.","她穿一条短裤和一件颈部系带的上衣。"]]},{"l":"j.a.ck/e.t","p":"ˈdʒ.æ.k/ɪ.t","cn":"夹克衫；短上衣","s":[["I'll take the grey jacket.","我要那件灰色夹克衫。"],["This jacket is just my size.","这件夹克正合我的尺码。"],["Does this jacket go with this skirt?","这件上衣与这条裙子相配吗？"]]},{"l":"s.k.ir.t","p":"s.k.ɜː.t","cn":"裙子","s":[["Short skirts are back.","短裙又流行起来了。"],["She usually wears long skirts.","她通常穿长裙。"],["The skirt has a side opening.","这裙子是侧面开口的。"]]},{"l":"d.ear","p":"d.ɪə","cn":"亲爱的（只要求理解）","s":[["What's your name, dear?","你叫什么名字，亲爱的？"],["My dear girl, you're wrong.","我亲爱的姑娘，你错了。"],["Would you like a drink, dear?","喝点什么吗，亲爱的？"]]},{"l":"e.x/p.e.n/s.i.v.e","p":"ɪ.ks/ˈp.e.n/s.ɪ.v.-","cn":"昂贵的；价格高的","s":[["It's so expensive to borrow from finance companies.","向金融公司借款费用真够高的。"],["Firstly, it's expensive, and secondly, it's too slow.","首先是价格贵，其次，速度太慢。"],["Skiing gear can be expensive.","滑雪用具有时会很昂贵。"]]},{"l":"t.a.k.e","p":"t.eɪ.k.-","cn":"买下（只要求理解）","s":[["We take the 'Express'.","我们订阅的是《快报》。"],["Take back your wheel!","拿回你的轮子！"],["I'll take the grey jacket.","我要那件灰色夹克衫。"]]},{"l":"ch.ea.p","p":"tʃ.iː.p","cn":"便宜的","s":[["Cycling is a cheap way to get around.","骑自行车是一种省钱的旅游方式。"],["It wasn't cheap. Anything but.","它不便宜。绝对不。"],["The meal was amazingly cheap.","这餐饭便宜得出奇。"]]},{"l":"sh.oe","p":"ʃ.uː","cn":"鞋","s":[["Put away your shoes.","把鞋子放好。"],["What are these, clown shoes?","这些是什么？小丑鞋？"],["No, silly, those aren't your shoes!","不对，傻孩子，那不是你的鞋！"]]},{"l":"b.eau/t.i/f.u.l","p":"ˈb.juː/t.ɪ/f.ə.l","cn":"美丽的","s":[["New England is beautiful.","新英格兰很迷人。"],["These chopsticks are beautiful!","这些筷子真漂亮！"],["It's a beautiful, clean and orderly city.","这是一座美丽、干净、整齐的城市。"]]},{"l":"h.a.t","p":"h.æ.t","cn":"帽子","s":[["I've always hated cabbage.","我从来都讨厌吃卷心菜。"],["That's a cool hat.","那是一顶很酷的帽子。"],["Our cat hates being handled.","我们的猫不喜欢被人摸弄。"]]},{"l":"s.u.n/g.l.a.ss/e.s","p":"ˈs.ʌ.n/ɡ.l.ɑː.s/ɪ.z","cn":"太阳镜；墨镜","s":[["My sunglasses were in pieces.","我的太阳镜碎了。"],["She sat up and removed her designer sunglasses.","她坐起来，摘掉她的时尚墨镜。"],["These sunglasses are designed to reduce glare.","这些太阳镜是为减少刺眼的强光而设计的。"]]},{"l":"f.r.ee","p":"f.r.iː","cn":"免费的（只要求理解）","s":[["Delivery is free of charge.","免费送货。"],["The newspaper is distributed free.","这份报纸免费发送。"],["Entry to the museum is free.","这座博物馆免费参观。"]]},{"l":"l.ar.g.e","p":"l.ɑː.dʒ.-","cn":"（服装、食物、日用品等）大型号的（只要求理解）","s":[["Break into large pieces.","撕成大片。"],["The wheels are usually fairly large.","该机轮通常相当大。"],["Her killer is still at large.","杀害她的凶手仍然逍遥法外。"]]},{"l":"s.i.z.e","p":"s.aɪ.z.-","cn":"尺码；号（只要求理解）","s":[["This jacket is just my size.","这件夹克正合我的尺码。"],["What size shoes do you take?","你穿多大号的鞋？"],["The kitchen is a good size.","这厨房相当大。"]]},{"l":"l.i.s.t","p":"l.ɪ.s.t","cn":"清单；目录（只要求理解）","s":[["I am already on your mailing list.","我已经列在你的邮寄名单上了。"],["They will not be on the 5A scenic spot list.","它们不会出现在 5A 级风景区的名单上。"],["Keep a running list, and cross out the ones you have read.","持续更新列表，把你读过的划掉。"]]},{"l":"t.r.y o.n","p":"t.r.aɪ ɒ.n","cn":"试穿（只要求理解）","s":[["You can try on this schoolbag.","您可以试背一下这个书包。"],["Let the child try on as many as she likes.","让这个孩子爱试穿多少就试多少吧。"],["Try on clothing and shoes to make sure they fit.","衣服和鞋要试穿以确保它们合适。"]]},{"l":"a.n/y","p":"ˈe.n/i","cn":"任何的；任一的（只要求理解）","s":[["Any colour will do.","什么颜色都行。"],["Any shopping center is fine.","任何购物中心都可以。"],["Do you give any discount?","你们打折吗？"]]}]},{"name":"Unit 5 Farms and us","words":[{"l":"c.ow","p":"k.aʊ","cn":"奶牛","s":[["Do you know how to milk a cow?","你知道怎样挤牛奶吗？"],["A cow will give a kid milk every day.","奶牛每天都会给一头小牛喂奶。"],["The disease is more commonly known as Mad Cow Disease.","这种病一般更多地被称作“疯牛病”。"]]},{"l":"h.or.s.e","p":"h.ɔː.s.-","cn":"马","s":[["This horse needs firm handling.","这匹马需要严加训练。"],["The horse slowed to a walk.","那匹马慢下来缓步而行。"],["Is this gift a Trojan horse?","这个礼物该不会是特洛伊木马吧？"]]},{"l":"sh.ee.p","p":"ʃ.iː.p","cn":"羊；绵羊","s":[["Sheep were grazing in the fields.","羊在野地里吃草。"],["They kept a small flock of sheep.","他们养了一小群绵羊。"],["The field had been grazed by sheep.","这块地羊已经啃过了。"]]},{"l":"p.i.g","p":"p.ɪ.ɡ","cn":"猪","s":[["These guys destroyed the company. They're all a bunch of greedy pigs.","这些家伙毁了公司。他们是一群贪婪的猪。"],["\"A talking pig!\" he exclaimed. \"Well, I'll be darned.\"","“一头会说话的猪！”他惊叫到，“啊，我太惊奇了”。"],["When would they be hired again? Perhaps, as the saying goes, when pigs fly.","他们什么时候会被重新雇用？也许正像俗话说的，等到猴年马月吧。"]]},{"l":"ch.i.ck/e.n","p":"ˈtʃ.ɪ.k/ɪ.n","cn":"鸡；鸡肉","s":[["I have to feed chickens in my back yard.","我必须去喂食后院的鸡。"],["Chickens pecked in the dust.","小鸡们在尘土中啄食。"],["The chicken was only half cooked.","鸡只煮了半熟。"]]},{"l":"t.o/m.a/t.o","p":"t.ə/ˈm.ɑː/t.əʊ","cn":"西红柿","s":[["It's similar in size to a tomato.","大小和西红柿差不多。"],["Cut the plum tomatoes in half.","把这个李子形番茄对半切开。"],["The tomato hit the wall with a splat.","西红柿啪的一声打在墙上。"]]},{"l":"b.ee","p":"b.iː","cn":"蜜蜂（只要求理解）","s":[["Bees buzzed lazily among the flowers.","蜜蜂在花丛中懒洋洋地嗡嗡叫着。"],["The flower opens to reveal a bee.","花开了，露出来一只蜜蜂。"],["Without bees visiting flowers in this way, many plants would die out.","如果没有蜜蜂以这种方式采花，许多植物将会灭绝。"]]},{"l":"m.ou.s.e","p":"m.aʊ.s.-","cn":"（复数mice）老鼠（只要求理解）","s":[["A cat often plays with a mouse before the kill.","猫在咬死老鼠之前常常要耍弄它一番。"],["He moves the cursor, clicks the mouse.","他移动光标，点击鼠标。"],["The mouse ran away, squeaking with fear.","那只老鼠吓得尖叫着溜了。"]]},{"l":"c.a.r/r.o.t","p":"ˈk.æ.r/-.ə.t","cn":"胡萝卜","s":[["The carrot is his favorite vegetable.","胡萝卜是他最喜欢的蔬菜。"],["Her carrot cake is divine.","她的胡萝卜饼好吃极了。"],["It's never a carrot or a peach.","从来没有胡萝卜或桃子。"]]},{"l":"p.o/t.a/t.o","p":"p.ə/ˈt.eɪ/t.əʊ","cn":"土豆","s":[["I'll dig some potatoes for lunch.","我要挖点土豆作午餐。"],["He's a real meat-and-potatoes guy.","他是个十分崇尚简朴的人。"],["She put some potatoes on to boil.","她煮了些土豆。"]]},{"l":"g.r.ee.n b.ea.n","p":"ɡ.r.iː.n b.iː.n","cn":"青刀豆；四季豆（只要求理解）","s":[["We have green bean casserole and pumpkin pie.","我们有绿豆焙盘和南瓜馅饼。"],["Each of us chose from the many pots of tomato juice, green beans and jelly.","我们每个人都从许多罐番茄汁、青豆和果冻中挑选。"]]},{"l":"c.a.n","p":"k.æ.n","cn":"（盛食品或饮料的）金属罐（只要求理解）","s":[["Can we change seats?","咱们可以交换一下座位吗？"],["Can I come too?","我也可以来吗？"],["I can run fast.","我能跑得快。"]]},{"l":"a b.o.x o.f","p":"ə b.ɒ.ks ə.v","cn":"一盒，一箱（东西）（只要求理解）","s":[]}]},{"name":"Unit 6 On the farm","words":[{"l":"f.ee.d","p":"f.iː.d","cn":"给（人或动物）食物；饲养","s":[["Can you feed the cat, please?","请你喂一下猫好吗？"],["There are many advantages to breast feeding.","母乳喂养的好处很多。"],["New fathers love bottle-feeding their babies.","新爸爸们喜欢用奶瓶喂他们的婴儿。"]]},{"l":"p.a.ss","p":"p.ɑː.s","cn":"给；递（只要求理解）","s":[["He's determined to pass this time.","这一回他决心要考及格。"],["He largely passed over the government's record.","他对政府的相关记录基本上是避而不谈。"],["Memorize a poem and pass it on.","记住一首诗并把它传下去。"]]},{"l":"p.i.ck","p":"p.ɪ.k","cn":"采；摘","s":[["I picked some flowers.","我摘了一些花。"],["I'll pick you up at five.","我五点钟来接你。"],["She picked me a bunch of flowers.","她给我采了一束鲜花。"]]},{"l":"m.i.l.k","p":"m.ɪ.l.k","cn":"挤奶","s":[["Is this milk fresh?","这是鲜牛奶吗？"],["She's gone for some milk.","她买牛奶去了。"],["We've run short of milk.","我们牛奶不够了。"]]},{"l":"k.n.i.f.e","p":"-.n.aɪ.f.-","cn":"刀","s":[["This knife needs sharpening.","这把刀需要磨了。"],["The knife sliced his jacket.","那把刀划破了他的上衣。"],["The knife pierced through his coat.","刀子刺穿了他的外衣。"]]},{"l":"f.or.k","p":"f.ɔː.k","cn":"餐叉","s":[["She popped a balloon with her fork.","她用叉子把气球砰的一声戳爆了。"],["She stabbed the air with her fork.","她用叉子在空中比画。"],["Visitors to the castle had to fork out for a guidebook.","参观城堡的游客得为一本旅游指南掏很多钱。"]]},{"l":"ch.o.p/s.t.i.ck","p":"ˈtʃ.ɒ.p/s.t.ɪ.k","cn":"（常用复数）筷子","s":[["These chopsticks are beautiful!","这些筷子真漂亮！"],["Don't bite the chopsticks.","不要咬筷子。"],["He buys some Chinese chopsticks.","他买了一些中国的筷子。"]]},{"l":"w.a.s.t.e","p":"w.eɪ.s.t.-","cn":"浪费；废品（只要求理解）","s":[["I hate unnecessary waste.","我憎恨不必要的浪费。"],["It's a waste of time and energy.","那是浪费时间和精力。"],["It's sinful to waste good food!","浪费好好的食物是有罪的！"]]},{"l":"f.oo.d","p":"f.uː.d","cn":"菜肴；食物（只要求理解）","s":[["She couldn't digest food properly.","她无法正常消化食物。"],["My favorite food is dumpling.","我最喜欢的食物是饺子。"],["She had to steal food just to stay alive.","她得偷食物才不至于饿死。"]]},{"l":"d.e/l.i.cious","p":"d.ɪ/ˈl.ɪ.ʃəs","cn":"美味的；可口的（只要求理解）","s":[["This pancake tastes delicious.","这煎饼尝起来味道不错。"],["He served up a delicious meal.","他端上一顿可口的饭菜。"],["She served us a delicious lunch.","她招待我们吃了一顿可口的午餐。"]]},{"l":"c.l.ear th.e t.a/b.le","p":"k.l.ɪə ð.ə ˈt.eɪ/b.l","cn":"收拾餐桌（只要求理解）","s":[]},{"l":"s.e.t th.e t.a/b.le","p":"s.e.t ð.ə ˈt.eɪ/b.l","cn":"摆放餐具（只要求理解）","s":[["One would shop and cook, another would set the table and another would wash up.","一人会购物和烹饪，一人摆桌子，另外一人洗餐具。"]]},{"l":"b.ow.l","p":"b.əʊ.l","cn":"碗","s":[["I go bowling for relaxation.","我玩保龄球放松自己。"],["The Giants won the Super Bowl in 1987.","巨人队在1987年赢得超级杯。"],["I have a bowl of cereal every morning.","我每天早上吃一碗麦片粥。"]]},{"l":"s.p.oo.n","p":"s.p.uː.n","cn":"勺；匙；调羹","s":[["He stirred his coffee with a spoon.","他用匙搅了搅咖啡。"],["She licked the spoon clean.","她把调羹舔得干干净净。"],["She licked the honey off the spoon.","她舔光了调羹上的蜂蜜。"]]},{"l":"s.u/p.er/m.ar/k.e.t","p":"ˈs.uː/p.ə/m.ɑː/k.ɪ.t","cn":"超市（只要求理解）","s":[["I do a weekly shop at the supermarket.","我一周上超市一次。"],["He openly shoplifted from a supermarket.","他在一家超市公然行窃。"],["The gang did a warehouse and a supermarket.","那帮匪徒抢劫了一个仓库和一家超级市场。"]]},{"l":"h.er/s.e.l.f","p":"h.ɜː/ˈs.e.l.f","cn":"（用作女性的反身代词）她自己，自己（只要求理解）","s":[["She fancies herself (as) a serious actress.","她自以为是严肃的演员。"],["She keeps herself apart from other people.","她与其他人保持距离。"],["She forced herself to be polite to them.","她对他们强装客气。"]]},{"l":"w.ee.k","p":"w.iː.k","cn":"周；星期（只要求理解）","s":[["The course lasts five weeks.","这门课程上五周。"],["The program aired last week.","该节目已于上周播出。"],["I'll see you Thursday week.","我们下星期四见。"]]},{"l":"s.a.l/a.d","p":"ˈs.æ.l/ə.d","cn":"蔬菜沙拉（只要求理解）","s":[["Can I help you to some more salad?","再给你来点色拉好吗？"],["Is cold meat and salad OK for lunch?","午饭吃冷肉和色拉行吗？"],["What's your favorite food? My favorite food is salad.","你最喜欢什么食物？我最喜欢的食物是沙拉。"]]}]},{"name":"Unit 7 Numbers 数词","words":[{"l":"o.n.e","p":"wʌ.n.-","cn":"一","s":[["No one doubted his ability.","没有人怀疑他的能力。"],["Listen, I finish at one.","听着，我一点钟结束。"],["Only one carry-on is allowed.","随身只能携带一个小包。"]]},{"l":"t.w.o","p":"t.-.uː","cn":"二","s":[["Two files have gone missing.","两个档案不见了。"],["You have two giraffe toys.","你有两个长颈鹿玩具。"],["The journey time is two hours.","旅程时间为两个小时。"]]},{"l":"th.r.ee","p":"θ.r.iː","cn":"三","s":[["Three fives are fifteen.","三个五等于十五。"],["She has three world titles.","她已获得三项世界冠军。"],["The car crash claimed three lives.","那次撞车事故导致三人死亡。"]]},{"l":"f.our","p":"f.ɔː","cn":"四","s":[["They have four satellite channels.","他们有4个卫星频道。"],["Four quarters make a whole.","四个四分之一构成一个整体。"],["There's only four days left.","只剩下四天了。"]]},{"l":"f.i.v.e","p":"f.aɪ.v.-","cn":"五","s":[["Three fives are fifteen.","三个五等于十五。"],["The course lasts five weeks.","这门课程上五周。"],["He arrived around five o'clock.","他大约是五点钟到的。"]]},{"l":"s.i.x","p":"s.ɪ.ks","cn":"六","s":[["It's gone six o'clock already.","过了六点了。"],["I waited while six o'clock.","我一直等到了六点钟。"],["I generally get up at six.","我一般六点钟起床。"]]},{"l":"s.e.v/e.n","p":"ˈs.e.v/ə.n","cn":"七","s":[["She's seven months gone.","她怀孕七个月了。"],["We started German in year seven.","我们在七年级开始学习德语。"],["I'll call for you at seven o'clock.","我7点钟去接你。"]]},{"l":"eigh.t","p":"eɪ.t","cn":"八","s":[["Wake up! It's eight o'clock.","醒醒吧！已经八点钟了。"],["The cut needed eight stitches.","这道伤口需要缝八针。"],["Achcha! We'll meet at eight.","好吧！我们八点钟见。"]]},{"l":"n.i.n.e","p":"n.aɪ.n.-","cn":"九","s":[["Everything changed after nine-eleven.","九一一事件发生后，一切都改变了。"],["They have two children aged six and nine.","他们有两个小孩，一个六岁，一个九岁。"],["What do you get if you multiply six by nine?","6乘以9得多少？"]]},{"l":"t.e.n","p":"t.e.n","cn":"十","s":[["It's ten past twelve.","现在十二点十分。"],["We're leaving round about ten.","我们十点钟左右出发。"],["I tend to work in bursts.","我的工作劲头往往是一阵一阵的。"]]},{"l":"e/l.e.v/e.n","p":"ɪ/ˈl.e.v/ə.n","cn":"十一","s":[["Everything changed after nine-eleven.","九一一事件发生后，一切都改变了。"],["It's eleven o'clock at night in Moscow.","现在莫斯科是晚上11点。"],["Charles I ruled for eleven years.","查理一世统治了十一年。"]]},{"l":"t.w.e.l.v.e","p":"t.w.e.l.v.-","cn":"十二","s":[["It's ten past twelve.","现在十二点十分。"],["He retired twelve batters in a row.","他一连使十二个击球手出局。"],["Twelve hours later she was all smiles again.","十二小时之后，她又喜笑颜开了。"]]},{"l":"th.ir/t.ee.n","p":"ˌθ.ɜː/ˈt.iː.n","cn":"十三","s":[["\"Thirteen?\" he guessed wildly.","“十三？”他胡乱猜道。"],["He ran away from home at the age of thirteen.","他十三岁时离家出走。"],["Thirteen is often considered an unlucky number.","十三常被认为是不吉利的数字。"]]},{"l":"f.our/t.ee.n","p":"ˌf.ɔː/ˈt.iː.n","cn":"十四","s":[["I'm fourteen years old.","我14岁。"],["\"Fourteen minutes,\" Chris said, taking a peep at his watch.","“十四分钟，”克里斯瞥了一眼手表说道。"],["Women are advised not to drink more than fourteen units of alcohol per week.","建议妇女每周饮酒不超过十四个酒精单位。"]]},{"l":"f.i.f/t.ee.n","p":"ˌf.ɪ.f/ˈt.iː.n","cn":"十五","s":[["Three fives are fifteen.","三个五等于十五。"],["The average runner can run 2 miles in fifteen minutes.","这名跑步的人水平一般，十五分钟可以跑两英里"],["The talks began some fifteen minutes late.","商谈迟了约十五分钟才开始。"]]},{"l":"s.i.x/t.ee.n","p":"ˌs.ɪ.ks/ˈt.iː.n","cn":"十六","s":[["He worked sixteen hours a day.","他每天工作16个小时。"],["She is sixteen but has a mental age of five.","她十六岁，而智力年龄是五岁。"],["Sixteen times as many men are colour-blind as women.","色盲的男性人数是女性人数的十六倍。"]]},{"l":"s.e.v/e.n/t.ee.n","p":"ˌs.e.v/ə.n/ˈt.iː.n","cn":"十七","s":[["Jenny is seventeen years old.","珍妮17岁。"],["He had confessed to seventeen murders.","他已供认了17项谋杀罪。"],["Nora thought he was seventeen years old.","诺拉觉得他有17岁。"]]},{"l":"eigh/t.ee.n","p":"ˌeɪ/ˈt.iː.n","cn":"十八","s":[["My classmate is eighteen.","我的同学十八岁。"],["His boat is an eighteen-footer.","他的小船长十八英尺。"],["The party was ousted from power after eighteen years.","该党执政十八年后被赶下台。"]]},{"l":"n.i.n.e/t.ee.n","p":"ˌn.aɪ.n.-/ˈt.iː.n","cn":"十九","s":[["They have nineteen days to make up their minds.","他们有十九天的时间来做出决定。"],["It's only nineteen yuan.","它只要十九元。"],["Ten plus nine is nineteen.","十加九是十九。"]]},{"l":"t.w.e.n/t.y","p":"ˈt.w.e.n/t.i","cn":"二十","s":[["So that's twenty of each sort, right?","那么，每一种都是二十个，对不对？"],["Twenty-eight is divisible by seven.","二十八可以被七整除。"],["I've been waiting (for) twenty minutes.","我等了二十分钟。"]]},{"l":"th.ir/t.y","p":"ˈθ.ɜː/t.i","cn":"三十","s":[["Six goes into thirty five times.","6除30得5。"],["Some thirty people attended the funeral.","大约有三十人参加了葬礼。"],["By sunset we had covered thirty miles.","到日落时我们已走了三十英里。"]]},{"l":"f.or/t.y","p":"ˈf.ɔː/t.i","cn":"四十","s":[["Fifty is the new forty.","四十尚未老，五十正当年。"],["My car does forty miles to the gallon.","我的车每加仑汽油跑四十英里。"],["Forty-three members of the expedition were killed.","探险队中43名成员丧生。"]]},{"l":"f.i.f/t.y","p":"ˈf.ɪ.f/t.i","cn":"五十","s":[["Fifty is the new forty.","四十尚未老，五十正当年。"],["We have invited fifty people altogether.","我们共邀请了五十人。"],["Let's split this fifty-fifty.","咱们把这平分了吧。"]]},{"l":"s.i.x/t.y","p":"ˈs.ɪ.ks/t.i","cn":"六十","s":[["She is close on sixty.","她快满六十岁了。"],["Ruth hit sixty home runs that year.","露丝那一年击中了60个本垒打。"],["Sixty of his subordinate officers followed his example.","他的60个下级官员都以他为榜样。"]]},{"l":"s.e.v/e.n/t.y","p":"ˈs.e.v/ə.n/t.i","cn":"七十","s":[["Seventy people were killed.","70人丧生。"],["How old is she—seventy odd?","她多大年纪？七十出头？"],["Seventy thousand tons of oil spilled from the tanker.","7万吨油从油轮漏出。"]]},{"l":"eigh/t.y","p":"ˈeɪ/t.i","cn":"八十","s":[["He's getting on for eighty.","他近八十岁了。"],["Eighty horses trotted up.","80匹马小跑上来。"],["Eighty million years ago, dinosaurs ruled the earth.","八千万年前，地球是恐龙的天下。"]]},{"l":"n.i.n.e/t.y","p":"ˈn.aɪ.n.-/t.i","cn":"九十","s":[["You got here with ninety seconds to spare.","你们到达这里时还剩有90秒钟。"],["Her weight was under ninety pounds.","她的体重不足90磅。"],["You were never a ninety-eight pound weakling.","你从来就不是一个体重98磅、体质孱弱的人。"]]},{"l":"h.u.n/d.r.e.d","p":"ˈh.ʌ.n/d.r.ə.d","cn":"百","s":[["A hundred cents make one euro.","一百分币等于一欧元。"],["I'm not a hundred per cent sure.","我不能百分之百肯定。"],["I still don't feel a hundred per cent.","我还是觉得有些不舒服。"]]}]}]},{"id":"pep5a","name":"人教 五年级上册（新教材）","units":[{"name":"Unit 1 Different friends","words":[{"l":"t.ea.m","p":"t.iː.m","cn":"（游戏或运动的）队；（一起工作的）组，班（只要求理解）","s":[["He trains the Olympic team.","他训练奥林匹克队。"],["The teams served up some fantastic entertainment.","这些队献上了精彩的表演。"],["We already have our core team in place.","我们的核心队伍已经就位。"]]},{"l":"p.l.ay/er","p":"ˈp.l.eɪ/ə","cn":"运动员；参赛选手（只要求理解）","s":[["What happens when new players emerge?","当新的参与者出现时，会发生什么呢？"],["She's a good all-round player.","她是个优秀的全能选手。"],["He's not much of a tennis player.","他算不上网球好手。"]]},{"l":"h.i.m","p":"h.ɪ.m","cn":"他（只要求理解）","s":[["She'd forgive him anything.","她会原谅他的任何事。"],["You wouldn't know him.","你一定不认识他。"],["The long journey tired him.","漫长的旅程使他疲倦。"]]},{"l":"l.o.v.e/l.y","p":"ˈl.ʌ.v.-/l.i","cn":"美丽的；优美的","s":[["You look lovely, Marcia.","你看起来很美，马西娅。"],["\"How lovely,\" she murmured.","“多可爱呀，”她低声说。"],["She looked particularly lovely that night.","她那天晚上特别妩媚动人。"]]},{"l":"c.l.e.v/er","p":"ˈk.l.e.v/ə","cn":"聪明的；聪颖的","s":[["He's a very clever man.","他是个很聪明的人。"],["It's Jim who's the clever one.","就数吉姆聪明。"],["'You are clever,' she gushed.","“你好聪明。”她夸张地称赞说。"]]},{"l":"y.ou.ng","p":"j.ʌ.ŋ","cn":"幼小的；年轻的","s":[["He's a brilliant young scientist.","他是一个才华横溢的青年科学家。"],["Young people are very environmentally aware.","年轻人的环保意识很强。"],["This young musician has a bright future.","这位年轻的音乐家前途无量。"]]},{"l":"h.ar.d/-.w.or/k.i.ng","p":"ˌh.ɑː.d/-.ˈw.ɜː/k.ɪ.ŋ","cn":"工作努力的；辛勤的","s":[["He is honest, sober and hard-working.","他诚实、稳重、勤奋。"],["We are looking for someone who is reliable and hard-working.","我们在物色可靠而又勤奋的人。"],["I remember her as a quiet, hard-working and well-spoken girl.","我记得她是个安静、勤奋且谈吐优雅的女孩子。"]]},{"l":"sc.i/ence","p":"ˈs.aɪ/əns","cn":"科学；自然科学（只要求理解）","s":[["What turns teenagers off science?","是什么使青少年们对科学失去了兴趣？"],["He loves science fiction in particular.","他特别喜爱科幻小说。"],["Accurate measurement is very important in science.","在科学领域，精确的测量非常重要。"]]},{"l":"r.o/b.o.t","p":"ˈr.əʊ/b.ɒ.t","cn":"机器人","s":[["The robot can play chess.","机器人会下棋。"],["The company is credited with inventing the industrial robot.","发明工业机器人是那家公司的功劳。"],["This is the latest in robot technology.","这是最新的机器人技术。"]]},{"l":"j.u.m.p","p":"dʒ.ʌ.m.p","cn":"跳；跃","s":[["Don't jump to conclusion.","不要乱下结论。"],["Kangaroo can jump very high.","袋鼠可以跳得非常高。"],["She jumped down off the chair.","她跳下椅子。"]]},{"l":"r.o.p.e","p":"r.əʊ.p.-","cn":"绳；粗绳","s":[["We let the bucket down by a rope.","我们用绳子把吊桶放下去。"],["We need some rope to tie up the boat with.","我们需要用绳子把船系住。"],["I tied a knot in the rope.","我在绳子上打了个结。"]]},{"l":"p.i/a.n/o","p":"p.i/ˈæ.n/əʊ","cn":"钢琴","s":[["Can you play the piano?","你会弹钢琴吗？"],["He is learning to play the piano.","他正在学弹钢琴。"],["The piano was in good condition.","这台钢琴状况良好。"]]},{"l":"ch.e.ss","p":"tʃ.e.s","cn":"国际象棋","s":[["They play chess every day.","他们每天下棋。"],["Come on, let's play chess.","来吧，我们下棋。"],["The robot can play chess.","机器人会下棋。"]]},{"l":"f.r.o.n.t","p":"f.r.ʌ.n.t","cn":"前部（只要求理解）","s":[["There's someone at the front door.","前门有个人。"],["What you say and do up front will create your first impression.","你第一次所说的和所做的都是你的第一印象。"],["He's got a front tooth missing.","他有一颗门牙掉了。"]]},{"l":"ea.s/y","p":"ˈiː.z/i","cn":"容易的；轻易的（只要求理解）","s":[["The problem is anything but easy.","这个问题一点也不简单。"],["He had a very easy manner.","他很容易相与。"],["The shower is easy to install.","淋浴器易于安装。"]]},{"l":"s.t.ar","p":"s.t.ɑː","cn":"歌唱（或表演）明星（只要求理解）","s":[["I stared fixedly at the statue.","我目不转睛地看着那尊雕像。"],["The Galaxy consists of 100 billion stars.","银河系由1千亿颗恒星组成。"],["I go to Star Primary School.","我在思达小学上学。"]]},{"l":"w.o.n/d.er/f.u.l","p":"ˈw.ʌ.n/d.ə/f.ə.l","cn":"令人赞叹的；精彩的；绝妙的（只要求理解）","s":[["Ben's a wonderful father.","本是个极好的父亲。"],["'How wonderful!' she trilled.","“太妙了！”她高兴地喊道。"],["They've got a wonderful house.","他们有一座漂亮的房子。"]]},{"l":"Au/s.t.r.a/l.ia","p":"ɒ/ˈs.t.r.eɪ/l.iə","cn":"澳大利亚（只要求理解）","s":[["Australia's a big country.","澳大利亚是一个幅员辽阔的国家。"],["Australia finished 20 points ahead.","澳大利亚队终局领先20分。"],["She's working out in Australia.","她远在澳大利亚工作。"]]}]},{"name":"Unit 2 My feelings","words":[{"l":"s.a.d","p":"s.æ.d","cn":"悲哀的；难过的","s":[["She looked sad and tired.","她看上去又伤心又疲惫。"],["I overreact to anything sad.","我对任何悲伤的事情都反应过激。"],["We were all sad at her going.","我们对她的离去都很难过。"]]},{"l":"m.a.t/t.er","p":"ˈm.æ.t/-.ə","cn":"事情；问题（只要求理解）","s":[["This matter is their concern.","这件事由他们负责。"],["It's not just a financial matter.","这不只是个财务问题。"],["They had important matters to discuss.","他们有些重要的问题要讨论。"]]},{"l":"p.r.o.j/e.c.t","p":"ˈp.r.ɒ.dʒ/e.k.t","cn":"项目；方案（只要求理解）","s":[["They attach great importance to the project.","他们高度重视这个项目。"],["This project is designed to help homeless people.","这个项目旨在帮助无家可归的人。"],["The project is environmentally unsound.","这个工程会破坏环境。"]]},{"l":"c.e.n/t.re","p":"ˈs.e.n/t.ə","cn":"中心（只要求理解）","s":[["The centre will serve the whole community.","这个中心将为整个社区提供服务。"],["Our offices are in the city centre.","我们的办公室位于市中心。"],["The shopping centre is not roofed over.","购物中心是露天的。"]]},{"l":"a/g.r.ee","p":"ə/ˈɡ.r.iː","cn":"同意；赞成（只要求理解）","s":[["I entirely agree with you.","我完全同意你的看法。"],["He agreed with the questioner.","他和提问者达成了一致。"],["I don't altogether agree with you.","我不完全同意你的意见。"]]},{"l":"f.i.n/i.sh","p":"ˈf.ɪ.n/ɪ.ʃ","cn":"完成；做好（只要求理解）","s":[["I've just finished Chapter 3.","我刚完成第3章。"],["The play finished at 10.30.","比赛于10:30结束。"],["They haven't finished yet.","他们还没有结束。"]]},{"l":"w.o.r/r.ie.d","p":"ˈw.ʌ.r/-.i.d","cn":"担心的；担忧的","s":[["He seemed very worried.","他似乎非常担忧。"],["She sounded a bit worried.","她听起来有点焦虑不安。"],["She had a worried look on her face.","她一脸担忧的样子。"]]},{"l":"b.o.th","p":"b.əʊ.θ","cn":"两者（只要求理解）","s":[["You're both coming? Splendid!","你们俩都要来？太好了！"],["They're both playing excellently.","他们演奏得都很棒。"],["Luckily, we both love football.","幸好我们俩都热爱足球。"]]},{"l":"e.x/c.i/t.e.d","p":"ɪ.k/ˈs.aɪ/t.ɪ.d","cn":"激动的；兴奋的","s":[["Right now I'm feeling very excited.","此刻我感到非常激动。"],["She was all excited.","她非常激动。"],["His eyes were bright and excited.","他目光发亮，兴奋不已。"]]},{"l":"w.r.o.ng","p":"-.r.ɒ.ŋ","cn":"错误的（只要求理解）","s":[["Everything's gone badly wrong !","一切都糟透了。"],["I'm afraid you guessed wrong.","恐怕你猜错了。"],["My dear girl, you're wrong.","我亲爱的姑娘，你错了。"]]},{"l":"a.n.g/r.y","p":"ˈæ.ŋ.ɡ/r.i","cn":"愤怒的；生气的","s":[["Never go to sleep angry.","永远不要带着怒气入睡。"],["He never stays angry for long.","他生气时间从来不会长。"],["He fixed her with an angry stare.","他生气地盯着她。"]]},{"l":"a/f.r.ai.d","p":"ə/ˈf.r.eɪ.d","cn":"担心；害怕（只要求理解）","s":[["I'm afraid you guessed wrong.","恐怕你猜错了。"],["Of course I'm not afraid!","当然我不怕！"],["There's nothing to be afraid of.","没有什么要害怕的。"]]},{"l":"p.a/r.e.n.t","p":"ˈp.eə/r.ə.n.t","cn":"父亲；母亲","s":[["Children need their parents.","孩子们需要父母。"],["I must telephone my parents.","我一定要给父母打个电话。"],["He's still living with his parents.","他还和父母住在一起。"]]},{"l":"a.s.k","p":"ɑː.s.k","cn":"问；询问","s":[["\"How is Frank?\" he asked.","“弗兰克怎么样？”他问道。"],["\"Tea or coffee?\" John asked.","“喝茶还是喝咖啡？” 约翰问。"],["He asked where I lived.","他问我住在哪里。"]]},{"l":"l.augh","p":"l.ɑːf","cn":"笑（只要求理解）","s":[["You never laugh at my jokes!","你们听了我的笑话从不发笑！"],["We had a good laugh about it afterwards.","我们后来对此笑了个痛快。"],["I just couldn't laugh at his jokes the way I used to.","我就是不能像以前那样笑他讲的笑话。"]]},{"l":"m.o.v.e","p":"m.uː.v.-","cn":"搬家；移动（只要求理解）","s":[["She had moved out of hearing.","她走远了，已经听不到。"],["They've moved all the furniture round.","他们把所有的家具搬动了一遍。"],["Cover me while I move forward.","掩护我前进。"]]},{"l":"y.our.s","p":"j.ɔː.z","cn":"您的（用于书信结尾的签名前）（只要求理解）","s":[["The final decision is yours.","最终的决定权属于你。"],["I'd like one the same as yours.","我要一个和你一样的。"],["The job is yours for the asking.","只要开口，这份工作就是你的了。"]]}]},{"name":"Unit 3 Work and play","words":[{"l":"W.e.d.n.e.s/d.ay","p":"ˈw.e.-.n.-.z/d.eɪ","cn":"星期三","s":[["Let's move the meeting to Wednesday.","我们把开会时间改到星期三吧。"],["Today is Tuesday, so tomorrow is Wednesday.","今天是星期二，那么明天就是星期三。"],["Did you happen to see her leave last Wednesday?","上星期三你正好碰巧看见她离开？"]]},{"l":"s.u.b/j.e.c.t","p":"ˈs.ʌ.b/dʒ.ɪ.k.t","cn":"科目；学科（只要求理解）","s":[["Biology is my favourite subject.","生物是我最喜欢的学科。"],["English is my best subject.","英语是我学得最好的一门科目。"],["The two subjects are closely connected.","这两门学科紧密相连。"]]},{"l":"T.ue.s/d.ay","p":"ˈt.juː.z/d.eɪ","cn":"星期二","s":[["Tuesday is her half day.","星期二她只工作半天。"],["Our first lesson on Tuesdays is French.","我们星期二的第一节课是法语。"],["It's my birthday a week on Tuesday.","一周后的星期二是我的生日。"]]},{"l":"F.r.i/d.ay","p":"ˈf.r.aɪ/d.eɪ","cn":"星期五","s":[["The committee meets on Fridays.","委员会每周五开会。"],["I work Monday to Friday.","我星期一到星期五上班。"],["Our group meets on Friday mornings.","我们的组员每周五上午碰面。"]]},{"l":"b.e/c.au.s.e","p":"b.ɪ/ˈk.ɒ.z.-","cn":"因为（只要求理解）","s":[["They are here because of us.","他们是因为我们来这里的。"],["The road is closed because of the snow.","这条路因下雪而封闭。"],["She resigned because of ill health.","她因健康状况不佳而辞职。"]]},{"l":"M.o.n/d.ay","p":"ˈm.ʌ.n/d.eɪ","cn":"星期一","s":[["Are you busy next Monday ?","下周一你忙吗？"],["I work Monday to Friday.","我星期一到星期五上班。"],["She started work last Monday.","她上个星期一开始工作。"]]},{"l":"Th.ur.s/d.ay","p":"ˈθ.ɜː.z/d.eɪ","cn":"星期四","s":[["I'll see you Thursday week.","我们下星期四见。"],["We agreed to meet on Thursday.","我们约定在星期四见面。"],["On Thursday Microsoft rolls out its new operating system.","在星期四微软推出了它的新操作系统。"]]},{"l":"s.t.ar.t","p":"s.t.ɑː.t","cn":"开始（只要求理解）","s":[["Who started the fire?","谁放的火？"],["The news started me thinking.","那条消息让我思考起来。"],["They determined to start early.","他们决定早点出发。"]]},{"l":"u/s.u/a/ll.y","p":"ˈjuː/ʒ.u/ə/l.i","cn":"通常地；经常地（只要求理解）","s":[["She usually wears long skirts.","她通常穿长裙。"],["The wheels are usually fairly large.","该机轮通常相当大。"],["She usually sings in the shower.","她常常边冲澡边唱歌。"]]},{"l":"w.ee.k/e.n.d","p":"ˌw.iː.k/ˈe.n.d","cn":"周末（只要求理解）","s":[["They're weekending in Paris.","他们正在巴黎度周末。"],["Let's go fishing this weekend.","咱们这个周末去钓鱼吧。"],["He seldom worked on weekends.","他很少在周末工作。"]]},{"l":"s.o.m.e/t.i.m.e.s","p":"ˈs.ʌ.m.-/t.aɪ.m.-.z","cn":"有时；间或（只要求理解）","s":[["Lions sometimes hunt alone.","狮子有时单独猎食。"],["Even friends disagree sometimes.","即便是朋友有时也有分歧。"],["Sometimes we eat out of doors.","有时我们在户外进餐。"]]},{"l":"S.a.t/ur/d.ay","p":"ˈs.æ.t/ə/d.eɪ","cn":"星期六","s":[["We're going sailing on Saturday.","我们打算星期六乘帆船出游。"],["Let's go out on Saturday night.","我们星期六晚上出去吧。"],["We do our shopping on Saturdays.","我们星期六购物。"]]},{"l":"S.u.n/d.ay","p":"ˈs.ʌ.n/d.eɪ","cn":"星期日","s":[["We work every day except Sunday.","我们除星期天外每天都工作。"],["It's Sunday. I skate on Sunday.","今天星期日。我星期日溜冰。"],["We're mostly out on Sundays.","我们星期天一般不在家。"]]},{"l":"l.e.s/s.o.n","p":"ˈl.e.s/-.ə.n","cn":"课；一节课","s":[["Our first lesson on Tuesdays is French.","我们星期二的第一节课是法语。"],["The point of the lesson is to compare the two countries.","本课的目的是比较这两个国家。"],["I've got a piano lesson later today.","今天晚些时候我有一堂钢琴课。"]]},{"l":"e.v.e.n/i.ng","p":"ˈiː.v.-.n/ɪ.ŋ","cn":"晚上；傍晚（只要求理解）","s":[["Good evening and welcome.","晚上好，欢迎光临。"],["I'll see you tomorrow evening.","我明天晚上见你。"],["Good evening. How many people?","晚上好，几个人？"]]},{"l":"a.n/s.w.er","p":"ˈɑː.n/s.-.ə","cn":"答复；回答（只要求理解）","s":[["She answered almost immediately.","她几乎立刻就回答了。"],["He paused before answering.","他在回答前停了下来。"],["Sorry, the answer's no.","对不起，回答是不。"]]},{"l":"p.i.ng.-/p.o.ng","p":"ˈp.ɪ.ŋ.-/ˌp.ɒ.ŋ","cn":"乒乓球（只要求理解）","s":[["She likes playing ping-pong.","她喜欢打乒乓球。"],["I play ping-pong today.","我今天打乒乓球。"],["I like basketball and ping-pong.","我喜欢篮球和乒乓球。"]]},{"l":"n.igh.t","p":"n.aɪ.t","cn":"夜；夜晚（只要求理解）","s":[["Music filled the night air.","夜空荡漾着乐声。"],["I'm working late tomorrow night.","明晚我要工作到很晚。"],["Let's go out on Saturday night.","我们星期六晚上出去吧。"]]},{"l":"v.i.s/i.t","p":"ˈv.ɪ.z/ɪ.t","cn":"看望；拜访；参观（只要求理解）","s":[["They visited the Cartoon Museum.","他们参观了卡通博物馆。"],["I timed our visit for March 7.","我把我们访问时间定在3月7日。"],["I'm going to visit my uncle.","我要去看我舅舅。"]]},{"l":"g.r.a.n.d/p.a/r.e.n.t","p":"ˈɡ.r.æ.n.-/p.eə/r.ə.n.t","cn":"祖父；祖母；外祖父；外祖母（只要求理解）","s":[["Li Wen lives with his grandparents in the countryside.","李文和他的祖父母住在乡下。"]]}]},{"name":"Unit 4 Healthy habits","words":[{"l":"s.t.ay","p":"s.t.eɪ","cn":"待；保持；继续是（只要求理解）","s":[["Until when can you stay?","你可以待到什么时候？"],["Would you like to stay?","你想留下来吗？"],["We stayed at the Grand Hotel.","我们住在格兰酒店。"]]},{"l":"sh.ou.l.d","p":"ʃ.ʊ.-.d","cn":"（提出或征询建议）该，可以（只要求理解）","s":[["$100 should cover your expenses.","100元该足够支付你的费用了。"],["Why should I apologize?","我为什么要道歉？"],["We should arrive before dark.","我们天黑以前应该能赶到。"]]},{"l":"f.l.u","p":"f.l.uː","cn":"流行性感冒；流感（只要求理解）","s":[["The whole family has the flu.","全家都患流感。"],["Flu is highly infectious.","流感的传染性很高。"],["A flu epidemic raged through Europe.","流感在整个欧洲肆虐。"]]},{"l":"e.l.s.e","p":"e.l.s.-","cn":"其他的；别的（只要求理解）","s":[["Hurry up or else you'll be late.","快点，否则你就要迟到了。"],["Everyone else was there.","其他所有人都在那儿。"],["They're forever bitching about everybody else.","他们总是在埋怨其他的每个人。"]]},{"l":"e.x/er/c.i.s.e","p":"ˈe.ks/ə/s.aɪ.z.-","cn":"锻炼；训练；操练","s":[["Riding a bike is great exercise.","骑自行车是很好的锻炼。"],["Diet and exercise are equally important.","饮食和锻炼同样重要。"],["Exercises of this kind are very popular.","这种体育活动非常流行。"]]},{"l":"e/n.ough","p":"ɪ/ˈn.ʌf","cn":"足够的；充足的；充分的（只要求理解）","s":[["That's it, I've had enough!","够了，我受够了！"],["I hadn't trained enough for the game.","对比赛我训练得不够。"],["Have we enough cups to go round ?","我们的杯子够大家用吗？"]]},{"l":"i.f","p":"ɪ.f","cn":"如果；假若；倘若（只要求理解）","s":[["If you lead, I'll follow.","你领头，我跟着。"],["Goodness, I wonder if he knows.","天哪，我不清楚他知不知道。"],["What if this doesn't work out?","如果这行不通怎么办呢？"]]},{"l":"h.a.b/i.t","p":"ˈh.æ.b/ɪ.t","cn":"习惯（只要求理解）","s":[["I only do it out of habit.","我这么做只是出于习惯。"],["His personal habits put them off.","他的个人习惯让他们反感。"],["They also have the irritating habit of interrupting.","他们也有打断别人这个令人恼火的习惯。"]]},{"l":"h.ou.s.e","p":"h.aʊ.s.-","cn":"房子（只要求理解）","s":[["Their house is massive.","他们的房子大极了。"],["Our house faces south.","我们的房子面朝南。"],["We're moving house next month.","我们下个月搬家。"]]},{"l":"sh.ow","p":"ʃ.əʊ","cn":"（电视或广播）节目（只要求理解）","s":[["The clock showed midnight.","时钟显示已是午夜。"],["He directed various TV shows.","他导演过各种电视节目。"],["She left directly after the show.","演出一结束，她马上就走了。"]]},{"l":"ph.o.n.e","p":"f.əʊ.n.-","cn":"电话；电话机","s":[["That phone's always ringing.","那个电话总是响个不停。"],["My phone number is 266998.","我的电话号码是266998。"],["That phone never stops ringing!","那个电话没有不响的时候！"]]},{"l":"th.e.n","p":"ð.e.n","cn":"那么；因此；既然如此（只要求理解）","s":[["Then a dinosaur appeared.","然后一只恐龙出现了。"],["Then a clown appeared.","然后小丑出场了。"],["That's definite then, is it?","那么，那是确切的了，是吗？"]]},{"l":"r.e.s.t","p":"r.e.s.t","cn":"休息；放松","s":[["I'm having a much-needed rest.","我特别累，现在正在休息。"],["For the rest of the lunch break I do my marking.","在剩余的午休时间，我批改作业。"],["I don't know about the rest of you, but I'm hungry.","不知道你们怎么样，我可是饿了。"]]},{"l":"t.a.k.e c.are o.f","p":"t.eɪ.k.- k.eə ə.v","cn":"爱护；照顾（只要求理解）","s":[["See that you take care of him.","你一定要好好照顾他。"],["We need to take care of our bodies.","我们需要照顾好自己的身体。"],["He's old enough to take care of himself.","他已经不小了，能照顾自己了。"]]},{"l":"ch.e.ck","p":"tʃ.e.k","cn":"查看；查明","s":[["Forgetting to check up on expenses.","忘记检查费用。"],["Check that all the details are correct.","检查所有这些细节是否准确无误。"],["He checked the strength of the cables.","他检查了缆绳的强度。"]]},{"l":"l.e.ss","p":"l.e.s","cn":"（与不可数名词连用）较少的，更少的","s":[["He seemed more content, less bitter.","他看起来比较满意，不那么失望。"],["You pay less for the store brand.","商店品牌的东西要便宜些。"],["What's your favorite and less favorite Chinese food?","你最喜欢和不太喜欢的中国菜是什么？"]]},{"l":"b.r.u.sh","p":"b.r.ʌ.ʃ","cn":"（用刷子）刷净，刷亮，刷平顺","s":[["She brushed the fly away.","她挥手赶走了苍蝇。"],["She brushed the powder out of her hair.","她把粉末从头发中梳掉。"],["My brush is violet.","我的毛笔是紫罗兰色的。"]]},{"l":"t.oo.th","p":"t.uː.θ","cn":"（复数teeth）牙；齿","s":[["The blow chipped the woman's tooth.","这一击把那个女人的牙齿打掉了一小块。"],["He's got a front tooth missing.","他有一颗门牙掉了。"],["When did she cut her first tooth?","她什么时候长出的第一颗牙？"]]},{"l":"t.w.i.c.e","p":"t.w.aɪ.s.-","cn":"两次；两遍（只要求理解）","s":[["Well done is twice done.","做得好，事半功倍。"],["The newspaper is published twice weekly.","这份报纸每周出版两次。"],["I go swimming twice a week.","我每星期游泳两次。"]]},{"l":"h.our","p":"-.aʊə","cn":"小时（只要求理解）","s":[["What are your office hours ?","你的办公时间是几点到几点？"],["The journey time is two hours.","旅程时间为两个小时。"],["The flight takes approximately three hours.","飞行时间大约需要三小时。"]]},{"l":"f.r.ee","p":"f.r.iː","cn":"没有安排活动的；空闲的（只要求理解）","s":[["Delivery is free of charge.","免费送货。"],["The newspaper is distributed free.","这份报纸免费发送。"],["Entry to the museum is free.","这座博物馆免费参观。"]]}]},{"name":"Unit 5 Food we eat","words":[{"l":"h.u.n.g/r.y","p":"ˈh.ʌ.ŋ.ɡ/r.i","cn":"感到饿的（只要求理解）","s":[["Is anyone getting hungry?","有人觉得饿吗？"],["You're not hungry, are you?","你不饿，对吧？"],["All this gardening is hungry work.","这些园艺活儿让人干了肚子饿。"]]},{"l":"b.ee.f","p":"b.iː.f","cn":"牛肉","s":[["The nation also exports beef.","该国也出口牛肉。"],["She served him a bowl of beef stew.","她给他端了一碗炖牛肉。"],["They serve the most delicious roast beef.","他们做最美味的烤牛肉。"]]},{"l":"i.c.e c.r.ea.m","p":"aɪ.s.- k.r.iː.m","cn":"（一份）冰激凌","s":[["I'll get you some ice cream.","我去给你拿些冰激凌。"],["Can I have a lick of your ice cream?","我能尝一口你的冰激凌吗？"],["She had homemade ice cream for dessert.","她吃了些自制冰淇淋当餐后甜点。"]]},{"l":"l.i.t/t.le","p":"ˈl.ɪ.t/-.l","cn":"少许；一点（只要求理解）","s":[["This room gets very little sunshine.","这个房间几乎照不进阳光。"],["Economic growth has slowed a little.","经济增长稍有减缓。"],["Such arguments are of little import.","这种争论几乎不具重要性。"]]},{"l":"d.u.m/p.l.i.ng","p":"ˈd.ʌ.m/p.l.ɪ.ŋ","cn":"饺子；汤圆","s":[["My favorite food is dumpling.","我最喜欢的食物是饺子。"],["The dumpling tastes really good.","这饺子尝起来味道很好。"],["Let's do a dumpling party!","我们来办个饺子派对吧！"]]},{"l":"t.ea","p":"t.iː","cn":"茶叶；茶；茶水","s":[["There's hardly any tea left.","没有剩什么茶了。"],["\"Tea or coffee?\" John asked.","“喝茶还是喝咖啡？” 约翰问。"],["Do you want some more tea?","你再要点儿茶吗？"]]},{"l":"h.a.m/b.ur/g.er","p":"ˈh.æ.m/b.ɜː/ɡ.ə","cn":"汉堡包；汉堡牛肉饼","s":[["We stopped at a drive-in for a hamburger.","我们在一家“免下车”餐馆停下来吃汉堡包。"],["A pound of hamburger, please.","请给我一磅汉堡。"],["Shane was chowing down on a mammoth hamburger.","谢恩正在狼吞虎咽的吃一个巨型汉堡。"]]},{"l":"M/r.s","p":"ˈmɪs/ɪ.z","cn":"（用于女子的姓氏或姓名前）太太，夫人（只要求理解）","s":[["There's a Mrs Green to see you.","有位格林太太要见你。"],["Mrs. Roding's husband deserted her years ago.","罗丁太太的丈夫数年前抛弃了她。"],["I'll run over to Short Mountain and check on Mrs. Adams.","我将开车去肖特山看看亚当斯夫人。"]]},{"l":"c.o/c.o/n.u.t","p":"ˈk.əʊ/k.ə/n.ʌ.t","cn":"椰子（只要求理解）","s":[["Coconut Rice Balls is a creole dish.","椰丝粉团是一道克里奥尔菜。"],["Coconut is a basic ingredient for many curries.","椰子是多种咖喱菜的基本成分。"],["Coconut milk has little nutritive value.","椰子汁没什么营养价值。"]]},{"l":"i.n/t.e.r.e.s.t/i.ng","p":"ˈɪ.n/t.-.r.ə.s.t/ɪ.ŋ","cn":"有趣的；有吸引力的（只要求理解）","s":[["Did you go anywhere interesting?","你去过任何有趣的地方吗？"],["It is interesting that Chinese characters evolve from pictures and signs.","有趣的是，汉字是由图画和符号演变而来的。"],["Can't we do something more interesting?","我们就不能做点更有意思的事情吗？"]]},{"l":"s.ee.d","p":"s.iː.d","cn":"种子；籽","s":[["The top seed won comfortably.","头号种子选手轻松获胜。"],["Small particles adhere to the seed.","微小的粒子紧贴着种子。"],["The plant can be propagated from seed.","这种植物可由种子繁殖。"]]},{"l":"p.u.ll","p":"p.ʊ.l","cn":"拔出；抽出（只要求理解）","s":[["She's hoping to pull tonight.","她希望今晚丰采迷人。"],["He can still pull the girls.","他仍然能让姑娘们着迷。"],["Please pull over and stop over there.","请靠边停车，在那儿停下。"]]},{"l":"s.t.e.m","p":"s.t.e.m","cn":"（花草的）茎；（花或叶的）梗，柄","s":[["Cut the flower stems on the slant.","把花茎斜着切断。"],["Stem cell research is supported by many doctors.","干细胞研究得到很多医生的支持。"],["She tied a knot in a cherry stem.","她在樱桃梗上打了个结。"]]},{"l":"r.oo.t","p":"r.uː.t","cn":"根；根茎","s":[["We have to get to the root of the problem.","我们必须找到问题的根源。"],["'Walk' is the root of 'walks', 'walked', 'walking' and 'walker'.","walk是walks、walked、walking和walker的词根。"],["I'm proud of my Italian roots.","我为我的意大利血统感到骄傲。"]]},{"l":"l.o/t.u.s","p":"ˈl.əʊ/t.ə.s","cn":"莲属植物（只要求理解）","s":[]},{"l":"l.a.k.e","p":"l.eɪ.k.-","cn":"湖；湖泊（只要求理解）","s":[["The river drains into a lake.","这条河流入湖中。"],["The lake freezes over in winter.","这个湖冬天全部封冻。"],["They can go fishing in the lake.","他们可以去湖里钓鱼。"]]},{"l":"w.or.l.d","p":"w.ɜː.l.d","cn":"世界；地球；天下（只要求理解）","s":[["His books are world-famous.","他的著作举世闻名。"],["She has three world titles.","她已获得三项世界冠军。"],["He thinks the world of his daughter.","他非常器重女儿。"]]},{"l":"r.ou.n.d","p":"r.aʊ.n.d","cn":"圆形的；环形的；球形的（只要求理解）","s":[["We're leaving round about ten.","我们十点钟左右出发。"],["His eyes rounded with horror.","他吓得两眼圆睁。"],["They've moved all the furniture round.","他们把所有的家具搬动了一遍。"]]},{"l":"d.i/ff.e.r.e.n.t","p":"ˈd.ɪ/f.-.r.ə.n.t","cn":"不同的；有区别的；有差异的（只要求理解）","s":[["Let's play a different game.","咱们玩点别的游戏吧。"],["She looked different somehow.","不知怎么地，她看上去变了。"],["China is utterly different.","中国完全不一样。"]]},{"l":"w.ay","p":"w.eɪ","cn":"方法；手段；途径；方式（只要求理解）","s":[["He continued on his way.","他继续走他的路。"],["The doctor's on his way.","医生正在路上。"],["Your calculation is way off beam.","你的计算完全错误。"]]}]},{"name":"Unit 6 Nature and us","words":[{"l":"r.i.v/er","p":"ˈr.ɪ.v/ə","cn":"河；江","s":[["The river drains into a lake.","这条河流入湖中。"],["The river is 300 miles in length.","这条河长300英里。"],["His car careered into a river.","他的车猛地冲进了河里。"]]},{"l":"n.a/ture","p":"ˈn.eɪ/tʃə","cn":"自然界；大自然（只要求理解）","s":[["Just let nature take its course.","就顺其自然吧。"],["It's not in his nature to be unkind.","他天生不会刻薄。"],["Human nature is frail.","人性脆弱。"]]},{"l":"w.a/t.er/f.a.ll","p":"ˈw.ɔː/t.ə/f.ɔː.l","cn":"瀑布","s":[["As you descend, suddenly you see at last the hidden waterfall.","你往下走，最终会突然发现那个隐秘的瀑布。"],["The moon was casting a rainbow through the spray from the waterfall.","月亮在瀑布溅起的水雾中映出了一道彩虹。"]]},{"l":"f.o.r/e.s.t","p":"ˈf.ɒ.r/ɪ.s.t","cn":"森林；林区","s":[["What has encouraged forest growth historically?","从历史来看，是什么促进了森林数量的增长？"],["We need to preserve the forest.","我们需要保护森林。"],["The panda's natural habitat is the bamboo forest.","大熊猫的天然栖息地是竹林。"]]},{"l":"f.a/m.ous","p":"ˈf.eɪ/m.əs","cn":"著名的；出名的（只要求理解）","s":[["His books are world-famous.","他的著作举世闻名。"],["Some day he'll be famous.","总有一天他会成名的。"],["Some day I'll be famous.","总有一天我会成名的。"]]},{"l":"m.ou.n/t.ai.n","p":"ˈm.aʊ.n/t.ə.n","cn":"高山；山岳","s":[["We're going down a mountain.","我们向山下走去。"],["I'll run over to Short Mountain and check on Mrs. Adams.","我将开车去肖特山看看亚当斯夫人。"],["Mountains rose in the distance.","远处山峦叠起。"]]},{"l":"w.i.n.d","p":"w.ɪ.n.d","cn":"风；气流（只要求理解）","s":[["The wind played beautifully.","管乐器部吹奏得美极了。"],["The wind has changed direction.","风向已经变了。"],["Wind speeds reached force five.","风速达到了5级。"]]},{"l":"t.r.i.p","p":"t.r.ɪ.p","cn":"（尤指短程往返的）旅行，旅游，出行（只要求理解）","s":[["I'll sure remember this trip!","我绝不会忘记这次旅行！"],["Here's $100 to put towards your ski trip.","这是100元，补助你去滑雪用。"],["Please let us talk over this trip to Switzerland again.","我们再次讨论这次瑞士之行的事宜吧。"]]},{"l":"d.a.n/g.e/r.ous","p":"ˈd.eɪ.n/dʒ.ə/r.əs","cn":"有危险的；不安全的（只要求理解）","s":[["The situation is highly dangerous.","形势十分危急。"],["The man is armed and dangerous.","这个男子有枪，是个危险分子。"],["A lion is a dangerous animal.","狮子是猛兽。"]]},{"l":"h.ea.v/y","p":"ˈh.e.v/i","cn":"程度大的；严重的（只要求理解）","s":[["What is the opposite of heavy?","重的反义词是什么？"],["Now and then they heard the roar of a heavy lorry.","他们不时听见一辆重型卡车的轰响声。"],["These scissors are awfully heavy.","这些剪刀非常重。"]]},{"l":"h.o/t.e.l","p":"h.əʊ/ˈt.e.l","cn":"旅馆；旅社（只要求理解）","s":[["The hotel is wonderfully comfortable.","这家旅馆非常舒适。"],["We stayed at the Grand Hotel.","我们住在格兰酒店。"],["Does the hotel take credit cards?","这家旅馆接受信用卡付款吗？"]]},{"l":"c.l.o.s.e","p":"k.l.əʊ.z.-","cn":"关；关闭；闭上（只要求理解）","s":[["Our friends live close by.","我们的朋友住得不远。"],["The door closed behind him.","他一出门，门就关上了。"],["We're a very close family.","我们全家彼此亲密无间。"]]},{"l":"u.m/b.r.e.l/l.a","p":"ʌ.m/ˈb.r.e.l/-.ə","cn":"伞；雨伞（只要求理解）","s":[["Can I borrow your umbrella?","借你的伞用一下行吗？"],["You can leave your umbrella in the entry.","你可以把伞放在入口处。"],["They held a large umbrella over her.","他们给她撑起一把大伞。"]]},{"l":"r.ai.n/c.oa.t","p":"ˈr.eɪ.n/k.əʊ.t","cn":"雨衣（只要求理解）","s":[]},{"l":"w.o.r/r.y","p":"ˈw.ʌ.r/-.i","cn":"担心；担忧；发愁（只要求理解）","s":[["I worry about her constantly.","我一直在为她担心。"],["Don't worry—I'll fix him.","别担忧—我会收拾他的。"],["Don't worry, she'll be on time.","别担心，她会准时的。"]]},{"l":"f.i.n.e","p":"f.aɪ.n.-","cn":"晴朗的（只要求理解）","s":[["Any shopping center is fine.","任何购物中心都可以。"],["A fine day, your Majesty!","天气真好，陛下！"],["That arrangement suits me fine.","那种安排对我很合适。"]]},{"l":"f.o.g","p":"f.ɒ.ɡ","cn":"雾","s":[["The plane crashed in thick fog.","飞机在大雾中坠毁。"],["The crash happened in thick fog.","这次撞车发生在浓雾中。"],["The fog began to disperse.","雾开始散了。"]]},{"l":"f.l.oo.d","p":"f.l.ʌ.d","cn":"洪水；水灾","s":[["When water levels rise, flooding results.","水位上升，就会发生洪水。"],["The kitchen flooded.","厨房被水淹了。"],["The flood waters slowly retreated.","洪水慢慢地消退。"]]},{"l":"f.ire","p":"f.aɪə","cn":"火；火灾","s":[["Who started the fire?","谁放的火？"],["Who set off the fire alarm?","谁拉响了火警报警器？"],["She raised the gun and fired.","她举枪射击。"]]},{"l":"k.n.ow","p":"-.n.əʊ","cn":"知道；了解（只要求理解）","s":[["You wouldn't know him.","你一定不认识他。"],["I hardly know you.","我几乎不了解你。"],["Do you know his address?","你知道他的地址吗？"]]},{"l":"b.e/f.ore","p":"b.ɪ/ˈf.ɔː","cn":"在……之前（只要求理解）","s":[["He paused before answering.","他在回答前停了下来。"],["I'd die before I apologized!","我宁愿死也不道歉！"],["She'd never done Pilates before.","她以前从未做过普拉提。"]]},{"l":"g.o h.i.k/i.ng","p":"ɡ.əʊ ˈh.aɪ.k/ɪ.ŋ","cn":"徒步旅行（只要求理解）","s":[]},{"l":"b.r.i.ng","p":"b.r.ɪ.ŋ","cn":"带……到某处；带来；取来（只要求理解）","s":[["All you need bring are sheets.","你需要带的就是床单。"],["What if she forgets to bring it?","要是她忘记带来，会怎么样呢？"],["She wants to bring good luck to others.","她想给别人带来好运。"]]}]}]},{"id":"pep6a","name":"人教 六年级上册（新教材）","units":[{"name":"Unit 1 Amazing places","words":[{"l":"w.a.s","p":"w.ə.z","cn":"（be的第一和第三人称单数过去式）","s":[["He was plainly annoyed.","他明显是生气了。"],["It was bitterly cold.","天气冷得刺骨。"],["She was becoming confused.","她开始糊涂了。"]]},{"l":"c.l.i.m.b","p":"k.l.aɪ.m.-","cn":"攀登；爬","s":[["I prefer walking to climbing.","我喜欢散步多于喜欢爬山。"],["I often do stair climbing with my friends.","我经常和朋友一起爬楼梯。"],["They climbed a steep embankment.","他们爬上了一个陡峭的堤岸。"]]},{"l":"k.i/l.o/m.e/t.re","p":"k.ɪ/ˈl.ɒ/m.ɪ/t.ə","cn":"（=km）千米；公里（只要求理解）","s":[["In a minute a cheetah can run about 1 kilometre and a half.","在一分钟内，猎豹可以跑大约1公里半。"],["The town lies a few kilometres inland.","这个城市位于内陆几公里处。"]]},{"l":"g.i.n/g.er/b.r.ea.d h.ou.s.e","p":"ˈdʒ.ɪ.n/dʒ.ə/b.r.e.d h.aʊ.s.-","cn":"姜饼屋（只要求理解）","s":[]},{"l":"s.e.n.d","p":"s.e.n.d","cn":"邮寄；发送（只要求理解）","s":[["I'll send you a text message.","我会给你发一条短信。"],["I'd like to send this express, please.","劳驾，我要寄快递。"],["She parcelled up the books to send.","她把要寄走的书包了起来。"]]},{"l":"g.o","p":"ɡ.əʊ","cn":"（过去式went）去；走","s":[["Everything's gone badly wrong !","一切都糟透了。"],["Do you go camping ?","你去野营度假吗？"],["Let's go dancing tonight.","我们今晚去跳舞吧。"]]},{"l":"th.ou/s.a.n.d","p":"ˈθ.aʊ/z.ə.n.d","cn":"一千（只要求理解）","s":[["A thousand people were there.","那里有一千人。"],["Several thousand people marched on City Hall.","数千人涌往市政厅进行抗议。"],["The ivory industry employed about a thousand carvers.","象牙工业雇佣了大约一千个雕刻工。"]]},{"l":"c.l.ay","p":"k.l.eɪ","cn":"黏土；陶土（只要求理解）","s":[["The tiles are made of clay.","这些砖是用陶土制成的。"],["She fashioned a pot from the clay.","她用黏土制成一个罐。"],["There she began to model in clay.","她开始在那儿用黏土做模型。"]]},{"l":"s.ee","p":"s.iː","cn":"（过去式saw）看见","s":[["We'll see to that.","我们会注意的。"],["I'll see you tomorrow evening.","我明天晚上见你。"],["I'll see you Thursday week.","我们下星期四见。"]]},{"l":"v.i.l/l.a.g.e","p":"ˈv.ɪ.l/-.ɪ.dʒ.-","cn":"村庄；村镇（只要求理解）","s":[["This neighborhood is your village.","这个社区就是你的村庄。"],["Her books are about village life.","她的书是关于乡村生活的。"],["Small villages dot the countryside.","小村庄星罗棋布于乡间。"]]},{"l":"ea.t","p":"iː.t","cn":"（过去式ate）吃","s":[["They'll eat almost anything.","他们几乎什么都吃。"],["The giraffe eats leaves.","长颈鹿吃树叶。"],["People eat when they're depressed.","人们会在沮丧时吃东西。"]]},{"l":"d.r.y","p":"d.r.aɪ","cn":"干的（只要求理解）","s":[["I'm a bit dry.","我有点渴。"],["I'll wash and you can dry up.","我洗盘子，你可以擦干。"],["My mouth felt completely dry.","我感到口干舌燥。"]]},{"l":"t.a.k.e","p":"t.eɪ.k.-","cn":"（过去式took）做（某个动作；和名词连用代替某个动词）","s":[["We take the 'Express'.","我们订阅的是《快报》。"],["Take back your wheel!","拿回你的轮子！"],["I'll take the grey jacket.","我要那件灰色夹克衫。"]]},{"l":"v.i.ew","p":"v.-.juː","cn":"景色（只要求理解）","s":[["Such a view is pleasing.","这样一种风景令人愉快。"],["The sun disappeared from view.","太阳看不见了。"],["His views tend towards the extreme.","他的观点趋于偏激。"]]},{"l":"i.n/s.p.i/r.i.ng","p":"ɪ.n/ˈs.p.aɪə/r.ɪ.ŋ","cn":"鼓舞人心的（只要求理解）","s":[["The book is less than inspiring.","那本书不大吸引人。"],["The higher we climbed, the more awe-inspiring the scenery became.","我们爬得越高，风景越是令人惊叹。"]]},{"l":"b.a.m/b.oo","p":"ˌb.æ.m/ˈb.uː","cn":"竹；竹子（只要求理解）","s":[["Bamboo is the panda's staple diet.","大熊猫的基本食物是竹子。"],["Sadly, bamboo plants die after flowering.","令人遗憾的是，竹子开花后就会死亡。"],["The panda's natural habitat is the bamboo forest.","大熊猫的天然栖息地是竹林。"]]},{"l":"p.u.m.p/k.i.n","p":"ˈp.ʌ.m.p/k.ɪ.n","cn":"南瓜（只要求理解）","s":[["Pumpkin pie is a traditional American dish served on Thanksgiving.","南瓜馅饼是美国传统的感恩节食物。"],["Let's make a pumpkin lantern!","我们来做个南瓜灯吧！"],["And she kicked that pumpkin.","她踢了那个南瓜一脚。"]]},{"l":"r.e.s/t.au/r.a.n.t","p":"ˈr.e.s/t.ə/r.ɒ.n.t","cn":"餐馆；餐厅（只要求理解）","s":[["What star rating does this restaurant have?","这家餐馆是几星级的？"],["The restaurant is not far from here.","饭店离这儿不远。"],["There is a good restaurant on the upper floor.","楼上有一家很好的餐馆。"]]},{"l":"air/p.or.t","p":"ˈeə/p.ɔː.t","cn":"机场（只要求理解）","s":[["They arrived late at the airport.","他们晚到了机场。"],["Will you meet me at the airport?","你到机场接我好吗？"],["Air force jets bombed the airport.","空军喷气机轰炸了机场。"]]},{"l":"N.ew Z.ea/l.a.n.d","p":"n.juː ˈz.iː/l.ə.n.d","cn":"新西兰（只要求理解）","s":[["Much of our butter comes from New Zealand.","我们的黄油大多产自新西兰。"],["New Zealand's quarrel with France over the Rainbow Warrior incident was formally ended.","新西兰和法国之间关于“彩虹勇士号”事件的争端已经正式了结。"]]},{"l":"H.o.ng K.o.ng/-.Zh.u/h.ai/-.M.a/c.ao B.r.i.dge","p":"ˌh.ɒ.ŋ ˈk.ɒ.ŋ/-.dʒ.uː/h.aɪ/-.m.ə/ˈk.aʊ b.r.ɪ.dʒ","cn":"港珠澳大桥（只要求理解）","s":[]},{"l":"P.a.r/i.s","p":"ˈp.æ.r/ɪ.s","cn":"巴黎（只要求理解）","s":[["They're weekending in Paris.","他们正在巴黎度周末。"],["We'd toured the sights of Paris.","我们已游览了巴黎的名胜。"],["We spent the weekend in Paris.","我们在巴黎度过了周末。"]]},{"l":"Ei.ff/e.l T.ow/er","p":"ˈaɪ.f/ə.l ˈt.aʊ/ə","cn":"埃菲尔铁塔（只要求理解）","s":[]},{"l":"T.e/rr.a/c.o.t/t.a W.a.r/r.i/o.r.s","p":"ˌt.e/r.ə/ˈk.ɒ.t/-.ə ˈw.ɒ.r/-.i/ə.-.z","cn":"兵马俑（只要求理解）","s":[]},{"l":"J.i.ng/g.a.ng/sh.a.n R.e.v/o/l.u/tion M.u/s.e/u.m","p":"ˌdʒ.ɪ.ŋ/ɡ.ɑː.ŋ/ʃ.ɑː.n ˌr.e.v/ə/ˈl.uː/ʃən m.juː/ˈz.iː/ə.m","cn":"井冈山革命博物馆（只要求理解）","s":[]},{"l":"th.e R.e.d Ar.m/y","p":"ð.ə r.e.d ˈɑː.m/i","cn":"红军（只要求理解）","s":[]}]},{"name":"Unit 2 Getting together","words":[{"l":"p.a.s.t.e","p":"p.eɪ.s.t.-","cn":"粘贴","s":[["This function allows you to cut and paste text.","本功能可使你剪切并粘贴文本。"],["She mixed the flour and water to a smooth paste.","她把面和水和成细润的面团。"],["It's quicker to cut and paste than to retype.","剪切和粘贴比重新打字要快。"]]},{"l":"d.r.e.ss","p":"d.r.e.s","cn":"穿衣服","s":[["Kids love dressing up.","孩子们都喜欢装扮成别人玩儿。"],["She's always well-dressed.","她总是衣着讲究。"],["Don't get your dress dirty!","别把你的连衣裙弄脏了！"]]},{"l":"g.a/l.a","p":"ˈɡ.ɑː/l.ə","cn":"演出；庆典（只要求理解）","s":[["The festival will climax on Sunday with a gala concert.","星期天的音乐盛会将把这次会演推向高潮。"],["The gala evening was attended by royalty and politicians.","王室成员和政坛要人参加了这个晚会。"]]},{"l":"c.ou.n.t d.ow.n","p":"k.aʊ.n.t d.aʊ.n","cn":"倒计时","s":[]},{"l":"m.a.r/a/th.o.n","p":"ˈm.æ.r/ə/θ.ə.n","cn":"马拉松赛跑（只要求理解）","s":[["It felt as though he had run a marathon.","他感到好像跑了一个马拉松似的。"],["The interview was a real marathon.","这次面试真是一场马拉松。"],["The marathon is a severe test of stamina.","马拉松赛跑是对耐力的严峻考验。"]]},{"l":"a.s","p":"ə.z","cn":"作为（只要求理解）","s":[["Case 1: Photography as content.","案例1：照片作为内容。"],["Glass contracts as it cools.","玻璃遇冷收缩。"],["Who succeeded Kennedy as President?","接替肯尼迪任总统的是谁？"]]},{"l":"r.a.c.e","p":"r.eɪ.s.-","cn":"赛跑；速度竞赛（只要求理解）","s":[["He finished fifth in the race.","他赛跑得了第五名。"],["They all put a bet on the race.","他们都对比赛下了赌注。"],["He will be competing in the 100-metre race.","他将参加100米比赛。"]]},{"l":"r.u.n","p":"r.ʌ.n","cn":"（过去式ran）跑；奔跑","s":[["I can run fast.","我能跑得快。"],["We've run short of milk.","我们牛奶不够了。"],["The batteries are running down.","电池快耗完了。"]]},{"l":"ch.eer","p":"tʃ.ɪə","cn":"欢呼；加油（只要求理解）","s":[["Cheering crowds greeted their arrival.","欢呼的人群欢迎他们的到来。"],["A great cheer went up from the crowd.","观众爆发出一阵热烈的欢呼声。"],["Everyone cheered and clapped.","人人都鼓掌欢呼。"]]},{"l":"b.oo.k f.air","p":"b.ʊ.k f.eə","cn":"书市（只要求理解）","s":[]},{"l":"w.r.i.t/er","p":"-.ˈr.aɪ.t/ə","cn":"作家；作者（只要求理解）","s":[["Who is your favourite writer?","谁是你特别喜欢的作家？"],["Turner is a writer and critic.","特纳是一位作家和评论家。"],["'You? A writer?' she sneered.","“你？是作家？”她不屑地说。"]]},{"l":"r.ea.d","p":"r.iː.d","cn":"（过去式read）阅读","s":[["He'd never learned to read.","他一直没有学会阅读。"],["She's still learning to read.","她还在学习识字。"],["Have you read the contract?","你看过这份合同了吗？"]]},{"l":"m.a.k.e","p":"m.eɪ.k.-","cn":"（过去式made）做；使出现","s":[["We're making a snowman.","我们正在做一个雪人。"],["Four quarters make a whole.","四个四分之一构成一个整体。"],["She makes her own clothes.","她自己做衣服。"]]},{"l":"s.i.ng","p":"s.ɪ.ŋ","cn":"（过去式sang）唱（歌）；演唱","s":[["Can white girls sing the blues?","白人女孩会唱蓝调吗？"],["I like dancing, singing, and drawing.","我喜欢跳舞、唱歌和画画。"],["She usually sings in the shower.","她常常边冲澡边唱歌。"]]},{"l":"w.ear","p":"w.eə","cn":"（过去式wore）穿；戴","s":[["I wear glasses for driving.","我开车时戴眼镜。"],["She usually wears long skirts.","她通常穿长裙。"],["She doesn't often wear heels.","她不常穿高跟鞋。"]]},{"l":"y.e.s/t.er/d.ay","p":"ˈj.e.s/t.ə/d.eɪ","cn":"昨天（只要求理解）","s":[["He signed for United yesterday.","昨天他和联队签了约。"],["I must apologise for missing our appointment yesterday.","我必须为错过昨天的约会道歉。"],["She left yesterday.","她昨天离开了。"]]},{"l":"n.o.t/i.c.e","p":"ˈn.əʊ.t/ɪ.s.-","cn":"通知（只要求理解）","s":[["He pretended not to notice.","他假装没注意。"],["You must give one month's notice.","你必须一个月前发出通知。"],["Amazingly, no one noticed.","令人惊奇的是，竟没有人注意到。"]]},{"l":"w.a.k.e","p":"w.eɪ.k.-","cn":"（过去式woke）醒；醒来（只要求理解）","s":[["Wake up! It's eight o'clock.","醒醒吧！已经八点钟了。"],["You have to wake up now, baby.","你现在得醒了，宝贝儿。"],["I always wake early in the summer.","我夏天总是醒得早。"]]},{"l":"l.a.t/er","p":"ˈl.eɪ.t/ə","cn":"随后；后来（只要求理解）","s":[["Could you phone back later?","您过一会儿再打电话来好吗？"],["'See you later!' she called.","“再见！”她叫道。"],["We will likely see him later.","我们很可能晚些时候会见到他。"]]},{"l":"j.u.dge","p":"dʒ.ʌ.dʒ","cn":"裁判（只要求理解）","s":[["The judge allowed my claim.","法官同意我的要求。"],["She's a good judge of character.","她很善于鉴定别人的性格。"],["In May, a judge ruled in favour of Burger King.","5月，一名法官做出了有利于汉堡王的裁决。"]]},{"l":"b.e/g.i.n","p":"b.ɪ/ˈɡ.ɪ.n","cn":"（过去式began）开始（只要求理解）","s":[["When does the concert begin?","音乐会什么时间开始？"],["Begin when I give the command.","我发出命令时开始。"],["Her sight is beginning to go.","她的视力开始下降。"]]},{"l":"w.i.n","p":"w.ɪ.n","cn":"（过去式won）获胜（只要求理解）","s":[["Everyone has a chance to win.","每个人都有机会赢。"],["This is her third win in a row.","这是她连续获得的第三次胜利。"],["If I win, it will be a dream come true.","如果我赢了，那就是梦想成真。"]]},{"l":"w.i.n/n.er","p":"ˈw.ɪ.n/-.ə","cn":"获胜的人（或队）；成功者（只要求理解）","s":[["The winner gets first pick of the prizes.","获胜者可先挑奖品。"],["The winner scored 10 pts.","获胜者得了10分。"],["The winner was timed at 20.4 seconds.","获胜者用的时间为20.4秒。"]]},{"l":"e.v/er","p":"ˈe.v/ə","cn":"（进行比较时用于加强语气）以往任何时候（只要求理解）","s":[["Nothing ever happens here.","这儿从未发生过任何事。"],["It's my best ever score.","这是我得到过的最好分数。"],["All she ever does is complain.","她就会抱怨。"]]},{"l":"e.x/c.i.t/i.ng","p":"ɪ.k/ˈs.aɪ.t/ɪ.ŋ","cn":"令人激动的（只要求理解）","s":[["My day-to-day life is not very exciting.","我的日常生活很平淡。"],["Building a home from scratch can be both exciting and challenging.","白手起家既激动人心又具有挑战性。"],["\"Golly,\" he says, \"Isn't it exciting!\"","他说，“天哪！这真是太令人兴奋了！”"]]}]},{"name":"Unit 3 Healthy life","words":[{"l":"c.o.l.d","p":"k.əʊ.l.d","cn":"感冒","s":[["It's freezing cold outside.","外面极为寒冷。"],["I like cold weather.","我喜欢寒冷的天气。"],["His final request stopped her cold.","他最后的请求突然阻止了她。"]]},{"l":"i.ll","p":"ɪ.l","cn":"不舒服；生病的（只要求理解）","s":[["He looks dreadfully ill.","他看上去病得非常严重。"],["The patient is terminally ill.","这个病人病入膏肓。"],["Mrs Smith seriously ill already hospitalize.","史密斯夫人病重已住院。"]]},{"l":"h.ea.d","p":"h.e.d","cn":"头；头部（只要求理解）","s":[["Where are we heading?","我们要往哪儿去？"],["Let's head back home.","咱们回家吧。"],["What heading does this come under?","这该归入哪一级标题？"]]},{"l":"r.u.n/n.y n.o.s.e","p":"ˈr.ʌ.n/-.i n.əʊ.z.-","cn":"流鼻涕","s":[]},{"l":"s.oo.n","p":"s.uː.n","cn":"很快；马上（只要求理解）","s":[["Your breakfast is coming soon.","你的早餐很快就到。"],["The party soon warmed up.","聚会很快活跃起来。"],["It's amazing how soon you adapt.","你这么快就适应了，真是令人惊奇。"]]},{"l":"f.e/v.er","p":"ˈf.iː/v.ə","cn":"发烧；发热","s":[["My Uncle Jim had a high fever.","我的叔叔吉姆发高烧了。"],["The fever has passed its crisis.","发烧已过危险期。"],["She mopped his fevered brow.","她擦了他那发烧的前额。"]]},{"l":"c.ough","p":"k.ɒf","cn":"咳嗽","s":[["A giraffe cannot cough.","长颈鹿没办法咳嗽。"],["Another fit of coughing seized him.","他那咳嗽又一次发作了。"],["She broke the silence by coughing.","她的咳嗽声打破了寂静。"]]},{"l":"d.i/s.c.u.ss","p":"d.ɪ/ˈs.k.ʌ.s","cn":"讨论；商量（只要求理解）","s":[["They had important matters to discuss.","他们有些重要的问题要讨论。"],["We'll discuss this at Monday's meeting.","我们在星期一的会上讨论这件事儿。"],["They discussed the difficulty of studying abroad.","他们讨论了到国外学习的困难。"]]},{"l":"d.i/e.t","p":"ˈd.aɪ/ə.t","cn":"日常饮食","s":[["She's on a very strict diet.","她正严格节食。"],["Diet and exercise are equally important.","饮食和锻炼同样重要。"],["We all need variety in our diet.","我们都需要饮食多样化。"]]},{"l":"s.t.ay u.p","p":"s.t.eɪ ʌ.p","cn":"熬夜","s":[["It is bad for health to stay up late.","熬夜对健康有害。"],["I am not allowed to stay up late by my parents.","我父母不允许我熬夜。"],["I used to stay up late with my mom and watch movies.","我过去常和妈妈熬夜看电影。"]]},{"l":"c.r.y","p":"k.r.aɪ","cn":"哭；哭泣（只要求理解）","s":[["It's all right. Don't cry.","不要紧，别哭了。"],["There's nothing to cry about.","没有什么值得哭的。"],["I just couldn't stop crying.","我哭啊哭啊，怎么也止不住。"]]},{"l":"a/n.o.th/er","p":"ə/ˈn.ʌ.ð/ə","cn":"另一；不同的（人或事物）（只要求理解）","s":[["Time is another important consideration.","时间是另一个需要考虑的重要因素。"],["Do you want another pancake?","你想再要一个煎饼吗？"],["Another fit of coughing seized him.","他那咳嗽又一次发作了。"]]},{"l":"c.a.ll","p":"k.ɔː.l","cn":"（给……）打电话（只要求理解）","s":[["I'll call you tonight.","我今晚将会打电话给你。"],["'Hi!' she called brightly.","“嗨！”她轻快地招呼道。"],["His fans called goldfish.","他的粉丝叫金鱼。"]]},{"l":"e/m.ai.l","p":"ˈiː/m.eɪ.l","cn":"电子邮件（只要求理解）","s":[["What's your email address ?","你的电邮地址是什么？"],["I'll email her the documents.","我将用电邮把这些文件发送给她。"],["They each have their own email address.","他们每个人都有自己的电子邮件地址。"]]},{"l":"u.n/h.a.p/p.y","p":"ʌ.n/ˈh.æ.p/-.i","cn":"不快乐的；难过的（只要求理解）","s":[["He sure looked unhappy.","他的确显得不高兴。"],["I hate to see you unhappy.","我不愿见你不高兴。"],["They were unhappy with their accommodation.","他们对住处不满意。"]]},{"l":"g.l.a.ss","p":"ɡ.l.ɑː.s","cn":"一杯（的量）；玻璃（只要求理解）","s":[["Glass contracts as it cools.","玻璃遇冷收缩。"],["I wear glasses for driving.","我开车时戴眼镜。"],["Look through this glass, Gerda.","透过这镜子看吧，格尔达。"]]},{"l":"m.ay","p":"m.eɪ","cn":"也许；可能（只要求理解）","s":[["Other problems may follow.","其它问题也许会随之而来。"],["May I borrow your newspaper?","把你的报纸借我看行吗？"],["May I go with you?","我可以和你一起去吗？"]]},{"l":"a.dd","p":"æ.d","cn":"补充说；增加（只要求理解）","s":[["'And don't be late,' she added.","“还有别迟到。”她补充说道。"],["His story just doesn't add up.","他说的情况根本不合情理。"],["The numbers add up to exactly 100.","这些数字的总数恰好是100。"]]},{"l":"v.i.d/e/o","p":"ˈv.ɪ.d/i/əʊ","cn":"视频；录像（只要求理解）","s":[["Do we have a blank video ?","我们有空白录像带吗？"],["He wanted to play video game.","他想玩电子游戏。"],["She has watched the race on video.","她已观看了比赛的录像。"]]},{"l":"b.e.t/t.er","p":"ˈb.e.t/-.ə","cn":"舒畅些的；（病势）好转的（只要求理解）","s":[["She's much better today.","她今天好多了。"],["You'd better fold it carefully.","你最好仔细地折叠好它。"],["I'm better now, thank you.","我现在好些了，谢谢您。"]]}]},{"name":"Unit 4 Managing money well","words":[{"l":"m.o.n/ey","p":"ˈm.ʌ.n/i","cn":"钱","s":[["He desperately needed money.","他急需钱。"],["I counted the money carefully.","我仔细点了这笔钱。"],["Money is not essential to happiness.","金钱对于幸福并非必不可少。"]]},{"l":"p.o.ck/e.t m.o.n/ey","p":"ˈp.ɒ.k/ɪ.t ˈm.ʌ.n/i","cn":"零花钱（只要求理解）","s":[["They earned themselves a little pocket money by selling cigarettes.","他们靠卖香烟赚点零用钱。"],["He spends most of his pocket money on PlayStation games.","他将大部分的零花钱花在买游戏站的游戏上。"],["When you give kids pocket money make sure they save some of it.","给孩子们零花钱时，你一定要确保他们攒下一部分。"]]},{"l":"s.ch.oo.l/b.a.g","p":"ˈs.k.uː.l/b.æ.ɡ","cn":"书包（只要求理解）","s":[["My schoolbag is left here.","我的书包忘在这里了。"],["Then, I packed my schoolbag.","然后，我收拾了我的书包。"],["I can't find my schoolbag.","我找不到书包了。"]]},{"l":"g.oo.d.s","p":"ɡ.ʊ.d.z","cn":"商品","s":[["Prices are marked on the goods.","价格标在商品上。"],["These goods are priced too high.","这些货品定价过高。"],["The company is a world leader in electrical goods.","这家公司的电器产品在全世界首屈一指。"]]},{"l":"d.r.i.n.k","p":"d.r.ɪ.ŋ.k","cn":"饮料","s":[["He never drinks alcohol.","他从来不喝酒。"],["This drink doesn't contain any alcohol.","这种饮料不含任何酒精。"],["Would you like a drink, dear?","喝点什么吗，亲爱的？"]]},{"l":"s.er/v.i.c.e","p":"ˈs.ɜː/v.ɪ.s.-","cn":"服务","s":[["Her service has improved.","她的发球有了提高。"],["A new late-night service is now operating.","现在推出一项新的深夜服务。"],["Additionally, the bus service will run on Sundays, every two hours.","此外，公共汽车将于星期天运行，每两小时一班。"]]},{"l":"h.air/c.u.t","p":"ˈh.eə/k.ʌ.t","cn":"理发；发型","s":[["Say, that's a nice haircut!","啧啧，这个头发剪得很漂亮！"],["I see you've had a haircut.","我看得出你理发了。"],["What do you think of my new haircut?","你觉得我的新发型怎么样？"]]},{"l":"m.i/c.r.o.s/c.o.p.e","p":"ˈm.aɪ/k.r.ə.s/k.əʊ.p.-","cn":"显微镜（只要求理解）","s":[["If you look at the paper under a microscope you will see the fibres.","如果你在显微镜下观察这张纸，你就会看到纤维。"],["The sperm sample is checked under the microscope before insemination is carried out.","进行受精前用显微镜检查精子样本。"],["The electron microscope uses a beam of electrons to produce images at high magnifications.","电子显微镜利用一束电子产生高倍放大的影像。"]]},{"l":"l.u.ck/y","p":"ˈl.ʌ.k/i","cn":"幸运的（只要求理解）","s":[["Other youngsters are not so lucky.","其他的年轻人没有这么幸运。"],["I'm lucky because my sister is a hairdresser.","我很幸运，因为我的姐姐是一名理发师。"],["He was lucky to get away with only a fine.","他算是万幸，只被罚款了事。"]]},{"l":"h.a.l.f","p":"h.ɑː.-.f","cn":"一半（只要求理解）","s":[["Tuesday is her half day.","星期二她只工作半天。"],["It really isn't half bad, is it?","这的确很不错，对吗？"],["She lives just half a mile away.","她就住在半英里之外。"]]},{"l":"s.a.v.e u.p","p":"s.eɪ.v.- ʌ.p","cn":"攒钱","s":[]},{"l":"s.a.l.e","p":"s.eɪ.l.-","cn":"特价销售；出售","s":[["The sale starts next week.","特价促销从下星期开始。"],["She gets 10% commission on each sale.","每笔生意她得10%的佣金。"],["He moved to the sales department.","他调到了销售部。"]]},{"l":"t.i.ck/e.t","p":"ˈt.ɪ.k/ɪ.t","cn":"票（只要求理解）","s":[["Each ticket admits one adult.","每张票只准许一位成人入场。"],["You can have my ticket.","你可以得到我的票。"],["The ticket will guarantee you free entry.","这张票可保证你免费入场。"]]},{"l":"m.a.n/a.g.e","p":"ˈm.æ.n/ɪ.dʒ.-","cn":"管理（只要求理解）","s":[["He'll manage—he isn't stupid.","他可以的—他不笨。"],["I managed to grab her hand.","我设法抓住了她的手。"],["We'll manage as best we can.","我们将尽力处理。"]]},{"l":"s.e.ll","p":"s.e.l","cn":"出售；售卖（只要求理解）","s":[["They sell all kinds of things.","他们出售各种各样的东西。"],["More farms are selling direct to consumers.","更多的农场在直接向消费者销售产品。"],["We only sell it by the metre.","我们只按米出售。"]]},{"l":"j.ar","p":"dʒ.ɑː","cn":"罐子（只要求理解）","s":[["Do you fancy a jar after work?","下班后去喝一杯怎么样？"],["This jar will hold a kilo.","这个罐子能盛一千克。"],["Someone has selfishly emptied the biscuit jar.","有人自私地吃光了饼干罐里的饼干。"]]},{"l":"f.or e.x/a.m/p.le","p":"f.ɔː ɪ.ɡz/ˈɑː.m/p.l","cn":"例如（只要求理解）","s":[["Have they, for example, demonstrated a commitment to democracy?","例如，他们展现了对民主的奉献吗？"],["Take, for example, the simple sentence: \"The man climbed up the hill.\"","以这个简单句为例：“那个人爬上了山坡。”"],["The report is incomplete; it does not include sales in France, for example.","这份报告不完整，例如在法国的销售情况就没包括进去。"]]}]},{"name":"Unit 5 Exploring space","words":[{"l":"p.l.a.n/e.t","p":"ˈp.l.æ.n/ɪ.t","cn":"行星","s":[["Does life exist on other planets?","其他行星上有生命吗？"],["Do you know when Tianwen 1 landed on the red planet?","你知道天问1号是什么时候登陆这颗红色星球的吗？"],["The new planet is about ten times the size of the earth.","这个新发现的行星大约是地球大小的10倍。"]]},{"l":"ear.th","p":"ɜː.θ","cn":"地球（也写作 Earth）","s":[["The earth moves round the sun.","地球围绕太阳旋转。"],["The moon is a satellite of earth.","月球是地球的卫星。"],["Help us build a base on the earth.","帮我们在地球上建立一个基地。"]]},{"l":"s.k.y","p":"s.k.aɪ","cn":"天；天空（只要求理解）","s":[["Clouds drifted across the sky.","朵朵浮云在空中飘过。"],["Stars twinkled in the sky.","星星在天空中闪烁。"],["The sky was a brilliant blue.","天空一片蔚蓝。"]]},{"l":"d.ay/t.i.m.e","p":"ˈd.eɪ/t.aɪ.m.-","cn":"白天（只要求理解）","s":[["You don't often see this bird in (the) daytime.","这种鸟白天不常见。"],["The park is open during (the) daytime.","这个公园日间开放。"],["Some animals are inactive during the daytime.","有些动物白天不活动。"]]},{"l":"c.l.ou.d","p":"k.l.aʊ.d","cn":"云（只要求理解）","s":[["The plane disappeared behind a cloud.","飞机消失在云层里。"],["\"Cloud Street\" is already in its third printing.","《云街》已经是第3次印刷了。"],["The clouds threatened rain.","乌云密布预示大雨将至。"]]},{"l":"m.oo.n","p":"m.uː.n","cn":"月球；月亮；卫星（也写作 the Moon）","s":[["Building a base on the moon.","在月球上建造基地。"],["The moon is a satellite of earth.","月球是地球的卫星。"],["The moon is in its first quarter.","月亮正处于上弦。"]]},{"l":"s.t.ar","p":"s.t.ɑː","cn":"恒星；星","s":[["I stared fixedly at the statue.","我目不转睛地看着那尊雕像。"],["The Galaxy consists of 100 billion stars.","银河系由1千亿颗恒星组成。"],["I go to Star Primary School.","我在思达小学上学。"]]},{"l":"s.p.a.c.e","p":"s.p.eɪ.s.-","cn":"太空；空间","s":[["She needed space to be herself.","她需要自己的独立空间。"],["He needed space to be himself.","他需要自己的独立的空间。"],["We lead the way in space technology.","我们在航天技术方面处于领先地位。"]]},{"l":"ou.t/er s.p.a.c.e","p":"ˈaʊ.t/ə s.p.eɪ.s.-","cn":"外太空（只要求理解）","s":[]},{"l":"s.p.a.c.e s.t.a/tion","p":"s.p.eɪ.s.- ˈs.t.eɪ/ʃən","cn":"空间站","s":[]},{"l":"o/c.ea.n","p":"ˈəʊ/ʃ.ə.n","cn":"大海；海洋（只要求理解）","s":[["They spend hours feeding on the ocean floor.","它们花几个小时在海底进食。"],["My raft helps me cross the ocean of life.","我的木筏帮助我横渡生命的海洋。"],["Every room has a window facing the ocean.","每个房间都有一扇面对大海的窗。"]]},{"l":"m.ar/b.le","p":"ˈm.ɑː/b.l","cn":"（玻璃）弹子（只要求理解）","s":[["Marble Arch is a famous London landmark.","大理石拱门是伦敦著名的标志性建筑。"],["Her heels clacked on the marble floor.","她的鞋后跟在大理石地面上发出咔嗒咔嗒的响声。"],["She was chiselling some marble.","她在雕刻一些大理石。"]]},{"l":"s.a.t/e/ll.i.t.e","p":"ˈs.æ.t/ə/l.aɪ.t.-","cn":"人造卫星","s":[["They have four satellite channels.","他们有4个卫星频道。"],["Why shoot down the satellite?","为何要击落卫星呢？"],["The moon is a satellite of earth.","月球是地球的卫星。"]]},{"l":"s.oi.l","p":"s.ɔɪ.l","cn":"土壤（只要求理解）","s":[["The continuous rain had saturated the soil.","连绵不断的雨把土地淋了个透。"],["Farmers grow rice in the rich soil.","农民们在肥沃的土地上种水稻。"],["First rake the soil smooth.","首先把地耙平。"]]},{"l":"a/l.i/e.n","p":"ˈeɪ/l.i/ə.n","cn":"外星生物（只要求理解）","s":[["Cruelty was quite alien to him.","他绝无残忍之心。"],["The idea is alien to our religion.","这种思想与我们的宗教不相容。"],["Immigrant workers were classed as aliens.","移民来的工人被归入侨民类。"]]},{"l":"s.u.n/r.i.s.e","p":"ˈs.ʌ.n/r.aɪ.z.-","cn":"日出（只要求理解）","s":[["I'll be at work by sunrise.","日出之前我就开始工作了。"],["The rain began before sunrise.","雨是在日出前开始下的。"],["We got up at sunrise.","我们在日出时起床。"]]},{"l":"r.o/v.er","p":"ˈr.əʊ/v.ə","cn":"探测器（只要求理解）","s":[]},{"l":"i.n/t.o","p":"ˈɪ.n/t.ə","cn":"朝；进入（只要求理解）","s":[["I'm into electronics myself.","我自己对电子学很感兴趣。"],["I walked into town.","我走进了市中心。"],["Break into large pieces.","撕成大片。"]]},{"l":"t.e.l/e.s/c.o.p.e","p":"ˈt.e.l/ɪ.s/k.əʊ.p.-","cn":"望远镜","s":[["The telescope has a magnification of 50.","这个望远镜可以放大50倍。"],["The telescope was pointing in the wrong direction.","望远镜对错了方向。"],["Like a telescope, it has a curved mirror to collect the sunlight.","和望远镜一样，它有一个曲面镜来聚集太阳光。"]]},{"l":"a.s/t.r.o/n.au.t","p":"ˈæ.s/t.r.ə/n.ɔː.t","cn":"航天员；宇航员","s":[["Welcome the woman astronaut!","欢迎女宇航员！"],["Let's pretend (that) we're astronauts.","咱们装扮成太空人吧。"],["Could you be an astronaut?","你能成为宇航员吗？"]]},{"l":"s.p.a.c.e/sh.i.p","p":"ˈs.p.eɪ.s.-/ʃ.ɪ.p","cn":"宇宙飞船","s":[["It's like a spaceship landed.","它像一艘降落的宇宙飞船。"],["That's a spaceship. It's fast.","那是一艘宇宙飞船，它速度很快。"],["Its spaceship was engineered by Bert Rutan, renowned for designing the Voyager.","它的飞船由伯特·鲁坦设计建造，此人因设计“旅行者”号飞船而闻名。"]]},{"l":"m.o.n.th","p":"m.ʌ.n.θ","cn":"月；月份（只要求理解）","s":[["She's seven months gone.","她怀孕七个月了。"],["We're moving house next month.","我们下个月搬家。"],["She's six months pregnant.","她怀孕六个月了。"]]},{"l":"t.ai/k.o/n.au.t","p":"ˈt.aɪ/k.ə/n.ɔː.t","cn":"中国航天员（只要求理解）","s":[]},{"l":"c.l.o.th","p":"k.l.ɒ.θ","cn":"（一块）布；织物（只要求理解）","s":[["She makes her own clothes.","她自己做衣服。"],["His job is to hand out food and clothes.","他的工作是分发食物和衣服。"],["He wears monkey clothes.","他穿着猴子服。"]]},{"l":"t.oo.th/p.a.s.t.e","p":"ˈt.uː.θ/p.eɪ.s.t.-","cn":"牙膏（只要求理解）","s":[["I went out today and bought a tube of toothpaste.","我今天出去买了一管牙膏。"]]},{"l":"qu.e.s/tion","p":"ˈkw.e.s/tʃən","cn":"问题（只要求理解）","s":[["He couldn't answer the question.","他没有能回答那个问题。"],["The question clearly angered him.","这个问题显然激怒了他。"],["Are there any other questions?","还有其他问题没有？"]]},{"l":"s.u.n/s.e.t","p":"ˈs.ʌ.n/s.e.t","cn":"日落（只要求理解）","s":[["The dance ends at sunset.","舞会在日落时结束。"],["By sunset we had covered thirty miles.","到日落时我们已走了三十英里。"],["We worked from sunup to sunset.","我们从日出工作到日落。"]]},{"l":"t.i.m.e","p":"t.aɪ.m.-","cn":"次；回（只要求理解）","s":[["It's time for dinner.","该吃饭了。"],["Time is another important consideration.","时间是另一个需要考虑的重要因素。"],["The baby loves bath time.","这婴儿喜欢洗澡的时候。"]]},{"l":"M.ar.s","p":"m.ɑː.z","cn":"火星（只要求理解）","s":[["Do you know when China's Tianwen-1 probe landed on Mars?","你知道中国的“天问一号”探测器是什么时候登陆火星的吗？"],["Tianwen 1 is China's first Mars probe.","“天问一号”是中国首个火星探测器。"],["Mars was visible, dead in the centre of the telescope.","火星清晰可辨，正好就在望远镜的中心。"]]}]},{"name":"Unit 6 Energy, nature and us","words":[{"l":"p.ow/er","p":"ˈp.aʊ/ə","cn":"能；能量","s":[["They've switched off the power.","他们关掉了电源。"],["Both parties are hungry for power.","两党都渴望掌权。"],["The power stations burn coal from the Ruhr region.","这些电厂烧产自鲁尔地区的煤。"]]},{"l":"e/l.e.c/t.r.i.c/i/t.y","p":"ɪ/ˌl.e.k/ˈt.r.ɪ.s/ə/t.i","cn":"电（只要求理解）","s":[["It works by electricity.","这是电动的。"],["He cannot fix the electricity.","他不会修理电路。"],["This type of heater uses a lot of electricity.","这种加热器耗电量很大。"]]},{"l":"s.o/l.ar","p":"ˈs.əʊ/l.ə","cn":"太阳的","s":[["The picture shows six of the nine planets in the solar system.","这张图片展示太阳系9个行星中的6个行星。"],["They developed a solar airplane.","他们开发了一种太阳能飞机。"],["Solar panels trap energy from the sun.","太阳能电池板吸收太阳能。"]]},{"l":"t.y.p.e","p":"t.aɪ.p.-","cn":"类型；种类（只要求理解）","s":[["She's the artistic type.","她是艺术家一类的人。"],["He's not the nervous type.","他不是那种好紧张的人。"],["What blood type do you have?","你是什么血型？"]]},{"l":"e.n/er/g.y","p":"ˈe.n/ə/dʒ.i","cn":"能源（只要求理解）","s":[["She's always full of energy.","她总是充满活力。"],["The whole of creation is made up of energy.","全宇宙是由能量构成的。"],["That USES up 1%, or close to 1%, of the world's energy.","它使用了1%或者接近1%的全世界的能源。"]]},{"l":"l.igh.t","p":"l.aɪ.t","cn":"照亮","s":[["Glass and water both bend light.","玻璃和水都折光。"],["We seem to be light on fuel.","我们好像燃料不多了。"],["New evidence has recently come to light.","新的证据最近已披露出来。"]]},{"l":"h.ea.t","p":"h.iː.t","cn":"加热；（使）变暖；热量","s":[["The heat made him feel faint.","炎热使他觉得快要晕倒了。"],["The heating is on a time switch.","暖气靠定时开关自动供热。"],["Turn the heat down or it'll burn.","把炉火开小一些，不然就烧焦了。"]]},{"l":"c.oo.l","p":"k.uː.l","cn":"（使）变凉，冷却","s":[["That's a cool hat.","那是一顶很酷的帽子。"],["Glass contracts as it cools.","玻璃遇冷收缩。"],["Thank goodness it's cool in here.","谢天谢地，这里很凉爽。"]]},{"l":"r.u.n","p":"r.ʌ.n","cn":"（使）运转","s":[["I can run fast.","我能跑得快。"],["We've run short of milk.","我们牛奶不够了。"],["The batteries are running down.","电池快耗完了。"]]},{"l":"r.e/s.our.c.e","p":"r.ɪ/ˈs.ɔː.s.-","cn":"资源（只要求理解）","s":[["For every resource, insert one row into this table.","对于每个资源，在这个表中插入一行。"],["It isn't animals who use up the world's resources.","不是动物耗尽了世界资源。"],["The database could be used as a teaching resource in colleges.","数据库可以用作大学里的一种教学辅助手段。"]]},{"l":"r.u.n ou.t","p":"r.ʌ.n aʊ.t","cn":"用完（只要求理解）","s":[["They have run out of ideas.","他们已经想不出办法了。"],["I ran out onto the landing.","我跑出去上了楼梯平台。"],["I have run out of patience with her.","我对她已失去耐性。"]]},{"l":"ch.a.n.g.e","p":"tʃ.eɪ.n.dʒ.-","cn":"（使）不同；改变（只要求理解）","s":[["Can we change seats?","咱们可以交换一下座位吗？"],["Everything changed after nine-eleven.","九一一事件发生后，一切都改变了。"],["Leaves change colour in autumn.","树叶在秋天改变颜色。"]]},{"l":"qu.i.ck","p":"kw.ɪ.k","cn":"迅速的；快的（只要求理解）","s":[["The company wants quick results.","这公司要立竿见影的成果。"],["Come on! Quick! They'll see us!","快点吧！快！他们会看见我们的！"],["The kids were quick to learn.","那些孩子学东西很快。"]]},{"l":"sh.ow/er","p":"ˈʃ.aʊ/ə","cn":"淋浴（只要求理解）","s":[["Turn off the shower.","关掉淋浴。"],["She usually sings in the shower.","她常常边冲澡边唱歌。"],["We now have a functioning shower.","现在我们有一个功能正常的淋浴器。"]]},{"l":"u.n/p.l.u.g","p":"ˌʌ.n/ˈp.l.ʌ.ɡ","cn":"拔掉……的电源插头（只要求理解）","s":[]},{"l":"d.i/ff.e.r.ence","p":"ˈd.ɪ/f.-.r.əns","cn":"差别；不同（之处）（只要求理解）","s":[["Few people understand the difference.","很少有人了解这个差别。"],["'There's the difference between art and artefact.","艺术品与人工制品之间存在着差异。"],["There are qualitative differences between the two products.","这两种产品存在着质的差别。"]]},{"l":"r.e/d.u.c.e","p":"r.ɪ/ˈd.juː.s.-","cn":"减少","s":[["The company must reduce costs to compete effectively.","公司要有效地参与竞争必须降低成本。"],["We wanted to reduce the cost of heating and air-conditioning.","我们想减少供暖与空调的开支。"],["The government is looking to reduce inflation.","政府正在力求降低通货膨胀率。"]]},{"l":"air c.o.n/d.i.tion/er","p":"eə k.ə.n/ˈd.ɪ.ʃən/ə","cn":"空调机（只要求理解）","s":[]},{"l":"d.r.i.v.e","p":"d.r.aɪ.v.-","cn":"驾驶；开车（只要求理解）","s":[["She never learned to drive.","她从未学过开车。"],["We heard him drive away.","我们听到他驱车离去了。"],["Walking's a drag—let's drive there.","步行太累了—咱们开车去吧。"]]},{"l":"r.e/u.s.e","p":"ˌr.iː/ˈjuː.z.-","cn":"再次使用；重复使用","s":[["Usually, the service provider will reuse a canceled number after three to six months.","通常，服务提供者将在三到六个月后重新启用已取消的号码。"],["Copper, brass, and aluminium are separated and remelted for reuse.","铜、黄铜和铝被分门别类重新熔化以供再利用。"]]},{"l":"ow.n","p":"əʊ.n","cn":"自己的（只要求理解）","s":[["She makes her own clothes.","她自己做衣服。"],["She made her own bread.","她自己做了面包。"],["They enjoy making their own decisions.","他们喜欢做他们自己的决定。"]]},{"l":"m.ar/k.e.t","p":"ˈm.ɑː/k.ɪ.t","cn":"集市；市场（只要求理解）","s":[["Thursday is market day.","星期四是赶集日。"],["The market collapsed last October.","股票市场去年10月崩盘了。"],["Real estate remains a buyer's market.","房地产依然是买方市场。"]]},{"l":"b.o.t/t.le","p":"ˈb.ɒ.t/-.l","cn":"瓶子（只要求理解）","s":[["The bottle's nearly empty.","这瓶子差不多空了。"],["They had one bottle of lemonade.","他们有一瓶柠檬水。"],["New fathers love bottle-feeding their babies.","新爸爸们喜欢用奶瓶喂他们的婴儿。"]]},{"l":"t.o.p","p":"t.ɒ.p","cn":"（位置、级别或程度）最高的（只要求理解）","s":[["She jumped off the top board.","她从高层跳板上跳了下来。"],["Only the top four teams go through.","仅4个顶尖队伍胜出。"],["He's a top bloke.","他是个大好人。"]]},{"l":"u.s.e/f.u.l","p":"ˈjuː.s.-/f.ə.l","cn":"有用的；有益的（只要求理解）","s":[["He offered some useful advice.","他提出了一些有益的建议。"],["Photos make useful teaching aids.","照片可以成为有用的教具。"],["This information could prove useful.","这条信息往后也许有用。"]]},{"l":"d.ir/t.y","p":"ˈd.ɜː/t.i","cn":"脏的（只要求理解）","s":[["Don't get your dress dirty!","别把你的连衣裙弄脏了！"],["Our neighborhood is so dirty.","我们的社区太脏了。"],["She tipped the dirty water down the drain.","她把脏水倒入了下水道。"]]},{"l":"s.i.d.e","p":"s.aɪ.d.-","cn":"一面；一边（只要求理解）","s":[["The skirt has a side opening.","这裙子是侧面开口的。"],["It measures 20 yards from side to side.","从这边到那边的距离为20码。"],["We cannot take sides in a civil war.","内战中，我们不能支持任何一方。"]]}]}]},{"id":"hj7a","name":"沪教版 七年级上册","units":[{"name":"Unit 1 Friendship","words":[{"l":"gu.i/t.ar","p":"ɡ.ɪ/ˈt.ɑː","cn":"n. 吉他","s":[["She's no slouch on the guitar.","她是弹吉他的好手。"],["He went off to change a guitar string.","他离开了去换一根吉他弦。"],["He played some wah-wah guitar.","他弹了一会儿哇哇吉他。"]]},{"l":"h.o.n/e.s.t","p":"-.ˈɒ.n/ɪ.s.t","cn":"adj. 诚实的","s":[["I'm disappointed, to be honest.","我很失望，说实在的。"],["I know she's honest and reliable.","我知道她是诚实可靠的。"],["He is honest, sober and hard-working.","他诚实、稳重、勤奋。"]]},{"l":"p.a/ti.e.n.t","p":"ˈp.eɪ/ʃ.ə.n.t","cn":"adj. 有耐心的","s":[["All our patients have broadly similar problems.","我们所有的病人问题大致相似。"],["She's very good at handling her patients.","她对待病人很有办法。"],["The patient is terminally ill.","这个病人病入膏肓。"]]},{"l":"i.m/p.r.o.v.e","p":"ɪ.m/ˈp.r.uː.v.-","cn":"v. 改进；改善","s":[["The weather gradually improved.","天气逐渐好转。"],["Day by day his condition improved.","他的健康状况一天天好转。"],["I need to improve my English.","我需要提高我的英语水平。"]]},{"l":"c.o.n/f.i/d.e.n.t","p":"ˈk.ɒ.n/f.ɪ/d.ə.n.t","cn":"adj. 自信的；有自信心的","s":[["Mr. Ryan is confident of success.","瑞安先生对成功有信心。"],["He feels more confident on home turf.","他在主场感到更有信心。"],["We are confident in our expectation of a full recovery.","我们满怀信心地期待着完全康复。"]]},{"l":"c.ou.r/a.g.e","p":"ˈk.ʌ.r/ɪ.dʒ.-","cn":"n. 勇气；胆量","s":[["His courage remains unquestioned.","他的勇敢仍然不容置疑。"],["He showed courage in adversity.","他在逆境中显示出了勇气。"],["He showed great courage and determination.","他表现得十分勇敢和果断。"]]},{"l":"f.r.ie.n.d/sh.i.p","p":"ˈf.r.e.n.d/ʃ.ɪ.p","cn":"n. 友谊；朋友关系","s":[["I treasure his friendship.","我珍重他的友谊。"],["Their friendship blossomed into love.","他们的友谊发展成了爱情。"],["Friendship is a two-way process.","友谊是一种相互的关系。
