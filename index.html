"]]},{"l":"t.r.u.s.t","p":"t.r.ʌ.s.t","cn":"n. 信任；信赖","s":[["More importantly, can he be trusted?","更重要的是，他值得信任吗？"],["He set up a trust for his children.","他为子女安排好了信托财产。"],["I know I can trust her in any circumstance.","我知道我在任何情况下都能信任她。"]]},{"l":"s.ur/v.ey","p":"ˈs.ɜː/v.eɪ","cn":"n. 调查","s":[["This very thorough survey goes back to 1784.","这项非常彻底的调查可追溯到1784年。"],["The survey covers all aspects of the business.","调查包括这家企业的各个方面。"],["The survey covers a wide geographical area.","此项调查覆盖的地理区域非常广阔。"]]},{"l":"p.er/s.o/n.a.l","p":"ˈp.ɜː/s.ə/n.ə.l","cn":"adj. 个性的","s":[["That's my personal opinion.","这是我的个人意见。"],["His personal habits put them off.","他的个人习惯让他们反感。"],["Do you have a personal trainer?","你有私人教练吗？"]]},{"l":"qu.a.l/i/t.y","p":"ˈkw.ɒ.l/ə/t.i","cn":"n. 品质；品德","s":[["The recording quality is excellent.","录制质量极好。"],["The quality is uniformly high.","质量一律很高。"],["Our company puts the emphasis on quality.","我们公司重视质量。"]]},{"l":"c.a.r/i.ng","p":"ˈk.eə.r/ɪ.ŋ","cn":"adj. 关心他人的；体贴人的","s":[["Children need a caring environment.","儿童需要一个充满关怀的环境。"],["She is very caring and very genuine.","她很有同情心，也非常诚实可靠。"]]},{"l":"d.e/s.c.r.i.b.e","p":"d.ɪ/ˈs.k.r.aɪ.b.-","cn":"v. 描述；形容","s":[["Can you describe him to me?","你能向我描述一下他的样子吗？"],["The effect is almost impossible to describe.","这影响几乎无法言表。"],["It describes completely the facility and its safety basis.","它完整地描述了设备和它的安全基础。"]]},{"l":"a/pp.ea/r.ance","p":"ə/ˈp.ɪə/r.əns","cn":"n. 外貌","s":[["Don't be fooled by his appearance.","不要被他的外表所蒙蔽。"],["She sets great store by her appearance.","她十分看重自己的外貌。"],["He worries obsessively about his appearance.","他过度烦恼自己的外表。"]]},{"l":"s.t.r.aigh.t","p":"s.t.r.eɪ.t","cn":"adj. 直的","s":[["We just change the curve into straight lines.","我们只是把曲线变成了直线。"],["You'll look taller if you stand up straight.","站直身子，你会显得高些。"],["Brett looked straight ahead.","布瑞特向前直视。"]]},{"l":"d.ar.k","p":"d.ɑː.k","cn":"adj. 褐色的；乌黑的","s":[["He had dark, curly hair.","他有一头黑色卷发。"],["His dark head bent over her.","他对她低下他那黑发的头。"],["They avoid going out alone after dark.","他们避免黄昏后独自出门。"]]},{"l":"s.a.m.e","p":"s.eɪ.m.-","cn":"adj. 同一的；相同的","s":[["Our children attend the same school.","我们的孩子上同一所学校。"],["We're booked on the same flight.","我们订了同一班机的机票。"],["I would do the same again.","我愿再做同样的事。"]]},{"l":"b.a/s.i.c","p":"ˈb.eɪ/s.ɪ.k","cn":"adj. 基本的；基础的","s":[["Drums are basic to African music.","鼓是非洲音乐的基本乐器。"],["He gets a basic salary plus commission.","他领取基本薪金，外加佣金。"],["Water is a basic necessity of life.","水是一种基本生活必需品。"]]},{"l":"th.ough.t","p":"θ.ɔː.t","cn":"n. 想法","s":[["I thought you'd never finish!","我还以为你会完成不了呢！"],["He paused, apparently lost in thought.","他停顿下来，显然陷入了沉思。"],["'I must be crazy,' she thought.","“我准是疯了。”她想。"]]},{"l":"g.l.a.d","p":"ɡ.l.æ.d","cn":"adj. 高兴的；愉快的","s":[["I'm so glad (that) you're safe!","你安然无恙我真高兴！"],["I'm glad hats are coming back.","我很高兴帽子再度流行起来。"],["I'm glad you came along.","有你跟我一起来，我很高兴。"]]},{"l":"r.i.s.e","p":"r.aɪ.z.-","cn":"v. 上升","s":[["Interest rates rise from 4% to 5%.","利率从4%上升到5%。"],["The batter rises as it bakes.","面糊烘烤时膨胀。"],["They expected house prices to rise.","他们预期房价会上涨。"]]},{"l":"e.n.d","p":"e.n.d","cn":"n. 结局","s":[["This will surely end in disaster.","这无疑将以灾难告终。"],["The story has a happy ending.","故事的结局很圆满。"],["They live in the end house.","他们住在最后的那座房子。"]]},{"l":"h.ear.t","p":"h.ɑː.t","cn":"n. 心","s":[["Her heart beat faster.","她的心跳加快。"],["Heart disease runs in the family.","这家人都有心脏病。"],["He died six weeks later of a massive heart attack.","他6周后死于一次严重的心脏病发作。"]]},{"l":"b.e g.oo.d a.t","p":"b.i ɡ.ʊ.d æ.t","cn":"擅长……","s":[["Fishing is good at high water.","高水位有利于钓鱼。"],["Peter is good at soccer ball.","皮特擅长足球。"],["What helps you to be good at sport?","是什么让你擅长运动？"]]},{"l":"t.ur.n t.o s.o.m.e/b.o/d.y f.or h.e.l.p","p":"t.ɜː.n t.uː ˈs.ʌ.m.-/b.ə/d.i f.ɔː h.e.l.p","cn":"求助于某人","s":[]},{"l":"a.f/t.er s.ch.oo.l","p":"ˈɑː.f/t.ə s.k.uː.l","cn":"放学后","s":[["The children are allowed to watch TV after school.","孩子们被允许在放学后看电视。"]]},{"l":"b.e w.i.ll/i.ng t.o d.o s.o.m.e/th.i.ng", 不是我的强项。"],["Geography was my weak subject.","地理课是我的弱项。"]]},{"l":"c.or.n/er","p":"ˈk.ɔː.n/ə","cn":"n. 角；墙角","s":[["I called him from the phone box on the corner.","我在拐角处的电话亭打电话给他。"],["The referee awarded a corner.","裁判员判给了一次角球。"],["He reversed around the corner.","他倒车转过拐角。"]]},{"l":"a.c/t.i.v/i/t.y","p":"æ.k/ˈt.ɪ.v/ə/t.i","cn":"n. 活动","s":[["The test records the electrical activity of the brain.","这个测试显示出大脑的电流活动。"],["Physical activity promotes good health.","身体运动促进健康。"],["Parents encourage every activity imaginable.","父母鼓励一切可能的活动。"]]},{"l":"c.l.u.b","p":"k.l.ʌ.b","cn":"n. 社团","s":[["We had lunch at the golf club.","我们在高尔夫球俱乐部吃的午饭。"],["The next player discarded a club.","接下来的那位玩家出了张梅花牌。"],["The club is responsive to new ideas.","俱乐部对新的想法都表示欢迎。"]]},{"l":"p.r.a.c/t.i.s.e","p":"ˈp.r.æ.k/t.ɪ.s.-","cn":"v. 练习；训练","s":[["You need to practise every day.","你需要每天练习。"],["If you practise speaking English, you'll soon improve.","只要你练习说英语，很快就会进步。"],["He usually wants to practise his English on me.","他通常想跟我练习英语。"]]},{"l":"s.o.l.v.e","p":"s.ɒ.l.v.-","cn":"v. 解答","s":[["It isn't going to solve a single thing.","这解决不了任何问题。"],["She tried her best to solve the problem.","她尽了最大的努力解决这个问题。"],["In itself, it's not a difficult problem to solve.","这本身并不是个难解决的问题。"]]},{"l":"d.e/v.e.l/o.p","p":"d.ɪ/ˈv.e.l/ə.p","cn":"v. 培养；发展","s":[["How fast would the disease develop?","这种疾病发展有多快？"],["Their economy is the envy of the developing world.","他们的经济令发展中国家羡慕。"],["China is also actively developing high-speed maglev trains.","中国也在积极发展高速磁悬浮列车。"]]},{"l":"s.k.i.ll","p":"s.k.ɪ.l","cn":"n. 技术；技能","s":[["Skill comes with practice.","熟能生巧。"],["Her job demands a high degree of skill.","她的工作要求有高超的技能。"],["They never learned skills to engage the attention of the others.","他们从来没有学过吸引别人注意的技巧。"]]},{"l":"t.ee.n","p":"t.iː.n","cn":"adj. 青少年的","s":[["I have never lost the weight I put on in my teens.","我在十几岁时增加的体重从没减下去过。"],["Are mothers and teens inevitably at loggerheads?","母亲与青少年不可避免地会发生争执吗？"],["She began writing poetry in her teens.","她从十几岁开始写诗。"]]},{"l":"m.a.g/a/z.i.n.e","p":"ˌm.æ.ɡ/ə/ˈz.iː.n.-","cn":"n. 杂志","s":[["He has produced his own sports magazine.","他已经创办了自己的体育杂志。"],["He contributes regularly to the magazine 'New Scientist'.","他定期给《新科学家》杂志撰稿。"],["She used to edit a women's magazine.","她曾主编过妇女杂志。"]]},{"l":"t.ee/n.a.g/er","p":"ˈt.iː/n.eɪ.dʒ/ə","cn":"n. （13至19岁之间的）青少年","s":[["What turns teenagers off science?","是什么使青少年们对科学失去了兴趣？"],["Teenagers often have difficulty expressing themselves.","十来岁的孩子在表达思想方面常常有困难。"],["10% of teenagers spend time outside every day.","10%的青少年每天花时间到户外去。"]]},{"l":"g.r.ee.t/i.ng","p":"ˈɡ.r.iː.t/ɪ.ŋ","cn":"n. 问候；招呼","s":[["She waved a friendly greeting.","她友好地挥手致意。"],["He raised his hand in greeting.","他举手致意。"],["He raised a hand in greeting.","他扬起手表示问候。"]]},{"l":"g.r.a.d.e","p":"ɡ.r.eɪ.d.-","cn":"n. 年级","s":[["What grade are you hoping to get?","你希望得到什么样的成绩？"],["Ten beaches were graded as acceptable.","有十个沙滩属于可接受的那一类。"],["I flunked math in second grade.","我二年级时数学不及格。"]]},{"l":"e.n/er/g.y","p":"ˈe.n/ə/dʒ.i","cn":"n. 精力；活力","s":[["She's always full of energy.","她总是充满活力。"],["The whole of creation is made up of energy.","全宇宙是由能量构成的。"],["That USES up 1%, or close to 1%, of the world's energy.","它使用了1%或者接近1%的全世界的能源。"]]},{"l":"d.r.a/m.a","p":"ˈd.r.ɑː/m.ə","cn":"n. 戏；剧","s":[["Her drama teacher spotted her ability.","她的戏剧老师发现了她的才能。"],["What you need is a drama coach.","你需要的是一位戏剧指导。"],["He knew nothing of Greek drama.","他对希腊戏剧一无所知。"]]},{"l":"s.i.n/c.ere/l.y","p":"s.ɪ.n/ˈs.ɪə/l.i","cn":"adv. 真诚地；诚实地（只要求理解）","s":[["I sincerely believe that this is the right decision.","我由衷地认为这个决定是正确的。"],["\"Congratulations,\" he said sincerely.","“祝贺，”他真诚地说道。"],["I sincerely hope you will soon recover.","我诚恳地盼望你早日康复。"]]},{"l":"d.i/a/r.y","p":"ˈd.aɪ/ə/r.i","cn":"n. 日记；日记簿","s":[["We sneaked a look at her diary.","我们偷偷看了一眼她的日记。"],["She kept a diary for over twenty years.","她记了二十多年的日记。"],["The events were faithfully recorded in her diary.","这些事件在她的日记中如实地记录了下来。"]]},{"l":"p.r.o.j/e.c.t","p":"ˈp.r.ɒ.dʒ/e.k.t","cn":"n. 课题","s":[["They attach great importance to the project.","他们高度重视这个项目。"],["This project is designed to help homeless people.","这个项目旨在帮助无家可归的人。"],["The project is environmentally unsound.","这个工程会破坏环境。"]]},{"l":"p.o.s.t/er","p":"ˈp.əʊ.s.t/ə","cn":"n. 海报","s":[["The artwork for the poster was done by my sister.","该海报的图片是我妹妹制作的。"],["I had seen the poster for the jazz festival in Monterey.","我已经见到了蒙特雷爵士音乐节的海报。"],["This poster is offensive and degrades women.","这张海报冒失无礼，有辱女性尊严。"]]},{"l":"r.e/a/l.i.z.e","p":"ˈr.iː/ə/l.aɪ.z.-","cn":"v. 意识到","s":[["They realized the force of her argument.","他们领悟到了她那论据的威力。"],["I soon realized the mistake.","我很快意识到犯了错误。"],["I hope people realize I'm not a dingbat.","我希望人们意识到我不是个疯子。"]]},{"l":"l.u.ck/i/l.y","p":"ˈl.ʌ.k/ɪ/l.i","cn":"adv. 幸运地；幸好","s":[["Luckily, she isn't injured.","幸运的是，她没受伤。"],["Luckily, we both love football.","幸好我们俩都热爱足球。"],["Luckily, I am a good swimmer.","幸好我是个游泳好手。"]]},{"l":"j.u.s.t","p":"dʒ.ʌ.s.t","cn":"adv. 恰好","s":[["I've just finished Chapter 3.","我刚完成第3章。"],["Will you kids just behave!","孩子们，规矩点！"],["I'm just finishing my book.","眼下我正在完成我的一本书。"]]},{"l":"p.r.e.s/e.n/t.a/tion","p":"ˌp.r.e.z/ə.n/ˈt.eɪ/ʃən","cn":"n. 演示（只要求理解）","s":[["Bring file presentation to life by adding graphics.","添加图表使文件的展示变得生动起来。"],["I am making a multimedia presentation for my science project.","我正在为我的科学项目做多媒体演示。"],["A computer software glitch fouled up their presentation.","一个电脑软件故障弄砸了他们的展示会。"]]},{"l":"m.oo.d","p":"m.uː.d","cn":"n. 情绪；心情（只要求理解）","s":[["My mood gradually lightened.","我的心情渐渐好起来。"],["She was in a relaxed, confident mood.","她的心态从容而自信。"],["I was in a mood to celebrate.","我很想庆祝一番。"]]},{"l":"m.i.n.d","p":"m.aɪ.n.d","cn":"v. 介意","s":[["He has a closed mind.","他思想僵化守旧。"],["We, however, have the mind of Christ.","然而，我们有基督的心。"],["Don't expect others to read your mind.","不要期望别人能看出你的心思。"]]},{"l":"p.a.ck","p":"p.æ.k","cn":"v. （把……）打包","s":[["Then, I packed my schoolbag.","然后，我收拾了我的书包。"],["We packed away the summer clothes.","我们把夏装收藏起来了。"],["I carefully packed up the gifts.","我小心翼翼地把礼品包好。"]]},{"l":"c.e.l/e/b.r.a.t.e","p":"ˈs.e.l/ɪ/b.r.eɪ.t.-","cn":"v. 庆祝；庆贺","s":[["Let's celebrate and damn the expense!","管它花多少钱，咱们先庆祝一番再说！"],["They celebrated their silver wedding in May.","他们于五月份庆祝了银婚纪念日。"],["Mr. Stevens recently celebrated his eightieth birthday.","最近史蒂文斯先生庆祝了他80大寿。"]]},{"l":"s.u.c/c.e.ss","p":"s.ə.k/ˈs.e.s","cn":"n. 成功","s":[["Success is not guaranteed.","不保证一定能成功。"],["The book ensured his success.","这本书保证了他的成功。"],["Hard work is fundamental to success.","勤奋工作是成功的基础。"]]},{"l":"r.o.ck/y","p":"ˈr.ɒ.k/i","cn":"adj. 困难的","s":[["We walked along the rocky shoreline.","我们沿着岩石嶙嶙的海岸线散步。"],["The surrounding countryside is windswept and rocky.","这周围的乡村风多石头多。"],["The path continued over rough, rocky ground.","这条小路穿过了崎岖不平的石头地。"]]},{"l":"d.o th.e d.i.sh/e.s","p":"d.uː ð.ə ˈd.ɪ.ʃ/ɪ.z","cn":"洗碗","s":[["You must do the dishes.","你必须洗餐具。"],["The kids offered to do the dishes.","孩子们主动要求洗盘子。"],["You can say do the dishes or wash the dishes.","你可以说清洗餐具或者清洁餐具。"]]},{"l":"j.u/n.i/or h.igh s.ch.oo.l","p":"ˈdʒ.uː/n.i/ə h.aɪ s.k.uː.l","cn":"初级中学","s":[["He dropped out of junior high school.","他初中辍学了。"]]},{"l":"t.a.k.e p.ar.t i.n","p":"t.eɪ.k.- p.ɑː.t ɪ.n","cn":"参与","s":[["He had been taking part in an international symposium on population.","他那时在参加一个有关人口的国际研讨会。"],["During our first summer vacation, we took part in military training, which laster for 3 weeks.","在第一个暑假期间，我们参加了维期3周的军训。"]]},{"l":"l.oo.k f.or/w.ar.d t.o","p":"l.ʊ.k ˈf.ɔː/w.ə.d t.uː","cn":"期待；盼望","s":[["I look forward to hearing from you.","盼望着收到你的信。"],["The two sisters looked forward to their yearly meetings.","姐妹俩期盼着她们一年一度的会面。"],["I'm looking forward to seeing you perform.","我期待着看你演出。"]]},{"l":"d.ai/l.y l.i.f.e","p":"ˈd.eɪ/l.i l.aɪ.f.-","cn":"日常生活","s":[["Does such an attitudinal change reflect real experiences in daily life?","人生观的这种转变是否反映了日常生活中的真实经历？"]]},{"l":"g.o t.o b.e.d","p":"ɡ.əʊ t.uː b.e.d","cn":"去睡觉","s":[["I think it's time to go to bed.","我想该睡觉了。"],["You'd better go to bed and nurse that cold.","你最好上床睡觉，把感冒治好。"],["She was the last to go to bed.","她是最后一个睡觉的人。"]]},{"l":"g.e.t u.p","p":"ɡ.e.t ʌ.p","cn":"起床","s":[["I generally get up at six.","我一般六点钟起床。"],["Do you have difficulty getting up?","你起床有困难吗？"],["We've got to get up early, all right?","我们得早起床，可以吧？"]]},{"l":"o.n f.oo.t","p":"ɒ.n f.ʊ.t","cn":"步行","s":[["We took cablecar to the top, but went down the mountain on foot!","我们乘缆车上山顶，不过要徒步下山！"]]},{"l":"f.u.ll o.f e.n/er/g.y","p":"f.ʊ.l ə.v ˈe.n/ə/dʒ.i","cn":"充满活力","s":[["She's always full of energy.","她总是充满活力。"]]},{"l":"g.e.t r.ea.d/y f.or","p":"ɡ.e.t ˈr.e.d/i f.ɔː","cn":"准备好……","s":[]},{"l":"p.u.t o.n","p":"p.ʊ.t ɒ.n","cn":"举办；上演","s":[["She's just putting on her make-up.","她正在化妆呢。"],["Maximo put on a pair of glasses.","马克西莫戴上了一副眼镜。"],["She put on the brakes suddenly.","她突然踩了刹车。"]]},{"l":"c.l.ea.n u.p","p":"k.l.iː.n ʌ.p","cn":"打扫干净","s":[["Go clean up and wash up.","去清洁干净，洗干净。"],["Soccer needs to clean up its image.","足球界的形象需要改善。"],["Who's going to clean up this mess?","这么又脏又乱的，谁来清理？"]]},{"l":"p.i.ck u.p","p":"p.ɪ.k ʌ.p","cn":"取（某物）","s":[["Will you pick up all your toys?","把你的玩具都收起来好不好？"],["She bent down to pick up her glove.","她俯身去捡手套。"],["She bent forward to pick up the newspaper.","她弯腰去捡报纸。"]]}]},{"name":"Unit 3 The seasons","words":[{"l":"f.oo.t/p.r.i.n.t","p":"ˈf.ʊ.t/p.r.ɪ.n.t","cn":"n. 脚印；足迹","s":[["We all need to look for ways to reduce our carbon footprint.","我们都需要寻找减少我们碳足迹的办法。"],["The water-cooling scheme will reduce the system's carbon footprint by up to 85 percent.","水冷却方案将减少系统的碳足迹高达85%。"]]},{"l":"w.e.t","p":"w.e.t","cn":"adj. 潮湿的","s":[["Wet weather always depresses me.","阴雨天总使我心情抑郁。"],["We arrived home soaking wet.","我们回到家时，浑身湿淋淋的。"],["It was a grey, wet, April Sunday.","那是一个阴沉、潮湿、4月里的星期天。"]]},{"l":"d.ee.p","p":"d.iː.p","cn":"adj. 深的","s":[["The wardrobe was very deep.","橱柜很深。"],["She took a deep breath.","她深深地吸了一口气。"],["The firm ended up deep in debt.","这家公司最后债台高筑。"]]},{"l":"s.a.n.d/y","p":"ˈs.æ.n.d/i","cn":"adj. 铺满沙子的；含沙的","s":[["The sandy beach was in sight.","那片沙滩映入眼帘。"],["The bulk of the book concerns Sandy's two middle-aged children.","这本书的主要部分讲的是桑迪的两个中年孩子。"],["Sandy leaned across the table, his face uncomfortably close to Brad's.","桑迪将身体探过桌子，他的脸贴近布拉德的脸，使布拉德感觉很不自在。"]]},{"l":"k.i.ck","p":"k.ɪ.k","cn":"v. 踢；踹","s":[["This drink has quite a kick.","这酒的劲相当大。"],["The housing market needs a kick-start.","房产市场需要重振。"],["I got a kick out of seeing my name in print.","看到我的名字被印成铅字，我感到非常兴奋。"]]},{"l":"t.ow.n","p":"t.aʊ.n","cn":"n. 镇；市镇","s":[["I walked into town.","我走进了市中心。"],["The President hits town tomorrow.","总统明天到镇子上来。"],["I like that part of Cape Town.","我喜欢开普敦的那个地方。"]]},{"l":"f.ea/ture","p":"ˈf.iː/tʃə","cn":"n. 特色；特征","s":[["Features include caller ID and three-way calling.","功能包括来电显示和三方通话。"],["The house has many desirable features.","这栋房子有许多吸引人的特点。"],["The film features Cary Grant as a professor.","这部电影由卡里•格兰特饰演一位教授。"]]},{"l":"s.ou.th","p":"s.aʊ.θ","cn":"n. 南；南方","s":[["Our house faces south.","我们的房子面朝南。"],["They live on the south coast.","他们住在南海岸。"],["They've gone to live down south.","他们到南方去住了。"]]},{"l":"c.l.ear","p":"k.l.ɪə","cn":"adj. 晴朗的","s":[["It's time to clear up.","该打扫了。"],["His height gives him a clear advantage.","他的身高使他具有明显的优势。"],["He walked up Fifth Avenue to clear his head.","他在第五大街上走，让头脑清醒清醒。"]]},{"l":"l.ou.d/l.y","p":"ˈl.aʊ.d/l.i","cn":"adv. 喧闹地；响亮地","s":[["The shop bell jangled loudly.","商店的钟发出丁零当啷的巨大响声。"],["She fell over and swore loudly.","她摔倒了，大骂了一声。"],["She wiped her face and sniffed loudly.","她擦擦脸，大声地抽着鼻子。"]]},{"l":"th.u.n/d.er","p":"ˈθ.ʌ.n/d.ə","cn":"n. 雷","s":[["'Sit still!' she thundered.","“坐着别动！”她怒喝道。"],["Thunder grumbled in the distance.","远处雷声隆隆。"],["Thunder exploded overhead.","雷声在头顶上炸开。"]]},{"l":"l.igh.t/n.i.ng","p":"ˈl.aɪ.t/n.ɪ.ŋ","cn":"n. 闪电","s":[["Driving today demands lightning reflexes.","如今驾车需要飞快的反应。"],["He is a lightning rod for controversy.","他是个富有争议的人物."],["Another flash of lightning lit up the cave.","又一道闪电照亮了那个洞穴。"]]},{"l":"f.r.e.sh","p":"f.r.e.ʃ","cn":"adj. 新鲜的","s":[["Is this milk fresh?","这是鲜牛奶吗？"],["Fresh groups of guests arrived.","新客成批到达了。"],["Let's go out for some fresh air.","咱们出去呼吸点新鲜空气。"]]},{"l":"g.a.th/er","p":"ˈɡ.æ.ð/ə","cn":"v. 采集（植物、水果等）","s":[["People would gather from near and far.","人们会从四面八方聚起来。"],["She gathered up her belongings.","她收拾起她的私人物品。"],["You're self-employed, I gather.","我想你是个体经营吧。"]]},{"l":"p.ea.c.e/f.u.l","p":"ˈp.iː.s.-/f.ə.l","cn":"adj. 安静的；平静的","s":[["I endeavor to find some peaceful places.","我努力寻找一些宁静的地方。"],["I was amazingly light-hearted and peaceful.","我当时出奇地轻松和平静。"],["The aims of the organization are wholly peaceful.","这个组织的宗旨完全是追求和平。"]]},{"l":"s.n.a.k.e","p":"s.n.eɪ.k.-","cn":"n. 蛇","s":[["The snake slowly uncurled.","那条蛇慢慢地伸开了蜷缩的身子。"],["The snake slowly uncoiled.","蛇慢慢地展开了盘着的身体。"],["If cornered, the snake will defend itself.","蛇在被逼得走投无路时会自卫的。"]]},{"l":"th.r.ough","p":"θ.r.uː","cn":"prep. 自始至终；从头到尾","s":[["He walked through customs.","他步行通过了海关。"],["I climbed through the window.","我从窗口爬了出来。"],["Look through this glass, Gerda.","透过这镜子看吧，格尔达。"]]},{"l":"p.ar.t","p":"p.ɑː.t","cn":"n. 区域；地区","s":[["She's part French, part English.","她是英法血统各半。"],["Have you learned your part yet?","你记住你的台词了吗？"],["His mother always takes his part.","他母亲总是向着他。"]]},{"l":"ar/t.i/c.le","p":"ˈɑː/t.ɪ/k.l","cn":"n. 文章","s":[["Her article showed no charity towards her former friends.","她的文章对她以前的朋友毫不宽容。"],["The article is full of inaccuracies.","这篇文章里的错误比比皆是。"],["I faxed a first draft of this article to him.","我把这篇文章的初稿传真给他。"]]},{"l":"r.ea/s.o.n","p":"ˈr.iː/z.ə.n","cn":"n. 原因；理由","s":[["There is good reason to doubt this.","有正当理由怀疑这件事。"],["I don't follow your line of reasoning.","我不理解你的推理方法。"],["There are two reasons for this decision: firstly...","做此决定理由有二：第一…"]]},{"l":"a/l.i.v.e","p":"ə/ˈl.aɪ.v.-","cn":"adj. 有生气；有活力","s":[["He's still alive, isn't he?","他还活着，是吗？"],["She had to steal food just to stay alive.","她得偷食物才不至于饿死。"],["Assuming (that) he's still alive, how old would he be now?","假定他还活着，现在有多大年纪了？"]]},{"l":"s.a.n.d/c.a/s.t.le","p":"ˈs.æ.n.d/k.ɑː/s.-.l","cn":"n. 沙堡（只要求理解）","s":[]},{"l":"f.o.l/l.ow","p":"ˈf.ɒ.l/-.əʊ","cn":"v. 按……方式发展","s":[["Other problems may follow.","其它问题也许会随之而来。"],["If you lead, I'll follow.","你领头，我跟着。"],["Sorry—I don't quite follow.","对不起，我不太听懂你的话。"]]},{"l":"d.i/v.i.d.e","p":"d.ɪ/ˈv.aɪ.d.-","cn":"v. （使）分开","s":[["The pupil could add and subtract but hadn't learned to divide.","这名小学生能做加法和减法，但还没学会做除法。"],["How shall we divide up the work?","我们怎么分工呢？"],["Divide 2 into 7, and the answer is 3, remainder 1.","7除以2，商3余1。"]]},{"l":"d.e/c.i.d.e","p":"d.ɪ/ˈs.aɪ.d.-","cn":"v. 对……作出抉择；决定","s":[["It's up to you to decide.","这事由你来决定吧。"],["I've decided to grow my hair.","我已决定留长发。"],["She decided to pack in her job.","她决定辞职不干了。"]]},{"l":"c.r.o.p","p":"k.r.ɒ.p","cn":"n. 庄稼；作物（只要求理解）","s":[["The staple crop is rice.","主要农作物为水稻。"],["Cranberries are a major cash crop in New Jersey.","蔓越橘是新泽西州的一种主要经济作物。"],["Rice farmers here still plant and harvest their crops by hand.","这里的稻农仍然用手工种植和收割庄稼。"]]},{"l":"c.u.l/ture","p":"ˈk.ʌ.l/tʃə","cn":"n. 文化；文明","s":[["We are living in a consumer culture.","我们生活在一种消费文化之中。"],["A culture of failure exists in some schools.","在某些学校中存在着失败文化。"],["They learn Chinese kungfu and the Chinese culture.","他们学习中国功夫和中国文化。"]]},{"l":"l.o/c.a.l","p":"ˈl.əʊ/k.ə.l","cn":"adj. 地方的；当地的","s":[["Police suspect a local gang.","警方怀疑当地的一个不良帮派。"],["She's on the local council.","她是地方议会的议员。"],["Local businesses have agreed to contribute.","当地的公司已经同意捐助了。"]]},{"l":"t.r.a/d.i.tion","p":"t.r.ə/ˈd.ɪ.ʃən","cn":"n. 传统","s":[["This region is steeped in tradition.","这个地区有着深厚的传统。"],["The tradition could date back to 300 BC.","这一传统可追溯到公元前300年。"],["This tradition has no parallel in our culture.","这种传统在我们的文化中是没有的。"]]},{"l":"c.o.n/t.i.n/ue","p":"k.ə.n/ˈt.ɪ.n/juː","cn":"v. 持续；继续存在","s":[["The economy continues to grow.","经济持续增长。"],["The dollar continued to slide.","美元继续下跌。"],["The population continues to increase.", :"b.i.ll/i.o.n","p":"ˈb.ɪ.l/j.ə.n","cn":"num. 十亿（只要求理解）","s":[["The Galaxy consists of 100 billion stars.","银河系由1千亿颗恒星组成。"],["Worldwide sales reached 2.5 billion.","全球销售额达到了25亿。"],["The company posted a $1.1 billion loss.","这家公司公布了11亿元的亏损。"]]},{"l":"c.o.v/er","p":"ˈk.ʌ.v/ə","cn":"v. 盖；覆盖","s":[["Snow covered the ground.","大雪覆盖了大地。"],["Your boots are covered in mud.","你的靴子上都是泥。"],["Cover me while I move forward.","掩护我前进。"]]},{"l":"s.u/pp.or.t","p":"s.ə/ˈp.ɔː.t","cn":"v. 支持；维持","s":[["Support for the party continues to decline.","对该党的支持继续下降。"],["Lastly, I would like to thank my parents for all their support.","最后，我想感谢父母对我的全力支持。"],["Grouping is now supported.","现在是支持分组的。"]]},{"l":"a/r.e/a","p":"ˈeə/r.i/ə","cn":"n. 地区；地域","s":[["First of all we must identify the problem areas.","首先我们必须找出问题所在。"],["We rarely see someone go after the health area.","我们很少看到有人追求健康领域。"],["The area is largely uninhabited.","这个地区大部分是无人居住的。"]]},{"l":"f.r.ee.z/i.ng","p":"ˈf.r.iː.z/ɪ.ŋ","cn":"adj. 极冷的","s":[["It's absolutely freezing outside.","外面冷得不得了。"],["It's freezing cold outside.","外面极为寒冷。"],["It's 15 degrees below freezing.","温度是零下15度。"]]},{"l":"n.or.th","p":"n.ɔː.θ","cn":"n. 北；北方","s":[["The Yangtze river is a natural barrier to the north-east.","长江是东北方向的一道天然屏障。"],["I'll bet we could find some at North Creek—in the mine.","我打赌我们能在小溪北边的矿井里面找到一些。"],["It faced seawards to the north.","它面向北方，朝着海。"]]},{"l":"p.o.l.e","p":"p.əʊ.l.-","cn":"n. （行星的）极；地极","s":[["To them, as to all Poles, this is a holy place.","正如对所有的极地人一样，对他们来说，这里是个神圣的地方。"],["Like poles repel each other.","同极相斥。"],["Five members of Scott's expedition made it to the South Pole.","斯科特率领的探险队的五名成员一直来到了南极。"]]},{"l":"d.e.s/er.t","p":"ˈd.e.z/ə.t","cn":"n. 沙漠；荒漠","s":[["Mrs. Roding's husband deserted her years ago.","罗丁太太的丈夫数年前抛弃了她。"],["He deserted from his regiment.","他开小差逃离他所在的团。"],["The villages had been deserted.","这些村庄已经荒无人烟了。"]]},{"l":"m.e/t.re","p":"ˈm.iː/t.ə","cn":"n. 米","s":[["It's about 2 metres wide.","它大约2米宽。"],["It is almost 2 metres in height.","它差不多有2米高。"],["It is about a metre in length.","它大约有一米长。"]]},{"l":"r.ea.ch","p":"r.iː.tʃ","cn":"v. 足够达到","s":[["They reached port at last.","他们终于抵达港口。"],["Can you reach me down that box?","你帮我把那个盒子拿下来好吗？"],["Worldwide sales reached 2.5 billion.","全球销售额达到了25亿。"]]},{"l":"g.r.ai.n","p":"ɡ.r.eɪ.n","cn":"n. 谷粒（只要求理解）","s":[["Surplus grain is being sold for export.","过剩的谷物正销往国外。"],["Any shortage could push up grain prices.","任何短缺都会推动粮价上涨。"],["The soup was a mash of grain and vegetables.","那是用粮食和蔬菜做成的浓汤。"]]},{"l":"w.i.d.e","p":"w.aɪ.d.-","cn":"adj. 宽的；宽阔的","s":[["It's about 2 metres wide.","它大约2米宽。"],["The road is only one lane wide.","这条路只有一个车道那么宽。"],["That comparison isn't as wide of the mark as it seems.","那种比较不像看上去那么离谱。"]]},{"l":"wh.a.l.e","p":"w.eɪ.l.-","cn":"n. 鲸","s":[["A whale is a fish. True or false?","鲸鱼是鱼，对还是错？"],["The whale is a mammal.","鲸鱼是哺乳动物。"],["A whale is a kind of mammal.","鲸是一种哺乳动物。"]]},{"l":"b.u.t/t.er/f.l.y","p":"ˈb.ʌ.t/-.ə/f.l.aɪ","cn":"n. 蝴蝶","s":[["The butterfly fluttered from flower to flower.","蝴蝶在花丛中飞来飞去。"],["It is a very pretty butterfly, with a 2 inch wing span.","它是一只非常漂亮的蝴蝶，翅膀张开有2英寸宽。"],["The caterpillar will eventually metamorphose into a butterfly.","毛毛虫最终将蜕变成一只蝴蝶。"]]},{"l":"p.r.o/v.i.d.e","p":"p.r.ə/ˈv.aɪ.d.-","cn":"v. 提供；供应","s":[["They would not provide any details.","他们不肯提供任何细节。"],["Can you provide any proof of identity ?","你能提供什么身份证明吗？"],["The company will provide transportation.","这家公司将提供交通工具。"]]},{"l":"e.x/p.l.ore","p":"ɪ.ks/ˈp.l.ɔː","cn":"v. 探索","s":[["I just wanted to explore on my own.","我只是想独自考察一下。"],["We will explore every avenue until we find an answer.","我们要探索一切途径，直到找到答案为止。"],["She explored the sand with her toes.","她用脚趾感觉沙的情况。"]]},{"l":"d.i.s/a/pp.ear","p":"ˌd.ɪ.s/ə/ˈp.ɪə","cn":"v. 消失；不见","s":[["The sun disappeared from view.","太阳看不见了。"],["The boat disappeared from sight.","那艘船从视野中消失了。"],["The plane disappeared behind a cloud.","飞机消失在云层里。"]]},{"l":"p.l.a.s/t.i.c","p":"ˈp.l.æ.s/t.ɪ.k","cn":"n. 塑料","s":[["Do they take plastic?","他们收信用卡吗？"],["We can recycle plastic bottles.","我们可以回收塑胶瓶。"],["The pipes should be made of plastic.","这些管子应该是用塑料制作的。"]]},{"l":"p.o/ll.u/tion","p":"p.ə/ˈl.uː/ʃən","cn":"n. 污染","s":[["Pollution can harm marine life.","污染会危及海洋生物。"],["We need more laws to stop pollution.","我们需要制定更多法律来防止污染。"],["We are taking steps to prevent pollution.","我们正在采取措施防止污染。"]]},{"l":"p.r.o/t.e.c.t","p":"p.r.ə/ˈt.e.k.t","cn":"v. 保护","s":[["Concern to protect national sovereignty is far from new.","对捍卫国家主权的关注绝不是新话题。"],["The device was protected by patent.","这一装置受专利保护。"],["Women banded together to protect each other.","妇女们联合起来互相保护。"]]},{"l":"ch.e.m/i/c.a.l","p":"ˈk.e.m/ɪ/k.ə.l","cn":"n. 化学制品；化学品（只要求理解）","s":[["Chemical weapons are banned internationally.","国际上禁止使用化学武器。"],["What's the chemical symbol for mercury?","水银的化学符号是什么？"],["What is the chemical symbol for copper?","铜的化学符号是什么？"]]},{"l":"g.r.ou.n.d/w.a/t.er","p":"ˈɡ.r.aʊ.n.d/w.ɔː/t.ə","cn":"n. 地下水","s":[]},{"l":"b.ur.n","p":"b.ɜː.n","cn":"v. 燃烧；烧","s":[["His face burned with shame.","他的脸因羞愧而发烫。"],["The candle had burned right down.","这支蜡烛已全烧完了。"],["Turn the heat down or it'll burn.","把炉火开小一些，不然就烧焦了。"]]},{"l":"oi.l","p":"ɔɪ.l","cn":"n. 石油；原油","s":[["Oil increased in price.","石油价格上涨了。"],["The price of oil increased.","石油价格上涨了。"],["Palm oil is environment-friendly.","棕榈油对环境无害。"]]},{"l":"g.a.s","p":"ɡ.æ.s","cn":"n. 天然气","s":[["Air is a mixture of gases.","空气为混合气体。"],["The device draws gas along the pipe.","这装置将气体顺着管子抽出来。"],["The house has gas-fired central heating.","这所房子有燃气中央供暖系统。"]]},{"l":"h.ar.m/f.u.l","p":"ˈh.ɑː.m/f.ə.l","cn":"adj. 有害的","s":[["The natural enzyme is harmful to humans and animals.","天然酶对人和动物都是有害的。"],["Tears help to protect the eye from potentially harmful foreign bodies.","眼泪有助于保护眼睛去除可能有害的异物。"],["Continuous exposure to sound above 80 decibels could be harmful.","持续曝露于超过80分贝的声音可能有害。"]]},{"l":"w.e.b/s.i.t.e","p":"ˈw.e.b/s.aɪ.t.-","cn":"n. 网站","s":[["I found this information on their website.","我在他们的网站上发现了这一信 enerations.","该剧表现了3代人之间的冲突。"]]},{"l":"s.o/l.ar s.y.s/t.e.m","p":"ˈs.əʊ/l.ə ˈs.ɪ.s/t.ə.m","cn":"太阳系","s":[["The picture shows six of the nine planets in the solar system.","这张图片展示太阳系9个行星中的6个行星。"],["Saturn is the second biggest planet in the solar system.","土星是太阳系的第二大的行星。"],["The spacecraft will enable scientists to study some dark corners of the solar system.","太空船使得科学家可以研究太阳系中一些不为人知的角落。"]]},{"l":"f.a.c.t f.i.l.e","p":"f.æ.k.t f.aɪ.l.-","cn":"事实档案","s":[]},{"l":"b.e c.o.v/er.e.d b.y","p":"b.i ˈk.ʌ.v/ə.-.d b.aɪ","cn":"被……覆盖","s":[]},{"l":"a.s f.ar a.s w.e k.n.ow","p":"æ.z f.ɑː æ.z w.iː -.n.əʊ","cn":"据我们所知","s":[]},{"l":"s.ea l.e.v/e.l","p":"s.iː ˈl.e.v/ə.l","cn":"海平面","s":[["The whole place is at sea level.","整个地区与海平面持平。"]]},{"l":"wh.a.t.'s m.ore","p":"w.ɒ.t.s m.ɔː","cn":"更重要的是","s":[]},{"l":"p.r.o/v.i.d.e w.i.th","p":"p.r.ə/ˈv.aɪ.d.- w.ɪ.ð","cn":"提供；供应；给予","s":[]},{"l":"t.a.k.e c.are o.f","p":"t.eɪ.k.- k.eə ə.v","cn":"照顾；照料","s":[["See that you take care of him.","你一定要好好照顾他。"],["We need to take care of our bodies.","我们需要照顾好自己的身体。"],["He's old enough to take care of himself.","他已经不小了，能照顾自己了。"]]},{"l":"p.l.a.s/t.i.c p.o/ll.u/tion","p":"ˈp.l.æ.s/t.ɪ.k p.ə/ˈl.uː/ʃən","cn":"塑料污染","s":[]},{"l":"c.u.t d.ow.n","p":"k.ʌ.t d.aʊ.n","cn":"砍倒","s":[["You need to cut down on starches.","你有必要少吃些含淀粉的东西。"],["We're trying to cut down on the amount of paperwork involved.","我们正在努力降低有关此事的文书工作量。"],["The remaining section of woodland is cut down to ground level.","林地的剩余部分被砍光了。"]]},{"l":"h.u.n/d.r.e.d.s o.f","p":"ˈh.ʌ.n/d.r.ə.d.z ə.v","cn":"数以百计","s":[["There are hundreds of people desperate to adopt a child.","有数以百计的人极其渴望收养小孩。"],["Hundreds of people packed into the mosque.","成百上千的人挤进了清真寺。"],["Hundreds of tractors will converge on the capital.","成百上千的拖拉机将向首都聚集。"]]},{"l":"b.l.ow a/w.ay","p":"b.l.əʊ ə/ˈw.eɪ","cn":"吹走","s":[["California could dry up and blow away.","加利福尼亚会干涸掉，然后随风而去。"]]}]},{"name":"Unit 5 Off to space","words":[{"l":"s.p.a.c.e/s.ui.t","p":"ˈs.p.eɪ.s.-/s.uː.t","cn":"n. 航天服；宇航服
