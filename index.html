// 把「字母拆分」和「音标拆分」解析成音节列表；结构对不上时返回错误
function parseSplit(l, p) {
  const split3 = s => s.trim().split(/\s+/).map(w => w.split('/').map(x => x.split('.')));
  const L = split3(l), P = split3(p);
  if (L.length !== P.length) return {error: '单词数和音标对不上'};
  const syls = [];
  for (let wi = 0; wi < L.length; wi++) {
    if (L[wi].length !== P[wi].length) return {error: `第 ${wi + 1} 个词的音节数和音标对不上`};
    for (let si = 0; si < L[wi].length; si++) {
      const ls = L[wi][si], ps = P[wi][si];
      if (ls.length !== ps.length) return {error: `「${ls.join('')}」有 ${ls.length} 个字母组合，音标却是 ${ps.length} 个`};
      if (ls.some(x => !x) || ps.some(x => !x)) return {error: '有空的字母组合或音标（检查是不是连着写了两个点）'};
      syls.push({wi, t: ls.join(''), chunks: ls.map((x, i) => ({l: x, p: ps[i]}))});
    }
  }
  return {syls};
}
function getLP(item) { return S.custom[keyOf(item)] || {l: item.l, p: item.p}; }
function sylsOf(item) {
  const lp = getLP(item);
  const r = parseSplit(lp.l, lp.p);
  return r.error ? parseSplit(item.l, item.p).syls : r.syls; // 自定义拆分坏了就用默认
}
// 整词音标，例如 /ˈklɑːsruːm/
function fullIpa(syls) {
  const words = [];
  syls.forEach(s => { words[s.wi] = (words[s.wi] || '') + s.chunks.map(c => c.p === '-' ? '' : c.p).join(''); });
  return '/' + words.join(' ') + '/';
}

function unitWords(unit) {
  const book = BOOKS[S.book];
  if (unit === 'wrong') return Object.values(S.wrong).map(x => x.item);
  if (unit === 'all') return book.units.flatMap(u => u.words);
  return (book.units[unit] || book.units[0]).words;
}
function buildQueue(keepIdx) {
  if (S.unit !== 'all' && S.unit !== 'wrong' && !BOOKS[S.book].units[S.unit]) S.unit = 0;
  const list = unitWords(S.unit).slice();
  if (S.shuffle) for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [list[i], list[j]] = [list[j], list[i]]; }
  queue = list;
  results = [];
  finished = false;
  if (!keepIdx || S.idx >= queue.length) S.idx = 0;
}
function prepWord() {
  const item = queue[S.idx];
  if (!item) { W = null; return; }
  const syls = sylsOf(item);
  const req = [];
  syls.forEach((s, si) => [...s.t].forEach((ch, ci) => { if (/[a-z]/i.test(ch)) req.push({si, ci, ch}); }));
  const text = syls.reduce((acc, s, i) => acc + (i && s.wi !== syls[i - 1].wi ? ' ' : '') + s.t, '');
  W = {item, text, syls, ipa: fullIpa(syls), req, pos: 0, err: 0, hadError: false, hint: -1, done: false, ok: false, wrongFlash: null, token: {}};
}

/* ================= 声音 ================= */
let curAudio = null;
function stopAudio() {
  if (curAudio) { curAudio.onerror = null; curAudio.pause(); curAudio = null; }
  try { speechSynthesis.cancel(); } catch (e) {}
}
// 全大写的缩写（TV、PE、US）按字母读
function audioText(text) {
  return text.split(/\s+/).map(t => /^[A-Z]{2,}$/.test(t) ? t.split('').join(' ') : t).join(' ');
}
function spokenSyl(t) {
  if (/^[A-Z]$/.test(t)) return t;
  return t.replace(/[^a-zA-Z]/g, '').toLowerCase();
}
function pickVoice(lang) {
  const vs = speechSynthesis.getVoices();
  return vs.find(v => v.lang === lang) || vs.find(v => v.lang.replace('_', '-').startsWith(lang)) || vs.find(v => /^en/i.test(v.lang));
}
function ttsP(text, rate = 0.85) {
  return new Promise(res => {
    if (!('speechSynthesis' in window) || !text) { setTimeout(res, 400); return; }
    let d = false;
    const fin = () => { if (!d) { d = true; res(); } };
    const lang = S.accent === 'uk' ? 'en-GB' : 'en-US';
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    const v = pickVoice(lang);
    if (v) u.voice = v;
    u.rate = rate;
    u.onend = fin;
    u.onerror = fin;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
    setTimeout(fin, 900 + text.length * 260);
  });
}
// 优先用有道词典真人发音（需联网），失败时退回浏览器朗读；单词和例句都用它
function playText(raw) {
  stopAudio();
  const text = audioText(raw);
  return new Promise(res => {
    let done = false, fbUsed = false, started = false;
    const fin = () => { if (!done) { done = true; res(); } };
    const fallback = () => { if (fbUsed || done) return; fbUsed = true; ttsP(text).then(fin); };
    if (!navigator.onLine) { fallback(); return; }
    const a = new Audio('https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(text) + '&type=' + (S.accent === 'uk' ? 1 : 2));
    curAudio = a;
    a.onplaying = () => { started = true; };
    a.onended = fin;
    a.onerror = () => { started ? fin() : fallback(); };
    a.play().catch(() => { if (!started) fallback(); });
    setTimeout(fin, Math.max(4000, text.length * 120));
  });
}
const playWord = () => W && playText(W.text);

let actx = null;
function beep(freq, dur, type = 'sine', vol = 0.06, delay = 0) {
  if (!S.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = actx.currentTime + delay;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t0); o.stop(t0 + dur);
  } catch (e) {}
}

/* ================= 渲染 ================= */
function fontFor(text) {
  const len = text.length;
  const px = Math.max(34, Math.min(130, 1100 / (len + 2)));
  const vw = Math.max(7, Math.min(15, 180 / (len + 2)));
  return `font-size:min(${px}px,${vw}vw)`;
}
function sylGroups() {
  const g = [];
  W.syls.forEach((s, si) => { (g[s.wi] = g[s.wi] || []).push({...s, si}); });

}

// 例句里把当前单词（含 -s、-ed 等变形）标黄
function highlight(en, word) {
  const w = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '\\s+');
  const m = en.match(new RegExp('(^|[^A-Za-z])(' + w + '[a-z]*)', 'i'));
  if (!m) return esc(en);
  const i = m.index + m[1].length;
  return esc(en.slice(0, i)) + '<mark>' + esc(m[2]) + '</mark>' + esc(en.slice(i + m[2].length));
}

    <div class="cn">${esc(W.item.cn)}</div>
    ${S.showSent ? sentencesHtml(3) : ''}
    <div class="sub">字母下面是它的读音${hasSilent ? '，淡色字母不发音' : ''} · 点某一节可以单独听 · <a href="#" id="bEdit">拆得不对？改一下</a></div>`;
  $('#bPlay').onclick = playWord;
  $('#bRead').onclick = readBySyllable;
  $('#bEdit').onclick = e => { e.preventDefault(); editSplit(W.item); };
  bindSentences();
  main.querySelectorAll('.syl').forEach(el => el.onclick = () => {
    const i = +el.dataset.i;
    stopAudio();
    el.classList.add('speak');
    ttsP(spokenSyl(W.syls[i].t), 0.7).then(() => el.classList.remove('speak'));
  });
}
async function readBySyllable() {
  if (!W) return;
  const tok = W.token;
  stopAudio();
  const els = [...main.querySelectorAll('.syl')];
  for (let i = 0; i < W.syls.length; i++) {
    if (W.token !== tok) return;
    els.forEach(e => e.classList.toggle('speak', +e.dataset.i === i));
    await ttsP(spokenSyl(W.syls[i].t), 0.7);
    await sleep(150);
  }
  if (W.token !== tok) return;
  els.forEach(e => e.classList.remove('speak'));
  const row = $('#wrow');
  row && row.classList.add('speakall');
  await playWord();
  row && row.classList.remove('speakall');
}
function renderTyping(shake) {
  const reqIdx = {};
  W.req.forEach((r, i) => { reqIdx[r.si + ':' + r.ci] = i; });
  const activeSi = W.done ? -1 : (W.req[W.pos] || {}).si;
  const row = sylGroups().map(g => '<div class="wgroup">' + g.map((s, j) => {
    const chars = [...s.t].map((ch, ci) => {
      const r = reqIdx[s.si + ':' + ci];
      let cls, shown = ch;
      if (r === undefined) cls = 'punct';
      else if (W.done || r < W.pos) cls = 'done';
      else {
        cls = (S.mode === 'follow' || W.hint === s.si) ? 'ghost' : 'hidden';
        if (W.wrongFlash && W.wrongFlash.r === r) { cls = 'wrong'; shown = W.wrongFlash.key; }
        if (r === W.pos) cls += ' cur';
      }
      return `<span class="ch ${cls}">${esc(shown)}</span>`;
    }).join('');
    const full = W.done || (activeSi !== undefined && s.si < activeSi);
    return (j ? '<span class="tsep">/</span>' : '')
      + `<span class="slot ${s.si === activeSi ? 'active' : ''} ${full ? 'full' : ''}" style="--c:${color(s.si)}"><span class="chars">${chars}</span><span class="ul"></span></span>`;
  }).join('') + '</div>').join('');
  let status = '<div class="status"></div>';
  if (W.done) status = W.ok ? '<div class="status ok">✓ 全对，真棒！</div>' : '<div class="status bad">记到错词本了，下次再练 · 按 Enter 继续</div>';
  else if (W.hint >= 0) status = '<div class="status">提示：照着淡色字母拼</div>';
  const showIpa = S.mode === 'follow' || W.done; // 听写时音标会提示拼写，拼完再显示
  main.innerHTML = `
    <div class="wordrow ${W.done && W.ok ? 'win' : ''}" id="wrow" style="${fontFor(W.text)}">${row}</div>
    ${showIpa ? `<div class="ipa">${esc(W.ipa)}</div>` : ''}
    <div class="cn">${esc(W.item.cn)}</div>
    ${status}
    <div class="ctrls">
      <button class="pill" id="bPlay">🔊 重听</button>
      <button class="pill" id="bHint">💡 提示</button>
      <button class="pill" id="bShow">👀 看答案</button>
      ${W.done ? '<button class="pill pri" id="bGo">下一个 →</button>' : ''}
    </div>
    ${W.done && !W.ok && S.showSent ? sentencesHtml(1) : ''}
    ${isTouch && !W.done ? '<div class="tapkb">点这里打开键盘</div>' : ''}`;
  $('#bPlay').onclick = () => { playWord(); focusKb(); };
  $('#bHint').onclick = () => { hint(); focusKb(); };
  $('#bShow').onclick = () => { reveal(); focusKb(); };
  if (W.done) $('#bGo').onclick = next;
  bindSentences();
  if (shake) { const el = main.querySelector('.slot.active'); el && el.classList.add('shake'); }
}
function renderSummary() {
  if (S.mode === 'learn') {
    main.innerHTML = `<div class="sum"><h2>这一组看完啦 🎉</h2>
      <p>共 ${queue.length} 个单词。接下来动手拼一拼吧。</p>
      <div class="sumbtns">
        <button class="pill pri" data-a="follow">去跟写</button>
        <button class="pill" data-a="dictation">去听写</button>
        <button class="pill" data-a="again">再看一遍</button>
      </div></div>`;
  } else {
    const ok = results.filter(r => r.ok).length;
    const bad = results.filter(r => !r.ok);
    const hasNext = typeof S.unit === 'number' && S.unit < BOOKS[S.book].units.length - 1;
    main.innerHTML = `<div class="sum"><h2>${bad.length ? '练完一组 💪' : '全部一次拼对 🎉'}</h2>
      <p>${MODES[S.mode]} ${results.length} 个，一次拼对 ${ok} 个${bad.length ? `，下面 ${bad.length} 个要再练练` : ''}</p>
      ${bad.length ? '<div class="chips">' + bad.map(r => `<span class="chip">${esc(plain(r.item.l))}<small>${esc(r.item.cn)}</small></span>`).join('') + '</div>' : ''}
      <div class="sumbtns">
        ${bad.length ? '<button class="pill pri" data-a="redo">只练这几个</button>' : ''}
        ${S.mode === 'follow' ? `<button class="pill ${bad.length ? '' : 'pri'}" data-a="dictation">去听写</button>` : ''}
        <button class="pill" data-a="again">整组再来</button>
        ${hasNext ? '<button class="pill" data-a="nextunit">下一单元</button>' : ''}
      </div></div>`;
  }
  main.querySelectorAll('[data-a]').forEach(b => b.onclick = () => summaryAction(b.dataset.a));
}
function summaryAction(a) {
  if (a === 'follow' || a === 'dictation') { setMode(a); return; }
  if (a === 'again') { buildQueue(false); enterWord(); return; }
  if (a === 'nextunit') { S.unit = S.unit + 1; buildQueue(false); enterWord(); return; }
  if (a === 'redo') {
    queue = results.filter(r => !r.ok).map(r => r.item);
    results = []; finished = false; S.idx = 0;
    enterWord();
  }
}

/* ================= 流程 ================= */
function enterWord() {
  stopAudio();
  finished = false;
  prepWord();
  save();
  render();
  if (!W) return;
  if (S.mode === 'dictation' || S.autoPlay) setTimeout(() => { if (W && !W.done) playWord(); }, 250);
  focusKb();
}
function next() {
  if (!queue.length) return;
  if (S.idx < queue.length - 1) { S.idx++; enterWord(); }
  else { finished = true; W = null; stopAudio(); save(); render(); }
}
function prev() {
  if (!queue.length) return;
  if (finished) { finished = false; enterWord(); return; }
  if (S.idx > 0) { S.idx--; enterWord(); }
}
function setMode(m) {
  S.mode = m;
  if (finished) S.idx = 0;
  results = [];
  enterWord();
}
function focusKb() {
  if (S.mode !== 'learn' && !finished && W && !W.done) { try { kb.focus({preventScroll: true}); } catch (e) {} }
}
function onLetter(k) {
  if (finished || S.mode === 'learn' || !W || W.done) return;
  const need = W.req[W.pos];
  if (!need) return;
  if (k.toLowerCase() === need.ch.toLowerCase()) {
    W.pos++; W.err = 0; W.wrongFlash = null;
    const nextReq = W.req[W.pos];
    if (!nextReq) { complete(); return; }
    if (S.sylSpeak && nextReq.si !== need.si) ttsP(spokenSyl(W.syls[need.si].t), 0.8); // 拼完一节读一节
    renderTyping();
  } else {
    W.err++; W.hadError = true;
    W.wrongFlash = {r: W.pos, key: k};
    if (W.err >= 2) W.hint = need.si;
    beep(170, 0.15, 'square', 0.035);
    renderTyping(true);
    const tok = W.token;
    clearTimeout(onLetter.t);
    onLetter.t = setTimeout(() => { if (W && W.token === tok && W.wrongFlash) { W.wrongFlash = null; renderTyping(); } }, 400);
  }
}
function complete() {
  W.done = true;
  W.ok = !W.hadError;
  W.wrongFlash = null;
  results.push({item: W.item, ok: W.ok});
  const key = keyOf(W.item);
  if (!W.ok) {
    const e = S.wrong[key] || {item: W.item, count: 0};
    e.item = W.item;
    e.count++;
    S.wrong[key] = e;
  } else if (S.unit === 'wrong') {
    delete S.wrong[key];
  }
  save();
  renderHeader();
  renderTyping();
  if (W.ok) { beep(660, 0.12, 'sine', 0.05); beep(990, 0.18, 'sine', 0.05, 0.1); }
  const tok = W.token;
  setTimeout(() => { if (W && W.token === tok) playWord(); }, W.ok ? 250 : 0);
  if (W.ok) setTimeout(() => { if (W && W.token === tok) next(); }, 1300); // 拼错的停下来等 Enter
}
function hint() {
  if (!W || W.done || S.mode === 'learn') return;
  W.hint = W.req[W.pos].si;
  W.hadError = true;
  renderTyping();
}
function reveal() {
  if (!W || W.done || S.mode === 'learn') return;
  W.hadError = true;
  W.pos = W.req.length;
  complete();
}

/* ================= 弹窗 ================= */
function openModal(html) { $('#box').innerHTML = html; $('#modal').classList.add('on'); }
function closeModal() { $('#modal').classList.remove('on'); focusKb(); }
$('#modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };

function editSplit(item) {
  const cur = getLP(item);
  const v = prompt(
    '格式：字母拆分 | 音标拆分\n' +
    '. 分隔字母组合，/ 分隔音节，空格分隔单词；音标和字母组合一一对应，- 表示不发音\n' +
    '例：c.l.a.ss/r.oo.m | ˈk.l.ɑː.s/r.uː.m\n清空后确定 = 恢复默认',
    cur.l + ' | ' + cur.p);
  if (v === null) return;
  const key = keyOf(item);
  if (!v.trim()) {
    delete S.custom[key];
  } else {
    const [l, p] = v.split('|').map(x => (x || '').trim());
    if (!l || !p) { alert('要同时写字母拆分和音标拆分，中间用 | 隔开。没有保存。'); return; }
    if (plain(l).toLowerCase() !== key) { alert('字母和原单词对不上，没有保存。\n原单词：' + plain(item.l)); return; }
    const r = parseSplit(l, p);
    if (r.error) { alert(r.error + '。没有保存。'); return; }
    S.custom[key] = {l: l.replace(/\s+/g, ' '), p: p.replace(/\s+/g, ' ')};
  }
  save();
  if (W && keyOf(W.item) === key) { prepWord(); render(); }
  if ($('#modal').classList.contains('on')) showList();
}
function splitHtml(item) {
  const syls = sylsOf(item);
  let html = '';
  syls.forEach((s, si) => {
    if (si) html += s.wi !== syls[si - 1].wi ? '&nbsp;&nbsp;' : '<span class="x">/</span>';
    html += `<span style="color:${color(si)}">` + s.chunks.map(c => c.p === '-' ? `<span class="d">${esc(c.l)}</span>` : esc(c.l)).join('') + '</span>';
  });
  return {html, ipa: fullIpa(syls)};
}
function showList() {
  const list = unitWords(S.unit);
  const title = S.unit === 'wrong' ? '错词本' : $('#unitLabel').textContent;
  openModal(`<h3>${esc(title)} · ${list.length} 个</h3>
    ${list.length ? '' : '<p class="sub">还没有单词</p>'}
    <table class="wl">${list.map((w, i) => {
      const sp = splitHtml(w);
      const wr = S.wrong[keyOf(w)];
      return `<tr>
        <td>${i + 1}</td>
        <td class="split" data-go="${i}">${sp.html}</td>
        <td class="pp">${esc(sp.ipa)}</td>
        <td>${esc(w.cn)}${S.unit === 'wrong' && wr ? ` <span class="sub">错 ${wr.count} 次</span>` : ''}</td>
        <td style="text-align:right;white-space:nowrap"><button class="pill" data-edit="${i}">改拆分</button></td>
      </tr>`;
    }).join('')}</table>
    <p class="sub">点单词跳过去练习 · 淡色字母不发音</p>`);
  $('#box').querySelectorAll('[data-go]').forEach(td => td.onclick = () => {
    const w = list[+td.dataset.go];
    const i = queue.findIndex(q => keyOf(q) === keyOf(w));
    if (i < 0) return;
    S.idx = i;
    closeModal();
    enterWord();
  });
  $('#box').querySelectorAll('[data-edit]').forEach(b => b.onclick = () => editSplit(list[+b.dataset.edit]));
}
function showSettings() {
  const chk = (k, label) => `<div class="row"><label><input type="checkbox" data-k="${k}" ${S[k] ? 'checked' : ''}>${label}</label></div>`;
  openModal(`<h3>设置</h3>
    <div class="row"><span>发音</span><span>
      <label style="display:inline-flex;gap:4px;margin-right:12px"><input type="radio" name="acc" value="uk" ${S.accent === 'uk' ? 'checked' : ''}>英式（和课本一致）</label>
      <label style="display:inline-flex;gap:4px"><input type="radio" name="acc" value="us" ${S.accent === 'us' ? 'checked' : ''}>美式</label></span></div>
    ${chk('autoPlay', '切换单词时自动发音（听写模式总是自动发音）')}
    ${chk('sylSpeak', '跟写、听写时，拼完一节读一节')}
    ${chk('showSent', '显示例句')}
    ${chk('sound', '对错提示音')}
    ${chk('shuffle', '打乱顺序')}
    <div class="row"><span>错词本 ${Object.keys(S.wrong).length} 个</span><button class="pill" id="bClrWrong">清空错词本</button></div>
    <div class="row"><span>改过的拆分 ${Object.keys(S.custom).length} 个</span><button class="pill" id="bClrSplit">全部恢复默认</button></div>
    <p class="sub">记录保存在这台电脑的浏览器里。发音优先用有道词典真人发音（要联网），没网时用浏览器自带朗读。音标是英式的，切到美式发音音标不变。</p>`);
  $('#box').querySelectorAll('[data-k]').forEach(c => c.onchange = () => {
    S[c.dataset.k] = c.checked; save();
    if (c.dataset.k === 'shuffle') { buildQueue(false); enterWord(); }
    else if (c.dataset.k === 'showSent') render();
  });
  $('#box').querySelectorAll('[name=acc]').forEach(r => r.onchange = () => { S.accent = r.value; save(); });
  $('#bClrWrong').onclick = () => { if (confirm('确定清空错词本？')) { S.wrong = {}; save(); if (S.unit === 'wrong') { buildQueue(false); enterWord(); } else renderHeader(); showSettings(); } };
  $('#bClrSplit').onclick = () => { if (confirm('把改过的拆分全部恢复默认？')) { S.custom = {}; save(); prepWord(); render(); showSettings(); } };
}

/* ================= 事件 ================= */
$('#tabs').onclick = e => { const b = e.target.closest('.tab'); if (b && b.dataset.m !== S.mode) setMode(b.dataset.m); };
$('#selBook').onchange = e => { S.book = e.target.value; if (S.unit !== 'wrong') S.unit = 0; buildQueue(false); enterWord(); e.target.blur(); };
$('#selUnit').onchange = e => { const v = e.target.value; S.unit = (v === 'all' || v === 'wrong') ? v : +v; buildQueue(false); enterWord(); e.target.blur(); };
$('#bList').onclick = showList;
$('#bSet').onclick = showSettings;
$('#bPrev').onclick = prev;
$('#bNext').onclick = next;
main.addEventListener('click', e => { if (!e.target.closest('button,a,.sents')) focusKb(); });

document.addEventListener('keydown', e => {
  if ($('#modal').classList.contains('on')) { if (e.key === 'Escape') closeModal(); return; }
  if (e.target.tagName === 'SELECT' || (e.target.tagName === 'INPUT' && e.target !== kb)) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (k === 'Process' || e.keyCode === 229) return; // 手机软键盘，交给 input 事件
  if (finished) {
    if (k === 'Enter') { e.preventDefault(); const b = main.querySelector('.pill.pri') || main.querySelector('[data-a]'); b && b.click(); }
    else if (k === 'ArrowLeft') { e.preventDefault(); prev(); }
    return;
  }
  if (k === 'ArrowRight') { e.preventDefault(); next(); return; }
  if (k === 'ArrowLeft') { e.preventDefault(); prev(); return; }
  if (!W) return;
  if (S.mode === 'learn') {
    if (k === ' ') { e.preventDefault(); playWord(); }
    else if (k === 'Enter') { e.preventDefault(); next(); }
    else if (k === 'r' || k === 'R') { e.preventDefault(); readBySyllable(); }
    return;
  }
  if (k === ' ') { e.preventDefault(); playWord(); return; }
  if (k === 'Tab') { e.preventDefault(); hint(); return; }
  if (k === 'Escape') { e.preventDefault(); reveal(); return; }
  if (k === 'Enter') { e.preventDefault(); if (W.done) next(); return; }
  if (/^[a-zA-Z]$/.test(k)) { e.preventDefault(); onLetter(k); }
});

// 手机软键盘：keydown 拿不到字母，从隐藏输入框读
function flushKb() {
  const v = kb.value;
  kb.value = '';
  for (const ch of v) if (/[a-zA-Z]/.test(ch)) onLetter(ch);
}
kb.addEventListener('input', e => { if (!e.isComposing) flushKb(); });
kb.addEventListener('compositionend', flushKb);
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};

/* ================= 启动 ================= */
buildQueue(true);
enterWord();
</script>
</body>
</html>
