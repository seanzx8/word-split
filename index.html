r is more buoyant than fresh water.","盐水比淡水浮力大。"]]},{"l":"b.r.ai.n","p":"b.r.eɪ.n","cn":"n. 脑","s":[["Alcohol acts quickly on the brain.","酒精对大脑迅速产生影响。"],["He has sex on the brain.","他脑子里想的全是性。"],["The test records the electrical activity of the brain.","这个测试显示出大脑的电流活动。"]]},{"l":"f.i.x","p":"f.ɪ.ks","cn":"v. 修理","s":[["I'll fix a meeting.","我要安排一次会议。"],["He cannot fix the electricity.","他不会修理电路。"],["Don't worry—I'll fix him.","别担忧—我会收拾他的。"]]},{"l":"p.u/b.l.i.c","p":"ˈp.ʌ/b.l.ɪ.k","cn":"adj. 公共的；公开的","s":[["They announced cuts in public spending.","他们宣布缩减公共开支。"],["It is not a public holiday.","它不是公共假日。"],["New Year's Day is a public holiday.","元旦节是公众假期。"]]},{"l":"p.o.p/u/l.a/tion","p":"ˌp.ɒ.p/ju/ˈl.eɪ/ʃn","cn":"n. 人口","s":[["The population continues to increase.","人口持续增长。"],["Muslims make up 55% of the population.","穆斯林占人口的55%。"],["The bulk of the population lives in cities.","大多数人口居住在城市里。"]]},{"l":"a/g.r.i/c.u.l/ture","p":"ˈæ/ɡ.r.ɪ/k.ʌ.l/tʃə","cn":"n. 农业","s":[["He forced the country to collectivize agriculture.","他强迫国家将农业集体化。"],["If industrial agriculture is to be replaced, what is a viable alternative?","如果工业化农业要被取代，那么可行的替代方案是什么呢？"],["The conditions were unfavourable for agriculture.","这些条件不利于农业。"]]},{"l":"t.r.a.d.e","p":"t.r.eɪ.d.-","cn":"n. 贸易；买卖","s":[["Kids used to trade baseball cards.","孩子们过去常互相交换棒球卡片。"],["They traded as 'Walker and Son'.","他们以“沃克父子公司”之名营业。"],["The firm openly traded in arms.","这家公司公开买卖军火。"]]},{"l":"i.n/d.u.s/t.r.y","p":"ˈɪ.n/d.ə.s/t.r.i","cn":"n. 工业；生产制造","s":[["The movie is a camp celebration of the fashion industry.","这部电影夸张地颂扬时装行业。"],["The industry is strictly regulated.","这个行业有严格的管理。"],["The industry has slid into decline.","这个行业已成衰退之势。"]]},{"l":"r.o.l.e","p":"r.əʊ.l.-","cn":"n. 作用","s":[["He's a natural for the role.","他是这个角色的最佳人选。"],["Role-play is helpful in developing communication skills.","角色扮演有助于提高沟通技巧。"],["She refused to take on the traditional woman's role.","她拒绝承担传统妇女的角色。"]]},{"l":"g.oo.d.s","p":"ɡ.ʊ.d.z","cn":"n. 商品；货品","s":[["Prices are marked on the goods.","价格标在商品上。"],["These goods are priced too high.","这些货品定价过高。"],["The company is a world leader in electrical goods.","这家公司的电器产品在全世界首屈一指。"]]},{"l":"o/v.er/s.ea.s","p":"ˌəʊ/v.ə/ˈs.iː.z","cn":"adv. 在国外；向海外","s":[["Nearly half the students come from overseas.","几乎一半学生来自海外。"],["The news from overseas is overwhelmingly negative.","来自海外的消息完全不容乐观。"],["They do a lot of business in lucrative overseas markets.","他们在利润丰厚的海外市场上生意很多。"]]},{"l":"g.l.o/b.a.l","p":"ˈɡ.l.əʊ/b.ə.l","cn":"adj. 全球的；全世界的","s":[["Global warming is a real problem.","全球变暖是个确实存在的问题。"],["Will Prize-Winning Novels Shift Attitudes on Global Warming?","获奖小说会转变对全球变暖的态度吗？"],["One consequence of global warming is extinction.","全球变暖的后果之一是物种灭绝。"]]},{"l":"i.n/c.o.m.e","p":"ˈɪ.n/k.ʌ.m.-","cn":"n. 收入；收益；所得","s":[["His income is double hers.","他的收入是她的两倍。"],["All income must be declared.","所有收益必须申报。"],["He has a private income.","他有一笔私人收入。"]]},{"l":"n.ear/l.y","p":"ˈn.ɪə/l.i","cn":"adv. 几乎；差不多；将近","s":[["They're nearly always late.","他们几乎总是迟到。"],["The bottle's nearly empty.","这瓶子差不多空了。"],["It's nearly the end of term.","学期快要结束了。"]]},{"l":"b.u.s/i.n.e.ss","p":"ˈb.ɪ.z/-.n.ə.s","cn":"n. 买卖；生意","s":[["We're grateful for your business.","感谢您的光顾。"],["We do our business by mail.","我们通过邮递做生意。"],["My sex life is my business.","我的性生活是我的私事。"]]},{"l":"l.e.i.sure","p":"l.e.-.ʒə","cn":"n. 闲暇；空闲；休闲（只要求理解）","s":[["Leisure is often defined in opposition to work.","休闲常被定义为工作的反面。"],["Whale-watching has become a growth leisure industry.","观鲸业已成为一个快速发展的休闲产业。"],["On the whole, people miss the opportunity to enjoy leisure.","大体上说，人们都渴望享受休闲时光的机会。"]]},{"l":"th.r.ough/ou.t","p":"θ.r.uː/ˈaʊ.t","cn":"prep. 自始至终；贯穿整个时期","s":[["His column is syndicated throughout the world.","他的专栏文章在世界各地的报刊发表。"],["The school runs cookery classes throughout the year.","这个学校全年都开设烹饪课。"],["Protests continued intermittently throughout November.","整个十一月份抗议活动此起彼落。"]]},{"l":"d.u/t.y","p":"ˈd.juː/t.i","cn":"n. 责任；义务","s":[["Who's on duty today?","今天谁值班？"],["Your first duty is to your family.","你首要的是对家庭尽责。"],["What time do you go off duty?","你什么时候下班？"]]},{"l":"a b.i.t","p":"ə b.ɪ.t","cn":"有点儿；稍微","s":[["I'm a bit dry.","我有点渴。"],["He looked a bit embarrassed.","他看上去有点尴尬。"],["She sounded a bit worried.","她听起来有点焦虑不安。"]]},{"l":"a.t o.n.c.e","p":"æ.t wʌ.n.s.-","cn":"立即；马上","s":[["If necessary I can come at once.","如果有必要，我可以马上来。"],["Everyone began talking at once.","大家同时开始讲话。"],["The receptionist recognized him at once.","那名接待员马上认出了他。"]]},{"l":"d.r.i.n.k/i.ng w.a/t.er","p":"ˈd.r.ɪ.ŋ.k/ɪ.ŋ ˈw.ɔː/t.ə","cn":"饮用水","s":[]},{"l":"p.l.ay a r.o.l.e i.n","p":"p.l.eɪ ə r.əʊ.l.- ɪ.n","cn":"在……起作用","s":[]},{"l":"s.t.ea.m e.n/g.i.n.e","p":"s.t.iː.m ˈe.n/dʒ.ɪ.n.-","cn":"蒸汽机","s":[["Who invented the steam engine?","谁发明了蒸汽机？"]]},{"l":"a.s a r.e/s.u.l.t","p":"æ.z ə r.ɪ/ˈz.ʌ.l.t","cn":"作为结果；因此","s":[["As a result, these advertisements could mislead children and their parents.","因此，这些广告会误导孩子和他们的父母。"],["As a result, it may abandon or modify some rites.","因此，人们可能会摒弃或修改一些仪式。"],["As a result, they become starved of oxygen and the delicate cells die away.","结果，他们成为缺乏氧气脆弱的细胞而消失。"]]},{"l":"m.a.k.e sure","p":"m.eɪ.k.- ʃʊə","cn":"确保；设法保证","s":[["Make sure the letter is properly addressed.","一定要正确书写信上的地址。"],["Check over the error message to make sure the connections are correct.","仔细查看错误消息以确保连接正确。"],["Make sure your workstation is correct.","确保你的工作站是正确的。"]]}]},{"name":"Unit 6 Electricity everywhere","words":[{"l":"b.a.t/t.e.r/y","p":"ˈb.æ.t/-.ə.r/i","cn":"n. 电池","s":[["Before use, the battery must be charged.","电池使用前必须充电。"],["I have a battery tester in my garage.","我的车库里有台电池测试仪。"],["They stopped beside a battery of abandoned guns.","他们停在一排废弃的大炮旁。"]]},{"l":"e/l.e.c/t.r.i.c/i/t.y","p":"ɪ/ˌl.e.k/ˈt.r.ɪ.s/ə/t.i","cn":"n. 电；电能","s":[["It works by electricity.","这是电动的。"],["He cannot fix the electricity.","他不会修理电路。"],["This type of heater uses a lot of electricity.","这种加热器耗电量很大。"]]},{"l":"s.w.i.tch/-.o.ff","p":"ˌs.w.ɪ.tʃ/-.ˈɒ.f","cn":"adj. 关闭（电灯、机器等）的（只要求理解）","s":[]},{"l":"t.a.s.k","p":"t.ɑː.s.k","cn":"n. 任务；活动","s":[["We need to define the task ahead very clearly.","我们需要明确今后的任务。"],["Housework is a never-ending task.","家务活做起来真是没完没了。"],["They had an awesome task ahead.","他们就要有十分艰巨的任务。"]]},{"l":"wh.i.l.e","p":"w.aɪ.l.-","cn":"n. 一段时间；一会儿","s":[["Write me while you're away.","你外出期间给我写信。"],["Cover me while I move forward.","掩护我前进。"],["Seize life while you have it.","当你活着的时候，好好把握生命。"]]},{"l":"t.a/b.l.e.t","p":"ˈt.æ/b.l.ə.t","cn":"n. 平板电脑（只要求理解）","s":[["Take one tablet every four hours.","隔四小时服一片。"],["Don't chew, break, or crush the tablet.","不要咀嚼、咬破或压碎药片。"],["One-in-five Americans will use a tablet or smartphone.","五分之一的美国人将使用平板电脑或智能手机。"]]},{"l":"f.r.i.dge","p":"f.r.ɪ.dʒ","cn":"n. 冰箱","s":[["There's nothing much in the fridge.","冰箱里没什么东西了。"],["The fridge is stuffed to bursting.","冰箱满得都快撑破了。"],["The fridge was completely bare.","电冰箱里什么也没有。"]]},{"l":"y.o.g/ur.t","p":"ˈj.ɒ.ɡ/ə.t","cn":"n. 酸奶","s":[]},{"l":"a/p.ar.t/m.e.n.t","p":"ə/ˈp.ɑː.t/m.ə.n.t","cn":"n. 公寓套房","s":[["I've got a pleasant little apartment.","我有一套舒适的小公寓。"],["He lives alone in a suspiciously tidy apartment.","他独自一人住在一套整洁得出奇的公寓里。"],["They live in an apartment uptown.","他们住在市郊的一套公寓。"]]},{"l":"h.ou.s.e/h.o.l.d","p":"ˈh.aʊ.s.-/h.əʊ.l.d","cn":"adj. 家庭的","s":[["Today, fashion designers are household names.","如今，服装设计师们家喻户晓。"],["Many household products give off noxious fumes.","很多家用产品散发有害气体。"],["She became a household name in the 1960s.","她在20世纪60年代成为家喻户晓的人物。"]]},{"l":"a/g.ai.n.s.t","p":"ə/ˈɡ.e.n.s.t","cn":"prep. 紧靠；碰；撞","s":[["The evidence is against him.","证据对他不利。"],["He's dead against the idea.","他坚决反对这个想法。"],["I'd advise you against doing that.","我劝你别做那事。"]]},{"l":"s.p.ee.d","p":"s.p.iː.d","cn":"n. 速度；速率","s":[["Speed is key at this point.","在这个时候速度是关键。"],["We rounded the bend at high speed.","我们高速驶过这段弯路。"],["This system helps speed up access times.","这个系统有助于加快读取数据的时间。"]]},{"l":"s.a.f.e/t.y","p":"ˈs.eɪ.f.-/t.i","cn":"n. 安全；平安","s":[["I managed to swim to safety.","我设法游到安全处。"],["It describes completely the facility and its safety basis.","它完整地描述了设备和它的安全基础。"],["Crying is a natural safety valve.","哭泣是一种自然的释放压力的手段。"]]},{"l":"i.n/s.t.r.u.c/tion","p":"ɪ.n/ˈs.t.r.ʌ.k/ʃən","cn":"n. 用法说明；操作指南","s":[["The instructions look very complicated.","这说明书看起来很难懂。"],["The instructions on the box are very confusing.","盒子上的使用说明令人费解。"],["She needed a clear head to carry out her instructions.","她需要一个清醒的头脑来执行命令。"]]},{"l":"c.o/nn.e.c.t","p":"k.ə/ˈn.e.k.t","cn":"v. （使）连接","s":[["The two events are closely connected.","两起事件之间有密切的联系。"],["The two subjects are closely connected.","这两门学科紧密相连。"],["Click 'Continue' to connect to the Internet.","点击 Continue 连接到互联网。"]]},{"l":"d.e/v.i.c.e","p":"d.ɪ/ˈv.aɪ.s.-","cn":"n. 装置；设备（只要求理解）","s":[["The device is fixed to a post.","该设备固定在一根柱子上。"],["The device draws gas along the pipe.","这装置将气体顺着管子抽出来。"],["The device exploded underneath a van.","那个装置在一辆面包车底下爆炸了。"]]},{"l":"r.u.l.e","p":"r.uː.l.-","cn":"n. 规则；条例","s":[["There are no absolute rules.","没有绝对的准则。"],["The deal may be ruled illegal.","这笔交易可能会被判定为非法。"],["The Supreme Court ruled in Fitzgerald's favour.","最高法院判定菲茨杰拉德胜诉。"]]},{"l":"c.l.i/m.a.t.e","p":"ˈk.l.aɪ/m.ə.t.-","cn":"n. 气候","s":[["Climate and weather affect every aspect of our lives.","气候和天气影响我们生活的每个方面。"],["The economic climate remains uncertain.","经济气候依然是不确定。"],["What a damnable climate we have!","我们这的气候多讨厌啊！"]]},{"l":"a/m.ou.n.t","p":"ə/ˈm.aʊ.n.t","cn":"n. 数量；数额","s":[["Only a minute amount is needed.","只需很少的一点。"],["We had a surprising amount in common.","我们共同之处出奇地多。"],["We need double the amount we already have.","我们需要现有数量的两倍。"]]},{"l":"p.ow/er","p":"ˈp.aʊ/ə","cn":"v. 驱动；推动（机器或车辆）","s":[["They've switched off the power.","他们关掉了电源。"],["Both parties are hungry for power.","两党都渴望掌权。"],["The power stations burn coal from the Ruhr region.","这些电厂烧产自鲁尔地区的煤。"]]},{"l":"t.e.l/e/v.i/sion s.e.t","p":"ˈt.e.l/ɪ/v.ɪ/ʒən s.e.t","cn":"n. 电视机","s":[]},{"l":"l.a.n.d/m.ar.k","p":"ˈl.æ.n.d/m.ɑː.k","cn":"n. 地标","s":[["Marble Arch is a famous London landmark.","大理石拱门是伦敦著名的标志性建筑。"],["The Menger Hotel is a San Antonio landmark.","蒙尔饭店是圣安东尼奥的一个标志性建筑。"],["There are efforts under way to designate the bridge a historic landmark.","在努力把这座桥定为历史地标。"]]},{"l":"h.a.v.e s.o.m.e/th.i.ng i.n c.o.m/m.o.n","p":"h.æ.v.- ˈs.ʌ.m.-/θ.ɪ.ŋ ɪ.n ˈk.ɒ.m/-.ə.n","cn":"有相同的特征（或特点等）","s":[["We happened to discover we had a friend in common.","我们碰巧发现我们有个共同的朋友。"]]},{"l":"l.igh.t b.u.l.b","p":"l.aɪ.t b.ʌ.l.b","cn":"电灯泡","s":[["It was a compact fluorescent light bulb.","那是一个紧凑型荧光灯管。"],["On the stairway to the basement, he took the light bulb out of the socket.","在通向地下室的楼梯上，他把灯泡从灯座上拧了下来。"]]},{"l":"air c.o.n/d.i.tion/er","p":"eə k.ə.n/ˈd.ɪ.ʃən/ə","cn":"空调机；空调设备","s":[]},{"l":"v.i.d/e/o g.a.m.e","p":"ˈv.ɪ.d/i/əʊ ɡ.eɪ.m.-","cn":"电子游戏","s":[["He wanted to play video game.","他想玩电子游戏。"],["He was playing a video game.","他正在玩电子游戏。"],["Let's play a video game together.","我们一起玩视频游戏吧。"]]},{"l":"r.u.n ou.t o.f","p":"r.ʌ.n aʊ.t ə.v","cn":"用完；耗尽","s":[["They have run out of ideas.","他们已经想不出办法了。"],["I have run out of patience with her.","我对她已失去耐性。"]]},{"l":"g.o b.a.d","p":"ɡ.əʊ b.æ.d","cn":"变质","s":[]},{"l":"e/l.e.c/t.r.i.c c.ar","p":"ɪ/ˈl.e.k/t.r.ɪ.k k.ɑː","cn":"电动汽车","s":[["Fans of electric cars say they are clean, quiet, and economical.","电动车爱好者说电动车无污染，无噪音，而且经济。"]]},{"l":"e/l.e.c/t.r.i/c.a.l a/pp.l.i/ance","p":"ɪ/ˈl.e.k/t.r.ɪ/k.ə.l ə/ˈp.l.aɪ/əns","cn":"电器","s":[]},{"l":"c.are a/b.ou.t","p":"k.eə ə/ˈb.aʊ.t","cn":"关注；担忧","s":[["Joe Sixpack doesn't care about that.","普通工人不在意那事。"],["He genuinely cares about his employees.","他真诚地关心他的雇员。"]]},{"l":"c.l.i/m.a.t.e ch.a.n.g.e","p":"ˈk.l.aɪ/m.ə.t.- tʃ.eɪ.n.dʒ.-","cn":"气候变化","s":[["We are trying to detect and understand how the climates change.","我们在努力探测并了解气候是怎样变化的。"]]},{"l":"j.oi.n i.n","p":"dʒ.ɔɪ.n ɪ.n","cn":"参加；加入","s":[["May I join in the celebration?","我能参加庆祝活动吗？"],["I'll join in the long jump.","我将参加跳远比赛。"],["He is encouraging others to join in.","他正在鼓励其他人加入进来。"]]}]},{"name":"Unit 7 Role models of our time","words":[{"l":"c.o.n/t.r.i/b.u/tion","p":"ˌk.ɒ.n/t.r.ɪ/ˈb.juː/ʃən","cn":"n. 贡献","s":[["His contribution could be key.","他的贡献可能是最重要的。"],["They may define their contribution too narrowly.","他们可能把他们的贡献说得太狭隘了。"],["The money came from world-wide contribution.","这笔钱是世界各地捐赠的。"]]},{"l":"h.e/r.o","p":"ˈh.ɪə/r.əʊ","cn":"n. 英雄","s":[["The hero dies in Act 5, Scene 3.","男主角在第五幕第三场死去。"],["The hero of Doctor Zhivago dies in 1929.","《日瓦戈医生》的男主人公于1929年去世。"],["In \"Toxic II,\" the hero windsurfs to Japan.","《中毒2》里的男主人公冲浪至日本。"]]},{"l":"p.i/o/n.eer","p":"ˌp.aɪ/ə/ˈn.ɪə","cn":"n. 先锋；先驱","s":[["Li Dong, 46, is a pioneer in this field.","46岁的李东是这一领域的先驱。"],["In the US, California has been a pioneer.","在美国，加利福尼亚州是一个开拓者。"],["What if I am a pioneer or even a genius?","要是我是个开拓者，甚至是个天才怎么办？"]]},{"l":"t.e.ch/n.o.l/o/g.y","p":"t.e.k/ˈn.ɒ.l/ə/dʒ.i","cn":"n. 科技","s":[["Technology is changing fast.","技术日新月异。"],["He's ignorant about modern technology.","他对现代科技一无所知。"],["They are piggybacking onto developed technology.","他们利用已发展的科技。"]]},{"l":"r.e/c.ei.v.e","p":"r.ɪ/ˈs.iː.v.-","cn":"v. 拿到；接到；收到","s":[["He will receive $6,000 in back pay.","他将收到$6000的欠薪。"],["The best models receive star treatment.","最优秀的模特儿会受到明星级的待遇。"],["She stepped up to receive her prize.","她走上前去领奖。"]]},{"l":"a/w.ar.d","p":"ə/ˈw.ɔː.d","cn":"n. 奖；v. 授予；奖励","s":[["He attacked greedy bosses for awarding themselves big raises.","他攻击那些给自己大幅涨工资的贪婪的老板们。"],["This award is considered (to be) a great honour.","这项奖被视为极大的荣誉。"],["The referee awarded a corner.","裁判员判给了一次角球。"]]},{"l":"e.n/g.i/n.ee.r/i.ng","p":"ˌe.n/dʒ.ɪ/ˈn.ɪə.r/ɪ.ŋ","cn":"n. 工程学","s":[["She works for an engineering company.","她在一家工程公司工作。"],["He has not studied mechanics or engineering.","他没有学习过力学或者工程学。"],["The bridge is a triumph of modern engineering.","这座桥是现代工程的一大成就。"]]},{"l":"e/d.u/c.a/tion","p":"ˌe/dʒ.u/ˈk.eɪ/ʃn","cn":"n. 教育","s":[["They're cutting funds for education.","他们正在削减教育经费。"],["I've always worked in education.","我一直从事教育工作。"],["She completed her formal education in 1995.","她在1995年完成正规学业。"]]},{"l":"s.p.e.n.d","p":"s.p.e.n.d","cn":"v. 花（时间）；度过","s":[["Spending has increased year on year.","与去年同期比较，开销增加了。"],["10% of teenagers spend time outside every day.","10%的青少年每天花时间到户外去。"],["They wanted to spend the evening by themselves.","他们想要单独度过这个夜晚。"]]},{"l":"r.e/s.ear.ch","p":"r.ɪ/ˈs.ɜː.tʃ","cn":"n. 研究；调查","s":[["Too much emphasis is placed on research.","把重点过多地放在研究上。"],["The research seemed founded on quicksand.","该研究仿佛建立在一盘散沙基础上的。"],["They do not fund peer-reviewed research.","他们不资助同行评审的研究。"]]},{"l":"a/ch.ie.v.e","p":"ə/ˈtʃ.iː.v.-","cn":"v. （凭长期努力）达到（某目标、地位、标准）","s":[["He achieved celebrity as a sports commentator.","他作为一名体育评论员而享誉四方。"],["The medicine did not achieve the desired effect.","这种药未达到预期效果。"],["Teamwork is required in order to achieve these aims.","要达到这些目标需要齐心协力。"]]},{"l":"w.e.ll/-.r.e/s.p.e.c/t.e.d","p":"ˌw.e.l/-.r.ɪ/ˈs.p.e.k/t.ɪ.d","cn":"adj. 受尊敬的","s":[]},{"l":"f.ou.n.d","p":"f.aʊ.n.d","cn":"v. 建立（城镇或国家）","s":[["Look what I've found!","看我发现了什么！"],["The court found in her favour.","法庭判决对她有利。"],["She found her job very boring.","她觉得自己的工作很无聊。"]]},{"l":"ea/g.er","p":"ˈiː/ɡ.ə","cn":"adj. 热切的；渴望的","s":[["The White House is eager to protect and enhance that reputation.","白宫急于保护并提高那声望。"],["He was eager to get into politics.","他渴望从政。"],["They were eager for a second bite of the cherry.","他们渴望能得到第二次机会。"]]},{"l":"r.ai.s.e","p":"r.eɪ.z.-","cn":"v. 增加；提高","s":[["They raised her (as) a Catholic.","他们让她从小就信天主教。"],["She raised the gun and fired.","她举枪射击。"],["He raised his hand to wave.","他举起手来挥动。"]]},{"l":"m.i/ssion","p":"ˈm.ɪ/ʃn","cn":"n. 使命（只要求理解）","s":[["I reside at the mission at St. Michael's.","我住在圣迈克尔教堂的布道所。"],["Jack demands that Victor call off the mission.","杰克要求维克托放话出去，取消营救他的行动。"],["The mission was a washout.","这个任务彻底失败了。"]]},{"l":"h.o.n/our","p":"-.ˈɒ.n/ə","cn":"n. 荣誉；名誉","s":[["This award is considered (to be) a great honour.","这项奖被视为极大的荣誉。"],["The school's motto is: 'Duty, Honour, Country'.","这所学校的校训是：“责任、荣誉、国家”。"],["She is an honour to the profession.","她是这一行业的光荣。"]]},{"l":"p.u/b.l.i.c","p":"ˈp.ʌ/b.l.ɪ.k","cn":"n. 百姓；民众","s":[["They announced cuts in public spending.","他们宣布缩减公共开支。"],["It is not a public holiday.","它不是公共假日。"],["New Year's Day is a public holiday.","元旦节是公众假期。"]]},{"l":"a/pp.r.o/v.a.l","p":"ə/ˈp.r.uː/v.ə.l","cn":"n. 赞成；同意（只要求理解）","s":[["The testing and approval of new drugs will be speeded up.","新药的检测与审批将会加速。"],["There was a roar of approval.","响起了一片表示赞成的喊叫声。"],["Do the plans meet with your approval ?","这些计划你赞成吗？"]]},{"l":"p.r.ai.s.e","p":"p.r.eɪ.z.-","cn":"n. 赞扬；称赞；赞美","s":[["Even his praise is double-edged.","即使他的赞扬也是可以有两种解释的。"],["She praised his cooking.","她称赞他的烹调技术。"],["He heaped praise on his team.","他高度赞扬了他的队。"]]},{"l":"s.o/c.i/e/t.y","p":"s.ə/ˈs.aɪ/ə/t.i","cn":"n. 社会","s":[["Ours is a secular society.","我们的社会是个世俗社会。"],["We live in a multicultural society.","我们生活在一个多元文化的社会中。"],["I always adaption this society slowly.","偶总是迟钝的适应这个社会。"]]},{"l":"f.e/m.a.l.e","p":"ˈf.iː/m.eɪ.l.-","cn":"adj. 女的；女性的","s":[["Two of the candidates must be female.","候选人中必须有两名是女性。"],["The male and female birds take turns in sitting on the eggs.","雄鸟和雌鸟轮流伏窝。"],["The audience was almost entirely female.","观众几乎全是女性。"]]},{"l":"a.d/m.ire","p":"ə.d/ˈm.aɪə","cn":"v. 钦佩；仰慕","s":[["I really admire your enthusiasm.","我确实钦佩你的热情。"],["We stopped to admire the scenery.","我们中途停下来欣赏一下风景。"],["I am content to admire the mountains from below.","我满足于从山下观赏群山。"]]},{"l":"i.n/s.p.ire","p":"ɪ.n/ˈs.p.aɪə","cn":"v. 激励；鼓舞","s":[["Subjects were picked to inspire or entertain.","文章主题要有激励人心或是让人愉悦的效果。"],["Singer Brett Anderson inspires old-fashioned hero worship.","歌手布雷特•安德森唤起了老式的个人崇拜风潮。"],["Our job is to insPire, suPPort and eleCtrify.","我们的工作就是鼓舞、打气、支持。"]]},{"l":"r.e.g/u/l.ar","p":"ˈr.e.ɡ/jə/l.ə","cn":"adj. 通常的；平常的","s":[["Do you take regular exercise?","你经常锻炼吗？"],["We are in regular communication by letter.","我们定期通信联系。"],["I'm a regular listener to her show.","我是她节目的一名固定听众。"]]},{"l":"f.ee.d","p":"f.iː.d","cn":"v. 养活；提供食物","s":[["Can you feed the cat, please?","请你喂一下猫好吗？"],["There are many advantages to breast feeding.","母乳喂养的好处很多。"],["New fathers love bottle-feeding their babies.","新爸爸们喜欢用奶瓶喂他们的婴儿。"]]},{"l":"s.m.o.k.e/j.u.m.p/er","p":"ˈs.m.əʊ.k.-/dʒ.ʌ.m.p/ə","cn":"n. 空降消防员","s":[]},{"l":"th.i.ck","p":"θ.ɪ.k","cn":"adj. 茂密的","s":[["He had thick black hair.","他有着浓密乌黑的头发。"],["I could see a thick layer of dust on the stairs.","我能看见楼梯上厚厚的一层灰尘。"],["How thick are the walls?","这些墙有多厚？"]]},{"l":"c.er/t.ai.n","p":"ˈs.ɜː/t.ə.n","cn":"adj. 某个；特定的","s":[["That's true, to a certain extent.","在一定程度上的确如此。"],["Are you absolutely certain about this?","你对这事绝对确信无疑吗？"],["You have to allow for a certain amount of error.","你必须考虑到一定数量的错误。"]]},{"l":"k.i.ll","p":"k.ɪ.l","cn":"v. 杀死；导致死亡","s":[["Is it ever right to kill?","有没有什么情况下，杀人是对的？"],["It'd kill us to take back all the products.","收回所有的产品会害死我们的。"],["A cat often plays with a mouse before the kill.","猫在咬死老鼠之前常常要耍弄它一番。"]]},{"l":"t.oo.l","p":"t.uː.l","cn":"n. 工具","s":[["What is this tool for?","这个工具是干什么用的？"],["Forthetimebeing, we will have to use this tool.","就目前来说，我们将不得利用这一工具。"],["This tool can be used in a variety of ways.","这一工具有多种用途。"]]},{"l":"d.ea.d","p":"d.e.d","cn":"adj. 失去生命的；枯萎的","s":[["Suppose him dead—what then?","假如他死了—那怎么办？"],["He's dead against the idea.","他坚决反对这个想法。"],["Can the dead come to life?","死人能复活吗？"]]},{"l":"b.r.a.v.e","p":"b.r.eɪ.v.-","cn":"adj. 勇敢的；无畏的","s":[["You're a brave soul.","你真勇敢。"],["The brave will sharpen their will.","勇敢的人会磨练自己的意志。"],["Charles was brave and remarkably good-humoured.","查尔斯很勇敢，脾气也好。"]]},{"l":"t.ough","p":"t.ʌf","cn":"adj. 健壮的；坚韧不拔的","s":[["I had set myself a tough assignment.","我给自己定了一项艰巨任务。"],["She had a pretty tough childhood.","她度过了一个非常艰苦的童年。"],["She is bright, tough and spunky.","她聪明、顽强而且干劲十足。"]]},{"l":"f.i.t","p":"f.ɪ.t","cn":"adj. 健壮的；健康的","s":[["Where do I fit in?","哪里有我适合的地方？"],["Another fit of coughing seized him.","他那咳嗽又一次发作了。"],["The key doesn't fit the lock.","这把钥匙打不开这把锁。"]]},{"l":"o.th/er/w.i.s.e","p":"ˈʌ.ð/ə/w.aɪ.z.-","cn":"adv. 否则；不然","s":[["We're committed to the project. We wouldn't be here otherwise.","我们是全心全意投入这项工作的，否则我们就不会到这里来了。"],["I don't like him, and it would be dishonest of me to pretend otherwise.","我不喜欢他，如果假装喜欢，那就是我不诚实了。"],["Otherwise, they revert to graphite or burn.","否则，它们会变成石墨或燃烧。"]]},{"l":"s.ur/v.i.v.e","p":"s.ə/ˈv.aɪ.v.-","cn":"v. 生存；存活","s":[["No one survived the crash.","无人在这次撞击中幸免于难。"],["Companies must be able to survive in the marketplace.","公司必须有能力在市场竞争中生存下去。"],["Outside the protected environment of institutional care he could not survive.","离开福利机构照顾下的这个受保护的环境，他无法生存。"]]},{"l":"p.r.ou.d","p":"p.r.aʊ.d","cn":"adj. 骄傲的；自豪的","s":[["They are rightly proud of their children.","他们当然为他们的孩子而骄傲。"],["I'm proud of my Italian roots.","我为我的意大利血统感到骄傲。"],["Australians are justly proud of their native wildlife.","澳大利亚人理应为他们本土的野生动植物而自豪。"]]},{"l":"r.o.l.e m.o.d/e.l","p":"r.əʊ.l.- ˈm.ɒ.d/ə.l","cn":"楷模；行为榜样","s":[["The child's same-sex parent acts as a role model.","孩子的同性家长是孩子效仿的榜样。"],["She is not just a role model, but someone I love.","她不仅是一个榜样，还是我爱的人。"],["She was given the title \"role model of the times\" by the central government.","她被中央政府授予“时代楷模”的称号。"]]},{"l":"i.n th.e f.ie.l.d o.f","p":"ɪ.n ð.ə f.iː.l.d ə.v","cn":"在……领域","s":[]},{"l":"d.e/v.o.t.e o.n.e/s.e.l.f t.o","p":"d.ɪ/ˈv.əʊ.t.- wʌ.n.-/ˈs.e.l.f t.uː","cn":"献身；致力","s":[["She devoted herself to her career.","她全力倾注于自己的事业。"],["He devotes his time to the acquisition of knowledge.","他把时间用在获取知识上。"],["He devoted his energies to the reformation of science.","他把他的全部精力投入到了科学的革新中。"]]},{"l":"c.o.l/l.e.g.e e.n/t.r.ance e.x/a.m/i/n.a/tion","p":"ˈk.ɒ.l/-.ɪ.dʒ.- ˈe.n/t.r.əns ɪ.ɡz/ˌæ.m/ɪ/ˈn.eɪ/ʃən","cn":"大学入学考试","s":[]},{"l":"l.oo.k u.p t.o","p":"l.ʊ.k ʌ.p t.uː","cn":"敬仰；钦佩","s":[["I'll look up to you.","我会尊敬你的。"],["We all look up to him.","我们都很尊敬他。"],["I look up to the policeman who helped me out.","我尊敬那位帮助我摆脱困境的警察。"]]},{"l":"s.u/g.ar p.i.ll","p":"ˈʃ.ʊ/ɡ.ə p.ɪ.l","cn":"糖丸","s":[]},{"l":"ch. const COLORS = ['#a78bfa', '#38bdf8', '#fb923c', '#34d399', '#f472b6', '#facc15'];

delete S.splits; // 旧版拆分格式，已废弃
for (const k in S.wrong) if (!S.wrong[k].item) delete S.wrong[k]; // 旧版错词记录没有拆分数据
function safeLoad() { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

const $ = s => document.querySelector(s);

const kb = $('#kb');
const isTouch = matchMedia('(pointer:coarse)').matches;
const plain = l => l.replace(/[./]/g, '');            // 'c.l.a.ss/r.oo.m' -> 'classroom'
const keyOf = item => plain(item.l).toLowerCase();
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const color = si => COLORS[si % COLORS.length];

let queue = [], results = [], finished = false, W = null;

/* ================= 学习进度（间隔复习）、统计 ================= */
const ALLW = {}; // 所有单词按字母去重（brother 三年级上、下册各有一个，进度共用）
BOOK_DATA.forEach(b => b.units.forEach(u => u.words.forEach(w => { ALLW[keyOf(w)] = ALLW[keyOf(w)] || w; })));

// 复习间隔（天）：词在第几档就隔多久再复习。听写拼对升一档，拼错降档并当天重练
const INTERVALS = [0, 1, 2, 4, 7, 15, 30];
const MASTERED_BOX = 4;   // 第 4 档起（隔 7 天以上还拼得对）算「掌握」
const REVIEW_CAP = 20;    // 一次复习最多出多少个词
let combo = 0;            // 连续一次拼对的词数

const pad2 = n => String(n).padStart(2, '0');
const fmtDay = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const today = () => fmtDay(new Date());
const parseDay = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (day, n) => { const d = parseDay(day); d.setDate(d.getDate() + n); return fmtDay(d); };

function streak() {
  let t = today(), n = 0;
  if (!(S.days[t] && S.days[t].n)) t = addDays(t, -1); // 今天还没练不算断
  while (S.days[t] && S.days[t].n) { n++; t = addDays(t, -1); }
  return n;
}
function dueList() {
  const t = today();
  return Object.entries(S.prog)
    .filter(([k, p]) => p.due <= t && ALLW[k])
    .sort((a, b) => a[1].due.localeCompare(b[1].due) || a[1].box - b[1].box)
    .map(([k]) => ALLW[k]);
}
// 记录一次练习结果，返回 {isNew, goalHit}
function recordResult(item, ok, mode) {
  const key = keyOf(item), t = today();
  const d = S.days[t] || (S.days[t] = {n: 0, ok: 0, w: 0, nw: 0});
  let p = S.prog[key];
  const isNew = !p;
  if (!p) p = S.prog[key] = {box: 0, due: t, seen: 0, ok: 0, first: t, last: '', pd: ''};
  if (p.last !== t) d.w++;            // 今天第一次练这个词
  if (isNew) d.nw++;
  d.n++;
  if (ok) d.ok++;
  p.seen++;
  p.last = t;
  if (ok) {
    p.ok++;
    if (mode === 'dictation') {
      if (p.pd !== t) { p.box = Math.min(6, p.box + 1); p.due = addDays(t, INTERVALS[p.box]); p.pd = t; } // 一天只升一档
    } else if (p.box < 1) { p.box = 1; p.due = addDays(t, 1); } // 跟写只算入门
  } else {
    p.box = Math.max(0, p.box - (mode === 'dictation' ? 2 : 1));
    p.due = t;
    p.pd = '';
  }
  const goalHit = ok && !d.goal && d.w >= S.goal; // 达标时那个词拼错了，就等下一个拼对的再庆祝
  if (goalHit) d.goal = 1;
  return {isNew, goalHit};
}
function stats() {
  let learned = 0, mastered = 0, learning = 0, fresh = 0;
  for (const k in S.prog) {
    if (!ALLW[k]) continue;
    const p = S.prog[k];
    learned++;
    if (p.box >= MASTERED_BOX) mastered++; else if (p.box >= 1) learning++; else fresh++;
  }
  return {total: Object.keys(ALLW).length, learned, mastered, learning, fresh, due: dueList().length,
    today: S.days[today()] || {n: 0, ok: 0, w: 0, nw: 0}, streak: streak()};
}
function updateChip() {
  const el = $('#bStat');
  if (!el) return;
  const w = (S.days[today()] || {}).w || 0, due = dueList().length;
  el.innerHTML = `🔥${streak()} · 今日 ${w}/${S.goal}` + (due ? `<span class="dot">${due}</span>` : '');
}
function unitBadge(u) {
  const n = u.words.filter(w => S.prog[keyOf(w)]).length;
  return n === 0 ? `${u.words.length}` : n === u.words.length ? `✓ ${n}` : `${n}/${u.words.length}`;
}
function sessionStars() {
  if (!results.length) return 0;
  const rate = results.filter(r => r.ok).length / results.length;
  return rate >= 0.9 ? 3 : rate >= 0.7 ? 2 : 1;
}

/* ================= 庆祝效果：彩带、夸奖弹字、夸奖语音 ================= */
const fxCanvas = document.createElement('canvas');
fxCanvas.id = 'fx';
document.body.appendChild(fxCanvas);
const fxCtx = fxCanvas.getContext('2d');
let fxParts = [], fxRaf = 0;
function fxResize() { fxCanvas.width = innerWidth; fxCanvas.height = innerHeight; }
addEventListener('resize', () => { fxResize(); onViewport(); });
fxResize();
const FX_COLORS = ['#a78bfa', '#38bdf8', '#fb923c', '#34d399', '#f472b6', '#facc15'];
function fxAdd(p) {
  fxParts.push(Object.assign({rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.4, life: 1, round: Math.random() < 0.3}, p));
  if (!fxRaf) fxRaf = requestAnimationFrame(fxStep);
}
function burst(x, y, n = 30, power = 1) { // 从一点向四周喷
  if (!S.fx) return;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.28, v = (3 + Math.random() * 6) * power;
    fxAdd({x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 3 * power, g: 0.28 + Math.random() * 0.1,
      size: 5 + Math.random() * 6, c: FX_COLORS[i % FX_COLORS.length], decay: 0.012 + Math.random() * 0.012});
  }
}
function rain(n = 120) { // 从屏幕上方撒落
  if (!S.fx) return;
  for (let i = 0; i < n; i++) {
    fxAdd({x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * 0.4, vx: (Math.random() - 0.5) * 2.5,
      vy: 2 + Math.random() * 3, g: 0.05, size: 6 + Math.random() * 7, c: FX_COLORS[i % FX_COLORS.length], decay: 0.003});
  }
}
function fxStep() {
  fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
  fxParts = fxParts.filter(p => p.life > 0 && p.y < fxCanvas.height + 30);
  for (const p of fxParts) {
    p.vx *= 0.99; p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= p.decay;
    fxCtx.save();
    fxCtx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.5));
    fxCtx.translate(p.x, p.y);
    fxCtx.rotate(p.rot);
    fxCtx.fillStyle = p.c;
    if (p.round) { fxCtx.beginPath(); fxCtx.arc(0, 0, p.size / 2, 0, 6.28); fxCtx.fill(); }
    else fxCtx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.66);
    fxCtx.restore();
  }
  fxRaf = fxParts.length ? requestAnimationFrame(fxStep) : 0;

// 把「字母拆分」和「音标拆分」解析成音节列表；结构对不上时返回错误
function parseSplit(l, p) {
  const split3 = s => s.trim().split(/\s+/).map(w => w.split('/').map(x => x.split('.')));
  const L = split3(l), P = split3(p);
  if (L.length !== P.length) return {error: '单词数和音标对不上'};
  const syls = [];
  for (let wi = 0; wi < L.length; wi++) {
    if (L[wi].length !== P[wi].length) return {error: `第 ${wi + 1} 个词的音节数和音标对不上`};
    for (let si = 0; si < L[wi].length; si++) {
      const ls = L[wi][si], ps = P[wi][si];
      if (ls.length !== ps.length) return {error: `「${ls.join('')}」有 ${ls.length} 个字母组合，音标却是 ${ps.length} 个`};
      if (ls.some(x => !x) || ps.some(x => !x)) return {error: '有空的字母组合或音标（检查是不是连着写了两个点）'};
      syls.push({wi, t: ls.join(''), chunks: ls.map((x, i) => ({l: x, p: ps[i]}))});
    }
  }
  return {syls};
}
function getLP(item) { return S.custom[keyOf(item)] || {l: item.l, p: item.p}; }
function sylsOf(item) {
  const lp = getLP(item);
  const r = parseSplit(lp.l, lp.p);
  return r.error ? parseSplit(item.l, item.p).syls : r.syls; // 自定义拆分坏了就用默认
}
// 整词音标，例如 /ˈklɑːsruːm/
function fullIpa(syls) {
  const words = [];
  syls.forEach(s => { words[s.wi] = (words[s.wi] || '') + s.chunks.map(c => c.p === '-' ? '' : c.p).join(''); });
  return '/' + words.join(' ') + '/';
}

function unitWords(unit) {
  const book = BOOKS[S.book];
  if (unit === 'wrong') return Object.values(S.wrong).map(x => x.item);
  if (unit === 'due') return dueList().slice(0, REVIEW_CAP);
  if (unit === 'all') return book.units.flatMap(u => u.words);
  return (book.units[unit] || book.units[0]).words;
}
function buildQueue(keepIdx) {
  if (S.unit !== 'all' && S.unit !== 'wrong' && S.unit !== 'due' && !BOOKS[S.book].units[S.unit]) S.unit = 0;
  combo = 0;
  const list = unitWords(S.unit).slice();
  if (S.shuffle) for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [list[i], list[j]] = [list[j], list[i]]; }
  queue = list;
  results = [];
  finished = false;
  if (!keepIdx || S.idx >= queue.length) S.idx = 0;
}
function prepWord() {
  const item = queue[S.idx];
  if (!item) { W = null; return; }
  const syls = sylsOf(item);
  const req = [];
  syls.forEach((s, si) => [...s.t].forEach((ch, ci) => { if (/[a-z]/i.test(ch)) req.push({si, ci, ch}); }));
  const text = syls.reduce((acc, s, i) => acc + (i && s.wi !== syls[i - 1].wi ? ' ' : '') + s.t, '');
  W = {item, text, syls, ipa: fullIpa(syls), req, pos: 0, err: 0, hadError: false, hint: -1, done: false, ok: false, wrongFlash: null, token: {}};
}

/* ================= 声音 ================= */
let curAudio = null;
function stopAudio() {
  if (curAudio) { curAudio.onerror = null; curAudio.pause(); curAudio = null; }
  try { speechSynthesis.cancel(); } catch (e) {}
}
// 全大写的缩写（TV、PE、US）按字母读
function audioText(text) {
  return text.split(/\s+/).map(t => /^[A-Z]{2,}$/.test(t) ? t.split('').join(' ') : t).join(' ');
}
function spokenSyl(t) {
  if (/^[A-Z]$/.test(t)) return t;
  return t.replace(/[^a-zA-Z]/g, '').toLowerCase();
}
function pickVoice(lang) {
  const vs = speechSynthesis.getVoices();
  return vs.find(v => v.lang === lang) || vs.find(v => v.lang.replace('_', '-').startsWith(lang)) || vs.find(v => /^en/i.test(v.lang));
}
function ttsP(text, rate = 0.85) {
  return new Promise(res => {
    if (!('speechSynthesis' in window) || !text) { setTimeout(res, 400); return; }
    let d = false;
    const fin = () => { if (!d) { d = true; res(); } };
    const lang = S.accent === 'uk' ? 'en-GB' : 'en-US';
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    const v = pickVoice(lang);
    if (v) u.voice = v;
    u.rate = rate;
    u.onend = fin;
    u.onerror = fin;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
    setTimeout(fin, 900 + text.length * 260);
  });
}
// 优先用有道词典真人发音（需联网），失败时退回浏览器朗读；单词和例句都用它
function playText(raw) {
  stopAudio();
  const text = audioText(raw);
  return new Promise(res => {
    let done = false, fbUsed = false, started = false;
    const fin = () => { if (!done) { done = true; res(); } };
    const fallback = () => { if (fbUsed || done) return; fbUsed = true; ttsP(text).then(fin); };
    if (!navigator.onLine) { fallback(); return; }
    const a = new Audio('https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(text) + '&type=' + (S.accent === 'uk' ? 1 : 2));
    curAudio = a;
    a.onplaying = () => { started = true; };
    a.onended = fin;
    a.onerror = () => { started ? fin() : fallback(); };
    a.play().catch(() => { if (!started) fallback(); });
    setTimeout(fin, Math.max(4000, text.length * 120));
  });
}
const playWord = () => W && playText(W.text);

let actx = null;
function beep(freq, dur, type = 'sine', vol = 0.06, delay = 0) {
  if (!S.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime + delay;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t0); o.stop(t0 + dur);
  } catch (e) {}
}

  return `font-size:min(${px}px,${vw}vw)`;
}

// 例句里把当前单词（含 -s、-ed 等变形）标黄
function highlight(en, word) {

  main.querySelectorAll('[data-a]').forEach(b => b.onclick = () => summaryAction(b.dataset.a));
}
function summaryAction(a) {
  if (a === 'follow' || a === 'dictation') { setMode(a); return; }
  if (a === 'review') { startReview(); return; }
  if (a === 'again') { buildQueue(false); enterWord(); return; }
  if (a === 'nextunit') { S.unit = S.unit + 1; buildQueue(false); enterWord(); return; }
  if (a === 'redo') {
    queue = results.filter(r => !r.ok).map(r => r.item);
    results = []; finished = false; S.idx = 0;
    enterWord();
  }
}

/* ================= 流程 ================= */
function enterWord() {
  stopAudio();
  resetKb();
  finished = false;
  prepWord();
  save();
  render();
  if (!W) return;
  if (S.mode === 'dictation' || S.autoPlay) setTimeout(() => { if (W && !W.done) playWord(); }, 250);
  focusKb();
}
function next() {
  if (!queue.length) return;
  if (S.idx < queue.length - 1) { S.idx++; enterWord(); }
  else { finished = true; W = null; stopAudio(); save(); render(); sessionFx(); }
}
// 今日复习：出所有到期的词（最多 REVIEW_CAP 个），用听写练
function startReview() {
  closeModal();
  if (S.mode === 'learn') S.mode = 'dictation';
  S.unit = 'due';
  buildQueue(false);
  enterWord();
}
// 练错词：错词本里的词，用听写练；一次拼对就从错词本移出
function startWrong() {
  closeModal();
  if (S.mode === 'learn') S.mode = 'dictation';
  S.unit = 'wrong';
  buildQueue(false);
  enterWord();
}
// 学新词：从当前这本书开始，找第一个还没练过的词所在的单元
function startNew() {
  closeModal();
  const books = [BOOKS[S.book], ...BOOK_DATA.filter(b => b.id !== S.book)];
  for (const b of books) {
    for (let i = 0; i < b.units.length; i++) {
      if (b.units[i].words.some(w => !S.prog[keyOf(w)])) {
        S.book = b.id; S.unit = i; S.mode = 'learn';
        buildQueue(false);
        S.idx = Math.max(0, queue.findIndex(w => !S.prog[keyOf(w)]));
        enterWord();
        return;
      }
    }
  }
  toast('所有单词都练过啦，去复习吧');
}
function prev() {
  if (!queue.length) return;
  if (finished) { finished = false; enterWord(); return; }
  if (S.idx > 0) { S.idx--; enterWord(); }
}
function setMode(m) {
  S.mode = m;
  if (finished) S.idx = 0;
  results = [];
  enterWord();
}
function focusKb() {
  if (S.mode !== 'learn' && !finished && W && !W.done) { try { kb.focus({preventScroll: true}); } catch (e) {} }
}
function onLetter(k) {
  if (finished || S.mode === 'learn' || !W || W.done) return;
  const need = W.req[W.pos];
  if (!need) return;
  if (k.toLowerCase() === need.ch.toLowerCase()) {
    W.pos++; W.err = 0; W.wrongFlash = null; W.pop = W.pos - 1;
    const nextReq = W.req[W.pos];
    if (!nextReq) { complete(); return; }
    if (nextReq.si !== need.si) {
      sfxSyl();                                                                           // 拼完一节：叮咚
      if (S.sylSpeak) ttsP(spokenSyl(W.syls[need.si].t), 0.8);                            // 并读出这一节
    } else sfxTick(W.pos - 1);                                                            // 每拼对一个字母：音阶往上走一格
    renderTyping();
  } else {
    W.err++; W.hadError = true;
    W.wrongFlash = {r: W.pos, key: k};
    if (W.err >= 2) W.hint = need.si;
    sfxWrong();
    renderTyping(true);
    const tok = W.token;
    clearTimeout(onLetter.t);
    onLetter.t = setTimeout(() => { if (W && W.token === tok && W.wrongFlash) { W.wrongFlash = null; renderTyping(); } }, 400);
  }
}
function complete() {
  W.done = true;
  W.ok = !W.hadError;
  W.wrongFlash = null;
  results.push({item: W.item, ok: W.ok});
  const key = keyOf(W.item);
  if (!W.ok) {
    const e = S.wrong[key] || {item: W.item, count: 0};
    e.item = W.item;
    e.count++;
    S.wrong[key] = e;
  } else if (S.unit === 'wrong') {
    delete S.wrong[key];
  }
  const rec = recordResult(W.item, W.ok, S.mode);
  combo = W.ok ? combo + 1 : 0;
  save();
  renderHeader();
  renderTyping();
  const tok = W.token;
  if (W.ok) {
    afterRight(tok, celebrateWord(), rec);
  } else {
    sfxOops();                                                  // 拼错的不扣分，轻轻提示一下，停下来等 Enter
    setTimeout(() => { if (W && W.token === tok) playWord(); }, 400);
  }
}
// 拼对之后：夸一句（和弹字同步）→ 再读一遍单词 → 自动下一个。中途按 Enter/→ 随时跳过
async function afterRight(tok, praise, rec) {
  const alive = () => W && W.token === tok;
  if (rec.goalHit) goalFx();
  await sleep(S.praise ? 80 : 250);
  if (!alive()) return;
  await Promise.race([sayPraise(rec.goalHit ? 'Well done!' : praise), sleep(2500)]);
  if (!alive()) return;
  await Promise.race([playWord(), sleep(3500)]);
  if (!alive()) return;
  await sleep(250);
  if (alive()) next();
}
function goalFx() { rain(150); sfxFanfare(); toast('🎯 今日目标完成！'); }
function hint() {
  if (!W || W.done || S.mode === 'learn') return;
  W.hint = W.req[W.pos].si;
  W.hadError = true;
  renderTyping();
}
function reveal() {
  if (!W || W.done || S.mode === 'learn') return;
  W.hadError = true;
  W.pos = W.req.length;
  complete();
}

/* ================= 弹窗 ================= */
function openModal(html) { $('#box').innerHTML = html; $('#modal').classList.add('on'); }
function closeModal() { $('#modal').classList.remove('on'); focusKb(); }
$('#modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };

function editSplit(item) {
  const cur = getLP(item);
  const v = prompt(
    '格式：字母拆分 | 音标拆分\n' +
    '. 分隔字母组合，/ 分隔音节，空格分隔单词；音标和字母组合一一对应，- 表示不发音\n' +
    '例：c.l.a.ss/r.oo.m | ˈk.l.ɑː.s/r.uː.m\n清空后确定 = 恢复默认',
    cur.l + ' | ' + cur.p);
  if (v === null) return;
  const key = keyOf(item);
  if (!v.trim()) {
    delete S.custom[key];
  } else {
    const [l, p] = v.split('|').map(x => (x || '').trim());
    if (!l || !p) { alert('要同时写字母拆分和音标拆分，中间用 | 隔开。没有保存。'); return; }
    if (plain(l).toLowerCase() !== key) { alert('字母和原单词对不上，没有保存。\n原单词：' + plain(item.l)); return; }
    const r = parseSplit(l, p);
    if (r.error) { alert(r.error + '。没有保存。'); return; }
    S.custom[key] = {l: l.replace(/\s+/g, ' '), p: p.replace(/\s+/g, ' ')};
  }
  save();
  if (W && keyOf(W.item) === key) { prepWord(); render(); }
  if ($('#modal').classList.contains('on')) showList();
}
function splitHtml(item) {
  const syls = sylsOf(item);
  let html = '';
  syls.forEach((s, si) => {
    if (si) html += s.wi !== syls[si - 1].wi ? '&nbsp;&nbsp;' : '<span class="x">/</span>';
    html += `<span style="color:${color(si)}">` + s.chunks.map(c => c.p === '-' ? `<span class="d">${esc(c.l)}</span>` : esc(c.l)).join('') + '</span>';
  });
  return {html, ipa: fullIpa(syls)};
}
function showList() {
  const list = unitWords(S.unit);
  const title = S.unit === 'wrong' ? '错词本' : $('#unitLabel').textContent;
  openModal(`<h3>${esc(title)} · ${list.length} 个</h3>
    ${list.length ? '' : '<p class="sub">还没有单词</p>'}
    <table class="wl">${list.map((w, i) => {
      const sp = splitHtml(w);
      const wr = S.wrong[keyOf(w)];
      return `<tr>
        <td>${i + 1}</td>
        <td class="split" data-go="${i}">${sp.html}</td>
        <td class="pp">${esc(sp.ipa)}</td>
        <td>${esc(w.cn)}${S.unit === 'wrong' && wr ? ` <span class="sub">错 ${wr.count} 次</span>` : ''}</td>
        <td style="text-align:right;white-space:nowrap"><button class="pill" data-edit="${i}">改拆分</button></td>
      </tr>`;
    }).join('')}</table>
    <p class="sub">点单词跳过去练习 · 淡色字母不发音</p>`);
  $('#box').querySelectorAll('[data-go]').forEach(td => td.onclick = () => {
    const w = list[+td.dataset.go];
    const i = queue.findIndex(q => keyOf(q) === keyOf(w));
    if (i < 0) return;
    S.idx = i;
    closeModal();
    enterWord();
  });
  $('#box').querySelectorAll('[data-edit]').forEach(b => b.onclick = () => editSplit(list[+b.dataset.edit]));
}
function showStats() {
  const st = stats(), t = today(), goal = S.goal, w = st.today.w;
  const pct = Math.min(100, Math.round(w / goal * 100));
  const rate = st.today.n ? Math.round(st.today.ok / st.today.n * 100) : 0;
  const days = [];
  for (let i = 6; i >= 0; i--) { const dd = addDays(t, -i); days.push({dd, w: (S.days[dd] || {}).w || 0, now: i === 0}); }
  const max = Math.max(goal, 5, ...days.map(x => x.w));
  const bars = days.map(x => `<div class="bar"><span>${x.w || ''}</span><div class="bw"><div class="col ${x.now ? 'now' : ''}" style="height:${Math.round(x.w / max * 100)}%"></div></div>
    <small>${x.now ? '今天' : '周' + '日一二三四五六'[parseDay(x.dd).getDay()]}</small></div>`).join('');
  const plan = {tomorrow: 0, later: 0};
  for (const k in S.prog) {
    if (!ALLW[k]) continue;
    const d = S.prog[k].due;
    if (d > t) d === addDays(t, 1) ? plan.tomorrow++ : plan.later++;
  }
  const rows = BOOK_DATA.map(b => {
    const keys = [...new Set(b.units.flatMap(u => u.words.map(keyOf)))];
    let l = 0, m = 0;
    keys.forEach(k => { const p = S.prog[k]; if (p) { l++; if (p.box >= MASTERED_BOX) m++; } });
    const n = keys.length;
    return `<div class="brow"><span>${esc(b.name)}</span><div class="pbar"><i class="m" style="width:${m / n * 100}%"></i><i class="l" style="width:${(l - m) / n * 100}%"></i></div><small>已学 ${l}/${n} · 掌握 ${m}</small></div>`;
  }).join('');
  openModal(`<h3>学习统计</h3>
    <div class="sgrid">
      <div class="stat"><b>🔥 ${st.streak}</b><small>连续打卡（天）</small></div>
      <div class="stat"><b>${w}</b><small>今日练习（词）${st.today.n ? ' · 对 ' + rate + '%' : ''}</small></div>
      <div class="stat"><b>${st.learned}<small>/${st.total}</small></b><small>已学</small></div>
      <div class="stat"><b>${st.mastered}</b><small>已掌握</small></div>
    </div>
    <div>今日目标 ${w} / ${goal} 个词${w >= goal ? ' 🎉 已完成' : ''}</div>
    <div class="goalbar ${w >= goal ? 'full' : ''}"><i style="width:${pct}%"></i></div>
    <h4>最近 7 天（每天练了多少个词）</h4>
    <div class="bars">${bars}</div>
    <h4>复习安排</h4>
    <div class="plan"><div><b>${st.due}</b>今天要复习</div><div><b>${plan.tomorrow}</b>明天</div><div><b>${plan.later}</b>更晚</div></div>
    <h4>各册进度</h4>
    ${rows}
    <p class="sub" style="text-align:left">「掌握」= 隔了 7 天以上，听写还能一次拼对。词的总数里，重复出现的词只算一次。</p>
    <div class="sumbtns">
      <button class="pill pri" id="bsReview" ${st.due ? '' : 'disabled'}>开始复习（${st.due}）</button>
      <button class="pill" id="bsWrong" ${Object.keys(S.wrong).length ? '' : 'disabled'}>练错词（${Object.keys(S.wrong).length}）</button>
      <button class="pill" id="bsNew">学新词</button>
    </div>`);
  $('#bsReview').onclick = startReview;
  $('#bsNew').onclick = startNew;
  $('#bsWrong').onclick = startWrong;
}
function showSettings() {
  const chk = (k, label) => `<div class="row"><label><input type="checkbox" data-k="${k}" ${S[k] ? 'checked' : ''}>${label}</label></div>`;
  openModal(`<h3>设置</h3>
    <div class="row"><span>发音</span><span>
      <label style="display:inline-flex;gap:4px;margin-right:12px"><input type="radio" name="acc" value="uk" ${S.accent === 'uk' ? 'checked' : ''}>英式（和课本一致）</label>
      <label style="display:inline-flex;gap:4px"><input type="radio" name="acc" value="us" ${S.accent === 'us' ? 'checked' : ''}>美式</label></span></div>
    ${chk('autoPlay', '切换单词时自动发音（听写模式总是自动发音）')}
    ${chk('sylSpeak', '跟写、听写时，拼完一节读一节')}
    ${chk('showSent', '显示例句')}
    ${chk('sound', '音效（拼字的叮咚声、对错提示音）')}
    ${chk('praise', '拼对后读出夸奖的话（Good! Great! 等）')}
    ${chk('fx', '庆祝动画（彩带、弹出的夸奖字）')}
    ${chk('shuffle', '打乱顺序')}
    <div class="row"><span>每日目标</span><select id="selGoal">${[5, 10, 15, 20, 30, 50].map(n => `<option value="${n}" ${S.goal === n ? 'selected' : ''}>${n} 个词</option>`).join('')}</select></div>
    <div class="row"><span>错词本 ${Object.keys(S.wrong).length} 个</span><button class="pill" id="bClrWrong">清空错词本</button></div>
    <div class="row"><span>改过的拆分 ${Object.keys(S.custom).length} 个</span><button class="pill" id="bClrSplit">全部恢复默认</button></div>
    <div class="row"><span>学习记录（复习进度、打卡）</span><button class="pill" id="bClrProg">清空学习记录</button></div>
    <p class="sub">记录保存在这台电脑的浏览器里。发音优先用有道词典真人发音（要联网），没网时用浏览器自带朗读。音标是英式的，切到美式发音音标不变。</p>`);
  $('#box').querySelectorAll('[data-k]').forEach(c => c.onchange = () => {
    S[c.dataset.k] = c.checked; save();
    if (c.dataset.k === 'shuffle') { buildQueue(false); enterWord(); }
    else if (c.dataset.k === 'showSent') render();
  });
  $('#box').querySelectorAll('[name=acc]').forEach(r => r.onchange = () => { S.accent = r.value; save(); });
  $('#selGoal').onchange = e => { S.goal = +e.target.value; save(); updateChip(); };
  $('#bClrProg').onclick = () => {
    if (!confirm('清空所有复习进度和打卡记录？（错词本、改过的拆分不受影响）')) return;
    S.prog = {}; S.days = {}; save();
    if (S.unit === 'due') { S.unit = 0; buildQueue(false); enterWord(); } else renderHeader();
    showSettings();
  };
  $('#bClrWrong').onclick = () => { if (confirm('确定清空错词本？')) { S.wrong = {}; save(); if (S.unit === 'wrong') { buildQueue(false); enterWord(); } else renderHeader(); showSettings(); } };
  $('#bClrSplit').onclick = () => { if (confirm('把改过的拆分全部恢复默认？')) { S.custom = {}; save(); prepWord(); render(); showSettings(); } };
}

/* ================= 事件 ================= */
$('#tabs').onclick = e => { const b = e.target.closest('.tab'); if (b && b.dataset.m !== S.mode) setMode(b.dataset.m); };
$('#selBook').onchange = e => { S.book = e.target.value; if (S.unit !== 'wrong' && S.unit !== 'due') S.unit = 0; buildQueue(false); enterWord(); e.target.blur(); };
$('#selUnit').onchange = e => {
  const v = e.target.value;
  S.unit = isNaN(+v) ? v : +v;
  if (v === 'due' && S.mode === 'learn') S.mode = 'dictation'; // 复习要动手拼，不是看一遍
  buildQueue(false); enterWord(); e.target.blur();
};
$('#bStat').onclick = showStats;
$('#bList').onclick = showList;
$('#bSet').onclick = showSettings;
$('#bPrev').onclick = prev;
$('#bNext').onclick = next;
main.addEventListener('click', e => { if (!e.target.closest('button,a,.sents')) focusKb(); });

document.addEventListener('keydown', e => {
  if ($('#modal').classList.contains('on')) { if (e.key === 'Escape') closeModal(); return; }
  if (e.target.tagName === 'SELECT' || (e.target.tagName === 'INPUT' && e.target !== kb)) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (k === 'Process' || e.keyCode === 229) return; // 手机软键盘，交给 input 事件
  if (finished) {
    if (k === 'Enter') { e.preventDefault(); const b = main.querySelector('.pill.pri') || main.querySelector('[data-a]'); b && b.click(); }
    else if (k === 'ArrowLeft') { e.preventDefault(); prev(); }
    return;
  }
  if (k === 'ArrowRight') { e.preventDefault(); next(); return; }
  if (k === 'ArrowLeft') { e.preventDefault(); prev(); return; }
  if (!W) return;
  if (S.mode === 'learn') {
    if (k === ' ') { e.preventDefault(); playWord(); }
    else if (k === 'Enter') { e.preventDefault(); next(); }
    else if (k === 'r' || k === 'R') { e.preventDefault(); readBySyllable(); }
    return;
  }
  if (k === ' ') { e.preventDefault(); playWord(); return; }
  if (k === 'Tab') { e.preventDefault(); hint(); return; }
  if (k === 'Escape') { e.preventDefault(); reveal(); return; }
  if (k === 'Enter') { e.preventDefault(); if (W.done) next(); return; }
  if (/^[a-zA-Z]$/.test(k)) { e.preventDefault(); onLetter(k); }
});

// 手机软键盘：keydown 拿不到字母，从隐藏输入框读。
// 输入法组字（候选词）期间不能清空输入框，否则会打断输入法；改成记住处理到第几个字符，只处理新增的部分
let kbPrev = '';
function readKb() {
  // 只看字母：中文输入法组字时会往里插分词符（a'bout、ab ou t），或者最后上屏成汉字，
  // 不去掉的话插入点后面的字母会被当成新输入再算一遍，明明没拼错也判错
  const v = kb.value.replace(/[^a-zA-Z]/g, '');
  // 和上次的内容比，只处理公共前缀之后的新字符：既能处理逐个追加，也能处理"删掉最后一个再换一个"
  let same = 0;
  while (same < v.length && same < kbPrev.length && v[same] === kbPrev[same]) same++;
  const fresh = v.slice(same);
  kbPrev = v;
  for (const ch of fresh) onLetter(ch);
}
function resetKb() { kb.value = ''; kbPrev = ''; }
kb.addEventListener('input', readKb);
kb.addEventListener('compositionend', () => { readKb(); setTimeout(resetKb, 0); });
kb.addEventListener('blur', () => setTimeout(resetKb, 0));

// 键盘弹起检测：可见区域比整窗高度明显变矮，就认为键盘开着
let vvMax = 0;
function onViewport() {
  const vv = window.visualViewport;
  if (!vv) return;
  vvMax = Math.max(vvMax, vv.height, window.innerHeight);
  // 有的浏览器键盘弹起时 innerHeight 也跟着变小，所以和见过的最大高度比
  const open = isTouch && document.activeElement === kb && vv.height < vvMax * 0.8;
  document.documentElement.style.setProperty('--vvh', vv.height + 'px');
  document.documentElement.classList.toggle('kbopen', !!open);
  if (open) window.scrollTo(0, 0);                 // iOS 键盘弹起时会把整页往上推，拉回来
}
if (window.visualViewport) {
  visualViewport.addEventListener('resize', onViewport);
  visualViewport.addEventListener('scroll', onViewport);
}
kb.addEventListener('focus', () => setTimeout(onViewport, 300));
kb.addEventListener('blur', () => setTimeout(onViewport, 100));
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};

/* ================= 启动 ================= */
buildQueue(true);
enterWord();
{ const n = dueList().length; if (n) toast(`⏰ 今天有 ${n} 个词要复习，在上面的单元里选「今日复习」`); }
</script>
</body>
</html>
