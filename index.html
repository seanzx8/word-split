<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, interactive-widget=resizes-content">
<title>WordSplit</title>
<style>
:root{--bg:#0e0e16;--panel:#171725;--line:#2a2a3d;--text:#e8e8f0;--dim:#8a8aa3;--accent:#8b7cf6;--ok:#34d399;--bad:#f87171;--ipa:"Segoe UI","Lucida Sans Unicode","Arial Unicode MS","Charis SIL","Doulos SIL",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
body{display:flex;flex-direction:column;min-height:100vh}
button,select,input{font:inherit;color:inherit}
a{color:var(--dim)}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;white-space:nowrap}
.logo i{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#8b7cf6,#38bdf8);display:inline-block}
.tabs{display:flex;gap:6px;margin:0 auto;background:var(--panel);padding:4px;border-radius:12px}
.tab{border:1px solid transparent;background:none;padding:6px 14px;border-radius:9px;cursor:pointer;color:var(--dim);white-space:nowrap}
.tab b{font-weight:400;opacity:.6;margin-right:6px;font-size:12px}
.tab.on{color:var(--text);border-color:#5b50b8;background:#211f38}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,.btn{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px 10px;cursor:pointer}
select option{background:var(--panel)}
.btn:hover,select:hover{border-color:#4a4a66}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:safe center;padding:20px;gap:20px;user-select:none;overflow-y:auto}
footer{display:flex;align-items:center;justify-content:center;gap:18px;padding:14px;color:var(--dim);font-size:13px;flex-wrap:wrap}
footer .nav{background:none;border:none;color:var(--dim);cursor:pointer;font-size:18px;padding:2px 10px}
footer .nav:hover{color:var(--text)}
footer .count{color:var(--text);font-variant-numeric:tabular-nums}
/* 单词行 */
.wordrow{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;column-gap:.45em;row-gap:.35em;font-weight:700;line-height:1.15;max-width:100%}
.wgroup{display:inline-flex;align-items:flex-end;white-space:nowrap}
/* 认读模式：音节 > 字母组合（下面标音标） */
.syl,.sep{display:inline-flex;flex-direction:column;align-items:stretch}
.syl{cursor:pointer;transition:transform .15s}
.chunks{display:flex;justify-content:center;gap:.07em}
.ck{display:flex;flex-direction:column;align-items:center;min-width:.3em}
.ck .cl{color:var(--c);transition:text-shadow .15s}
.ck .cp{font-family:var(--ipa);font-size:.25em;font-weight:500;color:var(--c);opacity:.9;margin-top:.15em;white-space:nowrap;min-height:1.3em}
.ck.silent .cl{opacity:.32}
.ck.silent .cp{opacity:.45}
.sep .st{color:#50506a;font-weight:300;padding:0 .14em;font-size:.55em;align-self:center;margin-bottom:1.1em}
.sl{height:2px;background:#5d5d7a;margin-top:.12em;position:relative}
.syl .sl::before{content:"";position:absolute;left:0;bottom:0;width:2px;height:10px;background:#5d5d7a}
.wgroup .syl:last-child .sl::after{content:"";position:absolute;right:0;bottom:0;width:2px;height:10px;background:#5d5d7a}
.syl:hover{transform:translateY(-3px)}
.syl.speak{transform:scale(1.08)}
.syl.speak .cl{text-shadow:0 0 22px var(--c)}
.wordrow.speakall .cl{text-shadow:0 0 18px var(--c)}
.ipa{font-family:var(--ipa);font-size:clamp(18px,2.4vw,24px);color:#c9c9dc;letter-spacing:.02em}
/* 跟写 / 听写 */
.slot{display:inline-flex;flex-direction:column;align-items:stretch}
.slot .chars{display:flex;white-space:nowrap;font-family:ui-monospace,"Cascadia Mono","Cascadia Code",Consolas,"SF Mono",Menlo,"Roboto Mono","Droid Sans Mono",monospace;letter-spacing:.02em}
/* 等宽字体：每个字母宽度一样，w、m 不会挤到旁边，听写时也看不出是宽字母还是窄字母 */
.ch{display:inline-block;text-align:center;position:relative}
.ch.hidden{color:transparent}
.ch.ghost{color:var(--c);opacity:.25}
.ch.done{color:var(--c)}
.ch.wrong{color:var(--bad)}
.ch.punct{color:var(--dim)}
.ch.cur::after{content:"";position:absolute;left:15%;right:15%;bottom:.04em;height:3px;border-radius:2px;background:#fff;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.slot .ul{height:4px;border-radius:2px;background:#33334a;margin-top:.14em;transition:background .2s}
.slot.active .ul{background:var(--accent)}
.slot.full .ul{background:var(--c);opacity:.55}
.tsep{color:#45455e;font-weight:300;font-size:.55em;margin:0 .18em .5em;align-self:flex-end}
.shake{animation:shake .3s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.wordrow.win{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.06)}}
.cn{font-size:clamp(22px,3.2vw,34px);font-weight:600;text-align:center}
.ctrls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
.round{width:40px;height:40px;border-radius:50%;border:1px solid #4a4a66;background:var(--panel);cursor:pointer;font-size:14px;flex:none}
.round.sm{width:30px;height:30px;font-size:11px}
.round:hover,.pill:hover{border-color:var(--accent)}
.pill{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px}
.pill.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.sub{font-size:13px;color:var(--dim);text-align:center}
.status{font-size:16px;min-height:24px;text-align:center}
.status.ok{color:var(--ok)}
.status.bad{color:var(--bad)}
.tapkb{border:1px dashed #4a4a66;border-radius:10px;padding:8px 14px;color:var(--dim);font-size:14px}
/* 例句 */
.sents{width:min(760px,100%);display:flex;flex-direction:column;gap:10px;user-select:text}
.sent{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.sent .en{font-size:17px;line-height:1.45}
.sent .en mark{background:none;color:#fbbf24;font-weight:700}
.sent .zh{font-size:14px;color:var(--dim);margin-top:2px}
/* 小结 */
.sum{text-align:center;max-width:720px}
.sum h2{font-size:30px;margin:0 0 10px}
.sum p{color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0}
.chip{background:var(--panel);border:1px solid #4b2a33;border-radius:8px;padding:5px 10px;font-size:15px}
.chip small{color:var(--dim);margin-left:6px}
.sumbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
/* 弹窗 */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
#modal.on{display:flex}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(760px,100%);max-height:85vh;overflow:auto}
.box h3{margin:0 0 14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row label{display:flex;gap:8px;align-items:center;cursor:pointer}
.wl{width:100%;border-collapse:collapse}
.wl td{padding:7px 6px;border-bottom:1px solid var(--line);font-size:15px;vertical-align:middle}
.wl td:first-child{color:var(--dim);width:36px}
.wl tr:hover td{background:#1d1d2e}
.wl .split{font-weight:700;font-size:18px;cursor:pointer;white-space:nowrap}
.wl .split .x{color:#50506a;font-weight:300;margin:0 2px}
.wl .split .d{opacity:.35}
.wl .pp{font-family:var(--ipa);color:var(--dim);font-size:14px;white-space:nowrap}
.wl button{font-size:12px;padding:3px 8px}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#2a2440;border:1px solid var(--accent);padding:8px 16px;border-radius:10px;display:none;z-index:20}
/* 隐藏输入框放在顶部：浏览器会把获得焦点的输入框滚到可见处，放顶部就不会把页面往上顶。字号 16px 防止 iOS 自动放大 */
#kb{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;border:0;padding:0;margin:0;font-size:16px;caret-color:transparent;background:transparent;color:transparent;pointer-events:none}
/* 手机键盘弹起：页面高度跟着可见区域走，内容靠上排，不被键盘挡住 */
html.kbopen,html.kbopen body{height:var(--vvh,100vh);min-height:0;overflow:hidden}
html.kbopen header{padding:6px 10px;gap:6px}
html.kbopen header .logo,html.kbopen header .tools,html.kbopen #bStat{display:none}
html.kbopen .tabs{width:100%;justify-content:center}
html.kbopen main{justify-content:flex-start;padding:8px 12px;gap:7px;overflow-y:auto}
html.kbopen footer,html.kbopen .tapkb,html.kbopen .sents{display:none}
html.kbopen .cn{font-size:22px;order:-1}  /* 键盘开着时中文放最上面，永远不会被挡 */
html.kbopen #wrow{font-size:min(9vw,36px,calc(var(--vvh,100vh) * .12))!important}
html.kbopen .status{min-height:0;font-size:15px}
html.kbopen .ctrls{gap:8px}
html.kbopen .ctrls .pill{padding:5px 11px;font-size:13px}
html.kbopen .ipa{font-size:17px}
html.kbopen .praise{top:8%}
/* 今日进度入口 */
.chip-stat{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip-stat:hover{border-color:var(--accent)}
.chip-stat .dot{background:var(--accent);color:#fff;border-radius:999px;padding:0 7px;font-size:12px;line-height:18px;min-width:18px;text-align:center}
.pill:disabled{opacity:.4;cursor:default}
.pill:disabled:hover{border-color:var(--line)}
/* 庆祝效果 */
#fx{position:fixed;inset:0;pointer-events:none;z-index:30}
.praise{position:fixed;left:50%;top:17%;transform:translateX(-50%);z-index:31;pointer-events:none;font-size:clamp(34px,7vw,64px);font-weight:800;text-align:center;white-space:nowrap;background:linear-gradient(90deg,#fbbf24,#f472b6,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent;animation:praise 1.1s ease-out forwards;filter:drop-shadow(0 4px 14px rgba(139,124,246,.45))}
.praise small{display:block;font-size:.32em;font-weight:600;-webkit-text-fill-color:#fbbf24;margin-top:2px}
@keyframes praise{0%{opacity:0;transform:translate(-50%,20px) scale(.5)}20%{opacity:1;transform:translate(-50%,0) scale(1.15)}35%{transform:translate(-50%,0) scale(1)}80%{opacity:1;transform:translate(-50%,-14px)}100%{opacity:0;transform:translate(-50%,-34px)}}
.ch.pop{animation:chpop .22s ease-out}
@keyframes chpop{0%{transform:scale(1.5) translateY(-.08em)}100%{transform:none}}
.ch.wave{animation:wave .5s ease-out both}
@keyframes wave{0%{transform:none}35%{transform:translateY(-.22em) scale(1.12)}100%{transform:none}}
.stars{font-size:46px;letter-spacing:6px;margin:6px 0}
.stars span{display:inline-block;filter:grayscale(1) opacity(.25)}
.stars span.on{filter:none;animation:starpop .5s cubic-bezier(.3,1.6,.5,1) both;animation-delay:var(--d)}
@keyframes starpop{0%{transform:scale(0) rotate(-60deg)}100%{transform:none}}
/* 统计面板 */
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{background:#1d1d2e;border-radius:12px;padding:12px 6px;text-align:center}
.stat b{display:block;font-size:26px;line-height:1.2}
.stat small{color:var(--dim);font-size:12px}
.goalbar{height:12px;border-radius:8px;background:#262638;overflow:hidden;margin:6px 0 4px}
.goalbar i{display:block;height:100%;background:linear-gradient(90deg,#8b7cf6,#38bdf8);border-radius:8px;transition:width .5s}
.goalbar.full i{background:linear-gradient(90deg,#34d399,#facc15)}
.box h4{margin:18px 0 8px;font-size:14px;color:var(--dim);font-weight:600}
.bars{display:flex;gap:6px;align-items:flex-end}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--dim)}
.bar .bw{height:80px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.bar .col{width:70%;max-width:34px;min-height:3px;background:#3a3a55;border-radius:5px 5px 0 0}
.bar .col.now{background:var(--accent)}
.plan{display:flex;gap:10px}
.plan div{flex:1;background:#1d1d2e;border-radius:10px;padding:8px;text-align:center;font-size:13px;color:var(--dim)}
.plan b{display:block;font-size:20px;color:var(--text)}
.brow{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.brow small{color:var(--dim);white-space:nowrap}
.pbar{display:flex;height:10px;border-radius:6px;background:#262638;overflow:hidden}
.pbar .m{background:var(--ok)}
.pbar .l{background:var(--accent)}
@media (max-width:640px){
  .chip-stat{margin-left:auto}
  .sgrid{grid-template-columns:repeat(2,1fr)}
  .brow{grid-template-columns:1fr;gap:3px}
}
@media (max-width:640px){
  header{padding:10px;gap:8px}
  .tabs{order:3;margin:0;width:100%;justify-content:center}
  .tab{padding:6px 9px}
  .tools{width:100%;display:grid;grid-template-columns:1fr 1.4fr auto auto;gap:6px}
  .tools select,.tools .btn{min-width:0;font-size:14px;padding:6px}
  .sent .en{font-size:15px}
}
</style>
</head>
<body>
<header>
  <div class="logo"><i></i>WordSplit</div>
  <div class="tabs" id="tabs">
    <button class="tab" data-m="learn"><b>01</b>拆分认读</button>
    <button class="tab" data-m="follow"><b>02</b>跟写</button>
    <button class="tab" data-m="dictation"><b>03</b>听写</button>
  </div>
  <button class="chip-stat" id="bStat" title="学习统计"></button>
  <div class="tools">
    <select id="selBook"></select>
    <select id="selUnit"></select>
    <button class="btn" id="bList">单词表</button>
    <button class="btn" id="bSet">设置</button>
  </div>
</header>
<main id="stage"></main>
<footer>
  <span id="unitLabel"></span>
  <button class="nav" id="bPrev" title="上一个（←）">←</button>
  <span class="count" id="count"></span>
  <button class="nav" id="bNext" title="下一个（→）">→</button>
  <span id="keys"></span>
</footer>
<div id="modal"><div class="box" id="box"></div></div>
<div id="toast"></div>
<input id="kb" type="text" inputmode="text" enterkeyhint="next" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="输入字母" data-lpignore="true" data-1p-ignore="true" data-form-type="other">

<script>
/* ================= 词表 =================
 * 由 tools/build.py 根据 tools/words.txt（拆分、音标、中文）和 TypeWords 官网词库（例句）生成。
 * 不要手改下面这段：要改拆分就改 words.txt 再运行 python tools/build.py，或者在页面「单词表」里改。
 */

const BOOK_DATA = [{"id":"3a","name":"人教 三年级上册","units":[{"name":"Unit 1 Hello!","words":[{"l":"r.u/l.er","p":"ˈr.uː/l.ə","cn":"尺子","s":[["He cracked me on the head with a ruler.","他用尺子猛击我的头部。"],["The ruler cracked and splintered into pieces.","尺子裂了，碎成了片。"],["The former military ruler of Lesotho has been placed under house arrest.","莱索托前军事统治者已被软禁了。"]]},{"l":"p.e.n/c.i.l","p":"ˈp.e.n/s.ə.l","cn":"铅笔","s":[["I snapped the pencil in half.","我啪的一声将铅笔折成两段。"],["I'll get a pencil and paper.","我去拿铅笔和纸。"],["He made marks with a pencil.","他用铅笔作了记号。"]]},{"l":"e/r.a/s.er","p":"ɪ/ˈr.eɪ/z.ə","cn":"橡皮","s":[["I hide the eraser in her boot.","我把橡皮擦藏进了她的靴子里。"],["My eraser is missing.","我的橡皮不见了。"],["On the teacher's desk there's an eraser.","在老师的桌上有一块橡皮擦。"]]},{"l":"c.r.ay/o.n","p":"ˈk.r.eɪ/ə.n","cn":"蜡笔","s":[["Someone had scribbled all over the table in crayon.","不知谁用蜡笔胡写乱画，桌面上都涂满了。"],["He colored the picture with crayon.","他用蜡笔给画上色。"],["He coloured the picture with crayon.","他用蜡笔给画上色。"]]},{"l":"b.a.g","p":"b.æ.ɡ","cn":"包；书包","s":[["Someone's left their bag behind.","有人把包落下了。"],["She clutched her bag protectively.","她用力抓紧护着自己的提包。"],["Is this your bag, missus?","大姐，这是你的袋子吗？"]]},{"l":"p.e.n","p":"p.e.n","cn":"钢笔","s":[["This dratted pen won't work.","这该死的笔写不出字来。"],["Where's that goddamned pen?","那该死的笔哪去了？"],["Can I borrow a pen please?","我可以借支笔吗？"]]},{"l":"p.e.n/c.i.l b.o.x","p":"ˈp.e.n/s.ə.l b.ɒ.ks","cn":"铅笔盒","s":[["Put away your pencil box!","把你的铅笔盒收起来！"],["Please open your pencil box.","请打开你的文具盒。"],["Here's a pencil-box.","这是一个铅笔盒。"]]},{"l":"b.oo.k","p":"b.ʊ.k","cn":"书","s":[["Shoot! I've forgotten my book!","倒霉！我忘了带书！"],["I'm just finishing my book.","眼下我正在完成我的一本书。"],["That's cheating in my book.","依我看那是欺骗。"]]},{"l":"n.o","p":"n.əʊ","cn":"不；没有","s":[["She had no money coming in and no funds.","她既无固定收入也无存款。"],["Hygiene was nonexistent: no running water, no bathroom.","卫生根本不存在：没有自来水，没有浴室。"],["There was no fatherly affection, no display of sentiment.","没有像父爱般的亲昵，没有显得过于激动。"]]},{"l":" ":"c.a.k.e","p":"k.eɪ.k.-","cn":"蛋糕","s":[["That cake looks very tempting.","那蛋糕的样子让人嘴馋。"],["She cut the cake into fifths.","她把蛋糕切成五块。"],["This cake is very filling.","这种饼很能填饱肚子。"]]},{"l":"f.i.sh","p":"f.ɪ.ʃ","cn":"鱼；鱼肉","s":[["These fish are very aggressive.","这些鱼十分好斗。"],["The lakes abound with fish.","这些湖泊盛产鱼。"],["The fish were unwholesome and old.","这些鱼已经不新鲜了。"]]},{"l":"r.i.c.e","p":"r.aɪ.s.-","cn":"米饭","s":[["We eat rice every single day.","我们天天吃米饭。"],["Rice aspired to go to college.","赖斯渴望上大学。"],["Could you give the rice a stir?","你把米饭搅一搅好吗？"]]}]},{"name":"Unit 6 Happy birthday!","words":[{"l":"o.n.e","p":"wʌ.n.-","cn":"一","s":[["Knit one row, purl one row.","织一趟平针，织一趟反针。"],["One minus one is zero.","一减一等于零。"],["One more, please!","请再来一个！"]]},{"l":"t.w.o","p":"t.-.uː","cn":"二","s":[["The two meanings conflated.","这两种意思合并在了一起。"],["Two light ales please.","请来两杯淡麦芽啤酒。"],["He scored two goals and had another two near misses.","他攻进两球，另有两球也险些破门。"]]},{"l":"th.r.ee","p":"θ.r.iː","cn":"三","s":[["He drank three whole glasses.","他喝了满满三杯。"],["Three runners sprinted past.","三名运动员飞跑了过去。"],["He's got three children.","他有三个孩子。"]]},{"l":"f.our","p":"f.ɔː","cn":"四","s":[["She's four years his junior.","她比他小四岁。"],["She bid four hearts.","她叫四红桃。"],["He dribbled past four defenders.","他带球突破了4名防守球员。"]]},{"l":"f.i.v.e","p":"f.aɪ.v.-","cn":"五","s":[["Britain won five gold medals.","英国夺取了五块金牌。"],["She brought up five children.","她抚育了五个孩子。"],["He arrived around five o'clock.","他大约是五点钟到的。"]]},{"l":"s.i.x","p":"s.ɪ.ks","cn":"六","s":[["It's gone six o'clock already.","过了六点了。"],["She has completed six laps.","她跑完六圈了。"],["She's six months pregnant.","她怀孕六个月了。"]]},{"l":"s.e.v/e.n","p":"ˈs.e.v/ə.n","cn":"七","s":[["We started German in year seven.","我们在七年级开始学习德语。"],["The performance starts at seven.","演出七点开始。"],["She's seven months gone.","她怀孕七个月了。"]]},{"l":"eigh.t","p":"eɪ.t","cn":"八","s":[["The cut needed eight stitches.","这道伤口需要缝八针。"],["Wake up! It's eight o'clock.","醒醒吧！已经八点钟了。"],["Eight o'clock had already chimed.","已敲过八点钟了。"]]},{"l":"n.i.n.e","p":"n.aɪ.n.-","cn":"九","s":[["We still sighted nine yachts.","我们还是看到了九艘游艇。"],["Nine cases are still pending.","尚有九宗案件待决。"],["I got here just after nine.","我到达这里时刚过九点。"]]},{"l":"t.e.n","p":"t.e.n","cn":"十","s":[["Tickets cost ten dollars each.","每张票价为十元。"],["We're leaving round about ten.","我们十点钟左右出发。"],["It's ten past twelve.","现在十二点十分。"]]},{"l":"b.r.o.th/er","p":"ˈb.r.ʌ.ð/ə","cn":"兄弟","s":[["She's smarter than her brother.","她比她哥哥聪明。"],["He loved his brother deeply.","他深爱自己的哥哥。"],["My brother pledged Sigma Nu.","我哥哥宣誓加入Σ NU联谊会。"]]},{"l":"p.l.a.t.e","p":"p.l.eɪ.t.-","cn":"盘子","s":[["She heaped my plate with food.","她往我的盘子里夹了很多食物。"],["She heaped food on my plate.","她往我的盘子里夹了很多食物。"],["Don't touch that plate—it's hot!","别碰那个盘子，烫手！"]]}]}]},{"id":"3b","name":"人教 三年级下册","units":[{"name":"Unit 1 Welcome back to school!","words":[{"l":"U/K","p":"ˌjuː/ˈkeɪ","cn":"英国","s":[["The UK leant towards the US proposal.","英国倾向于美国的提案。"],["Who distributes our products in the UK?","谁在英国经销我们的产品？"],["The UK has refused to recognize the new regime.","英国已拒绝承认这个新的政权。"]]},{"l":"C.a.n/a/d.a","p":"ˈk.æ.n/ə/d.ə","cn":"加拿大","s":[["Until 2004, she lived in Canada.","到2004年为止，她一直住在加拿大。"],["They started life anew in Canada.","他们在加拿大开始新生活。"],["My aunt lives in Canada.","我的姑母住在加拿大。"]]},{"l":"U/S/A","p":"ˌjuː/es/ˈeɪ","cn":"美国","s":[["Do you need a visa for the USA?","你需要美国签证吗？"],["I bought a copy of \"USA Today\" from a street-corner machine.","我从售货机上买了一份《今日美国》。"],["Team USA reached the semifinals by defeating New Zealand in the second round.","美国队在第二轮击败新西兰队后进入了半决赛阶段。"]]},{"l":"Ch.i/n.a","p":"ˈtʃ.aɪ/n.ə","cn":"中国","s":[["China has always fascinated me.","中国一直令我心驰神往。"],["China is utterly different.","中国完全不一样。"],["The produce was labelled \"Made in China.\"","该产品上贴有“中国制造”的标签。"]]},{"l":"sh.e","p":"ʃ.iː","cn":"她","s":[["She doesn't work here, does she?","她不在此地工作，对吧？"],["She said that she couldn't come.","她说她来不了啦。"],["She thought she could reform him.","她觉得她可以使他洗心革面。"]]},{"l":"s.t.u/d.e.n.t","p":"ˈs.t.juː/d.ə.n.t","cn":"学生","s":[["No student is to leave the room.","学生一律不许离开这房间。"],["She's a student at Sussex University.","她是萨塞克斯大学的学生。"],["Student numbers are expanding rapidly.","学生人数在迅速增加。"]]},{"l":"p.u/p.i.l","p":"ˈp.juː/p.ə.l","cn":"小学生","s":[["These complex formulae are beyond the grasp of the average pupil.","这些复杂的公式是一般小学生不能理解的。"],["Amy was a pupil in Grade Three.","艾米是一名三年级的学生。"],["She is loved by every pupil.","她深受每个学生的喜爱。"]]},{"l":"h.e","p":"h.iː","cn":"他","s":[["He feels he is blameless.","他觉得自己是清白的。"],["He says he was framed.","他说他是被诬陷的。"],["He wouldn't come—he said he was too busy.","他不愿来，他说他太忙。"]]},{"l":"t.ea.ch/er","p":"ˈt.iː.tʃ/ə","cn":"老师","s":[["She's a very capable teacher.","她是一位能力很强的教师。"],["'Be quiet,' said the teacher.","“安静点！”老师说道。"],["As a teacher, he's a disaster.","他当老师压根儿就不称职。"]]},{"l":"b.oy","p":"b.ɔɪ","cn":"男孩","s":[["The boy has great potential.","这个男孩有很大的潜力。"],["He's the manager's blue-eyed boy.","他备受经理的青睐。"],["Have you been a bad boy?","你调皮了吗？"]]},{"l":"a.n.d","p":"æ.n.d","cn":"和","s":[["America and her partners are helping to rebuild roads and bridges and buildings.","美国及其伙伴正帮助重建道路、桥梁和楼房。"],["The room was dim and cool and quiet.","这房间昏暗、阴冷且安静。"],["Sara and I read the story and marvelled.","我和萨拉读了这个故事后惊叹不已。"]]},{"l":"g.ir.l","p":"ɡ.ɜː.l","cn":"女孩","s":[["An older girl befriended me.","一个年纪大些的女孩对我很友善。"],["My dear girl, you're wrong.","我亲爱的姑娘，你错了。"],["She's a really weird girl.","她真是个古怪的女孩。"]]},{"l":"n.ew","p":"n.juː","cn":"新的","s":[["New England is beautiful.","新英格兰很迷人。"],["This idea isn't new.","这主意不新鲜。"],["My new shoes squeak.","我的新皮鞋走路嘎吱嘎吱响。"]]},{"l":"f.r.ie.n.d","p":"f.r.e.n.d","cn":"朋友","s":[["My friend here saw it happen.","我的这位朋友目睹了事情的经过。"],["She's a very special friend.","她是我特别要好的朋友。"],["Jo is a very close friend.","乔是我们亲密的朋友。"]]},{"l":"t.o/d.ay","p":"t.ə/ˈd.eɪ","cn":"今天","s":[["I'm revising Geography today.","我今天复习地理。"],["It's flipping cold today!","今天冷得要命！"],["Blimey, it's hot today.","哎呀，今天真热。"]]}]},{"name":"Unit 2 My family","words":[{"l":"f.a/th.er","p":"ˈf.ɑː/ð.ə","cn":"父亲","s":[["His father hailed from Italy.","他父亲出生于意大利。"],["I miss thee, beloved father.","亲爱的父亲，我想念您。"],["My father sold real estate.","我父亲经营过房地产。"]]},{"l":"d.a.d","p":"d.æ.d","cn":"爸爸","s":[["Dad went out to milk the cows.","爸爸出去给牛挤奶去了。"],["Thanks Dad, you're an angel.","谢谢爸爸，你是个大好人。"],["For once, Dad is not complaining.","就这一次，爸爸没有抱怨。"]]},{"l":"m.a.n","p":"m.æ.n","cn":"男人","s":[["Man is not inherently violent.","人类并非生来就暴力。"],["He's a shallow, disagreeable man.","他是个浅薄、不友好的人。"],["He was an imposing man.","他是个仪表堂堂的男子汉。"]]},{"l":"w.o.m/a.n","p":"ˈw.ʊ.m/ə.n","cn":"女人","s":[["She's a very attractive woman.","她是个非常迷人的女子。"],["She's ever such a nice woman.","她是个非常好的女人。"],["She is an emancipated woman.","她是一位不受束缚的女性。"]]},{"l":"m.o.th/er","p":"ˈm.ʌ.ð/ə","cn":"母亲","s":[["Her mother had never remarried.","她的母亲没有再婚。"],["His mother overindulged him.","他母亲对他过于溺爱。"],["Her mother suffered from migraines.","她母亲患了偏头痛。"]]},{"l":"s.i.s/t.er","p":"ˈs.ɪ.s/t.ə","cn":"姐妹","s":[["And how is my sainted sister?","我那大好人姐姐怎么样？"],["His sister Sarah helped him.","他姐姐萨拉帮助了他。"],["My other sister is a doctor.","我的另一个妹妹是医生。"]]},{"l":"b.r.o.th/er","p":"ˈb.r.ʌ.ð/ə","cn":"兄弟","s":[["She's smarter than her brother.","她比她哥哥聪明。"],["He loved his brother deeply.","他深爱自己的哥哥。"],["My brother pledged Sigma Nu.","我哥哥宣誓加入Σ NU联谊会。"]]},{"l":"g.r.a.n.d/m.o.th/er","p":"ˈɡ.r.æ.n.-/m.ʌ.ð/ə","cn":"（外）祖母","s":[["Her grandmother mumbled in her sleep.","她祖母睡觉时咕哝了。"],["He often runs errands for his grandmother.","他经常给他的祖母跑腿儿。"],["My grandmother is 90 and still going strong.","我奶奶90岁了，还挺硬朗。"]]},{"l":"g.r.a.n.d/m.a","p":"ˈɡ.r.æ.n.-/m.ɑː","cn":"奶奶；外婆","s":[["Grandma was from Scotland.","奶奶来自苏格兰。"],["My Grandma lost her brother in the war.","我的祖母在战争中失去了弟弟。"],["Unfortunately, Grandma always seems to awaken at awkward moments.","可惜的是，奶奶好像总是在不合适的时间叫醒我。"]]},{"l":"g.r.a.n.d/f.a/th.er","p":"ˈɡ.r.æ.n.-/f.ɑː/ð.ə","cn":"（外）祖父","s":[["His grandfather was a professor.","他爷爷曾是位教授。"],["His grandfather was a Muslim cleric.","他祖父是一位穆斯林教士。"],["Her grandfather taught her to conjure.","她的祖父教她变魔术。"]]},{"l":"g.r.a.n.d/p.a","p":"ˈɡ.r.æ.n.-/p.ɑː","cn":"爷爷；外公","s":[["Grandpa lies comatose on the sofa.","爷爷躺在沙发上昏睡。"],["Grandpa was not yet back from the war.","爷爷那时还没从战场归来。"],["Grandpa dotes on his grandson.","爷爷疼孙子。"]]},{"l":"f.a.m/i/l.y","p":"ˈf.æ.m/ə/l.i","cn":"家；家庭","s":[["They were an insular family.","他们一家人与世隔绝。"],["His family expostulated with him.","他的家人反驳他。"],["We're a very close family.","我们全家彼此亲密无间。"]]}]},{"name":"Unit 3 At the zoo","words":[{"l":"th.i.n","p":"θ.ɪ.n","cn":"瘦的","s":[["The dog was painfully thin.","那条狗瘦得可怜。"],["The sheets have worn thin.","床单已经磨薄了。"],["She was pathetically thin.","她那时瘦弱得可怜。"]]},{"l":"f.a.t","p":"f.æ.t","cn":"胖的","s":[["Excess food is stored as fat.","多余的食物作为脂肪贮存起来。"],["This dress makes me look fat.","这衣服我穿着显胖。"],["Get out of bed, you fat slob!","起床吧，你这个胖懒虫！"]]},{"l":"t.a.ll","p":"t.ɔː.l","cn":"高的","s":[["Tall trees cut out the sunlight.","高高的树木遮住了阳光。"],["She goes for tall slim men.","她喜欢瘦高个子的男人。"],["She was tall and slim.","她是个瘦高个儿。"]]},{"l":"sh.or.t","p":"ʃ.ɔː.t","cn":"矮的；短的","s":[["Short hair really becomes you.","你理短发的确很帅。"],["He had short curly hair.","他有一头短鬈发。"],["Short skirts are back.","短裙又流行起来了。"]]},{"l":"l.o.ng","p":"l.ɒ.ŋ","cn":"长的","s":[["I don't intend staying long.","我不打算长期逗留。"],["The long journey tired him.","漫长的旅程使他疲倦。"],["Workers toiled long hours.","工人们长时间辛苦工作。"]]},{"l":"s.m.a.ll","p":"s.m.ɔː.l","cn":"小的","s":[["I can't read this small type.","我无法读这种小号字体。"],["The room was disappointingly small.","屋子小得令人失望。"],["Small villages dot the countryside.","小村庄星罗棋布于乡间。"]]},{"l":"b.i.g","p":"b.ɪ.ɡ","cn":"大的","s":[["This shirt isn't big enough.","这件衬衣不够大。"],["A murder was big news.","谋杀案是大新闻。"],["You're a big girl now.","你现在已长成大姑娘了。"]]},{"l":"g.i/r.a.ff.e","p":"dʒ.ə/ˈr.ɑː.f.-","cn":"长颈鹿","s":[["You have two giraffe toys.","你有两个长颈鹿玩具。"],["The giraffe eats leaves.","长颈鹿吃树叶。"],["A giraffe cannot cough.","长颈鹿没办法咳嗽。"]]},{"l":"s.o","p":"s.əʊ","cn":"这么；那么","s":[["Chris is so ambitious, so determined to do it all.","克里斯是如此雄心勃勃，如此坚决地要把它做完。"],["She was so young, so unworldly.","她那样年轻，那样不谙世事。"],["He's an ungrateful so-and-so.","他是个忘恩负义的家伙。"]]},{"l":"ch.i.l/d.r.e.n","p":"ˈtʃ.ɪ.l/d.r.ə.n","cn":"孩子们","s":[["She photographed the children.","她给孩子们照了相。"],["Children need their parents.","孩子们需要父母。"],["The children behaved beautifully.","孩子们表现甚佳。"]]},{"l":"ch.i.l.d","p":"tʃ.aɪ.l.d","cn":"孩子","s":[["The child was christened Mary.","这孩子受洗时取名玛丽。"],["The child went into convulsions.","那孩子全身抽搐起来。"],["They desperately wanted a child.","他们非常想要一个孩子。"]]},{"l":"t.ai.l","p":"t.eɪ.l","cn":"尾巴","s":[["The dog ran up, wagging its tail.","那条狗摇着尾巴跑上前去。"],["The pony swished its tail.","小马刷刷地甩着尾巴。"],["The tail tapered to a rounded tip.","尾部越来越细，最后成了个圆尖。"]]}]},{"name":"Unit 4 Where is my car?","words":[{"l":"o.n","p":"ɒ.n","cn":"在……上","s":[["The old men blather on and on.","这帮老头儿絮絮叨叨没完没了。"],["She went on and on about her trip.","她没完没了地谈她的旅行。"],["From now on you can work on your own.","从现在起你可以独自工作。"]]},{"l":"i.n","p":"ɪ.n","cn":"在……里","s":[["They lived in rooms in Kensington.","他们住在肯辛顿的出租房间。"],["We went skiing in France in March.","三月份我们去法国滑雪了。"],["He arrived in London in November 1939.","他于1939年11月到达伦敦。"]]},{"l":"u.n/d.er","p":"ˈʌ.n/d.ə","cn":"在……下面","s":[["Can you work under pressure?","你能在压力下工作吗？"],["They feel under permanent threat.","他们感觉处在持续不断的威胁之下。"],["She dived under the water.","她潜入水下。"]]},{"l":"ch.air","p":"tʃ.eə","cn":"椅子","s":[["She jumped down off the chair.","她跳下椅子。"],["Emily edged her chair forward.","埃米莉把椅子慢慢地向前挪动。"],["Helen sat upright in her chair.","海伦笔直地坐在椅子上。"]]},{"l":"d.e.s.k","p":"d.e.s.k","cn":"书桌","s":[["The desk looked undisturbed.","那张书桌子看上去没有被动过。"],["A phone trilled on the desk.","办公桌上的电话丁零零地响了。"],["She was sitting at her desk.","她坐在书桌前。"]]},{"l":"c.a.p","p":"k.æ.p","cn":"帽子（有檐）","s":[["He often wore a baseball cap.","他经常戴顶棒球帽。"],["She screwed the cap back on the jar.","她又把广口瓶的盖子拧上。"],["She tucked her hair (up) under her cap.","她把头发拢起来塞进帽子里。"]]},{"l":"b.a.ll","p":"b.ɔː.l","cn":"球","s":[["He kicked the ball into touch.","他把球踢出了边线。"],["The ball was uncontrollable.","球控制不住了。"],["The ball curved through the air.","球在空中沿曲线运动。"]]},{"l":"c.ar","p":"k.ɑː","cn":"小汽车","s":[["Suddenly the car accelerated.","突然车加速了。"],["The car leaped forward.","汽车突然向前冲去。"],["That car is ours.","那辆车是我们的。"]]},{"l":"b.oa.t","p":"b.əʊ.t","cn":"小船","s":[["The boat chugged slowly along.","船突突地缓慢前进。"],["The boat heaved beneath them.","小船在他们脚下颠簸着。"],["The boat disappeared from sight.","那艘船从视野中消失了。"]]},{"l":"m.a.p","p":"m.æ.p","cn":"地图","s":[["He traced the route on the map.","他在地图上勾画出了路线。"],["Are you any good at map reading?","你会看地图吗？"],["He laid the map out on the table.","他把地图在桌子上展开。"]]},{"l":"t.oy","p":"t.ɔɪ","cn":"玩具","s":[["The toy industry is in a slump.","玩具业现在不景气。"],["The boat looked almost like a toy.","这船看上去简直像个玩具。"],["He whittled the piece of wood into a simple toy.","他把那块木头削成了一个简易的玩具。"]]},{"l":"b.o.x","p":"b.ɒ.ks","cn":"盒子；箱子","s":[["Can you help me with this box?","你能帮我搬这个箱子吗？"],["The inside of the box was blue.","盒子的内面呈蓝色。"],["Come and help me lift this box.","来帮我抬这个箱子。"]]}]},{"name":"Unit 5 Do you like pears?","words":[{"l":"p.ear","p":"p.eə","cn":"梨","s":[["She bit into a ripe juicy pear.","她咬了一口熟透了的多汁的梨。"],["Pear trees are grafted on quince rootstocks.","梨树被嫁接到榅桲的根茎上。"],["In gardens, cankers are most prominent on apples and pear trees.","花园树木中患溃疡病最多的是苹果树和梨树。"]]},{"l":"a.p/p.le","p":"ˈæ.p/-.l","cn":"苹果","s":[["She crunched her apple noisily.","她吃苹果发出嘎嚓嘎嚓的声音。"],["He took another bite of apple.","他又咬了一口苹果。"],["Someone threw an apple core.","有人扔了一个苹果核。"]]},{"l":"o.r/a.n.g.e","p":"ˈɒ.r/ɪ.n.dʒ.-","cn":"橙子","s":[["I plucked an orange from the tree.","我从树上摘了一个橙子。"],["Orange is the big colour this year.","橘黄色是今年的流行色。"],["Would you care for some orange juice?","你想要些橙汁吗？"]]},{"l":"b.a/n.a/n.a","p":"b.ə/ˈn.ɑː/n.ə","cn":"香蕉","s":[["These companies are determined to keep a stranglehold on the banana industry.","这些公司决定对香蕉业进行压制。"],["He slipped on a banana skin.","他踩在香蕉皮上滑倒了。"],["The banana smells good.","这个香蕉闻起来很香。"]]},{"l":"w.a/t.er/m.e.l/o.n","p":"ˈw.ɔː/t.ə/m.e.l/ə.n","cn":"西瓜","s":[["Watermelon contains vitamins and also potassium.","西瓜含有维生素也有钾。"],["They planted some watermelon.","他们种了些西瓜。"],["Insects will soon smell watermelon.","昆虫很快会嗅到西瓜味。"]]},{"l":"s.t.r.aw/b.er/r.y","p":"ˈs.t.r.ɔː/b.ə/r.i","cn":"草莓","s":[["I want a strawberry milkshake.","我想要杯草莓奶昔。"],["Do you like strawberry jam?","你喜欢草莓酱么？"],["This pancake is full of strawberry jam.","这个煎饼里涂满了草莓酱。"]]},{"l":"g.r.a.p.e","p":"ɡ.r.eɪ.p.-","cn":"葡萄","s":[["The colouring pigments from the skins are not allowed to bleed into the grape juice.","这些果皮的色素不允许掺混进葡萄汁中。"],["Is it a grape or a plum?","这是葡萄还是李子？"],["Juice blends contain various fruits like grape, apple and pear.","混合果汁含有各种水果，如葡萄、苹果和梨。"]]},{"l":"b.uy","p":"b.aɪ","cn":"买","s":[["Money can't buy you happiness.","金钱不能为你买到幸福。"],["Where did you buy that dress?","那件连衣裙你是在哪里买的？"],["The curtains were an impulse buy.","这窗帘是一时心血来潮买下的。"]]},{"l":"f.r.ui.t","p":"f.r.uː.t","cn":"水果","s":[["The fruit are small and round.","这种水果小而圆。"],["The fruit was drowned in cream.","水果在奶油里泡过。"],["They eat mainly fruit and nuts.","他们主要吃水果和坚果。"]]}]},{"name":"Unit 6 How many?","words":[{"l":"e/l.e.v/e.n","p":"ɪ/ˈl.e.v/ə.n","cn":"十一","s":[["Charles I ruled for eleven years.","查理一世统治了十一年。"],["The meeting broke up at eleven o'clock.","会议在十一点散会。"],["She was chosen for the first eleven.","她被选派首发上场。"]]},{"l":"t.w.e.l.v.e","p":"t.w.e.l.v.-","cn":"十二","s":[["He retired twelve batters in a row.","他一连使十二个击球手出局。"],["It's ten past twelve.","现在十二点十分。"],["Twelve hours later she was all smiles again.","十二小时之后，她又喜笑颜开了。"]]},{"l":"th.ir/t.ee.n","p":"ˌθ.ɜː/ˈt.iː.n","cn":"十三","s":[["\"Thirteen?\" he guessed wildly.","“十三？”他胡乱猜道。"],["He ran away from home at the age of thirteen.","他十三岁时离家出走。"],["Thirteen is often considered an unlucky number.","十三常被认为是不吉利的数字。"]]},{"l":"f.our/t.ee.n","p":"ˌf.ɔː/ˈt.iː.n","cn":"十四","s":[["\"Fourteen minutes,\" Chris said, taking a peep at his watch.","“十四分钟，”克里斯瞥了一眼手表说道。"],["Women are advised not to drink more than fourteen units of alcohol per week.","建议妇女每周饮酒不超过十四个酒精单位。"],["I'm fourteen years old.","我14岁。"]]},{"l":"f.i.f/t.ee.n","p":"ˌf.ɪ.f/ˈt.iː.n","cn":"十五","s":[["Three fives are fifteen.","三个五等于十五。"],["The talks began some fifteen minutes late.","商谈迟了约十五分钟才开始。"],["We paid off our mortgage after fifteen years.","我们历经十五年的时间还清了抵押借款。"]]},{"l":"s.i.x/t.ee.n","p":"ˌs.ɪ.ks/ˈt.iː.n","cn":"十六","s":[["She is sixteen but has a mental age of five.","她十六岁，而智力年龄是五岁。"],["Sixteen times as many men are colour-blind as women.","色盲的男性人数是女性人数的十六倍。"],["He worked sixteen hours a day.","他每天工作16个小时。"]]},{"l":"s.e.v/e.n/t.ee.n","p":"ˌs.e.v/ə.n/ˈt.iː.n","cn":"十七","s":[["Jenny is seventeen years old.","珍妮17岁。"],["He had confessed to seventeen murders.","他已供认了17项谋杀罪。"],["Nora thought he was seventeen years old.","诺拉觉得他有17岁。"]]},{"l":"eigh/t.ee.n","p":"ˌeɪ/ˈt.iː.n","cn":"十八","s":[["His boat is an eighteen-footer.","他的小船长十八英尺。"],["The party was ousted from power after eighteen years.","该党执政十八年后被赶下台。"],["My classmate is eighteen.","我的同学十八岁。"]]},{"l":"n.i.n.e/t.ee.n","p":"ˌn.aɪ.n.-/ˈt.iː.n","cn":"十九","s":[["They have nineteen days to make up their minds.","他们有十九天的时间来做出决定。"],["Ten plus nine is nineteen.","十加九是十九。"],["It's only nineteen yuan.","它只要十九元。"]]},{"l":"t.w.e.n/t.y","p":"ˈt.w.e.n/t.i","cn":"二十","s":[["Twenty-eight is divisible by seven.","二十八可以被七整除。"],["I've been waiting (for) twenty minutes.","我等了二十分钟。"],["He was jailed for twenty years.","他被监禁了20年。"]]},{"l":"k.i.t.e","p":"k.aɪ.t.-","cn":"风筝","s":[["The kite has a span of 1.5 metres.","风筝宽1.5米。"],["Willy asks if I've ever flown a kite before.","威利问我以前是否放过风筝。"],["I wanted to fly a kite.","我想要去放风筝。"]]},{"l":"b.eau/t.i/f.u.l","p":"ˈb.juː/t.ɪ/f.ə.l","cn":"美丽的","s":[["Yessir, she was beautiful.","的确，她很漂亮。"],["The view was dazzlingly beautiful.","景色美得令人目眩神迷。"],["New England is beautiful.","新英格兰很迷人。"]]}]}]},{"id":"pep4a","name":"人教 四年级上册（新教材）","units":[{"name":"Unit 1 Helping at home","words":[{"l":"P/E","p":"ˌpiː/ˈiː","cn":"体育（课）（只要求理解）","s":[["When do you have a PE class?","你何时有体育课？"],["In the film McFarland, USA, coach White notices some talented runners in his PE class.","在美国电影《麦克法兰》中，怀特教练在他的体育课上注意到一些有天赋的跑步者。"]]},{"l":"j.o.b","p":"dʒ.ɒ.b","cn":"工作；职业（只要求理解）","s":[["She likes her job.","她爱她的工作。"],["She's doing a terrific job.","她活儿干得真棒。"],["She found her job very boring.","她觉得自己的工作很无聊。"]]},{"l":"d.o.c/t.or","p":"ˈd.ɒ.k/t.ə","cn":"医生","s":[["The doctor's on his way.","医生正在路上。"],["I respect him as a doctor.","我尊敬他这个医生。"],["Doctors think he will go blind.","医生们认为他会失明。"]]},{"l":"f.ar.m/er","p":"ˈf.ɑː.m/ə","cn":"农场主；农民","s":[["Farmers worked the fertile valleys.","农民们开垦了这个肥沃的山谷。"],["Farmers grow rice in the rich soil.","农民们在肥沃的土地上种水稻。"],["The land is rented out to other farmers.","这片土地租给别的农民了。"]]},{"l":"n.ur.s.e","p":"n.ɜː.s.-","cn":"护士","s":[["Nurses have to wear a uniform.","护士必须穿制服。"],["A nurse attended to his needs constantly.","有一位护士经常照料他的需要。"],["They hired a nurse to care for her.","他们雇了个护士来照顾她。"]]},{"l":"o.f/f.i.c.e w.or.k/er","p":"ˈɒ.f/-.ɪ.s.- ˈw.ɜː.k/ə","cn":"公司职员","s":[]},{"l":"f.a.c/t.o.r.y w.or.k/er","p":"ˈf.æ.k/t.-.r.i ˈw.ɜː.k/ə","cn":"工厂工人","s":[]},{"l":"b.u.s/y","p":"ˈb.ɪ.z/i","cn":"忙碌的（只要求理解）","s":[["We're not always this busy!","我们并不总是这么忙！"],["Are you busy next Monday ?","下周一你忙吗？"],["He is too busy to get away.","他忙得没有时间外出度假。"]]},{"l":"t.ire/d","p":"ˈt.aɪə/d","cn":"疲倦的（只要求理解）","s":[["The long journey tired him.","漫长的旅程使他疲倦。"],["She looked pale and tired.","她看起来苍白而疲惫。"],["Babies cry when they are tired.","婴儿疲倦时会哭。"]]},{"l":"ch.ore","p":"tʃ.ɔː","cn":"家庭杂务（只要求理解）","s":[["She sees exercise primarily as an unavoidable chore.","她把锻炼主要看作是不得不做的琐事。"]]},{"l":"c.oo.k","p":"k.ʊ.k","cn":"烹饪；煮","s":[["Nothing beats home cooking.","什么也比不上家里做的好吃。"],["I cooked noodles yesterday.","我昨天做了面条。"],["I find cooking very relaxing.","我发现烹饪非常令人放松。"]]},{"l":"c.l.ea.n","p":"k.l.iː.n","cn":"打扫；干净的（只要求理解）","s":[["Cats are very clean animals.","猫是颇爱干净的动物。"],["I do the cleaning myself.","我自己做打扫卫生的工作。"],["Go clean up and wash up.","去清洁干净，洗干净。"]]},{"l":"r.oo.m","p":"r.uː.m","cn":"房间（只要求理解）","s":[["The rooms had high ceilings.","那些房间的天花板很高。"],["The living room is tiny.","这间起居室极小。"],["The sitting room needs decorating.","客厅需要粉刷。"]]},{"l":"l.oo.k a.f/t.er","p":"l.ʊ.k ˈɑː.f/t.ə","cn":"照顾","s":[["He's very experienced in looking after animals.","他养动物很有经验。"],["I know the Lord will look after him.","我知道上帝会照顾他的。"],["You'll have to play about and look after yourself.","你得自己玩，自己照顾自己。"]]},{"l":"s.w.ee.p","p":"s.w.iː.p","cn":"扫","s":[["Wintry weather continues to sweep across Colorado.","寒冬气候继续席卷科罗拉多州。"],["She is sweeping with a broom.","她在用扫帚扫地。"],["Strong winds regularly sweep the islands.","这些岛屿上经常刮大风。"]]},{"l":"f.l.oor","p":"f.l.ɔː","cn":"地板；地面","s":[["They live on the floor below.","他们住在下一层楼。"],["In America, it's the first floor.","在美国，这一层则被称为一楼。"],["I live on the first floor.","我住在一楼。"]]},{"l":"t.o/g.e.th/er","p":"t.ə/ˈɡ.e.ð/ə","cn":"在一起；共同（只要求理解）","s":[["Together we earn $60,000 per year.","我们每年总共赚$60000。"],["Multiply 2 and 6 together and you get 12.","2和6相乘得12。"],["We get along just fine together.","我们相处得很融洽。"]]},{"l":"p.eo/p.le","p":"ˈp.iː/p.l","cn":"人；人们（只要求理解）","s":[["People eat when they're depressed.","人们会在沮丧时吃东西。"],["Good evening. How many people?","晚上好，几个人？"],["He started bossing people around.","他开始支使大家了。"]]},{"l":"ch.i.l.d","p":"tʃ.aɪ.l.d","cn":"（复数children）儿童；小孩（只要求理解）","s":[["They desperately wanted a child.","他们非常想要一个孩子。"],["She claims Mark fathered her child.","她声称马克是她孩子的父亲。"],["That child has a very active imagination.","那个小孩想象力十分丰富。"]]}]},{"name":"Unit 2 My friends","words":[{"l":"h.i.s","p":"h.ɪ.z","cn":"他的（只要求理解）","s":[["His hair waves naturally.","他天生一头鬈发。"],["\"What's his name?\"—\"Peter.\"","“他叫什么名字？”—“彼得。”"],["His ears stick out.","他长着一对招风耳。"]]},{"l":"s.t.r.o.ng","p":"s.t.r.ɒ.ŋ","cn":"强壮的","s":[["His wife has a strong personality.","他妻子的个性很强。"],["The play has a very strong cast.","这部剧演员阵容强大。"],["My grandmother is 90 and still going strong.","我奶奶90岁了，还挺硬朗。"]]},{"l":"h.air","p":"h.eə","cn":"头发","s":[["His hair waves naturally.","他天生一头鬈发。"],["Careful—you're messing my hair.","小心—你弄乱我的头发了。"],["He had dark, curly hair.","他有一头黑色卷发。"]]},{"l":"a.l/s.o","p":"ˈɔː.l/s.əʊ","cn":"也（只要求理解）","s":[["You can also make raisin scones.","你也可以做葡萄干烤饼。"],["The sofa also functions as a bed.","这沙发还可当床用。"],["Also, you can watch different people pass by.","此外，你可以看到不同的人经过。"]]},{"l":"k.i.n.d","p":"k.aɪ.n.d","cn":"友好的","s":[["I like him, kind of.","我有点儿喜欢他。"],["He's in some kind of trouble.","他遇到了什么麻烦。"],["They sell all kinds of things.","他们出售各种各样的东西。"]]},{"l":"qu.i/e.t","p":"ˈkw.aɪ/ə.t","cn":"文静的","s":[["She remained quiet and controlled.","她沉默不语保持克制。"],["The quiet country roads are ideal for cycling.","安静的乡村道路很适合骑自行车。"],["The bar seemed ominously quiet.","那个酒吧似乎寂静得让人觉得不祥。"]]},{"l":"b.e.s.t","p":"b.e.s.t","cn":"最好的（只要求理解）","s":[["English is my best subject.","英语是我学得最好的一门科目。"],["It's my best ever score.","这是我得到过的最好分数。"],["Laughter is the best medicine.","欢笑是一副良药。"]]},{"l":"r.ea.d","p":"r.iː.d","cn":"阅读","s":[["He'd never learned to read.","他一直没有学会阅读。"],["She's still learning to read.","她还在学习识字。"],["Have you read the contract?","你看过这份合同了吗？"]]},{"l":"Ch.i/n.e.s.e","p":"ˌtʃ.aɪ/ˈn.iː.z.-","cn":"中文；中国人；中国的","s":[["He buys some Chinese chopsticks.","他买了一些中国的筷子。"],["May I borrow your Chinese book?","我能借用你的语文书么？"],["This Chinese book is very good.","这本语文书非常棒！"]]},{"l":"p.l.ay","p":"p.l.eɪ","cn":"玩耍","s":[["I enjoy playing basketball.","我喜欢打篮球。"],["They're both playing excellently.","他们演奏得都很棒。"],["The play finished at 10.30.","比赛于10:30结束。"]]},{"l":"g.a.m.e","p":"ɡ.eɪ.m.-","cn":"游戏","s":[["Let's play a different game.","咱们玩点别的游戏吧。"],["It's a favourite game of theirs.","这是他们最喜爱的游戏。"],["Chess is not a game of chance.","国际象棋不是靠运气取胜的。"]]},{"l":"f.oo.t/b.a.ll","p":"ˈf.ʊ.t/b.ɔː.l","cn":"足球运动","s":[["Luckily, we both love football.","幸好我们俩都热爱足球。"],["Are you a football player?","你是足球队员吗？"],["I like all sports except football.","除足球外我喜欢所有的运动。"]]},{"l":"b.a.s/k.e.t/b.a.ll","p":"ˈb.ɑː.s/k.ɪ.t/b.ɔː.l","cn":"篮球运动（只要求理解）","s":[["I enjoy playing basketball.","我喜欢打篮球。"],["He coaches basketball and soccer.","他执教篮球和足球。"],["I used to play basketball.","我过去常打篮球。"]]},{"l":"a.l/w.ay.s","p":"ˈɔː.l/w.eɪ.z","cn":"总是（只要求理解）","s":[["I've always hated cabbage.","我从来都讨厌吃卷心菜。"],["That phone's always ringing.","那个电话总是响个不停。"],["He's always cutting class.","他总是旷课。"]]}]},{"name":"Unit 3 Places we live in","words":[{"l":"a.f/t.er/n.oo.n","p":"ˌɑː.f/t.ə/ˈn.uː.n","cn":"下午（只要求理解）","s":[["Good afternoon, Miss Maria.","玛丽亚小姐，下午好。"],["It's cloudy this afternoon.","今天下午多云。"],["He's arriving in the afternoon.","他将于下午到达。"]]},{"l":"th.ere","p":"ð.eə","cn":"（表示存在或发生）；在那里（只要求理解）","s":[["Ah, there you are.","啊，你原来在这儿。"],["There are no absolute rules.","没有绝对的准则。"],["Hello, is there anybody there?","喂，那里有人吗？"]]},{"l":"p.l.ay/g.r.ou.n.d","p":"ˈp.l.eɪ/ɡ.r.aʊ.n.d","cn":"游乐场；操场","s":[["The resort is a playground of the rich and famous.","这个度假胜地是富翁名流的娱乐场所。"],["Sam pushed me over in the playground.","萨姆在运动场上把我推倒了。"],["The girls were skipping in the playground.","姑娘们在操场上跳绳。"]]},{"l":"p.ar.k","p":"p.ɑː.k","cn":"公园","s":[["I had trouble parking.","我停车有困难。"],["The car is parked nearby.","车就停在附近。"],["I usually cycle home through the park.","我通常骑自行车穿过公园回家。"]]},{"l":"o/v.er","p":"ˈəʊ/v.ə","cn":"在……的远端（或对面）（只要求理解）","s":[["Thank goodness that's over!","谢天谢地，事情总算过去了！"],["Well, thank goodness that's over!","好啦，谢天谢地，这件事总算过去了！"],["His dark head bent over her.","他对她低下他那黑发的头。"]]},{"l":"h.o.s/p.i/t.a.l","p":"ˈh.ɒ.s/p.ɪ/t.-.l","cn":"医院","s":[["He died in (the) hospital.","他在医院里去世。"],["I had to go to hospital.","我得去医院看病。"],["The VA hospital needs renovation.","退伍军人管理局的医院需要进行整修。"]]},{"l":"sh.o.p","p":"ʃ.ɒ.p","cn":"商店","s":[["I do a weekly shop at the supermarket.","我一周上超市一次。"],["Shops close only on Christmas Day and New Year's Day.","商店只在圣诞日和元旦停业。"],["Infuriatingly, the shop had just closed.","真让人生气，商店刚刚关门。"]]},{"l":"t.oi/l.e.t","p":"ˈt.ɔɪ/l.ə.t","cn":"厕所；卫生间","s":[["She had gone in to use the toilet.","她已经去上洗手间了。"],["He heard the flush of a toilet.","他听到马桶的冲水声。"],["I knelt by the toilet and gagged.","我跪在马桶边作呕。"]]},{"l":"b.u.s s.t.o.p","p":"b.ʌ.s s.t.ɒ.p","cn":"公共汽车站","s":[]},{"l":"l.i/b.r.a/r.y","p":"ˈl.aɪ/b.r.ə/r.i","cn":"图书馆（只要求理解）","s":[["The library is all on one level.","图书馆全部在同一层楼上。"],["A librarian works in a library.","图书馆管理员在图书馆里工作。"],["Library Cards expire after four years.","图书馆借书证四年后到期。"]]},{"l":"s.p.or.t","p":"s.p.ɔː.t","cn":"体育运动","s":[["What's your favourite sport?","你最喜欢哪一项体育运动？"],["Go on doing sports.","继续做运动吧。"],["I'm not interested in sport.","我对体育运动不感兴趣。"]]},{"l":"w.a.l.k","p":"w.ɔː.-.k","cn":"散步；行走","s":[["He walked through customs.","他步行通过了海关。"],["I walked into town.","我走进了市中心。"],["I prefer walking to climbing.","我喜欢散步多于喜欢爬山。"]]},{"l":"c.o/mm.u/n.i/t.y","p":"k.ə/ˈm.juː/n.ə/t.i","cn":"社区（只要求理解）","s":[["The centre will serve the whole community.","这个中心将为整个社区提供服务。"],["The sense of community is lost.","团体意识没有了。"],["There's not much community spirit around here.","这里集体精神比较薄弱。"]]},{"l":"f.a/v.ou/r.i.t.e","p":"ˈf.eɪ/v.ə/r.ɪ.t.-","cn":"最喜欢的（只要求理解）","s":[["What's your favourite colour?","你最喜欢的颜色是什么？"],["What's your favourite sport?","你最喜欢哪一项体育运动？"],["Who is your favourite author?","你最喜欢哪位作家？"]]},{"l":"p.l.a.c.e","p":"p.l.eɪ.s.-","cn":"地方；场所（只要求理解）","s":[["This place is heavenly.","这个地方好极了。"],["He finished in third place.","他得了第三名。"],["Elections take place every year.","每年都进行各项选举。"]]},{"l":"ph.o/t.o","p":"ˈf.əʊ/t.əʊ","cn":"照片（只要求理解）","s":[["Photos make useful teaching aids.","照片可以成为有用的教具。"],["The photo wasn't very clear.","这张照片不太清晰。"],["That photo doesn't do you justice.","那张照片不如你本人好看。"]]},{"l":"s.t.o.r/y","p":"ˈs.t.ɔː.r/i","cn":"故事（只要求理解）","s":[["The story goes like this.","故事是这样的。"],["The story has a happy ending.","故事的结局很圆满。"],["The story is almost certainly false.","这个故事几乎肯定是虚构的。"]]},{"l":"b.uy","p":"b.aɪ","cn":"购买（只要求理解）","s":[["Is she buying a storybook?","她正在买一本故事书吗？"],["He buys some Chinese chopsticks.","他买了一些中国的筷子。"],["We're considering buying a new car.","我们在考虑买一辆新车。"]]}]},{"name":"Unit 4 Helping in the community","words":[{"l":"f.ire/f.igh.t/er","p":"ˈf.aɪə/f.aɪ.t/ə","cn":"消防队员（只要求理解）","s":[["I would like to be a firefighter.","我想当一名消防员。"],["For the past three years he has been employed as a firefighter.","三年来他一直受雇当消防员。"],["Some 4,000 firefighters are battling the blaze.","约有四千名消防人员正在与大火搏斗。"]]},{"l":"wh.y","p":"w.aɪ","cn":"为什么（只要求理解）","s":[["Why must she interrupt?","她为什么偏要打断呢？"],["Let me explain why.","让我来解释为什么。"],["Why has the engine stopped?","发动机怎么停了？"]]},{"l":"d.r.i.v/er","p":"ˈd.r.aɪ.v/ə","cn":"司机","s":[["My dad is a lorry driver.","我的父亲是个卡车司机。"],["The driver suffered head injuries.","司机头部受伤。"],["Boston drivers love the tunnel.","波士顿的司机们喜欢那条隧道。"]]},{"l":"c.l.ea.n/er","p":"ˈk.l.iː.n/ə","cn":"清洁工","s":[["He was a window cleaner.","他是一名窗户清洁工。"],["Nuclear power is cleaner than coal.","核能比煤更清洁。"],["These cleaners could fulfill all customers' demands.","这些清洁剂可以满足所有顾客的需求。"]]},{"l":"c.oo.k","p":"k.ʊ.k","cn":"厨师","s":[["Nothing beats home cooking.","什么也比不上家里做的好吃。"],["I cooked noodles yesterday.","我昨天做了面条。"],["I find cooking very relaxing.","我发现烹饪非常令人放松。"]]},{"l":"d.e/l.i.v/e.r/y w.or.k/er","p":"d.ɪ/ˈl.ɪ.v/ə.r/i ˈw.ɜː.k/ə","cn":"快递员","s":[]},{"l":"p.o/l.i.c.e o.f/f.i/c.er","p":"p.ə/ˈl.iː.s.- ˈɒ.f/-.ɪ/s.ə","cn":"警察；警员","s":[["The police officer radioed for help.","警察用无线电呼救。"],["Just then Monroe police officers arrived.","就在这时，门罗警察赶到了。"],["Police officers must be prepared for the unexpected.","警察必须随时准备应付意外事件。"]]},{"l":"a l.o.t o.f","p":"ə l.ɒ.t ə.v","cn":"大量；许多（只要求理解）","s":[["She earns a lot of money.","她挣很多钱。"],["Quite a lot of South Americans study here.","相当多的南美洲人在这里学习。"],["This type of heater uses a lot of electricity.","这种加热器耗电量很大。"]]},{"l":"n.ow","p":"n.aʊ","cn":"现在（只要求理解）","s":[["Everything's A-OK now.","现在一切都妥帖了。"],["What's the score now?","现在比分是多少？"],["It's too late now, anyway.","反正现在已经太迟了。"]]},{"l":"m.a.k.e th.e b.e.d","p":"m.eɪ.k.- ð.ə b.e.d","cn":"铺床（只要求理解）","s":[]},{"l":"o.l.d","p":"əʊ.l.d","cn":"过去的；年纪大的；老的","s":[["I'm fourteen years old.","我14岁。"],["How old is she?","她有多大了？"],["He's a nice old fellow.","他这位老兄人不错。"]]},{"l":"t.e.ll","p":"t.e.l","cn":"讲述；告诉","s":[["Tell me what really happened.","告诉我究竟发生了什么事。"],["Tell me where you live.","告诉我你住哪儿？"],["Please tell the court what happened.","请向法庭陈述事情的经过。"]]},{"l":"e.v.e/r.y/o.n.e","p":"ˈe.v.-/r.i/wʌ.n.-","cn":"每人（只要求理解）","s":[["Everyone arrived nice and early.","大家都早早地到了。"],["Not everyone approves of the festival.","不是每个人都喜欢这个节日。"],["Everyone in the group exchanged email addresses.","所有的组员都相互交换了电子邮件地址。"]]},{"l":"M.s","p":"m.ɪz","cn":"（用于女子的姓氏或姓名前，不指明婚否）女士（只要求理解）","s":[["Ms Green has asked me to deputize for her at the meeting.","格林女士请我代表她出席会议。"],["Ms. Carey appeared to blame her breakdown on EMI's punishing work schedule.","凯丽女士看来是将自己的崩溃归咎于百代公司紧张的工作安排。"],["Ms. Nova is the proud possessor of a truly incredible voice.","诺娃女士引以为豪是她拥有一副美妙动听的嗓音。"]]}]},{"name":"Unit 5 The weather and us","words":[{"l":"s.p.ea.k","p":"s.p.iː.k","cn":"说话；发言（只要求理解）","s":[["She speaks excellent French.","她法语说得好极了。"],["He doesn't speak English.","他不说英语。"],["She can speak Spanish.","她会讲西班牙语。"]]},{"l":"w.ea.th/er","p":"ˈw.e.ð/ə","cn":"天气（只要求理解）","s":[["I like cold weather.","我喜欢寒冷的天气。"],["The weather gradually improved.","天气逐渐好转。"],["The weather is snowy here.","这里是下雪天。"]]},{"l":"s.u.n/n.y","p":"ˈs.ʌ.n/-.i","cn":"阳光充足的","s":[["It's a brilliantly sunny morning.","这是个阳光灿烂的早晨。"],["It was brilliantly sunny.","阳光明媚。"],["It's bound to be sunny again tomorrow.","明天肯定又是阳光灿烂。"]]},{"l":"h.o.t","p":"h.ɒ.t","cn":"热的","s":[["Her spelling isn't too hot.","她的拼写不太好。"],["It's very hot here in summer.","这里夏天很热。"],["Be careful—the plates are hot.","当心—盘子烫手。"]]},{"l":"b.a.d","p":"b.æ.d","cn":"令人不快的；坏的（只要求理解）","s":[["His spelling is very bad.","他的拼写能力很差。"],["It really isn't half bad, is it?","这的确很不错，对吗？"],["He's not such a bad old stick.","他老兄人不算坏。"]]},{"l":"c.o.l.d","p":"k.əʊ.l.d","cn":"冷的","s":[["It's freezing cold outside.","外面极为寒冷。"],["I like cold weather.","我喜欢寒冷的天气。"],["His final request stopped her cold.","他最后的请求突然阻止了她。"]]},{"l":"w.i.n.d/y","p":"ˈw.ɪ.n.d/i","cn":"多风的","s":[["When it's windy, I fly a kite.","当天刮风的时候，我放风筝。"],["It was windy and Jake felt cold.","风很大，杰克觉得很冷。"]]},{"l":"c.l.ou.d/y","p":"ˈk.l.aʊ.d/i","cn":"多云的","s":[["Tonight will be cloudy.","今天夜间多云。"],["It's cloudy this afternoon.","今天下午多云。"],["It's cloudy in Singapore.","新加坡多云。"]]},{"l":"r.ai.n/y","p":"ˈr.eɪ.n/i","cn":"阴雨的","s":[["Tomorrow will be rainy.","明天将下雨。"],["They take a walk on rainy day.","他们在下雨天散步。"],["It was rainy yesterday.","昨天是雨天。"]]},{"l":"s.n.ow/y","p":"ˈs.n.əʊ/i","cn":"多雪的","s":[["The weather is snowy here.","这里是下雪天。"],["I hate the snowy winters.","我讨厌下雪的冬日。"],["We strode across the snowy fields.","我们大步流星地穿过雪封的旷野。"]]},{"l":"c.oo.l","p":"k.uː.l","cn":"凉爽的","s":[["That's a cool hat.","那是一顶很酷的帽子。"],["Glass contracts as it cools.","玻璃遇冷收缩。"],["Thank goodness it's cool in here.","谢天谢地，这里很凉爽。"]]},{"l":"w.ar.m","p":"w.ɔː.m","cn":"温暖的","s":[["I warmed to her immediately.","我立即喜欢上了她。"],["The party soon warmed up.","聚会很快活跃起来。"],["I'll warm up some milk.","我来热些牛奶。"]]},{"l":"t.o/m.o.r/r.ow","p":"t.ə/ˈm.ɒ.r/-.əʊ","cn":"在明天（只要求理解）","s":[["Tomorrow will be rainy.","明天将下雨。"],["Snow is forecast for tomorrow.","预报明天有雪。"],["I'll see you tomorrow evening.","我明天晚上见你。"]]},{"l":"r.ai.n","p":"r.eɪ.n","cn":"下雨；雨（只要求理解）","s":[["The rain poured down.","雨瓢泼而下。"],["It's not actually raining now.","其实现在并没有下雨。"],["The rains come in September.","雨季九月份开始。"]]},{"l":"c.l.o.s.e.d","p":"k.l.əʊ.z.-.d","cn":"关闭的（只要求理解）","s":[["The door closed behind him.","他一出门，门就关上了。"],["He has a closed mind.","他思想僵化守旧。"],["The museum is closed on Mondays.","博物馆每逢星期一闭馆。"]]},{"l":"f.i.l.m","p":"f.ɪ.l.m","cn":"电影","s":[["The film festival takes place in October.","电影节将于十月举行。"],["The police had secretly filmed the conversations.","警察已秘密地把几次谈话拍摄下来。"],["The film has a Hollywood happy ending.","这部电影具有好莱坞式的美满结局。"]]},{"l":"i/d.ea","p":"aɪ/ˈd.ɪə","cn":"想法；主意（只要求理解）","s":[["This idea isn't new.","这主意不新鲜。"],["That's a super idea.","那是个超好的想法。"],["He's dead against the idea.","他坚决反对这个想法。"]]},{"l":"f.l.y","p":"f.l.aɪ","cn":"操纵（飞行器等）；飞","s":[["She brushed the fly away.","她挥手赶走了苍蝇。"],["I learned to fly in Vietnam.","我在越南学会了驾驶飞机。"],["A fly landed on his nose.","一只苍蝇落在他的鼻子上。"]]},{"l":"k.i.t.e","p":"k.aɪ.t.-","cn":"风筝","s":[["I wanted to fly a kite.","我想要去放风筝。"],["When it's windy, I fly a kite.","当天刮风的时候，我放风筝。"],["The koala likes to fly a kite.","无尾熊喜欢放风筝。"]]},{"l":"s.n.ow/m.a.n","p":"ˈs.n.əʊ/m.æ.n","cn":"雪人","s":[["We're making a snowman.","我们正在做一个雪人。"],["Let's draw a snowman.","咱们画一个雪人吧。"],["My snowman has gone.","我的雪人不见了。"]]},{"l":"f.u.n","p":"f.ʌ.n","cn":"享乐；乐趣（只要求理解）","s":[["Sailing is good fun.","帆船运动很有乐趣。"],["Time flies when you're having fun.","当你开心的时候，时光飞逝。"],["It's just a bit of harmless fun.","开个小玩笑罢了，并无恶意的。"]]},{"l":"th.eir","p":"ð.eə","cn":"他们的；她们的；它们的（只要求理解）","s":[["Their house is massive.","他们的房子大极了。"],["Children need their parents.","孩子们需要父母。"],["Someone's left their bag behind.","有人把包落下了。"]]},{"l":"s.w.i.m","p":"s.w.ɪ.m","cn":"游泳（只要求理解）","s":[["I managed to swim to safety.","我设法游到安全处。"],["I had a swim to cool down.","我游了泳，凉快凉快。"],["How many widths can you swim?","你在游泳池里横向能游几个来回？"]]},{"l":"S.y.d/n.ey","p":"ˈs.ɪ.d/n.i","cn":"悉尼（只要求理解）","s":[["Sydney is one of the world's must-see cities.","悉尼是世界上的必游城市之一。"],["In the morning Mr. McDonald departed for Sydney.","麦克唐纳先生早上起程去了悉尼。"],["News Corporation was headquartered in Sydney.","新闻集团的总部设在悉尼。"]]}]},{"name":"Unit 6 Changing for the seasons","words":[{"l":"wh.o.s.e","p":"h.uː.z.-","cn":"谁的（只要求理解）","s":[["\"Whose is this?\"—\"It's mine.\"","“这是谁的？”—“是我的。”"],["I wonder whose this is.","我不知道这是谁的。"],["Whose car were they in?","他们坐在谁的车里？"]]},{"l":"s.w.ea.t/er","p":"ˈs.w.e.t/ə","cn":"毛衣","s":[["This sweater washes well.","这件套衫很耐洗。"],["This sweater has stretched.","这件毛衣给撑得变形了。"],["The fence snagged my sweater.","栅栏把我的毛衣挂住了。"]]},{"l":"s.o.ck","p":"s.ɒ.k","cn":"短袜","s":[["I had nothing on except for my socks.","我除了短袜什么都没穿。"],["Aunt Emilie darned old socks.","埃米莉阿姨把旧袜子补好了。"],["I am looking for matching socks.","我正在寻找匹配的袜子。"]]},{"l":"m.i.n.e","p":"m.aɪ.n.-","cn":"我的（只要求理解）","s":[["\"Whose is this?\"—\"It's mine.\"","“这是谁的？”—“是我的。”"],["I'll bet we could find some at North Creek—in the mine.","我打赌我们能在小溪北边的矿井里面找到一些。"],["His department will merge with mine.","他的部门将和我的合并。"]]},{"l":"w.ear","p":"w.eə","cn":"穿；戴（只要求理解）","s":[["He wears monkey clothes.","他穿着猴子服。"],["I wear glasses for driving.","我开车时戴眼镜。"],["She usually wears long skirts.","她通常穿长裙。"]]},{"l":"sh.ir.t","p":"ʃ.ɜː.t","cn":"衬衫","s":[["This shirt isn't big enough.","这件衬衣不够大。"],["These shirts are 100% pure cotton.","这些衬衫是100%的纯棉。"],["What's your shirt made of?","你的衬衣是用什么做的？"]]},{"l":"c.oa.t","p":"k.əʊ.t","cn":"大衣；外套","s":[["Here, let me take your coat.","来，我帮你拿大衣。"],["A button had come off my coat.","我的外套掉了一颗纽扣。"],["I wondered whose the coat was.","我思忖着那件大衣是谁的。"]]},{"l":"d.r.e.ss","p":"d.r.e.s","cn":"连衣裙","s":[["Kids love dressing up.","孩子们都喜欢装扮成别人玩儿。"],["She's always well-dressed.","她总是衣着讲究。"],["Don't get your dress dirty!","别把你的连衣裙弄脏了！"]]},{"l":"wh.i.ch","p":"w.ɪ.tʃ","cn":"哪一个；哪一些（只要求理解）","s":[["Which one's your favourite?","你最喜欢哪一个？"],["Which is their house?","哪座房子是他们的？"],["Which school do they attend?","他们上的是哪一所学校？"]]},{"l":"s.ea/s.o.n","p":"ˈs.iː/z.-.n","cn":"季节（只要求理解）","s":[["Autumn is my favourite season.","秋季是我最喜欢的季节。"],["Hotels are cheaper out of season.","在淡季，旅馆要便宜些。"],["This could be the feelgood film of the season.","这可能是本季最佳令人愉悦电影。"]]},{"l":"w.i.n/t.er","p":"ˈw.ɪ.n/t.ə","cn":"冬天","s":[["I hate the snowy winters.","我讨厌下雪的冬日。"],["The lake freezes over in winter.","这个湖冬天全部封冻。"],["Swallows migrate south in winter.","燕子在冬天迁徙到南方。"]]},{"l":"s.n.ow","p":"s.n.əʊ","cn":"下雪；雪（只要求理解）","s":[["Snow covered the ground.","大雪覆盖了大地。"],["Snow is forecast for tomorrow.","预报明天有雪。"],["Snow soon blanketed the frozen ground.","冻土上很快就形成了一层厚厚的积雪。"]]},{"l":"g.e.t t.o/g.e.th/er","p":"ɡ.e.t t.ə/ˈɡ.e.ð/ə","cn":"聚会（只要求理解）","s":[]},{"l":"s.p.r.i.ng","p":"s.p.r.ɪ.ŋ","cn":"春天","s":[["This verse describes three signs of spring.","这节诗描述了春天的3个征兆。"],["I love Rome, especially in the spring.","我喜爱罗马，尤其是春天的罗马。"],["Spring came late this year.","今年春天来得晚。"]]},{"l":"s.u.m/m.er","p":"ˈs.ʌ.m/-.ə","cn":"夏天","s":[["I really love summer evenings.","我非常喜欢夏天的夜晚。"],["We packed away the summer clothes.","我们把夏装收藏起来了。"],["It's very hot here in summer.","这里夏天很热。"]]},{"l":"au/t.u.m.n","p":"ˈɔː/t.ə.m.-","cn":"秋天","s":[["Leaves change colour in autumn.","树叶在秋天改变颜色。"],["Every autumn I go to the county fair.","每个秋季我都去县里的集市。"],["I love the reds and golds of autumn.","我喜欢秋天的火红色和金黄色。"]]},{"l":"T/-.sh.ir.t","p":"ˈtiː/-.ʃ.ɜː.t","cn":"T恤衫（只要求理解）","s":[["Unit sales of T-shirts increased 6%.","T恤衫的单位销售增加了6%。"],["Tight fitting T-shirts are making a comeback.","紧身短袖圆领T恤衫再度流行起来。"],["He was wearing a T-shirt and shorts.","他穿着T恤衫和短裤。"]]},{"l":"f.a.ll","p":"f.ɔː.l","cn":"落下（只要求理解）","s":[["Watch out for falling rocks!","小心落石！"],["Aren't you afraid (that) you'll fall?","你不怕会跌倒吗？"],["Out of over 400 staff there are just 7 that fall into this category.","400多个职员中只有7人属于这一类。"]]},{"l":"l.ea.f","p":"l.iː.f","cn":"（复数leaves）叶（只要求理解）","s":[["The ant is carrying a leaf.","蚂蚁在搬运叶子。"],["The trees are coming into leaf.","树开始长叶子了。"],["The trees are just coming into leaf.","树木正好在长叶子。"]]},{"l":"g.l.o.v.e","p":"ɡ.l.ʌ.v.-","cn":"手套（只要求理解）","s":[["There is a hole in her glove.","她手套上有个洞。"],["She bent down to pick up her glove.","她俯身去捡手套。"],["He stuck his gloves in his pocket.","他把手套塞进了口袋里。"]]},{"l":"th.e.n","p":"ð.e.n","cn":"然后；那时（只要求理解）","s":[["Then a dinosaur appeared.","然后一只恐龙出现了。"],["Then a clown appeared.","然后小丑出场了。"],["That's definite then, is it?","那么，那是确切的了，是吗？"]]}]}]},{"id":"pep4b","name":"人教 四年级下册（新教材）","units":[{"name":"Unit 1 Class rules","words":[{"l":"s.o.r/r.y","p":"ˈs.ɒ.r/-.i","cn":"对不起（只要求理解）","s":[["Sorry, the answer's no.","对不起，回答是不。"],["Sorry—I don't quite follow.","对不起，我不太听懂你的话。"],["I'm sorry, I haven't a clue.","对不起，我一无所知。"]]},{"l":"h.u.r/r.y u.p","p":"ˈh.ʌ.r/-.i ʌ.p","cn":"快点；赶快（只要求理解）","s":[["Hurry up or else you'll be late.","快点，否则你就要迟到了。"],["Oh you're so slow; come on, hurry up!","哎哟，你可真慢；加把劲，快点！"],["I wish the bus would hurry up and come.","我希望公共汽车能快点来。"]]},{"l":"l.a.t.e","p":"l.eɪ.t.-","cn":"迟到；迟发生","s":[["Come along! We're late.","快点！我们迟到了。"],["They're nearly always late.","他们几乎总是迟到。"],["It's too late now, anyway.","反正现在已经太迟了。"]]},{"l":"c.l.a.ss","p":"k.l.ɑː.s","cn":"课；课程；班；班级（只要求理解）","s":[["He's always cutting class.","他总是旷课。"],["First class costs more.","第一类邮件邮资较高。"],["It's our second English class.","这是我们第二节英语课。"]]},{"l":"r.ea.d/y","p":"ˈr.e.d/i","cn":"准备好（只要求理解）","s":[["Cameras ready? OK, shoot!","摄影机准备好了吗？好，开拍！"],["She's always ready with advice.","她总是乐于提出建议。"],["I feel ready to drop.","我感到快累垮了。"]]},{"l":"r.u.l.e","p":"r.uː.l.-","cn":"规则；规章（只要求理解）","s":[["There are no absolute rules.","没有绝对的准则。"],["The deal may be ruled illegal.","这笔交易可能会被判定为非法。"],["The Supreme Court ruled in Fitzgerald's favour.","最高法院判定菲茨杰拉德胜诉。"]]},{"l":"c.l.a.ss/r.oo.m","p":"ˈk.l.ɑː.s/r.uː.m","cn":"教室","s":[["She'd sent him outside the classroom.","她叫他到教室外面去。"],["Discipline in the classroom is very slack.","班里纪律十分松懈。"],["The classroom teacher must be sensitive to a child's needs.","课堂教师必须理解孩子的需求。"]]},{"l":"t.ur.n o.ff","p":"t.ɜː.n ɒ.f","cn":"关掉","s":[["Turn off the shower.","关掉淋浴。"],["Is this where we turn off?","这儿是我们换道的地方吗？"],["If God turns off one faucet, he can turn on another.","如果上帝关上一个水龙头，他能开启另一个。"]]},{"l":"l.igh.t","p":"l.aɪ.t","cn":"灯；光","s":[["Glass and water both bend light.","玻璃和水都折光。"],["We seem to be light on fuel.","我们好像燃料不多了。"],["New evidence has recently come to light.","新的证据最近已披露出来。"]]},{"l":"b.l.a.ck/b.oar.d","p":"ˈb.l.æ.k/b.ɔː.d","cn":"黑板（只要求理解）","s":[["In front of the blackboard is the teacher's desk.","黑板前面是老师的讲桌。"],["Let's change round , so that I can see the blackboard clearly.","让我们换一下位置，这样我可以看清黑板。"],["He chalked the message on the blackboard.","他用粉笔把这条消息写在黑板上。"]]},{"l":"d.e.s.k","p":"d.e.s.k","cn":"书桌；办公桌","s":[["The teacher's desk is big.","教师课桌是大的。"],["There are many books on my teacher's desk.","我的老师桌子上有很多书。"],["In front of the blackboard is the teacher's desk.","黑板前面是老师的讲桌。"]]},{"l":"ch.air","p":"tʃ.eə","cn":"椅子","s":[["Who's chairing the meeting?","谁主持这次会议？"],["I fold up the chairs.","我把椅子折起来。"],["She jumped down off the chair.","她跳下椅子。"]]},{"l":"t.i.d/y","p":"ˈt.aɪ.d/i","cn":"整洁的；整齐的；使整洁；整理（只要求理解）","s":[["It must have cost a tidy sum.","这准花了相当大的一笔钱。"],["He lives alone in a suspiciously tidy apartment.","他独自一人住在一套整洁得出奇的公寓里。"],["They sat in her neat and tidy kitchen.","他们坐在她那干净整齐的厨房里。"]]},{"l":"m.u/s.i.c","p":"ˈm.juː/z.ɪ.k","cn":"音乐（只要求理解）","s":[["Anyone can appreciate our music.","任何人都能欣赏我们的音乐。"],["His music is sheer delight.","他的音乐是纯粹的快乐。"],["Music filled the night air.","夜空荡漾着乐声。"]]},{"l":"d.oor","p":"d.ɔː","cn":"门","s":[["The door is marked \"Private.\"","门上写着“闲人免进”。"],["The door closed behind him.","他一出门，门就关上了。"],["Who's sitting nearest the door?","谁坐在离门最近的地方？"]]},{"l":"w.i.n/d.ow","p":"ˈw.ɪ.n/d.əʊ","cn":"窗","s":[["Stay away from windows.","远离窗户。"],["Windows are usually sealed off.","窗户通常是封闭的。"],["I climbed through the window.","我从窗口爬了出来。"]]},{"l":"f.a.n","p":"f.æ.n","cn":"风扇","s":[["His fans called goldfish.","他的粉丝叫金鱼。"],["I'm a big fan of hers.","我是她的狂热追随者。"],["The band's fans are getting younger.","这支乐队的歌迷越来越年轻了。"]]},{"l":"wh.e.n","p":"w.e.n","cn":"当……时；什么时候（只要求理解）","s":[["When is your next appointment?","你下一次预约时间是什么时候？"],["When does the concert begin?","音乐会什么时间开始？"],["People eat when they're depressed.","人们会在沮丧时吃东西。"]]},{"l":"u.n/d.er/s.t.a.n.d","p":"ˌʌ.n/d.ə/ˈs.t.æ.n.d","cn":"懂；理解（只要求理解）","s":[["Can you understand French?","你懂法语吗？"],["Few people understand the difference.","很少有人了解这个差别。"],["\"I quite understand,\" he replied.","“我很理解”，他回答道。"]]},{"l":"w.a.ll","p":"w.ɔː.l","cn":"墙；壁（只要求理解）","s":[["She leaned against the wall.","她倚靠着墙。"],["It is fixed on the wall.","它是固定在墙上的。"],["The boys climbed over the wall.","那些男孩翻过了那堵墙。"]]},{"l":"n.ew.s/p.a/p.er","p":"ˈn.juː.z/p.eɪ/p.ə","cn":"报纸（只要求理解）","s":[["May I borrow your newspaper?","把你的报纸借我看行吗？"],["The newspaper is distributed free.","这份报纸免费发送。"],["Give us the newspaper, will you?","把报纸给我好吗？"]]},{"l":"h.a.n.d ou.t","p":"h.æ.n.d aʊ.t","cn":"分发（只要求理解）","s":[["His job is to hand out food and clothes.","他的工作是分发食物和衣服。"],["Could you help me hand out these papers, please?","你能帮我分发这些文件吗？"],["One of my jobs was to hand out the prizes.","我的工作之一是分发奖品。"]]},{"l":"w.or.k/b.oo.k","p":"ˈw.ɜː.k/b.ʊ.k","cn":"练习册；作业本（只要求理解）","s":[]}]},{"name":"Unit 2 Family rules","words":[{"l":"w.a.tch","p":"w.ɒ.tʃ","cn":"看（只要求理解）","s":[["Hey, watch where you're going!","嘿，瞧着点路！"],["My watch keeps going wrong.","我的表不断地出毛病。"],["They watch too much TV.","他们看电视看得太多了。"]]},{"l":"T/V","p":"ˌtiː/ˈviː","cn":"电视（只要求理解）","s":[["He directed various TV shows.","他导演过各种电视节目。"],["She regularly appears on TV.","她经常在电视上露面。"],["They watch too much TV.","他们看电视看得太多了。"]]},{"l":"h.o.m.e/w.or.k","p":"ˈh.əʊ.m.-/w.ɜː.k","cn":"家庭作业","s":[["I hate homework. Specially history.","我讨厌家庭作业，特别是历史。"],["How much homework do you get?","你有多少家庭作业？"],["He let us off homework today.","他今天免了我们的家庭作业。"]]},{"l":"f.ir.s.t","p":"f.ɜː.s.t","cn":"首先；首次；第一（只要求理解）","s":[["First class costs more.","第一类邮件邮资较高。"],["We're expecting our first baby.","我们要生第一个孩子了。"],["Let's talk about decision making first.","让我们首先谈谈决策制定。"]]},{"l":"w.e.t","p":"w.e.t","cn":"湿的；未干的（只要求理解）","s":[["Wet weather always depresses me.","阴雨天总使我心情抑郁。"],["We arrived home soaking wet.","我们回到家时，浑身湿淋淋的。"],["It was a grey, wet, April Sunday.","那是一个阴沉、潮湿、4月里的星期天。"]]},{"l":"r.u.n","p":"r.ʌ.n","cn":"跑；奔跑（只要求理解）","s":[["I can run fast.","我能跑得快。"],["We've run short of milk.","我们牛奶不够了。"],["The batteries are running down.","电池快耗完了。"]]},{"l":"l.i.v/i.ng r.oo.m","p":"ˈl.ɪ.v/ɪ.ŋ r.uː.m","cn":"客厅；起居室","s":[["The living room is tiny.","这间起居室极小。"],["I'd like the use of your living room, if I may.","如果可以，我想用用你的起居室。"],["The living room is pockmarked with bullet holes.","起居室墙壁上坑坑洼洼地布满了弹孔。"]]},{"l":"s.a.f.e","p":"s.eɪ.f.-","cn":"安全的（只要求理解）","s":[["I'm so glad (that) you're safe!","你安然无恙我真高兴！"],["The children are quite safe here.","孩子们在这里十分安全。"],["'You're safe!' Tom cried in delight.","“你安全啦！”汤姆高兴地大声说道。"]]},{"l":"w.or.d","p":"w.ɜː.d","cn":"言语；单词；字","s":[["We never doubted her word.","我们从不怀疑她的许诺。"],["What's the meaning of this word?","这个单词的意思是什么？"],["That's a word I never use.","那是我从来不用的字眼。"]]},{"l":"w.a.sh","p":"w.ɒ.ʃ","cn":"洗","s":[["This sweater washes well.","这件套衫很耐洗。"],["These jeans need washing.","这条牛仔裤该洗了。"],["I must wash the car tomorrow.","我明天必须冲洗汽车。"]]},{"l":"h.e.l.p/f.u.l","p":"ˈh.e.l.p/f.ə.l","cn":"有帮助的；有用的（只要求理解）","s":[["She made helpful comments on my work.","她对我的工作提出了有益的意见。"],["Sorry I can't be more helpful.","对不起，我帮不上更多的忙。"],["You deserve a reward for being so helpful.","你帮了这么大的忙，理应受到奖励。"]]},{"l":"l.ou.d","p":"l.aʊ.d","cn":"说话太大声的；吵闹的（只要求理解）","s":[["A loud bang made me jump.","砰的一声巨响吓我一跳。"],["Loud voice can usually make the attacker calm down.","响亮的声音通常可以让攻击者冷静下来。"],["Loud screams rent the air.","高声的尖叫划破了天空。"]]},{"l":"s.l.ee.p","p":"s.l.iː.p","cn":"睡觉（只要求理解）","s":[["Never go to sleep angry.","永远不要带着怒气入睡。"],["Go to sleep —it's late.","快睡吧—不早了。"],["They sleep by day and hunt by night.","他们白天睡觉，夜晚捕猎。"]]},{"l":"b.e.d/r.oo.m","p":"ˈb.e.d/r.uː.m","cn":"卧室","s":[["The main bedroom is enormous.","主卧室大极了。"],["Both movies are about a monster in the bedroom cupboard.","两部电影都是关于卧室橱柜里的一个怪物。"],["The two bedrooms adjoin.","这两间卧室毗连。"]]},{"l":"k.i.tch/e.n","p":"ˈk.ɪ.tʃ/ɪ.n","cn":"厨房","s":[["The kitchen is a good size.","这厨房相当大。"],["Although small, the kitchen is well designed.","厨房虽小，但设计巧妙。"],["She secreted the gun in the kitchen cabinet.","她把枪藏在了厨房的橱柜里。"]]},{"l":"s.t.u.d/y","p":"ˈs.t.ʌ.d/i","cn":"书房","s":[["She's studying art history.","她正在研读艺术史。"],["This study builds on earlier work.","这项研究是在以往工作的基础上进行的。"],["Are you study in middle school?","你在中学读书吗？"]]},{"l":"b.a.th/r.oo.m","p":"ˈb.ɑː.θ/r.uː.m","cn":"浴室；洗手间","s":[["The bathroom is entirely my own creation.","这个浴室完全是我个人的创作。"],["Are you done hogging the bathroom?","你要霸占浴室到什么时候？"],["I went next door to the bathroom.","我进了隔壁的洗手间。"]]},{"l":"th.i.n.k","p":"θ.ɪ.ŋ.k","cn":"想；思考（只要求理解）","s":[["The news started me thinking.","那条消息让我思考起来。"],["I'm only thinking of you.","我只是在为你着想。"],["Already, she is thinking ahead.","她早就在考虑未来了。"]]},{"l":"w.or.k","p":"w.ɜː.k","cn":"（花费时间和精力）做（某事）；工作（只要求理解）","s":[["He works in insurance.","他在保险业工作。"],["It works by electricity.","这是电动的。"],["I work in advertising.","我在广告业工作。"]]},{"l":"h.ar.d","p":"h.ɑː.d","cn":"努力地；费力地（只要求理解）","s":[["She tried extra hard.","她特别努力。"],["It's pretty hard to explain.","这事很难解释清楚。"],["That's a very hard question.","那是个很难的问题。"]]},{"l":"f.o.l/l.ow","p":"ˈf.ɒ.l/-.əʊ","cn":"遵循，听从（忠告、指示等）（只要求理解）","s":[["Other problems may follow.","其它问题也许会随之而来。"],["If you lead, I'll follow.","你领头，我跟着。"],["Sorry—I don't quite follow.","对不起，我不太听懂你的话。"]]},{"l":"f.ee.l","p":"f.iː.l","cn":"觉得；感到（只要求理解）","s":[["I feel absolutely terrific today!","我今天的感觉真是好极了！"],["Are you feeling all right?","你感觉还好吗？"],["I am feeling very depressed.","我感到很沮丧。"]]}]},{"name":"Unit 3 Time for school","words":[{"l":"o/v.er","p":"ˈəʊ/v.ə","cn":"结束（的）（只要求理解）","s":[["Thank goodness that's over!","谢天谢地，事情总算过去了！"],["Well, thank goodness that's over!","好啦，谢天谢地，这件事总算过去了！"],["His dark head bent over her.","他对她低下他那黑发的头。"]]},{"l":"k.i.d","p":"k.ɪ.d","cn":"小孩（只要求理解）","s":[["She's a bright kid.","她是个聪明孩子。"],["Kids love dressing up.","孩子们都喜欢装扮成别人玩儿。"],["Will you kids just behave!","孩子们，规矩点！"]]},{"l":"d.i.n/n.er","p":"ˈd.ɪ.n/-.ə","cn":"（中午或晚上吃的）正餐","s":[["It's time for dinner.","该吃饭了。"],["It's your turn to cook dinner.","该你做饭了。"],["What time do you serve dinner?","你们什么时候供应主餐？"]]},{"l":"ar.t","p":"ɑː.t","cn":"美术；艺术","s":[["She's studying art history.","她正在研读艺术史。"],["Where is the art room?","绘画教室在哪里？"],["She's good at art and design.","她擅长美术和设计。"]]},{"l":"l.u.n.ch","p":"l.ʌ.n.tʃ","cn":"午餐","s":[["We'll leave after lunch.","我们将在午饭后动身。"],["Who's getting the lunch?","谁在做中午饭？"],["For lunch, dress is informal.","吃午餐可以穿着休闲装。"]]},{"l":"m.a.th.s","p":"m.æ.θ.s","cn":"数学","s":[["Where is you maths book?","你的数学书在哪里？"],["He has lost his maths book.","他已经把数学书丢了。"],["I want a Maths book. Where can I find it?","我想要一本数学书。我在哪里能找到它？"]]},{"l":"g.e.t u.p","p":"ɡ.e.t ʌ.p","cn":"起床","s":[["I generally get up at six.","我一般六点钟起床。"],["Do you have difficulty getting up?","你起床有困难吗？"],["We've got to get up early, all right?","我们得早起床，可以吧？"]]},{"l":"g.o t.o s.ch.oo.l","p":"ɡ.əʊ t.uː s.k.uː.l","cn":"上学","s":[["They go to school by bike.","他们经常骑自行车去上学。"],["She will have to go to school.","她将不得不去上学。"],["Some children can read and write before they go to school.","有些孩子在上学前就会看书写字了。"]]},{"l":"g.o h.o.m.e","p":"ɡ.əʊ h.əʊ.m.-","cn":"回家","s":[["Are you going home for Thanksgiving?","你回家过感恩节吗？"],["Let's go home—it's getting late.","咱们回家吧，时间不早了。"],["Come (my) dearest, let's go home.","好啦，亲爱的，咱们回家吧。"]]},{"l":"g.o t.o b.e.d","p":"ɡ.əʊ t.uː b.e.d","cn":"上床睡觉","s":[["I think it's time to go to bed.","我想该睡觉了。"],["You'd better go to bed and nurse that cold.","你最好上床睡觉，把感冒治好。"],["She was the last to go to bed.","她是最后一个睡觉的人。"]]},{"l":"w.a.n.t","p":"w.ɒ.n.t","cn":"想要（只要求理解）","s":[["What do you want?","你要什么？"],["They desperately wanted a child.","他们非常想要一个孩子。"],["I don't want your pity.","我用不着你可怜。"]]},{"l":"c.l.o.ck","p":"k.l.ɒ.k","cn":"时钟（只要求理解）","s":[["The clock showed midnight.","时钟显示已是午夜。"],["I set my alarm clock for 4:30.","我把闹钟定在4:30。"],["I set the alarm clock for 7 o'clock.","我把闹钟定在7点钟闹响。"]]},{"l":"j.u.s.t","p":"dʒ.ʌ.s.t","cn":"只是；仅仅；正要（只要求理解）","s":[["I've just finished Chapter 3.","我刚完成第3章。"],["Will you kids just behave!","孩子们，规矩点！"],["I'm just finishing my book.","眼下我正在完成我的一本书。"]]},{"l":"m.i.n/u.t.e","p":"ˈm.ɪ.n/ɪ.t.-","cn":"分钟（只要求理解）","s":[["The minutes dragged past.","时间一分一分地过去了。"],["OK, wait just a minute.","好的，稍微等一下。"],["Only a minute amount is needed.","只需很少的一点。"]]}]},{"name":"Unit 4 Going shopping","words":[{"l":"t.r.ou/s.er.s","p":"ˈt.r.aʊ/z.ə.z","cn":"裤子","s":[["These trousers are a bit tight.","这条裤子有点紧。"],["The trousers have a fly fastening.","这条裤子是前开口。"],["He was dressed in khaki trousers.","他穿着一条卡其色的裤子。"]]},{"l":"p.air","p":"p.eə","cn":"（由连在一起的相似两部分构成的）一条，一副（只要求理解）","s":[["Maximo put on a pair of glasses.","马克西莫戴上了一副眼镜。"],["I need a new pair of specs.","我需要一副新眼镜。"],["Don't tell me you've split another pair of pants!","你不会又把一条裤子撑破了吧！"]]},{"l":"c.l.o.th.e.s","p":"k.l.əʊ.ð.-.z","cn":"衣服；服装（只要求理解）","s":[["He wears monkey clothes.","他穿着猴子服。"],["She makes her own clothes.","她自己做衣服。"],["We packed away the summer clothes.","我们把夏装收藏起来了。"]]},{"l":"th.o.s.e","p":"ð.əʊ.z.-","cn":"（指较远的人或事物）那些（只要求理解）","s":[["Are those real flowers?","那些是真花吗？"],["What are those buildings?","那些建筑物是什么？"],["No, silly, those aren't your shoes!","不对，傻孩子，那不是你的鞋！"]]},{"l":"sh.or.t.s","p":"ʃ.ɔː.t.s","cn":"短裤","s":[["He was wearing a T-shirt and shorts.","他穿着T恤衫和短裤。"],["My shorts were chafing my thighs.","我的短裤蹭得我大腿疼。"],["She wore shorts and a halter top.","她穿一条短裤和一件颈部系带的上衣。"]]},{"l":"j.a.ck/e.t","p":"ˈdʒ.æ.k/ɪ.t","cn":"夹克衫；短上衣","s":[["I'll take the grey jacket.","我要那件灰色夹克衫。"],["This jacket is just my size.","这件夹克正合我的尺码。"],["Does this jacket go with this skirt?","这件上衣与这条裙子相配吗？"]]},{"l":"s.k.ir.t","p":"s.k.ɜː.t","cn":"裙子","s":[["Short skirts are back.","短裙又流行起来了。"],["She usually wears long skirts.","她通常穿长裙。"],["The skirt has a side opening.","这裙子是侧面开口的。"]]},{"l":"d.ear","p":"d.ɪə","cn":"亲爱的（只要求理解）","s":[["What's your name, dear?","你叫什么名字，亲爱的？"],["My dear girl, you're wrong.","我亲爱的姑娘，你错了。"],["Would you like a drink, dear?","喝点什么吗，亲爱的？"]]},{"l":"e.x/p.e.n/s.i.v.e","p":"ɪ.ks/ˈp.e.n/s.ɪ.v.-","cn":"昂贵的；价格高的","s":[["It's so expensive to borrow from finance companies.","向金融公司借款费用真够高的。"],["Firstly, it's expensive, and secondly, it's too slow.","首先是价格贵，其次，速度太慢。"],["Skiing gear can be expensive.","滑雪用具有时会很昂贵。"]]},{"l":"t.a.k.e","p":"t.eɪ.k.-","cn":"买下（只要求理解）","s":[["We take the 'Express'.","我们订阅的是《快报》。"],["Take back your wheel!","拿回你的轮子！"],["I'll take the grey jacket.","我要那件灰色夹克衫。"]]},{"l":"ch.ea.p","p":"tʃ.iː.p","cn":"便宜的","s":[["Cycling is a cheap way to get around.","骑自行车是一种省钱的旅游方式。"],["It wasn't cheap. Anything but.","它不便宜。绝对不。"],["The meal was amazingly cheap.","这餐饭便宜得出奇。"]]},{"l":"sh.oe","p":"ʃ.uː","cn":"鞋","s":[["Put away your shoes.","把鞋子放好。"],["What are these, clown shoes?","这些是什么？小丑鞋？"],["No, silly, those aren't your shoes!","不对，傻孩子，那不是你的鞋！"]]},{"l":"b.eau/t.i/f.u.l","p":"ˈb.juː/t.ɪ/f.ə.l","cn":"美丽的","s":[["New England is beautiful.","新英格兰很迷人。"],["These chopsticks are beautiful!","这些筷子真漂亮！"],["It's a beautiful, clean and orderly city.","这是一座美丽、干净、整齐的城市。"]]},{"l":"h.a.t","p":"h.æ.t","cn":"帽子","s":[["I've always hated cabbage.","我从来都讨厌吃卷心菜。"],["That's a cool hat.","那是一顶很酷的帽子。"],["Our cat hates being handled.","我们的猫不喜欢被人摸弄。"]]},{"l":"s.u.n/g.l.a.ss/e.s","p":"ˈs.ʌ.n/ɡ.l.ɑː.s/ɪ.z","cn":"太阳镜；墨镜","s":[["My sunglasses were in pieces.","我的太阳镜碎了。"],["She sat up and removed her designer sunglasses.","她坐起来，摘掉她的时尚墨镜。"],["These sunglasses are designed to reduce glare.","这些太阳镜是为减少刺眼的强光而设计的。"]]},{"l":"f.r.ee","p":"f.r.iː","cn":"免费的（只要求理解）","s":[["Delivery is free of charge.","免费送货。"],["The newspaper is distributed free.","这份报纸免费发送。"],["Entry to the museum is free.","这座博物馆免费参观。"]]},{"l":"l.ar.g.e","p":"l.ɑː.dʒ.-","cn":"（服装、食物、日用品等）大型号的（只要求理解）","s":[["Break into large pieces.","撕成大片。"],["The wheels are usually fairly large.","该机轮通常相当大。"],["Her killer is still at large.","杀害她的凶手仍然逍遥法外。"]]},{"l":"s.i.z.e","p":"s.aɪ.z.-","cn":"尺码；号（只要求理解）","s":[["This jacket is just my size.","这件夹克正合我的尺码。"],["What size shoes do you take?","你穿多大号的鞋？"],["The kitchen is a good size.","这厨房相当大。"]]},{"l":"l.i.s.t","p":"l.ɪ.s.t","cn":"清单；目录（只要求理解）","s":[["I am already on your mailing list.","我已经列在你的邮寄名单上了。"],["They will not be on the 5A scenic spot list.","它们不会出现在 5A 级风景区的名单上。"],["Keep a running list, and cross out the ones you have read.","持续更新列表，把你读过的划掉。"]]},{"l":"t.r.y o.n","p":"t.r.aɪ ɒ.n","cn":"试穿（只要求理解）","s":[["You can try on this schoolbag.","您可以试背一下这个书包。"],["Let the child try on as many as she likes.","让这个孩子爱试穿多少就试多少吧。"],["Try on clothing and shoes to make sure they fit.","衣服和鞋要试穿以确保它们合适。"]]},{"l":"a.n/y","p":"ˈe.n/i","cn":"任何的；任一的（只要求理解）","s":[["Any colour will do.","什么颜色都行。"],["Any shopping center is fine.","任何购物中心都可以。"],["Do you give any discount?","你们打折吗？"]]}]},{"name":"Unit 5 Farms and us","words":[{"l":"c.ow","p":"k.aʊ","cn":"奶牛","s":[["Do you know how to milk a cow?","你知道怎样挤牛奶吗？"],["A cow will give a kid milk every day.","奶牛每天都会给一头小牛喂奶。"],["The disease is more commonly known as Mad Cow Disease.","这种病一般更多地被称作“疯牛病”。"]]},{"l":"h.or.s.e","p":"h.ɔː.s.-","cn":"马","s":[["This horse needs firm handling.","这匹马需要严加训练。"],["The horse slowed to a walk.","那匹马慢下来缓步而行。"],["Is this gift a Trojan horse?","这个礼物该不会是特洛伊木马吧？"]]},{"l":"sh.ee.p","p":"ʃ.iː.p","cn":"羊；绵羊","s":[["Sheep were grazing in the fields.","羊在野地里吃草。"],["They kept a small flock of sheep.","他们养了一小群绵羊。"],["The field had been grazed by sheep.","这块地羊已经啃过了。"]]},{"l":"p.i.g","p":"p.ɪ.ɡ","cn":"猪","s":[["These guys destroyed the company. They're all a bunch of greedy pigs.","这些家伙毁了公司。他们是一群贪婪的猪。"],["\"A talking pig!\" he exclaimed. \"Well, I'll be darned.\"","“一头会说话的猪！”他惊叫到，“啊，我太惊奇了”。"],["When would they be hired again? Perhaps, as the saying goes, when pigs fly.","他们什么时候会被重新雇用？也许正像俗话说的，等到猴年马月吧。"]]},{"l":"ch.i.ck/e.n","p":"ˈtʃ.ɪ.k/ɪ.n","cn":"鸡；鸡肉","s":[["I have to feed chickens in my back yard.","我必须去喂食后院的鸡。"],["Chickens pecked in the dust.","小鸡们在尘土中啄食。"],["The chicken was only half cooked.","鸡只煮了半熟。"]]},{"l":"t.o/m.a/t.o","p":"t.ə/ˈm.ɑː/t.əʊ","cn":"西红柿","s":[["It's similar in size to a tomato.","大小和西红柿差不多。"],["Cut the plum tomatoes in half.","把这个李子形番茄对半切开。"],["The tomato hit the wall with a splat.","西红柿啪的一声打在墙上。"]]},{"l":"b.ee","p":"b.iː","cn":"蜜蜂（只要求理解）","s":[["Bees buzzed lazily among the flowers.","蜜蜂在花丛中懒洋洋地嗡嗡叫着。"],["The flower opens to reveal a bee.","花开了，露出来一只蜜蜂。"],["Without bees visiting flowers in this way, many plants would die out.","如果没有蜜蜂以这种方式采花，许多植物将会灭绝。"]]},{"l":"m.ou.s.e","p":"m.aʊ.s.-","cn":"（复数mice）老鼠（只要求理解）","s":[["A cat often plays with a mouse before the kill.","猫在咬死老鼠之前常常要耍弄它一番。"],["He moves the cursor, clicks the mouse.","他移动光标，点击鼠标。"],["The mouse ran away, squeaking with fear.","那只老鼠吓得尖叫着溜了。"]]},{"l":"c.a.r/r.o.t","p":"ˈk.æ.r/-.ə.t","cn":"胡萝卜","s":[["The carrot is his favorite vegetable.","胡萝卜是他最喜欢的蔬菜。"],["Her carrot cake is divine.","她的胡萝卜饼好吃极了。"],["It's never a carrot or a peach.","从来没有胡萝卜或桃子。"]]},{"l":"p.o/t.a/t.o","p":"p.ə/ˈt.eɪ/t.əʊ","cn":"土豆","s":[["I'll dig some potatoes for lunch.","我要挖点土豆作午餐。"],["He's a real meat-and-potatoes guy.","他是个十分崇尚简朴的人。"],["She put some potatoes on to boil.","她煮了些土豆。"]]},{"l":"g.r.ee.n b.ea.n","p":"ɡ.r.iː.n b.iː.n","cn":"青刀豆；四季豆（只要求理解）","s":[["We have green bean casserole and pumpkin pie.","我们有绿豆焙盘和南瓜馅饼。"],["Each of us chose from the many pots of tomato juice, green beans and jelly.","我们每个人都从许多罐番茄汁、青豆和果冻中挑选。"]]},{"l":"c.a.n","p":"k.æ.n","cn":"（盛食品或饮料的）金属罐（只要求理解）","s":[["Can we change seats?","咱们可以交换一下座位吗？"],["Can I come too?","我也可以来吗？"],["I can run fast.","我能跑得快。"]]},{"l":"a b.o.x o.f","p":"ə b.ɒ.ks ə.v","cn":"一盒，一箱（东西）（只要求理解）","s":[]}]},{"name":"Unit 6 On the farm","words":[{"l":"f.ee.d","p":"f.iː.d","cn":"给（人或动物）食物；饲养","s":[["Can you feed the cat, please?","请你喂一下猫好吗？"],["There are many advantages to breast feeding.","母乳喂养的好处很多。"],["New fathers love bottle-feeding their babies.","新爸爸们喜欢用奶瓶喂他们的婴儿。"]]},{"l":"p.a.ss","p":"p.ɑː.s","cn":"给；递（只要求理解）","s":[["He's determined to pass this time.","这一回他决心要考及格。"],["He largely passed over the government's record.","他对政府的相关记录基本上是避而不谈。"],["Memorize a poem and pass it on.","记住一首诗并把它传下去。"]]},{"l":"p.i.ck","p":"p.ɪ.k","cn":"采；摘","s":[["I picked some flowers.","我摘了一些花。"],["I'll pick you up at five.","我五点钟来接你。"],["She picked me a bunch of flowers.","她给我采了一束鲜花。"]]},{"l":"m.i.l.k","p":"m.ɪ.l.k","cn":"挤奶","s":[["Is this milk fresh?","这是鲜牛奶吗？"],["She's gone for some milk.","她买牛奶去了。"],["We've run short of milk.","我们牛奶不够了。"]]},{"l":"k.n.i.f.e","p":"-.n.aɪ.f.-","cn":"刀","s":[["This knife needs sharpening.","这把刀需要磨了。"],["The knife sliced his jacket.","那把刀划破了他的上衣。"],["The knife pierced through his coat.","刀子刺穿了他的外衣。"]]},{"l":"f.or.k","p":"f.ɔː.k","cn":"餐叉","s":[["She popped a balloon with her fork.","她用叉子把气球砰的一声戳爆了。"],["She stabbed the air with her fork.","她用叉子在空中比画。"],["Visitors to the castle had to fork out for a guidebook.","参观城堡的游客得为一本旅游指南掏很多钱。"]]},{"l":"ch.o.p/s.t.i.ck","p":"ˈtʃ.ɒ.p/s.t.ɪ.k","cn":"（常用复数）筷子","s":[["These chopsticks are beautiful!","这些筷子真漂亮！"],["Don't bite the chopsticks.","不要咬筷子。"],["He buys some Chinese chopsticks.","他买了一些中国的筷子。"]]},{"l":"w.a.s.t.e","p":"w.eɪ.s.t.-","cn":"浪费；废品（只要求理解）","s":[["I hate unnecessary waste.","我憎恨不必要的浪费。"],["It's a waste of time and energy.","那是浪费时间和精力。"],["It's sinful to waste good food!","浪费好好的食物是有罪的！"]]},{"l":"f.oo.d","p":"f.uː.d","cn":"菜肴；食物（只要求理解）","s":[["She couldn't digest food properly.","她无法正常消化食物。"],["My favorite food is dumpling.","我最喜欢的食物是饺子。"],["She had to steal food just to stay alive.","她得偷食物才不至于饿死。"]]},{"l":"d.e/l.i.cious","p":"d.ɪ/ˈl.ɪ.ʃəs","cn":"美味的；可口的（只要求理解）","s":[["This pancake tastes delicious.","这煎饼尝起来味道不错。"],["He served up a delicious meal.","他端上一顿可口的饭菜。"],["She served us a delicious lunch.","她招待我们吃了一顿可口的午餐。"]]},{"l":"c.l.ear th.e t.a/b.le","p":"k.l.ɪə ð.ə ˈt.eɪ/b.l","cn":"收拾餐桌（只要求理解）","s":[]},{"l":"s.e.t th.e t.a/b.le","p":"s.e.t ð.ə ˈt.eɪ/b.l","cn":"摆放餐具（只要求理解）","s":[["One would shop and cook, another would set the table and another would wash up.","一人会购物和烹饪，一人摆桌子，另外一人洗餐具。"]]},{"l":"b.ow.l","p":"b.əʊ.l","cn":"碗","s":[["I go bowling for relaxation.","我玩保龄球放松自己。"],["The Giants won the Super Bowl in 1987.","巨人队在1987年赢得超级杯。"],["I have a bowl of cereal every morning.","我每天早上吃一碗麦片粥。"]]},{"l":"s.p.oo.n","p":"s.p.uː.n","cn":"勺；匙；调羹","s":[["He stirred his coffee with a spoon.","他用匙搅
