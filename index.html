iews tend towards the extreme.","他的观点趋于偏激。"]]},{"l":"s.o.m.e/d.ay","p":"ˈs.ʌ.m.-/d.eɪ","cn":"adv. 总有一天；有朝一日","s":[["So you fancy yourself as the boss someday?","那么你认为自己有一天会成老板？"],["Someday I'll be a pilot.","将来有一天我将成为一名飞行员。"]]},{"l":"e.x/p.e/r.i/ence","p":"ɪ.ks/ˈp.ɪə/r.i/əns","cn":"n. 经历；阅历","s":[["Experience is essential for this job.","对于这个工作，经验是非常重要的。"],["She's very young and not very experienced.","她很年轻，还不太老练。"],["He's very experienced in looking after animals.","他养动物很有经验。"]]},{"l":"l.a.n.d/er","p":"ˈl.æ.n.d/ə","cn":"n. 着陆器","s":[]},{"l":"i.s/l.a.n.d","p":"ˈaɪ.-/l.ə.n.d","cn":"n. 岛","s":[["We rowed around the island.","我们绕着岛划船。"],["The island is hot and humid in the summer.","这个岛在夏季又热又潮湿。"],["The islands belong to Spain.","这些岛屿隶属西班牙。"]]},{"l":"a.n/ci.e.n.t","p":"ˈeɪ.n/ʃ.ə.n.t","cn":"adj. 古老的；很老的","s":[["The town is notable for its ancient harbour.","这座小镇因其古老的港口而出名。"],["The Olympic Games began in Olympia, in ancient Greece.","奥林匹克运动会起源于古希腊的奥林匹亚。"],["The aisle was floored with ancient bricks.","过道由古旧的砖块铺就。"]]},{"l":"p.o/e.m","p":"ˈp.əʊ/ɪ.m","cn":"n. 诗","s":[["The poem uses simple language.","这首诗用语简单。"],["The poem contrasts youth and age.","这首诗对比了青春与老年。"],["Memorize a poem and pass it on.","记住一首诗并把它传下去。"]]},{"l":"e.x/p.r.e.ss","p":"ɪ.ks/ˈp.r.e.s","cn":"v. 表示；表达；表露","s":[["They expressed themselves delighted.","他们表示他们很高兴。"],["Teenagers often have difficulty expressing themselves.","十来岁的孩子在表达思想方面常常有困难。"],["The figure is expressed as a percentage.","数字是用百分率表示的。"]]},{"l":"d.e/t.er/m.i/n.a/tion","p":"d.ɪ/ˌt.ɜː/m.ɪ/ˈn.eɪ/ʃən","cn":"n. 决心；坚毅；坚定","s":[["He showed great courage and determination.","他表现得十分勇敢和果断。"],["Her determination never wavered.","她的决心从未动摇过。"],["He has a ruthless determination to succeed.","他有不获成功决不罢休的坚定决心。"]]},{"l":"u/n.i/v.er.s.e","p":"ˈjuː/n.ɪ/v.ɜː.s.-","cn":"n. 宇宙","s":[["The universe is slowly yielding up its secrets.","宇宙慢慢地展现出它的秘密。"],["The clear inference is that the universe is expanding.","显然结论是宇宙在扩大。"],["The idea of a parallel universe is hard to grasp.","认为另有一个平行宇宙的概念是很难理解的。"]]},{"l":"a.l/r.ea.d/y","p":"ɔː.l/ˈr.e.d/i","cn":"adv. 已经；早已","s":[["Already, she is thinking ahead.","她早就在考虑未来了。"],["It's gone six o'clock already.","过了六点了。"],["A crowd already filled the gallery.","一群人已经挤满了廊台。"]]},{"l":"c.e.n/tu/r.y","p":"ˈs.e.n/tʃə/r.i","cn":"n. 世纪","s":[["The name has come down from the last century.","这名称是从上个世纪流传下来的。"],["Some have called him the greatest entertainer of the twentieth century.","有人称他为20世纪最伟大的表演艺术家。"],["She looked like a princess in a nineteenth-century illustration.","她看上去像19世纪插图里的公主。"]]},{"l":"n.eigh/b.our","p":"ˈn.eɪ/b.ə","cn":"n. 邻居","s":[["Britain's nearest neighbour is France.","英国最近的邻国是法国。"],["This neighbour crewed on a ferryboat.","这位邻居在一艘渡船上当船员。"],["They don't mix much with the neighbours.","他们不怎么与邻居交往。"]]},{"l":"c.ir/c.le","p":"ˈs.ɜː/k.l","cn":"v. 环行","s":[["He has a small circle of friends.","他有一个小小的朋友圈子。"],["It's a circle, a loop.","它是一个圆，一个循环。"],["She walked clockwise around the circle.","她绕着圈顺时针走。"]]},{"l":"s.ur/f.a.c.e","p":"ˈs.ɜː/f.ɪ.s.-","cn":"n. 表面；表层；面","s":[["70% of our globe's surface is water.","我们地球表面的70%是水。"],["He needs money to electrify his surface lines.","他需要钱把他的地面铁路电气化。"],["Make sure the paint covers the surface evenly.","要确保油漆均匀地涂在表面上。"]]},{"l":"r.e/l.ea.s.e","p":"r.ɪ/ˈl.iː.s.-","cn":"v. 放开；松开；使自由移动（或飞翔、降落等）（只要求理解）","s":[["He refused to release her arm.","他不肯放开她的胳膊。"],["He has been released from jail.","他已从监狱里放出来了。"],["Becoming your own person releases your creativity.","保持你自己的本色可以释放出你的创造力。"]]},{"l":"k.i.l/o/g.r.a.m","p":"ˈk.ɪ.l/ə/ɡ.r.æ.m","cn":"n. 千克；公斤","s":[["Flour is sold by the kilogram.","面粉按公斤出售。"],["We bought a kilogram of lemons from the supermarket.","我们从超市买了一公斤的柠檬。"],["We will take a chunk of some material and we will call it a kilogram.","我们取一大块物质，称它为一千克。"]]},{"l":"p.r.o/g.r.a.mm.e","p":"ˈp.r.əʊ/ɡ.r.æ.m.-","cn":"n. 计划；方案","s":[["I thoroughly enjoy your programme.","我非常喜欢你们的节目。"],["The programme's on Channel 4.","这个节目在4频道。"],["The programme was broadcast nationally.","这个节目曾在全国播放过。"]]},{"l":"s.p.a.c.e s.t.a/tion","p":"s.p.eɪ.s.- ˈs.t.eɪ/ʃən","cn":"空间站","s":[]},{"l":"d.o e.x/er/c.i.s.e","p":"d.uː ˈe.ks/ə/s.aɪ.z.-","cn":"锻炼；运动","s":[]},{"l":"t.a.k.e ph.o/t.o.s","p":"t.eɪ.k.- ˈf.əʊ/t.əʊ.z","cn":"拍照","s":[]},{"l":"g.e.t i.n/t.o or/b.i.t","p":"ɡ.e.t ˈɪ.n/t.uː ˈɔː/b.ɪ.t","cn":"进入轨道","s":[]},{"l":"th.ou/s.a.n.d.s o.f","p":"ˈθ.aʊ/z.-.n.d.z ə.v","cn":"数以千计；成千上万","s":[["Thousands of bank employees are facing redundancy as their employers cut costs.","数千名银行职员面临裁员，因为他们的雇主要削减成本。"],["The last offensive drove thousands of people into Thailand.","最近的一次进攻把成千上万的人驱赶到了泰国。"],["Thousands of people paid good money to watch the band perform.","成千上万的人花很多钱去观看这支乐队的演出。"]]}]},{"name":"Unit 6 Travelling around Asia","words":[{"l":"gu.i.d.e","p":"ɡ.aɪ.d.-","cn":"n. 指南；手册","s":[["I let my feelings be my guide.","我是跟着感觉走。"],["The guide flashed a light into the cave.","导游用手电筒照射洞穴。"],["Gym owner David Barton will guide them through a workout.","健身房主人戴维•巴顿将指导他们完成锻炼。"]]},{"l":"ea.s.t","p":"iː.s.t","cn":"n. 东；东方；adv. 朝东","s":[["They live on the east coast.","他们住在东海岸。"],["The Yangtze river is a natural barrier to the north-east.","长江是东北方向的一道天然屏障。"],["Finzer is not just any East Coast businessman.","芬泽并非一般的东海岸商人。"]]},{"l":"w.e.s.t","p":"w.e.s.t","cn":"n. 西；西方；adv. 朝西","s":[["This room faces west.","这个房间朝西。"],["The West is stingy with aid.","西方在援助上很吝啬。"],["He had arrived from Key West by jet.","他已乘喷气式飞机从基韦斯特来了。"]]},{"l":"m.i.x","p":"m.ɪ.ks","cn":"n. 混合；结合","s":[["They don't mix much with the neighbours.","他们不怎么与邻居交往。"],["I like to mix up designer clothes.","我喜欢把各种名牌服装混穿在一起。"],["Mix the batter and let it stand for twenty minutes.","搅好面糊以后，放上二十分钟。"]]},{"l":"w.e.s/t.er.n","p":"ˈw.e.s/t.ə.n","cn":"adj. 西方的；西方国家的","s":[["The single-engine plane landed in western Arizona.","单引擎飞机在亚利桑那州西部降落。"],["They have clearly embraced Western consumerism.","很明显他们已经接受了西方的消费主义观念。"],["The Bow Brook forms the western boundary of the wood.","鲍溪成了树林的西边界。"]]},{"l":"s.t.y.l.e","p":"s.t.aɪ.l.-","cn":"n. 风格","s":[["She does everything with style and grace.","她凡事都做得优雅得体。"],["Her style of dress was never conservative.","她的服装式样一点儿也不保守。"],["Her style is pared-down and simple.","她的风格简洁明了。"]]},{"l":"p.o.p/u/l.ar","p":"ˈp.ɒ.p/jə/l.ə","cn":"adj. 大众喜爱的；广受欢迎的","s":[["Gardening is very popular in Maryland.","园艺在马里兰州很受欢迎。"],["Exercises of this kind are very popular.","这种体育活动非常流行。"],["The restaurant is deservedly popular.","这餐馆为大众喜爱是理所当然的。"]]},{"l":"s.i.t.e","p":"s.aɪ.t.-","cn":"n. （建筑物、城镇等的）地点","s":[["Do you want to bookmark this site?","你想给这个站点做书签吗？"],["There is ample car parking off site.","外面有个很大的停车场。"],["The site is reached by a 30-minute hike through dense forest.","要花30分钟徒步穿过密林才能到达那个地方。"]]},{"l":"a/c.r.o.ss","p":"ə/ˈk.r.ɒ.s","cn":"prep. 在……对面；在……对过","s":[["Looking across from here.","从这里看过去。"],["It's too tight across the back.","背部太紧。"],["They parked across from the Castro Theatre.","他们在卡斯特罗剧院对面停了车。"]]},{"l":"a.d/u.l.t","p":"ˈæ.d/ʌ.l.t","cn":"n. 成年人","s":[["Each ticket admits one adult.","每张票只准许一位成人入场。"],["The admission price is $8 for adults.","入场费成人是$8。"],["Children must be accompanied by an adult.","儿童必须要有大人陪同。"]]},{"l":"s.e/n.i/or","p":"ˈs.iː/n.i/ə","cn":"n. 老年人；长者","s":[["The heroine is a senior TV executive.","女主人公是一位电视台高级主管。"],["Junior nurses usually work alongside more senior nurses.","初级护士通常和较高级的护士一起工作。"],["The President met with senior White House aides.","总统会见了白宫的高级助手。"]]},{"l":"c.u.s/t.o.m/er","p":"ˈk.ʌ.s/t.ə.m/ə","cn":"n. 顾客；主顾；客户","s":[["The customer called to cancel.","顾客打电话来取消了。"],["Customer: Excuseme, can I use my credit card?","顾客：请问可以刷卡消费吗？"],["The firm has excellent customer relations.","此公司与客户关系极好。"]]},{"l":"d.e/s.i.g.n","p":"d.ɪ/ˈz.aɪ.-.n","cn":"n. 设计","s":[["What is Instructional Design?","指导性设计是什么？"],["She's good at art and design.","她擅长美术和设计。"],["Although small, the kitchen is well designed.","厨房虽小，但设计巧妙。"]]},{"l":"e.l.s.e","p":"e.l.s.-","cn":"adv. 其他的；别的","s":[["Hurry up or else you'll be late.","快点，否则你就要迟到了。"],["Everyone else was there.","其他所有人都在那儿。"],["They're forever bitching about everybody else.","他们总是在埋怨其他的每个人。"]]},{"l":"s.u.g/g.e.s/tion","p":"s.ə.-/ˈdʒ.e.s/tʃən","cn":"n. 建议；提议","s":[["It's just a suggestion.","这只是一个建议。"],["This suggestion dumbfounded Joe.","这个建议使乔伊惊呆了。"],["I'd welcome any suggestions.","任何建议我都会愉快地接受。"]]},{"l":"t.i.p","p":"t.ɪ.p","cn":"n. 指点；实用的提示","s":[["Flat screen TV's easily tip over and can injure a child.","平板电视很容易发生翻转伤及儿童。"],["The tail tapered to a rounded tip.","尾部越来越细，最后成了个圆尖。"],["Did you give the waiter a tip?","你给服务员小费了吗？"]]},{"l":"h.i/s.t.o.r/i.c","p":"h.ɪ/ˈs.t.ɒ.r/ɪ.k","cn":"adj. 历史上著名（或重要）的；可名垂青史的（只要求理解）","s":[["We should take more care of our historic buildings.","我们应该更加爱护有历史意义的建筑。"],["There are efforts under way to designate the bridge a historic landmark.","在努力把这座桥定为历史地标。"],["The amount of litter in the streets is unbefitting for a historic city.","街道上垃圾之多与历史名城不协调。"]]},{"l":"l.i.s.t","p":"l.ɪ.s.t","cn":"n. 名单；目录","s":[["I am already on your mailing list.","我已经列在你的邮寄名单上了。"],["They will not be on the 5A scenic spot list.","它们不会出现在 5A 级风景区的名单上。"],["Keep a running list, and cross out the ones you have read.","持续更新列表，把你读过的划掉。"]]},{"l":"l.a.n.d/s.c.a.p.e","p":"ˈl.æ.n.d/s.k.eɪ.p.-","cn":"n. 风景；景色","s":[["This landscape seemed to trap and amplify sounds.","这种地形好像能聚拢和扩大声音。"],["Small coastal towns dot the landscape.","海滨小镇到处都是。"],["The landscape had a stark, unworldly beauty.","那景色有一种简朴、超凡的美。"]]},{"l":"m.e.m/o/r.y","p":"ˈm.e.m/ə/r.i","cn":"n. 回忆；记忆","s":[["Repetition helps improve our memory.","重复有助于提高我们的记忆力。"],["Memory is constitutive of identity.","记忆是身份的一个重要构成部分。"],["How much memory does the program occupy?","这个程序占用多少内存？"]]},{"l":"g.e.n/e/r.a.l","p":"ˈdʒ.e.n/ə/r.ə.l","cn":"n. 将军","s":[["She runs a general practice in Hull.","她在赫尔开了个全科诊所。"],["My father venerated General Eisenhower.","我父亲十分敬仰艾森豪威尔将军。"],["The General refused to be flustered.","将军没有被搅得慌乱不安。"]]},{"l":"s.igh.t","p":"s.aɪ.t","cn":"n. 看见","s":[["She has very good sight.","她的视力很好。"],["The boat disappeared from sight.","那艘船从视野中消失了。"],["Her sight is beginning to go.","她的视力开始下降。"]]},{"l":"n.a/tu/r.a.l","p":"ˈn.æ/tʃə/r.ə.l","cn":"adj. 自然的；天然的","s":[["She is a natural athlete.","她是个天生的运动健将。"],["Water is a fish's natural element.","水是鱼的天然生活环境。"],["The Yangtze river is a natural barrier to the north-east.","长江是东北方向的一道天然屏障。"]]},{"l":"a.l/m.o.s.t","p":"ˈɔː.l/m.əʊ.s.t","cn":"adv. 几乎；差不多","s":[["She answered almost immediately.","她几乎立刻就回答了。"],["They'll eat almost anything.","他们几乎什么都吃。"],["The story is almost certainly false.","这个故事几乎肯定是虚构的。"]]},{"l":"b.e/c.o.m.e","p":"b.ɪ/ˈk.ʌ.m.-","cn":"v. 开始变得；变成","s":[["Look how lazy we've become.","瞧我们变得有多懒。"],["Short hair really becomes you.","你理短发的确很帅。"],["We need to become critical text-readers.","我们需要成为批判性的文本阅读者。"]]},{"l":"g.a.t.e/w.ay","p":"ˈɡ.eɪ.t.-/w.eɪ","cn":"n. （通往其他地区的）门户","s":[["The network has a gateway into the hospital mainframe.","该网络有一个网关连接医院主机。"]]},{"l":"i.n/f.l.u/ence","p":"ˈɪ.n/f.l.u/əns","cn":"v. 影响；对……起作用","s":[["He's never had any influence over her.","他对她从没有过任何影响。"],["Don't let me influence you either way.","何去何从都别受我的影响。"],["Many external influences can affect your state of mind.","许多外在因素都可能影响人的心情。"]]},{"l":"ar.t/w.or.k","p":"ˈɑː.t/w.ɜː.k","cn":"n. 艺术作品","s":[["The artwork for the poster was done by my sister.","该海报的图片是我妹妹制作的。"],["This is evident in the artwork from the period.","这在那个时期的艺术作品中很明显。"]]},{"l":"p.ai.n.t/i.ng","p":"ˈp.eɪ.n.t/ɪ.ŋ","cn":"n. 绘画","s":[["Painting can be very therapeutic.","绘画可以使人很放松。"],["Painting is best done in daylight.","作画的最佳时间是白天。"],["Critics say his paintings are worthless.","批评家说他的画毫无价值。"]]},{"l":"s.c.e.n.e","p":"s.-.iː.n.-","cn":"n. 场面；情景","s":[["The hero dies in Act 5, Scene 3.","男主角在第五幕第三场死去。"],["Can we run through Scene 3 again, please?","请大家再来排练一下第3场好吗？"],["It's a scene of complete devastation.","那是一幅满目疮痍的景象。"]]},{"l":"w.i.f.e","p":"w.aɪ.f.-","cn":"n. 妻子","s":[["My wife's a keen gardener.","我的妻子是个热衷园艺的人。"],["Can I introduce my wife?","我来介绍一下我的妻子。"],["His wife has a strong personality.","他妻子的个性很强。"]]},{"l":"s.t.o.n.e","p":"s.t.əʊ.n.-","cn":"n. 石头；石料","s":[["The stone rolled down the hill.","石头滚下山坡。"],["He removed a stone from his shoe.","他清除了鞋中的一粒石子。"],["He had kidney stones.","他有肾结石。"]]},{"l":"r.e/f.l.e.c/tion","p":"r.ɪ/ˈf.l.e.k/ʃən","cn":"n. 映像；映照出的影像","s":[["After days of reflection she decided to write back.","经过几天的认真思考，她决定回信。"],["Your clothes are often a reflection of your personality.","穿着常常反映出一个人的个性。"],["He admired his reflection in the mirror.","他欣赏着自己在镜中的影像。"]]},{"l":"t.ou/r.i.s.t s.p.o.t","p":"ˈt.ʊə/r.ɪ.s.t s.p.ɒ.t","cn":"旅游景点","s":[]},{"l":"l.igh.t u.p","p":"l.aɪ.t ʌ.p","cn":"点亮；照亮","s":[["Light up the stove and you could burn down the house.","点燃炉子，你可能会把房子烧掉。"]]},{"l":"i.n th.e c.e.n/t.re o.f","p":"ɪ.n ð.ə ˈs.e.n/t.ə ə.v","cn":"在……的中心","s":[["Mars was visible, dead in the centre of the telescope.","火星清晰可辨，正好就在望远镜的中心。"]]},{"l":"b.e i.n/t.e.r.e.s/t.e.d i.n","p":"b.i ˈɪ.n/t.-.r.ə.s/t.ɪ.d ɪ.n","cn":"对……有兴趣","s":[["Now she's a teenager, she's starting to be interested in boys.","她现在已经是个十几岁的姑娘了，开始对男孩子感兴趣。"],["He only seems to be interested in personal gain.","他似乎只在乎个人的收益。"],["Be interested in others and they are sure to be interested in you.","对别人感兴趣，别人肯定也会对你感兴趣。"]]},{"l":"h.i/s.t.o.r/i.c s.i.t.e","p":"h.ɪ/ˈs.t.ɒ.r/ɪ.k s.aɪ.t.-","cn":"古迹；历史遗迹","s":[]},{"l":"i.n m.e.m/o/r.y o.f","p":"ɪ.n ˈm.e.m/ə/r.i ə.v","cn":"作为对……的纪念","s":[]}]},{"name":"Unit 7 Fun after school","words":[{"l":"l.i/t.e.r.a/ture","p":"ˈl.ɪ/t.-.r.ə/tʃə","cn":"n. 文学；文学作品","s":[["She lectures in Russian literature.","她讲授俄罗斯文学。"],["She has very eclectic tastes in literature.","她在文学方面的兴趣非常广泛。"],["He matriculated in the English Literature Department at the Tokyo Imperial University.","他被东京帝国大学英语文学系录取了。"]]},{"l":"a.c.t","p":"æ.k.t","cn":"v. 扮演（戏剧、电影中的角色）","s":[["Acting comes naturally to her.","她天生就会表演。"],["Alcohol acts quickly on the brain.","酒精对大脑迅速产生影响。"],["She doesn't go on until Act 2.","她要到第2幕才出场。"]]},{"l":"a/pp.r.e/ci/a.t.e","p":"ə/ˈp.r.iː/ʃi/eɪ.t.-","cn":"v. 欣赏；赏识（只要求理解）","s":[["I'd appreciate some help.","如果有人帮忙我将非常感激。"],["Anyone can appreciate our music.","任何人都能欣赏我们的音乐。"],["Your help would be greatly appreciated.","如蒙帮助，感激不尽。"]]},{"l":"j.oi.n","p":"dʒ.ɔɪ.n","cn":"v. 成为……的一员；参加","s":[["How do these two pieces join?","这两件东西怎样接合呢？"],["May I join in the celebration?","我能参加庆祝活动吗？"],["I'll join in the long jump.","我将参加跳远比赛。"]]},{"l":"d.e.f/i/n.i.t/e.l.y","p":"ˈd.e.f/ɪ/n.ə.t/-.l.i","cn":"adv. 肯定；没问题；当然；确实","s":[["I will definitely follow up on that!","我一定会跟进的！"],["I definitely remember sending the letter.","我记得这封信肯定发出去了。"],["The exam was impossible! I definitely bombed it.","考试太难了！我肯定考砸了。"]]},{"l":"f.air","p":"f.eə","cn":"n. 集市","s":[["Look, that's not fair.","注意，那样不公平。"],["'It's not fair,' she complained.","“这不公平。”她抱怨道。"],["His knowledge of French is only fair.","他的法语知识还算可以。"]]},{"l":"r.o.ck/e.t","p":"ˈr.ɒ.k/ɪ.t","cn":"n. 火箭","s":[["The rocket soared (up) into the air.","火箭升空。"],["The rocket soared skywards.","火箭呼啸着朝天上飞去。"],["The rocket steepened its ascent.","火箭飞速升空。"]]},{"l":"l.au.n.ch","p":"l.ɔː.n.tʃ","cn":"v. 发射（只要求理解）","s":[["The official launch date is in May.","正式的发行日期是在五月。"],["He launched a fierce attack on the Democrats.","他对民主党人发动了猛烈的攻击。"],["The Navy is to launch a new warship today.","海军今天有一艘新军舰要下水。"]]},{"l":"sh.ou.t","p":"ʃ.aʊ.t","cn":"v. 大声说；叫","s":[["Look, you needn't shout.","喂，你不必喊。"],["\"Hey! Look out!\" shouted Patty.","“嘿！当心！”帕蒂喊道。"],["I'll shout—what are you drinking?","我请客，你想喝什么？"]]},{"l":"p.ow/er","p":"ˈp.aʊ/ə","cn":"n. 力量；能量","s":[["They've switched off the power.","他们关掉了电源。"],["Both parties are hungry for power.","两党都渴望掌权。"],["The power stations burn coal from the Ruhr region.","这些电厂烧产自鲁尔地区的煤。"]]},{"l":"m.o/m.e.n.t","p":"ˈm.əʊ/m.ə.n.t","cn":"n. 片刻；瞬间","s":[["The moment of decision had arrived.","决策的时刻已经到了。"],["Could you wait a moment , please?","请您稍等一下，好吗？"],["She's the fashion designer of the moment.","她是当前最红的时装设计师。"]]},{"l":"m.e.m/b.er","p":"ˈm.e.m/b.ə","cn":"n. 成员","s":[["She is a life member of the club.","她是这个俱乐部的终身会员。"],["How much does it cost to become a member?","要成为会员得花多少钱？"],["Now let us construct two three-member sets based on the results.","现在让我们根据结果构造两个三成员集。"]]},{"l":"sh.a.p.e","p":"ʃ.eɪ.p.-","cn":"n. 形状；外形","s":[["She had a classical, womanly shape.","她有一副标准的女人味儿十足的身材。"],["It is cylindrical in shape.","它是圆柱形的。"],["The male bird has a differently shaped head.","雄鸟的头形有点特别。"]]},{"l":"h.i.k.e","p":"h.aɪ.k.-","cn":"n. 远足；徒步旅行","s":[["The site is reached by a 30-minute hike through dense forest.","要花30分钟徒步穿过密林才能到达那个地方。"],["He had been bitten by a snake during a rough hike.","他在一次艰难的徒步旅行中被蛇咬了。"]]},{"l":"r.e/c.e.n.t/l.y","p":"ˈr.iː/s.ə.n.t/l.i","cn":"adv. 不久前；最近","s":[["Prices have gone down recently.","最近物价下降了。"],["New evidence has recently come to light.","新的证据最近已披露出来。"],["Your French has come along a lot recently.","你的法语最近进步很大。"]]},{"l":"a/tt.e.n.d","p":"ə/ˈt.e.n.d","cn":"v. 出席；参加","s":[["Our children attend the same school.","我们的孩子上同一所学校。"],["A nurse attended to his needs constantly.","有一位护士经常照料他的需要。"],["Which school do they attend?","他们上的是哪一所学校？"]]},{"l":"ch.a.r/i/t.y","p":"ˈtʃ.æ.r/ə/t.i","cn":"n. 慈善机构（或组织）","s":[["Are you collecting for charity?","你是在为慈善募捐吗？"],["Do you give much to charity?","慈善捐助你捐得多吗？"],["Her article showed no charity towards her former friends.","她的文章对她以前的朋友毫不宽容。"]]},{"l":"s.a.l.e","p":"s.eɪ.l.-","cn":"n. 出售；销售","s":[["The sale starts next week.","特价促销从下星期开始。"],["She gets 10% commission on each sale.","每笔生意她得10%的佣金。"],["He moved to the sales department.","他调到了销售部。"]]},{"l":"s.n.a.ck","p":"s.n.æ.k","cn":"n. 点心；小吃","s":[["Lunch was a snack in the fields.","午饭是在野外吃的快餐。"],["I only have time for a snack at lunchtime.","中午，我的时间只够吃点心。"],["It is customary to offer a drink or a snack to guests.","通常用饮料或小吃招待客人。"]]},{"l":"d.e.c/o/r.a.t.e","p":"ˈd.e.k/ə/r.eɪ.t.-","cn":"v. 装饰；装潢","s":[["We need to decorate the sitting room.","我们需要将客厅粉刷一下。"],["The boys are planning to decorate when they get the time.","男孩们正计划在他们有时间的时候装修。"],["The room was decorated in exquisite taste.","这个房间的装饰情趣高雅。"]]},{"l":"d.i/ff.e.r.ence","p":"ˈd.ɪ/f.-.r.əns","cn":"n. 差别；差异","s":[["Few people understand the difference.","很少有人了解这个差别。"],["'There's the difference between art and artefact.","艺术品与人工制品之间存在着差异。"],["There are qualitative differences between the two products.","这两种产品存在着质的差别。"]]},{"l":"c.o.m/p.e.t.e","p":"k.ə.m/ˈp.iː.t.-","cn":"v. 参加比赛（或竞赛）","s":[["He's a talented athlete who competes nationally and internationally.","他是一位有才华的运动员，既参加国内比赛，也参加国际比赛。"],["They competed with skill and tenacity.","他们竞争靠的是技术和顽强意志。"],["We can't compete with them on price.","我们在价格上无法与他们竞争。"]]},{"l":"e/v.e.n.t","p":"ɪ/ˈv.e.n.t","cn":"n. 公开活动；社交场合","s":[["The two events are closely connected.","两起事件之间有密切的联系。"],["Recent events had no bearing on our decision.","近期的事件与我们的决定没有关系。"],["Subsequent events confirmed our doubts.","后来发生的事证实了我们的怀疑。"]]},{"l":"s.p.oo.n","p":"s.p.uː.n","cn":"n. 勺；匙","s":[["He stirred his coffee with a spoon.","他用匙搅了搅咖啡。"],["She licked the spoon clean.","她把调羹舔得干干净净。"],["She licked the honey off the spoon.","她舔光了调羹上的蜂蜜。"]]},{"l":"a.n/n.u/a.l","p":"ˈæ.n/-.ju/ə.l","cn":"adj. 每年的；一年一次的","s":[["Annual boarding fees are $10,350.","每年的住校费是10,350美元。"],["She's covering the party's annual conference.","她正在报道这个政党的年会新闻。"],["How much annual leave do you get?","你们的年假有多长？"]]},{"l":"f.a.n/t.a.s/t.i.c","p":"f.æ.n/ˈt.æ.s/t.ɪ.k","cn":"adj. 极好的；了不起的","s":[["All in all, it's fantastic!","总而言之，它很棒！"],["The teams served up some fantastic entertainment.","这些队献上了精彩的表演。"],["You've got the job? Fantastic!","你得到那工作了？太好了！"]]},{"l":"d.o.l/l.ar","p":"ˈd.ɒ.l/-.ə","cn":"n. 元（美国、加拿大、澳大利亚等国的货币单位）","s":[["The dollar continued to slide.","美元继续下跌。"],["She tipped the porter a dollar.","她给了行李工一元的小费。"],["The dollar closed two cents down.","收市时美元下降了二分。"]]},{"l":"p.ie","p":"p.aɪ","cn":"n. 果馅饼；果馅派","s":[["Sprinkle onion and cheese in the pie plate.","把洋葱和干酪撒在饼盘中。"],["We all had a second helping of pie.","我们又都吃了一份馅饼。"],["He polished off the remains of the apple pie.","他把剩下的苹果派赶快吃完。"]]},{"l":"e/qu.i.p/m.e.n.t","p":"ɪ/ˈkw.ɪ.p/m.ə.n.t","cn":"n. 设备；器材","s":[["New equipment is urgently needed.","亟需新设备。"],["We lease all our computer equipment.","我们所有的计算机设备都是租来的。"],["Periodic checks are carried out on the equipment.","设备定期进行检查。"]]},{"l":"c.l.u.b.s f.air","p":"k.l.ʌ.b.z f.eə","cn":"社团招募展","s":[]},{"l":"s.o/l.ar p.ow/er","p":"ˈs.əʊ/l.ə ˈp.aʊ/ə","cn":"太阳能","s":[]},{"l":"o.f c.our.s.e","p":"ə.v k.ɔː.s.-","cn":"当然","s":[["Of course it's awfully fascinating!","当然，这是非常吸引人的！"],["Of course I'm not afraid!","当然我不怕！"],["—Excuse me, may I borrow your pen? —Of course. Here you are.","——打扰了，我可以借你的笔吗？ ——当然。给你。"]]},{"l":"r.e/m.o.t.e c.o.n/t.r.o.l","p":"r.ɪ/ˈm.əʊ.t.- k.ə.n/ˈt.r.əʊ.l","cn":"遥控器","s":[["It works by remote control.","它通过遥控工作。"],["I can't find the remote control.","我找不到遥控器。"],["The bomb was detonated by remote control.","炸弹通过遥控引爆。"]]},{"l":"t.ur.n a/r.ou.n.d","p":"t.ɜː.n ə/ˈr.aʊ.n.d","cn":"转身","s":[["We took a turn around the park.","我们在公园里转了一圈。"],["He turned around, with a bewildered look on his face.","他转过身来，满脸困惑。"],["Something made me stop, turn around and walk up to him.","某种事物让我停下脚步，转过身走到他面前。"]]},{"l":"m.a.k.e a d.i/ff.e.r.ence","p":"m.eɪ.k.- ə ˈd.ɪ/f.-.r.əns","cn":"有作用；有影响","s":[]},{"l":"p.r.i/m.a/r.y s.ch.oo.l","p":"ˈp.r.aɪ/m.ə/r.i s.k.uː.l","cn":"小学","s":[["We like primary school students.","我们喜欢小学生。"],["I go to Star Primary School.","我在思达小学上学。"],["She practised the piano in the primary school basement.","她在小学的地下室里练习弹钢琴。"]]},{"l":"f.a.ll o.ff","p":"f.ɔː.l ɒ.f","cn":"掉落","s":[["The bandage gradually unwound and fell off.","绷带逐渐松开脱落了。"],["Attendance at my lectures has fallen off considerably.","听我讲课的学生大大减少了。"],["It's important to tighten up the wheels properly, otherwise they vibrate loose and fall off.","把车轮拧紧很重要，否则它们会振动而松脱。"]]}]},{"name":"Unit 8 Collecting as a hobby","words":[{"l":"r.i.ng","p":"r.ɪ.ŋ","cn":"n. 环状物；圈形的东西","s":[["That phone's always ringing.","那个电话总是响个不停。"],["I'll give you a ring.","我会给你打电话的。"],["That phone never stops ringing!","那个电话没有不响的时候！"]]},{"l":"c.o/ll.e.c/tion","p":"k.ə/ˈl.e.k/ʃən","cn":"n. （常指同类的）收集物","s":[["She's the editor of a new collection of ghost stories.","她编了一部新版鬼故事集。"],["The art collection was his life's work.","收集艺术品是他一生的工作。"],["He loaned the museum his entire collection.","他把自己的全部收藏品都借给了博物馆。"]]},{"l":"ow.n","p":"əʊ.n","cn":"v. 拥有；有","s":[["She makes her own clothes.","她自己做衣服。"],["She made her own bread.","她自己做了面包。"],["They enjoy making their own decisions.","他们喜欢做他们自己的决定。"]]},{"l":"v.a.l/u/a/b.le","p":"ˈv.æ.l/ju/ə/b.l","cn":"adj. 贵重的","s":[["We're wasting valuable time, time we can ill afford.","我们是在浪费宝贵的时间，我们浪费不起的时间。"],["Let's hang on to those old photographs—they may be valuable.","咱们留着那些旧照片吧—它们或许有价值。"],["Luckily, nothing valuable was stolen.","幸运的是，没有贵重物品失窃。"]]},{"l":"h.a.n/d.le","p":"ˈh.æ.n/d.l","cn":"v. （用手）触（只要求理解）","s":[["Our cat hates being handled.","我们的猫不喜欢被人摸弄。"],["I pumped the handle like crazy.","我拼命地来回摇动手柄。"],["The handle came loose.","这把手松了。"]]},{"l":"g.l.o.v.e","p":"ɡ.l.ʌ.v.-","cn":"n. （分手指的）手套","s":[["There is a hole in her glove.","她手套上有个洞。"],["She bent down to pick up her glove.","她俯身去捡手套。"],["He stuck his gloves in his pocket.","他把手套塞进了口袋里。"]]},{"l":"a.dd","p":"æ.d","cn":"v. 增加；添加","s":[["'And don't be late,' she added.","“还有别迟到。”她补充说道。"],["His story just doesn't add up.","他说的情况根本不合情理。"],["The numbers add up to exactly 100.","这些数字的总数恰好是100。"]]},{"l":"e.n/v.e/l.o.p.e","p":"ˈe.n/v.ə/l.əʊ.p.-","cn":"n. 信封","s":[["Please enclose a self-addressed envelope.","请附上写明姓名地址的回邮信封。"],["The flap of the envelope had come unstuck.","信封的封口没粘牢张开了。"],["He sealed the envelope and put on a stamp.","他封好信封，贴了张邮票。"]]},{"l":"a.b/s.o/l.u.t/e.l.y","p":"ˈæ.b/s.ə/l.uː.t/-.l.i","cn":"adv. 极其","s":[["It's absolutely freezing outside.","外面冷得不得了。"],["I feel absolutely terrific today!","我今天的感觉真是好极了！"],["Are you absolutely certain about this?","你对这事绝对确信无疑吗？"]]},{"l":"s.ee.m","p":"s.iː.m","cn":"v. 好像；似乎","s":[["He seemed very worried.","他似乎非常担忧。"],["That idea seemed to impress Colin.","那个主意似乎打动了科林。"],["The drive seemed to take forever.","这车好像永远也开不到头似的。"]]},{"l":"i.m/p.o.s/s.i/b.le","p":"ɪ.m/ˈp.ɒ.s/-.ə/b.l","cn":"adj. 不可能的","s":[["Honestly, you're impossible at times!","说实话，你有时真令人难以忍受。"],["It's impossible to hold any individual responsible.","不可能让任何个人承担责任。"],["The effect is almost impossible to describe.","这影响几乎无法言表。"]]},{"l":"s.i.n/g.le","p":"ˈs.ɪ.ŋ/ɡ.l","cn":"adj. 单个的","s":[["Are you still single?","你还是单身吗？"],["They organize parties for singles.","他们为单身者组织聚会。"],["The single is titled \"White Love.\"","这支单曲名为《白色之恋》。"]]},{"l":"n.ai.l","p":"n.eɪ.l","cn":"n. 钉；钉子（只要求理解）","s":[["She scratched herself on a nail.","她在钉子上划了一下。"],["This nail won't come out.","这颗钉子拔不出来。"],["They nail shut the front door.","他们将前门钉死。"]]},{"l":"e.x/p.l.ai.n","p":"ɪ.ks/ˈp.l.eɪ.n","cn":"v. 解释；说明","s":[["Let me explain why.","让我来解释为什么。"],["It's pretty hard to explain.","这事很难解释清楚。"],["Can you explain that point again?","你能再解释一下那一点吗？"]]},{"l":"b.i.t","p":"b.ɪ.t","cn":"n. 一部分","s":[["I'm a bit dry.","我有点渴。"],["He looked a bit embarrassed.","他看上去有点尴尬。"],["She sounded a bit worried.","她听起来有点焦虑不安。"]]},{"l":"s.i.m/i/l.ar","p":"ˈs.ɪ.m/ə/l.ə","cn":"adj. 相像的；类似的","s":[["The brothers look very similar.","弟兄几个长得很像。"],["We have very similar interests.","我们兴趣相仿。"],["All our patients have broadly similar problems.","我们所有的病人问题大致相似。"]]},{"l":"c.oi.n","p":"k.ɔɪ.n","cn":"n. （一枚）硬币","s":[["This machine only accepts coins.","这台机器只接受硬币。"],["Let's toss a coin.","咱们掷硬币猜边儿决定吧。"],["The coin rolled underneath the piano.","硬币滚到了钢琴底下。"]]},{"l":"s.o.f.t","p":"s.ɒ.f.t","cn":"adj. 软的","s":[["I prefer soft drink .","我喜欢喝软饮料。"],["The whole room is bathed in soft lighting.","整个房间笼罩在柔和的照明中。"],["The boat finally grounded on a soft, underwater bank.","那条船最终在一个松软的水下浅滩搁浅了。"]]},{"l":"s.t.i.ck/er","p":"ˈs.t.ɪ.k/ə","cn":"n. 贴纸","s":[["What stickers do you have on the bumper or the back windshield?","你在汽车保险杠或后挡风玻璃上用的是什么贴纸？"]]},{"l":"w.a.s.t.e","p":"w.eɪ.s.t.-","cn":"n. 白费；糟蹋","s":[["I hate unnecessary waste.","我憎恨不必要的浪费。"],["It's a waste of time and energy.","那是浪费时间和精力。"],["It's sinful to waste good food!","浪费好好的食物是有罪的！"]]},{"l":"i/t.e.m","p":"ˈaɪ/t.ə.m","cn":"n. 一件商品（或物品）（只要求理解）","s":[["What's the next item on the agenda?","议程的下一项是什么？"],["Each student makes only one item themselves.","每个学生自己只做一项。"],["The other item on the agenda is the tour.","另一项议程是旅行。"]]},{"l":"r.e/s.u.l.t","p":"r.ɪ/ˈz.ʌ.l.t","cn":"n. 后果；结果","s":[["Are you pleased with the result?","你对结果满意吗？"],["These results conflict with earlier findings.","这些结果与早期的发现相矛盾。"],["When water levels rise, flooding results.","水位上升，就会发生洪水。"]]},{"l":"w.r.a.p/p.er","p":"-.ˈr.æ.p/-.ə","cn":"n. 包装纸（只要求理解）","s":[]},{"l":"b.ar","p":"b.ɑː","cn":"n. （长方形）条","s":[["The bar seemed ominously quiet.","那个酒吧似乎寂静得让人觉得不祥。"],["His shot hit the bar.","他射门击中球门的横梁。"],["She was sitting at the bar.","她坐在酒吧的柜台那里。"]]},{"l":"i.n/c.l.u.d.e","p":"ɪ.n/ˈk.l.uː.d.-","cn":"v. 包括；包含","s":[["The electronic dictionary included some animations.","电子词典中有一些动画片。"],["The all-star cast includes Jeremy Irons.","全明星演员阵容包括杰瑞米·艾恩斯在内。"],["The price includes the hire of the hall.","费用包括礼堂租金。"]]},{"l":"s.i.z.e","p":"s.aɪ.z.-","cn":"n. 大小","s":[["This jacket is just my size.","这件夹克正合我的尺码。"],["What size shoes do you take?","你穿多大号的鞋？"],["The kitchen is a good size.","这厨房相当大。"]]},{"l":"p.a.t/t.er.n","p":"ˈp.æ.t/-.ə.n","cn":"n. 图案；花样","s":[["All three attacks followed the same pattern.","3次袭击都依照同一模式。"],["The pattern is essentially the same in all cases.","这种模式在所有情况下基本相同。"],["Mornings in our house always follow a set pattern.","在我们家，每天上午的生活总是遵循一种固定的模式。"]]},{"l":"p.r.o/d.u.c.e","p":"p.r.ə/ˈd.juː.s.-","cn":"v. 生产；制造","s":[["We sell only fresh local produce.","我们只售当地的新鲜农产品。"],["He has produced his own sports magazine.","他已经创办了自己的体育杂志。"],["The shop sells only fresh local produce.","这家商店专售当地的新鲜农产品。"]]},{"l":"a/tt.r.a.c.t","p":"ə/ˈt.r.æ.k.t","cn":"v. 吸引；招引","s":[["She tried to attract the waiter's attention.","她试图引起服务员的注意。"],["How can we attract more visitors to our website?","我们如何才能吸引更多人访问我们的网站呢？"],["The case has attracted wide publicity.","这个案件得到广泛的关注。"]]},{"l":"i.n/s.e.c.t","p":"ˈɪ.n/s.e.k.t","cn":"n. 昆虫","s":[["She scratched at the insect bites on her arm.","她挠了挠胳膊上虫咬的包。"],["Small birds live mainly on insects.","小鸟主要靠食昆虫为生。"],["At rest the insect looks like a dead leaf.","这种昆虫不动时看上去像一片枯叶。"]]},{"l":"o.b/j.e.c.t","p":"ˈɒ.b/dʒ.ɪ.k.t","cn":"n. 物体；物品","s":[["We were all too polite to object.","我们都太客气了，没有反对。"],["The object is to educate people about road safety.","目的就是教育人们注意交通安全。"],["Objects like this turn up at sales with surprising frequency.","这样的东西在拍卖会上出人意料地频繁出现。"]]},{"l":"f.l.a.t","p":"f.l.æ.t","cn":"adj. 平滑的","s":[["He sings flat all the time.","他总是唱低了音。"],["Flat screen TV's easily tip over and can injure a child.","平板电视很容易发生翻转伤及儿童。"],["The countryside is flat and featureless.","这乡村一马平川，平淡无奇。"]]},{"l":"l.a.n/g.u.a.g.e","p":"ˈl.æ.ŋ/ɡ.w.ɪ.dʒ.-","cn":"n. 语言","s":[["The poem uses simple language.","这首诗用语简单。"],["Her native language is Korean.","她的母语是朝鲜语。"],["She has a facility for languages.","她有语言天赋。"]]},{"l":"t.r.ea/sure","p":"ˈt.r.e/ʒə","cn":"n. 珍宝；宝物","s":[["I treasure his friendship.","我珍重他的友谊。"],["This book is a treasure chest of information.","这本书是一个信息的宝库。"],["The treasure had lain undisturbed for centuries.","那份珍宝安然无恙地存放了几个世纪。"]]},{"l":"u.n/l.o.ck","p":"ˌʌ.n/ˈl.ɒ.k","cn":"v. 发现；揭示","s":[["He carelessly left the door unlocked.","他很粗心，没锁上门。"],["She planned to unlock the shop at 8:00 sharp this morning.","她计划今早8点整打开店门。"],["By turning yourself into a landscape detective, you can unlock some of its secrets.","通过把自己变成一个风景侦探，你可以解开它其中的部分奥秘。"]]},{"l":"r.e/a.l","p":"ˈr.iː/ə.l","cn":"adj. 真的","s":[["Are those real flowers?","那些是真花吗？"],["She's a real looker!","她真是个美人！"],["That's not real kungfu.","这不是真正的功夫。"]]},{"l":"a.dd t.o","p":"æ.d t.uː","cn":"把……添加到……","s":[["Chlorine is added to kill bacteria.","加入氯以杀菌。"],["I have nothing to add to my earlier statement.","我对我早先说的话没有什么补充的。"],["This latest incident will add to the pressure on the White House.","最近的这起事件会给白宫增加更多的压力。"]]},{"l":"s.o.f.t d.r.i.n.k","p":"s.ɒ.f.t d.r.ɪ.ŋ.k","cn":"软饮料（不含酒精）","s":[["I prefer soft drink .","我喜欢喝软饮料。"]]},{"l":"a w.a.s.t.e o.f t.i.m.e","p":"ə w.eɪ.s.t.- ə.v t.aɪ.m.-","cn":"浪费时间","s":[["It's a waste of time and energy.","那是浪费时间和精力。"]]},{"l":"p.o.ck/e.t m.o.n/ey","p":"ˈp.ɒ.k/ɪ.t ˈm.ʌ.n/i","cn":"（父母给孩子的）零花钱","s":[["They earned themselves a little pocket money by selling cigarettes.","他们靠卖香烟赚点零用钱。"],["He spends most of his pocket money on PlayStation games.","他将大部分的零花钱花在买游戏站的游戏上。"],["When you give kids pocket money make sure they save some of it.","给孩子们零花钱时，你一定要确保他们攒下一部分。"]]},{"l":"a.ll o/v.er th.e w.or.l.d","p":"ɔː.l ˈəʊ/v.ə ð.ə w.ɜː.l.d","cn":"全世界","s":[["The qualification has gained currency all over the world.","这种资格在全世界都得到了普遍认可。"]]}]}]},{"id":"hj7b","name":"沪教版 七年级下册","units":[{"name":"Unit 1 People around us","words":[{"l":"a.d/v.i.c.e","p":"ə.d/ˈv.aɪ.s.-","cn":"n. 建议","s":[["He offered some useful advice.","他提出了一些有益的建议。"],["The officer radioed for advice.","那名军官发电请求指示。"],["They give advice for people with HIV and AIDS.","他们向艾滋病病毒携带者和艾滋病患者提供咨询。"]]},{"l":"e.n/c.ou.r/a.g.e","p":"ɪ.n/ˈk.ʌ.r/ɪ.dʒ.-","cn":"v. 鼓励；激励","s":[["What has encouraged forest growth historically?","从历史来看，是什么促进了森林数量的增长？"],["Banks actively encourage people to borrow money.","银行积极鼓动人们贷款。"],["Parents encourage every activity imaginable.","父母鼓励一切可能的活动。"]]},{"l":"r.e/t.ire","p":"r.ɪ/ˈt.aɪə","cn":"v. （令）退职；（使）退休","s":[["Employees can retire at 60 if they choose.","如果雇员愿意的话，可在60岁退休。"],["He retired in his fifties.","他在五十多岁时退休了。"],["He has announced his intention to retire.","他已经宣布他打算退休。"]]},{"l":"ch.eer/f.u.l","p":"ˈtʃ.ɪə/f.ə.l","cn":"adj. 快乐的；高兴的","s":[["Why are you so bright and cheerful today?","你今天怎么这么高兴？"],["Paddy was always cheerful and jolly.","帕迪总是很高兴，很开心。"],["The nursery is bright and cheerful, with plenty of toys.","该托儿所明亮宜人，有许多玩具。"]]},{"l":"c.o/mm.u/n.i/t.y","p":"k.ə/ˈm.juː/n.ə/t.i","cn":"n. 社区","s":[["The centre will serve the whole community.","这个中心将为整个社区提供服务。"],["The sense of community is lost.","团体意识没有了。"],["There's not much community spirit around here.","这里集体精神比较薄弱。"]]},{"l":"m.e.d/i/c.a.l","p":"ˈm.e.d/ɪ/k.ə.l","cn":"adj. 医学的；医疗的","s":[["Medical insurance is very pricey.","医疗保险很昂贵。"],["Her medical bills mounted up.","她的医疗账单越来越多。"],["She served in the medical corps.","她在医务部队服过役。"]]},{"l":"f.r.ie.d","p":"f.r.aɪ.d","cn":"adj. 油炸的；油煎的；油炒的（只要求理解）","s":[["The place stinks of fried onions.","这地方有股难闻的炒洋葱味。"],["Tuna can be grilled, fried or barbecued.","金枪鱼可以烤、煎或烧烤着吃。"]]},{"l":"wh.e.r/e.v/er","p":"w.eə.r/ˈe.v/ə","cn":"conj. 各处；处处","s":[["Wherever can he have gone to?","他究竟会到哪儿去了呢？"],["Wherever did you get that idea?","你究竟从哪得来的那个想法？"],["We have sworn to fight cruelty wherever we find it.","我们已郑重许诺，无论在哪儿发现暴行我们都要与其斗争。"]]},{"l":"f.u/ture","p":"ˈf.juː/tʃə","cn":"n. 将来；未来","s":[["This young musician has a bright future.","这位年轻的音乐家前途无量。"],["The Baltic people have a right to determine their own future.","波罗的海人民有权决定他们自己的未来。"],["Our future looks uncertain.","我们似乎前途渺茫。"]]},{"l":"s.oo.n","p":"s.uː.n","cn":"adv. 很快；马上；不久","s":[["Your breakfast is coming soon.","你的早餐很快就到。"],["The party soon warmed up.","聚会很快活跃起来。"],["It's amazing how soon you adapt.","你这么快就适应了，真是令人惊奇。"]]},{"l":"s.m.ar.t","p":"s.m.ɑː.t","cn":"adj. 聪明的；机敏的","s":[["She's just as smart as her sister.","她与她姐姐一样聪明。"],["That was a smart career move.","那是个人事业发展上的一着妙棋。"],["She mixes with the smart set.","她跟那帮时髦人物交往。"]]},{"l":"a/tt.e.n/tion","p":"ə/ˈt.e.n/ʃən","cn":"n. 专心；注意力","s":[["Pay attention to costs.","要注意成本。"],["Pay attention to your actions.","注意你的行动。"],["I wish to God you'd learn to pay attention!","我真希望你能学会集中注意力！"]]},{"l":"s.e.l/d.o.m","p":"ˈs.e.l/d.ə.m","cn":"adv. 不常；很少；难得","s":[["He seldom worked on weekends.","他很少在周末工作。"],["I've seldom felt so happy.","我很少感到过这么快乐了。"],["Seldom had he seen such beauty.","他以前很少见过这样的美景。"]]},{"l":"b.ore.d","p":"b.ɔː.d","cn":"adj. （对某人/事物）厌倦的；烦闷的","s":[["I get bored easily.","我易生厌倦。"],["The boys were getting bored.","男孩子们渐渐变得厌烦起来。"],["The women are cross and bored.","这些妇女们感到愤怒和厌烦。"]]},{"l":"s.t.r.i.c.t","p":"s.t.r.ɪ.k.t","cn":"adj. 要求严格的；严厉的","s":[["She's on a very strict diet.","她正严格节食。"],["The sport has a strict code of conduct.","体育运动有严格的行为规范。"],["She's a very strict disciplinarian.","她执行纪律非常严格。"]]},{"l":"r.e.l/a/t.i.v.e","p":"ˈr.e.l/ə/t.ɪ.v.-","cn":"n. 亲戚；亲属","s":[["He's a distant relative of the mayor.","他是市长的远房亲戚。"],["She enjoyed the relative informality of island life.","她喜欢相对轻松随意的岛屿生活。"],["The fighting resumed after a period of relative calm.","战斗在一段相对的平静之后重新开始。"]]},{"l":"u/n.i/f.or.m","p":"ˈjuː/n.ɪ/f.ɔː.m","cn":"n. 制服；校服","s":[["Do you have to wear uniform ?","你非得穿制服不可吗？"],["He was wearing a brown uniform.","他穿着一件棕色制服。"],["Nurses have to wear a uniform.","护士必须穿制服。"]]},{"l":"p.er/s.o/n.a.l/i/t.y","p":"ˌp.ɜː/s.ə/ˈn.æ.l/ə/t.i","cn":"n. 性格；个性","s":[["Their son is a real personality.","他们的儿子真是有个性。"],["His wife has a strong personality.","他妻子的个性很强。"],["She had a sweet, lively personality.","她有着可爱活泼的性格。"]]},{"l":"ch.a.r/a.c/t.e/r.i.s/t.i.c","p":"ˌk.æ.r/ə.k/t.ə/ˈr.ɪ.s/t.ɪ.k","cn":"n. 特点；品质","s":[["She spoke with characteristic enthusiasm.","她说话带着特有的热情。"],["Some animals possess the characteristic of man.","有些动物具有人类的特征。"],["He replied with characteristic insouciance: \"So what?\"","他用特有的漫不经心的口吻答道：“那又怎么样？”"]]},{"l":"t.o.p/i.c","p":"ˈt.ɒ.p/ɪ.k","cn":"n. 话题；标题","s":[["I have discussed this topic in some detail.","我已相当详细地讨论过这个话题。"],["He spoke with authority on the topic.","他就这个课题发表权威意见。"],["He returns to this topic later in the report.","他在报告中后来又提到这个话题。"]]},{"l":"a.c/t.i.v.e","p":"ˈæ.k/t.ɪ.v.-","cn":"adj. 忙碌的；活跃的","s":[["That child has a very active imagination.","那个小孩想象力十分丰富。"],["He was very active in Freemasonry.","他在共济会组织很活跃。"],["What is the active ingredient in aspirin?","什么是阿司匹林中的有效成分？"]]},{"l":"s.m.ar.t/ph.o.n.e","p":"ˈs.m.ɑː.t/f.əʊ.n.-","cn":"n. 智能手机","s":[["One-in-five Americans will use a tablet or smartphone.","五分之一的美国人将使用平板电脑或智能手机。"]]},{"l":"w.i.s.e/l.y","p":"ˈw.aɪ.z.-/l.i","cn":"adv. 聪明地；明智地","s":[["By investing wisely she accumulated a fortune.","她投资精明，积累了一笔财富。"]]},{"l":"c.o.m/p.e/t.i.tion","p":"ˌk.ɒ.m/p.ə/ˈt.ɪ.ʃən","cn":"n. 比赛；竞赛","s":[["1 000 children entered the competition.","1 000名孩子报名参加了比赛。"],["Competition for jobs is acute.","求职竞争非常激烈。"],["She won first prize in the competition.","她在竞赛中获得头奖。"]]},{"l":"sh.ow/er","p":"ˈʃ.aʊ/ə","cn":"n. 淋浴","s":[["Turn off the shower.","关掉淋浴。"],["She usually sings in the shower.","她常常边冲澡边唱歌。"],["We now have a functioning shower.","现在我们有一个功能正常的淋浴器。"]]},{"l":"o.n/l.i.n.e","p":"ˌɒ.n/ˈl.aɪ.n.-","cn":"adj. 在线的","s":[["Many companies are choosing to display their wares online.","许多公司正选择在网上展示其产品。"],["You can chat to other people who are online.","你可以与其他在线的人聊天。"],["I keep getting disconnected when I'm online.","我上网时不断掉线。"]]},{"l":"s.i.t.e","p":"s.aɪ.t.-","cn":"n. 建筑工地","s":[["Do you want to bookmark this site?","你想给这个站点做书签吗？"],["There is ample car parking off site.","外面有个很大的停车场。"],["The site is reached by a 30-minute hike through dense forest.","要花30分钟徒步穿过密林才能到达那个地方。"]]},{"l":"n.a.r/r.ow","p":"ˈn.æ.r/-.əʊ","cn":"adj. 狭窄的；窄小的","s":[["He turned into a narrow street.","他拐进了一条狭窄的街道。"],["By 1973, this gap had narrowed almost to vanishing point.","到1973年，这一差距已缩小到几乎为零。"],["They rode along narrow country lanes.","他们骑马走在狭窄的乡村小路上。"]]},{"l":"s.u/p.er/m.a.n","p":"ˈs.uː/p.ə/m.æ.n","cn":"n. 超人","s":[["No, firstly, I am superman.","不，首先，我是超人。"],["Superman's alter ego was Clark Kent.","超人的第二自我是克拉克•肯特。"]]},{"l":"g.i.v.e u.p","p":"ɡ.ɪ.v.- ʌ.p","cn":"认输；放弃","s":[["I give up—tell me the answer.","我放弃了，把答案告诉我吧。"],["There comes a point where you give up.","现在你该放弃了。"],["We had given up hope of rescue.","我们那时已经放弃了获救的希望。"]]},{"l":"u.s.e.d t.o","p":"juː.s.-.t t.uː","cn":"曾经","s":[["I used to play basketball.","我过去常打篮球。"],["Kids used to trade baseball cards.","孩子们过去常互相交换棒球卡片。"],["We used to live in London.","我们过去住在伦敦。"]]},{"l":"i.n th.e f.u/ture","p":"ɪ.n ð.ə ˈf.juː/tʃə","cn":"在未来","s":[["In the future, people may heat their homes with atomic power.","在将来，人们可以用原子能为房屋供暖。"],["In the future we envision a federation of companies.","我们设想将来会有公司联盟。"],["If we don't protect nature, some wildlife may die out in the future.","如果我们不保护自然，一些野生动物可能会在未来灭绝。"]]},{"l":"b.e s.t.r.i.c.t a/b.ou.t","p":"b.i s.t.r.ɪ.k.t ə/ˈb.aʊ.t","cn":"对……要求严格","s":[]},{"l":"b.e w.o.r/r.ie.d a/b.ou.t","p":"b.i ˈw.ʌ.r/-.i.d ə/ˈb.aʊ.t","cn":"担心","s":[]}]},{"name":"Unit 2 Travelling around the world","words":[{"l":"w.i.n.e","p":"w.aɪ.n.-","cn":"n. 葡萄酒","s":[["Wine contains about 10% alcohol.","葡萄酒含有约10%的酒精。"],["Red wine gives me a headache.","我喝红酒会头痛。"],["Add the white wine and let it bubble up.","加入白葡萄酒，让它产生泡沫。"]]},{"l":"m.a.tch","p":"m.æ.tʃ","cn":"v. 配对","s":[["The match ended in a tie.","这场比赛以平局结束。"],["They abandoned the match because of rain.","因为下雨，他们中止了比赛。"],["The suspects' stories just don't match up.","各嫌疑犯交代的内容不一致。"]]},{"l":"r.i.ch","p":"r.ɪ.tʃ","cn":"adj. 丰富多彩的","s":[["\"Is he rich?\"—\"He's comfortable.\"","“他富有吗？”—“他生活宽裕。”"],["Additional cream would make it too rich.","额外的奶油会使它过于油腻。"],["Farmers grow rice in the rich soil.","农民们在肥沃的土地上种水稻。"]]},{"l":"l.ie","p":"l.aɪ","cn":"v. 位于；坐落在","s":[["Stand up. Lie down.","站起来，躺下去。"],["You can finally lie down.","你终于能躺下了。"],["Father, I cannot lie to you.","爸爸，我不能对你说谎。"]]},{"l":"c.a/f.é","p":"ˈk.æ/f.eɪ","cn":"n. 咖啡馆；小餐馆","s":[["At midday everyone would go down to Reg's Café.","中午每个人都去雷吉的小餐馆。"],["The café seems to be her home away from home these days.","这些天来，咖啡馆似乎成了她的第二个家。"],["He walked jauntily into the café.","他昂首阔步地走进了咖啡馆。"]]},{"l":"e.x/c.e.l/l.e.n.t","p":"ˈe.k/s.ə.l/-.ə.n.t","cn":"adj. 优秀的；极好的","s":[["She speaks excellent French.","她法语说得好极了。"],["He speaks excellent English.","他英语说得棒极了。"],["Her musicianship is excellent.","她的演奏技巧非常棒。"]]},{"l":"c.oa.s.t","p":"k.əʊ.s.t","cn":"n. 海岸；海滨","s":[["They live on the south coast.","他们住在南海岸。"],["They live on the east coast.","他们住在东海岸。"],["Hurricane Betty is now approaching the coast of Florida.","飓风贝蒂正在逼近佛罗里达海岸。"]]},{"l":"p.er/f.e.c.t","p":"ˈp.ɜː/f.ɪ.k.t","cn":"adj. 正合适","s":[["She speaks perfect English.","她讲一口地道的英语。"],["She's the perfect candidate for the job.","她是这项工作的最佳人选。"],["The pool area is perfect for entertaining.","游泳池一带最适合娱乐。"]]},{"l":"m.o.s.t/l.y","p":"ˈm.əʊ.s.t/l.i","cn":"adv. 主要地；通常","s":[["We're mostly out on Sundays.","我们星期天一般不在家。"],["Somalia is mostly desert.","索马里大部分地区都是荒漠。"],["Cars are mostly metal.","汽车大多是金属制成的。"]]},{"l":"r.e/c.ei.v.e","p":"r.ɪ/ˈs.iː.v.-","cn":"v. 接待；招待","s":[["He will receive $6,000 in back pay.","他将收到$6000的欠薪。"],["The best models receive star treatment.","最优秀的模特儿会受到明星级的待遇。"],["She stepped up to receive her prize.","她走上前去领奖。"]]},{"l":"k.ey","p":"k.iː","cn":"adj. 主要的；关键的","s":[["I've lost my keys.","我把钥匙丢了。"],["His contribution could be key.","他的贡献可能是最重要的。"],["The key doesn't fit the lock.","这把钥匙打不开这把锁。"]]},{"l":"r.e/m.ai.n","p":"r.ɪ/ˈm.eɪ.n","cn":"v. 仍然是；保持不变","s":[["The government remained in control.","政府继续控制着局势。"],["She remained quiet and controlled.","她沉默不语保持克制。"],["Much remains to be done.","还有很多事要去做。"]]},{"l":"l.i.f.t","p":"l.ɪ.f.t","cn":"n. 电梯；升降机","s":[["Come and help me lift this box.","来帮我抬这个箱子。"],["There is a lift to all floors.","有电梯通往各层楼。"],["The snake lifted its head and hissed.","蛇昂起头发出嘶嘶声。"]]},{"l":"s.t.e.p","p":"s.t.e.p","cn":"n. 台阶","s":[["She floated down the steps to greet us.","她轻盈地下楼来迎接我们。"],["He took a step backwards.","他退后一步。"],["He took two steps forward.","他向前走了两步。"]]},{"l":"s.t.air","p":"s.t.eə","cn":"n. 楼梯","s":[["We stepped down the stair.","我们走下楼梯。"],["I often do stair climbing with my friends.","我经常和朋友一起爬楼梯。"],["He sat at the bottom of the stairs.","他坐在楼梯底部。"]]},{"l":"m.o/t.or/c.y/c.le","p":"ˈm.əʊ/t.ə/s.aɪ/k.l","cn":"n. 摩托车（只要求理解）","s":[["They sell used and reconditioned motorcycle parts.","他们出售二手及翻新的摩托车零部件。"],["He watched the motorcycle race through his binoculars.","他用双筒望远镜看摩托车比赛。"],["Stefano used a motorcycle to herd the sheep.","斯蒂芬诺骑一辆摩托车驱赶羊群。"]]},{"l":"s.igh.t/s.ee/i.ng","p":"ˈs.aɪ.t/s.iː/ɪ.ŋ","cn":"n. 观光；游览","s":[["Sightseeing is best done either by tour bus or by bicycles.","观光最好要么乘游览巴士，要么骑自行车。"],["Did you have a chance to do any sightseeing ?","你有没有出去游览的机会？"],["A sightseeing tour of the city is included to help you get your bearings.","城市观光游包括在内，以帮助你们弄清方向。"]]},{"l":"i/m.a.g/i.n.e","p":"ɪ/ˈm.æ.dʒ/ɪ.n.-","cn":"v. 想象；设想","s":[["Imagine loving your enemy and doing good to those who hated you.","想像着爱你的敌人，为仇人做好事。"],["I can just imagine his reaction.","我完全可以想象出他的反应。"],["I can't imagine life without the children now.","我现在无法设想没有了孩子们的生活。"]]},{"l":"d.e.s/t.i/n.a/tion","p":"ˌd.e.s/t.ɪ/ˈn.eɪ/ʃən","cn":"n. 目的地；终点","s":[["At last, after twenty hours on the boat, they arrived at their destination.","乘船二十小时之后，他们终于到达了目的地。"],["Our luggage was checked all the way through to our final destination.","我们的行李一直被托运到最终目的地。"],["He gets you to your destination without turning the trip into a white-knuckle experience.","他会将你安然无恙地送达你的目的地。"]]},{"l":"a/dd.r.e.ss","p":"ə/ˈd.r.e.s","cn":"n. 住址；地址","s":[["What's your email address ?","你的电邮地址是什么？"],["Do you know his address?","你知道他的地址吗？"],["They each have their own email address.","他们每个人都有自己的电子邮件地址。"]]},{"l":"g.o.v/er.n/m.e.n.t","p":"ˈɡ.ʌ.v/ə.n/m.ə.n.t","cn":"n. 政府","s":[["The government remained in control.","政府继续控制着局势。"],["We want this government out.","我们想要这届政府下台。"],["The government had to take emergency action.","政府只得采取紧急措施。"]]},{"l":"u/n.i.q.ue","p":"ju/ˈn.iː.k.-","cn":"adj. 独特的；罕见的","s":[["The koala is unique to Australia.","树袋熊是澳大利亚独有的。"],["Everyone's fingerprints are unique.","每个人的指纹都是独一无二的。"],["Each person's signature is unique.","每个人的签名是独一无二的。"]]},{"l":"e.n/d.a.n/g.er.e.d","p":"ɪ.n/ˈd.eɪ.n/dʒ.ə.-.d","cn":"adj. 濒危的","s":[["The koala is listed among Australia's endangered animals.","树袋熊已列为澳大利亚濒临绝种的动物之一。"],["Pandas are an endangered species.","大熊猫是一种濒危物种。"],["The Wilderness Society lobbied Congress to authorize the Endangered Species Act.","荒野协会游说国会批准《濒危物种法》。"]]},{"l":"s.t.r.e.tch","p":"s.t.r.e.tʃ","cn":"v. 延伸；绵延（只要求理解）","s":[["It's a dangerous stretch of road.","这是一截危险路段。"],["The campaign has entered its final stretch.","竞选已进入最后冲刺阶段。"],["The cables are designed not to stretch.","这些缆绳被设计成没有弹性。"]]},{"l":"h.u.g.e","p":"h.juː.dʒ.-","cn":"adj. 巨大的；极多的","s":[["The house had huge, spotlessly clean rooms.","那房子里有着宽敞而且一尘不染的房间。"],["Just the huge size of the place amazed her.","仅仅地方之大就使她十分惊奇。"],["He is painting a huge volcano.","他正在画一座巨型火山。"]]},{"l":"w.i.l.d","p":"w.aɪ.l.d","cn":"adj. 野的；野生的；n. 自然环境；野生状态（只要求理解）","s":[["The children are wild with joy.","孩子们欣喜若狂。"],["Let your imagination run wild and be creative.","让你的想象力自由驰骋发挥创意吧。"],["The wild card in the picture is eastern Europe.","局势中的未知因素在东欧。"]]},{"l":"d.i.s/c.o.v/er","p":"d.ɪ.s/ˈk.ʌ.v/ə","cn":"v. 了解到；查明","s":[["They had discovered human remains.","他们发现过人的遗骸。"],["We happened to discover we had a friend in common.","我们碰巧发现我们有个共同的朋友。"],["He was discovered hiding in a shed.","人们发现他原来藏在棚屋里。"]]},{"l":"v.o.l/c.a/n.o","p":"v.ɒ.l/ˈk.eɪ/n.əʊ","cn":"n. 火山","s":[["People can surf the volcano.","人们可以在火山上冲浪。"],["He is painting a huge volcano.","他正在画一座巨型火山。"],["The volcano could erupt at any time.","这座火山随时可能爆发。"]]},{"l":"r.a.n.g.e","p":"r.eɪ.n.dʒ.-","cn":"n. 山脉","s":[["Courses range from cooking to computing.","课程从烹饪到计算机应用都有。"],["Our equipment is top of the range.","我们的设备是最昂贵的。"],["We carry a range of educational software.","我们出售各种教育软件。"]]},{"l":"s.n.ow/m.o/b.i.l.e","p":"ˈs.n.əʊ/m.ə/b.iː.l.-","cn":"n. 雪地机动车","s":[]},{"l":"w.o.l.f","p":"w.ʊ.l.f","cn":"n. 狼","s":[["He wolfed down the rest of the biscuit and cheese.","他狼吞虎咽地吃下了剩余的饼干和奶酪。"],["The Rams held on to defeat the Nevada Wolf Pack in Reno, 32-28.","公羊队坚忍不拔，在雷诺市以32比28的比分击败了内华达狼群队。"],["He thought he had better track this wolf and see where it lived.","他认为他最好跟踪这只狼，并看看它在哪儿生活。"]]},{"l":"d.e/p.ar.t/m.e.n.t s.t.ore","p":"d.ɪ/ˈp.ɑː.t/m.ə.n.t s.t.ɔː","cn":"百货商店","s":[["Thank you for calling Saks Fifth Avenue Department Store.","感谢致电萨克斯第五大道百货公司。"],["Karen Smith is a buyer for a department store in New York.","凯伦·史密斯是纽约一家百货公司的采购员。"],["We had lunch, changed clothes, and spent the afternoons as customers in a department store.","我们吃了午饭，换了衣服，下午光顾了一家百货公司。"]]},{"l":"p.r.e/f.er t.o","p":"p.r.ɪ/ˈf.ɜː t.uː","cn":"更喜欢","s":[["I prefer to deal with him direct.","我更愿意直接跟他打交道。"],["He prefers to focus on the positive.","他更愿意关注积极面。"],["I prefer to work to a deadline.","我喜欢按规定的期限完成工作。"]]},{"l":"b.y h.a.n.d","p":"b.aɪ h.æ.n.d","cn":"用手工","s":[["Farm workers milked cows by hand.","农场工人们手工给奶牛挤奶。"],["Rice farmers here still plant and harvest their crops by hand.","这里的稻农仍然用手工种植和收割庄稼。"]]},{"l":"g.o s.igh.t/s.ee/i.ng","p":"ɡ.əʊ ˈs.aɪ.t/s.iː/ɪ.ŋ","cn":"去观光","s":[]},{"l":"g.o o.n a t.r.i.p","p":"ɡ.əʊ ɒ.n ə t.r.ɪ.p","cn":"去旅行","s":[]},{"l":"s.e.t u.p","p":"s.e.t ʌ.p","cn":"建立","s":[["I've set up a meeting for Friday.","我已安排好在星期五开会。"],["He set up a trust for his children.","他为子女安排好了信托财产。"],["The government has set up a commission to look into those crimes.","政府已成立一个委员会调查那些罪行。"]]},{"l":"g.i/a.n.t p.a.n/d.a","p":"ˈdʒ.aɪ/ə.n.t ˈp.æ.n/d.ə","cn":"大熊猫","s":[]},{"l":"i.n th.e w.i.l.d","p":"ɪ.n ð.ə w.aɪ.l.d","cn":"在野外","s":[["They went camping in the wild.","他们在野外露营。"]]},{"l":"a.ll y.ear r.ou.n.d","p":"ɔː.l j.ɪə r.aʊ.n.d","cn":"全年","s":[]},{"l":"g.o.l/d.e.n m.o.n/k.ey","p":"ˈɡ.əʊ.l/d.ə.n ˈm.ʌ.ŋ/k.i","cn":"金丝猴","s":[]},{"l":"g.o h.i.k/i.ng","p":"ɡ.əʊ ˈh.aɪ.k/ɪ.ŋ","cn":"去远足","s":[]},{"l":"h.o.t s.p.r.i.ng","p":"h.ɒ.t s.p.r.ɪ.ŋ","cn":"温泉","s":[]}]},{"name":"Unit 3 Trees and us","words":[{"l":"b.r.a.n.ch","p":"b.r.ɑː.n.tʃ","cn":"n. 树枝","s":[["Classify them by branch, region, and year.","将它们按部门、地区和年份分类。"],["He chopped a branch off the tree.","他从那棵树上砍下一根树枝。"],["Deposits can be made at any branch.","在任何一家分行都可以存钱。"]]},{"l":"r.oo.t","p":"r.uː.t","cn":"n. 根；根茎（只要求理解）","s":[["We have to get to the root of the problem.","我们必须找到问题的根源。"],["'Walk' is the root of 'walks', 'walked', 'walking' and 'walker'.","walk是walks、walked、walking和walker的词根。"],["I'm proud of my Italian roots.","我为我的意大利血统感到骄傲。"]]},{"l":"s.i/l.e.n.t","p":"ˈs.aɪ/l.ə.n.t","cn":"adj. 不说话的；沉默的","s":[["The three men remained silent.","这3个人保持沉默。"],["He's the strong silent type.","他是那种强悍而沉默寡言的人。"],["At last the traffic fell silent.","车辆的喧嚣终于消逝了。"]]},{"l":"o/v.er/l.oo.k","p":"ˌəʊ/v.ə/ˈl.ʊ.k","cn":"v. 忽略；未注意到","s":[["Houses which overlook the lake cost more.","俯瞰湖泊的房子要价高些。"],["I pulled off the road at a scenic overlook.","在一个可以眺望优美风景的地方，我将车停在了路旁。"],["Pretty and comfortable rooms overlook a flower-filled garden.","那些漂亮、舒适的房间俯瞰着一个花团锦簇的花园。"]]},{"l":"h.u/m.a.n","p":"ˈh.juː/m.ə.n","cn":"n. 人","s":[["They had discovered human remains.","他们发现过人的遗骸。"],["The bacteria are harmless to humans.","这些细菌对人无害。"],["We must allow for human error.","我们必须考虑到人为的失误。"]]},{"l":"o.x/y/g.e.n","p":"ˈɒ.ks/ɪ/dʒ.ə.n","cn":"n. 氧；氧气","s":[["Hydrogen and oxygen combine to form water.","氢与氧化合成水。"],["Hydrogen combines with oxygen to form water.","氢与氧化合成水。"],["Oxygen has high reactivity.","氧的反应性很高。"]]},{"l":"c.r.e/a.t.e","p":"k.r.i/ˈeɪ.t.-","cn":"v. 创造","s":[["We set business free to create more jobs.","我们让企业自由以创造更多的就业机会。"],["What you say and do up front will create your first impression.","你第一次所说的和所做的都是你的第一印象。"],["Create the default keyring for QMA.","为QMA创建一个默认的密匙环。"]]},{"l":"e.n/v.i/r.o.n/m.e.n.t","p":"ɪ.n/ˈv.aɪ/r.ə.n/m.ə.n.t","cn":"n. 自然环境","s":[["Children need a caring environment.","儿童需要一个充满关怀的环境。"],["However, some birds thrive in noisy environments.","然而，有些鸟会在嘈杂的环境中茁壮成长。"],["She works in a predominantly male environment.","她在一个男性居多的环境里工作。"]]},{"l":"c.o.n/v.e/n.i/e.n.t","p":"k.ə.n/ˈv.iː/n.i/ə.n.t","cn":"adj. 便利的；方便的","s":[["If it's convenient I can come tomorrow.","方便的话，我可以明天过来。"],["I'll call back at a more convenient time.","在方便的时候我会回电话的。"],["Can you spare five minutes when it's convenient?","方便时能占用你五分钟时间吗？"]]},{"l":"f.ur/n.i/ture","p":"ˈf.ɜː/n.ɪ/tʃə","cn":"n. （可移动的）家具（只要求理解）","s":[["They've moved all the furniture round.","他们把所有的家具搬动了一遍。"],["The room was empty of furniture.","房间里什么家具都没有。"],["Buying new furniture may prove too costly.","购买新家具可能会花钱太多。"]]},{"l":"w.oo.d","p":"w.ʊ.d","cn":"n. 木；木头","s":[["If it's made of wood it will float.","这要是木材做的就能浮在水面上。"],["The impact splintered the wood.","木头被撞成了碎片。"],["Their dishes were made of wood.","他们的盘子是用木头制成的。"]]},{"l":"t.r.ea.t","p":"t.r.iː.t","cn":"v. 以……态度对待；以……方式对待","s":[["We treat boys exactly the same as girls.","男孩、女孩我们完全同等对待。"],["He is being treated at the London clinic.","他正在伦敦一家私人诊所接受治疗。"],["It's dreadful the way they treat their staff.","他们对待雇员的方式糟糕透了。"]]},{"l":"c.o/mm.u/n.i/c.a.t.e","p":"k.ə/ˈm.juː/n.ɪ/k.eɪ.t.-","cn":"v. 交流；沟通","s":[["They successfully communicate their knowledge to others.","他们成功地把他们的知识传达给别人。"],["Candidates must be able to communicate effectively.","候选人必须善于有效地表达自己。"],["They communicated entirely by gesture.","他们完全用手势交流。"]]},{"l":"s.p.e/ci.e.s","p":"ˈs.p.iː/ʃ.iː.z","cn":"n. 种；物种（只要求理解）","s":[["The map shows the distribution of this species across the world.","地图上标明了这一物种在全世界的分布情况。"],["This species is extremely rare.","这一物种极为罕见。"],["There are many species of dog(s).","狗有许多种。"]]},{"l":"p.r.o.d/u.c.t","p":"ˈp.r.ɒ.d/ʌ.k.t","cn":"n. 产品；制品","s":[["Who distributes our products in the UK?","谁在英国经销我们的产品？"],["It'd kill us to take back all the products.","收回所有的产品会害死我们的。"],["France is the world's second-biggest exporter of agricultural products.","法国是世界第二大农产品出口国。"]]},{"l":"s.i.d.e","p":"s.aɪ.d.-","cn":"n. 一面","s":[["The skirt has a side opening.","这裙子是侧面开口的。"],["It measures 20 yards from side to side.","从这边到那边的距离为20码。"],["We cannot take sides in a civil war.","内战中，我们不能支持任何一方。"]]},{"l":"b.o.r/r.ow","p":"ˈb.ɒ.r/-.əʊ","cn":"v. 借；借用","s":[["Can I borrow your calculator?","我可以借用你的计算器吗？"],["May I borrow your newspaper?","把你的报纸借我看行吗？"],["Can I borrow your lecture notes ?","我可以借你的讲稿看看吗？"]]},{"l":"d.i.g","p":"d.ɪ.ɡ","cn":"v. 掘（地）；凿（洞）；挖（土）","s":[["I'll dig some potatoes for lunch.","我要挖点土豆作午餐。"],["Will you dig a little into his past and see what you find?","你稍微探究一下他的过去看看能发现什么，好吗？"],["Tabloid newspapers love to dig up scandal.","通俗小报都热衷于刨丑闻。"]]},{"l":"h.o.l.e","p":"h.əʊ.l.-","cn":"n. 洞；孔；坑","s":[["There is a hole in her glove.","她手套上有个洞。"],["But someone had to wash out the hole.","不过总得有人把坑洗干净。"],["I am not going to bring up my child in this hole.","我不会在这个鬼地方养育孩子的。"]]},{"l":"s.t.i.ck","p":"s.t.ɪ.k","cn":"n. 棍；条","s":[["This drawer keeps sticking.","这个抽屉老卡住。"],["His ears stick out.","他长着一对招风耳。"],["Stick up for what you believe.","你相信什么，就要捍卫它。"]]},{"l":"a.c/c.i/d.e.n.t","p":"ˈæ.k/s.ɪ/d.ə.n.t","cn":"n. 意外；偶然的事","s":[["An accident can happen anywhere.","任何地方都可能发生事故。"],["Pedestrian accidents are down by 5%.","行人受伤事故下降了5%。"],["The rise in accidents remains a puzzle.","事故的增多仍是个谜。"]]},{"l":"k.n.ow/l.e.dge","p":"-.ˈn.ɒ/l.ɪ.dʒ","cn":"n. 知识；学问","s":[["They successfully communicate their knowledge to others.","他们成功地把他们的知识传达给别人。"],["His knowledge of French is only fair.","他的法语知识还算可以。"],["He denied all knowledge of the affair.","他否认知道此事。"]]},{"l":"ch.a.r/a.c/t.er","p":"ˈk.æ.r/ə.k/t.ə","cn":"n. 文字","s":[["She's a good judge of character.","她很善于鉴定别人的性格。"],["He's no longer a depressive character.","他不再是一个抑郁的人物。"],["I despise such people; they've no character.","我藐视这种人，他们没骨气。"]]},{"l":"s.p.r.ea.d","p":"s.p.r.e.d","cn":"v. 传播","s":[["A grin spread across her face.","她粲然一笑。"],["The disease spreads easily.","这种疾病容易传播。"],["Darkness spread and enfolded him.","黑暗弥漫开来，将他笼罩。"]]},{"l":"t.r.a.n.s/l.a/tion","p":"t.r.æ.n.z/ˈl.eɪ/ʃən","cn":"n. 译文；译本","s":[["I have only read Tolstoy in translation.","我只读过托尔斯泰作品的译本。"],["The irony is lost in translation.","原文的反语用法在翻译中丢失了。"],["The book loses something in translation.","此书在翻译过程中丢失了一些原意。"]]},{"l":"t.a.k.e i.n","p":"t.eɪ.k.- ɪ.n","cn":"吸收；摄入","s":[["The tour takes in six European capitals.","这次旅游包括六个欧洲国家的首都。"],["Fish take in oxygen through their gills.","鱼用鳃吸取氧气。"],["How many sugars do you take in coffee?","您在咖啡里放几块方糖？"]]},{"l":"g.r.ee.n/h.ou.s.e g.a.s","p":"ˈɡ.r.iː.n/h.aʊ.s.- ɡ.æ.s","cn":"温室气体","s":[]},{"l":"t.o b.e/g.i.n w.i.th","p":"t.uː b.ɪ/ˈɡ.ɪ.n w.ɪ.ð","cn":"首先；第一点","s":[["To begin with, how do we create fictional characters?","首先，我们如何创造虚构的人物？"]]},{"l":"c.o.m.e f.r.o.m","p":"k.ʌ.m.- f.r.ɒ.m","cn":"来自","s":[["This comes from a storybook.","这来自于一本故事书。"],["She comes from a very artistic family.","她出身于艺术世家。"],["Much of our butter comes from New Zealand.","我们的黄油大多产自新西兰。"]]},{"l":"l.oo.k a/r.ou.n.d","p":"l.ʊ.k ə/ˈr.aʊ.n.d","cn":"环视；环顾；四下察看","s":[["He looked around the filthy room in distaste.","他厌恶地环顾着这肮脏的房间。"],["In the meantime, the boys, having used all their books, looked around for new ammunition.","与此同时，男孩们扔完了所有的书，四处寻找新的弹药。"]]},{"l":"b.e m.a.d.e o.f","p":"b.i m.eɪ.d.- ə.v","cn":"由……制成","s":[["The frame is made of steel.","这个架子是钢制的。"],["The frame is made of metal.","框子是用金属做的。"],["The tiles are made of clay.","这些砖是用陶土制成的。"]]},{"l":"f.or e.x/a.m/p.le","p":"f.ɔː ɪ.ɡz/ˈɑː.m/p.l","cn":"例如；譬如","s":[["Have they, for example, demonstrated a commitment to democracy?","例如，他们展现了对民主的奉献吗？"],["Take, for example, the simple sentence: \"The man climbed up the hill.\"","以这个简单句为例：“那个人爬上了山坡。”"],["The report is incomplete; it does not include sales in France, for example.","这份报告不完整，例如在法国的销售情况就没包括进去。"]]},{"l":"c.o/mm.u/n.i/c.a.t.e w.i.th","p":"k.ə/ˈm.juː/n.ɪ/k.eɪ.t.- w.ɪ.ð","cn":"与……沟通","s":[]},{"l":"c.a.ll o.n","p":"k.ɔː.l ɒ.n","cn":"号召；动员；要求","s":[["The president paid a courtesy call on Emperor Akihito.","总统礼节性地拜访了明仁天皇。"],["The president called on educators and politicians to help him restructure American education.","该总统号召教育家和政治家们帮助他重新建构美国的教育。"]]},{"l":"a/cc.or.d/i.ng t.o","p":"ə/ˈk.ɔː.d/ɪ.ŋ t.uː","cn":"据（……所说）；按（……所报道）","s":[["Prices change according to supply and demand.","价格根据供应量和需求量而变化。"],["According to Mick, it's a great movie.","据米克说，这是一部了不起的电影。"],["Prices vary according to the quantity ordered.","价格根据所订数量而变化。"]]},{"l":"b.y a.c/c.i/d.e.n.t","p":"b.aɪ ˈæ.k/s.ɪ/d.ə.n.t","cn":"偶然；意外地","s":[]}]},{"name":"Unit 4 Our animal friends","words":[{"l":"d.o.l/ph.i.n","p":"ˈd.ɒ.l/f.ɪ.n","cn":"n. 海豚","s":[["The story describes the extraordinary encounter between a man and a dolphin.","这个故事描述了一个男人与一只海豚之间的奇遇。"],["The dolphin is an intelligent animal.","海豚是聪明的动物。"],["The dolphin has evolved a highly developed jaw.","海豚已经进化形成高度发达的下颌。"]]},{"l":"h.e.n","p":"h.e.n","cn":"n. 母鸡","s":[["The hen may not be able to feed its young.","这只母鸡也许不能喂它的幼雏。"],["A chick keeps a hen busy.","一只小鸡已够母鸡忙了。"],["A rooster was leading many hens.","一只公鸡正带着许多母鸡。"]]},{"l":"b.l.i.n.d","p":"b.l.aɪ.n.d","cn":"adj. 瞎的；失明的","s":[["Doctors think he will go blind.","医生们认为他会失明。"],["His mother is partially blind.","他的母亲失去了部分视力。"],["She was blinded in the explosion.","她在那场爆炸中双目失明了。"]]},{"l":"w.oo.l","p":"w.ʊ.l","cn":"n. （羊等的）毛（只要求理解）","s":[["This scarf is 100% wool.","这条披肩是纯毛的。"],["He wound the wool into a ball.","他把毛线缠绕成一团。"],["Wool can be spun from fleeces.","羊毛可以纺成毛线。"]]},{"l":"s.ir","p":"s.ɜː","cn":"n. 先生","s":[["Is everything in order, sir?","一切都正常吗，先生？"],["Good morning, sir. Can I help you?","早上好，先生。您要点什么？"],["I will be the Vicar of Bray, Sir!","我都将是布雷的牧师，大人！"]]},{"l":"r.e/c.e.p/tion/i.s.t","p":"r.ɪ/ˈs.e.p/ʃən/ɪ.s.t","cn":"n. 接待员（只要求理解）","s":[["The receptionist recognized him at once.","那名接待员马上认出了他。"],["The receptionist led the way to the boardroom.","接待员领路来到董事会会议室。"],["He had the receptionist almost jumping through hoops for him. But to no avail.","他让接待员为他几乎饱经折磨，但根本没有用。"]]},{"l":"a/ll.ow","p":"ə/ˈl.aʊ","cn":"v. 允许进入（或出去、通过）","s":[["We must allow for human error.","我们必须考虑到人为的失误。"],["Only one carry-on is allowed.","随身只能携带一个小包。"],["The children are allowed to watch TV after school.","孩子们被允许在放学后看电视。"]]},{"l":"a/p.o.l/o/g.i.z.e","p":"ə/ˈp.ɒ.l/ə/dʒ.aɪ.z.-","cn":"v. 道歉","s":[["I'd die before I apologized!","我宁愿死也不道歉！"],["Why should I apologize?","我为什么要道歉？"],["I'm damned if I'll apologize!","我决不道歉！"]]},{"l":"a/s.l.ee.p","p":"ə/ˈs.l.iː.p","cn":"adj. 睡着","s":[["The police found him asleep in a garage.","警察发现他在一处车库里睡着了。"],["The cashier fell asleep again.","出纳员又睡去了。"],["He had fallen asleep on the sofa.","他在沙发上睡着了。"]]},{"l":"s.m.o.k.e","p":"s.m.əʊ.k.-","cn":"n. 烟","s":[["They wouldn't allow me to smoke.","他们不会允许我抽烟。"],["The smoke sets off the fire alarm.","烟雾触发了火警报警器。"],["Smoke appeared on the horizon.","地平线上升起了烟雾。"]]},{"l":"f.ire/m/a.n","p":"ˈf.aɪə/m/ə.n","cn":"n. 消防队员","s":[["Mark's father is a fireman.","马克的父亲是一名消防员。"],["He couldn't help a fireman.","他不能帮助消防员。"],["What's his job? He's a fireman.","他做什么工作？他是一名消防员。"]]},{"l":"t.y.p.e","p":"t.aɪ.p.-","cn":"n. 类型；种类","s":[["She's the artistic type.","她是艺术家一类的人。"],["He's not the nervous type.","他不是那种好紧张的人。"],["What blood type do you have?","你是什么血型？"]]},{"l":"s.ear.ch/-.a.n.d/-.r.e.s/c.ue","p":"ˌs.ɜː.tʃ/-.ə.n.d/-.ˈr.e.s/k.juː","cn":"n. 搜索救援（只要求理解）","s":[]},{"l":"s.er/v.i.c.e","p":"ˈs.ɜː/v.ɪ.s.-","cn":"n. 服务","s":[["Her service has improved.","她的发球有了提高。"],["A new late-night service is now operating.","现在推出一项新的深夜服务。"],["Additionally, the bus service will run on Sundays, every two hours.","此外，公共汽车将于星期天运行，每两小时一班。"]]},{"l":"d.i/s.a.s/t.er","p":"d.ɪ/ˈz.ɑː.s/t.ə","cn":"n. 灾难；灾害","s":[["This will surely end in disaster.","这无疑将以灾难告终。"],["As a teacher, he's a disaster.","他当老师压根儿就不称职。"],["Disaster threatens on every side.","灾祸四伏。"]]},{"l":"gu.e.s.t","p":"ɡ.e.s.t","cn":"n. 旅客；房客","s":[["Fresh groups of guests arrived.","新客成批到达了。"],["Our special guest tonight is...","今晚我们的嘉宾是…"],["My guest arrived punctually.","我的客人准时到了。"]]},{"l":"t.ea.m","p":"t.iː.m","cn":"n. 组；班","s":[["He trains the Olympic team.","他训练奥林匹克队。"],["The teams served up some fantastic entertainment.","这些队献上了精彩的表演。"],["We already have our core team in place.","我们的核心队伍已经就位。"]]},{"l":"t.r.a.n/s.p.or.t","p":"t.r.æ.n/ˈs.p.ɔː.t","cn":"v. 运输；运送","s":[["The goods were damaged during transport.","货物在运输期间受损。"],["Applicants must have their own transport.","申请人必须有自己的交通工具。"],["The future of public transport is not in question.","公共交通的未来发展是不容置疑的。"]]},{"l":"gu.ar.d","p":"ɡ.ɑː.d","cn":"v. 守卫；保卫","s":[["He closely guarded her identity.","他严密地保守她的身份。"],["\"Hey, buddy,\" says the guard.","“嘿，伙计。”卫兵说。"],["You can't let your guard down.","你不能掉以轻心。"]]},{"l":"h.o.n/ey","p":"ˈh.ʌ.n/i","cn":"n. 蜂蜜","s":[["I'm sorry, honey. I don't know millilitre.","抱歉，亲爱的。我不懂毫升制。"],["Have you seen my keys, honey?","你见到我的钥匙了吗，宝贝？"],["Honey can help to detox the body.","蜂蜜有助于身体解毒。"]]},{"l":"m.a/t.e/r.i/a.l","p":"m.ə/ˈt.ɪə/r.i/ə.l","cn":"n. 材料；原料","s":[["The material is machined in a factory.","该材料在一家工厂用机器加工而成。"],["Dealer/Distributor Materials -- $5.2","代理商分销商材料 -- 5.2"],["This material is 45% nylon.","这种材料含45%的尼龙。"]]},{"l":"ei/th.er","p":"ˈaɪ/ð.ə","cn":"adv. 也","s":[["I haven't visited the Bund either.","我也没去过外滩。"],["Don't let me influence you either way.","何去何从都别受我的影响。"],["Is there any hard evidence either way?","不管正反，有什么确凿证据吗？"]]},{"l":"sh.ar.k","p":"ʃ.ɑː.k","cn":"n. 鲨鱼","s":[["He is near the shark.","他在鲨鱼附近。"],["I can see a shark.","我能看到一条鲨鱼。"],["The shark described a circle around the shoal of fish.","这条鲨鱼围绕着鱼群游动。"]]},{"l":"s.c.are.d","p":"s.k.eə.d","cn":"adj. 害怕；恐惧","s":[["I'm certainly not scared of him.","我当然不怕他。"],["I was dead scared.","我怕得要死。"],["Becky was scared.","贝基很害怕。"]]},{"l":"g.r.ey","p":"ɡ.r.eɪ","cn":"adj. 灰色的","s":[["I'll take the grey jacket.","我要那件灰色夹克衫。"],["I leave behind two trees: one with silver grey hair, the other still freshly green.","我留下两棵树，一棵长着银灰色的头发，另一棵还鲜绿。"],["He dresses in sober grey suits.","他穿着一套素净的灰色衣服。"]]},{"l":"s.o.m.e/wh.ere","p":"ˈs.ʌ.m.-/w.eə","cn":"adv. 在某处；到某处","s":[["A bomb exploded somewhere near.","一颗炸弹在附近爆炸。"],["I needed somewhere to live.","我需要某个住的地方。"],["She's somewhere about the office.","她在办公室附近。"]]},{"l":"p.r.o.b/a.b.l/y","p":"ˈp.r.ɒ.b/ə.b.l/i","cn":"adv. 很可能；大概","s":[["You're probably right.","你很可能是对的。"],["It would probably pay you to hire an accountant.","聘一名会计师或许对你有好处。"],["Granted, some amount of delusion is probably part of the human condition.","当然，一定程度的妄想可能是人类状况的一部分。"]]},{"l":"s.our.c.e","p":"s.ɔː.s.-","cn":"n. 来源；出处","s":[["What is their main source of income?","他们的主要收入来源是什么？"],["Success in sport is a source of national pride.","体育成就是民族光荣的源泉。"],["There are alternative sources of nutrition to animal meat.","有能替代动物肉类的其他营养来源。"]]},{"l":"s.o.m.e/t.i.m.e","p":"ˈs.ʌ.m.-/t.aɪ.m.-","cn":"adv. 在某时","s":[["Lions sometimes hunt alone.","狮子有时单独猎食。"],["Even friends disagree sometimes.","即便是朋友有时也有分歧。"],["Sometimes we eat out of doors.","有时我们在户外进餐。"]]},{"l":"e.x/t.i.n.c.t","p":"ɪ.ks/ˈt.ɪ.ŋ.k.t","cn":"adj. 已灭绝的；绝种的","s":[["Scientists are attempting to compare features of extinct animals with living analogues.","科学家正试图把已灭绝动物的特征与现存类似动物相比较。"],["The idea of cloning extinct life forms still belongs to science fiction.","对绝种的生命形式进行克隆的想法仍然属于科学幻想。"],["Herbalism had become an all but extinct skill in the Western world.","草药医术在西方世界几乎已成了一项绝迹的技术。"]]},{"l":"e.f/f.or.t","p":"ˈe.f/-.ə.t","cn":"n. 艰难的尝试；试图","s":[["He headed off efforts to replace him as leader.","他挫败了要取代他的领导地位的企图。"],["Don't dissipate your efforts.","不要浪费你的精力。"],["Efforts to preserve the peace have failed.","维护和平的努力失败了。"]]},{"l":"l.ea.d s.o.m.e/b.o/d.y t.o","p":"l.iː.d ˈs.ʌ.m.-/b.ə/d.i t.uː","cn":"带着（某人）到","s":[["The leading car came to a halt.","行驶在前面的车停了下来。"],["A study of yoga leads naturally to meditation.","习练瑜珈自然地导致冥想。"]]},{"l":"f.a.ll a/s.l.ee.p","p":"f.ɔː.l ə/ˈs.l.iː.p","cn":"入睡；睡着","s":[["The cashier fell asleep again.","出纳员又睡去了。"],["He had fallen asleep on the sofa.","他在沙发上睡着了。"],["He lay down on the sofa and soon fell asleep.","他在沙发上躺下，很快就睡着了。"]]},{"l":"g.e.t d.ow.n","p":"ɡ.e.t d.aʊ.n","cn":"俯身；趴下；跪下","s":[]},{"l":"f.ire e.n/g.i.n.e","p":"f.aɪə ˈe.n/dʒ.ɪ.n.-","cn":"消防车","s":[]}]},{"name":"Unit 5 Water is life","words":[{"l":"e.v.e/r.y/d.ay","p":"ˈe.v.-/r.i/d.eɪ","cn":"adj. 每天的；日常的","s":[["Do you read a newspaper everyday?","您现在每天读报吗？"],["The Internet has become part of everyday life.","互联网已成为日常生活的一部分。"],["Complaints seemed to be an everyday occurrence.","投诉似乎成了天天发生的事。"]]},{"l":"f.or.m","p":"f.ɔː.m","cn":"n. 类型；形态","s":[["Hydrogen and oxygen combine to form water.","氢与氧化合成水。"],["Hydrogen combines with oxygen to form water.","氢与氧化合成水。"],["This dictionary is available in electronic form.","本词典有电子版。"]]},{"l":"j.o.ur/n.ey","p":"ˈdʒ.-.ɜː/n.i","cn":"n. （尤指长途）旅行","s":[["The long journey tired him.","漫长的旅程使他疲倦。"],["The journe
