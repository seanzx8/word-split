了搅咖啡。"],["She licked the spoon clean.","她把调羹舔得干干净净。"],["She licked the honey off the spoon.","她舔光了调羹上的蜂蜜。"]]},{"l":"s.u/p.er/m.ar/k.e.t","p":"ˈs.uː/p.ə/m.ɑː/k.ɪ.t","cn":"超市（只要求理解）","s":[["I do a weekly shop at the supermarket.","我一周上超市一次。"],["He openly shoplifted from a supermarket.","他在一家超市公然行窃。"],["The gang did a warehouse and a supermarket.","那帮匪徒抢劫了一个仓库和一家超级市场。"]]},{"l":"h.er/s.e.l.f","p":"h.ɜː/ˈs.e.l.f","cn":"（用作女性的反身代词）她自己，自己（只要求理解）","s":[["She fancies herself (as) a serious actress.","她自以为是严肃的演员。"],["She keeps herself apart from other people.","她与其他人保持距离。"],["She forced herself to be polite to them.","她对他们强装客气。"]]},{"l":"w.ee.k","p":"w.iː.k","cn":"周；星期（只要求理解）","s":[["The course lasts five weeks.","这门课程上五周。"],["The program aired last week.","该节目已于上周播出。"],["I'll see you Thursday week.","我们下星期四见。"]]},{"l":"s.a.l/a.d","p":"ˈs.æ.l/ə.d","cn":"蔬菜沙拉（只要求理解）","s":[["Can I help you to some more salad?","再给你来点色拉好吗？"],["Is cold meat and salad OK for lunch?","午饭吃冷肉和色拉行吗？"],["What's your favorite food? My favorite food is salad.","你最喜欢什么食物？我最喜欢的食物是沙拉。"]]}]},{"name":"Unit 7 Numbers 数词","words":[{"l":"o.n.e","p":"wʌ.n.-","cn":"一","s":[["No one doubted his ability.","没有人怀疑他的能力。"],["Listen, I finish at one.","听着，我一点钟结束。"],["Only one carry-on is allowed.","随身只能携带一个小包。"]]},{"l":"t.w.o","p":"t.-.uː","cn":"二","s":[["Two files have gone missing.","两个档案不见了。"],["You have two giraffe toys.","你有两个长颈鹿玩具。"],["The journey time is two hours.","旅程时间为两个小时。"]]},{"l":"th.r.ee","p":"θ.r.iː","cn":"三","s":[["Three fives are fifteen.","三个五等于十五。"],["She has three world titles.","她已获得三项世界冠军。"],["The car crash claimed three lives.","那次撞车事故导致三人死亡。"]]},{"l":"f.our","p":"f.ɔː","cn":"四","s":[["They have four satellite channels.","他们有4个卫星频道。"],["Four quarters make a whole.","四个四分之一构成一个整体。"],["There's only four days left.","只剩下四天了。"]]},{"l":"f.i.v.e","p":"f.aɪ.v.-","cn":"五","s":[["Three fives are fifteen.","三个五等于十五。"],["The course lasts five weeks.","这门课程上五周。"],["He arrived around five o'clock.","他大约是五点钟到的。"]]},{"l":"s.i.x","p":"s.ɪ.ks","cn":"六","s":[["It's gone six o'clock already.","过了六点了。"],["I waited while six o'clock.","我一直等到了六点钟。"],["I generally get up at six.","我一般六点钟起床。"]]},{"l":"s.e.v/e.n","p":"ˈs.e.v/ə.n","cn":"七","s":[["She's seven months gone.","她怀孕七个月了。"],["We started German in year seven.","我们在七年级开始学习德语。"],["I'll call for you at seven o'clock.","我7点钟去接你。"]]},{"l":"eigh.t","p":"eɪ.t","cn":"八","s":[["Wake up! It's eight o'clock.","醒醒吧！已经八点钟了。"],["The cut needed eight stitches.","这道伤口需要缝八针。"],["Achcha! We'll meet at eight.","好吧！我们八点钟见。"]]},{"l":"n.i.n.e","p":"n.aɪ.n.-","cn":"九","s":[["Everything changed after nine-eleven.","九一一事件发生后，一切都改变了。"],["They have two children aged six and nine.","他们有两个小孩，一个六岁，一个九岁。"],["What do you get if you multiply six by nine?","6乘以9得多少？"]]},{"l":"t.e.n","p":"t.e.n","cn":"十","s":[["It's ten past twelve.","现在十二点十分。"],["We're leaving round about ten.","我们十点钟左右出发。"],["I tend to work in bursts.","我的工作劲头往往是一阵一阵的。"]]},{"l":"e/l.e.v/e.n","p":"ɪ/ˈl.e.v/ə.n","cn":"十一","s":[["Everything changed after nine-eleven.","九一一事件发生后，一切都改变了。"],["It's eleven o'clock at night in Moscow.","现在莫斯科是晚上11点。"],["Charles I ruled for eleven years.","查理一世统治了十一年。"]]},{"l":"t.w.e.l.v.e","p":"t.w.e.l.v.-","cn":"十二","s":[["It's ten past twelve.","现在十二点十分。"],["He retired twelve batters in a row.","他一连使十二个击球手出局。"],["Twelve hours later she was all smiles again.","十二小时之后，她又喜笑颜开了。"]]},{"l":"th.ir/t.ee.n","p":"ˌθ.ɜː/ˈt.iː.n","cn":"十三","s":[["\"Thirteen?\" he guessed wildly.","“十三？”他胡乱猜道。"],["He ran away from home at the age of thirteen.","他十三岁时离家出走。"],["Thirteen is often considered an unlucky number.","十三常被认为是不吉利的数字。"]]},{"l":"f.our/t.ee.n","p":"ˌf.ɔː/ˈt.iː.n","cn":"十四","s":[["I'm fourteen years old.","我14岁。"],["\"Fourteen minutes,\" Chris said, taking a peep at his watch.","“十四分钟，”克里斯瞥了一眼手表说道。"],["Women are advised not to drink more than fourteen units of alcohol per week.","建议妇女每周饮酒不超过十四个酒精单位。"]]},{"l":"f.i.f/t.ee.n","p":"ˌf.ɪ.f/ˈt.iː.n","cn":"十五","s":[["Three fives are fifteen.","三个五等于十五。"],["The average runner can run 2 miles in fifteen minutes.","这名跑步的人水平一般，十五分钟可以跑两英里"],["The talks began some fifteen minutes late.","商谈迟了约十五分钟才开始。"]]},{"l":"s.i.x/t.ee.n","p":"ˌs.ɪ.ks/ˈt.iː.n","cn":"十六","s":[["He worked sixteen hours a day.","他每天工作16个小时。"],["She is sixteen but has a mental age of five.","她十六岁，而智力年龄是五岁。"],["Sixteen times as many men are colour-blind as women.","色盲的男性人数是女性人数的十六倍。"]]},{"l":"s.e.v/e.n/t.ee.n","p":"ˌs.e.v/ə.n/ˈt.iː.n","cn":"十七","s":[["Jenny is seventeen years old.","珍妮17岁。"],["He had confessed to seventeen murders.","他已供认了17项谋杀罪。"],["Nora thought he was seventeen years old.","诺拉觉得他有17岁。"]]},{"l":"eigh/t.ee.n","p":"ˌeɪ/ˈt.iː.n","cn":"十八","s":[["My classmate is eighteen.","我的同学十八岁。"],["His boat is an eighteen-footer.","他的小船长十八英尺。"],["The party was ousted from power after eighteen years.","该党执政十八年后被赶下台。"]]},{"l":"n.i.n.e/t.ee.n","p":"ˌn.aɪ.n.-/ˈt.iː.n","cn":"十九","s":[["They have nineteen days to make up their minds.","他们有十九天的时间来做出决定。"],["It's only nineteen yuan.","它只要十九元。"],["Ten plus nine is nineteen.","十加九是十九。"]]},{"l":"t.w.e.n/t.y","p":"ˈt.w.e.n/t.i","cn":"二十","s":[["So that's twenty of each sort, right?","那么，每一种都是二十个，对不对？"],["Twenty-eight is divisible by seven.","二十八可以被七整除。"],["I've been waiting (for) twenty minutes.","我等了二十分钟。"]]},{"l":"th.ir/t.y","p":"ˈθ.ɜː/t.i","cn":"三十","s":[["Six goes into thirty five times.","6除30得5。"],["Some thirty people attended the funeral.","大约有三十人参加了葬礼。"],["By sunset we had covered thirty miles.","到日落时我们已走了三十英里。"]]},{"l":"f.or/t.y","p":"ˈf.ɔː/t.i","cn":"四十","s":[["Fifty is the new forty.","四十尚未老，五十正当年。"],["My car does forty miles to the gallon.","我的车每加仑汽油跑四十英里。"],["Forty-three members of the expedition were killed.","探险队中43名成员丧生。"]]},{"l":"f.i.f/t.y","p":"ˈf.ɪ.f/t.i","cn":"五十","s":[["Fifty is the new forty.","四十尚未老，五十正当年。"],["We have invited fifty people altogether.","我们共邀请了五十人。"],["Let's split this fifty-fifty.","咱们把这平分了吧。"]]},{"l":"s.i.x/t.y","p":"ˈs.ɪ.ks/t.i","cn":"六十","s":[["She is close on sixty.","她快满六十岁了。"],["Ruth hit sixty home runs that year.","露丝那一年击中了60个本垒打。"],["Sixty of his subordinate officers followed his example.","他的60个下级官员都以他为榜样。"]]},{"l":"s.e.v/e.n/t.y","p":"ˈs.e.v/ə.n/t.i","cn":"七十","s":[["Seventy people were killed.","70人丧生。"],["How old is she—seventy odd?","她多大年纪？七十出头？"],["Seventy thousand tons of oil spilled from the tanker.","7万吨油从油轮漏出。"]]},{"l":"eigh/t.y","p":"ˈeɪ/t.i","cn":"八十","s":[["He's getting on for eighty.","他近八十岁了。"],["Eighty horses trotted up.","80匹马小跑上来。"],["Eighty million years ago, dinosaurs ruled the earth.","八千万年前，地球是恐龙的天下。"]]},{"l":"n.i.n.e/t.y","p":"ˈn.aɪ.n.-/t.i","cn":"九十","s":[["You got here with ninety seconds to spare.","你们到达这里时还剩有90秒钟。"],["Her weight was under ninety pounds.","她的体重不足90磅。"],["You were never a ninety-eight pound weakling.","你从来就不是一个体重98磅、体质孱弱的人。"]]},{"l":"h.u.n/d.r.e.d","p":"ˈh.ʌ.n/d.r.ə.d","cn":"百","s":[["A hundred cents make one euro.","一百分币等于一欧元。"],["I'm not a hundred per cent sure.","我不能百分之百肯定。"],["I still don't feel a hundred per cent.","我还是觉得有些不舒服。"]]}]}]},{"id":"hj7a","name":"沪教版 七年级上册","units":[{"name":"Unit 1 Friendship","words":[{"l":"gu.i/t.ar","p":"ɡ.ɪ/ˈt.ɑː","cn":"n. 吉他","s":[["She's no slouch on the guitar.","她是弹吉他的好手。"],["He went off to change a guitar string.","他离开了去换一根吉他弦。"],["He played some wah-wah guitar.","他弹了一会儿哇哇吉他。"]]},{"l":"h.o.n/e.s.t","p":"-.ˈɒ.n/ɪ.s.t","cn":"adj. 诚实的","s":[["I'm disappointed, to be honest.","我很失望，说实在的。"],["I know she's honest and reliable.","我知道她是诚实可靠的。"],["He is honest, sober and hard-working.","他诚实、稳重、勤奋。"]]},{"l":"p.a/ti.e.n.t","p":"ˈp.eɪ/ʃ.ə.n.t","cn":"adj. 有耐心的","s":[["All our patients have broadly similar problems.","我们所有的病人问题大致相似。"],["She's very good at handling her patients.","她对待病人很有办法。"],["The patient is terminally ill.","这个病人病入膏肓。"]]},{"l":"i.m/p.r.o.v.e","p":"ɪ.m/ˈp.r.uː.v.-","cn":"v. 改进；改善","s":[["The weather gradually improved.","天气逐渐好转。"],["Day by day his condition improved.","他的健康状况一天天好转。"],["I need to improve my English.","我需要提高我的英语水平。"]]},{"l":"c.o.n/f.i/d.e.n.t","p":"ˈk.ɒ.n/f.ɪ/d.ə.n.t","cn":"adj. 自信的；有自信心的","s":[["Mr. Ryan is confident of success.","瑞安先生对成功有信心。"],["He feels more confident on home turf.","他在主场感到更有信心。"],["We are confident in our expectation of a full recovery.","我们满怀信心地期待着完全康复。"]]},{"l":"c.ou.r/a.g.e","p":"ˈk.ʌ.r/ɪ.dʒ.-","cn":"n. 勇气；胆量","s":[["His courage remains unquestioned.","他的勇敢仍然不容置疑。"],["He showed courage in adversity.","他在逆境中显示出了勇气。"],["He showed great courage and determination.","他表现得十分勇敢和果断。"]]},{"l":"f.r.ie.n.d/sh.i.p","p":"ˈf.r.e.n.d/ʃ.ɪ.p","cn":"n. 友谊；朋友关系","s":[["I treasure his friendship.","我珍重他的友谊。"],["Their friendship blossomed into love.","他们的友谊发展成了爱情。"],["Friendship is a two-way process.","友谊是一种相互的关系。"]]},{"l":"t.r.u.s.t","p":"t.r.ʌ.s.t","cn":"n. 信任；信赖","s":[["More importantly, can he be trusted?","更重要的是，他值得信任吗？"],["He set up a trust for his children.","他为子女安排好了信托财产。"],["I know I can trust her in any circumstance.","我知道我在任何情况下都能信任她。"]]},{"l":"s.ur/v.ey","p":"ˈs.ɜː/v.eɪ","cn":"n. 调查","s":[["This very thorough survey goes back to 1784.","这项非常彻底的调查可追溯到1784年。"],["The survey covers all aspects of the business.","调查包括这家企业的各个方面。"],["The survey covers a wide geographical area.","此项调查覆盖的地理区域非常广阔。"]]},{"l":"p.er/s.o/n.a.l","p":"ˈp.ɜː/s.ə/n.ə.l","cn":"adj. 个性的","s":[["That's my personal opinion.","这是我的个人意见。"],["His personal habits put them off.","他的个人习惯让他们反感。"],["Do you have a personal trainer?","你有私人教练吗？"]]},{"l":"qu.a.l/i/t.y","p":"ˈkw.ɒ.l/ə/t.i","cn":"n. 品质；品德","s":[["The recording quality is excellent.","录制质量极好。"],["The quality is uniformly high.","质量一律很高。"],["Our company puts the emphasis on quality.","我们公司重视质量。"]]},{"l":"c.a.r/i.ng","p":"ˈk.eə.r/ɪ.ŋ","cn":"adj. 关心他人的；体贴人的","s":[["Children need a caring environment.","儿童需要一个充满关怀的环境。"],["She is very caring and very genuine.","她很有同情心，也非常诚实可靠。"]]},{"l":"d.e/s.c.r.i.b.e","p":"d.ɪ/ˈs.k.r.aɪ.b.-","cn":"v. 描述；形容","s":[["Can you describe him to me?","你能向我描述一下他的样子吗？"],["The effect is almost impossible to describe.","这影响几乎无法言表。"],["It describes completely the facility and its safety basis.","它完整地描述了设备和它的安全基础。"]]},{"l":"a/pp.ea/r.ance","p":"ə/ˈp.ɪə/r.əns","cn":"n. 外貌","s":[["Don't be fooled by his appearance.","不要被他的外表所蒙蔽。"],["She sets great store by her appearance.","她十分看重自己的外貌。"],["He worries obsessively about his appearance.","他过度烦恼自己的外表。"]]},{"l":"s.t.r.aigh.t","p":"s.t.r.eɪ.t","cn":"adj. 直的","s":[["We just change the curve into straight lines.","我们只是把曲线变成了直线。"],["You'll look taller if you stand up straight.","站直身子，你会显得高些。"],["Brett looked straight ahead.","布瑞特向前直视。"]]},{"l":"d.ar.k","p":"d.ɑː.k","cn":"adj. 褐色的；乌黑的","s":[["He had dark, curly hair.","他有一头黑色卷发。"],["His dark head bent over her.","他对她低下他那黑发的头。"],["They avoid going out alone after dark.","他们避免黄昏后独自出门。"]]},{"l":"s.a.m.e","p":"s.eɪ.m.-","cn":"adj. 同一的；相同的","s":[["Our children attend the same school.","我们的孩子上同一所学校。"],["We're booked on the same flight.","我们订了同一班机的机票。"],["I would do the same again.","我愿再做同样的事。"]]},{"l":"b.a/s.i.c","p":"ˈb.eɪ/s.ɪ.k","cn":"adj. 基本的；基础的","s":[["Drums are basic to African music.","鼓是非洲音乐的基本乐器。"],["He gets a basic salary plus commission.","他领取基本薪金，外加佣金。"],["Water is a basic necessity of life.","水是一种基本生活必需品。"]]},{"l":"th.ough.t","p":"θ.ɔː.t","cn":"n. 想法","s":[["I thought you'd never finish!","我还以为你会完成不了呢！"],["He paused, apparently lost in thought.","他停顿下来，显然陷入了沉思。"],["'I must be crazy,' she thought.","“我准是疯了。”她想。"]]},{"l":"g.l.a.d","p":"ɡ.l.æ.d","cn":"adj. 高兴的；愉快的","s":[["I'm so glad (that) you're safe!","你安然无恙我真高兴！"],["I'm glad hats are coming back.","我很高兴帽子再度流行起来。"],["I'm glad you came along.","有你跟我一起来，我很高兴。"]]},{"l":"r.i.s.e","p":"r.aɪ.z.-","cn":"v. 上升","s":[["Interest rates rise from 4% to 5%.","利率从4%上升到5%。"],["The batter rises as it bakes.","面糊烘烤时膨胀。"],["They expected house prices to rise.","他们预期房价会上涨。"]]},{"l":"e.n.d","p":"e.n.d","cn":"n. 结局","s":[["This will surely end in disaster.","这无疑将以灾难告终。"],["The story has a happy ending.","故事的结局很圆满。"],["They live in the end house.","他们住在最后的那座房子。"]]},{"l":"h.ear.t","p":"h.ɑː.t","cn":"n. 心","s":[["Her heart beat faster.","她的心跳加快。"],["Heart disease runs in the family.","这家人都有心脏病。"],["He died six weeks later of a massive heart attack.","他6周后死于一次严重的心脏病发作。"]]},{"l":"b.e g.oo.d a.t","p":"b.i ɡ.ʊ.d æ.t","cn":"擅长……","s":[["Fishing is good at high water.","高水位有利于钓鱼。"],["Peter is good at soccer ball.","皮特擅长足球。"],["What helps you to be good at sport?","是什么让你擅长运动？"]]},{"l":"t.ur.n t.o s.o.m.e/b.o/d.y f.or h.e.l.p","p":"t.ɜː.n t.uː ˈs.ʌ.m.-/b.ə/d.i f.ɔː h.e.l.p","cn":"求助于某人","s":[]},{"l":"a.f/t.er s.ch.oo.l","p":"ˈɑː.f/t.ə s.k.uː.l","cn":"放学后","s":[["The children are allowed to watch TV after school.","孩子们被允许在放学后看电视。"]]},{"l":"b.e w.i.ll/i.ng t.o d.o s.o.m.e/th.i.ng","p":"b.i ˈw.ɪ.l/ɪ.ŋ t.uː d.uː ˈs.ʌ.m.-/θ.ɪ.ŋ","cn":"愿意做某事","s":[]},{"l":"m.e/d.i/u.m h.eigh.t","p":"ˈm.iː/d.i/ə.m h.aɪ.t","cn":"中等身高","s":[["He is of medium height and he has small eyes.","他中等身材，有一双小眼睛。"],["Jack is a handsome boy who is of medium height.","杰克是一个中等身高的英俊的男孩。"],["Mitchell is well-built, of medium height, with a dark complexion.","米切尔身体强壮，中等个子，面色黝黑。"]]},{"l":"m.o.d/er.n d.ance","p":"ˈm.ɒ.d/ə.n d.ɑːns","cn":"现代舞","s":[["She'd been a dancer with a modern dance company in New York.","她过去一直是纽约一家现代舞公司的舞蹈演员。"]]},{"l":"w.a.tch o/v.er","p":"w.ɒ.tʃ ˈəʊ/v.ə","cn":"照管；监督","s":[]},{"l":"r.i.s.e i.n/t.o","p":"r.aɪ.z.- ˈɪ.n/t.uː","cn":"上升到","s":[["The helicopter rose into the air.","直升机升上了天空。"]]},{"l":"c.r.y ou.t","p":"k.r.aɪ aʊ.t","cn":"大叫；叫喊","s":[["You cry out, don't you?","难道没有哭出来吗？"],["I stopped my ears but still heard her cry out.","我捂上耳朵，但还能听见她大声喊叫。"],["He felt so happy that he tried his best to cry out, \"Oh, my Fairy!\"","他感到很高兴，尽力叫道：“噢，我的仙女！”"]]},{"l":"c.r.y o.n.e/s.e.l.f t.o s.l.ee.p","p":"k.r.aɪ wʌ.n.-/ˈs.e.l.f t.uː s.l.iː.p","cn":"哭着入睡","s":[]},{"l":"w.a.k.e u.p","p":"w.eɪ.k.- ʌ.p","cn":"醒；醒来","s":[["Wake up! It's eight o'clock.","醒醒吧！已经八点钟了。"],["You have to wake up now, baby.","你现在得醒了，宝贝儿。"]]},{"l":"c.o.m.e a.n.d g.o","p":"k.ʌ.m.- æ.n.d ɡ.əʊ","cn":"来去","s":[]},{"l":"t.a.k.e s.o.m.e/b.o/d.y.'s p.l.a.c.e","p":"t.eɪ.k.- ˈs.ʌ.m.-/b.ə/d.i.z p.l.eɪ.s.-","cn":"替代某人","s":[["Accurate reporting takes second place to lurid detail.","准确的报道在其次，耸人听闻的细节最重要。"],["In semiconductor receivers transistors take the place of vacuum tubes.","在半导体收音机中晶体管代替了真空管。"]]},{"l":"c.o.m.e a/l.o.ng","p":"k.ʌ.m.- ə/ˈl.ɒ.ŋ","cn":"出现","s":[["Come along! We're late.","快点！我们迟到了。"],["The book's coming along nicely.","这本书愈来愈好看了。"],["Your French has come along a lot recently.","你的法语最近进步很大。"]]}]},{"name":"Unit 2 School life","words":[{"l":"g.e/o/g.r.a/ph.y","p":"dʒ.i/ˈɒ/ɡ.r.ə/f.i","cn":"n. 地理（学）","s":[["I'm revising Geography today.","我今天复习地理。"],["I'm afraid geography is not my strong suit.","恐怕地理不是我的强项。"],["Geography was my weak subject.","地理课是我的弱项。"]]},{"l":"c.or.n/er","p":"ˈk.ɔː.n/ə","cn":"n. 角；墙角","s":[["I called him from the phone box on the corner.","我在拐角处的电话亭打电话给他。"],["The referee awarded a corner.","裁判员判给了一次角球。"],["He reversed around the corner.","他倒车转过拐角。"]]},{"l":"a.c/t.i.v/i/t.y","p":"æ.k/ˈt.ɪ.v/ə/t.i","cn":"n. 活动","s":[["The test records the electrical activity of the brain.","这个测试显示出大脑的电流活动。"],["Physical activity promotes good health.","身体运动促进健康。"],["Parents encourage every activity imaginable.","父母鼓励一切可能的活动。"]]},{"l":"c.l.u.b","p":"k.l.ʌ.b","cn":"n. 社团","s":[["We had lunch at the golf club.","我们在高尔夫球俱乐部吃的午饭。"],["The next player discarded a club.","接下来的那位玩家出了张梅花牌。"],["The club is responsive to new ideas.","俱乐部对新的想法都表示欢迎。"]]},{"l":"p.r.a.c/t.i.s.e","p":"ˈp.r.æ.k/t.ɪ.s.-","cn":"v. 练习；训练","s":[["You need to practise every day.","你需要每天练习。"],["If you practise speaking English, you'll soon improve.","只要你练习说英语，很快就会进步。"],["He usually wants to practise his English on me.","他通常想跟我练习英语。"]]},{"l":"s.o.l.v.e","p":"s.ɒ.l.v.-","cn":"v. 解答","s":[["It isn't going to solve a single thing.","这解决不了任何问题。"],["She tried her best to solve the problem.","她尽了最大的努力解决这个问题。"],["In itself, it's not a difficult problem to solve.","这本身并不是个难解决的问题。"]]},{"l":"d.e/v.e.l/o.p","p":"d.ɪ/ˈv.e.l/ə.p","cn":"v. 培养；发展","s":[["How fast would the disease develop?","这种疾病发展有多快？"],["Their economy is the envy of the developing world.","他们的经济令发展中国家羡慕。"],["China is also actively developing high-speed maglev trains.","中国也在积极发展高速磁悬浮列车。"]]},{"l":"s.k.i.ll","p":"s.k.ɪ.l","cn":"n. 技术；技能","s":[["Skill comes with practice.","熟能生巧。"],["Her job demands a high degree of skill.","她的工作要求有高超的技能。"],["They never learned skills to engage the attention of the others.","他们从来没有学过吸引别人注意的技巧。"]]},{"l":"t.ee.n","p":"t.iː.n","cn":"adj. 青少年的","s":[["I have never lost the weight I put on in my teens.","我在十几岁时增加的体重从没减下去过。"],["Are mothers and teens inevitably at loggerheads?","母亲与青少年不可避免地会发生争执吗？"],["She began writing poetry in her teens.","她从十几岁开始写诗。"]]},{"l":"m.a.g/a/z.i.n.e","p":"ˌm.æ.ɡ/ə/ˈz.iː.n.-","cn":"n. 杂志","s":[["He has produced his own sports magazine.","他已经创办了自己的体育杂志。"],["He contributes regularly to the magazine 'New Scientist'.","他定期给《新科学家》杂志撰稿。"],["She used to edit a women's magazine.","她曾主编过妇女杂志。"]]},{"l":"t.ee/n.a.g/er","p":"ˈt.iː/n.eɪ.dʒ/ə","cn":"n. （13至19岁之间的）青少年","s":[["What turns teenagers off science?","是什么使青少年们对科学失去了兴趣？"],["Teenagers often have difficulty expressing themselves.","十来岁的孩子在表达思想方面常常有困难。"],["10% of teenagers spend time outside every day.","10%的青少年每天花时间到户外去。"]]},{"l":"g.r.ee.t/i.ng","p":"ˈɡ.r.iː.t/ɪ.ŋ","cn":"n. 问候；招呼","s":[["She waved a friendly greeting.","她友好地挥手致意。"],["He raised his hand in greeting.","他举手致意。"],["He raised a hand in greeting.","他扬起手表示问候。"]]},{"l":"g.r.a.d.e","p":"ɡ.r.eɪ.d.-","cn":"n. 年级","s":[["What grade are you hoping to get?","你希望得到什么样的成绩？"],["Ten beaches were graded as acceptable.","有十个沙滩属于可接受的那一类。"],["I flunked math in second grade.","我二年级时数学不及格。"]]},{"l":"e.n/er/g.y","p":"ˈe.n/ə/dʒ.i","cn":"n. 精力；活力","s":[["She's always full of energy.","她总是充满活力。"],["The whole of creation is made up of energy.","全宇宙是由能量构成的。"],["That USES up 1%, or close to 1%, of the world's energy.","它使用了1%或者接近1%的全世界的能源。"]]},{"l":"d.r.a/m.a","p":"ˈd.r.ɑː/m.ə","cn":"n. 戏；剧","s":[["Her drama teacher spotted her ability.","她的戏剧老师发现了她的才能。"],["What you need is a drama coach.","你需要的是一位戏剧指导。"],["He knew nothing of Greek drama.","他对希腊戏剧一无所知。"]]},{"l":"s.i.n/c.ere/l.y","p":"s.ɪ.n/ˈs.ɪə/l.i","cn":"adv. 真诚地；诚实地（只要求理解）","s":[["I sincerely believe that this is the right decision.","我由衷地认为这个决定是正确的。"],["\"Congratulations,\" he said sincerely.","“祝贺，”他真诚地说道。"],["I sincerely hope you will soon recover.","我诚恳地盼望你早日康复。"]]},{"l":"d.i/a/r.y","p":"ˈd.aɪ/ə/r.i","cn":"n. 日记；日记簿","s":[["We sneaked a look at her diary.","我们偷偷看了一眼她的日记。"],["She kept a diary for over twenty years.","她记了二十多年的日记。"],["The events were faithfully recorded in her diary.","这些事件在她的日记中如实地记录了下来。"]]},{"l":"p.r.o.j/e.c.t","p":"ˈp.r.ɒ.dʒ/e.k.t","cn":"n. 课题","s":[["They attach great importance to the project.","他们高度重视这个项目。"],["This project is designed to help homeless people.","这个项目旨在帮助无家可归的人。"],["The project is environmentally unsound.","这个工程会破坏环境。"]]},{"l":"p.o.s.t/er","p":"ˈp.əʊ.s.t/ə","cn":"n. 海报","s":[["The artwork for the poster was done by my sister.","该海报的图片是我妹妹制作的。"],["I had seen the poster for the jazz festival in Monterey.","我已经见到了蒙特雷爵士音乐节的海报。"],["This poster is offensive and degrades women.","这张海报冒失无礼，有辱女性尊严。"]]},{"l":"r.e/a/l.i.z.e","p":"ˈr.iː/ə/l.aɪ.z.-","cn":"v. 意识到","s":[["They realized the force of her argument.","他们领悟到了她那论据的威力。"],["I soon realized the mistake.","我很快意识到犯了错误。"],["I hope people realize I'm not a dingbat.","我希望人们意识到我不是个疯子。"]]},{"l":"l.u.ck/i/l.y","p":"ˈl.ʌ.k/ɪ/l.i","cn":"adv. 幸运地；幸好","s":[["Luckily, she isn't injured.","幸运的是，她没受伤。"],["Luckily, we both love football.","幸好我们俩都热爱足球。"],["Luckily, I am a good swimmer.","幸好我是个游泳好手。"]]},{"l":"j.u.s.t","p":"dʒ.ʌ.s.t","cn":"adv. 恰好","s":[["I've just finished Chapter 3.","我刚完成第3章。"],["Will you kids just behave!","孩子们，规矩点！"],["I'm just finishing my book.","眼下我正在完成我的一本书。"]]},{"l":"p.r.e.s/e.n/t.a/tion","p":"ˌp.r.e.z/ə.n/ˈt.eɪ/ʃən","cn":"n. 演示（只要求理解）","s":[["Bring file presentation to life by adding graphics.","添加图表使文件的展示变得生动起来。"],["I am making a multimedia presentation for my science project.","我正在为我的科学项目做多媒体演示。"],["A computer software glitch fouled up their presentation.","一个电脑软件故障弄砸了他们的展示会。"]]},{"l":"m.oo.d","p":"m.uː.d","cn":"n. 情绪；心情（只要求理解）","s":[["My mood gradually lightened.","我的心情渐渐好起来。"],["She was in a relaxed, confident mood.","她的心态从容而自信。"],["I was in a mood to celebrate.","我很想庆祝一番。"]]},{"l":"m.i.n.d","p":"m.aɪ.n.d","cn":"v. 介意","s":[["He has a closed mind.","他思想僵化守旧。"],["We, however, have the mind of Christ.","然而，我们有基督的心。"],["Don't expect others to read your mind.","不要期望别人能看出你的心思。"]]},{"l":"p.a.ck","p":"p.æ.k","cn":"v. （把……）打包","s":[["Then, I packed my schoolbag.","然后，我收拾了我的书包。"],["We packed away the summer clothes.","我们把夏装收藏起来了。"],["I carefully packed up the gifts.","我小心翼翼地把礼品包好。"]]},{"l":"c.e.l/e/b.r.a.t.e","p":"ˈs.e.l/ɪ/b.r.eɪ.t.-","cn":"v. 庆祝；庆贺","s":[["Let's celebrate and damn the expense!","管它花多少钱，咱们先庆祝一番再说！"],["They celebrated their silver wedding in May.","他们于五月份庆祝了银婚纪念日。"],["Mr. Stevens recently celebrated his eightieth birthday.","最近史蒂文斯先生庆祝了他80大寿。"]]},{"l":"s.u.c/c.e.ss","p":"s.ə.k/ˈs.e.s","cn":"n. 成功","s":[["Success is not guaranteed.","不保证一定能成功。"],["The book ensured his success.","这本书保证了他的成功。"],["Hard work is fundamental to success.","勤奋工作是成功的基础。"]]},{"l":"r.o.ck/y","p":"ˈr.ɒ.k/i","cn":"adj. 困难的","s":[["We walked along the rocky shoreline.","我们沿着岩石嶙嶙的海岸线散步。"],["The surrounding countryside is windswept and rocky.","这周围的乡村风多石头多。"],["The path continued over rough, rocky ground.","这条小路穿过了崎岖不平的石头地。"]]},{"l":"d.o th.e d.i.sh/e.s","p":"d.uː ð.ə ˈd.ɪ.ʃ/ɪ.z","cn":"洗碗","s":[["You must do the dishes.","你必须洗餐具。"],["The kids offered to do the dishes.","孩子们主动要求洗盘子。"],["You can say do the dishes or wash the dishes.","你可以说清洗餐具或者清洁餐具。"]]},{"l":"j.u/n.i/or h.igh s.ch.oo.l","p":"ˈdʒ.uː/n.i/ə h.aɪ s.k.uː.l","cn":"初级中学","s":[["He dropped out of junior high school.","他初中辍学了。"]]},{"l":"t.a.k.e p.ar.t i.n","p":"t.eɪ.k.- p.ɑː.t ɪ.n","cn":"参与","s":[["He had been taking part in an international symposium on population.","他那时在参加一个有关人口的国际研讨会。"],["During our first summer vacation, we took part in military training, which laster for 3 weeks.","在第一个暑假期间，我们参加了维期3周的军训。"]]},{"l":"l.oo.k f.or/w.ar.d t.o","p":"l.ʊ.k ˈf.ɔː/w.ə.d t.uː","cn":"期待；盼望","s":[["I look forward to hearing from you.","盼望着收到你的信。"],["The two sisters looked forward to their yearly meetings.","姐妹俩期盼着她们一年一度的会面。"],["I'm looking forward to seeing you perform.","我期待着看你演出。"]]},{"l":"d.ai/l.y l.i.f.e","p":"ˈd.eɪ/l.i l.aɪ.f.-","cn":"日常生活","s":[["Does such an attitudinal change reflect real experiences in daily life?","人生观的这种转变是否反映了日常生活中的真实经历？"]]},{"l":"g.o t.o b.e.d","p":"ɡ.əʊ t.uː b.e.d","cn":"去睡觉","s":[["I think it's time to go to bed.","我想该睡觉了。"],["You'd better go to bed and nurse that cold.","你最好上床睡觉，把感冒治好。"],["She was the last to go to bed.","她是最后一个睡觉的人。"]]},{"l":"g.e.t u.p","p":"ɡ.e.t ʌ.p","cn":"起床","s":[["I generally get up at six.","我一般六点钟起床。"],["Do you have difficulty getting up?","你起床有困难吗？"],["We've got to get up early, all right?","我们得早起床，可以吧？"]]},{"l":"o.n f.oo.t","p":"ɒ.n f.ʊ.t","cn":"步行","s":[["We took cablecar to the top, but went down the mountain on foot!","我们乘缆车上山顶，不过要徒步下山！"]]},{"l":"f.u.ll o.f e.n/er/g.y","p":"f.ʊ.l ə.v ˈe.n/ə/dʒ.i","cn":"充满活力","s":[["She's always full of energy.","她总是充满活力。"]]},{"l":"g.e.t r.ea.d/y f.or","p":"ɡ.e.t ˈr.e.d/i f.ɔː","cn":"准备好……","s":[]},{"l":"p.u.t o.n","p":"p.ʊ.t ɒ.n","cn":"举办；上演","s":[["She's just putting on her make-up.","她正在化妆呢。"],["Maximo put on a pair of glasses.","马克西莫戴上了一副眼镜。"],["She put on the brakes suddenly.","她突然踩了刹车。"]]},{"l":"c.l.ea.n u.p","p":"k.l.iː.n ʌ.p","cn":"打扫干净","s":[["Go clean up and wash up.","去清洁干净，洗干净。"],["Soccer needs to clean up its image.","足球界的形象需要改善。"],["Who's going to clean up this mess?","这么又脏又乱的，谁来清理？"]]},{"l":"p.i.ck u.p","p":"p.ɪ.k ʌ.p","cn":"取（某物）","s":[["Will you pick up all your toys?","把你的玩具都收起来好不好？"],["She bent down to pick up her glove.","她俯身去捡手套。"],["She bent forward to pick up the newspaper.","她弯腰去捡报纸。"]]}]},{"name":"Unit 3 The seasons","words":[{"l":"f.oo.t/p.r.i.n.t","p":"ˈf.ʊ.t/p.r.ɪ.n.t","cn":"n. 脚印；足迹","s":[["We all need to look for ways to reduce our carbon footprint.","我们都需要寻找减少我们碳足迹的办法。"],["The water-cooling scheme will reduce the system's carbon footprint by up to 85 percent.","水冷却方案将减少系统的碳足迹高达85%。"]]},{"l":"w.e.t","p":"w.e.t","cn":"adj. 潮湿的","s":[["Wet weather always depresses me.","阴雨天总使我心情抑郁。"],["We arrived home soaking wet.","我们回到家时，浑身湿淋淋的。"],["It was a grey, wet, April Sunday.","那是一个阴沉、潮湿、4月里的星期天。"]]},{"l":"d.ee.p","p":"d.iː.p","cn":"adj. 深的","s":[["The wardrobe was very deep.","橱柜很深。"],["She took a deep breath.","她深深地吸了一口气。"],["The firm ended up deep in debt.","这家公司最后债台高筑。"]]},{"l":"s.a.n.d/y","p":"ˈs.æ.n.d/i","cn":"adj. 铺满沙子的；含沙的","s":[["The sandy beach was in sight.","那片沙滩映入眼帘。"],["The bulk of the book concerns Sandy's two middle-aged children.","这本书的主要部分讲的是桑迪的两个中年孩子。"],["Sandy leaned across the table, his face uncomfortably close to Brad's.","桑迪将身体探过桌子，他的脸贴近布拉德的脸，使布拉德感觉很不自在。"]]},{"l":"k.i.ck","p":"k.ɪ.k","cn":"v. 踢；踹","s":[["This drink has quite a kick.","这酒的劲相当大。"],["The housing market needs a kick-start.","房产市场需要重振。"],["I got a kick out of seeing my name in print.","看到我的名字被印成铅字，我感到非常兴奋。"]]},{"l":"t.ow.n","p":"t.aʊ.n","cn":"n. 镇；市镇","s":[["I walked into town.","我走进了市中心。"],["The President hits town tomorrow.","总统明天到镇子上来。"],["I like that part of Cape Town.","我喜欢开普敦的那个地方。"]]},{"l":"f.ea/ture","p":"ˈf.iː/tʃə","cn":"n. 特色；特征","s":[["Features include caller ID and three-way calling.","功能包括来电显示和三方通话。"],["The house has many desirable features.","这栋房子有许多吸引人的特点。"],["The film features Cary Grant as a professor.","这部电影由卡里•格兰特饰演一位教授。"]]},{"l":"s.ou.th","p":"s.aʊ.θ","cn":"n. 南；南方","s":[["Our house faces south.","我们的房子面朝南。"],["They live on the south coast.","他们住在南海岸。"],["They've gone to live down south.","他们到南方去住了。"]]},{"l":"c.l.ear","p":"k.l.ɪə","cn":"adj. 晴朗的","s":[["It's time to clear up.","该打扫了。"],["His height gives him a clear advantage.","他的身高使他具有明显的优势。"],["He walked up Fifth Avenue to clear his head.","他在第五大街上走，让头脑清醒清醒。"]]},{"l":"l.ou.d/l.y","p":"ˈl.aʊ.d/l.i","cn":"adv. 喧闹地；响亮地","s":[["The shop bell jangled loudly.","商店的钟发出丁零当啷的巨大响声。"],["She fell over and swore loudly.","她摔倒了，大骂了一声。"],["She wiped her face and sniffed loudly.","她擦擦脸，大声地抽着鼻子。"]]},{"l":"th.u.n/d.er","p":"ˈθ.ʌ.n/d.ə","cn":"n. 雷","s":[["'Sit still!' she thundered.","“坐着别动！”她怒喝道。"],["Thunder grumbled in the distance.","远处雷声隆隆。"],["Thunder exploded overhead.","雷声在头顶上炸开。"]]},{"l":"l.igh.t/n.i.ng","p":"ˈl.aɪ.t/n.ɪ.ŋ","cn":"n. 闪电","s":[["Driving today demands lightning reflexes.","如今驾车需要飞快的反应。"],["He is a lightning rod for controversy.","他是个富有争议的人物."],["Another flash of lightning lit up the cave.","又一道闪电照亮了那个洞穴。"]]},{"l":"f.r.e.sh","p":"f.r.e.ʃ","cn":"adj. 新鲜的","s":[["Is this milk fresh?","这是鲜牛奶吗？"],["Fresh groups of guests arrived.","新客成批到达了。"],["Let's go out for some fresh air.","咱们出去呼吸点新鲜空气。"]]},{"l":"g.a.th/er","p":"ˈɡ.æ.ð/ə","cn":"v. 采集（植物、水果等）","s":[["People would gather from near and far.","人们会从四面八方聚起来。"],["She gathered up her belongings.","她收拾起她的私人物品。"],["You're self-employed, I gather.","我想你是个体经营吧。"]]},{"l":"p.ea.c.e/f.u.l","p":"ˈp.iː.s.-/f.ə.l","cn":"adj. 安静的；平静的","s":[["I endeavor to find some peaceful places.","我努力寻找一些宁静的地方。"],["I was amazingly light-hearted and peaceful.","我当时出奇地轻松和平静。"],["The aims of the organization are wholly peaceful.","这个组织的宗旨完全是追求和平。"]]},{"l":"s.n.a.k.e","p":"s.n.eɪ.k.-","cn":"n. 蛇","s":[["The snake slowly uncurled.","那条蛇慢慢地伸开了蜷缩的身子。"],["The snake slowly uncoiled.","蛇慢慢地展开了盘着的身体。"],["If cornered, the snake will defend itself.","蛇在被逼得走投无路时会自卫的。"]]},{"l":"th.r.ough","p":"θ.r.uː","cn":"prep. 自始至终；从头到尾","s":[["He walked through customs.","他步行通过了海关。"],["I climbed through the window.","我从窗口爬了出来。"],["Look through this glass, Gerda.","透过这镜子看吧，格尔达。"]]},{"l":"p.ar.t","p":"p.ɑː.t","cn":"n. 区域；地区","s":[["She's part French, part English.","她是英法血统各半。"],["Have you learned your part yet?","你记住你的台词了吗？"],["His mother always takes his part.","他母亲总是向着他。"]]},{"l":"ar/t.i/c.le","p":"ˈɑː/t.ɪ/k.l","cn":"n. 文章","s":[["Her article showed no charity towards her former friends.","她的文章对她以前的朋友毫不宽容。"],["The article is full of inaccuracies.","这篇文章里的错误比比皆是。"],["I faxed a first draft of this article to him.","我把这篇文章的初稿传真给他。"]]},{"l":"r.ea/s.o.n","p":"ˈr.iː/z.ə.n","cn":"n. 原因；理由","s":[["There is good reason to doubt this.","有正当理由怀疑这件事。"],["I don't follow your line of reasoning.","我不理解你的推理方法。"],["There are two reasons for this decision: firstly...","做此决定理由有二：第一…"]]},{"l":"a/l.i.v.e","p":"ə/ˈl.aɪ.v.-","cn":"adj. 有生气；有活力","s":[["He's still alive, isn't he?","他还活着，是吗？"],["She had to steal food just to stay alive.","她得偷食物才不至于饿死。"],["Assuming (that) he's still alive, how old would he be now?","假定他还活着，现在有多大年纪了？"]]},{"l":"s.a.n.d/c.a/s.t.le","p":"ˈs.æ.n.d/k.ɑː/s.-.l","cn":"n. 沙堡（只要求理解）","s":[]},{"l":"f.o.l/l.ow","p":"ˈf.ɒ.l/-.əʊ","cn":"v. 按……方式发展","s":[["Other problems may follow.","其它问题也许会随之而来。"],["If you lead, I'll follow.","你领头，我跟着。"],["Sorry—I don't quite follow.","对不起，我不太听懂你的话。"]]},{"l":"d.i/v.i.d.e","p":"d.ɪ/ˈv.aɪ.d.-","cn":"v. （使）分开","s":[["The pupil could add and subtract but hadn't learned to divide.","这名小学生能做加法和减法，但还没学会做除法。"],["How shall we divide up the work?","我们怎么分工呢？"],["Divide 2 into 7, and the answer is 3, remainder 1.","7除以2，商3余1。"]]},{"l":"d.e/c.i.d.e","p":"d.ɪ/ˈs.aɪ.d.-","cn":"v. 对……作出抉择；决定","s":[["It's up to you to decide.","这事由你来决定吧。"],["I've decided to grow my hair.","我已决定留长发。"],["She decided to pack in her job.","她决定辞职不干了。"]]},{"l":"c.r.o.p","p":"k.r.ɒ.p","cn":"n. 庄稼；作物（只要求理解）","s":[["The staple crop is rice.","主要农作物为水稻。"],["Cranberries are a major cash crop in New Jersey.","蔓越橘是新泽西州的一种主要经济作物。"],["Rice farmers here still plant and harvest their crops by hand.","这里的稻农仍然用手工种植和收割庄稼。"]]},{"l":"c.u.l/ture","p":"ˈk.ʌ.l/tʃə","cn":"n. 文化；文明","s":[["We are living in a consumer culture.","我们生活在一种消费文化之中。"],["A culture of failure exists in some schools.","在某些学校中存在着失败文化。"],["They learn Chinese kungfu and the Chinese culture.","他们学习中国功夫和中国文化。"]]},{"l":"l.o/c.a.l","p":"ˈl.əʊ/k.ə.l","cn":"adj. 地方的；当地的","s":[["Police suspect a local gang.","警方怀疑当地的一个不良帮派。"],["She's on the local council.","她是地方议会的议员。"],["Local businesses have agreed to contribute.","当地的公司已经同意捐助了。"]]},{"l":"t.r.a/d.i.tion","p":"t.r.ə/ˈd.ɪ.ʃən","cn":"n. 传统","s":[["This region is steeped in tradition.","这个地区有着深厚的传统。"],["The tradition could date back to 300 BC.","这一传统可追溯到公元前300年。"],["This tradition has no parallel in our culture.","这种传统在我们的文化中是没有的。"]]},{"l":"c.o.n/t.i.n/ue","p":"k.ə.n/ˈt.ɪ.n/juː","cn":"v. 持续；继续存在","s":[["The economy continues to grow.","经济持续增长。"],["The dollar continued to slide.","美元继续下跌。"],["The population continues to increase.","人口持续增长。"]]},{"l":"h.a.v.e p.i.c/n.i.c.s","p":"h.æ.v.- ˈp.ɪ.k/n.ɪ.k.s","cn":"野餐","s":[]},{"l":"w.or.k o.n.e.'s l.a.n.d","p":"w.ɜː.k wʌ.n.-.z l.æ.n.d","cn":"耕种土地","s":[]},{"l":"t.a.k.e a t.r.i.p","p":"t.eɪ.k.- ə t.r.ɪ.p","cn":"去旅行","s":[]},{"l":"s.o/l.ar t.er.m","p":"ˈs.əʊ/l.ə t.ɜː.m","cn":"节气","s":[]},{"l":"i.n f.a.c.t","p":"ɪ.n f.æ.k.t","cn":"事实上","s":[["Her argument was grounded in fact.","她的论述以事实为根据。"],["Road, in fact, is under your footstep.","路，其实就在脚下。"],["In fact, this may irritate some people.","事实上，这可能会激怒一些人。"]]},{"l":"b.e d.i/v.i/d.e.d i.n/t.o","p":"b.i d.ɪ/ˈv.aɪ/d.ɪ.d ˈɪ.n/t.uː","cn":"被划分成……","s":[]},{"l":"b.e b.a.s.e.d o.n","p":"b.i b.eɪ.s.-.t ɒ.n","cn":"基于……","s":[["The story is based on fact.","这个故事是根据真人真事写的。"],["His actions were based on a false assumption.","他的行为基于错误的设想。"],["Most of them are based on systematic reviews.","它们中的大多数都是基于系统的评论。"]]},{"l":"p.l.ay a.n i.m/p.or.t/a.n.t p.ar.t i.n","p":"p.l.eɪ æ.n ɪ.m/ˈp.ɔː.t/ə.n.t p.ɑː.t ɪ.n","cn":"在……上发挥重要作用","s":[]}]},{"name":"Unit 4 The Earth","words":[{"l":"s.y.s/t.e.m","p":"ˈs.ɪ.s/t.ə.m","cn":"n. 系统","s":[["Initially, the system worked well.","开始时系统运转良好。"],["This system helps speed up access times.","这个系统有助于加快读取数据的时间。"],["On Thursday Microsoft rolls out its new operating system.","在星期四微软推出了它的新操作系统。"]]},{"l":"f.i.l.e","p":"f.aɪ.l.-","cn":"n. 档案","s":[["Two files have gone missing.","两个档案不见了。"],["I'm still looking for that lost file.","我还在找那份丢失的档案。"],["The file was labelled 'Private'.","那档案已标明“保密”。"]]},{"l":"a/m.a.z/i.ng","p":"ə/ˈm.eɪ.z/ɪ.ŋ","cn":"adj. 令人大为惊奇的","s":[["It's amazing how soon you adapt.","你这么快就适应了，真是令人惊奇。"],["It's amazing how quickly people adapt.","人适应环境的速度之快真是惊人。"],["She has amazing powers of recall.","她有惊人的记忆力。"]]},{"l":"p.l.a.n/e.t","p":"ˈp.l.æ.n/ɪ.t","cn":"n. 行星","s":[["Does life exist on other planets?","其他行星上有生命吗？"],["Do you know when Tianwen 1 landed on the red planet?","你知道天问1号是什么时候登陆这颗红色星球的吗？"],["The new planet is about ten times the size of the earth.","这个新发现的行星大约是地球大小的10倍。"]]},{"l":"b.i.ll/i.o.n","p":"ˈb.ɪ.l/j.ə.n","cn":"num. 十亿（只要求理解）","s":[["The Galaxy consists of 100 billion stars.","银河系由1千亿颗恒星组成。"],["Worldwide sales reached 2.5 billion.","全球销售额达到了25亿。"],["The company posted a $1.1 billion loss.","这家公司公布了11亿元的亏损。"]]},{"l":"c.o.v/er","p":"ˈk.ʌ.v/ə","cn":"v. 盖；覆盖","s":[["Snow covered the ground.","大雪覆盖了大地。"],["Your boots are covered in mud.","你的靴子上都是泥。"],["Cover me while I move forward.","掩护我前进。"]]},{"l":"s.u/pp.or.t","p":"s.ə/ˈp.ɔː.t","cn":"v. 支持；维持","s":[["Support for the party continues to decline.","对该党的支持继续下降。"],["Lastly, I would like to thank my parents for all their support.","最后，我想感谢父母对我的全力支持。"],["Grouping is now supported.","现在是支持分组的。"]]},{"l":"a/r.e/a","p":"ˈeə/r.i/ə","cn":"n. 地区；地域","s":[["First of all we must identify the problem areas.","首先我们必须找出问题所在。"],["We rarely see someone go after the health area.","我们很少看到有人追求健康领域。"],["The area is largely uninhabited.","这个地区大部分是无人居住的。"]]},{"l":"f.r.ee.z/i.ng","p":"ˈf.r.iː.z/ɪ.ŋ","cn":"adj. 极冷的","s":[["It's absolutely freezing outside.","外面冷得不得了。"],["It's freezing cold outside.","外面极为寒冷。"],["It's 15 degrees below freezing.","温度是零下15度。"]]},{"l":"n.or.th","p":"n.ɔː.θ","cn":"n. 北；北方","s":[["The Yangtze river is a natural barrier to the north-east.","长江是东北方向的一道天然屏障。"],["I'll bet we could find some at North Creek—in the mine.","我打赌我们能在小溪北边的矿井里面找到一些。"],["It faced seawards to the north.","它面向北方，朝着海。"]]},{"l":"p.o.l.e","p":"p.əʊ.l.-","cn":"n. （行星的）极；地极","s":[["To them, as to all Poles, this is a holy place.","正如对所有的极地人一样，对他们来说，这里是个神圣的地方。"],["Like poles repel each other.","同极相斥。"],["Five members of Scott's expedition made it to the South Pole.","斯科特率领的探险队的五名成员一直来到了南极。"]]},{"l":"d.e.s/er.t","p":"ˈd.e.z/ə.t","cn":"n. 沙漠；荒漠","s":[["Mrs. Roding's husband deserted her years ago.","罗丁太太的丈夫数年前抛弃了她。"],["He deserted from his regiment.","他开小差逃离他所在的团。"],["The villages had been deserted.","这些村庄已经荒无人烟了。"]]},{"l":"m.e/t.re","p":"ˈm.iː/t.ə","cn":"n. 米","s":[["It's about 2 metres wide.","它大约2米宽。"],["It is almost 2 metres in height.","它差不多有2米高。"],["It is about a metre in length.","它大约有一米长。"]]},{"l":"r.ea.ch","p":"r.iː.tʃ","cn":"v. 足够达到","s":[["They reached port at last.","他们终于抵达港口。"],["Can you reach me down that box?","你帮我把那个盒子拿下来好吗？"],["Worldwide sales reached 2.5 billion.","全球销售额达到了25亿。"]]},{"l":"g.r.ai.n","p":"ɡ.r.eɪ.n","cn":"n. 谷粒（只要求理解）","s":[["Surplus grain is being sold for export.","过剩的谷物正销往国外。"],["Any shortage could push up grain prices.","任何短缺都会推动粮价上涨。"],["The soup was a mash of grain and vegetables.","那是用粮食和蔬菜做成的浓汤。"]]},{"l":"w.i.d.e","p":"w.aɪ.d.-","cn":"adj. 宽的；宽阔的","s":[["It's about 2 metres wide.","它大约2米宽。"],["The road is only one lane wide.","这条路只有一个车道那么宽。"],["That comparison isn't as wide of the mark as it seems.","那种比较不像看上去那么离谱。"]]},{"l":"wh.a.l.e","p":"w.eɪ.l.-","cn":"n. 鲸","s":[["A whale is a fish. True or false?","鲸鱼是鱼，对还是错？"],["The whale is a mammal.","鲸鱼是哺乳动物。"],["A whale is a kind of mammal.","鲸是一种哺乳动物。"]]},{"l":"b.u.t/t.er/f.l.y","p":"ˈb.ʌ.t/-.ə/f.l.aɪ","cn":"n. 蝴蝶","s":[["The butterfly fluttered from flower to flower.","蝴蝶在花丛中飞来飞去。"],["It is a very pretty butterfly, with a 2 inch wing span.","它是一只非常漂亮的蝴蝶，翅膀张开有2英寸宽。"],["The caterpillar will eventually metamorphose into a butterfly.","毛毛虫最终将蜕变成一只蝴蝶。"]]},{"l":"p.r.o/v.i.d.e","p":"p.r.ə/ˈv.aɪ.d.-","cn":"v. 提供；供应","s":[["They would not provide any details.","他们不肯提供任何细节。"],["Can you provide any proof of identity ?","你能提供什么身份证明吗？"],["The company will provide transportation.","这家公司将提供交通工具。"]]},{"l":"e.x/p.l.ore","p":"ɪ.ks/ˈp.l.ɔː","cn":"v. 探索","s":[["I just wanted to explore on my own.","我只是想独自考察一下。"],["We will explore every avenue until we find an answer.","我们要探索一切途径，直到找到答案为止。"],["She explored the sand with her toes.","她用脚趾感觉沙的情况。"]]},{"l":"d.i.s/a/pp.ear","p":"ˌd.ɪ.s/ə/ˈp.ɪə","cn":"v. 消失；不见","s":[["The sun disappeared from view.","太阳看不见了。"],["The boat disappeared from sight.","那艘船从视野中消失了。"],["The plane disappeared behind a cloud.","飞机消失在云层里。"]]},{"l":"p.l.a.s/t.i.c","p":"ˈp.l.æ.s/t.ɪ.k","cn":"n. 塑料","s":[["Do they take plastic?","他们收信用卡吗？"],["We can recycle plastic bottles.","我们可以回收塑胶瓶。"],["The pipes should be made of plastic.","这些管子应该是用塑料制作的。"]]},{"l":"p.o/ll.u/tion","p":"p.ə/ˈl.uː/ʃən","cn":"n. 污染","s":[["Pollution can harm marine life.","污染会危及海洋生物。"],["We need more laws to stop pollution.","我们需要制定更多法律来防止污染。"],["We are taking steps to prevent pollution.","我们正在采取措施防止污染。"]]},{"l":"p.r.o/t.e.c.t","p":"p.r.ə/ˈt.e.k.t","cn":"v. 保护","s":[["Concern to protect national sovereignty is far from new.","对捍卫国家主权的关注绝不是新话题。"],["The device was protected by patent.","这一装置受专利保护。"],["Women banded together to protect each other.","妇女们联合起来互相保护。"]]},{"l":"ch.e.m/i/c.a.l","p":"ˈk.e.m/ɪ/k.ə.l","cn":"n. 化学制品；化学品（只要求理解）","s":[["Chemical weapons are banned internationally.","国际上禁止使用化学武器。"],["What's the chemical symbol for mercury?","水银的化学符号是什么？"],["What is the chemical symbol for copper?","铜的化学符号是什么？"]]},{"l":"g.r.ou.n.d/w.a/t.er","p":"ˈɡ.r.aʊ.n.d/w.ɔː/t.ə","cn":"n. 地下水","s":[]},{"l":"b.ur.n","p":"b.ɜː.n","cn":"v. 燃烧；烧","s":[["His face burned with shame.","他的脸因羞愧而发烫。"],["The candle had burned right down.","这支蜡烛已全烧完了。"],["Turn the heat down or it'll burn.","把炉火开小一些，不然就烧焦了。"]]},{"l":"oi.l","p":"ɔɪ.l","cn":"n. 石油；原油","s":[["Oil increased in price.","石油价格上涨了。"],["The price of oil increased.","石油价格上涨了。"],["Palm oil is environment-friendly.","棕榈油对环境无害。"]]},{"l":"g.a.s","p":"ɡ.æ.s","cn":"n. 天然气","s":[["Air is a mixture of gases.","空气为混合气体。"],["The device draws gas along the pipe.","这装置将气体顺着管子抽出来。"],["The house has gas-fired central heating.","这所房子有燃气中央供暖系统。"]]},{"l":"h.ar.m/f.u.l","p":"ˈh.ɑː.m/f.ə.l","cn":"adj. 有害的","s":[["The natural enzyme is harmful to humans and animals.","天然酶对人和动物都是有害的。"],["Tears help to protect the eye from potentially harmful foreign bodies.","眼泪有助于保护眼睛去除可能有害的异物。"],["Continuous exposure to sound above 80 decibels could be harmful.","持续曝露于超过80分贝的声音可能有害。"]]},{"l":"w.e.b/s.i.t.e","p":"ˈw.e.b/s.aɪ.t.-","cn":"n. 网站","s":[["I found this information on their website.","我在他们的网站上发现了这一信息。"],["Check out the new website. It's the bomb!","看一看这新网站。简直是太棒了！"],["How can we attract more visitors to our website?","我们如何才能吸引更多人访问我们的网站呢？"]]},{"l":"ow.n","p":"əʊ.n","cn":"adj. 自己的；本人的","s":[["She makes her own clothes.","她自己做衣服。"],["She made her own bread.","她自己做了面包。"],["They enjoy making their own decisions.","他们喜欢做他们自己的决定。"]]},{"l":"h.ow/e.v/er","p":"h.aʊ/ˈe.v/ə","cn":"adv. 然而；不过","s":[["We, however, have the mind of Christ.","然而，我们有基督的心。"],["Many problems, however, escape detection.","然而许多问题却未被察觉。"],["However, some birds thrive in noisy environments.","然而，有些鸟会在嘈杂的环境中茁壮成长。"]]},{"l":"e.m/p.e/r.or","p":"ˈe.m/p.ə/r.ə","cn":"n. 皇帝","s":[["He proclaimed himself emperor.","他自封为皇帝。"],["The Emperor kept himself aloof from the people.","这个皇帝对人民漠不关心。"],["The president paid a courtesy call on Emperor Akihito.","总统礼节性地拜访了明仁天皇。"]]},{"l":"h.u.n.t","p":"h.ʌ.n.t","cn":"v. 打猎","s":[["Lions sometimes hunt alone.","狮子有时单独猎食。"],["Police are hunting his killer.","警方正在追捕杀害他的凶手。"],["This is Hunt's ninth book.","本书是亨特的第九本著作。"]]},{"l":"w.ar","p":"w.ɔː","cn":"n. 战争","s":[["The country is now at war.","这个国家正在打仗。"],["We cannot take sides in a civil war.","内战中，我们不能支持任何一方。"],["My Grandma lost her brother in the war.","我的祖母在战争中失去了弟弟。"]]},{"l":"s.a.n.d/s.t.or.m","p":"ˈs.æ.n.d/s.t.ɔː.m","cn":"n. 沙暴","s":[]},{"l":"s.o/l.u/tion","p":"s.ə/ˈl.uː/ʃən","cn":"n. 解决办法","s":[["Do you have a better solution?","你有更好的解决办法吗？"],["A solution is still some way off.","解决办法尚需时日。"],["We need to set about finding a solution.","我们得着手寻找一个解决办法。"]]},{"l":"b.l.ow","p":"b.l.əʊ","cn":"v. 刮；吹","s":[["The blow chipped the woman's tooth.","这一击把那个女人的牙齿打掉了一小块。"],["I made a wish and blow out the candles.","我许了愿，吹了蜡烛。"],["Let's blow this joint.","咱们马上离开这家酒吧。"]]},{"l":"g.e.n/e/r.a/tion","p":"ˌdʒ.e.n/ə/ˈr.eɪ/ʃən","cn":"n. （统称）一代人","s":[["He is arguably the best actor of his generation.","按理他是他那一代中最优秀的演员。"],["She was one of the greatest minds of her generation.","她是她那一代人中最聪慧的人之一。"],["The play represents the collision of three generations.","该剧表现了3代人之间的冲突。"]]},{"l":"s.o/l.ar s.y.s/t.e.m","p":"ˈs.əʊ/l.ə ˈs.ɪ.s/t.ə.m","cn":"太阳系","s":[["The picture shows six of the nine planets in the solar system.","这张图片展示太阳系9个行星中的6个行星。"],["Saturn is the second biggest planet in the solar system.","土星是太阳系的第二大的行星。"],["The spacecraft will enable scientists to study some dark corners of the solar system.","太空船使得科学家可以研究太阳系中一些不为人知的角落。"]]},{"l":"f.a.c.t f.i.l.e","p":"f.æ.k.t f.aɪ.l.-","cn":"事实档案","s":[]},{"l":"b.e c.o.v/er.e.d b.y","p":"b.i ˈk.ʌ.v/ə.-.d b.aɪ","cn":"被……覆盖","s":[]},{"l":"a.s f.ar a.s w.e k.n.ow","p":"æ.z f.ɑː æ.z w.iː -.n.əʊ","cn":"据我们所知","s":[]},{"l":"s.ea l.e.v/e.l","p":"s.iː ˈl.e.v/ə.l","cn":"海平面","s":[["The whole place is at sea level.","整个地区与海平面持平。"]]},{"l":"wh.a.t.'s m.ore","p":"w.ɒ.t.s m.ɔː","cn":"更重要的是","s":[]},{"l":"p.r.o/v.i.d.e w.i.th","p":"p.r.ə/ˈv.aɪ.d.- w.ɪ.ð","cn":"提供；供应；给予","s":[]},{"l":"t.a.k.e c.are o.f","p":"t.eɪ.k.- k.eə ə.v","cn":"照顾；照料","s":[["See that you take care of him.","你一定要好好照顾他。"],["We need to take care of our bodies.","我们需要照顾好自己的身体。"],["He's old enough to take care of himself.","他已经不小了，能照顾自己了。"]]},{"l":"p.l.a.s/t.i.c p.o/ll.u/tion","p":"ˈp.l.æ.s/t.ɪ.k p.ə/ˈl.uː/ʃən","cn":"塑料污染","s":[]},{"l":"c.u.t d.ow.n","p":"k.ʌ.t d.aʊ.n","cn":"砍倒","s":[["You need to cut down on starches.","你有必要少吃些含淀粉的东西。"],["We're trying to cut down on the amount of paperwork involved.","我们正在努力降低有关此事的文书工作量。"],["The remaining section of woodland is cut down to ground level.","林地的剩余部分被砍光了。"]]},{"l":"h.u.n/d.r.e.d.s o.f","p":"ˈh.ʌ.n/d.r.ə.d.z ə.v","cn":"数以百计","s":[["There are hundreds of people desperate to adopt a child.","有数以百计的人极其渴望收养小孩。"],["Hundreds of people packed into the mosque.","成百上千的人挤进了清真寺。"],["Hundreds of tractors will converge on the capital.","成百上千的拖拉机将向首都聚集。"]]},{"l":"b.l.ow a/w.ay","p":"b.l.əʊ ə/ˈw.eɪ","cn":"吹走","s":[["California could dry up and blow away.","加利福尼亚会干涸掉，然后随风而去。"]]}]},{"name":"Unit 5 Off to space","words":[{"l":"s.p.a.c.e/s.ui.t","p":"ˈs.p.eɪ.s.-/s.uː.t","cn":"n. 航天服；宇航服","s":[]},{"l":"c.o/ll.e.c.t","p":"k.ə/ˈl.e.k.t","cn":"v. 收集；采集","s":[["Are you collecting for charity?","你是在为慈善募捐吗？"],["He collects modern sculpture.","他收藏现代雕塑。"],["I used to collect stamps.","我过去曾经集邮。"]]},{"l":"l.ea.v.e","p":"l.iː.v.-","cn":"v. 离开","s":[["We'll leave after lunch.","我们将在午饭后动身。"],["The giraffe eats leaves.","长颈鹿吃树叶。"],["Leaves change colour in autumn.","树叶在秋天改变颜色。"]]},{"l":"k.i/l.o/m.e/t.re","p":"k.ɪ/ˈl.ɒ/m.ɪ/t.ə","cn":"n. 千米；公里","s":[["In a minute a cheetah can run about 1 kilometre and a half.","在一分钟内，猎豹可以跑大约1公里半。"],["The town lies a few kilometres inland.","这个城市位于内陆几公里处。"]]},{"l":"w.ea.k","p":"w.iː.k","cn":"adj. 虚弱的；无力的","s":[["Geography was my weak subject.","地理课是我的弱项。"],["She was too weak to stand.","她虚弱得站都站不住。"],["We are here to protect and assist the weak and infirm.","我们来这里保护和帮助病弱者。"]]},{"l":"t.ie","p":"t.aɪ","cn":"v. （用线、绳等）拴","s":[["He tied a scarf around his neck.","他脖子上围着围巾。"],["She tied her scarf over her head.","她把围巾围在头上。"],["They tied him to a chair with cable.","他们用电缆把他绑在一把椅子上。"]]},{"l":"l.ow","p":"l.əʊ","cn":"adj. 低于通常（或平均）数量（或水平、价值）的","s":[["I'm feeling really low.","我现在很消沉。"],["He hit his head on the low ceiling.","他的头碰了低矮的天花板。"],["The euro hit a record low in trading today.","今天欧元的兑换价降到了历史最低水平。"]]},{"l":"w.eigh","p":"w.eɪ","cn":"v. 有……重；重","s":[["Weigh this in your hand.","掂掂这有多重。"],["How many pounds do you weigh?","你体重多少磅？"],["He is weighed down with guilt.","他由于内疚而心神不定。"]]},{"l":"b.r.ea.th.e","p":"b.r.iː.ð.-","cn":"v. 呼吸","s":[["She breathed in deeply.","她深深地吸了气。"],["He breathed deeply before speaking again.","他深深吸一口气，然后继续说下去。"],["Breathe out. We're getting plenty of oxygen.","吸进，呼出，我们得到很多的氧气。"]]},{"l":"f.a/c.i.l/i/t.y","p":"f.ə/ˈs.ɪ.l/ə/t.i","cn":"n. 设施；设备","s":[["She has a facility for languages.","她有语言天赋。"],["There may be a cost to such facility.","这种的设备可能会产生成本。"],["It describes completely the facility and its safety basis.","它完整地描述了设备和它的安全基础。"]]},{"l":"a.d/v.e.n/ture","p":"ə.d/ˈv.e.n/tʃə","cn":"n. 冒险；冒险经历；奇遇","s":[["He set off in quest of adventure.","他出行探险去了。"],["Few can resist the lure of adventure.","很少有人能抵御历险的诱惑力。"],["Age hadn't blunted his passion for adventure.","岁月没有冲淡他的冒险激情。"]]},{"l":"p.a.ss","p":"p.ɑː.s","cn":"v. 沿某方向前进；向某方向移动","s":[["He's determined to pass this time.","这一回他决心要考及格。"],["He largely passed over the government's record.","他对政府的相关记录基本上是避而不谈。"],["Memorize a poem and pass it on.","记住一首诗并把它传下去。"]]},{"l":"e.x/p.e.r/i/m.e.n.t","p":"ɪ.ks/ˈp.e.r/ɪ/m.ə.n.t","cn":"n. 实验；试验","s":[["I decided to conduct an experiment.","我决定做一项实验。"],["He has done experiments complementary to those of Eigen.","他已经做了与艾根的实验互补的实验。"],["The experiment went horribly wrong.","实验弄得一塌糊涂。"]]},{"l":"p.r.e/p.are","p":"p.r.ɪ/ˈp.eə","cn":"v. 使做好准备；把……预备好","s":[["I had no time to prepare.","我当时没时间准备。"],["We'll be better prepared next time.","下次我们会准备得更充分。"],["I'll prepare a revised estimate for you.","我将为你准备一份经过修正的评估报告。"]]},{"l":"d.r.ea.m","p":"d.r.iː.m","cn":"n. 梦想；理想；v. 做梦；梦见","s":[["Do you dream in colour ?","你的梦是彩色的吗？"],["Scientists' dream has come true.","科学家的梦想实现了。"],["He had a dream about Claire.","他做了一个关于克莱尔的梦。"]]},{"l":"ch.ance","p":"tʃ.ɑːns","cn":"n. 机会；机遇","s":[["Chess is not a game of chance.","国际象棋不是靠运气取胜的。"],["Everyone gets a chance to make up tests.","每个人都有一次补考的机会。"],["Everyone has a chance to win.","每个人都有机会赢。"]]},{"l":"s.e.n.d","p":"s.e.n.d","cn":"v. 邮寄；发送","s":[["I'll send you a text message.","我会给你发一条短信。"],["I'd like to send this express, please.","劳驾，我要寄快递。"],["She parcelled up the books to send.","她把要寄走的书包了起来。"]]},{"l":"i.n/t.r.o/d.u.c.tion","p":"ˌɪ.n/t.r.ə/ˈd.ʌ.k.ʃn","cn":"n. 序言；引言","s":[["Introduction History of Photography (Encyclopaedia Britannica).","《摄影史介绍》(大英百科全书)。"],["The book is a friendly, down-to-earth introduction to physics.","这是一本简明、实用的物理学入门书。"],["It's a useful introduction to an extremely complex subject.","这是对一门极为复杂的学科的有益入门教程。"]]},{"l":"v.i.ew","p":"v.-.juː","cn":"n. 景色；风景","s":[["Such a view is pleasing.","这样一种风景令人愉快。"],["The sun disappeared from view.","太阳看不见了。"],["His views tend towards the extreme.","他的观点趋于偏激。"]]},{"l":"s.o.m.e/d.ay","p":"ˈs.ʌ.m.-/d.eɪ","cn":"adv. 总有一天；有朝一日","s":[["So you fancy yourself as the boss someday?","那么你认为自己有一天会成老板？"],["Someday I'll be a pilot.","将来有一天我将成为一名飞行员。"]]},{"l":"e.x/p.e/r.i/ence","p":"ɪ.ks/ˈp.ɪə/r.i/əns","cn":"n. 经历；阅历","s":[["Experience is essential for this job.","对于这个工作，经验是非常重要的。"],["She's very young and not very experienced.","她很年轻，还不太老练。"],["He's very experienced in looking after animals.","他养动物很有经验。"]]},{"l":"l.a.n.d/er","p":"ˈl.æ.n.d/ə","cn":"n. 着陆器","s":[]},{"l":"i.s/l.a.n.d","p":"ˈaɪ.-/l.ə.n.d","cn":"n. 岛","s":[["We rowed around the island.","我们绕着岛划船。"],["The island is hot and humid in the summer.","这个岛在夏季又热又潮湿。"],["The islands belong to Spain.","这些岛屿隶属西班牙。"]]},{"l":"a.n/ci.e.n.t","p":"ˈeɪ.n/ʃ.ə.n.t","cn":"adj. 古老的；很老的","s":[["The town is notable for its ancient harbour.","这座小镇因其古老的港口而出名。"],["The Olympic Games began in Olympia, in ancient Greece.","奥林匹克运动会起源于古希腊的奥林匹亚。"],["The aisle was floored with ancient bricks.","过道由古旧的砖块铺就。"]]},{"l":"p.o/e.m","p":"ˈp.əʊ/ɪ.m","cn":"n. 诗","s":[["The poem uses simple language.","这首诗用语简单。"],["The poem contrasts youth and age.","这首诗对比了青春与老年。"],["Memorize a poem and pass it on.","记住一首诗并把它传下去。"]]},{"l":"e.x/p.r.e.ss","p":"ɪ.ks/ˈp.r.e.s","cn":"v. 表示；表达；表露","s":[["They expressed themselves delighted.","他们表示他们很高兴。"],["Teenagers often have difficulty expressing themselves.","十来岁的孩子在表达思想方面常常有困难。"],["The figure is expressed as a percentage.","数字是用百分率表示的。"]]},{"l":"d.e/t.er/m.i/n.a/tion","p":"d.ɪ/ˌt.ɜː/m.ɪ/ˈn.eɪ/ʃən","cn":"n. 决心；坚毅；坚定","s":[["He showed great courage and determination.","他表现得十分勇敢和果断。"],["Her determination never wavered.","她的决心从未动摇过。"],["He has a ruthless determination to succeed.","他有不获成功决不罢休的坚定决心。"]]},{"l":"u/n.i/v.er.s.e","p":"ˈjuː/n.ɪ/v.ɜː.s.-","cn":"n. 宇宙","s":[["The universe is slowly yielding up its secrets.","宇宙慢慢地展现出它的秘密。"],["The clear inference is that the universe is expanding.","显然结论是宇宙在扩大。"],["The idea of a parallel universe is hard to grasp.","认为另有一个平行宇宙的概念是很难理解的。"]]},{"l":"a.l/r.ea.d/y","p":"ɔː.l/ˈr.e.d/i","cn":"adv. 已经；早已","s":[["Already, she is thinking ahead.","她早就在考虑未来了。"],["It's gone six o'clock already.","过了六点了。"],["A crowd already filled the gallery.","一群人已经挤满了廊台。"]]},{"l":"c.e.n/tu/r.y","p":"ˈs.e.n/tʃə/r.i","cn":"n. 世纪","s":[["The name has come down from the last century.","这名称是从上个世纪流传下来的。"],["Some have called him the greatest entertainer of the twentieth century.","有人称他为20世纪最伟大的表演艺术家。"],["She looked like a princess in a nineteenth-century illustration.","她看上去像19世纪插图里的公主。"]]},{"l":"n.eigh/b.our","p":"ˈn.eɪ/b.ə","cn":"n. 邻居","s":[["Britain's nearest neighbour is France.","英国最近的邻国是法国。"],["This neighbour crewed on a ferryboat.","这位邻居在一艘渡船上当船员。"],["They don't mix much with the neighbours.","他们不怎么与邻居交往。"]]},{"l":"c.ir/c.le","p":"ˈs.ɜː/k.l","cn":"v. 环行","s":[["He has a small circle of friends.","他有一个小小的朋友圈子。"],["It's a circle, a loop.","它是一个圆，一个循环。"],["She walked clockwise around the circle.","她绕着圈顺时针走。"]]},{"l":"s.ur/f.a.c.e","p":"ˈs.ɜː/f.ɪ.s.-","cn":"n. 表面；表层；面","s":[["70% of our globe's surface is water.","我们地球表面的70%是水。"],["He needs money to electrify his surface lines.","他需要钱把他的地面铁路电气化。"],["Make sure the paint covers the surface evenly.","要确保油漆均匀地涂在表面上。"]]},{"l":"r.e/l.ea.s.e","p":"r.ɪ/ˈl.iː.s.-","cn":"v. 放开；松开；使自由移动（或飞翔、降落等）（只要求理解）","s":[["He refused to release her arm.","他不肯放开她的胳膊。"],["He has been released from jail.","他已从监狱里放出来了。"],["Becoming your own person releases your creativity.","保持你自己的本色可以释放出你的创造力。"]]},{"l":"k.i.l/o/g.r.a.m","p":"ˈk.ɪ.l/ə/ɡ.r.æ.m","cn":"n. 千克；公斤","s":[["Flour is sold by the kilogram.","面粉按公斤出售。"],["We bought a kilogram of lemons from the supermarket.","我们从超市买了一公斤的柠檬。"],["We will take a chunk of some material and we will call it a kilogram.","我们取一大块物质，称它为一千克。"]]},{"l":"p.r.o/g.r.a.mm.e","p":"ˈp.r.əʊ/ɡ.r.æ.m.-","cn":"n. 计划；方案","s":[["I thoroughly enjoy your programme.","我非常喜欢你们的节目。"],["The programme's on Channel 4.","这个节目在4频道。"],["The programme was broadcast nationally.","这个节目曾在全国播放过。"]]},{"l":"s.p.a.c.e s.t.a/tion","p":"s.p.eɪ.s.- ˈs.t.eɪ/ʃən","cn":"空间站","s":[]},{"l":"d.o e.x/er/c.i.s.e","p":"d.uː ˈe.ks/ə/s.aɪ.z.-","cn":"锻炼；运动","s":[]},{"l":"t.a.k.e ph.o/t.o.s","p":"t.eɪ.k.- ˈf.əʊ/t.əʊ.z","cn":"拍照","s":[]},{"l":"g.e.t i.n/t.o or/b.i.t","p":"ɡ.e.t ˈɪ.n/t.uː ˈɔː/b.ɪ.t","cn":"进入轨道","s":[]},{"l":"th.ou/s.a.n.d.s o.f","p":"ˈθ.aʊ/z.-.n.d.z ə.v","cn":"数以千计；成千上万","s":[["Thousands of bank employees are facing redundancy as their employers cut costs.","数千名银行职员面临裁员，因为他们的雇主要削减成本。"],["The last offensive drove thousands of people into Thailand.","最近的一次进攻把成千上万的人驱赶到了泰国。"],["Thousands of people paid good money to watch the band perform.","成千上万的人花很多钱去观看这支乐队的演出。"]]}]},{"name":"Unit 6 Travelling around Asia","words":[{"l":"gu.i.d.e","p":"ɡ.aɪ.d.-","cn":"n. 指南；手册","s":[["I let my feelings be my guide.","我是跟着感觉走。"],["The guide flashed a light into the cave.","导游用手电筒照射洞穴。"],["Gym owner David Barton will guide them through a workout.","健身房主人戴维•巴顿将指导他们完成锻炼。"]]},{"l":"ea.s.t","p":"iː.s.t","cn":"n. 东；东方；adv. 朝东","s":[["They live on the east coast.","他们住在东海岸。"],["The Yangtze river is a natural barrier to the north-east.","长江是东北方向的一道天然屏障。"],["Finzer is not just any East Coast businessman.","芬泽并非一般的东海岸商人。"]]},{"l":"w.e.s.t","p":"w.e.s.t","cn":"n. 西；西方；adv. 朝西","s":[["This room faces west.","这个房间朝西。"],["The West is stingy with aid.","西方在援助上很吝啬。"],["He had arrived from Key West by jet.","他已乘喷气式飞机从基韦斯特来了。"]]},{"l":"m.i.x","p":"m.ɪ.ks","cn":"n. 混合；结合","s":[["They don't mix much with the neighbours.","他们不怎么与邻居交往。"],["I like to mix up designer clothes.","我喜欢把各种名牌服装混穿在一起。"],["Mix the batter and let it stand for twenty minutes.","搅好面糊以后，放上二十分钟。"]]},{"l":"w.e.s/t.er.n","p":"ˈw.e.s/t.ə.n","cn":"adj. 西方的；西方国家的","s":[["The single-engine plane landed in western Arizona.","单引擎飞机在亚利桑那州西部降落。"],["They have clearly embraced Western consumerism.","很明显他们已经接受了西方的消费主义观念。"],["The Bow Brook forms the western boundary of the wood.","鲍溪成了树林的西边界。"]]},{"l":"s.t.y.l.e","p":"s.t.aɪ.l.-","cn":"n. 风格","s":[["She does everything with style and grace.","她凡事都做得优雅得体。"],["Her style of dress was never conservative.","她的服装式样一点儿也不保守。"],["Her style is pared-down and simple.","她的风格简洁明了。"]]},{"l":"p.o.p/u/l.ar","p":"ˈp.ɒ.p/jə/l.ə","cn":"adj. 大众喜爱的；广受欢迎的","s":[["Gardening is very popular in Maryland.","园艺在马里兰州很受欢迎。"],["Exercises of this kind are very popular.","这种体育活动非常流行。"],["The restaurant is deservedly popular.","这餐馆为大众喜爱是理所当然的。"]]},{"l":"s.i.t.e","p":"s.aɪ.t.-","cn":"n. （建筑物、城镇等的）地点","s":[["Do you want to bookmark this site?","你想给这个站点做书签吗？"],["There is ample car parking off site.","外面有个很大的停车场。"],["The site is reached by a 30-minute hike through dense forest.","要花30分钟徒步穿过密林才能到达那个地方。"]]},{"l":"a/c.r.o.ss","p":"ə/ˈk.r.ɒ.s","cn":"prep. 在……对面；在……对过","s":[["Looking across from here.","从这里看过去。"],["It's too tight across the back.","背部太紧。"],["They parked across from the Castro Theatre.","他们在卡斯特罗剧院对面停了车。"]]},{"l":"a.d/u.l.t","p":"ˈæ.d/ʌ.l.t","cn":"n. 成年人","s":[["Each ticket admits one adult.","每张票只准许一位成人入场。"],["The admission price is $8 for adults.","入场费成人是$8。"],["Children must be accompanied by an adult.","儿童必须要有大人陪同。"]]},{"l":"s.e/n.i/or","p":"ˈs.iː/n.i/ə","cn":"n. 老年人；长者","s":[["The heroine is a senior TV executive.","女主人公是一位电视台高级主管。"],["Junior nurses usually work alongside more senior nurses.","初级护士通常和较高级的护士一起工作。"],["The President met with senior White House aides.","总统会见了白宫的高级助手。"]]},{"l":"c.u.s/t.o.m/er","p":"ˈk.ʌ.s/t.ə.m/ə","cn":"n. 顾客；主顾；客户","s":[["The customer called to cancel.","顾客打电话来取消了。"],["Customer: Excuseme, can I use my credit card?","顾客：请问可以刷卡消费吗？"],["The firm has excellent customer relations.","此公司与客户关系极好。"]]},{"l":"d.e/s.i.g.n","p":"d.ɪ/ˈz.aɪ.-.n","cn":"n. 设计","s":[["What is Instructional Design?","指导性设计是什么？"],["She's good at art and design.","她擅长美术和设计。"],["Although small, the kitchen is well designed.","厨房虽小，但设计巧妙。"]]},{"l":"e.l.s.e","p":"e.l.s.-","cn":"adv. 其他的；别的","s":[["Hurry up or else you'll be late.","快点，否则你就要迟到了。"],["Everyone else was there.","其他所有人都在那儿。"],["They're forever bitching about everybody else.","他们总是在埋怨其他的每个人。"]]},{"l":"s.u.g/g.e.s/tion","p":"s.ə.-/ˈdʒ.e.s/tʃən","cn":"n. 建议；提议","s":[["It's just a suggestion.","这只是一个建议。"],["This suggestion dumbfounded Joe.","这个建议使乔伊惊呆了。"],["I'd welcome any suggestions.","任何建议我都会愉快地接受。"]]},{"l":"t.i.p","p":"t.ɪ.p","cn":"n. 指点；实用的提示","s":[["Flat screen TV's easily tip over and can injure a child.","平板电视很容易发生翻转伤及儿童。"],["The tail tapered to a rounded tip.","尾部越来越细，最后成了个圆尖。"],["Did you give the waiter a tip?","你给服务员小费了吗？"]]},{"l":"h.i/s.t.o.r/i.c","p":"h.ɪ/ˈs.t.ɒ.r/ɪ.k","cn":"adj. 历史上著名（或重要）的；可名垂青史的（只要求理解）","s":[["We should take more care of our historic buildings.","我们应该更加爱护有历史意义的建筑。"],["There are efforts under way to designate the bridge a historic landmark.","在努力把这座桥定为历史地标。"],["The amount of litter in the streets is unbefitting for a historic city.","街道上垃圾之多与历史名城不协调。"]]},{"l":"l.i.s.t","p":"l.ɪ.s.t","cn":"n. 名单；目录","s":[["I am already on your mailing list.","我已经列在你的邮寄名单上了。"],["They will not be on the 5A scenic spot list.","它们不会出现在 5A 级风景区的名单上。"],["Keep a running list, and cross out the ones you have read.","持续更新列表，把你读过的划掉。"]]},{"l":"l.a.n.d/s.c.a.p.e","p":"ˈl.æ.n.d/s.k.eɪ.p.-","cn":"n. 风景；景色","s":[["This landscape seemed to trap and amplify sounds.","这种地形好像能聚拢和扩大声音。"],["Small coastal towns dot the landscape.","海滨小镇到处都是。"],["The landscape had a stark, unworldly beauty.","那景色有一种简朴、超凡的美。"]]},{"l":"m.e.m/o/r.y","p":"ˈm.e.m/ə/r.i","cn":"n. 回忆；记忆","s":[["Repetition helps improve our memory.","重复有助于提高我们的记忆力。"],["Memory is constitutive of identity.","记忆是身份的一个重要构成部分。"],["How much memory does the program occupy?","这个程序占用多少内存？"]]},{"l":"g.e.n/e/r.a.l","p":"ˈdʒ.e.n/ə/r.ə.l","cn":"n. 将军","s":[["She runs a general practice in Hull.","她在赫尔开了个全科诊所。"],["My father venerated General Eisenhower.","我父亲十分敬仰艾森豪威尔将军。"],["The General refused to be flustered.","将军没有被搅得慌乱不安。"]]},{"l":"s.igh.t","p":"s.aɪ.t","cn":"n. 看见","s":[["She has very good sight.","她的视力很好。"],["The boat disappeared from sight.","那艘船从视野中消失了。"],["Her sight is beginning to go.","她的视力开始下降。"]]},{"l":"n.a/tu/r.a.l","p":"ˈn.æ/tʃə/r.ə.l","cn":"adj. 自然的；天然的","s":[["She is a natural athlete.","她是个天生的运动健将。"],["Water is a fish's natural element.","水是鱼的天然生活环境。"],["The Yangtze river is a natural barrier to the north-east.","长江是东北方向的一道天然屏障。"]]},{"l":"a.l/m.o.s.t","p":"ˈɔː.l/m.əʊ.s.t","cn":"adv. 几乎；差不多","s":[["She answered almost immediately.","她几乎立刻就回答了。"],["They'll eat almost anything.","他们几乎什么都吃。"],["The story is almost certainly false.","这个故事几乎肯定是虚构的。"]]},{"l":"b.e/c.o.m.e","p":"b.ɪ/ˈk.ʌ.m.-","cn":"v. 开始变得；变成","s":[["Look how lazy we've become.","瞧我们变得有多懒。"],["Short hair really becomes you.","你理短发的确很帅。"],["We need to become critical text-readers.","我们需要成为批判性的文本阅读者。"]]},{"l":"g.a.t.e/w.ay","p":"ˈɡ.eɪ.t.-/w.eɪ","cn":"n. （通往其他地区的）门户","s":[["The network has a gateway into the hospital mainframe.","该网络有一个网关连接医院主机。"]]},{"l":"i.n/f.l.u/ence","p":"ˈɪ.n/f.l.u/əns","cn":"v. 影响；对……起作用","s":[["He's never had any influence over her.","他对她从没有过任何影响。"],["Don't let me influence you either way.","何去何从都别受我的影响。"],["Many external influences can affect your state of mind.","许多外在因素都可能影响人的心情。"]]},{"l":"ar.t/w.or.k","p":"ˈɑː.t/w.ɜː.k","cn":"n. 艺术作品","s":[["The artwork for the poster was done by my sister.","该海报的图片是我妹妹制作的。"],["This is evident in the artwork from the period.","这在那个时期的艺术作品中很明显。"]]},{"l":"p.ai.n.t/i.ng","p":"ˈp.eɪ.n.t/ɪ.ŋ","cn":"n. 绘画","s":[["Painting can be very therapeutic.","绘画可以使人很放松。"],["Painting is best done in daylight.","作画的最佳时间是白天。"],["Critics say his paintings are worthless.","批评家说他的画毫无价值。"]]},{"l":"s.c.e.n.e","p":"s.-.iː.n.-","cn":"n. 场面；情景","s":[["The hero dies in Act 5, Scene 3.","男主角在第五幕第三场死去。"],["Can we run through Scene 3 again, please?","请大家再来排练一下第3场好吗？"],["It's a scene of complete devastation.","那是一幅满目疮痍的景象。"]]},{"l":"w.i.f.e","p":"w.aɪ.f.-","cn":"n. 妻子","s":[["My wife's a keen gardener.","我的妻子是个热衷园艺的人。"],["Can I introduce my wife?","我来介绍一下我的妻子。"],["His wife has a strong personality.","他妻子的个性很强。"]]},{"l":"s.t.o.n.e","p":"s.t.əʊ.n.-","cn":"n. 石头；石料","s":[["The stone rolled down the hill.","石头滚下山坡。"],["He removed a stone from his shoe.","他清除了鞋中的一粒石子。"],["He had kidney stones.","他有肾结石。"]]},{"l":"r.e/f.l.e.c/tion","p":"r.ɪ/ˈf.l.e.k/ʃən","cn":"n. 映像；映照出的影像","s":[["After days of reflection she decided to write back.","经过几天的认真思考，她决定回信。"],["Your clothes are often a reflection of your personality.","穿着常常反映出一个人的个性。"],["He admired his reflection in the mirror.","他欣赏着自己在镜中的影像。"]]},{"l":"t.ou/r.i.s.t s.p.o.t","p":"ˈt.ʊə/r.ɪ.s.t s.p.ɒ.t","cn":"旅游景点","s":[]},{"l":"l.igh.t u.p","p":"l.aɪ.t ʌ.p","cn":"点亮；照亮","s":[["Light up the stove and you could burn down the house.","点燃炉子，你可能会把房子烧掉。"]]},{"l":"i.n th.e c.e.n/t.re o.f","p":"ɪ.n ð.ə ˈs.e.n/t.ə ə.v","cn":"在……的中心","s":[["Mars was visible, dead in the centre of the telescope.","火星清晰可辨，正好就在望远镜的中心。"]]},{"l":"b.e i.n/t.e.r.e.s/t.e.d i.n","p":"b.i ˈɪ.n/t.-.r.ə.s/t.ɪ.d ɪ.n","cn":"对……有兴趣","s":[["Now she's a teenager, she's starting to be interested in boys.","她现在已经是个十几岁的姑娘了，开始对男孩子感兴趣。"],["He only seems to be interested in personal gain.","他似乎只在乎个人的收益。"],["Be interested in others and they are sure to be interested in you.","对别人感兴趣，别人肯定也会对你感兴趣。"]]},{"l":"h.i/s.t.o.r/i.c s.i.t.e","p":"h.ɪ/ˈs.t.ɒ.r/ɪ.k s.aɪ.t.-","cn":"古迹；历史遗迹","s":[]},{"l":"i.n m.e.m/o/r.y o.f","p":"ɪ.n ˈm.e.m/ə/r.i ə.v","cn":"作为对……的纪念","s":[]}]},{"name":"Unit 7 Fun after school","words":[{"l":"l.i/t.e.r.a/ture","p":"ˈl.ɪ/t.-.r.ə/tʃə","cn":"n. 文学；文学作品","s":[["She lectures in Russian literature.","她讲授俄罗斯文学。"],["She has very eclectic tastes in literature.","她在文学方面的兴趣非常广泛。"],["He matriculated in the English Literature Department at the Tokyo Imperial University.","他被东京帝国大学英语文学系录取了。"]]},{"l":"a.c.t","p":"æ.k.t","cn":"v. 扮演（戏剧、电影中的角色）","s":[["Acting comes naturally to her.","她天生就会表演。"],["Alcohol acts quickly on the brain.","酒精对大脑迅速产生影响。"],["She doesn't go on until Act 2.","她要到第2幕才出场。"]]},{"l":"a/pp.r.e/ci/a.t.e","p":"ə/ˈp.r.iː/ʃi/eɪ.t.-","cn":"v. 欣赏；赏识（只要求理解）","s":[["I'd appreciate some help.","如果有人帮忙我将非常感激。"],["Anyone can appreciate our music.","任何人都能欣赏我们的音乐。"],["Your help would be greatly appreciated.","如蒙帮助，感激不尽。"]]},{"l":"j.oi.n","p":"dʒ.ɔɪ.n","cn":"v. 成为……的一员；参加","s":[["How do these two pieces join?","这两件东西怎样接合呢？"],["May I join in the celebration?","我能参加庆祝活动吗？"],["I'll join in the long jump.","我将参加跳远比赛。"]]},{"l":"d.e.f/i/n.i.t/e.l.y","p":"ˈd.e.f/ɪ/n.ə.t/-.l.i","cn":"adv. 肯定；没问题；当然；确实","s":[["I will definitely follow up on that!","我一定会跟进的！"],["I definitely remember sending the letter.","我记得这封信肯定发出去了。"],["The exam was impossible! I definitely bombed it.","考试太难了！我肯定考砸了。"]]},{"l":"f.air","p":"f.eə","cn":"n. 集市","s":[["Look, that's not fair.","注意，那样不公平。"],["'It's not fair,' she complained.","“这不公平。”她抱怨道。"],["His knowledge of French is only fair.","他的法语知识还算可以。"]]},{"l":"r.o.ck/e.t","p":"ˈr.ɒ.k/ɪ.t","cn":"n. 火箭","s":[["The rocket soared (up) into the air.","火箭升空。"],["The rocket soared skywards.","火箭呼啸着朝天上飞去。"],["The rocket steepened its ascent.","火箭飞速升空。"]]},{"l":"l.au.n.ch","p":"l.ɔː.n.tʃ","cn":"v. 发射（只要求理解）","s":[["The official launch date is in May.","正式的发行日期是在五月。"],["He launched a fierce attack on the Democrats.","他对民主党人发动了猛烈的攻击。"],["The Navy is to launch a new warship today.","海军今天有一艘新军舰要下水。"]]},{"l":"sh.ou.t","p":"ʃ.aʊ.t","cn":"v. 大声说；叫","s":[["Look, you needn't shout.","喂，你不必喊。"],["\"Hey! Look out!\" shouted Patty.","“嘿！当心！”帕蒂喊道。"],["I'll shout—what are you drinking?","我请客，你想喝什么？"]]},{"l":"p.ow/er","p":"ˈp.aʊ/ə","cn":"n. 力量；能量","s":[["They've switched off the power.","他们关掉了电源。"],["Both parties are hungry for power.","两党都渴望掌权。"],["The power stations burn coal from the Ruhr region.","这些电厂烧产自鲁尔地区的煤。"]]},{"l":"m.o/m.e.n.t","p":"ˈm.əʊ/m.ə.n.t","cn":"n. 片刻；瞬间","s":[["The moment of decision had arrived.","决策的时刻已经到了。"],["Could you wait a moment , please?","请您稍等一下，好吗？"],["She's the fashion designer of the moment.","她是当前最红的时装设计师。"]]},{"l":"m.e.m/b.er","p":"ˈm.e.m/b.ə","cn":"n. 成员","s":[["She is a life member of the club.","她是这个俱乐部的终身会员。"],["How much does it cost to become a member?","要成为会员得花多少钱？"],["Now let us construct two three-member sets based on the results.","现在让我们根据结果构造两个三成员集。"]]},{"l":"sh.a.p.e","p":"ʃ.eɪ.p.-","cn":"n. 形状；外形","s":[["She had a classical, womanly shape.","她有一副标准的女人味儿十足的身材。"],["It is cylindrical in shape.","它是圆柱形的。"],["The male bird has a differently shaped head.","雄鸟的头形有点特别。"]]},{"l":"h.i.k.e","p":"h.aɪ.k.-","cn":"n. 远足；徒步旅行","s":[["The site is reached by a 30-minute hike through dense forest.","要花30分钟徒步穿过密林才能到达那个地方。"],["He had been bitten by a snake during a rough hike.","他在一次艰难的徒步旅行中被蛇咬了。"]]},{"l":"r.e/c.e.n.t/l.y","p":"ˈr.iː/s.ə.n.t/l.i","cn":"adv. 不久前；最近","s":[["Prices have gone down recently.","最近物价下降了。"],["New evidence has recently come to light.","新的证据最近已披露出来。"],["Your French has come along a lot recently.","你的法语最近进步很大。"]]},{"l":"a/tt.e.n.d","p":"ə/ˈt.e.n.d","cn":"v. 出席；参加","s":[["Our children attend the same school.","我们的孩子上同一所学校。"],["A nurse attended to his needs constantly.","有一位护士经常照料他的需要。"],["Which school do they attend?","他们上的是哪一所学校？"]]},{"l":"ch.a.r/i/t.y","p":"ˈtʃ.æ.r/ə/t.i","cn":"n. 慈善机构（或组织）","s":[["Are you collecting for charity?","你是在为慈善募捐吗？"],["Do you give much to charity?","慈善捐助你捐得多吗？"],["Her article showed no charity towards her former friends.","她的文章对她以前的朋友毫不宽容。"]]},{"l":"s.a.l.e","p":"s.eɪ.l.-","cn":"n. 出售；销售","s":[["The sale starts next week.","特价促销从下星期开始。"],["She gets 10% commission on each sale.","每笔生意她得10%的佣金。"],["He moved to the sales department.","他调到了销售部。"]]},{"l":"s.n.a.ck","p":"s.n.æ.k","cn":"n. 点心；小吃","s":[["Lunch was a snack in the fields.","午饭是在野外吃的快餐。"],["I only have time for a snack at lunchtime.","中午，我的时间只够吃点心。"],["It is customary to offer a drink or a snack to guests.","通常用饮料或小吃招待客人。"]]},{"l":"d.e.c/o/r.a.t.e","p":"ˈd.e.k/ə/r.eɪ.t.-","cn":"v. 装饰；装潢","s":[["We need to decorate the sitting room.","我们需要将客厅粉刷一下。"],["The boys are planning to decorate when they get the time.","男孩们正计划在他们有时间的时候装修。"],["The room was decorated in exquisite taste.","这个房间的装饰情趣高雅。"]]},{"l":"d.i/ff.e.r.ence","p":"ˈd.ɪ/f.-.r.əns","cn":"n. 差别；差异","s":[["Few people understand the difference.","很少有人了解这个差别。"],["'There's the difference between art and artefact.","艺术品与人工制品之间存在着差异。"],["There are qualitative differences between the two products.","这两种产品存在着质的差别。"]]},{"l":"c.o.m/p.e.t.e","p":"k.ə.m/ˈp.iː.t.-","cn":"v. 参加比赛（或竞赛）","s":[["He's a talented athlete who competes nationally and internationally.","他是一位有才华的运动员，既参加国内比赛，也参加国际比赛。"],["They competed with skill and tenacity.","他们竞争靠的是技术和顽强意志。"],["We can't compete with them on price.","我们在价格上无法与他们竞争。"]]},{"l":"e/v.e.n.t","p":"ɪ/ˈv.e.n.t","cn":"n. 公开活动；社交场合","s":[["The two events are closely connected.","两起事件之间有密切的联系。"],["Recent events had no bearing on our decision.","近期的事件与我们的决定没有关系。"],["Subsequent events confirmed our doubts.","后来发生的事证实了我们的怀疑。"]]},{"l":"s.p.oo.n","p":"s.p.uː.n","cn":"n. 勺；匙","s":[["He stirred his coffee with a spoon.","他用匙搅了搅咖啡。"],["She licked the spoon clean.","她把调羹舔得干干净净。"],["She licked the honey off the spoon.","她舔光了调羹上的蜂蜜。"]]},{"l":"a.n/n.u/a.l","p":"ˈæ.n/-.ju/ə.l","cn":"adj. 每年的；一年一次的","s":[["Annual boarding fees are $10,350.","每年的住校费是10,350美元。"],["She's covering the party's annual conference.","她正在报道这个政党的年会新闻。"],["How much annual leave do you /* ================= 学习进度（间隔复习）、统计 ================= */
const ALLW = {}; // 所有单词按字母去重（brother 三年级上、下册各有一个，进度共用）
BOOK_DATA.forEach(b => b.units.forEach(u => u.words.forEach(w => { ALLW[keyOf(w)] = ALLW[keyOf(w)] || w; })));

// 复习间隔（天）：词在第几档就隔多久再复习。听写拼对升一档，拼错降档并当天重练
const INTERVALS = [0, 1, 2, 4, 7, 15, 30];
const MASTERED_BOX = 4;   // 第 4 档起（隔 7 天以上还拼得对）算「掌握」
const REVIEW_CAP = 20;    // 一次复习最多出多少个词
let combo = 0;            // 连续一次拼对的词数

const pad2 = n => String(n).padStart(2, '0');
const fmtDay = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const today = () => fmtDay(new Date());
const parseDay = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (day, n) => { const d = parseDay(day); d.setDate(d.getDate() + n); return fmtDay(d); };

function streak() {
  let t = today(), n = 0;
  if (!(S.days[t] && S.days[t].n)) t = addDays(t, -1); // 今天还没练不算断
  while (S.days[t] && S.days[t].n) { n++; t = addDays(t, -1); }
  return n;
}
function dueList() {
  const t = today();
  return Object.entries(S.prog)
    .filter(([k, p]) => p.due <= t && ALLW[k])
    .sort((a, b) => a[1].due.localeCompare(b[1].due) || a[1].box - b[1].box)
    .map(([k]) => ALLW[k]);
}
// 记录一次练习结果，返回 {isNew, goalHit}
function recordResult(item, ok, mode) {
  const key = keyOf(item), t = today();
  const d = S.days[t] || (S.days[t] = {n: 0, ok: 0, w: 0, nw: 0});
  let p = S.prog[key];
  const isNew = !p;
  if (!p) p = S.prog[key] = {box: 0, due: t, seen: 0, ok: 0, first: t, last: '', pd: ''};
  if (p.last !== t) d.w++;            // 今天第一次练这个词
  if (isNew) d.nw++;
  d.n++;
  if (ok) d.ok++;
  p.seen++;
  p.last = t;
  if (ok) {
    p.ok++;
    if (mode === 'dictation') {
      if (p.pd !== t) { p.box = Math.min(6, p.box + 1); p.due = addDays(t, INTERVALS[p.box]); p.pd = t; } // 一天只升一档
    } else if (p.box < 1) { p.box = 1; p.due = addDays(t, 1); } // 跟写只算入门
  } else {
    p.box = Math.max(0, p.box - (mode === 'dictation' ? 2 : 1));
    p.due = t;
    p.pd = '';
  }
  const goalHit = ok && !d.goal && d.w >= S.goal; // 达标时那个词拼错了，就等下一个拼对的再庆祝
  if (goalHit) d.goal = 1;
  return {isNew, goalHit};
}
function stats() {
  let learned = 0, mastered = 0, learning = 0, fresh = 0;
  for (const k in S.prog) {
    if (!ALLW[k]) continue;
    const p = S.prog[k];
    learned++;
    if (p.box >= MASTERED_BOX) mastered++; else if (p.box >= 1) learning++; else fresh++;
  }
  return {total: Object.keys(ALLW).length, learned, mastered, learning, fresh, due: dueList().length,
    today: S.days[today()] || {n: 0, ok: 0, w: 0, nw: 0}, streak: streak()};
}
function updateChip() {
  const el = $('#bStat');
  if (!el) return;
  const w = (S.days[today()] || {}).w || 0, due = dueList().length;
  el.innerHTML = `🔥${streak()} · 今日 ${w}/${S.goal}` + (due ? `<span class="dot">${due}</span>` : '');
}
function unitBadge(u) {
  const n = u.words.filter(w => S.prog[keyOf(w)]).length;
  return n === 0 ? `${u.words.length}` : n === u.words.length ? `✓ ${n}` : `${n}/${u.words.length}`;
}
function sessionStars() {
  if (!results.length) return 0;
  const rate = results.filter(r => r.ok).length / results.length;
  return rate >= 0.9 ? 3 : rate >= 0.7 ? 2 : 1;
}

  for (const p of fxParts) {

// 把「字母拆分」和「音标拆分」解析成音节列表；结构对不上时返回错误
function parseSplit(l, p) {
  const split3 = s => s.trim().split(/\s+/).map(w => w.split('/').map(x => x.split('.')));
  const L = split3(l), P = split3(p);
  if (L.length !== P.length) return {error: '单词数和音标对不上'};
  const syls = [];
  for (let wi = 0; wi < L.length; wi++) {
    if (L[wi].length !== P[wi].length) return {error: `第 ${wi + 1} 个词的音节数和音标对不上`};
    for (let si = 0; si < L[wi].length; si++) {
      const ls = L[wi][si], ps = P[wi][si];
      if (ls.length !== ps.length) return {error: `「${ls.join('')}」有 ${ls.length} 个字母组合，音标却是 ${ps.length} 个`};
      if (ls.some(x => !x) || ps.some(x => !x)) return {error: '有空的字母组合或音标（检查是不是连着写了两个点）'};
      syls.push({wi, t: ls.join(''), chunks: ls.map((x, i) => ({l: x, p: ps[i]}))});
    }
  }
  return {syls};
}
function getLP(item) { return S.custom[keyOf(item)] || {l: item.l, p: item.p}; }
function sylsOf(item) {
  const lp = getLP(item);
  const r = parseSplit(lp.l, lp.p);

/* ================= 声音 ================= */
let curAudio = null;
function stopAudio() {
  if (curAudio) { curAudio.onerror = null; curAudio.pause(); curAudio = null; }
  try { speechSynthesis.cancel(); } catch (e) {}
}
// 全大写的缩写（TV、PE、US）按字母读
function audioText(text) {
  return text.split(/\s+/).map(t => /^[A-Z]{2,}$/.test(t) ? t.split('').join(' ') : t).join(' ');
}
function spokenSyl(t) {
  if (/^[A-Z]$/.test(t)) return t;
  return t.replace(/[^a-zA-Z]/g, '').toLowerCase();
}
function pickVoice(lang) {
  const vs = speechSynthesis.getVoices();
  return vs.find(v => v.lang === lang) || vs.find(v => v.lang.replace('_', '-').startsWith(lang)) || vs.find(v => /^en/i.test(v.lang));
}
function ttsP(text, rate = 0.85) {
  return new Promise(res => {
    if (!('speechSynthesis' in window) || !text) { setTimeout(res, 400); return; }
    let d = false;
    const fin = () => { if (!d) { d = true; res(); } };
    const lang = S.accent === 'uk' ? 'en-GB' : 'en-US';
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    const v = pickVoice(lang);
    if (v) u.voice = v;
    u.rate = rate;
    u.onend = fin;
    u.onerror = fin;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
    setTimeout(fin, 900 + text.length * 260);
  });
}
// 优先用有道词典真人发音（需联网），失败时退回浏览器朗读；单词和例句都用它
function playText(raw) {
  stopAudio();
  const text = audioText(raw);
  return new Promise(res => {
    let done = false, fbUsed = false, started = false;
    const fin = () => { if (!done) { done = true; res(); } };
    const fallback = () => { if (fbUsed || done) return; fbUsed = true; ttsP(text).then(fin); };
    if (!navigator.onLine) { fallback(); return; }
    const a = new Audio('https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(text) + '&type=' + (S.accent === 'uk' ? 1 : 2));
    curAudio = a;
    a.onplaying = () => { started = true; };
    a.onended = fin;
    a.onerror = () => { started ? fin() : fallback(); };
    a.play().catch(() => { if (!started) fallback(); });
    setTimeout(fin, Math.max(4000, text.length * 120));
  });
}

let actx = null;
function beep(freq, dur, type = 'sine', vol = 0.06, delay = 0) {
  if (!S.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime + delay;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t0); o.stop(t0 + dur);
