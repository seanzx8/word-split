<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, interactive-widget=resizes-content">
<title>WordSplit</title>
<style>
:root{--bg:#0e0e16;--panel:#171725;--line:#2a2a3d;--text:#e8e8f0;--dim:#8a8aa3;--accent:#8b7cf6;--ok:#34d399;--bad:#f87171;--ipa:"Segoe UI","Lucida Sans Unicode","Arial Unicode MS","Charis SIL","Doulos SIL",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
body{display:flex;flex-direction:column;min-height:100vh}
button,select,input{font:inherit;color:inherit}
a{color:var(--dim)}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;white-space:nowrap}
.logo i{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#8b7cf6,#38bdf8);display:inline-block}
.tabs{display:flex;gap:6px;margin:0 auto;background:var(--panel);padding:4px;border-radius:12px}
.tab{border:1px solid transparent;background:none;padding:6px 14px;border-radius:9px;cursor:pointer;color:var(--dim);white-space:nowrap}
.tab b{font-weight:400;opacity:.6;margin-right:6px;font-size:12px}
.tab.on{color:var(--text);border-color:#5b50b8;background:#211f38}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,.btn{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px 10px;cursor:pointer}
select option{background:var(--panel)}
.btn:hover,select:hover{border-color:#4a4a66}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:safe center;padding:20px;gap:20px;user-select:none;overflow-y:auto}
footer{display:flex;align-items:center;justify-content:center;gap:18px;padding:14px;color:var(--dim);font-size:13px;flex-wrap:wrap}
footer .nav{background:none;border:none;color:var(--dim);cursor:pointer;font-size:18px;padding:2px 10px}
footer .nav:hover{color:var(--text)}
footer .count{color:var(--text);font-variant-numeric:tabular-nums}
/* 单词行 */
.wordrow{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;column-gap:.45em;row-gap:.35em;font-weight:700;line-height:1.15;max-width:100%}
.wgroup{display:inline-flex;align-items:flex-end;white-space:nowrap}
/* 认读模式：音节 > 字母组合（下面标音标） */
.syl,.sep{display:inline-flex;flex-direction:column;align-items:stretch}
.syl{cursor:pointer;transition:transform .15s}
.chunks{display:flex;justify-content:center;gap:.07em}
.ck{display:flex;flex-direction:column;align-items:center;min-width:.3em}
.ck .cl{color:var(--c);transition:text-shadow .15s}
.ck .cp{font-family:var(--ipa);font-size:.25em;font-weight:500;color:var(--c);opacity:.9;margin-top:.15em;white-space:nowrap;min-height:1.3em}
.ck.silent .cl{opacity:.32}
.ck.silent .cp{opacity:.45}
.sep .st{color:#50506a;font-weight:300;padding:0 .14em;font-size:.55em;align-self:center;margin-bottom:1.1em}
.sl{height:2px;background:#5d5d7a;margin-top:.12em;position:relative}
.syl .sl::before{content:"";position:absolute;left:0;bottom:0;width:2px;height:10px;background:#5d5d7a}
.wgroup .syl:last-child .sl::after{content:"";position:absolute;right:0;bottom:0;width:2px;height:10px;background:#5d5d7a}
.syl:hover{transform:translateY(-3px)}
.syl.speak{transform:scale(1.08)}
.syl.speak .cl{text-shadow:0 0 22px var(--c)}
.wordrow.speakall .cl{text-shadow:0 0 18px var(--c)}
.ipa{font-family:var(--ipa);font-size:clamp(18px,2.4vw,24px);color:#c9c9dc;letter-spacing:.02em}
/* 跟写 / 听写 */
.slot{display:inline-flex;flex-direction:column;align-items:stretch}
.slot .chars{display:flex;white-space:nowrap;font-family:ui-monospace,"Cascadia Mono","Cascadia Code",Consolas,"SF Mono",Menlo,"Roboto Mono","Droid Sans Mono",monospace;letter-spacing:.02em}
/* 等宽字体：每个字母宽度一样，w、m 不会挤到旁边，听写时也看不出是宽字母还是窄字母 */
.ch{display:inline-block;text-align:center;position:relative}
.ch.hidden{color:transparent}
.ch.ghost{color:var(--c);opacity:.25}
.ch.done{color:var(--c)}
.ch.wrong{color:var(--bad)}
.ch.punct{color:var(--dim)}
.ch.cur::after{content:"";position:absolute;left:15%;right:15%;bottom:.04em;height:3px;border-radius:2px;background:#fff;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.slot .ul{height:4px;border-radius:2px;background:#33334a;margin-top:.14em;transition:background .2s}
.slot.active .ul{background:var(--accent)}
.slot.full .ul{background:var(--c);opacity:.55}
.tsep{color:#45455e;font-weight:300;font-size:.55em;margin:0 .18em .5em;align-self:flex-end}
.shake{animation:shake .3s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.wordrow.win{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.06)}}
.cn{font-size:clamp(22px,3.2vw,34px);font-weight:600;text-align:center}
.ctrls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
.round{width:40px;height:40px;border-radius:50%;border:1px solid #4a4a66;background:var(--panel);cursor:pointer;font-size:14px;flex:none}
.round.sm{width:30px;height:30px;font-size:11px}
.round:hover,.pill:hover{border-color:var(--accent)}
.pill{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px}
.pill.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.sub{font-size:13px;color:var(--dim);text-align:center}
.status{font-size:16px;min-height:24px;text-align:center}
.status.ok{color:var(--ok)}
.status.bad{color:var(--bad)}
.tapkb{border:1px dashed #4a4a66;border-radius:10px;padding:8px 14px;color:var(--dim);font-size:14px}
/* 例句 */
.sents{width:min(760px,100%);display:flex;flex-direction:column;gap:10px;user-select:text}
.sent{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.sent .en{font-size:17px;line-height:1.45}
.sent .en mark{background:none;color:#fbbf24;font-weight:700}
.sent .zh{font-size:14px;color:var(--dim);margin-top:2px}
/* 小结 */
.sum{text-align:center;max-width:720px}
.sum h2{font-size:30px;margin:0 0 10px}
.sum p{color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0}
.chip{background:var(--panel);border:1px solid #4b2a33;border-radius:8px;padding:5px 10px;font-size:15px}
.chip small{color:var(--dim);margin-left:6px}
.sumbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
/* 弹窗 */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
#modal.on{display:flex}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(760px,100%);max-height:85vh;overflow:auto}
.box h3{margin:0 0 14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row label{display:flex;gap:8px;align-items:center;cursor:pointer}
.wl{width:100%;border-collapse:collapse}
.wl td{padding:7px 6px;border-bottom:1px solid var(--line);font-size:15px;vertical-align:middle}
.wl td:first-child{color:var(--dim);width:36px}
.wl tr:hover td{background:#1d1d2e}
.wl .split{font-weight:700;font-size:18px;cursor:pointer;white-space:nowrap}
.wl .split .x{color:#50506a;font-weight:300;margin:0 2px}
.wl .split .d{opacity:.35}
.wl .pp{font-family:var(--ipa);color:var(--dim);font-size:14px;white-space:nowrap}
.wl button{font-size:12px;padding:3px 8px}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#2a2440;border:1px solid var(--accent);padding:8px 16px;border-radius:10px;display:none;z-index:20}
/* 隐藏输入框放在顶部：浏览器会把获得焦点的输入框滚到可见处，放顶部就不会把页面往上顶。字号 16px 防止 iOS 自动放大 */
#kb{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;border:0;padding:0;margin:0;font-size:16px;caret-color:transparent;background:transparent;color:transparent;pointer-events:none}
/* 手机键盘弹起：页面高度跟着可见区域走，内容靠上排，不被键盘挡住 */
html.kbopen,html.kbopen body{height:var(--vvh,100vh);min-height:0;overflow:hidden}
html.kbopen header{padding:6px 10px;gap:6px}
html.kbopen header .logo,html.kbopen header .tools,html.kbopen #bStat{display:none}
html.kbopen .tabs{width:100%;justify-content:center}
html.kbopen main{justify-content:flex-start;padding:8px 12px;gap:7px;overflow-y:auto}
html.kbopen footer,html.kbopen .tapkb,html.kbopen .sents{display:none}
html.kbopen .cn{font-size:22px;order:-1}  /* 键盘开着时中文放最上面，永远不会被挡 */
html.kbopen #wrow{font-size:min(9vw,36px,calc(var(--vvh,100vh) * .12))!important}
html.kbopen .status{min-height:0;font-size:15px}
html.kbopen .ctrls{gap:8px}
html.kbopen .ctrls .pill{padding:5px 11px;font-size:13px}
html.kbopen .ipa{font-size:17px}
html.kbopen .praise{top:8%}
/* 今日进度入口 */
.chip-stat{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip-stat:hover{border-color:var(--accent)}
.chip-stat .dot{background:var(--accent);color:#fff;border-radius:999px;padding:0 7px;font-size:12px;line-height:18px;min-width:18px;text-align:center}
.pill:disabled{opacity:.4;cursor:default}
.pill:disabled:hover{border-color:var(--line)}
/* 庆祝效果 */
#fx{position:fixed;inset:0;pointer-events:none;z-index:30}
.praise{position:fixed;left:50%;top:17%;transform:translateX(-50%);z-index:31;pointer-events:none;font-size:clamp(34px,7vw,64px);font-weight:800;text-align:center;white-space:nowrap;background:linear-gradient(90deg,#fbbf24,#f472b6,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent;animation:praise 1.1s ease-out forwards;filter:drop-shadow(0 4px 14px rgba(139,124,246,.45))}
.praise small{display:block;font-size:.32em;font-weight:600;-webkit-text-fill-color:#fbbf24;margin-top:2px}
@keyframes praise{0%{opacity:0;transform:translate(-50%,20px) scale(.5)}20%{opacity:1;transform:translate(-50%,0) scale(1.15)}35%{transform:translate(-50%,0) scale(1)}80%{opacity:1;transform:translate(-50%,-14px)}100%{opacity:0;transform:translate(-50%,-34px)}}
.ch.pop{animation:chpop .22s ease-out}
@keyframes chpop{0%{transform:scale(1.5) translateY(-.08em)}100%{transform:none}}
.ch.wave{animation:wave .5s ease-out both}
@keyframes wave{0%{transform:none}35%{transform:translateY(-.22em) scale(1.12)}100%{transform:none}}
.stars{font-size:46px;letter-spacing:6px;margin:6px 0}
.stars span{display:inline-block;filter:grayscale(1) opacity(.25)}
.stars span.on{filter:none;animation:starpop .5s cubic-bezier(.3,1.6,.5,1) both;animation-delay:var(--d)}
@keyframes starpop{0%{transform:scale(0) rotate(-60deg)}100%{transform:none}}
/* 统计面板 */
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{background:#1d1d2e;border-radius:12px;padding:12px 6px;text-align:center}
.stat b{display:block;font-size:26px;line-height:1.2}
.stat small{color:var(--dim);font-size:12px}
.goalbar{height:12px;border-radius:8px;background:#262638;overflow:hidden;margin:6px 0 4px}
.goalbar i{display:block;height:100%;background:linear-gradient(90deg,#8b7cf6,#38bdf8);border-radius:8px;transition:width .5s}
.goalbar.full i{background:linear-gradient(90deg,#34d399,#facc15)}
.box h4{margin:18px 0 8px;font-size:14px;color:var(--dim);font-weight:600}
.bars{display:flex;gap:6px;align-items:flex-end}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--dim)}
.bar .bw{height:80px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.bar .col{width:70%;max-width:34px;min-height:3px;background:#3a3a55;border-radius:5px 5px 0 0}
.bar .col.now{background:var(--accent)}
.plan{display:flex;gap:10px}
.plan div{flex:1;background:#1d1d2e;border-radius:10px;padding:8px;text-align:center;font-size:13px;color:var(--dim)}
.plan b{display:block;font-size:20px;color:var(--text)}
.brow{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.brow small{color:var(--dim);white-space:nowrap}
.pbar{display:flex;height:10px;border-radius:6px;background:#262638;overflow:hidden}
.pbar .m{background:var(--ok)}
.pbar .l{background:var(--accent)}
@media (max-width:640px){
  .chip-stat{margin-left:auto}
  .sgrid{grid-template-columns:repeat(2,1fr)}
  .brow{grid-template-columns:1fr;gap:3px}
}
@media (max-width:640px){
  header{padding:10px;gap:8px}
  .tabs{order:3;margin:0;width:100%;justify-content:center}
  .tab{padding:6px 9px}
  .tools{width:100%;display:grid;grid-template-columns:1fr 1.4fr auto auto;gap:6px}
  .tools select,.tools .btn{min-width:0;font-size:14px;padding:6px}
  .sent .en{font-size:15px}
}
</style>
</head>
<body>
<header>
  <div class="logo"><i></i>WordSplit</div>
  <div class="tabs" id="tabs">
    <button class="tab" data-m="learn"><b>01</b>拆分认读</button>
    <button class="tab" data-m="follow"><b>02</b>跟写</button>
    <button class="tab" data-m="dictation"><b>03</b>听写</button>
  </div>
  <button class="chip-stat" id="bStat" title="学习统计"></button>
  <div class="tools">
    <select id="selBook"></select>
    <select id="selUnit"></select>
    <button class="btn" id="bList">单词表</button>
    <button class="btn" id="bSet">设置</button>
  </div>
</header>
<main id="stage"></main>
<footer>
  <span id="unitLabel"></span>
  <button class="nav" id="bPrev" title="上一个（←）">←</button>
  <span class="count" id="count"></span>
  <button class="nav" id="bNext" title="下一个（→）">→</button>
  <span id="keys"></span>
</footer>
<div id="modal"><div class="box" id="box"></div></div>
<div id="toast"></div>
<input id="kb" type="text" inputmode="text" enterkeyhint="next" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="输入字母" data-lpignore="true" data-1p-ignore="true" data-form-type="other">

<script>
/* ================= 词表 =================
 * 由 tools/build.py 根据 tools/words.txt（拆分、音标、中文）和 TypeWords 官网词库（例句）生成。
 * 不要手改下面这段：要改拆分就改 words.txt 再运行 python tools/build.py，或者在页面「单词表」里改。
 */

const BOOK_DATA = [{"id":"pep3a","name":"人教 三年级上册（新教材）","units":[{"name":"Unit 1 Making friends","words":[{"l":"n.a.m.e","p":"n.eɪ.m.-","cn":"名字（只要求理解）","s":[["\"What's his name?\"—\"Peter.\"","“他叫什么名字？”—“彼得。”"],["What's your name, dear?","你叫什么名字，亲爱的？"],["His middle name is Justin.","他的中间名叫朱斯丁。"]]},{"l":"n.i.c.e","p":"n.aɪ.s.-","cn":"令人愉快的；友好的（只要求理解）","s":[["You look very nice.","你很好看。"],["They're a nice color.","它们的颜色很好看。"],["He's a nice old fellow.","他这位老兄人不错。"]]},{"l":"ear","p":"ɪə","cn":"耳朵","s":[["His ears stick out.","他长着一对招风耳。"],["The elephant flapped its ears.","大象拍打着双耳。"],["I stopped my ears but still heard her cry out.","我捂上耳朵，但还能听见她大声喊叫。"]]},{"l":"h.a.n.d","p":"h.æ.n.d","cn":"手","s":[["I managed to grab her hand.","我设法抓住了她的手。"],["He raised his hand to wave.","他举起手来挥动。"],["He raised his hand in greeting.","他举手致意。"]]},{"l":"eye","p":"aɪ","cn":"眼睛","s":[["His eyes rounded with horror.","他吓得两眼圆睁。"],["He's the manager's blue-eyed boy.","他备受经理的青睐。"],["I cast my eyes down briefly.","我往下瞅了瞅。"]]},{"l":"m.ou.th","p":"m.aʊ.θ","cn":"嘴","s":[["My mouth felt completely dry.","我感到口干舌燥。"],["I clapped a hand over her mouth.","我猛地用一只手捂住了她的嘴。"],["She could only nod, because her mouth was full.","她只能点点头，因为她口里塞满了东西。"]]},{"l":"ar.m","p":"ɑː.m","cn":"胳膊","s":[["He refused to release her arm.","他不肯放开她的胳膊。"],["The man is armed and dangerous.","这个男子有枪，是个危险分子。"],["Police were heavily armed.","警察全副武装。"]]},{"l":"c.a.n","p":"k.æ.n","cn":"可以（只要求理解）","s":[["Can we change seats?","咱们可以交换一下座位吗？"],["Can I come too?","我也可以来吗？"],["I can run fast.","我能跑得快。"]]},{"l":"sh.are","p":"ʃ.eə","cn":"分享","s":[["The share close 2% off.","股票以降价2％闭市。"],["Share prices moved ahead today.","今天的股票价格上升了。"],["I wanted everybody to share.","我希望大家一起分享。"]]},{"l":"s.m.i.l.e","p":"s.m.aɪ.l.-","cn":"微笑；笑","s":[["She managed to force a smile.","她勉强笑笑。"],["She flashed him a false smile of congratulation.","她向他虚情假意地微微一笑表示祝贺。"],["\"Fancy that!\" smiled Conti.","“真没想到！” 康蒂笑着说。"]]},{"l":"l.i.s/t.e.n","p":"ˈl.ɪ.s/-.ə.n","cn  is in a desperate plight.","非洲象正面临绝境。"],["The kids had a ride on an elephant at the zoo.","在动物园里，孩子们骑着大象走了一圈。"]]},{"l":"l.i/o.n","p":"ˈl.aɪ/ə.n","cn":"狮；狮子","s":[["Lions sometimes hunt alone.","狮子有时单独猎食。"],["We heard a lion roar.","我们听见了狮子的吼声。"],["Lions belong to the cat family.","狮属于猫科。"]]},{"l":"a.n/i/m.a.l","p":"ˈæ.n/ɪ/m.ə.l","cn":"动物（只要求理解）","s":[["Cats are very clean animals.","猫是颇爱干净的动物。"],["A lion is a dangerous animal.","狮子是猛兽。"],["The animal is hunted for its fur.","狩猎这种动物是为了获取其毛皮。"]]},{"l":"g.i/r.a.ff.e","p":"dʒ.ə/ˈr.ɑː.f.-","cn":"长颈鹿（只要求理解）","s":[["The giraffe eats leaves.","长颈鹿吃树叶。"],["A giraffe cannot cough.","长颈鹿没办法咳嗽。"],["You have two giraffe toys.","你有两个长颈鹿玩具。"]]},{"l":"t.a.ll","p":"t.ɔː.l","cn":"高的（只要求理解）","s":[["Tall trees cut out the sunlight.","高高的树木遮住了阳光。"],["You're as tall as your father.","你和你父亲一样高。"],["He was tall, lean and handsome.","他长得瘦高而英俊。"]]},{"l":"f.a.s.t","p":"f.ɑː.s.t","cn":"快的（只要求理解）","s":[["Technology is changing fast.","技术日新月异。"],["I can run fast.","我能跑得快。"],["That's a spaceship. It's fast.","那是一艘宇宙飞船，它速度很快。"]]}]},{"name":"Unit 4 Plants around us","words":[{"l":"a.p/p.le","p":"ˈæ.p/-.l","cn":"苹果","s":[["I cut up these apples.","我把这些苹果切碎。"],["I want an apple.","我要一个苹果。"],["I planted those apple trees.","我种了那些苹果树。"]]},{"l":"b.a/n.a/n.a","p":"b.ə/ˈn.ɑː/n.ə","cn":"香蕉","s":[["Cut up the bananas.","把这些香蕉切碎。"],["The banana smells good.","这个香蕉闻起来很香。"],["He slipped on a banana skin.","他踩在香蕉皮上滑倒了。"]]},{"l":"f.ar.m","p":"f.ɑː.m","cn":"农场（只要求理解）","s":[["His father started him off farming.","他父亲指点他做农活儿。"],["More farms are selling direct to consumers.","更多的农场在直接向消费者销售产品。"],["Organic farming is expanding everywhere.","有机农业在各处发展。"]]},{"l":"air","p":"eə","cn":"空气","s":[["Is the air-conditioning on?","空调开着吗？"],["Music filled the night air.","夜空荡漾着乐声。"],["The program aired last week.","该节目已于上周播出。"]]},{"l":"o.r/a.n.g.e","p":"ˈɒ.r/ɪ.n.dʒ.-","cn":"橙子；柑橘","s":[["Would you care for some orange juice?","你想要些橙汁吗？"],["Orange is the big colour this year.","橘黄色是今年的流行色。"],["The outer skin of the orange is called the \"zest.\"","橙子外层皮叫“橙皮”。"]]},{"l":"g.r.a.p.e","p":"ɡ.r.eɪ.p.-","cn":"葡萄","s":[["Is it a grape or a plum?","这是葡萄还是李子？"],["Juice blends contain various fruits like grape, apple and pear.","混合果汁含有各种水果，如葡萄、苹果和梨。"],["These grapes are ripe.","这些葡萄熟了。"]]},{"l":"s.ch.oo.l","p":"s.k.uː.l","cn":"学校（只要求理解）","s":[["I'm a middle school teacher.","我是一个中学教师。"],["The school is filled to capacity.","这所学校已经满员。"],["Our children attend the same school.","我们的孩子上同一所学校。"]]},{"l":"g.ar/d.e.n","p":"ˈɡ.ɑː/d.ə.n","cn":"花园（只要求理解）","s":[["All this gardening is hungry work.","这些园艺活儿让人干了肚子饿。"],["Gardening is very popular in Maryland.","园艺在马里兰州很受欢迎。"],["The main attraction at Giverny is Monet's garden.","吉维尼主要的景点是莫奈花园。"]]},{"l":"n.ee.d","p":"n.iː.d","cn":"需要（只要求理解）","s":[["He desperately needed money.","他急需钱。"],["Children need their parents.","孩子们需要父母。"],["These jeans need washing.","这条牛仔裤该洗了。"]]},{"l":"w.a/t.er","p":"ˈw.ɔː/t.ə","cn":"给……浇水；水","s":[["She dived under the water.","她潜入水下。"],["Fishing is good at high water.","高水位有利于钓鱼。"],["Water is a fish's natural element.","水是鱼的天然生活环境。"]]},{"l":"f.l.ow/er","p":"ˈf.l.aʊ/ə","cn":"花；花朵","s":[["Are those real flowers?","那些是真花吗？"],["I picked some flowers.","我摘了一些花。"],["Each individual flower is tiny.","每一朵花都很小。"]]},{"l":"g.r.a.ss","p":"ɡ.r.ɑː.s","cn":"草；草地","s":[["Rabbits hop in the grass.","兔子在草地里跳。"],["Humans cannot digest plants such as grass.","人不能消化草类植物。"],["Through the marsh grass, the birds are rising.","穿过沼泽的草地，鸟儿们飞了起来。"]]},{"l":"p.l.a.n.t","p":"p.l.ɑː.n.t","cn":"种植；植物（只要求理解）","s":[["Plant fruit and nut trees.","种植水果和坚果树木。"],["I planted those apple trees.","我种了那些苹果树。"],["Sadly, bamboo plants die after flowering.","令人遗憾的是，竹子开花后就会死亡。"]]},{"l":"n.ew","p":"n.juː","cn":"新的（只要求理解）","s":[["New England is beautiful.","新英格兰很迷人。"],["This idea isn't new.","这主意不新鲜。"],["The news started me thinking.","那条消息让我思考起来。"]]},{"l":"t.r.ee","p":"t.r.iː","cn":"树","s":[["Tall trees cut out the sunlight.","高高的树木遮住了阳光。"],["Look! It's going up that tree.","瞧！它正在往那棵树上爬呢。"],["The balloon hit a tree and burst.","气球碰到树上就爆了。"]]},{"l":"s.u.n","p":"s.ʌ.n","cn":"阳光；太阳","s":[["The sun disappeared from view.","太阳看不见了。"],["The earth moves round the sun.","地球围绕太阳旋转。"],["We watched the sun come up.","我们观看了日出。"]]},{"l":"g.i.v.e","p":"ɡ.ɪ.v.-","cn":"给（只要求理解）","s":[["Do you give any discount?","你们打折吗？"],["I'll give you a ring.","我会给你打电话的。"],["Do you give much to charity?","慈善捐助你捐得多吗？"]]},{"l":"U/S","p":"ˌjuː/ˈes","cn":"我们（只要求理解）","s":[["The poem uses simple language.","这首诗用语简单。"],["She arrived shortly after us.","我们刚到不多会儿她就到了。"],["I used to play basketball.","我过去常打篮球。"]]},{"l":"th.e.m","p":"ð.e.m","cn":"它们；他们；她们（只要求理解）","s":[["It's difficult to tell them apart.","很难把他们区分开来。"],["Our greatest problem is convincing them.","我们最重要的问题是说服他们。"],["I'll run ahead and warn them.","我要跑在前头，警告他们。"]]}]},{"name":"Unit 5 The colourful world","words":[{"l":"c.o.l/our","p":"ˈk.ʌ.l/ə","cn":"颜色（只要求理解）","s":[["What's your favourite colour?","你最喜欢的颜色是什么？"],["Any colour will do.","什么颜色都行。"],["These colours are pleasing.","这些色彩令人愉快。"]]},{"l":"o.r/a.n.g.e","p":"ˈɒ.r/ɪ.n.dʒ.-","cn":"橙红色；橙红色的","s":[["Would you care for some orange juice?","你想要些橙汁吗？"],["Orange is the big colour this year.","橘黄色是今年的流行色。"],["The outer skin of the orange is called the \"zest.\"","橙子外层皮叫“橙皮”。"]]},{"l":"g.r.ee.n","p":"ɡ.r.iː.n","cn":"绿色；绿色的","s":[["She works for Bond & Green.","她在邦德—格林公司工作。"],["Good morning. Good morning, Mr. Green.","早上好。早上好，格林先生。"],["There's a Mrs Green to see you.","有位格林太太要见你。"]]},{"l":"r.e.d","p":"r.e.d","cn":"红色；红色的","s":[["Red wine gives me a headache.","我喝红酒会头痛。"],["Would you prefer red or white?","你喜欢喝红葡萄酒还是白葡萄酒？"],["I love the reds and golds of autumn.","我喜欢秋天的火红色和金黄色。"]]},{"l":"b.l.ue","p":"b.l.uː","cn":"蓝色；蓝色的","s":[["The dragon is a blue dragon.","这条龙是蓝色的。"],["Can white girls sing the blues?","白人女孩会唱蓝调吗？"],["He's the manager's blue-eyed boy.","他备受经理的青睐。"]]},{"l":"m.a.k.e","p":"m.eɪ.k.-","cn":"使出现；做（只要求理解）","s":[["We're making a snowman.","我们正在做一个雪人。"],["Four quarters make a whole.","四个四分之一构成一个整体。"],["She makes her own clothes.","她自己做衣服。"]]},{"l":"p.ur/p.le","p":"ˈp.ɜː/p.l","cn":"紫色；紫色的","s":[["She was dressed in purple.","她穿一身紫色衣裳。"],["She wore purple and green silk.","她穿着紫色和绿色的丝绸。"],["His face was purple with rage.","他气得脸色发紫。"]]},{"l":"b.r.ow.n","p":"b.r.aʊ.n","cn":"棕色；棕色的","s":[["Where's the brown clown?","棕色的小丑在哪里？"],["Brown is the new black.","棕色取代了黑色变得时髦起来。"],["Newcastle Brown Ale: The one and only.","纽卡斯尔brown浓啤酒：有且只有。"]]},{"l":"b.ear","p":"b.eə","cn":"熊（只要求理解）","s":[["Recent events had no bearing on our decision.","近期的事件与我们的决定没有关系。"],["Bears are cute.","熊是可爱的。"],["Currency notes bear serial Numbers.","钞票上有连续的号码。"]]},{"l":"y.e.l/l.ow","p":"ˈj.e.l/-.əʊ","cn":"黄色；黄色的","s":[["The wings are tipped with yellow.","翅膀的尖端呈黄色。"],["The basement hallway is painted a warm yellow.","地下室的走廊被涂成暖色调的黄色。"],["The walls were painted yellow.","墙壁漆成了黄色。"]]},{"l":"d.u.ck","p":"d.ʌ.k","cn":"鸭（只要求理解）","s":[["The main course was roast duck.","主菜是烤鸭。"],["He ducked his head to hide his admiration.","他低下头以掩饰他的羡慕。"],["The cat was now within striking distance of the duck.","此时，猫就在可攻击鸭子的距离内。"]]},{"l":"s.ea","p":"s.iː","cn":"海；海洋（只要求理解）","s":[["The whole place is at sea level.","整个地区与海平面持平。"],["The clear blue sea beckoned.","清澈蔚蓝的大海令人向往。"],["The sea washed against the shore.","海水冲刷着海岸。"]]},{"l":"s.o.m.e","p":"s.ʌ.m.-","cn":"一些（只要求理解）","s":[["I'd appreciate some help.","如果有人帮忙我将非常感激。"],["I picked some flowers.","我摘了一些花。"],["He offered some useful advice.","他提出了一些有益的建议。"]]},{"l":"p.i.n.k","p":"p.ɪ.ŋ.k","cn":"粉色；粉色的","s":[["Judi's favourite colour is pink.","朱迪最喜欢的颜色是粉红色。"],["Her dress was a violent pink.","她的连衣裙是非常鲜艳的粉红色。"],["His face was a queer pink colour.","他满脸奇怪的粉红色。"]]},{"l":"d.r.aw","p":"d.r.ɔː","cn":"画（只要求理解）","s":[["Let's draw a snowman.","咱们画一个雪人吧。"],["The exams are drawing near.","考试越来越近了。"],["I'm not very good at drawing.","我不擅长绘画。"]]},{"l":"wh.i.t.e","p":"w.aɪ.t.-","cn":"白色；白色的","s":[["The single is titled \"White Love.\"","这支单曲名为《白色之恋》。"],["Can white girls sing the blues?","白人女孩会唱蓝调吗？"],["Would you prefer red or white?","你喜欢喝红葡萄酒还是白葡萄酒？"]]},{"l":"b.l.a.ck","p":"b.l.æ.k","cn":"黑色；黑色的","s":[["Black is out this year.","今年黑色不时兴了。"],["Brown is the new black.","棕色取代了黑色变得时髦起来。"],["The play is a black comedy.","那是个黑色喜剧。"]]}]},{"name":"Unit 6 Useful numbers","words":[{"l":"o.l.d","p":"əʊ.l.d","cn":"（多少）岁；年纪；旧的（只要求理解）","s":[["I'm fourteen years old.","我14岁。"],["How old is she?","她有多大了？"],["He's a nice old fellow.","他这位老兄人不错。"]]},{"l":"f.i.v.e","p":"f.aɪ.v.-","cn":"五","s":[["Three fives are fifteen.","三个五等于十五。"],["The course lasts five weeks.","这门课程上五周。"],["He arrived around five o'clock.","他大约是五点钟到的。"]]},{"l":"y.ear","p":"j.ɪə","cn":"年纪；年（只要求理解）","s":[["I'm fourteen years old.","我14岁。"],["Black is out this year.","今年黑色不时兴了。"],["I've known David for 20 years.","我认识戴维已有20年了。"]]},{"l":"o.n.e","p":"wʌ.n.-","cn":"一","s":[["No one doubted his ability.","没有人怀疑他的能力。"],["Listen, I finish at one.","听着，我一点钟结束。"],["Only one carry-on is allowed.","随身只能携带一个小包。"]]},{"l":"t.w.o","p":"t.-.uː","cn":"二","s":[["Two files have gone missing.","两个档案不见了。"],["The journey time is two hours.","旅程时间为两个小时。"],["The two factors are directly linked.","这两个因素直接联系在一起。"]]},{"l":"th.r.ee","p":"θ.r.iː","cn":"三","s":[["Three fives are fifteen.","三个五等于十五。"],["She has three world titles.","她已获得三项世界冠军。"],["The car crash claimed three lives.","那次撞车事故导致三人死亡。"]]},{"l":"f.our","p":"f.ɔː","cn":"四","s":[["They have four satellite channels.","他们有4个卫星频道。"],["Four quarters make a whole.","四个四分之一构成一个整体。"],["There's only four days left.","只剩下四天了。"]]},{"l":"t.e.n","p":"t.e.n","cn":"十","s":[["It's ten past twelve.","现在十二点十分。"],["We're leaving round about ten.","我们十点钟左右出发。"],["I tend to work in bursts.","我的工作劲头往往是一阵一阵的。"]]},{"l":"s.i.x","p":"s.ɪ.ks","cn":"六","s":[["It's gone six o'clock already.","过了六点了。"],["I generally get up at six.","我一般六点钟起床。"],["Six goes into thirty five times.","6除30得5。"]]},{"l":"s.e.v/e.n","p":"ˈs.e.v/ə.n","cn":"七","s":[["She's seven months gone.","她怀孕七个月了。"],["We started German in year seven.","我们在七年级开始学习德语。"],["I'll call for you at seven o'clock.","我7点钟去接你。"]]},{"l":"eigh.t","p":"eɪ.t","cn":"八","s":[["Wake up! It's eight o'clock.","醒醒吧！已经八点钟了。"],["The cut needed eight stitches.","这道伤口需要缝八针。"],["Achcha! We'll meet at eight.","好吧！我们八点钟见。"]]},{"l":"n.i.n.e","p":"n.aɪ.n.-","cn":"九","s":[["Everything changed after nine-eleven.","九一一事件发生后，一切都改变了。"],["They have two children aged six and nine.","他们有两个小孩，一个六岁，一个九岁。"],["What do you get if you multiply six by nine?","6乘以9得多少？"]]},{"l":"o.'/c.l.o.ck","p":"ə.-/ˈk.l.ɒ.k","cn":"（表示整点）……点钟（只要求理解）","s":[["It's gone six o'clock already.","过了六点了。"],["Wake up! It's eight o'clock.","醒醒吧！已经八点钟了。"],["He arrived around five o'clock.","他大约是五点钟到的。"]]},{"l":"c.u.t","p":"k.ʌ.t","cn":"切块（只要求理解）","s":[["Cut up the bananas.","把这些香蕉切碎。"],["I cut up these apples.","我把这些苹果切碎。"],["Tall trees cut out the sunlight.","高高的树木遮住了阳光。"]]},{"l":"ea.t","p":"iː.t","cn":"吃（只要求理解）","s":[["They'll eat almost anything.","他们几乎什么都吃。"],["The giraffe eats leaves.","长颈鹿吃树叶。"],["People eat when they're depressed.","人们会在沮丧时吃东西。"]]},{"l":"c.a.k.e","p":"k.eɪ.k.-","cn":"蛋糕（只要求理解）","s":[["This cake is very filling.","这种饼很能填饱肚子。"],["Can you freeze this cake?","你能不能把这个蛋糕冷藏起来？"],["She cut the cake into fifths.","她把蛋糕切成五块。"]]}]}]},{"id":"pep3b","name":"人教 三年级下册（新教材）","units":[{"name":"Unit 1 Meeting new people","words":[{"l":"wh.ere","p":"w.eə","cn":"在哪里；到哪里（只要求理解）","s":[["Where are we heading?","我们要往哪儿去？"],["Where's the nearest bank?","最近的银行在哪儿？"],["Where do you live?","你住在什么地方？"]]},{"l":"f.r.o.m","p":"f.r.ɒ.m","cn":"（表示来源）来自，从……来（只要求理解）","s":[["Stay away from windows.","远离窗户。"],["Looking across from here.","从这里看过去。"],["Interest rates rise from 4% to 5%.","利率从4%上升到5%。"]]},{"l":"a/b.ou.t","p":"ə/ˈb.aʊ.t","cn":"关于；大约（只要求理解）","s":[["Wine contains about 10% alcohol.","葡萄酒含有约10%的酒精。"],["What about Barber Jones?","那巴伯·琼斯呢？"],["I'm definite about this.","我对这事毫无疑问。"]]},{"l":"t.o/d.ay","p":"t.ə/ˈd.eɪ","cn":"今天（只要求理解）","s":[["Who's on duty today?","今天谁值班？"],["She's much better today.","她今天好多了。"],["I feel absolutely terrific today!","我今天的感觉真是好极了！"]]},{"l":"t.ea.ch/er","p":"ˈt.iː.tʃ/ə","cn":"教师","s":[["She's a very capable teacher.","她是一位能力很强的教师。"],["These teachers need special training.","这些教师需要专门的培训。"],["I'm a middle school teacher.","我是一个中学教师。"]]},{"l":"s.t.u/d.e.n.t","p":"ˈs.t.juː/d.ə.n.t","cn":"学生","s":[["She's a student at Sussex University.","她是萨塞克斯大学的学生。"],["Each student makes only one item themselves.","每个学生自己只做一项。"],["No student is to leave the room.","学生一律不许离开这房间。"]]},{"l":"a.f/t.er","p":"ˈɑː.f/t.ə","cn":"在……后面（只要求理解）","s":[["We'll leave after lunch.","我们将在午饭后动身。"],["She arrived shortly after us.","我们刚到不多会儿她就到了。"],["Everything changed after nine-eleven.","九一一事件发生后，一切都改变了。"]]},{"l":"wh.o","p":"h.uː","cn":"谁；什么人（只要求理解）","s":[["Who's on duty today?","今天谁值班？"],["Who's getting the lunch?","谁在做中午饭？"],["Who's chairing the meeting?","谁主持这次会议？"]]},{"l":"g.ir.l","p":"ɡ.ɜː.l","cn":"女孩","s":[["You're a big girl now.","你现在已长成大姑娘了。"],["My dear girl, you're wrong.","我亲爱的姑娘，你错了。"],["Boys and girls may behave differently.","男孩儿和女孩儿的表现可能不同。"]]},{"l":"n.eigh/b.our","p":"ˈn.eɪ/b.ə","cn":"邻居（只要求理解）","s":[["Britain's nearest neighbour is France.","英国最近的邻国是法国。"],["This neighbour crewed on a ferryboat.","这位邻居在一艘渡船上当船员。"],["They don't mix much with the neighbours.","他们不怎么与邻居交往。"]]},{"l":"b.oy","p":"b.ɔɪ","cn":"男孩","s":[["Boys and girls may behave differently.","男孩儿和女孩儿的表现可能不同。"],["He's the manager's blue-eyed boy.","他备受经理的青睐。"],["The boys climbed over the wall.","那些男孩翻过了那堵墙。"]]},{"l":"w.o.m/a.n","p":"ˈw.ʊ.m/ə.n","cn":"成年女子；妇女","s":[["What does the woman imply?","这位女士在暗示什么？"],["She's a very attractive woman.","她是个非常迷人的女子。"],["The blow chipped the woman's tooth.","这一击把那个女人的牙齿打掉了一小块。"]]},{"l":"m.a.n","p":"m.æ.n","cn":"成年男子；男人","s":[["What does the man imply?","男子暗示什么？"],["He's a very clever man.","他是个很聪明的人。"],["The man made his escape.","那个人逃走了。"]]},{"l":"M/r","p":"ˈmɪs/tə","cn":"（用于男子的姓氏或姓名前）先生（只要求理解）","s":[["Good God, it's Mr. Harper!","天哪，是哈珀先生！"],["Good morning. Good morning, Mr. Green.","早上好。早上好，格林先生。"],["There's a Mrs Green to see you.","有位格林太太要见你。"]]},{"l":"c.l.a.ss/m.a.t.e","p":"ˈk.l.ɑː.s/m.eɪ.t.-","cn":"同班同学（只要求理解）","s":[["My classmate is eighteen.","我的同学十八岁。"],["My classmate has many notebooks.","我同学有许多本子。"],["This is my classmate, Andy.","安迪，这是我同学。"]]},{"l":"h.e","p":"h.iː","cn":"他（只要求理解）","s":[["He works in insurance.","他在保险业工作。"],["He's a fascinating person.","他是个魅力十足的人。"],["He paused before answering.","他在回答前停了下来。"]]},{"l":"a.l/s.o","p":"ˈɔː.l/s.əʊ","cn":"也（只要求理解）","s":[["You can also make raisin scones.","你也可以做葡萄干烤饼。"],["The sofa also functions as a bed.","这沙发还可当床用。"],["Also, you can watch different people pass by.","此外，你可以看到不同的人经过。"]]},{"l":"E.n.g/l.i.sh","p":"ˈɪ.ŋ.ɡ/l.ɪ.ʃ","cn":"英语的；英语（只要求理解）","s":[["He doesn't speak English.","他不说英语。"],["He speaks excellent English.","他英语说得棒极了。"],["Do you speak English?","你会说英语吗？"]]},{"l":"sh.e","p":"ʃ.iː","cn":"她（只要求理解）","s":[["She's the artistic type.","她是艺术家一类的人。"],["She tried extra hard.","她特别努力。"],["Why must she interrupt?","她为什么偏要打断呢？"]]},{"l":"v.e.r/y","p":"ˈv.e.r/i","cn":"很；非常；十分（只要求理解）","s":[["Enthusiasm is very catching.","热情是非常具有感染力的。"],["You look very nice.","你很好看。"],["He seemed very worried.","他似乎非常担忧。"]]},{"l":"U/K","p":"ˌjuː/ˈkeɪ","cn":"英国","s":[["Who distributes our products in the UK?","谁在英国经销我们的产品？"],["The UK has refused to recognize the new regime.","英国已拒绝承认这个新的政权。"],["The UK leant towards the US proposal.","英国倾向于美国的提案。"]]},{"l":"Ch.i/n.a","p":"ˈtʃ.aɪ/n.ə","cn":"中国","s":[["Go on a vacation to China.","去中国度假吧。"],["Do you ever want to go back to China?","你想过回中国去吗？"],["China is also actively developing high-speed maglev trains.","中国也在积极发展高速磁悬浮列车。"]]},{"l":"C.a.n/a/d.a","p":"ˈk.æ.n/ə/d.ə","cn":"加拿大","s":[["Until 2004, she lived in Canada.","到2004年为止，她一直住在加拿大。"],["My aunt lives in Canada.","我的姑母住在加拿大。"],["They started life anew in Canada.","他们在加拿大开始新生活。"]]},{"l":"U/S/A","p":"ˌjuː/es/ˈeɪ","cn":"美国","s":[["The server is in the USA.","服务器在美国。"],["Do you need a visa for the USA?","你需要美国签证吗？"],["I bought a copy of \"USA Today\" from a street-corner machine.","我从售货机上买了一份《今日美国》。"]]}]},{"name":"Unit 2 My words and actions","words":[{"l":"h.a.s","p":"h.æ.z","cn":"（have的第三人称单数形式）具有（某种外表、特性或特征）（只要求理解）","s":[["My snowman has gone.","我的雪人不见了。"],["Why has the engine stopped?","发动机怎么停了？"],["Has your headache gone yet?","你还头痛吗？"]]},{"l":"l.o.ng","p":"l.ɒ.ŋ","cn":"（长度或距离）长的","s":[["The long journey tired him.","漫长的旅程使他疲倦。"],["She usually wears long skirts.","她通常穿长裙。"],["He longed for Pat to phone.","他期盼着帕特来电话。"]]},{"l":"b.o.d/y","p":"ˈb.ɒ.d/i","cn":"身体（只要求理解）","s":[["Let your body relax.","让你的身体放松。"],["The BBC is a corporate body.","英国广播公司为法人团体。"],["He covered up the body with a sheet.","他用一条布单把尸体盖上了。"]]},{"l":"sh.or.t","p":"ʃ.ɔː.t","cn":"短的；个子矮的","s":[["Short skirts are back.","短裙又流行起来了。"],["We've run short of milk.","我们牛奶不够了。"],["Short hair really becomes you.","你理短发的确很帅。"]]},{"l":"l.e.g","p":"l.e.ɡ","cn":"腿（只要求理解）","s":[["His leg was getting better.","他的腿在渐渐恢复。"],["His legs were covered in mud.","他的双腿沾满了泥。"],["His leg fractured in two places.","他的一条腿有两处骨折。"]]},{"l":"r.igh.t","p":"r.aɪ.t","cn":"（意见或判断）准确，确切，恰当（只要求理解）","s":[["Is everything all right?","一切都好吗？"],["I'll be right back.","我马上就回来。"],["Right! Let's get going.","行了！我们走吧。"]]},{"l":"f.a.t","p":"f.æ.t","cn":"肥的；肥胖的","s":[["This dress makes me look fat.","这衣服我穿着显胖。"],["Rubbish! You're not fat.","瞎说！你并不胖。"],["They accumulate essentially no body fat.","它们基本上不积累身体脂肪。"]]},{"l":"th.i.n","p":"θ.ɪ.n","cn":"瘦的","s":[["A thin layer of dust covered everything.","所有的物品上都积了薄薄的一层灰尘。"],["My patience is wearing thin.","我要忍耐不住了。"],["The sheets have worn thin.","床单已经磨薄了。"]]},{"l":"s.l.ow","p":"s.l.əʊ","cn":"缓慢的；慢的","s":[["Economic growth has slowed a little.","经济增长稍有减缓。"],["The horse slowed to a walk.","那匹马慢下来缓步而行。"],["Firstly, it's expensive, and secondly, it's too slow.","首先是价格贵，其次，速度太慢。"]]},{"l":"l.o.v.e","p":"l.ʌ.v.-","cn":"喜爱；爱（只要求理解）","s":[["Kids love dressing up.","孩子们都喜欢装扮成别人玩儿。"],["I'll love you forever!","我永远爱你！"],["I love to bake.","我喜欢烤点心。"]]},{"l":"t.ai.l","p":"t.eɪ.l","cn":"尾；尾巴（只要求理解）","s":[["The tail tapered to a rounded tip.","尾部越来越细，最后成了个圆尖。"],["The pony swished its tail.","小马刷刷地甩着尾巴。"],["The dog ran up, wagging its tail.","那条狗摇着尾巴跑上前去。"]]},{"l":"h.er","p":"h.ɜː","cn":"她；她的（只要求理解）","s":[["Her heart beat faster.","她的心跳加快。"],["She likes her job.","她爱她的工作。"],["Her toes turn out.","她的脚趾向外撇。"]]},{"l":"g.i.f.t","p":"ɡ.ɪ.f.t","cn":"礼物（只要求理解）","s":[["I carefully packed up the gifts.","我小心翼翼地把礼品包好。"],["Is this gift a Trojan horse?","这个礼物该不会是特洛伊木马吧？"],["She has a great gift for music.","她极有音乐天赋。"]]},{"l":"p.i.c/ture","p":"ˈp.ɪ.k/tʃə","cn":"图画；绘画","s":[["He colored the picture with crayon.","他用蜡笔给画上色。"],["He coloured the picture with crayon.","他用蜡笔给画上色。"],["His pictures don't fit into any category.","他的画哪一类也算不上。"]]},{"l":"c.ar.d","p":"k.ɑː.d","cn":"贺卡；慰问卡；卡片","s":[["Kids used to trade baseball cards.","孩子们过去常互相交换棒球卡片。"],["Does the hotel take credit cards?","这家旅馆接受信用卡付款吗？"],["Here's my card. You may need me.","这是我的名片。你可能会需要我。"]]},{"l":"s.i.ng","p":"s.ɪ.ŋ","cn":"唱（歌）；演唱","s":[["Can white girls sing the blues?","白人女孩会唱蓝调吗？"],["I like dancing, singing, and drawing.","我喜欢跳舞、唱歌和画画。"],["She usually sings in the shower.","她常常边冲澡边唱歌。"]]},{"l":"d.a.n.c.e","p":"d.ɑː.n.s.-","cn":"跳舞","s":[["Come on Doreen, let's dance.","来吧，多琳，我们跳舞吧。"],["The dance ends at sunset.","舞会在日落时结束。"],["We spontaneously started to dance.","我们情不自禁地跳起舞来。"]]},{"l":"t.a.l.k","p":"t.ɔː.-.k","cn":"说话；讲话；谈话（只要求理解）","s":[["The assistant carried on talking.","那个助理接着谈了下去。"],["It's a comfort talking to you.","与你谈谈是一种安慰。"],["I'd sooner not talk about it.","我宁愿不谈它。"]]},{"l":"f.a.c.e","p":"f.eɪ.s.-","cn":"脸；面孔（只要求理解）","s":[["Our house faces south.","我们的房子面朝南。"],["I never forget a face.","见过的面孔我从不忘记。"],["His face burned with shame.","他的脸因羞愧而发烫。"]]},{"l":"a.ll","p":"ɔː.l","cn":"所有；全部（只要求理解）","s":[["Is everything all right?","一切都好吗？"],["It's all right. Don't cry.","不要紧，别哭了。"],["Are you feeling all right?","你感觉还好吗？"]]},{"l":"s.o.ng","p":"s.ɒ.ŋ","cn":"歌；歌曲（只要求理解）","s":[["They ended the play with a song.","他们以一首歌曲结束了这出戏。"],["The melancholy song died away.","哀婉的歌声渐渐消失了。"],["Who owns the copyright on this song?","谁拥有这首歌曲的版权？"]]},{"l":"or","p":"ɔː","cn":"或；或者；还是（只要求理解）","s":[["Are they Catholic or Protestant?","他们是天主教徒还是新教徒？"],["\"Tea or coffee?\" John asked.","“喝茶还是喝咖啡？” 约翰问。"],["Would you prefer red or white?","你喜欢喝红葡萄酒还是白葡萄酒？"]]},{"l":"s.o","p":"s.əʊ","cn":"（表示大小或数量）这么，那么（只要求理解）","s":[["Shame, she's so cute!","哇，她简直是太漂亮了！"],["You're coming? I'm so pleased.","你要来呀？我太高兴了。"],["Children can be so cruel.","孩子也会这么残忍。"]]},{"l":"m.u.ch","p":"m.ʌ.tʃ","cn":"许多；大量（只要求理解）","s":[["She's much better today.","她今天好多了。"],["Much remains to be done.","还有很多事要去做。"],["There isn't much mail today.","今天邮件不多。"]]}]},{"name":"Unit 3 Tools and senses for learning","words":[{"l":"e/r.a/s.er","p":"ɪ/ˈr.eɪ/z.ə","cn":"橡皮（只要求理解）","s":[["My eraser is missing.","我的橡皮不见了。"],["I hide the eraser in her boot.","我把橡皮擦藏进了她的靴子里。"],["On the teacher's desk there's an eraser.","在老师的桌上有一块橡皮擦。"]]},{"l":"f.i.n.d","p":"f.aɪ.n.d","cn":"找到；找回（只要求理解）","s":[["I find cooking very relaxing.","我发现烹饪非常令人放松。"],["She finds it boring at home.","她觉得待在家里无聊。"],["You'll find some in the drawer.","你会在抽屉里找到一些。"]]},{"l":"r.u/l.er","p":"ˈr.uː/l.ə","cn":"直尺","s":[["He cracked me on the head with a ruler.","他用尺子猛击我的头部。"],["The city's rulers skilfully played both powers off against each other.","这座城市的统治者巧妙地挑起两派势力之间的争斗。"],["The ruler cracked and splintered into pieces.","尺子裂了，碎成了片。"]]},{"l":"p.e.n","p":"p.e.n","cn":"钢笔","s":[["Here, I'll lend you my pen.","喏，我把钢笔借给你。"],["Can I borrow a pen please?","我可以借支笔吗？"],["Can I borrow a pen from you?","我可以借用你的钢笔吗？"]]},{"l":"p.e.n/c.i.l","p":"ˈp.e.n/s.ə.l","cn":"铅笔","s":[["Here's a pencil-box.","这是一个铅笔盒。"],["Put away your pencil box!","把你的铅笔盒收起来！"],["They pause and chew their pencils.","他们停了下来，咬着铅笔。"]]},{"l":"b.oo.k","p":"b.ʊ.k","cn":"书；书籍","s":[["They publish reference books.","他们出版参考书。"],["Early booking is recommended.","请提早订票。"],["I'm just finishing my book.","眼下我正在完成我的一本书。"]]},{"l":"b.a.g","p":"b.æ.ɡ","cn":"包；袋","s":[["Someone's left their bag behind.","有人把包落下了。"],["Carry this bag—it's the lightest.","你拿这个包—它最轻。"],["Get in! There's bags of room.","进来吧！地方很空。"]]},{"l":"p.a/p.er","p":"ˈp.eɪ/p.ə","cn":"纸","s":[["He folded the paper carefully.","他小心地把那张纸折起来。"],["The review is in today's paper.","这篇评论刊登在今天的报纸上。"],["I'll get a pencil and paper.","我去拿铅笔和纸。"]]},{"l":"th.e.s.e","p":"ð.iː.z.-","cn":"这些（只要求理解）","s":[["These jeans need washing.","这条牛仔裤该洗了。"],["These colours are pleasing.","这些色彩令人愉快。"],["These chopsticks are beautiful!","这些筷子真漂亮！"]]},{"l":"s.ee","p":"s.iː","cn":"看见","s":[["We'll see to that.","我们会注意的。"],["I'll see you tomorrow evening.","我明天晚上见你。"],["I'll see you Thursday week.","我们下星期四见。"]]},{"l":"s.m.e.ll","p":"s.m.e.l","cn":"闻（气味）","s":[["Where's that smell coming from?","那种气味是哪里来的？"],["Taste and smell are closely connected.","味觉和嗅觉有密切的联系。"],["The banana smells good.","这个香蕉闻起来很香。"]]},{"l":"t.a.s.t.e","p":"t.eɪ.s.t.-","cn":"尝（味道）","s":[["This pancake tastes delicious.","这煎饼尝起来味道不错。"],["The leaves taste rather bitter.","这些叶子尝起来相当苦。"],["The dumpling tastes really good.","这饺子尝起来味道很好。"]]},{"l":"h.ear","p":"h.ɪə","cn":"听见；听到","s":[["We heard a lion roar.","我们听见了狮子的吼声。"],["I can hear someone calling.","我听见有人在呼叫。"],["We heard him drive away.","我们听到他驱车离去了。"]]},{"l":"t.ou.ch","p":"t.ʌ.tʃ","cn":"触摸；碰","s":[["Let's keep in touch.","咱们保持联系。"],["Don't touch that plate—it's hot!","别碰那个盘子，烫手！"],["No! Don't touch it! It's hot.","别！别碰它！很烫。"]]},{"l":"n.o.s.e","p":"n.əʊ.z.-","cn":"鼻；鼻子（只要求理解）","s":[["A fly landed on his nose.","一只苍蝇落在他的鼻子上。"],["She punched him on the nose.","她一拳打中了他的鼻子。"],["I don't look down my nose at comedy.","我不轻视喜剧。"]]},{"l":"t.o.ng.ue","p":"t.ʌ.ŋ.-","cn":"舌；舌头（只要求理解）","s":[["Stick out your tongue, Richard.","理查德，伸出你的舌头。"],["He has a sharp tongue.","他说话尖酸刻薄。"],["The dog's tongue was hanging out.","狗的舌头耷拉在外面。"]]},{"l":"c.l.a.ss","p":"k.l.ɑː.s","cn":"课；班级（只要求理解）","s":[["He's always cutting class.","他总是旷课。"],["First class costs more.","第一类邮件邮资较高。"],["It's our second English class.","这是我们第二节英语课。"]]},{"l":"i.n c.l.a.ss","p":"ɪ.n k.l.ɑː.s","cn":"在课堂上（只要求理解）","s":[["There is lots of reading in class.","课上有大量阅读。"]]},{"l":"c.o.m/p.u/t.er","p":"k.ə.m/ˈp.juː/t.ə","cn":"计算机；电脑（只要求理解）","s":[["The computer's down again.","那台电脑又死机了。"],["My computer keeps going funny.","我的计算机老出故障。"],["Please visit our computer room first.","请首先访问我们的计算机房。"]]},{"l":"l.ear.n","p":"l.ɜː.n","cn":"学；学习（只要求理解）","s":[["Every individual learns differently.","每个人的学习方式都不一样。"],["I'm learning how to budget.","我正在学习怎样编制预算。"],["He'd never learned to read.","他一直没有学会阅读。"]]}]},{"name":"Unit 4 Healthy food","words":[{"l":"b.r.ea.k/f.a.s.t","p":"ˈb.r.e.k/f.ə.s.t","cn":"早餐；早饭（只要求理解）","s":[["Your breakfast is coming soon.","你的早餐很快就到。"],["Becky doesn't often eat breakfast.","贝基经常不吃早餐。"],["Here I come for breakfast! Yum!","我来吃早饭啦！好好吃呀！"]]},{"l":"t.i.m.e","p":"t.aɪ.m.-","cn":"时间（只要求理解）","s":[["It's time for dinner.","该吃饭了。"],["Time is another important consideration.","时间是另一个需要考虑的重要因素。"],["The baby loves bath time.","这婴儿喜欢洗澡的时候。"]]},{"l":"b.r.ea.d","p":"b.r.e.d","cn":"面包","s":[["She made her own bread.","她自己做了面包。"],["There's bread on the table. Help yourself.","桌上有面包。你自己拿吧。"],["We stopped and bought some bread.","我们停下来买了一些面包。"]]},{"l":"e.gg","p":"e.ɡ","cn":"（作食物用的）蛋；鸡蛋","s":[["The male and female birds take turns in sitting on the eggs.","雄鸟和雌鸟轮流伏窝。"],["The nucleus is removed from the egg cell.","细胞核已经从卵细胞中移除。"],["Do you want bacon and eggs for breakfast ?","你早饭要吃熏咸肉和鸡蛋吗？"]]},{"l":"m.i.l.k","p":"m.ɪ.l.k","cn":"（牛或羊等的）奶","s":[["Is this milk fresh?","这是鲜牛奶吗？"],["She's gone for some milk.","她买牛奶去了。"],["We've run short of milk.","我们牛奶不够了。"]]},{"l":"n.oo/d.le","p":"ˈn.uː/d.l","cn":"（常用复数）面条","s":[["I cooked noodles yesterday.","我昨天做了面条。"],["Would you prefer rice or noodles?","你喜欢吃米饭还是面条？"],["They have two restaurants that purvey dumplings and chicken noodle soup.","有两家供应饺子和鸡肉汤面的餐馆。"]]},{"l":"j.ui.c.e","p":"dʒ.uː.s.-","cn":"果汁","s":[["Would you care for some orange juice?","你想要些橙汁吗？"],["The juice contains no artificial preservatives.","这种果汁不含人工防腐剂。"],["The juice contains no added sugar.","这种果汁没有加糖。"]]},{"l":"r.i.c.e","p":"r.aɪ.s.-","cn":"大米","s":[["Our main export is rice.","我们主要出口大米。"],["We eat rice every single day.","我们天天吃米饭。"],["Would you prefer rice or noodles?","你喜欢吃米饭还是面条？"]]},{"l":"m.ea.t","p":"m.iː.t","cn":"肉","s":[["What's wrong with eating meat?","吃肉有什么不对？"],["He's a real meat-and-potatoes guy.","他是个十分崇尚简朴的人。"],["Is cold meat and salad OK for lunch?","午饭吃冷肉和色拉行吗？"]]},{"l":"v.e.g.e/t.a/b.le","p":"ˈv.e.dʒ.-/t.ə/b.l","cn":"蔬菜","s":[["The carrot is his favorite vegetable.","胡萝卜是他最喜欢的蔬菜。"],["You need to eat up your vegetables.","你要把你的青菜吃光。"],["They make soup and canned vegetables and such.","他们做汤和蔬菜罐头之类的。"]]},{"l":"h.ea.l.th/y","p":"ˈh.e.l.θ/i","cn":"健康的（只要求理解）","s":[["He has a healthy appetite.","他有健康的胃口。"],["She's fanatical about healthy eating.","她对健康饮食着了迷。"],["She was delivered of a healthy boy.","她生下一个健康的男孩儿。"]]},{"l":"p.l.a.t.e","p":"p.l.eɪ.t.-","cn":"盘子（只要求理解）","s":[["Be careful—the plates are hot.","当心—盘子烫手。"],["Sprinkle onion and cheese in the pie plate.","把洋葱和干酪撒在饼盘中。"],["He cut up the meat on his plate.","他在盘子上把肉切成小块。"]]},{"l":"s.ou.p","p":"s.uː.p","cn":"汤","s":[["Yum, the soup is nice.","嗯~这汤很好喝。"],["The soup has very little taste.","这汤没什么味道。"],["There's a hair in my soup.","我的汤里有根毛。"]]},{"l":"f.r.ui.t","p":"f.r.uː.t","cn":"水果","s":[["The fruit are small and round.","这种水果小而圆。"],["Wash off fruits and vegetables with cool running water.","“洗刷水果和蔬菜要用冷的自来水”。"],["Sugar occurs naturally in fruit.","水果天然含糖分。"]]},{"l":"c.o.l/our/f.u.l","p":"ˈk.ʌ.l/ə/f.ə.l","cn":"五彩缤纷的（只要求理解）","s":[["The seas around Bermuda are full of colourful corals and fantastic fish.","百慕大周围的海域中到处都是五彩的珊瑚虫和奇异的鱼类。"],["Colourful streamers and paper decorations had been hung from the ceiling.","五颜六色的飘带和彩纸饰品被挂在天花板上。"]]},{"l":"c.a.n/d.y","p":"ˈk.æ.n/d.i","cn":"糖果（只要求理解）","s":[["Who wants the last piece of candy?","谁想要这最后一块糖？"],["On the outing, she was offered a candy bar.","郊游时，有人给了她一块糖果。"],["Some barrels are red with a white candy stripe on the sides.","有些桶是红色的，边上有白色的糖果条纹。"]]},{"l":"y.u.m/m.y","p":"ˈj.ʌ.m/-.i","cn":"很好吃的（只要求理解）","s":[]}]},{"name":"Unit 5 Old things","words":[{"l":"b.oa.t","p":"b.əʊ.t","cn":"小船；舟","s":[["Happy Dragon Boat Festival!","端午节快乐！"],["They are finely engineered boats.","它们是设计精美的船只。"],["The boat disappeared from sight.","那艘船从视野中消失了。"]]},{"l":"c.oo.l","p":"k.uː.l","cn":"（因时髦、漂亮且与众不同而）酷的，绝妙的（只要求理解）","s":[["That's a cool hat.","那是一顶很酷的帽子。"],["Glass contracts as it cools.","玻璃遇冷收缩。"],["Thank goodness it's cool in here.","谢天谢地，这里很凉爽。"]]},{"l":"k.ee.p","p":"k.iː.p","cn":"保有；留着（只要求理解）","s":[["I'll keep (the) score.","我来记分。"],["This drawer keeps sticking.","这个抽屉老卡住。"],["Please keep this marker.","请保留此标记。"]]},{"l":"a.t","p":"æ.t","cn":"在（某处）（只要求理解）","s":[["The play finished at 10.30.","比赛于10:30结束。"],["I'm good at French.","我的法语很好。"],["Police estimate the crowd at 30 000.","警方估计聚集的人有3万。"]]},{"l":"h.o.m.e","p":"h.əʊ.m.-","cn":"家；住所（只要求理解）","s":[["Let's head back home.","咱们回家吧。"],["Nothing beats home cooking.","什么也比不上家里做的好吃。"],["Let her come home safely!","让她平平安安回家吧！"]]},{"l":"b.a.ll","p":"b.ɔː.l","cn":"球","s":[["The ball curved through the air.","球在空中沿曲线运动。"],["The ball rolled down the hill.","球滚下了山。"],["Peter is good at soccer ball.","皮特擅长足球。"]]},{"l":"d.o.ll","p":"d.ɒ.l","cn":"玩偶；玩具娃娃","s":[["\"Yes, Mom,\" replied Cheryl as she slowly put away her doll.","“是的，妈妈，”谢里尔一边回答，一边慢慢地把她的玩具娃娃收起来。"],["The child was clutching a doll in her hand.","女孩手里紧紧抱着一个玩具娃娃。"],["It's a vinyl doll with movable arms and legs.","这是个胳膊和腿都能活动的乙烯基塑料娃娃。"]]},{"l":"c.ar","p":"k.ɑː","cn":"小汽车；轿车","s":[["That car is ours.","那辆车是我们的。"],["Children need a caring environment.","儿童需要一个充满关怀的环境。"],["The car is parked nearby.","车就停在附近。"]]},{"l":"o.n","p":"ɒ.n","cn":"（覆盖、附着）在……上","s":[["Who's on duty today?","今天谁值班？"],["That's it, carry on!","对啦！继续！"],["Go on doing sports.","继续做运动吧。"]]},{"l":"sh.e.l.f","p":"ʃ.e.l.f","cn":"（复数shelves）架子（只要求理解）","s":[["The shoes go on the shoe shelf.","鞋子应该放在鞋架上。"],["I want the rectangle books on the shelf.","我想要书架上的那本长方形的书。"],["The meat is chemically treated to extend shelf life.","猪肉经过化学处理以延长保存期。"]]},{"l":"i.n","p":"ɪ.n","cn":"在……内；在……中","s":[["He works in insurance.","他在保险业工作。"],["I'm in deadly earnest.","我是非常认真的。"],["I work in advertising.","我在广告业工作。"]]},{"l":"b.o.x","p":"b.ɒ.ks","cn":"盒子（只要求理解）","s":[["Here's a pencil-box.","这是一个铅笔盒。"],["Put away your pencil box!","把你的铅笔盒收起来！"],["Can you help me with this box?","你能帮我搬这个箱子吗？"]]},{"l":"c.a.p","p":"k.æ.p","cn":"帽子","s":[["He often wore a baseball cap.","他经常戴顶棒球帽。"],["I wrote it on the starter cap.","我把它写在启动器盖上了。"],["She screwed the cap back on the jar.","她又把广口瓶的盖子拧上。"]]},{"l":"m.a.p","p":"m.æ.p","cn":"地图","s":[["The map reference is Y4.","地图编号为Y4。"],["Are you any good at map reading?","你会看地图吗？"],["He studied his map, trying to memorize the way to Rose's street.","他研究了地图，努力记住去罗丝家那条街的路。"]]},{"l":"u.n/d.er","p":"ˈʌ.n/d.ə","cn":"在（或到、通过）……下面","s":[["The situation is under control.","局面得到了控制。"],["She dived under the water.","她潜入水下。"],["I hid under the bed.","我躲在床底下。"]]},{"l":"s.t.i.ll","p":"s.t.ɪ.l","cn":"还是；仍然（只要求理解）","s":[["Import duties still average 30%.","进口关税平均仍为30%。"],["Are you still single?","你还是单身吗？"],["She's still learning to read.","她还在学习识字。"]]},{"l":"p.u.t","p":"p.ʊ.t","cn":"放；安置（只要求理解）","s":[["Put away your shoes.","把鞋子放好。"],["She's put her hair up.","她把头发挽在头上。"],["We put out from Liverpool.","我们从利物浦起航。"]]}]},{"name":"Unit 6 Numbers in life","words":[{"l":"f.i.f/t.ee.n","p":"ˌf.ɪ.f/ˈt.iː.n","cn":"十五","s":[["Three fives are fifteen.","三个五等于十五。"],["The average runner can run 2 miles in fifteen minutes.","这名跑步的人水平一般，十五分钟可以跑两英里"],["The talks began some fifteen minutes late.","商谈迟了约十五分钟才开始。"]]},{"l":"t.w.e.l.v.e","p":"t.w.e.l.v.-","cn":"十二","s":[["It's ten past twelve.","现在十二点十分。"],["He retired twelve batters in a row.","他一连使十二个击球手出局。"],["Twelve hours later she was all smiles again.","十二小时之后，她又喜笑颜开了。"]]},{"l":"f.our/t.ee.n","p":"ˌf.ɔː/ˈt.iː.n","cn":"十四","s":[["I'm fourteen years old.","我14岁。"],["\"Fourteen minutes,\" Chris said, taking a peep at his watch.","“十四分钟，”克里斯瞥了一眼手表说道。"],["Women are advised not to drink more than fourteen units of alcohol per week.","建议妇女每周饮酒不超过十四个酒精单位。"]]},{"l":"th.ir/t.ee.n","p":"ˌθ.ɜː/ˈt.iː.n","cn":"十三","s":[["\"Thirteen?\" he guessed wildly.","“十三？”他胡乱猜道。"],["He ran away from home at the age of thirteen.","他十三岁时离家出走。"],["Thirteen is often considered an unlucky number.","十三常被认为是不吉利的数字。"]]},{"l":"e/l.e.v/e.n","p":"ɪ/ˈl.e.v/ə.n","cn":"十一","s":[["Everything changed after nine-eleven.","九一一事件发生后，一切都改变了。"],["It's eleven o'clock at night in Moscow.","现在莫斯科是晚上11点。"],["Charles I ruled for eleven years.","查理一世统治了十一年。"]]},{"l":"t.w.e.n/t.y","p":"ˈt.w.e.n/t.i","cn":"二十","s":[["So that's twenty of each sort, right?","那么，每一种都是二十个，对不对？"],["Twenty-eight is divisible by seven.","二十八可以被七整除。"],["I've been waiting (for) twenty minutes.","我等了二十分钟。"]]},{"l":"s.e.v/e.n/t.ee.n","p":"ˌs.e.v/ə.n/ˈt.iː.n","cn":"十七","s":[["Jenny is seventeen years old.","珍妮17岁。"],["He had confessed to seventeen murders.","他已供认了17项谋杀罪。"],["Nora thought he was seventeen years old.","诺拉觉得他有17岁。"]]},{"l":"s.i.x/t.ee.n","p":"ˌs.ɪ.ks/ˈt.iː.n","cn":"十六","s":[["He worked sixteen hours a day.","他每天工作16个小时。"],["She is sixteen but has a mental age of five.","她十六岁，而智力年龄是五岁。"],["Sixteen times as many men are colour-blind as women.","色盲的男性人数是女性人数的十六倍。"]]},{"l":"eigh/t.ee.n","p":"ˌeɪ/ˈt.iː.n","cn":"十八","s":[["My classmate is eighteen.","我的同学十八岁。"],["His boat is an eighteen-footer.","他的小船长十八英尺。"],["The party was ousted from power after eighteen years.","该党执政十八年后被赶下台。"]]},{"l":"n.i.n.e/t.ee.n","p":"ˌn.aɪ.n.-/ˈt.iː.n","cn":"十九","s":[["They have nineteen days to make up their minds.","他们有十九天的时间来做出决定。"],["It's only nineteen yuan.","它只要十九元。"],["Ten plus nine is nineteen.","十加九是十九。"]]},{"l":"p.i.g/g.y b.a.n.k","p":"ˈp.ɪ.ɡ/-.i b.æ.ŋ.k","cn":"猪形储钱罐（只要求理解）","s":[]},{"l":"p.ay","p":"p.eɪ","cn":"付费（只要求理解）","s":[["Pay attention to costs.","要注意成本。"],["Pay attention to your actions.","注意你的行动。"],["Does your current account pay interest?","你的活期存款账户计息吗？"]]},{"l":"b.a.ck","p":"b.æ.k","cn":"回到原处（只要求理解）","s":[["\"Welcome back,\" she beamed.","“欢迎回来，”她笑容满面地说。"],["Let's head back home.","咱们回家吧。"],["I'll be right back.","我马上就回来。"]]}]}]},{"id":"pep4a","name":"人教 四年级上册（新教材）","units":[{"name":"Unit 1 Helping at home","words":[{"l":"P/E","p":"ˌpiː/ˈiː","cn":"体育（课）（只要求理解）","s":[]},{"l":"j.o.b","p":"dʒ.ɒ.b","cn":"工作；职业（只要求理解）","s":[["She likes her job.","她爱她的工作。"],["She's doing a terrific job.","她活儿干得真棒。"],["She found her job very boring.","她觉得自己的工作很无聊。"]]},{"l":"d.o.c/t.or","p":"ˈd.ɒ.k/t.ə","cn":"医生","s":[["The doctor's on his way.","医生正在路上。"],["I respect him as a doctor.","我尊敬他这个医生。"],["Doctors think he will go blind.","医生们认为他会失明。"]]},{"l":"f.ar.m/er","p":"ˈf.ɑː.m/ə","cn":"农场主；农民","s":[["Farmers worked the fertile valleys.","农民们开垦了这个肥沃的山谷。"],["Farmers grow rice in the rich soil.","农民们在肥沃的土地上种水稻。"],["The land is rented out to other farmers.","这片土地租给别的农民了。"]]},{"l":"n.ur.s.e","p":"n.ɜː.s.-","cn":"护士","s":[["A nurse attended to his needs constantly.","有一位护士经常照料他的需要。"],["They hired a nurse to care for her.","他们雇了个护士来照顾她。"],["He worked as a nurse on the children's ward.","他在儿科病房当护士。"]]},{"l":"o.f/f.i.c.e w.or.k/er","p":"ˈɒ.f/-.ɪ.s.- ˈw.ɜː.k/ə","cn":"公司职员","s":[]},{"l":"f.a.c/t.o.r.y w.or.k/er","p":"ˈf.æ.k/t.-.r.i ˈw.ɜː.k/ə","cn":"工厂工人","s":[]},{"l":"b.u.s/y","p":"ˈb.ɪ.z/i","cn":"忙碌的（只要求理解）","s":[["We're not always this busy!","我们并不总是这么忙！"],["Are you busy next Monday ?","下周一你忙吗？"],["He is too busy to get away.","他忙得没有时间外出度假。"]]},{"l":"t.ire/d","p":"ˈt.aɪə/d","cn":"疲倦的（只要求理解）","s":[["The long journey tired him.","漫长的旅程使他疲倦。"],["She looked pale and tired.","她看起来苍白而疲惫。"],["Babies cry when they are tired.","婴儿疲倦时会哭。"]]},{"l":"ch.ore","p":"tʃ.ɔː","cn":"家庭杂务（只要求理解）","s":[["She sees exercise primarily as an unavoidable chore.","她把锻炼主要看作是不得不做的琐事。"]]},{"l":"c.oo.k","p":"k.ʊ.k","cn":"烹饪；煮","s":[["Nothing beats home cooking.","什么也比不上家里做的好吃。"],["I find cooking very relaxing.","我发现烹饪非常令人放松。"],["They serve good French cooking.","他们供应美味的法国菜。"]]},{"l":"c.l.ea.n","p":"k.l.iː.n","cn":"打扫；干净的（只要求理解）","s":[["Cats are very clean animals.","猫是颇爱干净的动物。"],["I do the cleaning myself.","我自己做打扫卫生的工作。"],["Go clean up and wash up.","去清洁干净，洗干净。"]]},{"l":"r.oo.m","p":"r.uː.m","cn":"房间（只要求理解）","s":[["The rooms had high ceilings.","那些房间的天花板很高。"],["The living room is tiny.","这间起居室极小。"],["The sitting room needs decorating.","客厅需要粉刷。"]]},{"l":"l.oo.k a.f/t.er","p":"l.ʊ.k ˈɑː.f/t.ə","cn":"照顾","s":[["He's very experienced in looking after animals.","他养动物很有经验。"],["I know the Lord will look after him.","我知道上帝会照顾他的。"],["You'll have to play about and look after yourself.","你得自己玩，自己照顾自己。"]]},{"l":"s.w.ee.p","p":"s.w.iː.p","cn":"扫","s":[["Wintry weather continues to sweep across Colorado.","寒冬气候继续席卷科罗拉多州。"],["She is sweeping with a broom.","她在用扫帚扫地。"],["He rushed to greet her, sweeping his arms wide.","他张开双臂舞动着，冲过去迎接她。"]]},{"l":"f.l.oor","p":"f.l.ɔː","cn":"地板；地面","s":[["They live on the floor below.","他们住在下一层楼。"],["There is a good restaurant on the upper floor.","楼上有一家很好的餐馆。"],["Water splashed onto the floor.","水哗的一声泼洒在地板上。"]]},{"l":"t.o/g.e.th/er","p":"t.ə/ˈɡ.e.ð/ə","cn":"在一起；共同（只要求理解）","s":[["Together we earn $60,000 per year.","我们每年总共赚$60000。"],["Multiply 2 and 6 together and you get 12.","2和6相乘得12。"],["We get along just fine together.","我们相处得很融洽。"]]},{"l":"p.eo/p.le","p":"ˈp.iː/p.l","cn":"人；人们（只要求理解）","s":[["People eat when they're depressed.","人们会在沮丧时吃东西。"],["Good evening. How many people?","晚上好，几个人？"],["He started bossing people around.","他开始支使大家了。"]]},{"l":"ch.i.l.d","p":"tʃ.aɪ.l.d","cn":"（复数children）儿童；小孩（只要求理解）","s":[["They desperately wanted a child.","他们非常想要一个孩子。"],["She claims Mark fathered her child.","她声称马克是她孩子的父亲。"],["That child has a very active imagination.","那个小孩想象力十分丰富。"]]}]},{"name":"Unit 2 My friends","words":[{"l":"h.i.s","p":"h.ɪ.z","cn":"他的（只要求理解）","s":[["His hair waves naturally.","他天生一头鬈发。"],["\"What's his name?\"—\"Peter.\"","“他叫什么名字？”—“彼得。”"],["His ears stick out.","他长着一对招风耳。"]]},{"l":"s.t.r.o.ng","p":"s.t.r.ɒ.ŋ","cn":"强壮的","s":[["His wife has a strong personality.","他妻子的个性很强。"],["The play has a very strong cast.","这部剧演员阵容强大。"],["My grandmother is 90 and still going strong.","我奶奶90岁了，还挺硬朗。"]]},{"l":"h.air","p":"h.eə","cn":"头发","s":[["His hair waves naturally.","他天生一头鬈发。"],["Careful—you're messing my hair.","小心—你弄乱我的头发了。"],["He had dark, curly hair.","他有一头黑色卷发。"]]},{"l":"a.l/s.o","p":"ˈɔː.l/s.əʊ","cn":"也（只要求理解）","s":[["You can also make raisin scones.","你也可以做葡萄干烤饼。"],["The sofa also functions as a bed.","这沙发还可当床用。"],["China is also actively developing high-speed maglev trains.","中国也在积极发展高速磁悬浮列车。"]]},{"l":"k.i.n.d","p":"k.aɪ.n.d","cn":"友好的","s":[["I like him, kind of.","我有点儿喜欢他。"],["He's in some kind of trouble.","他遇到了什么麻烦。"],["They sell all kinds of things.","他们出售各种各样的东西。"]]},{"l":"qu.i/e.t","p":"ˈkw.aɪ/ə.t","cn":"文静的","s":[["She remained quiet and controlled.","她沉默不语保持克制。"],["The quiet country roads are ideal for cycling.","安静的乡村道路很适合骑自行车。"],["The bar seemed ominously quiet.","那个酒吧似乎寂静得让人觉得不祥。"]]},{"l":"b.e.s.t","p":"b.e.s.t","cn":"最好的（只要求理解）","s":[["English is my best subject.","英语是我学得最好的一门科目。"],["It's my best ever score.","这是我得到过的最好分数。"],["Laughter is the best medicine.","欢笑是一副良药。"]]},{"l":"r.ea.d","p":"r.iː.d","cn":"阅读","s":[["He'd never learned to read.","他一直没有学会阅读。"],["She's still learning to read.","她还在学习识字。"],["Have you read the contract?","你看过这份合同了吗？"]]},{"l":"Ch.i/n.e.s.e","p":"ˌtʃ.aɪ/ˈn.iː.z.-","cn":"中文；中国人；中国的","s":[["The chef, staff, and managers are all Chinese.","厨师、工作人员和经理都是中国人。"],["Many Japanese and Chinese teas are green teas.","日本和中国的许多茶都是绿茶。"],["They learn Chinese kungfu and the Chinese culture.","他们学习中国功夫和中国文化。"]]},{"l":"p.l.ay","p":"p.l.eɪ","cn":"玩耍","s":[["I enjoy playing basketball.","我喜欢打篮球。"],["They're both playing excellently.","他们演奏得都很棒。"],["The play finished at 10.30.","比赛于10:30结束。"]]},{"l":"g.a.m.e","p":"ɡ.eɪ.m.-","cn":"游戏","s":[["Let's play a different game.","咱们玩点别的游戏吧。"],["It's a favourite game of theirs.","这是他们最喜爱的游戏。"],["Chess is not a game of chance.","国际象棋不是靠运气取胜的。"]]},{"l":"f.oo.t/b.a.ll","p":"ˈf.ʊ.t/b.ɔː.l","cn":"足球运动","s":[["Luckily, we both love football.","幸好我们俩都热爱足球。"],["I like all sports except football.","除足球外我喜欢所有的运动。"],["What does he know about football, anyway?","不管怎么说，他懂什么足球？"]]},{"l":"b.a.s/k.e.t/b.a.ll","p":"ˈb.ɑː.s/k.ɪ.t/b.ɔː.l","cn":"篮球运动（只要求理解）","s":[["I enjoy playing basketball.","我喜欢打篮球。"],["He coaches basketball and soccer.","他执教篮球和足球。"],["I used to play basketball.","我过去常打篮球。"]]},{"l":"a.l/w.ay.s","p":"ˈɔː.l/w.eɪ.z","cn":"总是（只要求理解）","s":[["I've always hated cabbage.","我从来都讨厌吃卷心菜。"],["That phone's always ringing.","那个电话总是响个不停。"],["He's always cutting class.","他总是旷课。"]]}]},{"name":"Unit 3 Places we live in","words":[{"l":"a.f/t.er/n.oo.n","p":"ˌɑː.f/t.ə/ˈn.uː.n","cn":"下午（只要求理解）","s":[["Good afternoon, Miss Maria.","玛丽亚小姐，下午好。"],["It's cloudy this afternoon.","今天下午多云。"],["He's arriving in the afternoon.","他将于下午到达。"]]},{"l":"th.ere","p":"ð.eə","cn":"（表示存在或发生）；在那里（只要求理解）","s":[["Ah, there you are.","啊，你原来在这儿。"],["There are no absolute rules.","没有绝对的准则。"],["Hello, is there anybody there?","喂，那里有人吗？"]]},{"l":"p.l.ay/g.r.ou.n.d","p":"ˈp.l.eɪ/ɡ.r.aʊ.n.d","cn":"游乐场；操场","s":[["The resort is a playground of the rich and famous.","这个度假胜地是富翁名流的娱乐场所。"],["Sam pushed me over in the playground.","萨姆在运动场上把我推倒了。"],["The girls were skipping in the playground.","姑娘们在操场上跳绳。"]]},{"l":"p.ar.k","p":"p.ɑː.k","cn":"公园","s":[["I had trouble parking.","我停车有困难。"],["The car is parked nearby.","车就停在附近。"],["I usually cycle home through the park.","我通常骑自行车穿过公园回家。"]]},{"l":"o/v.er","p":"ˈəʊ/v.ə","cn":"在……的远端（或对面）（只要求理解）","s":[["Thank goodness that's over!","谢天谢地，事情总算过去了！"],["Well, thank goodness that's over!","好啦，谢天谢地，这件事总算过去了！"],["His dark head bent over her.","他对她低下他那黑发的头。"]]},{"l":"h.o.s/p.i/t.a.l","p":"ˈh.ɒ.s/p.ɪ/t.ə.l","cn":"医院","s":[["He died in (the) hospital.","他在医院里去世。"],["I had to go to hospital.","我得去医院看病。"],["The VA hospital needs renovation.","退伍军人管理局的医院需要进行整修。"]]},{"l":"sh.o.p","p":"ʃ.ɒ.p","cn":"商店","s":[["I do a weekly shop at the supermarket.","我一周上超市一次。"],["Shops close only on Christmas Day and New Year's Day.","商店只在圣诞日和元旦停业。"],["Infuriatingly, the shop had just closed.","真让人生气，商店刚刚关门。"]]},{"l":"t.oi/l.e.t","p":"ˈt.ɔɪ/l.ə.t","cn":"厕所；卫生间","s":[["She had gone in to use the toilet.","她已经去上洗手间了。"],["He heard the flush of a toilet.","他听到马桶的冲水声。"],["I knelt by the toilet and gagged.","我跪在马桶边作呕。"]]},{"l":"b.u.s s.t.o.p","p":"b.ʌ.s s.t.ɒ.p","cn":"公共汽车站","s":[]},{"l":"l.i/b.r.a/r.y","p":"ˈl.aɪ/b.r.ə/r.i","cn":"图书馆（只要求理解）","s":[["The library is all on one level.","图书馆全部在同一层楼上。"],["A librarian works in a library.","图书馆管理员在图书馆里工作。"],["Library Cards expire after four years.","图书馆借书证四年后到期。"]]},{"l":"s.p.or.t","p":"s.p.ɔː.t","cn":"体育运动","s":[["What's your favourite sport?","你最喜欢哪一项体育运动？"],["Go on doing sports.","继续做运动吧。"],["I'm not interested in sport.","我对体育运动不感兴趣。"]]},{"l":"w.a.l.k","p":"w.ɔː.-.k","cn":"散步；行走","s":[["He walked through customs.","他步行通过了海关。"],["I walked into town.","我走进了市中心。"],["I prefer walking to climbing.","我喜欢散步多于喜欢爬山。"]]},{"l":"c.o/mm.u/n.i/t.y","p":"k.ə/ˈm.juː/n.ə/t.i","cn":"社区（只要求理解）","s":[["The centre will serve the whole community.","这个中心将为整个社区提供服务。"],["The sense of community is lost.","团体意识没有了。"],["There's not much community spirit around here.","这里集体精神比较薄弱。"]]},{"l":"f.a/v.ou/r.i.t.e","p":"ˈf.eɪ/v.ə/r.ɪ.t.-","cn":"最喜欢的（只要求理解）","s":[["What's your favourite colour?","你最喜欢的颜色是什么？"],["What's your favourite sport?","你最喜欢哪一项体育运动？"],["Who is your favourite author?","你最喜欢哪位作家？"]]},{"l":"p.l.a.c.e","p":"p.l.eɪ.s.-","cn":"地方；场所（只要求理解）","s":[["This place is heavenly.","这个地方好极了。"],["He finished in third place.","他得了第三名。"],["Elections take place every year.","每年都进行各项选举。"]]},{"l":"ph.o/t.o","p":"ˈf.əʊ/t.əʊ","cn":"照片（只要求理解）","s":[["Photos make useful teaching aids.","照片可以成为有用的教具。"],["The photo wasn't very clear.","这张照片不太清晰。"],["That photo doesn't do you justice.","那张照片不如你本人好看。"]]},{"l":"s.t.o.r/y","p":"ˈs.t.ɔː.r/i","cn":"故事（只要求理解）","s":[["The story goes like this.","故事是这样的。"],["The story has a happy ending.","故事的结局很圆满。"],["The story is almost certainly false.","这个故事几乎肯定是虚构的。"]]},{"l":"b.uy","p":"b.aɪ","cn":"购买（只要求理解）","s":[["Is she buying a storybook?","她正在买一本故事书吗？"],["We're considering buying a new car.","我们在考虑买一辆新车。"],["Why don't you buy some jade?","你为什么不买一些玉器呢？"]]}]},{"name":"Unit 4 Helping in the community","words":[{"l":"f.ire/f.igh.t/er","p":"ˈf.aɪə/f.aɪ.t/ə","cn":"消防队员（只要求理解）","s":[["I would like to be a firefighter.","我想当一名消防员。"],["For the past three years he has been employed as a firefighter.","三年来他一直受雇当消防员。"],["Some 4,000 firefighters are battling the blaze.","约有四千名消防人员正在与大火搏斗。"]]},{"l":"wh.y","p":"w.aɪ","cn":"为什么（只要求理解）","s":[["Why must she interrupt?","她为什么偏要打断呢？"],["Let me explain why.","让我来解释为什么。"],["Why has the engine stopped?","发动机怎么停了？"]]},{"l":"d.r.i/v.er","p":"ˈd.r.aɪ/v.ə","cn":"司机","s":[["My dad is a lorry driver.","我的父亲是个卡车司机。"],["The driver suffered head injuries.","司机头部受伤。"],["Boston drivers love the tunnel.","波士顿的司机们喜欢那条隧道。"]]},{"l":"c.l.ea.n/er","p":"ˈk.l.iː.n/ə","cn":"清洁工","s":[["He was a window cleaner.","他是一名窗户清洁工。"],["Nuclear power is cleaner than coal.","核能比煤更清洁。"],["These cleaners could fulfill all customers' demands.","这些清洁剂可以满足所有顾客的需求。"]]},{"l":"c.oo.k","p":"k.ʊ.k","cn":"厨师","s":[["Nothing beats home cooking.","什么也比不上家里做的好吃。"],["I find cooking very relaxing.","我发现烹饪非常令人放松。"],["They serve good French cooking.","他们供应美味的法国菜。"]]},{"l":"d.e/l.i.v/e.r/y w.or.k/er","p":"d.ɪ/ˈl.ɪ.v/ə.r/i ˈw.ɜː.k/ə","cn":"快递员","s":[]},{"l":"p.o/l.i.c.e o.f/f.i/c.er","p":"p.ə/ˈl.iː.s.- ˈɒ.f/-.ɪ/s.ə","cn":"警察；警员","s":[["The police officer radioed for help.","警察用无线电呼救。"],["Just then Monroe police officers arrived.","就在这时，门罗警察赶到了。"],["Police officers must be prepared for the unexpected.","警察必须随时准备应付意外事件。"]]},{"l":"a l.o.t o.f","p":"ə l.ɒ.t ə.v","cn":"大量；许多（只要求理解）","s":[["She earns a lot of money.","她挣很多钱。"],["Quite a lot of South Americans study here.","相当多的南美洲人在这里学习。"],["This type of heater uses a lot of electricity.","这种加热器耗电量很大。"]]},{"l":"n.ow","p":"n.aʊ","cn":"现在（只要求理解）","s":[["Everything's A-OK now.","现在一切都妥帖了。"],["What's the score now?","现在比分是多少？"],["It's too late now, anyway.","反正现在已经太迟了。"]]},{"l":"m.a.k.e th.e b.e.d","p":"m.eɪ.k.- ð.ə b.e.d","cn":"铺床（只要求理解）","s":[]},{"l":"o.l.d","p":"əʊ.l.d","cn":"过去的；年纪大的；老的","s":[["I'm fourteen years old.","我14岁。"],["How old is she?","她有多大了？"],["He's a nice old fellow.","他这位老兄人不错。"]]},{"l":"t.e.ll","p":"t.e.l","cn":"讲述；告诉","s":[["Tell me what really happened.","告诉我究竟发生了什么事。"],["Tell me where you live.","告诉我你住哪儿？"],["Please tell the court what happened.","请向法庭陈述事情的经过。"]]},{"l":"e.v.e/r.y/o.n.e","p":"ˈe.v.-/r.i/wʌ.n.-","cn":"每人（只要求理解）","s":[["Everyone arrived nice and early.","大家都早早地到了。"],["Not everyone approves of the festival.","不是每个人都喜欢这个节日。"],["Everyone in the group exchanged email addresses.","所有的组员都相互交换了电子邮件地址。"]]},{"l":"M.s","p":"m.ɪz","cn":"（用于女子的姓氏或姓名前，不指明婚否）女士（只要求理解）","s":[["Ms Green has asked me to deputize for her at the meeting.","格林女士请我代表她出席会议。"],["Ms. Carey appeared to blame her breakdown on EMI's punishing work schedule.","凯丽女士看来是将自己的崩溃归咎于百代公司紧张的工作安排。"],["Ms. Nova is the proud possessor of a truly incredible voice.","诺娃女士引以为豪是她拥有一副美妙动听的嗓音。"]]}]},{"name":"Unit 5 The weather and us","words":[{"l":"s.p.ea.k","p":"s.p.iː.k","cn":"说话；发言（只要求理解）","s":[["She speaks excellent French.","她法语说得好极了。"],["He doesn't speak English.","他不说英语。"],["She can speak Spanish.","她会讲西班牙语。"]]},{"l":"w.ea.th/er","p":"ˈw.e.ð/ə","cn":"天气（只要求理解）","s":[["I like cold weather.","我喜欢寒冷的天气。"],["The weather gradually improved.","天气逐渐好转。"],["The weather is snowy here.","这里是下雪天。"]]},{"l":"s.u.n/n.y","p":"ˈs.ʌ.n/-.i","cn":"阳光充足的","s":[["It's a brilliantly sunny morning.","这是个阳光灿烂的早晨。"],["It was brilliantly sunny.","阳光明媚。"],["It's bound to be sunny again tomorrow.","明天肯定又是阳光灿烂。"]]},{"l":"h.o.t","p":"h.ɒ.t","cn":"热的","s":[["Her spelling isn't too hot.","她的拼写不太好。"],["It's very hot here in summer.","这里夏天很热。"],["It's hot out – very hot, very humid.","外面热烘烘的–非常热，非常潮湿。"]]},{"l":"b.a.d","p":"b.æ.d","cn":"令人不快的；坏的（只要求理解）","s":[["His spelling is very bad.","他的拼写能力很差。"],["It really isn't half bad, is it?","这的确很不错，对吗？"],["He's not such a bad old stick.","他老兄人不算坏。"]]},{"l":"c.o.l.d","p":"k.əʊ.l.d","cn":"冷的","s":[["It's freezing cold outside.","外面极为寒冷。"],["I like cold weather.","我喜欢寒冷的天气。"],["His final request stopped her cold.","他最后的请求突然阻止了她。"]]},{"l":"w.i.n.d/y","p":"ˈw.ɪ.n.d/i","cn":"多风的","s":[["When it's windy, I fly a kite.","当天刮风的时候，我放风筝。"],["It was windy and Jake felt cold.","风很大，杰克觉得很冷。"]]},{"l":"c.l.ou.d/y","p":"ˈk.l.aʊ.d/i","cn":"多云的","s":[["Tonight will be cloudy.","今天夜间多云。"],["It's cloudy this afternoon.","今天下午多云。"],["It's cloudy in Singapore.","新加坡多云。"]]},{"l":"r.ai.n/y","p":"ˈr.eɪ.n/i","cn":"阴雨的","s":[["Tomorrow will be rainy.","明天将下雨。"],["They take a walk on rainy day.","他们在下雨天散步。"],["It was rainy yesterday.","昨天是雨天。"]]},{"l":"s.n.ow/y","p":"ˈs.n.əʊ/i","cn":"多雪的","s":[["The weather is snowy here.","这里是下雪天。"],["I hate the snowy winters.","我讨厌下雪的冬日。"],["We strode across the snowy fields.","我们大步流星地穿过雪封的旷野。"]]},{"l":"c.oo.l","p":"k.uː.l","cn":"凉爽的","s":[["That's a cool hat.","那是一顶很酷的帽子。"],["Glass contracts as it cools.","玻璃遇冷收缩。"],["Thank goodness it's cool in here.","谢天谢地，这里很凉爽。"]]},{"l":"w.ar.m","p":"w.ɔː.m","cn":"温暖的","s":[["I warmed to her immediately.","我立即喜欢上了她。"],["The party soon warmed up.","聚会很快活跃起来。"],["I'll warm up some milk.","我来热些牛奶。"]]},{"l":"t.o/m.o.r/r.ow","p":"t.ə/ˈm.ɒ.r/-.əʊ","cn":"在明天（只要求理解）","s":[["Tomorrow will be rainy.","明天将下雨。"],["Snow is forecast for tomorrow.","预报明天有雪。"],["I'll see you tomorrow evening.","我明天晚上见你。"]]},{"l":"r.ai.n","p":"r.eɪ.n","cn":"下雨；雨（只要求理解）","s":[["The rain poured down.","雨瓢泼而下。"],["It's not actually raining now.","其实现在并没有下雨。"],["The rains come in September.","雨季九月份开始。"]]},{"l":"c.l.o.s.e.d","p":"k.l.əʊ.z.-.d","cn":"关闭的（只要求理解）","s":[["The door closed behind him.","他一出门，门就关上了。"],["He has a closed mind.","他思想僵化守旧。"],["The museum is closed on Mondays.","博物馆每逢星期一闭馆。"]]},{"l":"f.i.l.m","p":"f.ɪ.l.m","cn":"电影","s":[["The film festival takes place in October.","电影节将于十月举行。"],["The police had secretly filmed the conversations.","警察已秘密地把几次谈话拍摄下来。"],["The film has a Hollywood happy ending.","这部电影具有好莱坞式的美满结局。"]]},{"l":"i/d.ea","p":"aɪ/ˈd.ɪə","cn":"想法；主意（只要求理解）","s":[["This idea isn't new.","这主意不新鲜。"],["That's a super idea.","那是个超好的想法。"],["He's dead against the idea.","他坚决反对这个想法。"]]},{"l":"f.l.y","p":"f.l.aɪ","cn":"操纵（飞行器等）；飞","s":[["She brushed the fly away.","她挥手赶走了苍蝇。"],["I learned to fly in Vietnam.","我在越南学会了驾驶飞机。"],["A fly landed on his nose.","一只苍蝇落在他的鼻子上。"]]},{"l":"k.i.t.e","p":"k.aɪ.t.-","cn":"风筝","s":[["I wanted to fly a kite.","我想要去放风筝。"],["When it's windy, I fly a kite.","当天刮风的时候，我放风筝。"],["The koala likes to fly a kite.","无尾熊喜欢放风筝。"]]},{"l":"s.n.ow/m.a.n","p":"ˈs.n.əʊ/m.æ.n","cn":"雪人","s":[["We're making a snowman.","我们正在做一个雪人。"],["Let's draw a snowman.","咱们画一个雪人吧。"],["My snowman has gone.","我的雪人不见了。"]]},{"l":"f.u.n","p":"f.ʌ.n","cn":"享乐；乐趣（只要求理解）","s":[["Sailing is good fun.","帆船运动很有乐趣。"],["Time flies when you're having fun.","当你开心的时候，时光飞逝。"],["It's just a bit of harmless fun.","开个小玩笑罢了，并无恶意的。"]]},{"l":"th.eir","p":"ð.eə","cn":"他们的；她们的；它们的（只要求理解）","s":[["Their house is massive.","他们的房子大极了。"],["Children need their parents.","孩子们需要父母。"],["Someone's left their bag behind.","有人把包落下了。"]]},{"l":"s.w.i.m","p":"s.w.ɪ.m","cn":"游泳（只要求理解）","s":[["I managed to swim to safety.","我设法游到安全处。"],["I had a swim to cool down.","我游了泳，凉快凉快。"],["How many widths can you swim?","你在游泳池里横向能游几个来回？"]]},{"l":"S.y.d/n.ey","p":"ˈs.ɪ.d/n.i","cn":"悉尼（只要求理解）","s":[["He could have died after developing deep vein thrombosis during a flight to Sydney.","他在飞往悉尼的航班上引发成深部静脉血栓之后，差点送命。"]]}]},{"name":"Unit 6 Changing for the seasons","words":[{"l":"wh.o.s.e","p":"h.uː.z.-","cn":"谁的（只要求理解）","s":[["\"Whose is this?\"—\"It's mine.\"","“这是谁的？”—“是我的。”"],["I wonder whose this is.","我不知道这是谁的。"],["Whose car were they in?","他们坐在谁的车里？"]]},{"l":"s.w.ea.t/er","p":"ˈs.w.e.t/ə","cn":"毛衣","s":[["This sweater washes well.","这件套衫很耐洗。"],["This sweater has stretched.","这件毛衣给撑得变形了。"],["The fence snagged my sweater.","栅栏把我的毛衣挂住了。"]]},{"l":"s.o.ck","p":"s.ɒ.k","cn":"短袜","s":[["I had nothing on except for my socks.","我除了短袜什么都没穿。"],["Aunt Emilie darned old socks.","埃米莉阿姨把旧袜子补好了。"],["I am looking for matching socks.","我正在寻找匹配的袜子。"]]},{"l":"m.i.n.e","p":"m.aɪ.n.-","cn":"我的（只要求理解）","s":[["I'll bet we could find some at North Creek—in the mine.","我打赌我们能在小溪北边的矿井里面找到一些。"],["\"Whose is this?\"—\"It's mine.\"","“这是谁的？”—“是我的。”"],["His department will merge with mine.","他的部门将和我的合并。"]]},{"l":"w.ear","p":"w.eə","cn":"穿；戴（只要求理解）","s":[["I wear glasses for driving.","我开车时戴眼镜。"],["She usually wears long skirts.","她通常穿长裙。"],["She doesn't often wear heels.","她不常穿高跟鞋。"]]},{"l":"sh.ir.t","p":"ʃ.ɜː.t","cn":"衬衫","s":[["This shirt isn't big enough.","这件衬衣不够大。"],["What's your shirt made of?","你的衬衣是用什么做的？"],["These shirts are 100% pure cotton.","这些衬衫是100%的纯棉。"]]},{"l":"c.oa.t","p":"k.əʊ.t","cn":"大衣；外套","s":[["Here, let me take your coat.","来，我帮你拿大衣。"],["A button had come off my coat.","我的外套掉了一颗纽扣。"],["She had on a black coat with a fur collar.","她穿着一件有毛皮领子的黑色外套。"]]},{"l":"d.r.e.ss","p":"d.r.e.s","cn":"连衣裙","s":[["Kids love dressing up.","孩子们都喜欢装扮成别人玩儿。"],["She's always well-dressed.","她总是衣着讲究。"],["Don't get your dress dirty!","别把你的连衣裙弄脏了！"]]},{"l":"wh.i.ch","p":"w.ɪ.tʃ","cn":"哪一个；哪一些（只要求理解）","s":[["Which one's your favourite?","你最喜欢哪一个？"],["Which is their house?","哪座房子是他们的？"],["Which school do they attend?","他们上的是哪一所学校？"]]},{"l":"s.ea/s.o.n","p":"ˈs.iː/z.ə.n","cn":"季节（只要求理解）","s":[["Autumn is my favourite season.","秋季是我最喜欢的季节。"],["Hotels are cheaper out of season.","在淡季，旅馆要便宜些。"],["This could be the feelgood film of the season.","这可能是本季最佳令人愉悦电影。"]]},{"l":"w.i.n/t.er","p":"ˈw.ɪ.n/t.ə","cn":"冬天","s":[["I hate the snowy winters.","我讨厌下雪的冬日。"],["The lake freezes over in winter.","这个湖冬天全部封冻。"],["Swallows migrate south in winter.","燕子在冬天迁徙到南方。"]]},{"l":"s.n.ow","p":"s.n.əʊ","cn":"下雪；雪（只要求理解）","s":[["Snow covered the ground.","大雪覆盖了大地。"],["Snow is forecast for tomorrow.","预报明天有雪。"],["Snow soon blanketed the frozen ground.","冻土上很快就形成了一层厚厚的积雪。"]]},{"l":"g.e.t t.o/g.e.th/er","p":"ɡ.e.t t.ə/ˈɡ.e.ð/ə","cn":"聚会（只要求理解）","s":[]},{"l":"s.p.r.i.ng","p":"s.p.r.ɪ.ŋ","cn":"春天","s":[["This verse describes three signs of spring.","这节诗描述了春天的3个征兆。"],["I love Rome, especially in the spring.","我喜爱罗马，尤其是春天的罗马。"],["Spring came late this year.","今年春天来得晚。"]]},{"l":"s.u.m/m.er","p":"ˈs.ʌ.m/-.ə","cn":"夏天","s":[["I really love summer evenings.","我非常喜欢夏天的夜晚。"],["It's very hot here in summer.","这里夏天很热。"],["I always wake early in the summer.","我夏天总是醒得早。"]]},{"l":"au/t.u.m.n","p":"ˈɔː/t.ə.m.-","cn":"秋天","s":[["Leaves change colour in autumn.","树叶在秋天改变颜色。"],["Every autumn I go to the county fair.","每个秋季我都去县里的集市。"],["I love the reds and golds of autumn.","我喜欢秋天的火红色和金黄色。"]]},{"l":"T/-.sh.ir.t","p":"ˈtiː/-.ʃ.ɜː.t","cn":"T恤衫（只要求理解）","s":[["Unit sales of T-shirts increased 6%.","T恤衫的单位销售增加了6%。"],["Tight fitting T-shirts are making a comeback.","紧身短袖圆领T恤衫再度流行起来。"],["He was wearing a T-shirt and shorts.","他穿着T恤衫和短裤。"]]},{"l":"f.a.ll","p":"f.ɔː.l","cn":"落下（只要求理解）","s":[["Watch out for falling rocks!","小心落石！"],["Aren't you afraid (that) you'll fall?","你不怕会跌倒吗？"],["Out of over 400 staff there are just 7 that fall into this category.","400多个职员中只有7人属于这一类。"]]},{"l":"l.ea.f","p":"l.iː.f","cn":"（复数leaves）叶（只要求理解）","s":[["The ant is carrying a leaf.","蚂蚁在搬运叶子。"],["The trees are coming into leaf.","树开始长叶子了。"],["The trees are just coming into leaf.","树木正好在长叶子。"]]},{"l":"g.l.o.v.e","p":"ɡ.l.ʌ.v.-","cn":"手套（只要求理解）","s":[["There is a hole in her glove.","她手套上有个洞。"],["She bent down to pick up her glove.","她俯身去捡手套。"],["He stuck his gloves in his pocket.","他把手套塞进了口袋里。"]]},{"l":"th.e.n","p":"ð.e.n","cn":"然后；那时（只要求理解）","s":[["Then a dinosaur appeared.","然后一只恐龙出现了。"],["Then a clown appeared.","然后小丑出场了。"],["That's definite then, is it?","那么，那是确切的了，是吗？"]]}]}]},{"id":"pep4b","name":"人教 四年级下册（新教材）","units":[{"name":"Unit 1 Class rules","words":[{"l":"s.o.r/r.y","p":"ˈs.ɒ.r/-.i","cn":"对不起（只要求理解）","s":[["Sorry, the answer's no.","对不起，回答是不。"],["Sorry—I don't quite follow.","对不起，我不太听懂你的话。"],["I'm sorry, I haven't a clue.","对不起，我一无所知。"]]},{"l":"h.u.r/r.y u.p","p":"ˈh.ʌ.r/-.i ʌ.p","cn":"快点；赶快（只要求理解）","s":[["Hurry up or else you'll be late.","快点，否则你就要迟到了。"],["Oh you're so slow; come on, hurry up!","哎哟，你可真慢；加把劲，快点！"],["I wish the bus would hurry up and come.","我希望公共汽车能快点来。"]]},{"l":"l.a.t.e","p":"l.eɪ.t.-","cn":"迟到；迟发生","s":[["Come along! We're late.","快点！我们迟到了。"],["They're nearly always late.","他们几乎总是迟到。"],["It's too late now, anyway.","反正现在已经太迟了。"]]},{"l":"c.l.a.ss","p":"k.l.ɑː.s","cn":"课；课程；班；班级（只要求理解）","s":[["He's always cutting class.","他总是旷课。"],["First class costs more.","第一类邮件邮资较高。"],["It's our second English class.","这是我们第二节英语课。"]]},{"l":"r.ea.d/y","p":"ˈr.e.d/i","cn":"准备好（只要求理解）","s":[["Cameras ready? OK, shoot!","摄影机准备好了吗？好，开拍！"],["She's always ready with advice.","她总是乐于提出建议。"],["I feel ready to drop.","我感到快累垮了。"]]},{"l":"r.u.l.e","p":"r.uː.l.-","cn":"规则；规章（只要求理解）","s":[["There are no absolute rules.","没有绝对的准则。"],["The deal may be ruled illegal.","这笔交易可能会被判定为非法。"],["The Supreme Court ruled in Fitzgerald's favour.","最高法院判定菲茨杰拉德胜诉。"]]},{"l":"c.l.a.ss/r.oo.m","p":"ˈk.l.ɑː.s/r.uː.m","cn":"教室","s":[["She'd sent him outside the classroom.","她叫他到教室外面去。"],["Discipline in the classroom is very slack.","班里纪律十分松懈。"],["The classroom teacher must be sensitive to a child's needs.","课堂教师必须理解孩子的需求。"]]},{"l":"t.ur.n o.ff","p":"t.ɜː.n ɒ.f","cn":"关掉","s":[["Turn off the shower.","关掉淋浴。"],["Is this where we turn off?","这儿是我们换道的地方吗？"],["If God turns off one faucet, he can turn on another.","如果上帝关上一个水龙头，他能开启另一个。"]]},{"l":"l.igh.t","p":"l.aɪ.t","cn":"灯；光","s":[["Glass and water both bend light.","玻璃和水都折光。"],["We seem to be light on fuel.","我们好像燃料不多了。"],["New evidence has recently come to light.","新的证据最近已披露出来。"]]},{"l":"b.l.a.ck/b.oar.d","p":"ˈb.l.æ.k/b.ɔː.d","cn":"黑板（只要求理解）","s":[["In front of the blackboard is the teacher's desk.","黑板前面是老师的讲桌。"],["Let's change round , so that I can see the blackboard clearly.","让我们换一下位置，这样我可以看清黑板。"],["He chalked the message on the blackboard.","他用粉笔把这条消息写在黑板上。"]]},{"l":"d.e.s.k","p":"d.e.s.k","cn":"书桌；办公桌","s":[["The teacher's desk is big.","教师课桌是大的。"],["There are many books on my teacher's desk.","我的老师桌子上有很多书。"],["In front of the blackboard is the teacher's desk.","黑板前面是老师的讲桌。"]]},{"l":"ch.air","p":"tʃ.eə","cn":"椅子","s":[["Who's chairing the meeting?","谁主持这次会议？"],["I fold up the chairs.","我把椅子折起来。"],["She jumped down off the chair.","她跳下椅子。"]]},{"l":"t.i.d/y","p":"ˈt.aɪ.d/i","cn":"整洁的；整齐的；使整洁；整理（只要求理解）","s":[["It must have cost a tidy sum.","这准花了相当大的一笔钱。"],["He lives alone in a suspiciously tidy apartment.","他独自一人住在一套整洁得出奇的公寓里。"],["They sat in her neat and tidy kitchen.","他们坐在她那干净整齐的厨房里。"]]},{"l":"m.u/s.i.c","p":"ˈm.juː/z.ɪ.k","cn":"音乐（只要求理解）","s":[["Anyone can appreciate our music.","任何人都能欣赏我们的音乐。"],["His music is sheer delight.","他的音乐是纯粹的快乐。"],["Music filled the night air.","夜空荡漾着乐声。"]]},{"l":"d.oor","p":"d.ɔː","cn":"门","s":[["The door is marked \"Private.\"","门上写着“闲人免进”。"],["The door closed behind him.","他一出门，门就关上了。"],["Who's sitting nearest the door?","谁坐在离门最近的地方？"]]},{"l":"w.i.n/d.ow","p":"ˈw.ɪ.n/d.əʊ","cn":"窗","s":[["Stay away from windows.","远离窗户。"],["Windows are usually sealed off.","窗户通常是封闭的。"],["I climbed through the window.","我从窗口爬了出来。"]]},{"l":"f.a.n","p":"f.æ.n","cn":"风扇","s":[["His fans called goldfish.","他的粉丝叫金鱼。"],["I'm a big fan of hers.","我是她的狂热追随者。"],["The band's fans are getting younger.","这支乐队的歌迷越来越年轻了。"]]},{"l":"wh.e.n","p":"w.e.n","cn":"当……时；什么时候（只要求理解）","s":[["When is your next appointment?","你下一次预约时间是什么时候？"],["When does the concert begin?","音乐会什么时间开始？"],["People eat when they're depressed.","人们会在沮丧时吃东西。"]]},{"l":"u.n/d.er/s.t.a.n.d","p":"ˌʌ.n/d.ə/ˈs.t.æ.n.d","cn":"懂；理解（只要求理解）","s":[["Can you understand French?","你懂法语吗？"],["Few people understand the difference.","很少有人了解这个差别。"],["\"I quite understand,\" he replied.","“我很理解”，他回答道。"]]},{"l":"w.a.ll","p":"w.ɔː.l","cn":"墙；壁（只要求理解）","s":[["She leaned against the wall.","她倚靠着墙。"],["It is fixed on the wall.","它是固定在墙上的。"],["The boys climbed over the wall.","那些男孩翻过了那堵墙。"]]},{"l":"n.ew.s/p.a/p.er","p":"ˈn.juː.z/p.eɪ/p.ə","cn":"报纸（只要求理解）","s":[["May I borrow your newspaper?","把你的报纸借我看行吗？"],["The newspaper is distributed free.","这份报纸免费发送。"],["Give us the newspaper, will you?","把报纸给我好吗？"]]},{"l":"h.a.n.d ou.t","p":"h.æ.n.d aʊ.t","cn":"分发（只要求理解）","s":[["His job is to hand out food and clothes.","他的工作是分发食物和衣服。"],["Could you help me hand out these papers, please?","你能帮我分发这些文件吗？"],["One of my jobs was to hand out the prizes.","我的工作之一是分发奖品。"]]},{"l":"w.or.k/b.oo.k","p":"ˈw.ɜː.k/b.ʊ.k","cn":"练习册；作业本（只要求理解）","s":[]}]},{"name":"Unit 2 Family rules","words":[{"l":"w.a.tch","p":"w.ɒ.tʃ","cn":"看（只要求理解）","s":[["Hey, watch where you're going!","嘿，瞧着点路！"],["My watch keeps going wrong.","我的表不断地出毛病。"],["They watch too much TV.","他们看电视看得太多了。"]]},{"l":"T/V","p":"ˌtiː/ˈviː","cn":"电视（只要求理解）","s":[["He directed various TV shows.","他导演过各种电视节目。"],["She regularly appears on TV.","她经常在电视上露面。"],["They watch too much TV.","他们看电视看得太多了。"]]},{"l":"h.o.m.e/w.or.k","p":"ˈh.əʊ.m.-/w.ɜː.k","cn":"家庭作业","s":[["I hate homework. Specially history.","我讨厌家庭作业，特别是历史。"],["How much homework do you get?","你有多少家庭作业？"],["He let us off homework today.","他今天免了我们的家庭作业。"]]},{"l":"f.ir.s.t","p":"f.ɜː.s.t","cn":"首先；首次；第一（只要求理解）","s":[["First class costs more.","第一类邮件邮资较高。"],["We're expecting our first baby.","我们要生第一个孩子了。"],["Let's talk about decision making first.","让我们首先谈谈决策制定。"]]},{"l":"w.e.t","p":"w.e.t","cn":"湿的；未干的（只要求理解）","s"
